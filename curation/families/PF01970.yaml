- graph_id: pputida-joint-tpa-conversion-2013
  title: Joint transport and catabolic expression lowers extracellular TPA in resting cells
  scope: Pseudomonas putida PpY1100 expressing the complete pJCBAtG combination, not TpiA alone and not a growth rescue.
  context: Hosaka2013 Figure7; tphCII plus tpiBA plus tphA2IIA3IIBIIA1II, induced10h with1mM m-toluate at30C. Washed resting cellsOD20,1mM TPA,50mM Tris-HClpH7.5,30C shaking. Methods specify60min incubation but the original plotted endpoint is48min. HPLC,three independent experiments,mean plus SD.
  family_mapping: The E6 TpiA component is BAN66716.1,503aa,archived PF01970 20-441. The construct additionally contains TpiB,TphC and TPA-catabolic enzymes that are not assigned to PF01970. Donor E6 and PpY1100 host remain distinct.
  scope_status: PHENOTYPIC
  limitations: Joint-system effect only. No direct TpiA-catalyzed TPA degradation, TpiA-alone sufficiency or restored growth. Control constructs omit tpiBA,tphC or catabolic genes. Full plasmid and supplementary extract-assay figures remain unverified; the source text reports extract activity when transport genes are missing.
  nodes:
  - {node_id: joint-construct, label: pJCBAtG transport-plus-catabolism combination in resting PpY1100 cells, node_type: PERTURBATION}
  - {node_id: extracellular-tpa, label: Remaining extracellular TPA measured by HPLC, node_type: STATE}
  edges:
  - edge_id: joint-system-tpa-depletion
    subject: joint-construct
    predicate: decreases
    object: extracellular-tpa
    mechanism: Only the complete combination substantially depletes TPA relative to incomplete-construct controls. Uptake and intracellular enzymatic conversion contribute jointly to this indirect transporter readout.
    directness: INDIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence: [{reference: 'PMID:23913423', source_url: 'https://doi.org/10.1128/AEM.01600-13', snippet: Only when both, explanation: 'Original Figure7 circles decline to roughly0.35mM by48min while control traces remain near0.9mM; Methods specify HPLC and resting cells.', cache_path: evidence/PF01970/hosaka-2013-cellular-effects.txt, cache_sha256: 50018f425a88bd7f3f9eceb347fbc57e7d3887790b8f6f13d39dc83e2e3198b5}]
