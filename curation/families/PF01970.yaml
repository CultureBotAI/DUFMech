- graph_id: ecoli-tctcba-cation-growth-2009
  title: Heterologous tctCBA supports increased growth with calcium or magnesium
  scope: E. coli carrying the whole C. glutamicum tctCBA operon versus empty pXMJ19; Figure2 and Results name MG1655 but culture Methods name DH5alpha for the cation assay.
  context: Brocker2009 Figure2,50ml M9 in500ml flasks,50mM citrate plus1g/l Casamino Acids and5mM CaCl2 or MgCl2,37C120rpm. Representative curves from three independent experiments. Compare vector and operon under the same cation condition.
