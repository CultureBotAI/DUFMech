- graph_id: comamonas-tpia-insertion-and-rescue-2013
  title: E6 tpiA insertion changes tracer readouts and substrate-specific growth timing
  scope: EME019 full tpiA insertion versus E6 WT, with pJBtpiA complementation for the TPA tracer assay. Separate carbon-source cultures are not a single causal chain.
  context: Hosaka2013 Figures4/5. Growth in Wx10mM TPA,IPA,OPA,PCA or citrate,30C,initialOD0.1. Washed-cell assays use20uM14C-TPA or14C-citrate,OD2,Tris-MESpH7.5,30C after corresponding induction with succinate;10-180s sampling. Three independent experiments,mean plus SD.
  family_mapping: AB822591.1 tpiA CDS2015-3526 encodes E6 BAN66716.1,503aa; UniParc UPI0001DA6AF2 retains PF01970 20-441. Historical S6BBY9 is inactive/deleted as redundant. TpiA is a TctA paralog, not triosephosphate isomerase; TpiB and binding proteins are separate partners.
  taxon: NCBITaxon:364029
  scope_status: PHENOTYPIC
  limitations: Insertion polarity and protein abundance are unresolved. Uptake means retained radiolabel, not direct transmembrane flux. IPA/OPA/PCA uptake was not measured here. Delayed growth is not abolished growth or reduced final yield. Main text reports partial growth rescue in uninspected FigureS3; no S3 edge is added. The EME019 residual citrate signal versus near-loss in EME018 has no resolved molecular explanation.
