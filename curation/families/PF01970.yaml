  title: Whole tctCBA deletion has opposite growth effects with magnesium and strontium
  scope: C. glutamicum ATCC13032 in-frame delta-tctCBA versus WT, with intact CitH; the perturbation removes all three transporter components.
  context: Brocker2009 Figure4A/C,CGXII50mM citrate sole carbon and energy plus5mM MgCl2 or SrCl2,30C120rpm. Pregrowth with50mM glucose and50mM citrate. Representative curves from three independent experiments,not plotted means or formal effect estimates.
