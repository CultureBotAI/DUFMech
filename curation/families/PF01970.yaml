- discussion_id: pf01970-causal-context-coverage
  prompt: Extend mapped TctA-family experiments while resolving constructs and transport mechanisms.
  kind: CURATION_TODO
  status: OPEN
  rationale: Two studies support member-specific cellular effects but do not establish isolated-domain chemistry, universal substrate specificity or ion stoichiometry.
  evidence:
  - {reference: 'PMID:23913423', supports: SUPPORT, evidence_source: primary_publication, explanation: 'Original Figures3/4/5/7 distinguish two E6 paralogs, growth delays, tracer accumulation and joint-system conversion. Supplementary construct details remain unavailable.'}
  - {reference: 'PMID:19376865', supports: SUPPORT, evidence_source: primary_publication, explanation: 'Original Figures2/4 and Table3 distinguish cation-dependent operon phenotypes and a regulator-deletion transcript response; Methods and Figure2 disagree on the E. coli strain.'}
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: Recover the Hosaka supplement and exact final plasmids, assess insertion polarity, and reconcile Brocker DH5alpha versus MG1655. Extend Salmonella classical transport and G109S studies, Bordetella bct systems, Pseudomonas redundancy and Gillisella tartrate contexts using exact member mapping. The2014 activated-sludge TctA_ar study inspected here is modeling rather than demonstrated citrate transport; resolve its1311bp/463aa discrepancy before sequence-level interpretation. Archived Pfam coordinates and inactive UniProt IDs are not new current profile scans. All earlier corpus follow-ups remain open.
