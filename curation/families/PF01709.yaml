  title: Homozygous mouse Taco1 I164N lowers mitochondrial COXI pulse labelling
  scope: Richman 2016 Figure2D, adult male mice on a C57BL/6J background; liver and heart mitochondria
    are separate measured preparations.
  context: Homozygous ENU T491A/I164N, backcrossed8-10generations,30weeks, versus age/littermate-matched
    WT. Methods specify500ug mitochondria,150uCi35S-methionine,60min37C;50ug protein per SDS-PAGE lane
    and Coomassie loading check. Caption/Results mention methionine plus cysteine whereas Methods specify
    methionine alone.
  family_mapping: Mouse Q8K0Z7/NP_081622.1 is294aa; I164 is inside current PF01709 134-293. Whole-organism
    point mutation and mitochondrial assays do not isolate the domain. Sequence and Results specify Ile164
    despite a Leu164 typo in Figure5's caption.
