- graph_id: mouse-taco1-probeb-binding
  title: Mature mouse TACO1 preparation forms a complex with mt-Co1 probe B
  scope: Richman 2016 Figure3A, purified recombinant mouse TACO1 aa27-294, not an isolated PF01709 fragment
    or a mitochondrial translation reaction.
  context: Joint protein and ATTO680-labelled mt-Co1 probe B, mouse mtDNA5446-5632; RNA100ng/ul, protein
    equimolar through eightfold excess,30min room temperature,10mM HEPES pH8,1mM EDTA,50mM KCl,2mM DTT,0.1mg/ml
    BSA,0.02% Tween20;10% PAGE in TAE.
  family_mapping: NP_081622.1 exactly matches Q8K0Z7,294aa, with current PF01709 134-293. The aa27-294
    His/GST fusion was expressed in E. coli ER2566 and nickel/gel-filtration purified. Tag cleavage is
    described for crystallization only, not this binding preparation.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:10090
  limitations: DIRECT denotes the joint biochemical preparation-to-complex observation. No tag-only control,
    absolute affinity or exclusive transcript specificity is established here. Whole mature TACO1 includes
    an N-terminal domain outside PF01709; binding does not by itself prove translation activation.
