- graph_id: human-taco1-proline-window-occupancy
  title: Human TACO1 perturbations alter footprints in proline-rich windows
  scope: Brischigliaro 2024 Figure2D, whole mitochondrial transcriptome profiling of HEK293T WT, TACO1
    knockout and reconstituted cells; two-Pro and three-Pro bins are separate readouts.
  context: RNaseI footprints from55S monosomes,25-45nt retained reads aligned to mitochondrial transcripts;
    codon counts normalized within transcript, sliding5-aa windows grouped by proline count, summed occupancies
    then normalized to WT. Cells harvested at80%confluence. Reference Q9BSH4 contains PF01709 136-296.
  family_mapping: Whole human TACO1 exon1 knockout and ORF reconstitution, not a domain deletion. Q9BSH4/NP_057444.2
    is the297-aa reference; historical clone sequence and precise per-panel rescue promoter/tag remain
    unverified.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:9606
  limitations: INDIRECT effects on normalized footprint occupancy, not measured transit times or absolute
    ribosome numbers. Two prolines in five residues need not be adjacent. No displayed replicate dispersion
    is claimed. The three-Pro rescue remains above WT. Methods15-18nt versus Results12nt P-site offsets
    are unresolved; raw reads were not reprocessed. Some PP motifs do not stall and some non-Pro-rich
    sites do; no universal motif rule or collision-to-cleavage chain is asserted.
