- graph_id: human-taco1-knockout-rescue-pulse
  title: Human TACO1 knockout and rescue alter COX1 and COX3 pulse products
  scope: Brischigliaro 2024 Figure1C-D, HEK293T WT, TACO1 exon1 CRISPR knockout plus empty vector, and
    TACO1-reconstituted knockout cells.
  context: Cells grown at37C/5%CO2 in supplemented high-glucose DMEM;100uCi35S-methionine for30min after
    methionine-free preincubation with emetine blocking cytosolic translation,17.5% SDS-PAGE/autoradiography,
