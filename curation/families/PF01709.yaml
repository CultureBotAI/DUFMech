discussions:
- discussion_id: taco1-translation-not-transcription-and-domain-scope
  prompt: Correct the mammalian interpretation while preserving imported source identity and domain boundaries.
  kind: CURATION_TODO
  status: OPEN
  rationale: The frozen description says mammalian TACO1 activates COX1 transcription. Inspected mouse
    and human experiments concern translation; the2024 profiling evidence further qualifies older initiation
    models. Current PF01709 covers the second/third domains, not all of mature TACO1 or historical DUF28.
  evidence:
  - reference: PMID:27319982
    supports: PARTIAL
    evidence_source: inspected_primary_methods_and_figures
    explanation: Mouse RNA-binding and I164N translation effects are supported, with two binding-mutation
      groups outside PF01709 and one inside; no isolated-domain sufficiency.
  - reference: PMID:39036954
    supports: PARTIAL
    evidence_source: inspected_primary_methods_figures_and_supplement
    explanation: Human KO/rescue pulse products and proline-window occupancy support a translation role.
      Occupancy is not a kinetic constant, and neither all PP motifs nor every family member has the same
      effect.
  notes: Keep the frozen description bytes unchanged. Resolve per-panel human rescue sequence/promoter/tag,
    exact CRISPR lesions,2016 pulse isotope discrepancy and2024 emetine/P-site-offset details. Quantitative
    RNA affinities, mutation-specific folding and isolated-domain tests remain open. Independent source
    annotation correction belongs in a separate authorized source-update workflow.
  posed_by: Codex
  posed_date: '2026-10-11'
