    concentration is substituted.
  family_mapping: Human reference Q9BSH4/NP_057444.2,297aa, has PF01709 136-296. CRISPR targets exon1
    of the whole gene. OriGene ORF rescue is labelled TACO1, distinct from FLAG/OE conditions; complete
    historical clone sequence, exact lesions and per-panel promoter/tag specification remain unverified.
