    family_mapping: DevR Q07765 sequence version 1 equals AAA16134.1, ABF86719.1 and WP_011557181.1; historical MXAN_7262, current MXAN_RS35145/cas7i. PF01905 is 19-176 within 302 aa, provider score 0.00022; not a strong full-length match or isolated-domain perturbation.
