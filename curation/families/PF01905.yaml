  - graph_id: csa2-cas5a-guide-dependent-ssdna-binding-2011
    title: Guide addition and target-strand replacement alter protein-bound ssDNA
    scope: Lintner2011 Figure 3C; recombinant Csa2/Cas5a with crRNA-A1 and the named Target-A1 oligonucleotides.
    context: Radiolabeled Target-A1f or reverse-complement Target-A1r under displayed protein titrations; general binding Methods use 55 C for 10 min. Exact Figure 3C protein and guide doses were not established beyond the general Methods and displayed series.
    family_mapping: Joint preparation contains Q97Y91 Csa2, PF01905 5-273 within 321 aa, with Cas5a. Protein-bound DNA is not an isolated Csa2 catalytic measurement.
