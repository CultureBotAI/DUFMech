  - graph_id: csa2-h160a-crrna-binding-2011
    title: H160A reduces but does not abolish Csa2 crRNA gel shift
    scope: Lintner2011 Figure 4E; H160A versus WT Csa2 preparations.
    context: Displayed protein series 0.25, 0.5, 1, 2 and 3 uM in the crRNA-A1 binding assay; general Methods use 100 nM RNA and 55 C for 10 min.
    family_mapping: Native H160 in Q97Y91/AAK41675.1 lies within PF01905 5-273. PDB 3PS0 entity equals MHHHHHH plus the 321-aa reference; author H160 is resolved in chains A/C and disordered in B/D. The whole protein was tested, not the isolated domain.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:273057
    limitations: Residual binding remains at higher doses. No mutant folding measurement, exact historical clone sequence, fitted affinity change, direct H160-RNA contact or catalytic proton transfer was established. An RNA-free crystal is not a bound-RNA structure.
