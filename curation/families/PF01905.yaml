    taxon: NCBITaxon:273057
    limitations: The slow protein-bound species is distinct from the free RNA-DNA heteroduplex. These results do not establish dsDNA targeting, DNA cleavage, cellular immunity or universal PAM independence; the PAM statement is data not shown. Different perturbations share an endpoint but are not a temporal reaction chain.
