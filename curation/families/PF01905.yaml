    taxon: NCBITaxon:273057
    limitations: Fitted Kd 1.38 +/- 0.14 uM belongs to the Cas5/Cas7 preparation, not Cas7 alone. The +/- value is curve-fit error; plotted bars are SEM of triplicates with unspecified replicate independence. Different probe and temperature preclude a direct quantitative comparison with the 2011 EMSA. Supplement Table S1 was not inspected.
