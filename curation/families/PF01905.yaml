    title: Cas5/Cas7 titration increases fluorescent crRNA anisotropy
    scope: Reeks2013 Figure 2A; recombinant Sso1441/Sso1442 preparation.
    context: 20 nM fluorescent P1 CRISPR A spacer-26 crRNA, 20 mM Tris pH 7.5, 150 mM NaCl, 5% glycerol, 1 mM EDTA, room temperature; excitation/emission 490/535 nm. General titration range 0.04-11 uM, displayed Figure 2A axis about 8 uM; incubation time not established.
    family_mapping: Sso1442 Cas7/Csa2 Q97Y91 is the PF01905 member, match 5-273; Sso1441 Cas5 is a joint partner. P2 protein reference, P1 probe and P1 cellular co-IP context must not be conflated.
