        subject: d171n-in-proteoliposomes
        predicate: decreases
        object: calcium-influx-rate
        mechanism: D171N has markedly reduced influx relative to WT at each tested pH in the same Figure 5C comparison. The endpoint establishes a substitution effect without resolving whether altered ion recognition, gating, folding or incorporation explains the loss.
        directness: DIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:33208533
            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7720206/
            snippet: largely impaired within the pH range studied
            explanation: Figure 5C compares WT and D171N at pH 6/7/8. The distinct D171N-10/184 DEER experiment and earlier D171E substitution are not used as interchangeable transport constructs or observed protonation events.
