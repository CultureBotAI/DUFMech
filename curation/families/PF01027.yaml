        object: calcium-influx-rate
        mechanism: Under externally supplied calcium, WT proteoliposomes show lower influx at pH 7 and 6 than at pH 8. This is a condition-dependent transport effect, not proof that a particular residue senses protons or that the same optimum holds in other lipids.
