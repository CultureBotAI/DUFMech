- graph_id: thermotoga-tm1643-oxidative-inhibition-2003
  title: L-malate and ammonium reduce TM1643 oxidative activity
  scope: Purified full-length TM1643 oxidative L-aspartate dehydrogenase assays; inhibitors tested separately.
  context: Yang2003 Characterization Results reports competitive inhibition by L-malate and ammonium with Ki4.02+/-0.48mM and32.5+/-4.9mM respectively. General oxidative assay conditions are70C/pH9.8; inhibitor-specific donor assignment and complete assay matrices are not supplied in the inspected passage.
  family_mapping: Intact Q9X1X6/TM1643 reference contains PF01958 121-234 and PF03447 41-106; inhibitor effects are not assigned to an isolated domain or residue.
  taxon: NCBITaxon:243274
  scope_status: MECHANISTIC
  limitations: Purified-enzyme rate effects support biochemical inhibition, but no binding-site occupancy, inhibitor plot, counterion control or cellular effect was inspected. Competitive classification is the authors' reported kinetic interpretation. Ammonium has a different role in the reverse assay; these graphs do not form a feedback cycle.
