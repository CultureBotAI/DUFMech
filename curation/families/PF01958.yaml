- graph_id: thermotoga-tm1643-oxidative-redox-2003
  title: TM1643 reduces NAD or NADP in separate L-aspartate assays
  scope: Purified full-length Thermotoga maritima TM1643 with an N-terminal His6 tag, expressed in E. coli BL21(DE3); not an isolated C-terminal domain.
  context: Yang2003 Enzymatic Studies, Figure5A-C/legend and TableII; 70C, 50mM diethanolamine pH9.8, 5mM L-Asp and 1mM NAD+ or NADP+ for the individual-amino-acid assay. Kinetic substrate concentrations are varied separately; A340 increase is the measured redox readout.
  family_mapping: Q9X1X6 v1 is the 241-aa MSB8 nadX/TM_1643 reference; PF01958 121-234 and PF03447 41-106. Paper structural boundaries 113-241 and 1-105 differ from current Pfam hits. Historical tagged construct sequence was not independently reconstructed.
  taxon: NCBITaxon:243274
  scope_status: MECHANISTIC
  limitations: No activity was reported with D-Asp, L-Glu or Asn in these tests. No direct identification of the immediate iminoaspartate product, isolated-domain sufficiency or cellular flux follows. Figure5 text/legend and TableII were read but original plots were not visually inspected. Replicate counts and primary traces remain unreviewed.
