  - discussion_id: af2212-construct-and-domain-scope
    prompt: Reconcile AF2212 profile intervals and deposition metadata before domain-specific causal interpretation.
    kind: CURATION_TODO
    status: OPEN
    rationale: O28071 sequence1 is61aa from Archaeoglobus fulgidus VC-16, taxon224325. Current InterPro maps PF01954 to1-34, whereas RCSB's Pfam34.0 annotation maps1-57. Neither interval is an experimentally established active domain.
    evidence:
      - reference: https://www.ebi.ac.uk/interpro/api/entry/pfam/PF01954/protein/uniprot/O28071/
        supports: SUPPORT
        evidence_source: database
        explanation: The current member-specific match is1-34 inclusive. UniProt entry109 identifies AF_2212/vapB21 and describes a possible antitoxin with potential VapC21 partner; reviewed annotation is not experimental characterization.
      - reference: doi:10.2210/pdb2nwt/pdb
        supports: SUPPORT
        evidence_source: structural_deposition
        explanation: 2NWT entity1 is exactly O28071 residues1-61 plus LEHHHHHH at62-69, with chainsA/B. Twenty submitted NMR conformers are not biological replicates. The deposition's XL-10 gene-source strain field is not reconciled with the Archaeoglobus reference strain. The structure does not test toxin neutralization or a requirement for dimerization.
      - reference: https://bmrb.io/data_library/summary/index.php?bmrbId=7362
        supports: PARTIAL
        evidence_source: structural_deposition
        explanation: BMRB7362 lists5mMNaCl in the sample but100mM ionic strength in conditions; PDB reports100mMNaCl. These discrepancies remain unresolved. pH5.5 and298K describe an NMR sample, not a functional optimum.
    posed_by: Codex
    posed_date: '2026-10-12'
    notes: Keep the native61-residue protein, the69-residue tagged construct, versioned profile intervals and source/expression-host identities separate. A residue-level antitoxin mechanism is not demonstrated.
