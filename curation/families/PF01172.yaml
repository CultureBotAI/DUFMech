causal_graphs:
- graph_id: sbds-efl1-mouse-pre60s-release
  title: Joint SBDS, EFL1 and GTP release eIF6 from mouse pre-60S particles
  scope: Recombinant human SBDS and EFL1 acting on eIF6-loaded pre-60S particles isolated from Sbds-deleted
    mouse liver in Finch 2011 Figure 3B/C. This is a mixed-species, whole-protein reconstitution.
  context: 100 ul with about 0.5-1 pmol pre-60S, 5 pmol each SBDS/EFL1, 100 uM GTP, 10 mM Tris-HCl pH
    7.4, 75 mM KCl, 1.5 mM MgCl2 and protease/RNase inhibitors; 10 min at 37 C. Sucrose-cushion centrifugation
    and immunoblotting distinguish free and bound eIF6.
  family_mapping: Q9Y3A5/SBDS_HUMAN is 250 aa, sequence version 4, matching current NP_057122.2 and InterPro
    exactly. PF01172 spans 14-100; the paper's structural domain I spans 2-96. The paper cites unversioned
    NP_057122. The intact protein includes other domains, and complete experimental tags/scars remain
    unresolved.
  scope_status: MECHANISTIC
  limitations: SBDS alone is not sufficient. GDP/no nucleotide fail and GDPNP gives marginal release;
    these do not quantify a complete kinetic cycle. Ebp1/Nmd3 retention constrains specificity. The supplement
    was inaccessible, so full construct details and raw blots are unverified. Neither isolated SBDS_N
    activity nor direct 80S assembly is measured.
  nodes:
