- graph_id: sbds-efl1-rabbit-truncated-eif6-release
  title: SBDS and EFL1 release truncated eIF6 from rabbit 60S particles
  scope: Human SBDS/EFL1 and recombinant human eIF6(1-225) on salt-washed rabbit reticulocyte 60S subunits
    in Figure 3D. This mature-particle preparation is separate from mouse pre-60S.
  context: Preload 5 pmol rabbit 60S with excess eIF6(1-225) for 20 min on ice, remove free factor with
    a 100-kDa filter, and perform the 100-ul release assay with 5 pmol each SBDS/EFL1 and 100 uM GTP for
    10 min at 37 C in the pH-7.4 release buffer. Compare bound/free immunoblots after sucrose pelleting.
  family_mapping: Human whole SBDS maps to Q9Y3A5 and PF01172 14-100; the rabbit particle and truncated
    eIF6 are separate components. The SBDS and EFL1 tag states cannot be reconstructed from the accessible
    main Methods alone.
  scope_status: MECHANISTIC
  limitations: Rpl28 retention and EDTA release controls are retained. The eIF6 truncation excludes S235,
    but this does not exclude every phosphorylation mechanism in cells. Mature rabbit particles are not
    treated as equivalent to mouse precursors or a wholly human system.
