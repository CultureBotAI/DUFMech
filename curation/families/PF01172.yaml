- graph_id: sbds-variants-rabbit-60s-gtp-hydrolysis
  title: SBDS preparations alter 60S-dependent EFL1 GTP hydrolysis
  scope: WT, R126T and K151N human SBDS preparations in the separate rabbit-60S phosphate-release assay
    of Figure 6B. R126T and K151N are outside PF01172.
  context: 50 ul containing 5 nmol gamma-32P-GTP, 5 pmol rabbit 60S, 6.3 pmol SBDS when present and 40
    pmol EFL1; 50 mM Tris pH 7.4, 2 mM MgCl2, 150 mM NaCl and 2 mM DTT; 30 min at 37 C. Charcoal separation
    and scintillation quantify Pi; bars report three experiments with SD.
  family_mapping: Q9Y3A5 has R126 and K151 outside its PF01172 14-100 match, within the full multidomain
    SBDS molecule. These are whole-protein context effects, not mapped N-terminal catalytic residues.
  scope_status: MECHANISTIC
  limitations: SBDS alone without 60S does not significantly activate EFL1. H96A EFL1 is a catalytic control.
    Hydrolysis and eIF6 release use different buffers and particles in separate vessels. K151N's nonsignificant
    difference from WT does not establish kinetic equivalence; no universal rate or stoichiometry is inferred.
  nodes:
  - node_id: add-wt-sbds-rabbit-60s
    label: Add WT SBDS rather than no SBDS to EFL1 and rabbit 60S
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q9Y3A5
  - node_id: replace-wt-sbds-r126t
