- graph_id: sbds-variants-mouse-pre60s-release
  title: R126T and K151N SBDS preparations reduce eIF6 release
  scope: Figure 6C compares human WT and mutant SBDS with EFL1/GTP on Sbds-deleted mouse-liver pre-60S
    particles. Neither mutant lies inside PF01172.
  context: The 100-ul mouse-particle release assay uses about 0.5-1 pmol pre-60S, 5 pmol SBDS, 5 pmol
    EFL1 and 100 uM GTP in 10 mM Tris-HCl pH 7.4, 75 mM KCl and 1.5 mM MgCl2 with inhibitors; 10 min at
    37 C, sucrose pelleting and bound/free immunoblots.
  family_mapping: The tested multidomain protein corresponds to Q9Y3A5, PF01172 14-100; R126T and K151N
    alter another domain. Reference agreement does not substitute for sequencing the experimental variants
    or assign their effect to SBDS_N alone.
  scope_status: MECHANISTIC
  limitations: Ebp1 is retained as a particle control. The figure does not supply a precise release fraction
    or a complete kinetic analysis. Main-text NMR supports retained fold, but the supplementary binding
    assay and detailed constructs remain uninspected. Disease etiology and universal family behavior are
    not graph outputs.
