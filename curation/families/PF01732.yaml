  - graph_id: gm12-recombinant-mib-mip-cleavage
    title: "Joint recombinant MIB-MIP preparations cleave goat antibody substrates"
    scope: "Arfi 2016 Figures 2C and 3B: purified goat IgG, Fab or F(ab')2 exposed to GM12 MIP r-0582 and MIB r-0583; omission and published r-0582A controls."
    context: "Recombinant N-terminal TM replacements with His tags, expressed in E. coli; PBS pH 7.4, MIP added last. Main Methods specify 30 C and SI room temperature. Exact doses and time for Figure 2C remain unresolved; Figure 2B's 15-min protocol is not silently substituted."
    family_mapping: "MIP82/MMCAP2_0582 reference ACU78687.1 (861 aa) exactly matches UniParc UPI0001793D5F, PF01732 290-776. MIB83/MMCAP2_0583 is ACU78312.1 (750 aa), a distinct binding protein. Historical recombinant termini and the r-0582A clone sequence are not independently verified."
    scope_status: MECHANISTIC
    taxon: NCBITaxon:436113
    limitations: "DIRECT refers to net purified-preparation effects, not an isolated PF01732 domain or an atomic catalytic step. The paper's S727A label conflicts with Y727/S759 in the full-length reference and S759A in 2021; retain r-0582A without asserting a canonical residue. Folding effects are not excluded. VH/CH numbering and exact cleavage-bond identity remain unresolved; no universal substrate or inhibitor rule."
