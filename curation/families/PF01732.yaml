  - graph_id: gm12-antigen-complex-dissociation
    title: "Active and inactive MIB-MIP mixtures dissociate antigen-IgG complexes"
    scope: "Nottelet 2021 Figure 4A-F, preassembled goat IgG with human transferrin, human albumin or HRP; addition of MIB83 plus WT or S759A MIP82."
    context: "SEC assay in 200 ul PBS with 3 uM IgG, 10 uM antigen and 6 uM each added MIB/MIP. Results/Methods give 20-min room-temperature preincubation, caption 30 min. MIB-only positive comparisons also dissociate complexes. The separate 15-ul cleavage-assay concentrations are not used here."
    family_mapping: "GM12 MIP82 reference ACU78687.1, PF01732 290-776; 2021 constructs delete MIP residues 1-33 and MIB 1-35 and carry N-terminal His tags. The full-length reference has Ser759, but complete experimental clone sequences are not independently verified."
    scope_status: MECHANISTIC
    taxon: NCBITaxon:436113
    limitations: "DIRECT joint-preparation effects on SEC separation, not MIP-alone sufficiency or proteolysis-dependent antigen release. MIB alone and MIB plus inactive MIP also act. WT and inactive mixtures remain separate nodes; these effects are not connected as a cleavage-then-release chain. Main PMC panels were visually inspected at 440-pixel resolution; no calibrated peak integration or affinity measurement."
    nodes:
      - node_id: active-joint-mixture
        label: "Add MIB83 plus WT MIP82 to the preassembled complex"
        node_type: PERTURBATION
        grounding:
          - NCBIProtein:ACU78687.1
