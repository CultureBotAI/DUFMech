  - graph_id: gm12-atpase-mutant-cellular-effects
    title: "ATPase-cluster and recode-matched K152A perturbations impair the cellular system"
    scope: "Berlureau 2026 Figure 3 and supplement S13, GM12-derived Mmc 1.1 versus DeltaATPase, and MMCAP2_0575 G3S/K4R/K152A versus the G3S/K4R recode control."
    context: "Delete ATPase loci 0581 through 0575 without deleting the upstream MIB-MIP cluster. Pellet 2 ml late-log culture and resuspend in 1 ml SP5 plus 2% B4J12 immune goat serum; 1-h incubation, temperature not specified in Methods 4.8. Image aggregates and immunoblot separated supernatant/pellet. Serum-free controls remain dispersed and lack antibody signal."
    family_mapping: "MIP82/MMCAP2_0582 is the PF01732-bearing ACU78687.1 reference, residues 290-776; all four MIB/MIP pairs remain in these ATPase mutants. ATPase beta-like 0575 is a partner, not the PF01732 protein. K152A belongs to 0575 and occurs with G3S/K4R, not as an isolated substitution against WT."
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:436113
    limitations: "INDIRECT cellular effects with one clone per genotype, other SNPs/INDELs, no complementation and extra DeltaATPase passages/23S-rRNA changes. MIB/MIP abundances are broadly WT-like but localization/assembly are unresolved. No ATP-hydrolysis rate, transmembrane energy transfer or release/reset transition was measured. The proposed model predicts pellet cleavage products not clearly observed. May 2026 correction concerns acknowledgements, not experimental data."
