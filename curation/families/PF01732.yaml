  - graph_id: gm12-mib-mip-locus-deletion
    title: "MIB-MIP locus deletion changes cellular cleavage and immune-serum agglutination"
    scope: "Nottelet 2021 Figure 5B/C/E/F, GM12-derived Mmc WT versus deletion of all four MIB-MIP pairs; the single retained MIB83-MIP82 pair is a separate positive comparator, not a rescue."
    context: "Cleavage assays use about 1e9 washed late-exponential cells in 15 ul SP5 without FBS, 100 ng/ul purified serum IgG or 2% albumin-depleted D12 goat serum, 30 min at 37 C, supernatant immunoblot. Agglutination is a different overnight static 37 C assay; Methods give 4% serum and caption 2%. D0 serum does not produce the same cellular IgM cleavage/agglutination response."
    family_mapping: "The deleted cluster includes MIP82/MMCAP2_0582, ACU78687.1 with PF01732 290-776, but also three other MIPs and four MIBs. Whole-locus effects cannot be attributed exclusively to this protein or its domain. Main Figure 5B establishes the design; exact strain lineage and nucleotide breakpoints in inaccessible supplements remain unverified here."
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:436113
    limitations: "INDIRECT genotype effects. Single-pair retention is not reintroduction complementation. Anti-HRP IgG is not detectably cleaved by cells despite purified-system activity. OD310 measures settled aggregates, not growth. Results panel cross-references are offset; actual Figure 5C/E/F is used. Low-resolution visual inspection supports qualitative direction, not numeric effect sizes or a domain-specific mechanism."
    nodes:
      - node_id: whole-locus-deletion
        label: "Delete all four MIB-MIP pairs versus WT"
        node_type: PERTURBATION
        grounding:
          - NCBIProtein:ACU78687.1
          - NCBIProtein:ACU78312.1
      - node_id: cellular-igg-product
        label: "Extracellular IgG heavy-chain cleavage product"
        node_type: STATE
      - node_id: cellular-igm-product
        label: "Extracellular D12-serum IgM cleavage product"
        node_type: STATE
      - node_id: d12-agglutination
        label: "D12-serum cellular agglutination"
        node_type: PHENOTYPE
    edges:
      - edge_id: deletion-decreases-igg-product
        subject: whole-locus-deletion
        predicate: decreases
        object: cellular-igg-product
        mechanism: "The deleted strain lacks the serum-IgG cleavage product detected in WT and the single-pair comparator in the 30-min cellular assay."
