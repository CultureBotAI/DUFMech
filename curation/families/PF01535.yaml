            source_url: https://www.ebi.ac.uk/interpro/api/protein/uniprot/Q9SF38/entry/pfam/PF01535/
            snippet: 'Q9SF38 Pfam:PF01535; repeat intervals: 416-442 and 559-585, inclusive.'
            explanation: Current sequence matching places locally mapped K426 inside PF01535 while preserving the different old motif convention and unresolved complete assay constructs.
