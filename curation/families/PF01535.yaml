causal_graphs:
  - graph_id: hcf152-mini-ppr-k12n-and-rescue
    title: Motif-5 K12N reduces RNA binding and motif-6 N12K partly restores it
    scope: Arabidopsis HCF152-derived HCF/5&6 mini-protein fusions in Kobayashi 2012 Figure 3B; not full-length chloroplast protein or all PPR proteins.
    context: Purified N-terminal thioredoxin and C-terminal six-His fusions are titrated against 250 pM radiolabeled Dd120 RNA, a 120-nt psbH-region probe. Reactions use 20 ul, 10 mM Tris-HCl pH 8.0, 40 mM KCl, 6 mM MgCl2, 0.05 mM EDTA, 2 mM DTT and 8% w/v glycerol at 25 C for 15 min, followed by 10% native PAGE. Apparent K_D is the protein concentration at 50% total RNA binding; the competitive-assay extra salt/heparin is not part of this condition.
    family_mapping: Q9SF38 / HCF152 / At3g09650 is the 778-aa Arabidopsis reference, sequence version 1, identical between UniProt and InterPro. Current PF01535 hits are 416-442 and 559-585. Local Figure 2C motif residues identify 5-K12 as reference K426 inside the first hit and 6-N12 as N464 outside both current hits. Historical motif numbering is not the same as current Pfam boundaries. Complete mini-protein endpoints and linkers remain unverified because supplementary primers were inaccessible.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:3702
    limitations: Directness concerns the purified fusion's net binding response, not a proven atomic RNA contact or isolated PF01535 sufficiency. Multiple shifted species limit equilibrium interpretation. Figures 2/3 were visually inspected; supplemental gels, purity and primers were not. Independent purification batches and mutant-folding equivalence remain unestablished. The double mutant remains much weaker than WT; no cellular processing or editing chain is inferred.
    nodes:
      - node_id: motif5-k12n-versus-wt
        label: HCF/5&6 5-K12N rather than WT
        node_type: PERTURBATION
        grounding:
          - UniProtKB:Q9SF38
      - node_id: motif6-n12k-on-k12n
        label: Add 6-N12K to the 5-K12N mini-protein
        node_type: PERTURBATION
        grounding:
          - UniProtKB:Q9SF38
      - node_id: dd120-binding-k12n-series
        label: Dd120 RNA binding in the HCF/5&6 fusion titration
        node_type: ACTIVITY
        grounding:
          - UniProtKB:Q9SF38
    edges:
      - edge_id: motif5-k12n-decreases-binding
        subject: motif5-k12n-versus-wt
        predicate: decreases
        object: dd120-binding-k12n-series
        mechanism: The 5-K12N fusion requires more than 2500 nM protein to reach the operational half-binding threshold, compared with 9.7 nM for WT. This supports reduced binding in the tested assay, not complete absence of every RNA interaction.
        directness: DIRECT
        support: OBSERVED
