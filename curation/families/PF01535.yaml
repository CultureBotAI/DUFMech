            cache_sha256: 633ef7556a900bf0866613e152a924a4555074c4bc188b64310684793d3ad063
      - edge_id: motif6-n12k-partially-restores-binding
        subject: motif6-n12k-on-k12n
        predicate: increases
        object: dd120-binding-k12n-series
        mechanism: On the 5-K12N background, adding 6-N12K lowers the operational half-binding concentration from above 2500 nM to 384.6 nM. The comparison is to the single mutant, not WT; this is partial recovery and does not prove a particular inter-residue contact.
