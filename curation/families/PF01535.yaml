      - node_id: dd120-binding-n12r-series
        label: Dd120 RNA binding in the N12R-background fusion titration
        node_type: ACTIVITY
        grounding:
          - UniProtKB:Q9SF38
    edges:
      - edge_id: motif6-n12r-decreases-binding
        subject: motif6-n12r-versus-wt
        predicate: decreases
        object: dd120-binding-n12r-series
        mechanism: The 6-N12R fusion has an apparent half-binding concentration above 2500 nM versus 9.7 nM for WT. This supports reduced assay binding despite introducing an additional basic residue; no specific physical explanation is uniquely established.
        directness: DIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:22127869
            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3315335/
            snippet: partially recovered
            explanation: Figure 3B's 6-N12R and WT rows were visually checked against the Results and assay definition; an unquantified ND value is not treated as zero binding.
            cache_path: evidence/PF01535/kobayashi-2012-binding.txt
            cache_sha256: 39b83a044602820fe88c4e4c515a06ef86d5883666a57c01909ef0cdf1c2bbe3
      - edge_id: motif5-k12m-partially-restores-binding
        subject: motif5-k12m-on-n12r
        predicate: increases
        object: dd120-binding-n12r-series
        mechanism: Adding 5-K12M to 6-N12R lowers the operational half-binding concentration from above 2500 nM to 454.5 nM. The observed improvement remains far from WT and is limited to this double-versus-single-mutant comparison.
        directness: DIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:22127869
            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3315335/
            snippet: partially recovered
            explanation: Visually inspected Figure 3B and mutation Results support partial recovery on the N12R background. This does not establish that a universal paired-residue code or K12M alone causes the same result.
            cache_path: evidence/PF01535/kobayashi-2012-binding.txt
