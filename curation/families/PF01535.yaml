  - graph_id: hcf152-mini-ppr-n12r-and-rescue
    title: Motif-6 N12R reduces RNA binding and motif-5 K12M partly restores it
    scope: Separate HCF/5&6 single- and double-mutant comparisons from Kobayashi 2012 Figure 3B, retaining the N-terminal thioredoxin and C-terminal six-His fusions.
    context: Dd120 RNA at 250 pM is incubated with serial protein concentrations in 20 ul containing 10 mM Tris-HCl pH 8.0, 40 mM KCl, 6 mM MgCl2, 0.05 mM EDTA, 2 mM DTT and 8% w/v glycerol, for 15 min at 25 C. Native 10% PAGE supplies the operational 50%-binding concentration; no extra competitive-assay salt or heparin is assumed.
    family_mapping: Local motif sequence mapping to Q9SF38 places 6-N12 at N464 outside current PF01535 and 5-K12 at K426 within 416-442. Q9SF38 also has a separate 559-585 PF01535 hit, not this motif-5/6 pair. These are perturbations of the same mapped-protein-derived fusion, not proof that each perturbed residue belongs to the current Pfam hit. Historical full clone boundaries remain unresolved.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:3702
    limitations: The N12R effect is outside the current Pfam interval and may involve the broader fusion context. The matched double-mutant comparison does not independently establish an isolated K12M effect. No direct RNA-contact geometry, universal basic/neutral residue rule, native chloroplast effect or folding equivalence is established. Supplemental gels and primer table remain inaccessible.
    nodes:
      - node_id: motif6-n12r-versus-wt
        label: HCF/5&6 6-N12R rather than WT
        node_type: PERTURBATION
        grounding:
          - UniProtKB:Q9SF38
      - node_id: motif5-k12m-on-n12r
        label: Add 5-K12M to the 6-N12R mini-protein
        node_type: PERTURBATION
