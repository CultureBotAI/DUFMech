  - graph_id: duf114-predicted-sdh-catalysis-2004
    title: Predicted SDH catalytic arrangement may enable proteolysis
    scope: DUF114 homologs analyzed by Pandit and Srinivasan2004; proposed family mechanism, not experimental transfer to every PF01972 member.
    context: Sequence/profile comparisons and fold recognition against known ClpP-related structures; no tested residue perturbation or biological compartment established.
    family_mapping: The paper's DUF114 family is the current PF01972/IPR002825 identity. Related ClpP and proteaseIV sequences are comparison families. Exact historical alignment-to-current residue numbering is not asserted.
    scope_status: HYPOTHETICAL
    limitations: Conserved residues and predicted fold geometry do not prove catalytic necessity or sufficiency. No residue numbers, substrate specificity, secretion requirement or measured catalytic intermediate is assigned. The Mm2878 reporter assay does not validate this atomic mechanism.
    nodes:
      - node_id: proposed_arrangement
        label: Proposed joint Ser-Asp-His active-site geometry
        node_type: STATE
        grounding: ['Pfam:PF01972']
      - node_id: proposed_hydrolysis
        label: Proposed peptide-bond hydrolysis activity
        node_type: ACTIVITY
    edges:
      - edge_id: predicted-triad-proteolysis
        subject: proposed_arrangement
        predicate: enables
        object: proposed_hydrolysis
        mechanism: The authors propose that a compatible geometry despite altered His/Asp sequence order could support serine-proteinase activity. This is a computationally motivated causal hypothesis.
