causal_graphs:
  - graph_id: mm2878-casein-reporter-2011
    title: Mm2878 preparation produces a casein-reporter response
    scope: Methanosarcina mazei Mm2878 comparator in Ammelburg2011 Figure24; preparation-level assay, not isolated-domain chemistry.
    context: 25nM preparation,200nM TR-X BODIPY-casein,20mM HEPES pH7.5,150mM NaCl,0.5mM TCEP;37C for2h;580/620nm excitation/emission.
    family_mapping: UniProt Q8PT40 sequence1/entry106 identifies MM_2878 in M. mazei Goe1,243aa; current InterPro maps PF01972 at2-241 inclusive. Species/locus correspondence does not verify the thesis clone or tags. See evidence/PF01972/member-mapping.txt.
    taxon: NCBITaxon:192952
    scope_status: PHENOTYPIC
    limitations: No blank, inactive-Mm2878 control, replication or error bars are shown in Figure24. The adjacent purification protocol concerns MjMPM. Reporter dequenching does not resolve Mm2878-specific catalysis, contamination, cleavage sites, SDH residues or physiological function.
    nodes:
      - node_id: preparation
        label: Mm2878 preparation incubated with quenched casein reporter
        node_type: PERTURBATION
        grounding: ['UniProtKB:Q8PT40']
      - node_id: fluorescence
