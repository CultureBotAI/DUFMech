  - graph_id: ccaf1-overexpression-rna-half-lives
    title: CcaF1 overexpression and RNA half-lives
    scope: R. sphaeroides 2.4.1 carrying pRKCcaF1 compared with wild type; full-length RSP_6037, not the KD131 homolog.
    context: Microaerobic malate minimal-salt medium, 32 C; OD660 0.5, then 0.2 mg/ml rifampicin and Northern-blot decay measurements.
    family_mapping: RSP_6037 is reference Q3J4N6, sequence version 1, 71 residues; PF06568 spans 28-60. Current taxonomy calls this strain Cereibacter sphaeroides; the experiment does not isolate the domain.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:272943
    limitations: Overexpression effects do not prove native-dose necessity or intrinsic nuclease activity. Binding is not a degradation reaction; other transcripts and growth regimes require separate assessment.
