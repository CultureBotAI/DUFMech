  - graph_id: ecoli-tils-preparations-s100-aminoacylation
    title: TilS-modified preparations change aminoacylation in E. coli extract
    scope: Reaction B or H preparations versus no-amine A in the separate E. coli S100 IleRS/MetRS activity columns of Table 5. S100 is a partially purified mixed extract from BL21(DE3), not either isolated synthetase.
    context: Dilute frozen modification mixtures to 100 nM tRNA in 30 ul of 50 mM HEPES pH 7.3, 10 mM Mg(OAc)2, 100 mM KCl, 0.5 mM TCEP, 0.1 mg/ml BSA, 100 uM ATP, 100 nM tritiated isoleucine or methionine, and 40 ug/ml S100 protein. Two hours at room temperature, followed by acidic SPA capture.
    family_mapping: The modifying enzyme is intact P52097-associated TilS, PF01171 10-197 plus its C-terminal domains. S100 reporter enzymes and transcript are separate components; the graph does not assign their catalysis to PF01171.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:562
    limitations: Preparations were not repurified, so residual amine, ATP and TilS may carry over. The causal comparison is between reaction preparations, not purified RNAs proven to differ at only one atom. Table 5 columns use different normalization references; values are not absolute cross-enzyme rates. No replicate/error estimates or universal zero-activity threshold are supplied, and no in-vivo AUA decoding is measured here.
    nodes:
