discussions:
  - discussion_id: tils-atomic-steps-and-ortholog-coverage
    prompt: Extend TilS evidence with exact constructs, modification-site chemistry and ortholog-specific substrate recognition.
    kind: CURATION_TODO
    status: OPEN
    rationale: Eight observed cell-free assay effects cover two product preparations and separate aminoacylation systems. They do not establish a fully observed atomic mechanism, purified-RNA-only causality or the activities of every PP-loop protein.
    evidence:
      - reference: PMID:19233850
        supports: PARTIAL
        evidence_source: inspected_primary_full_text
        explanation: Tables 4/5 and Figure 2 support the adopted effects; contamination, isotope dilution, preparation carryover and normalization limits are retained.
      - reference: PMID:40914250
        supports: PARTIAL
        evidence_source: primary_abstract_and_selected_results
        explanation: Later ortholog-specific recognition findings identify additional work; methods, exact member mappings and figures were not fully reviewed.
    notes: Resolve experimental clone scars, carryover controls and error estimates; inspect the original adenylated-intermediate and recognition studies before adding those microsteps. Curate remaining true alternative substrates separately from contaminated ornithine/N-alpha-methyllysine samples. Extend the 2025 ortholog study after member mapping and Methods/figure assessment. Do not infer cellular decoding, drug efficacy or family-wide chemistry from these preparations. Partial same-agent scientific review; remain IN_PROGRESS.
    posed_by: Codex
    posed_date: '2026-10-11'
