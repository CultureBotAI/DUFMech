  - graph_id: tils-preparations-bsubtilis-ilers
    title: Modified E. coli tRNA preparations support B. subtilis IleRS
    scope: A deliberately mixed-species biochemical system in Table 5, with E. coli TilS-treated E. coli transcript and purified B. subtilis 168 FLAG-IleRS. This is separate from the E. coli S100 experiment.
    context: Reaction B or H preparations diluted to 100 nM tRNA, 0.1 nM recombinant IleRS, 100 nM tritiated isoleucine and 100 uM ATP in the 30-ul HEPES pH 7.3 synthetase assay with 10 mM Mg(OAc)2. Two hours at room temperature; acidic SPA capture. Compare each preparation with no-amine A.
    family_mapping: P52097 TilS supplies PF01171 at 10-197 and produces the tested preparations. The partner accession Q45477 identifies B. subtilis 168 IleRS, not a PP-loop-family enzyme. Its current sequence version 3 is later than the 2009 experiment; complete historical FLAG construct identity is not independently reconstructed.
    scope_status: MECHANISTIC
    limitations: This mixed-species result is not a native cellular pathway or evidence for B. subtilis TilS activity. The B/H preparations are unrepurified and may retain reaction components. The reported 100/99 values have no supplied uncertainty establishing equivalence, and the zero control is bounded by assay detection. No codon recognition or translation rate is measured.
    nodes:
      - node_id: lysine-preparation-with-bsubtilis-ilers
        label: Use reaction B rather than A with purified B. subtilis IleRS
        node_type: PERTURBATION
      - node_id: ethanolamine-preparation-with-bsubtilis-ilers
        label: Use reaction H rather than A with purified B. subtilis IleRS
