causal_graphs:
  - graph_id: ecoli-tils-lysine-and-ethanolamine-products
    title: TilS produces lysine- and ethanolamine-modified tRNA preparations
    scope: Purified C-terminal His6 E. coli K12 TilS and transcribed E. coli tRNAIle2 in Salowe 2009 Table 4 reactions B/H, compared with no-amine reaction A. Intact-RNA mass and gel migration support modification products, not an independently localized atomic pathway.
    context: 75 ul, 50 mM TAPS pH 8.5, 3 mM MgCl2, 0.5 mM TCEP, 0.1 mg/ml BSA, 20 uM transcript, 100 uM ATP and 500 nM TilS; 37 C for 4 h. Use 0.1 mM lysine in B or 20 mM ethanolamine in H. Preparations are frozen without further workup; product gels, intact-RNA MS and residual-substrate radiolysine assays are distinct readouts.
    family_mapping: P52097/TILS_ECOLI, tilS/mesJ/yaeN/b0188, 432 aa, sequence version 1. UniProt, InterPro and cited Z50870.1/CAA90751.1 match exactly; PF01171 spans 10-197. Published primers match the coding start and terminal WQKTLS, excluding the native stop for a reported C-terminal His6 fusion. Complete vector scar and experimental clone are not independently reconstructed.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:83333
    limitations: Whole TilS also contains C-terminal tRNA-recognition domains. Neither isolated PP-loop sufficiency nor a directly tracked adenylation/nucleophilic-attack sequence follows from these data. Raw spectra, exact modification-site localization, replicate counts and uncertainty are unverified here. N-alpha-methyllysine and ornithine samples gave lysine-like products attributed to contamination, not confirmed alternative incorporation.
