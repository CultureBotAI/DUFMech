    measured endpoint, not a causal consequence inferred from the optical chromophore trace.
  context: Equimolar Pdx1/Pdx2 at 10, 20 or 40 uM each, glutamine and R5P; 300 ul, 50 mM Tris-Cl pH 8.0,
