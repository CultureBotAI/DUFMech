- graph_id: pdxs-partner-glutaminase-readout
  title: PdxS addition increases the partner glutaminase readout
  scope: Purified untagged Bacillus subtilis 168 YaaD/PdxS and YaaE/PdxT in Raschle 2005 supplement S2A.
    This is the same experiment retained from the partner perspective in PF01174, not an independent replication.
  context: 4 uM each protein when present, 300 ul, 50 mM Tris-Cl pH 8.0, 10 mM glutamine, 0.5 mM APAD,
    7 U bovine glutamate dehydrogenase, 37 C; monitor A363. Individual-protein controls remain near background.
  family_mapping: P37527/PDXS_BACSU is strain-168 PdxS/YaaD, 294 aa, sequence version 3; exact InterPro
    sequence match and PF01680 7-212. Genomic cloning, sequencing and N-terminal protein checks support
    the association. The full untagged protein, including residues outside this interval, was tested.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:224308
  limitations: This is a coupled glutamate readout. PdxS addition activates the joint preparation; PdxS
    is not thereby assigned autonomous glutaminase activity. No atomic allostery, ammonia channel or isolated-domain
    sufficiency is directly measured.
  nodes:
  - node_id: add-pdxs-to-pdxt-glutamine
    label: Add untagged PdxS to PdxT and glutamine
    node_type: PERTURBATION
    grounding:
    - UniProtKB:P37527
  - node_id: coupled-glutamate-signal
    label: Glutamate-dependent APAD reduction
    node_type: ACTIVITY
  edges:
  - edge_id: pdxs-increases-partner-readout
    subject: add-pdxs-to-pdxt-glutamine
    predicate: increases
    object: coupled-glutamate-signal
    mechanism: Partner addition increases glutamine-dependent reporter turnover compared with the individual-protein
      controls. The joint requirement does not make either protein independently sufficient.
    directness: DIRECT
