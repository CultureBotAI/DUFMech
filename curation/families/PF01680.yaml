- graph_id: pdxs-g3p-spectral-conversion
  title: G3P addition lowers the preformed 315-nm signal and raises A414
  scope: Raschle 2007 Figure 2C main panel after chromophore reconstitution. Two measured endpoints share
    one substrate-addition intervention; neither is assumed to cause the other.
  context: Prepare the chromophore as in Figure 2A, then add 0.4 mM DL-G3P; record spectra at 3, 9, 15,
    25, 40 and 60 min. The caption ends with pH 8.0 whereas reconstitution Methods use pH 7.5. Temperature
    is not explicitly restated for this experiment.
  family_mapping: Whole P37527-associated Pdx1-His6, with PF01680 7-212, is assayed in the stated reconstitution
    mixture. This is not the 2005 untagged product-identification preparation or the later Hanes NMR quench
    preparation.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:224308
  limitations: The separate dialyzed inset states 0.4 uM DL-G3P, conflicting with the main-panel 0.4 mM
    dose, and shows partial conversion. A414 is PLP-associated but does not independently distinguish
    enzyme-bound from released PLP. No exact conversion yield or complete intervening atomic mechanism
    is assigned.
