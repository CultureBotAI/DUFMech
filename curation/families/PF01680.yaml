discussions:
- discussion_id: pdxs-intermediate-chemistry-and-context-coverage
  prompt: Reconcile PdxS intermediate structures, complete construct provenance and additional family
    contexts.
  kind: CURATION_TODO
  status: OPEN
  rationale: Eight graphs retain eleven measured effects with explicit member and assay boundaries. The
    2007 early-imine and nitrogen-free chromophore proposals are not encoded as settled chemistry; later
    2008 NMR challenges those interpretations but uses distinct preparations and quench products.
  evidence:
  - reference: PMID:17189272
    supports: PARTIAL
    evidence_source: inspected_primary_full_text_and_figures
    explanation: Figures support adduct localization, partner dependence, spectral conversion and phosphate
      release. Some concentrations, mass descriptions and proposed structures remain inconsistent or incompletely
      documented.
  - reference: PMID:18516049
    supports: PARTIAL
    evidence_source: inspected_author_full_text_and_publisher_supplement
    explanation: C2 ketone/C1-N observations and S5 nitrogen-labeling qualify the early structural proposal.
      Acid/urea-derived Z2 is explicitly not a native enzymatic intermediate; the proposed complete chemical
      pathway is not fully directly observed.
  notes: Preserve the 2008 follow-up in evidence/PF01680/hanes-2008-nmr-boundaries.txt. Resolve full tagged
    clone sequences, WT Pdx2 tag matching, 0.4 mM versus 0.4 uM G3P, pH7.5 versus pH8.0, and text/table
    mass differences. Inspect the 2008 JACS substrate study before assigning intrinsic DHAP isomerization;
    inspect the 2011 second-site and 2015 Geobacillus results before extending the chemical sequence.
    Assess plant/fungal and other microbial members independently. No ammonia-channel geometry, physiological
    phenotype or family-wide mechanism is established by these graphs. Partial scientific self-review;
    remain IN_PROGRESS.
  posed_by: Codex
  posed_date: '2026-10-11'
