- graph_id: pdxs-k81-early-adduct
  title: Ribose phosphate forms a Lys81-linked early adduct
  scope: Raschle 2007 Figures 3/4, purified Pdx1-His6 and K81R/K149R derivatives. The observed covalent
    adduct is retained without adopting the paper's subsequently challenged imine interpretation.
  context: Figure 4 preincubates R5P with each protein for 3 h at 37 C, compared with its no-R5P spectrum;
    the figure does not enumerate protein/sugar doses. Separate radiolabel-guided tryptic fractionation
    and isotope-resolved MS/MS locate the early adduct at K81.
  family_mapping: P37527-associated strain-168 PdxS, current 294-aa sequence with PF01680 7-212. The paper's
    modified peptide is current residues 61-83 and includes K81. Archived sequence version 2 lacked only
    the initial M; the paper's numbering already matches current K81/K149. 2NV1 is MAS plus P37527 plus
    LEHHHHHH, but every 2007 vial's complete clone was not independently sequenced here.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:224308
  limitations: K149R retains the early mass adduct and is not simply inactive in every step. The K81R
    comparison does not exclude folding effects by itself. Later NMR supports a C2 ketone/C1-N linkage
    for the prepared early species, so the exact older imine structure is not an observed edge. Neither
    preparation is an isolated PF01680 domain.
  nodes:
  - node_id: wt-pdxs-r5p-incubation
    label: Incubate WT Pdx1-His6 with ribose 5-phosphate
    node_type: ACTIVITY
    grounding:
    - UniProtKB:P37527
  - node_id: k81-linked-early-adduct
    label: Early K81-linked R5P-derived covalent adduct
    node_type: STATE
  - node_id: k81r-preparation
    label: Substitute the Pdx1-His6 K81R preparation for WT
    node_type: PERTURBATION
    grounding:
    - UniProtKB:P37527
  edges:
  - edge_id: r5p-reaction-produces-early-adduct
    subject: wt-pdxs-r5p-incubation
    predicate: produces
    object: k81-linked-early-adduct
    mechanism: WT gains an approximately 212.6-Da mass increment upon R5P incubation, and isotope-resolved
      peptide analysis identifies K81 as the modified residue. The measured mass/localization is stronger
      than the original proposed bond chemistry.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:17189272
      source_url: https://archive-ouverte.unige.ch/unige:89518
      snippet: Lys-81
      explanation: Figures 3A-C and 4A, pp6100-6101; radiolabel-guided separation, isotope mass comparison
        and fragment assignment support the early adduct localization.
      cache_path: evidence/PF01680/raschle-2007-pdxs.txt
      cache_sha256: 4ee3feec377f32495589c46df452ce7b5528f77f40dc5b7e3a825eba7c3111de
