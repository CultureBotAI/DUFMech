- graph_id: pdxs-joint-plp-product
  title: The joint PdxS and PdxT reaction produces identified PLP
  scope: Raschle 2005 purified untagged strain-168 protein reaction and orthogonal product-identification
    assays. Shared primary experiment with PF01174, not independent support counted twice.
  context: 40 uM each YaaD/YaaE, 50 mM Tris-Cl pH 8.0, 37 C, 10 mM glutamine, 0.5 mM ribose 5-phosphate
    and 0.5 mM DHAP. Product analysis combines A414, deproteinized HPLC, chemical spectral shifts, electrospray
    MS and supplemental NMR.
  family_mapping: Whole P37527-associated PdxS carries PF01680 7-212; partner PdxT is a separate P37528-associated
    protein. All proteins and substrates are a joint input, not proof of synthase-domain autonomy.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:224308
  limitations: Figure 1A/B captions state 1 mM glutamine while Methods/Results state 10 mM; no exact fitted
    kinetics are assigned. Supplemental NMR includes an unknown 3.75-ppm contaminant. The reported DHAP-containing
    reaction does not establish the molecular route of triose utilization or an intrinsic DHAP isomerase;
    later substrate-specificity work remains to be reconciled.
  nodes:
  - node_id: joint-pdxst-reaction
    label: Joint PdxS, PdxT, glutamine, ribose 5-phosphate and DHAP reaction
    node_type: ACTIVITY
    grounding:
    - UniProtKB:P37527
    - UniProtKB:P37528
  - node_id: identified-plp
    label: Product identified as pyridoxal 5-phosphate
    node_type: STATE
  edges:
  - edge_id: joint-reaction-produces-plp
    subject: joint-pdxst-reaction
    predicate: produces
    object: identified-plp
    mechanism: The reconstituted joint reaction produces material matching authentic PLP by orthogonal
      analyses. This establishes net product formation, not every proposed bond rearrangement.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:16030023
      source_url: https://archive-ouverte.unige.ch/unige:89531
      snippet: pyridoxal
