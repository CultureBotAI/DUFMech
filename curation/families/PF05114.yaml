causal_graphs:
  - graph_id: ob3b-mbnbc-mbna-modification
    title: MbnBC-catalyzed MbnA modification
    scope: Purified Methylosinus trichosporium OB3b MbnBC complex, not MbnB alone or all former DUF692 proteins.
    context: Ascorbate-reduced MbnBC with oxygen and MbnA; stopped-flow assay at 5 C, final 150 uM complex and 300 uM substrate, MOPS pH 7.2.
    family_mapping: Reference MbnB is UniProtKB:A0A2D2D5M1, sequence version 1, 276 residues, PF05114 at 15-248. The tested tagged complex is not an isolated domain; reference MbnC and MbnA map to A0A2D2CY73 and E3YBA4.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:595536
    limitations: No MbnB-alone sufficiency, atomic reaction sequence or family-wide transfer asserted. The mbnC-deficient cellular study limits universal partner-necessity claims; engineered construct coordinates are not transferred to reference residues.
