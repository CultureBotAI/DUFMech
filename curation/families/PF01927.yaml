  prompt: Resolve construct and source discrepancies without treating broad-CTD assays as isolated Pfam
    mechanisms.
  kind: CURATION_TODO
  status: OPEN
  rationale: The experimental CTD is wider than the current Pfam match; extra-domain substitutions, affinity-label
    conflicts and tag differences limit attribution.
  evidence:
  - reference: PMID:39188014
    supports: PARTIAL
    evidence_source: primary_constructs_figures_and_supplement
    explanation: Separate binding,cleavage,coexpression and cellular readouts support scoped effects;
      they do not prove the matched Pfam segment is sufficient.
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: Ce PF01927 666-779 versusCTD633-910; Hs631-734 versus624-876. R853/T855,D435,D399 andW812stop
    are outside the matches. Figure7A truncated Kd33.4 conflicts with Results18.7/S8C18.69. Figure5/S1
    D435A conflicts with Results D453A. Preserve uncertain FL clone/tag assignment,reagent-label discrepancy
    and coexpression-solubility confounds. No intrinsic isolated-CTD nuclease is demonstrated.
- discussion_id: pf01927-native-function-and-member-coverage
  prompt: Extend primary evidence for native RNA targets and remaining animal,plant and prokaryotic member
    contexts.
  kind: CURATION_TODO
  status: OPEN
  rationale: One domain-focused study does not characterize all5065 frozen proteins or all native small-RNA
    mechanisms.
  evidence:
  - reference: PMID:39188014
    supports: PARTIAL
    evidence_source: primary_results_and_discussion
    explanation: Native small-RNA substrates and the ancestral archaeal/bacterial role remain unresolved
      despite animal binding and degradation assays.
  - reference: PMID:33646120
    supports: PARTIAL
    evidence_source: abstract_level_followup
    explanation: Neuronal MUT-7/22G contexts require a separate primary-assay and construct review.
  - reference: PMID:40781776
    supports: PARTIAL
    evidence_source: published_update_abstract
    explanation: MUT-16/MUT-8 simulations and experiments update the earlier preprint,not a directly adopted
      PF01927 mechanism.
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: Tops2005,Ketting1999,Hsu2021,plantWEX and other member studies remain follow-ups; no full-family
    negative claim. Thermococcus RNA binding is predicted here,not observed; Drosophila Nibbler lacks
    the tested CTD. Conditional negatives and raw-data limitations are retained in evidence/PF01927. No
    simulated RNA forceps mechanism, direct MUT-7/MUT-16 contact or all-foci dissolution is asserted.
