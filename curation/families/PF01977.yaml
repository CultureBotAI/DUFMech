- graph_id: anfdc-cinnamate-decarboxylation-2015
  title: AnFdc converts cinnamic acid to styrene
  scope: Purified full-length Aspergillus niger Fdc1 coexpressed with E. coli UbiX; a whole-enzyme reaction,
    not an isolated-domain assay.
  context: Recombinant AnFdc from E. coli BL21(DE3), with bound prFMN; 350 uL, 50 mM KCl and 50 mM sodium
    phosphate pH 6, 25 C. Cinnamic acid disappearance and styrene-assigned UV appearance are followed
    over time.
  family_mapping: A2QHE5 sequence 1/entry 95 is the 500-aa An03g06590 reference. PF01977 maps to 119-318;
    PF20695 to 14-103 and PF20696 to 324-460. Deposited 4ZA4 equals the reference plus LEHHHHHH. See evidence/PF01977/member-mapping.txt.
  taxon: NCBITaxon:425011
  scope_status: MECHANISTIC
  limitations: Does not measure native fungal flux, isolated-domain sufficiency or the complete atomistic
    trajectory. UbiX supplies cofactor and is not assigned this decarboxylation. Reference taxonomy is
    not the expression host.
  nodes:
  - node_id: reaction
    label: AnFdc-prFMN with cinnamic acid in assay buffer
    node_type: PROCESS
    grounding:
    - UniProtKB:A2QHE5
  - node_id: styrene
    label: Styrene product
    node_type: STATE
  edges:
  - edge_id: produces-styrene
    subject: reaction
    predicate: produces
    object: styrene
    mechanism: Purified holoenzyme consumes the acid with a decrease at 270 nm and appearance of the styrene-assigned
      peak at 245 nm. The joint source includes enzyme, cofactor and substrate; none alone is asserted
      sufficient.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:26083754
      source_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC4988494/fullTextXML
      snippet: conversion of cinnamic acid to styrene
      explanation: Original Figure 1c-d, Results and UV-Vis methods inspected; ledger S1a. Product formation
        is measured spectroscopically, not direct CO2 release.
      cache_path: evidence/PF01977/anfdc-primary-assays.txt
      cache_sha256: 403f6306f44f138f074dee8c6bdd5faa29d49dc25e4dd2f2346070d512f5db1a
