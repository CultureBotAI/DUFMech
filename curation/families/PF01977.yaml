  scope: Purified whole AnFdc WT and individually tested E282D/E277D/R173A variants; isotope exchange,
    not net carboxylation.
  context: 35 uM enzyme in styrene-saturated D2O with 50 mM potassium phosphate pH 6, 298K; proton NMR
    compared with no-enzyme control. Normal acquisition dead time is approximately 20 min.
  family_mapping: A2QHE5 version 1, PF01977 at 119-318; all three substitutions lie inside that interval.
    Complete enzyme retains PF20695/PF20696. Exact individual assay plasmids have not been independently
    resequenced.
