  limitations: Proton-signal exchange is directly measured; the identity of a proton-transferring residue
    and each covalent intermediate are not. E277Q/E282Q/R173K lack significant detectable exchange in
    these conditions. R173A four-hour result is reported in Results, not a separate inspected four-hour
    trace.
