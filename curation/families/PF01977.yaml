pfam_id: PF01977
curation_status: IN_PROGRESS
curation_history: history/records/PF01977
discussions:
- discussion_id: ubid-member-and-partner-coverage
  prompt: Extend the family assessment beyond the mapped AnFdc, scoped VdcCD and assessed ScFdc activation
    and substrate-panel systems.
  kind: CURATION_TODO
  status: OPEN
  rationale: PF01977 is the central domain of diverse multidomain enzymes; AnFdc chemistry does not establish
    a universal substrate, partner requirement or native physiological role.
  evidence:
  - reference: PMID:34417452
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: VdcCD substrate, partner, oxygen, viscosity and variant assays are now assessed separately
      from the proposed dynamic mechanism. Sh deposited bodies are mapped; complete synthetic Bs constructs
      remain unresolved.
  - reference: PMID:25647642
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Initial ScFdc catalysis, activation/rescue and preparation effects are scoped to synthetic
      whole-enzyme preparations. Complete inserts, native-system physiology, later mechanisms and the
      tPAD1 truncation boundary remain unresolved.
  - reference: PMID:30679592
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: The 2019 whole-cell substrate panel, fresh-cell conditions, variants and assay environment
      are now assessed. Full inserts, vector-matched comparisons, active occupancy and native yeast physiology
      remain unresolved; the docking receptor is AnFdc rather than ScFdc.
  posed_by: Codex
  posed_date: '2026-10-15'
  notes: Continue remaining ScFdc studies including PMID27119435 and PMID28753302, EcUbiD, AroY, HmfF,
    HudA and maturation/specificity work, plus VdcCD native-system and construct follow-up. Preserve the
    full family and corpus scope; see evidence/PF01977/anfdc-primary-assays.txt, vdcc-primary-assays.txt,
    scfdc-primary-assays.txt and scfdc-substrate-scope.txt.
- discussion_id: anfdc-atomic-steps-and-domain-attribution
  prompt: Resolve intermediate transitions and separate whole-enzyme effects from PF01977-specific chemistry.
  kind: CURATION_TODO
  status: OPEN
  rationale: Trapped adducts, residue perturbations and computed transition states provide different levels
    of evidence. No isolated PF01977 fragment was shown sufficient for catalysis.
  evidence:
  - reference: PMID:31527849
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Figures 2/3 and supplement S4/S5 support scoped adduct and activity observations; F437/L439
      belong to PF20696. The computed Int1-open state and specific proton-transfer sequence are not directly
      measured trajectories.
  - reference: PMID:30679592
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Whole-cell HPLC depletion and modeled substrate orientation are separate evidence types.
      ScQ192 is within PF01977, whereas ScI330 is in PF20696; a model-based gate explanation is not an
      observed isolated-domain mechanism.
  posed_by: Codex
  posed_date: '2026-10-15'
  notes: Extend the remaining substrate/inhibitor and small-analogue graphs after their individual assay
    review. Resolve solution-MS incubation details, active-cofactor normalization, construct sequences
    and the limits of domain transfer. Do not combine E282Q Int2 and WT Int3 into one observed mutant-independent
    trajectory. VdcCD docking and partner-allostery graphs remain hypotheses; apo structures and viscosity
    effects do not measure the proposed catalytic trajectory or isolate PF01977 sufficiency. ScFdc transferable
    activation does not directly measure cofactor synthesis or establish a chemically pure activating
    species; UV depletion does not independently identify every product. The 2019 AnFdc-based docking
    model and whole-cell variant results do not prove a ScFdc atomic trajectory, residue-specific rate
    change or general planarity rule. Fresh-cell supplementation plus extra time does not isolate viability
    rescue.
- discussion_id: anfdc-assay-discrepancies
  prompt: Resolve primary-source label discrepancies while retaining condition-specific negative and residual
    activities.
  kind: CURATION_TODO
  status: OPEN
  rationale: The 2015 blanket inactivity claim is refined by 2018 residual R173A/E277Q activity; detection
    methods and cofactor preparation matter.
  evidence:
  - reference: PMID:29259125
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Original Figures 5/6/7 distinguish low turnover, absent detectable exchange and apparent
      kinetics. R173A cofactor maturation and variant-dependent occupancy prevent a simple catalytic-residue
      inference.
  - reference: PMID:26083754
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Extended Data 1 has a detector-wavelength discrepancy and Extended Data 8 has a third-panel
      color-caption discrepancy; neither is silently corrected or mistaken for a new biological result.
  - reference: PMID:34417452
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Sh sequence verifies R168/G178 despite inconsistent figure labels. Source data retain
      low C-alone vanillate activity, a nonzero BsCD gallic replicate and loss of low ShCD gallic activity
      after partner-tail deletion. L182V is reported only in text; active-cofactor normalization and complete
      Bs insert identity remain unresolved.
  - reference: PMID:25647642
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Original ScFdc Figures 3/4 retain low baseline and tPAD1-only activity despite simplified
      prose. Coexpression also changes FDC tag placement; published tPAD1 primer maps to reference residue
      55 despite reported deletion of 1-58. Figure/prose mass, abstract/table kinetics and host-background
      discrepancies remain explicit.
  - reference: PMID:30679592
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Table 2 and S68 identify gained thiazole 1w conversion, not the abstract's phenothiazine
      gain. S25/S26 are substrate-free blanks, not the cited host controls. Fresh-cell n/o outcomes, timepoints,
      pH results, vector matching, 1x isomer naming and the F133A energy label remain explicitly discrepant
      or unresolved.
  posed_by: Codex
  posed_date: '2026-10-15'
  notes: R173 is verified in A2QHE5; position 172 is Ala. F437L is verified in deposited 6R2Z despite
    the 2019 F439L prose typo. Obtain missing raw assay/construct details and measured active occupancy;
    absence of detected product is not proof of zero activity under all conditions. Do not equate ScFdc
    native-PAGE migration with a definitive oligomer or use a hypothesized occupancy correction as measured
    turnover. The 2019 Q192N/A and I330A/V primer segments match the specified reference substitutions,
    but only Q192N and I330A/V have Table 2 activity results. Addgene sequence download is login-gated;
    complete insert identity remains unresolved. Preserve Table 1 versus Figure 3 endpoint differences
    and do not fit separate assay contexts as one kinetic series.
