discussions:
  - discussion_id: gxgxg-domain-boundaries-and-assembly-causality
    prompt: Resolve complete GltS constructs and domain-specific interventions before extending GXGXG assembly mechanisms.
    kind: CURATION_TODO
    status: OPEN
    rationale: Whole-complex salt effects and a partly overlapping truncation phenotype do not isolate PF01493 function. The mature-protein offset is resolved, but nucleotide coordinate prose, delta40 expression detection and causal intermediates remain uncertain.
    evidence:
      - reference: PMID:18199747
        supports: PARTIAL
        evidence_source: full_text_and_supplement
        explanation: Main assembly/kinetic Results, relevant Methods/Discussion and supplemental construction/DLS information were inspected. Figure S3 and Table 2 were visually checked. Salt preincubation, assay salt and oligomer composition are not interchangeable interventions; the kinetic correlation and structural electron-transfer scheme are not adopted as observed domain-specific edges.
      - reference: https://files.rcsb.org/download/1EA0.cif
        supports: SUPPORT
        evidence_source: deposited_sequence
        explanation: Exact polymer-reference matching resolves precursor versus mature numbering but does not reconstruct every later assay construct or prove a folding mechanism.
    posed_by: Codex
    posed_date: '2026-10-11'
    notes: FwdC/FmdC, plant/ferredoxin-dependent synthases, other taxa and later experimental studies remain uncurated. Current UniProt oligomer prose is not substituted for the source's heterogeneous hexamer/protomer model. No native physiological regulation or isolated-domain sufficiency is claimed. Partial scientific self-review; IN_PROGRESS.
