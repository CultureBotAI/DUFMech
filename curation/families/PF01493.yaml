  - graph_id: azospirillum-glts-salt-dilution-radius
    title: Salt dilution increases particle radius after GltSHis salt treatment
    scope: Purified wild-type-alpha/His6-beta GltSHis in Cottevieille 2008 Figure S3D; a separate dilution experiment, not full recovery of all original complexes.
    context: A 1.2-mg/ml sample previously incubated for 17 h with 1 M NaCl is diluted tenfold into the same HEPES/EDTA/DTT buffer without NaCl. The matched control is diluted tenfold into buffer containing 1 M NaCl. Calculated final protein is 0.12 mg/ml in both; residual NaCl in the low-salt arm is 0.1 M, not zero. DLS follows radius over approximately 500 s using 10-s acquisitions. General DLS temperature is 15 C; the caption does not separately establish the pretreatment temperature for this panel.
    family_mapping: Q05755 alpha contains PF01493 at precursor 1249-1496, corresponding to mature 1213-1460 after removal of residues 1-36. The exact deposited mature sequence matches the current reference. This assay uses intact alpha/beta complexes with beta, not alpha, carrying the His6 extension.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:192
    limitations: The two arms have matched dilution but different salt concentrations. Increased hydrodynamic size supports reassociation without proving exact stoichiometry, complete recovery, a unique GXGXG-mediated contact or a cellular mechanism. A fitted single-exponential curve and repeated acquisitions are not independent biological replications or an atomistic rate constant.
