causal_graphs:
  - graph_id: azospirillum-glts-salt-radius
    title: Added NaCl lowers the measured radius of purified GltSHis particles
    scope: Recombinant A. brasilense glutamate synthase containing wild-type alpha and C-terminally His6-tagged beta in Cottevieille 2008 Figure S3C; not an isolated GXGXG domain.
    context: Compare 1 mg/ml GltSHis after 17 h at 15 C with 1 M added NaCl or no added NaCl in 25 mM HEPES/KOH pH 7.5, 1 mM EDTA and 1 mM DTT. The plotted DLS radius is measured on the treated preparation. General DLS Methods describe a 50-ul cuvette and twenty 30-s acquisitions; these acquisitions are not independent preparations. The untagged enzyme is reported to behave similarly, but its unshown experiment is not a separate edge.
    family_mapping: Alpha-subunit reference UniProtKB:Q05755 is 1515 aa, sequence version 1; PF01493 spans 1249-1496. UniProt and InterPro sequences agree. PDB 1EA0 polymer 1-1479 exactly matches reference 37-1515, establishing the mature-protein offset of 36 and a mature-domain interval of 1213-1460. The tested complex retains the other alpha domains and beta partner. The reference sequence paper identifies Sp7, but the complete 2008 clones and original donor strain were not independently reconstructed.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:192
    limitations: DLS measures particle-size behavior, not domain-specific contact rupture or unique oligomer composition. SAXS and cryo-EM support an assembly interpretation but use separate measurements and mixture models. Some irreversible subunit loss and activity decrease occur on prolonged salt treatment. This is not salt-dependent cellular regulation, isolated-domain sufficiency or an observed electron-transfer trajectory.
