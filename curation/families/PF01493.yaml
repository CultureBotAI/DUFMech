  - graph_id: azospirillum-glts-delta40-expression
    title: The delta40 alpha construct lacks detectable production in the reported expression attempts
    scope: A. brasilense gltB C-terminal truncation coexpressed with His6-tagged beta in E. coli BL21(DE3), as reported in Cottevieille 2008; an expression phenotype, not directly measured folding failure.
    context: pETGltSHis-derived T7 coproduction constructs encode either wild-type, delta7 or delta40 alpha. Supplemental Methods describe 30-C growth to absorbance about 2 followed by 25 C without IPTG, with delta40 attempts also using 25 C for 6-7 h or 15 C with 0.1 mM IPTG for 17 h. Delta7 production/purification is retained, whereas no truncated delta40 polypeptide production was observed. The main text compares with the productive full-length preparation. No plotted expression gel or detection threshold is supplied for delta40 in the inspected material.
    family_mapping: Q05755 precursor 37-1515 matches mature 1EA0 residues 1-1479. The delta40 deletion maps to precursor 1476-1515, overlapping PF01493 at 1476-1496 and also removing an outside-domain tail. Reverse-complement translation of printed Oligo 3 ends at reference EEHVTETQSRF, residues 1465-1475, followed by two stops. Delta7 removes 1509-1515 outside PF01493; Oligo 2 locally matches the retained terminus. Printed nucleotide stop-position prose does not fully agree with this mapping; whole clones remain unverified.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:192
    limitations: This is a reported negative production endpoint in a heterologous host, not a direct protein-folding, degradation or translation assay. Detection method, quantitative limits, independent clone counts and rescue are not established. The authors' exposed-hydrophobic-core explanation remains an interpretation. The deletion is not restricted to PF01493, and the unaffected delta7 is outside its match; neither result proves isolated-domain assembly function.
