        evidence_source: primary_publication_lead
        explanation: The 2024 multicomponent specificity study remains a full-methods/figure and exact-member follow-up; publisher access returned 403 in this session.
      - reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC11339370/
        supports: PARTIAL
        evidence_source: primary_publication_lead
