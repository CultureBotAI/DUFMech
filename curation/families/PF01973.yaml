  - graph_id: mj1634-folk-complementation-2012
    title: MJ1634 restores growth of an E. coli folK deletion strain
    scope: M. jannaschii MJ1634 expressed in E. coli C600 delta-folK::tetB; heterologous complementation, not a native archaeal deletion phenotype.
    context: pBAD24-derived MJ1634 plasmid; LB with appropriate antibiotics, with or without thymidine, incubated 48 hours. Rescue is observed without arabinose induction. Empty vector, E. coli folK and thymidine supplementation are controls.
    family_mapping: The sequenced genomic MJ1634 clone corresponds to Q59028/NP_248644.1; reference protein is 241 residues with PF01973 at 32-196. The experimental host differs from the archaeal reference taxon.
    scope_status: PHENOTYPIC
    limitations: Growth rescue is an indirect cellular readout. It does not measure native archaeal flux, cofactor concentrations, expression-normalized enzyme efficiency or the sufficiency of the isolated profile interval.
    nodes:
      - node_id: mj1634_expression
        label: MJ1634 expression in the folK-deficient host
        node_type: PERTURBATION
        grounding: ['UniProtKB:Q59028']
      - node_id: growth_without_thymidine
        label: Growth on LB without added thymidine
        node_type: PHENOTYPE
    edges:
      - edge_id: mj1634-enables-growth
        subject: mj1634_expression
        predicate: enables
        object: growth_without_thymidine
        mechanism: The archaeal clone restores growth under conditions in which the empty-vector folK deletion strain is thymidine dependent. Normal host partners remain present; the protein alone is not asserted to synthesize the entire cofactor.
        directness: INDIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:22931285
            source_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC3500442/fullTextXML
            snippet: complemented the dT auxotrophy
            explanation: Genetic-validation Results, original Figure 4B and complementation Methods; Figure 4A concerns the different MJ0408/FolB system and is not this edge.
            cache_path: evidence/PF01973/crecy-2012-mpte.txt
