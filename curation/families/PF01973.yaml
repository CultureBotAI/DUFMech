  - graph_id: amb0685-deletion-2018
    title: Maf deletion disrupts flagellin maturation and motility in AMB-1
    scope: Whole amb0685/maf deletion in Magnetospirillum magneticum AMB-1, currently Paramagnetospirillum magneticum; not a selective PF01973 deletion.
    context: PCR-checked short-linker gene replacement intended to minimize polar effects; AMB-1 grown/manipulated in MG medium at 30 C under microaerophilic conditions. Wild type and in-trans complementation provide comparisons.
    family_mapping: Q2W9I6 sequence 1/entry 87, 666 residues, WP_011383128.1; PF01973 at 259-419, with separate PF20157/PF20156 domains. The paper's central structural region is 273-530. See evidence/PF01973/member-mapping.txt.
    taxon: NCBITaxon:342108
    scope_status: PHENOTYPIC
    limitations: Whole-protein deletion does not isolate catalytic-domain sufficiency. Loss of detectable extracellular Fla is not a measured export rate; filament and motility outcomes are not proof of a direct molecular link. The glycan remains pseudaminic acid or a close derivative, not stereochemically resolved.
