causal_graphs:
  - graph_id: pf0930-pterin-diphosphate-2012
    title: PF0930 produces pterin diphosphate in a purified-protein assay
    scope: Recombinant P. furiosus PF0930/MptE, mapped to Q8U2A9; whole-protein biochemical activity, not isolated-domain sufficiency.
    context: 3.5 ng enzyme with 100 uM 6-HMD and 1 mM ATP in 200 uL containing 8 mM MgCl2, 16 mM DTT and 40 mM TES/KCl pH 7.4; argon, 70 C, 10 minutes. Products detected after iodine oxidation.
    family_mapping: Q8U2A9 sequence 1/entry 94 is the 231-residue PF0930 reference; current InterPro PF01973 match is 37-183 inclusive. The study cloned PF0930 into modified pET24d; exact extra construct residues remain unverified. See evidence/PF01973/member-mapping.txt.
    taxon: NCBITaxon:186497
    scope_status: MECHANISTIC
    limitations: Product identity is supported by chromatography, optical spectra and desalted MS, but no atomic mechanism, native flux or isolated Pfam truncation is tested. CTP/UTP/GTP retain activity, so ATP is not an exclusive donor. The monophosphate peak's origin is unresolved.
    nodes:
      - node_id: enzyme_substrate_mix
        label: PF0930 reaction with 6-HMD, ATP and Mg2+
        node_type: PROCESS
        grounding: ['UniProtKB:Q8U2A9']
      - node_id: pterin_diphosphate
        label: 6-Hydroxymethyl-7,8-dihydropterin diphosphate
        node_type: STATE
    edges:
      - edge_id: pf0930-produces-diphosphate
        subject: enzyme_substrate_mix
        predicate: produces
        object: pterin_diphosphate
        mechanism: Purified PF0930 converts the supplied pterin in the joint reaction mixture to the diphosphorylated product. Zero-time, no-enzyme and matched nonexpressing-extract MonoQ controls support enzyme attribution; the source node does not make any single reagent sufficient.
        directness: DIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:22931285
            source_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC3500442/fullTextXML
            snippet: catalyze the formation of 6-HMDP
            explanation: Results, original Figure 4D and Methods 3.8-3.9; oxidized product matched a standard and desalted LC-ESI-MS/MRM. The figure displays PF0930, not a separate MJ1634 trace.
            cache_path: evidence/PF01973/crecy-2012-mpte.txt
            cache_sha256: 601d231b6582bd80d75b93e37b0302e9364aacdf550993699782873891ce1492
