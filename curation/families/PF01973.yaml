discussions:
  - discussion_id: mpte-substrates-and-constructs
    prompt: Resolve archaeal substrate breadth, constructs and catalytic steps beyond the reported assays.
    kind: CURATION_TODO
    status: OPEN
    rationale: Purified whole-protein reactions and heterologous rescue establish bounded activities, not a universal PF01973 substrate or native archaeal flux.
    evidence:
      - reference: PMID:22931285
        supports: PARTIAL
        evidence_source: primary_publication
        explanation: Original Figure 4 and Methods distinguish displayed PF0930 chemistry from reported similar MJ1634 activity and E. coli complementation. The supporting purity gel concerns MJ1634.
    posed_by: Codex
    posed_date: '2026-10-14'
    notes: Trace the cited PF0930 expression protocol and exact constructs, reconcile 70/80 C purification wording, test natural substrate breadth and catalytic residues, and inspect later structural/biochemical work. A monophosphate workup peak is not a demonstrated enzyme step. See evidence/PF01973/crecy-2012-mpte.txt.
  - discussion_id: maf-chemistry-versus-phenotypes
    prompt: Resolve Maf donor stereochemistry and distinguish residue chemistry from protein stability or expression effects.
    kind: CURATION_TODO
    status: OPEN
    rationale: Deletion/rescue and E324A/D415A perturbations support cellular effects, but do not by themselves demonstrate donor transfer or acid/base catalysis by isolated PF01973.
    evidence:
      - reference: PMID:29076618
        supports: PARTIAL
        evidence_source: primary_publication
        explanation: Figures 1/5/S1/S4 and Methods support scoped phenotypes; Figures 4/S7 are structural/docking proposals. Maf abundance/folding controls and a donor-bound Maf structure are not established by those experiments.
    posed_by: Codex
    posed_date: '2026-10-14'
    notes: Preserve the S283A/D318A/N491A condition-specific negative results. The N494A caption conflicts with Figure 5B, Methods, primers and sequence; use N491A for that control, not an invented variant. The paper's structural 273-530 interval differs from the current 259-419 Pfam match. Do not transfer kinase chemistry to Maf or glycosylation to archaeal MptE.
  - discussion_id: additional-maf-member-contexts
    prompt: Extend PF01973 coverage through individually mapped Maf members and partner-specific experiments.
    kind: CURATION_TODO
    status: OPEN
    rationale: The founding archaeal and AMB-1 experiments do not exhaust later Maf specificity, glycoengineering and other bacterial contexts.
    evidence:
      - reference: doi:10.1002/mbo3.19
        supports: PARTIAL
        evidence_source: primary_publication_lead
        explanation: Aeromonas Maf1 study identified for a separate full-text, construct and domain-mapping assessment; not used as evidence for the current graphs.
      - reference: https://www.sciencedirect.com/science/article/pii/S0960982224007012
