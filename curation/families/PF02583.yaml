  - graph_id: bsub-csor-null-copza-reporter
    title: Loss of csoR increases copZA reporter output without added copper
    scope: Whole-gene csoR replacement in B. subtilis CU1065 derivatives carrying SPbeta(PcopZA-cat-lacZ); a cellular reporter phenotype, not direct polymerase exclusion.
    context: HB7352 csoR::spc is compared with HB7358 reporter control and HB7356 csoR::spc amyE::csoR-cat complementation. Overnight cultures were diluted 1:100 into LB and grown to mid-exponential phase at 37 C and 225 rpm. The adopted edge is the no-added-CuSO4 comparison; the figure also includes 0.5 mM CuSO4. Figure 2A states three experiments with total N=7.
    family_mapping: CU1065 is a W168 attSPbeta trpC2 derivative. Its yvgZ/csoR locus corresponds to reference O32222, BSU33520, sequence version 1, PF02583 at 17-97 of 101 residues. Whole-gene replacement does not establish an isolated-domain effect.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:224308
    limitations: Beta-galactosidase activity is reporter output, not a direct measurement of native copZA RNA, polymerase occupancy or copper efflux. Ectopic complementation supports gene dependence without resolving each intervening step. The paper corrects an earlier YhdQ/CueR assignment caused by a wrong reporter in the old strain; that claim is not combined with this graph. Other family members and growth endpoints remain separate.
    nodes:
