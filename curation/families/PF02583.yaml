causal_graphs:
  - graph_id: bsub-csor-copper-operator-binding
    title: Copper loading reduces purified B. subtilis CsoR operator binding
    scope: Intact purified B. subtilis CsoR compared in apo and Cu(I)-loaded states on a synthetic copZA operator; not cellular transcription or an isolated PF02583 domain.
    context: Figure 7A fluorescence anisotropy uses 4 nM labeled 30-bp operator DNA, 10 mM MES, 0.4 M NaCl, 2 mM DTT, pH 6.5 and 25 C. Protein was expressed in E. coli BL21(DE3) from a Helmann-laboratory pET16b construct. Five readings were averaged at each titration addition.
    family_mapping: B. subtilis csoR, formerly yvgZ, is BSU33520 and maps to UniProtKB:O32222, reference sequence version 1, 101 residues, PF02583 at 17-97. The assay uses intact protein, not that isolated interval; exact final tag and construct sequence remain unverified.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:224308
    limitations: The Cu-loaded curve is unsaturated and fitted using the apo maximum anisotropy. The second binding constant is only an upper bound, and individual step constants are not uniquely resolved. E90A loses negative regulation, but no atomic allosteric path is established. Low-micromolar tetramer observations do not exclude nanomolar assembly differences. No family-wide copper specificity, transcription endpoint or cellular efflux is inferred.
