discussions:
  - discussion_id: csor-members-and-allosteric-limits
    prompt: Resolve exact purified-construct details and assess additional member-specific CsoR/RcnR contexts before extending these graphs.
    kind: CURATION_TODO
    status: OPEN
    rationale: The binding and complemented reporter studies support separate B. subtilis effects. The family spans other regulators, and structural allosteric steps, other promoters and metal specificity require their own experiments.
    evidence:
      - reference: PMID:19249860
        supports: PARTIAL
        evidence_source: full_text
        explanation: Figure 7 was visually inspected. The E90A result supports coupling but not a resolved atomic pathway; weak Ni/Zn coupling must not be recast as universally absent activity.
      - reference: PMID:18048925
        supports: PARTIAL
        evidence_source: full_text
        explanation: Figure 2 and strain/reporter methods were inspected; complementation supports the genetic phenotype. The earlier YhdQ assignment is explicitly corrected by this source.
    posed_by: Codex
    posed_date: '2026-10-11'
    notes: No continuous observed chain from copper exposure through efflux and growth is asserted. Raw data, other family members, indirect ycnKJI regulation and a complete structural mechanism remain outside this partial review.
