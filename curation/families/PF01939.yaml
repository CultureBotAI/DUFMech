- graph_id: cgl-mn-cleavage-and-clamp-2018
  title: CglEndoMS cleavage and clamp effects in the Mn assay
  scope: Ishino2018 Figures3/4 and Table1.
  context: N-terminally His-tagged CglEndoMS; default30C,pH6.4,2.5mM MnCl2,45-bp G/T duplex. Cognate beta-clamp
    addition and separate SPR binding assay.
  family_mapping: ATCC13032 NCgl1168/CGL_RS06055 maps via NCBI Gene1019198 and WP_011014205.1 to Q8NR49
    v1,230 aa. PF01939 110-230; PF21003 2-103. Not strainR A4QDH7. DeltaCter removes ELTLF226-230 within
    PF01939.
  taxon: NCBITaxon:196627
  scope_status: MECHANISTIC
  limitations: Five-nucleotide product assignment conflicts with Takemoto2018's three-nucleotide report
    under different conditions. No universal Mn-only requirement is asserted. Homology-model residue numbering
    is not Cgl numbering; mutant folding is not independently established.
