discussions:
- discussion_id: pf01939-cleavage-geometry
  prompt: Reconcile the two C. glutamicum cleavage-product reports without erasing their different assay
    contexts.
  kind: CURATION_TODO
  status: OPEN
  rationale: Both studies use ATCC13032 yet report three- versus five-nucleotide overhangs; their metal,
    pH, substrate, tag and truncation contexts differ.
  evidence:
  - reference: PMID:29878158
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Compare original product assignments and later primary evidence. Differences are possible
      explanatory variables, not an established cause. Ishino deltaCter removes five residues; Takemoto
      Cdel removes two.
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: See evidence/PF01939/coverage.txt; partial scientific curation, not family-wide completion.
- discussion_id: pf01939-native-repair-and-coverage
  prompt: Extend accession-mapped native repair and other-member graphs without assuming a universal DSB-to-HR
    pathway.
  kind: CURATION_TODO
  status: OPEN
  rationale: Biochemical cleavage and cellular mutation readouts do not establish the complete intervening
    pathway; later M. smegmatis work favors short-range repair.
  evidence:
  - reference: PMID:39417425
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Inspect all remaining relevant figures, supplements and exact constructs, including P.abyssi2012/2014,
      Tko structures, S.islandicus, T.gammatolerans and M.smegmatis. Preserve nick-versus-DSB and exonuclease-versus-flap
      alternatives. All family members and previous follow-ups remain in scope.
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: See evidence/PF01939/coverage.txt; partial scientific curation, not family-wide completion.
