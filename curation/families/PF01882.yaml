discussions:
  - discussion_id: slr2013-genetic-specificity-and-domain-mechanism
    prompt: Resolve Slr2013 allele specificity and the contribution of DUF58 to the conditional photosynthetic phenotype.
    kind: CURATION_TODO
    status: OPEN
    rationale: The Y294Stop suppressor disrupts part of DUF58 and a C-terminal extension in a D2-mutant context. Whole-cell oxygen and growth rescue do not distinguish protein quality control, indirect expression effects or another mechanism. The observed phenotypes cannot be assigned to every DUF58 member.
    evidence:
      - reference: PMID:14594835
        supports: PARTIAL
        evidence_source: full_text
        explanation: Methods, Table 2, mapping and deletion Results, alternate D2 backgrounds, Discussion and Figures 1/7 were inspected. Mutant-region transfer did not restore photoautotrophy in D2 E69Q or V247M/A249T backgrounds. Incomplete segregation of deletion constructs is not a viable null phenotype or proof of a specific essential chemistry.
      - reference: https://www.ebi.ac.uk/interpro/api/protein/uniprot/P73233/entry/pfam/PF01882/
        supports: PARTIAL
        evidence_source: database
        explanation: The current domain spans residues 195-385, so the predicted stop product retains part of it. Neither current database naming nor the frozen P71138 misannotation discussion supplies Slr2013 enzyme chemistry.
    posed_by: Codex
    posed_date: '2026-10-11'
    notes: Establish reconstructed-allele and reciprocal rescue results, protein product and abundance, and domain-selective experiments before assigning molecular edges. PS I-less comparisons also change the D2 background and are not attributed solely to Slr2013. Other members, later publications and raw spectroscopic traces remain incompletely reviewed; the imported family description and classification are preserved.
