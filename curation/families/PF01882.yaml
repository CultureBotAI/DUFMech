        object: intact-cell-oxygen-evolution
        mechanism: In the specified intact-cell assay, Rg2 oxygen evolution is 275 +/- 35 umol O2 per mg chlorophyll per hour versus 0 in T192H. WT is 256 +/- 28 and WT-D2-restored T192T/Y294Stop is 248 +/- 32. This supports recovery from the T192H defect, not enhancement over WT or an isolated-domain reaction. Oxygen evolution and growth are parallel measured outcomes, not an experimentally resolved causal chain between them.
