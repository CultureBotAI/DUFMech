causal_graphs:
  - graph_id: slr2013-y294stop-d2-t192h-suppression
    title: Slr2013 Y294Stop suppresses D2-T192H photosynthetic defects
    scope: Synechocystis sp. PCC 6803 Rg2 suppressor retaining psbDI-T192H and deletion of psbDII, compared with the T192H parent. The additional slr2013 Y294Stop allele was identified by suppressor mapping; this is not an isolated DUF58 assay or a clean full-gene deletion.
    context: PS I-retaining cells grown in BG-11 at 30 C and 40 umol photons per square meter per second; liquid culture at 120 rpm. Photoautotrophy omits glucose. Oxygen evolution uses intact cells at 5 ug chlorophyll/mL, a Clark electrode, 0.1 mM 2,5-dimethyl-p-benzoquinone and 0.5 mM potassium ferricyanide, illuminated above 580 nm at 1 mmol photons per square meter per second. The oxygen-assay temperature is not explicitly specified and parental maintenance atrazine is not assigned to this assay. Table 2 reports means and SD from three independent experiments.
    family_mapping: Slr2013 is UniProtKB:P73233 (NCBIProtein:BAA17260.1), a 435-residue Kazusa reference, taxon 1111708, sequence version 1. UniProt and InterPro sequences agree; PF01882 maps at 195-385 inclusive and reference residue 294 is Y. The stop predicts retention of residues 1-293, including DUF58 residues 195-293, and loss of residues 294-435, including the remaining domain and a C-terminal extension. This is neither a whole-domain deletion nor proof of domain sufficiency. The laboratory PCC 6803 substrain is not equated with the complete Kazusa reference genome.
    scope_status: PHENOTYPIC
    limitations: Genomic-fragment mapping and transfer of a PCR-amplified mutant region support the suppressor attribution, but an independently reconstructed single-base allele and reciprocal full-length Slr2013 rescue are not established here. The mapped region contains additional genes and possible cotranscription. The predicted 293-residue product was not directly measured here. Restoring WT D2 while retaining Y294Stop yields near-WT growth and oxygen evolution; other tested D2 mutants were not rescued. Chaperone and protease interpretations remain alternatives, not demonstrated direct chemistry.
