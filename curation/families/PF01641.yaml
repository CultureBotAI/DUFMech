- graph_id: selr-yeast-two-mm-peroxide-growth
  title: SelR deletion delays growth at 2 mM peroxide and strongly worsens MsrA loss
  scope: BY4741 WT, SelR deletion, MsrA deletion GY4 and double deletion GY5, Kryukov 2002 Figure 2B;
    separate from zero/0.5-mM liquid assays and 0.7-mM plate spots.
  context: Supplemented YNB, initial OD600 0.05, 30 C, 250 rpm, 2 mM hydrogen peroxide, about 14 h. Compare
    SelR deletion with WT and additional SelR loss with the MsrA-only mutant. The original BY4741 MAT-alpha
    notation and unspecified detailed supplement recipe remain unresolved.
  family_mapping: YCL033C/MXR2 corresponds to S288c P25566, PF01641 47-166 of 168 aa. The assay deletes
    the whole gene in BY4741 derivatives, not the isolated domain, the mouse selenoprotein or the fly
    isoform.
  scope_status: PHENOTYPIC
  limitations: SelR-only deletion mainly delays early/mid growth and approaches the final WT OD600; it
    is not a demonstrated lower eventual yield. The double mutant lacks substantial OD600 increase within
    the displayed window, not proof of permanent inability to grow or cell death. No SelR rescue, quantitative
    statistical test or direct repair-flux measurement is shown.
