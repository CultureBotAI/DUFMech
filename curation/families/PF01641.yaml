- graph_id: selr-yeast-msra-background-basal-growth
  title: SelR loss reduces basal yeast growth in an MsrA-deleted background
  scope: BY4741-derived MsrA deletion GY4 versus SelR/MsrA double deletion GY5, Kryukov 2002 Figure 2A;
    this is an additional SelR-loss effect conditional on MsrA absence.
  context: Stationary overnight cultures diluted to OD600 0.05 in supplemented YNB, 30 C, 250 rpm, no
    added peroxide, observed for about 14 h. SelR/YCL033C is replaced by KAN-R and MsrA by URA3; MsrA
    deletion is PCR checked. Methods prints MAT-alpha for BY4741, an unresolved historical notation; exact
    supplement composition is not enumerated in the caption.
  family_mapping: Deleted YCL033C corresponds to MXR2/MSRB reference P25566, 168 aa, with PF01641 47-166.
    P25566 is S288c reference grounding, not a resequenced experimental BY4741 isolate. Whole-gene loss
    does not establish isolated-domain activity or the molecular cause of the growth effect.
  scope_status: PHENOTYPIC
  limitations: The double mutant accumulates biomass more slowly, whereas SelR-only and MsrA-only deletions
    approximately track WT without peroxide. No target-gene complementation, replicate/error bars, fitted
    growth rate or direct intracellular repair measurement is shown. The conditional effect is not evidence
    that SelR alone is universally essential for growth.
  nodes:
