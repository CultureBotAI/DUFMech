- graph_id: selr-mouse-u95c-dabsyl-r-sulfoxide-reduction
  title: The mouse SelR Cys-for-Sec construct produces dabsyl methionine
  scope: Purified mouse SelR U95C construct, Kryukov 2002 Figure 3A; this is not an assay of native Sec-containing
    mouse MsrB1.
  context: Full SelR coding region cloned into pET21d(+), expressed in E. coli BL21(DE3), purified by
    DEAE flow-through and heparin HPLC. Dabsyl R- or S-sulfoxide assays in the presence of DTT, HPLC at
    436 nm. Exact assay doses and duration are not restated in this paper. Complete vector-derived termini
    were not independently determined; tag-free native sequence is not asserted.
  family_mapping: Current Q9JLC3 is 116 aa with Sec95 and PF01641 12-105. The 2001 archived sequence uses
    C95 with explicit SE_CYS95 annotation and otherwise exactly matches today's reference, supporting
    the historical numbering but not a natural cysteine allele. The tested Cys-for-Sec protein maps to
    U95C within the domain. Terminal PCR coding sequences are consistent with this reference.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:10090
  limitations: Figure 3A shows product with R substrate and not S, but does not display a matched mouse
    R-substrate/no-enzyme trace; Figure 3B's controls use the separate fly preparation. No native-Sec
    versus U95C rate ratio, selenium requirement, physiological substrate, isolated-domain sufficiency
    or resolved catalytic intermediate is measured. Methionine sulfone is also reported negative.
  nodes:
