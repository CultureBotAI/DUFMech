- graph_id: selr-yeast-half-mm-peroxide-growth
  title: Additional SelR loss impairs the MsrA mutant at 0.5 mM peroxide
  scope: BY4741-derived MsrA deletion GY4 versus double deletion GY5, Kryukov 2002 Figure 2C; separate
    from the higher-dose peroxide series.
  context: Supplemented YNB, initial OD600 0.05, 30 C, 250 rpm, 0.5 mM hydrogen peroxide, about 14 h.
    SelR-only and MsrA-only strains approximately track WT in this series. Detailed medium supplements
    and the Methods' BY4741 mating-type notation remain unresolved.
  family_mapping: Whole YCL033C/MXR2 deletion, reference P25566 with PF01641 47-166; protein-source grounding
    is S288c, while tested backgrounds are BY4741 derivatives. This does not establish a domain-only perturbation
    or a newly verified isolate sequence.
  scope_status: PHENOTYPIC
  limitations: The double mutant shows residual growth, so complete inactivity and death are not asserted.
    No within-strain peroxide dose-response edge is inferred by combining separate series, and no rescue
    or direct intracellular repair measurement is supplied. The lack of a clear SelR-only effect at 0.5
    mM is retained rather than transferring the 2-mM result.
