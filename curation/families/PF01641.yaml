discussions:
- discussion_id: pf01641-selr-causal-coverage
  prompt: Retrieve the remaining SelR mutagenesis and intermediate-trapping results, resolve assay and
    construct details, and extend member-specific causal coverage.
  kind: CURATION_TODO
  status: OPEN
  rationale: Two direct product assays and four indirect yeast-growth effects do not establish a complete
    catalytic cycle or universal PF01641 mechanism. Species, isoform, reductant, substrate derivatization
    and genotype backgrounds are distinct.
  evidence:
  - reference: PMID:11929995
    supports: PARTIAL
    evidence_source: full_text_and_visually_inspected_figures_1_2_3_4
    explanation: Experimental 155-aa fly isoform differs from the predicted alignment sequence. Mouse
      U95C is not native Sec-containing enzyme. Growth with both sulfoxide isomers is not direct stereospecific
      chemistry, metal stoichiometry is not proof of zinc necessity, and no SelR rescue is shown. Retain
      unreported exact biochemical doses/timing, unresolved mouse vector tails, BY4741 mating-type notation
      and incomplete medium recipe.
  - reference: PMID:12145281
    supports: PARTIAL
    evidence_source: abstract_methods_and_initial_results_only
    explanation: Later JBC paper describes C124/C69 intermediates, zinc-site mutants and heterologous
      yeast rescue. Remaining Results and figures were inaccessible after partial indexed-PDF text; those
      claims are follow-up targets, not adopted causal edges. Its 10-versus-20-mM DTT Methods discrepancy
      also remains unresolved and is not assigned to the PNAS assay.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: Current canonical fly61-186 maps to isoform19-133 by annotated deletions, not a new HMM test.
    Native selenium is part of Sec, not established as a bound ligand. Basal/0.5-mM SelR-only near-WT
    growth and separate plate-utilization effects remain visible in retained evidence. Partial scientific
    self-review; IN_PROGRESS.
