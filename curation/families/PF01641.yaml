causal_graphs:
- graph_id: selr-fly-dabsyl-r-sulfoxide-reduction
  title: Purified Drosophila SelR produces dabsyl methionine from the R-sulfoxide
  scope: N-terminal His6-tagged Drosophila melanogaster SelR, 155-aa native insert, Kryukov 2002 Figure
    3B; separate from mouse U95C and the yeast deletions.
  context: Experimental cDNA AF486578.1 encodes AAM10931.1; pET28a expression in E. coli BL21(DE3), Talon
    affinity purification. Separate dabsyl-L-methionine R- and S-sulfoxides tested with and without enzyme
    in the DTT assay context. HPLC detection at 436 nm. This paper refers to an earlier protocol without
    restating all enzyme/substrate/reductant doses or reaction duration; later JBC assay numbers are not
    retroactively assigned.
  family_mapping: AAM10931.1 exactly matches UniProt Q8INK9-2, 155-aa isoform A/I, not the current 208-aa
    canonical protein. Canonical PF01641 61-186 projects to isoform 19-133 after annotated deletions of
    canonical 1-42 and 134-144. This is coordinate transfer, not a fresh isoform HMM hit. The 166-aa predicted
    ORF in the paper's alignment retains the internal 11 residues absent from the tested clone. His6/vector
    residues are outside this mapping.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:7227
  limitations: Product formation in a purified assay is observed; it does not measure reduction of an
    intact oxidized protein, physiological electron-donor specificity, free-methionine utilization or
    a complete catalytic cycle. The S substrate is negative under the displayed conditions. The 1.5-min
    impurity peak is not product. C124 sulfenic-acid and C69 disulfide steps from later work remain unadopted
    pending inspection of its Results and figures.
  nodes:
