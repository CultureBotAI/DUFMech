- discussion_id: fog2-translational-model-and-family-coverage
  prompt: Test the molecular mediator without promoting a genetic model into an observed causal chain.
  kind: CURATION_TODO
  status: OPEN
  rationale: Tagged TRA-2 partly suppresses q71, while FOG-2 loss does not detectably raise germline TRA-2
    in the inspected assay. The sensitized e2020 result does not establish a specific alternative RNA
    target or GLD-1 independence.
  evidence:
  - reference: PMID:30599151
    supports: PARTIAL
    evidence_source: primary_methods_tables_1_2_3_results_discussion_and_figures_3_6
    explanation: Genotype effects, negative expression readouts, detection limits and model assumptions
      remain separate. Table 2 Fog includes self-fertile animals and its genotyped subset is phenotype-selected.
  notes: See evidence/PF01827/hu-2019-fog2.txt and fog2-gap-ledger.txt. Resolve nm75/nmIs4 labeling and
    measurement sensitivity, inspect uncurated gene-conversion and mating studies, and independently map
    other FTR/FTH members. No direct ubiquitination, universal RNA-binding or family-wide sexual-fate
    mechanism is adopted. Keep IN_PROGRESS with partial self-review.
  posed_by: Codex
  posed_date: '2026-10-11'
