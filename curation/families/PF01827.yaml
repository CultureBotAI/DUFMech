- graph_id: fog2-terminal-truncation-reporter
  title: FOG-2 terminal truncations reduce GLD-1 two-hybrid output
  scope: 'Nayak 2005 Figure 4D: 327-aa C. elegans FOG-2 and constructs ending at residues 318, 299, 263
    or 251, tested in yeast.'
  context: GLD-1 in pAS1 and FOG-2 derivatives in pACTII per Methods, with 20 mM 3-amino-triazole. The
    inherited Y190 two-hybrid protocol uses selective growth and beta-galactosidase reporting; the plotted
    plus signs are ordinal and not calibrated binding constants. SKR-1 interaction is retained in every
    displayed truncation.
  family_mapping: Historical AL110477.1 splice reconstruction exactly matches 327-aa Q2YS43/CAJ43447.1;
    current PF01827 is 144-271, separate F-box 20-59. The 318/299 truncations remove tail only; 263/251
    remove domain 264-271/252-271 plus tail. None isolates the entire FTH domain.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:6239
  limitations: INDIRECT construct effects on a yeast reporter, not purified binding affinity or worm sexual
    fate. Folding, fusion geometry and abundance may contribute despite retained SKR-1 output. Figure
    4 labels derivatives Bait whereas Methods places them in activation fusions. Replicate count and quantitative
    reporter calibration are not supplied.
