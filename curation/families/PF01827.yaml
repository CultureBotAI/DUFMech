- graph_id: fog2-q71-sensitized-germline
  title: Loss of FOG-2 shifts germline fate despite the tra-2 UTR deletion
  scope: 'Hu 2019 Table 2: tra-2(e2020); fem-3(q95) families segregating fog-2(q71), not an otherwise
    wild-type population.'
  context: Temperature-sensitive fem-3(q95) strains maintained at 15 C; embryos shifted to 25 C and grown
    to adults. Oocyte presence scored by compound microscopy, followed by PCR/sequencing of a phenotype-selected
    subset. Detailed strain construction retains unc-24(e138) and dpy-20(e1282) markers on IV.
  family_mapping: fog-2(q71) is W148stop in the 327-aa Q2YS43/CAJ43447.1 reference, within PF01827 144-271
    but truncating most of the domain and tail. Genotype perturbation is not a single-residue binding
    experiment. The 108-nt tra-2(e2020) deletion is in a different gene's 3-prime UTR.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:6239
  limitations: INDIRECT genetic effect. Fog includes self-fertile animals and does not mean sperm-free.
    Sequencing followed phenotyping, so 11/11 is not an unbiased penetrance estimate. Remaining in-vivo
    RNA contacts, alternative targets and GLD-1-independent functions are not distinguished. A brief Methods
    chromosome-I label for fem-3 conflicts with the detailed IV strain construction.
  nodes:
  - node_id: homozygous-q71-in-e2020-q95
    label: Make fog-2(q71) homozygous in the e2020/q95 sensitized background
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q2YS43
  - node_id: oocyte-producing-germline
    label: Oocyte-producing germline outcome instead of the Mog phenotype
    node_type: PHENOTYPE
  edges:
  - edge_id: q71-increases-oocyte-outcome
    subject: homozygous-q71-in-e2020-q95
    predicate: increases
    object: oocyte-producing-germline
    mechanism: All eleven sequenced q71 homozygotes occur in the oocyte-positive group; four WT and five
      heterozygous siblings occur in Mog, with one heterozygote in Fog. The segregating-family result
      supports a feminizing effect in this background without resolving its molecular mediator.
    directness: INDIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:30599151
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9200065/?report=reader
      snippet: presence of oocytes
      explanation: Primary Table 2, strain Methods and sensitivity Results; 109 phenotyped animals but
        only 21 selectively sequenced. No measured translation rate or family-wide effect.
      cache_path: evidence/PF01827/hu-2019-fog2.txt
      cache_sha256: 288317e84560c9a543bdee0f2015244b93bbac492a690e11aca6b8cf71b652e5
- graph_id: fog2-tra2-tagged-suppression
  title: Modified TRA-2 partially suppresses the FOG-2-null self-fertility defect
  scope: 'Hu 2019 Results near Figure 3: XX tra-2(nm75); fog-2(q71) double mutants compared with the reported
    untagged q71 phenotype.'
  context: Endogenous nine-residue HA insertion four amino acids before the TRA-2 stop; CP153 derived
    from JK574 and CP139/CP141, with q71 sequencing and tagged-locus PCR confirmation. Default NGM culture
    at 20 C; 40 double-mutant animals scored for self-fertility.
  family_mapping: The deficient member is FOG-2 Q2YS43/CAJ43447.1, PF01827 144-271, affected by W148stop.
    The intervention alters separate TRA-2, not FOG-2, its FTH domain or an equivalent family member.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:6239
  limitations: INDIRECT genetic suppression, not same-gene rescue or a direct binding/translation measurement.
    Precise scoring age, biological replicate breakdown and contemporaneous untagged denominator are unstated.
    Figure 3B says nmIs4 while Methods/caption and Figure 6 say nm75. The tagged allele is not a neutral
    reporter, and suppression remains partial.
  nodes:
  - node_id: insert-tra2-ha-in-q71
    label: Introduce homozygous endogenous tra-2(nm75) into fog-2(q71)
    node_type: PERTURBATION
  - node_id: self-fertility-in-q71
    label: Self-fertility among XX fog-2(q71) animals
    node_type: PHENOTYPE
  edges:
  - edge_id: tra2-modification-increases-self-fertility
    subject: insert-tra2-ha-in-q71
    predicate: increases
    object: self-fertility-in-q71
    mechanism: Self-fertility is reported in 35% of 40 double-mutant animals despite the untagged q71
      sperm-deficient baseline. This supports partial compensation by altered TRA-2, not restoration of
      FOG-2 protein or a quantified repression constant.
    directness: INDIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:30599151
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9200065/?report=reader
      snippet: 35% (N=40)
      explanation: Expression Results and strain/CRISPR Methods; Figure 3/6 images inspected for the separate
