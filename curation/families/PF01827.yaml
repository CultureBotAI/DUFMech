  - reference: PMID:11076749
    supports: PARTIAL
    evidence_source: primary_paper_transcription_methods_results_and_table_1
    explanation: RNAi, historical sequence and mutant-binding information constrain whole-gene effects;
      exact RNAi controls and clone lengths need follow-up.
  notes: See evidence/PF01827/FOG2-identity.txt and paired primary notes. Historical AL110477.1 splice
    reconstruction exactly matches Q2YS43, but tagged clones and chimera junctions were not independently
    sequenced. G219R and G271R/E phenotypes are not loss-of-GLD-1-binding proof. Obtain domain-specific
    orthogonal assays and rescue.
  posed_by: Codex
