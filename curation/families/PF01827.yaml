      source_url: https://www.researchgate.net/publication/351297301_FOG-2_a_novel_F-box_containing_protein_associates_with_the_GLD-1_RNA_binding_protein_and_directs_male_sex_determination_in_the_C_elegans_hermaphrodite_germline
      snippet: 91% of gonad arms
