- graph_id: fog2-ftr1-exon-transfer-reporter
  title: A FOG-2 terminal segment confers GLD-1 reporter interaction on FTR-1
  scope: 'Nayak 2005 Figure 4B/D: FTR-1 versus the FTR-1/FOG-2 exon-4 chimera.'
  context: Same yeast two-hybrid setup as the truncation study, 20 mM 3-amino-triazole and retained SKR-1
    positive interaction. Methods specify GLD-1 pAS1 and derivatives pACTII; the image Bait heading conflicts
    with this orientation.
  family_mapping: FOG-2 Q2YS43/CAJ43447.1 is 327 aa, PF01827 144-271; FTR-1 G5EC06/CAB54326.1 is 314 aa,
    PF01827 146-283. Figure 4B shows FOG-2 segment 254-327, combining domain 254-271 with tail 272-327.
    The experiment is a protein chimera, not purified FTH sufficiency.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:6239
  limitations: INDIRECT reporter effect. FTR-1 is 314 aa in the image/reference but 318 aa in Methods;
    exact historical chimera junctions remain unverified. The +++ chimera signal is not identical to ++++
    FOG-2. No worm rescue, translational repression assay or family-wide GLD-1-binding transfer is established.
  nodes:
  - node_id: transfer-fog2-terminal-exon
    label: Replace the FTR-1 terminal segment with reported FOG-2 exon 4
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q2YS43
    - UniProtKB:G5EC06
  - node_id: chimera-gld1-reporter
    label: GLD-1-dependent yeast two-hybrid output of the chimera
    node_type: PHENOTYPE
  edges:
  - edge_id: exon-transfer-increases-reporter
    subject: transfer-fog2-terminal-exon
    predicate: increases
    object: chimera-gld1-reporter
    mechanism: FTR-1 has no detected GLD-1 signal, whereas the 327-aa chimera scores +++; both retain
      ++++ SKR-1 interaction. The transferred segment confers this assay behavior only within the tested
      FTR-1 fusion context.
    directness: INDIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:15630478
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC539060/
      snippet: Constructs and transformation
      explanation: Figure 4D final two rows and Figure 4B terminal alignment, with the 314/318 and exon-boundary
        discrepancies retained.
      cache_path: evidence/PF01827/nayak-2005-fog2.txt
      cache_sha256: 3e2298c0efb128ed82d8abae84de9881fc6e8494c5e2cc62e4f2e73b56f78eaa
- graph_id: fog2-rnai-xx-germline
  title: FOG-2-directed RNAi feminizes somatically female germlines
  scope: 'Clifford 2000 Results: CD13.1-derived double-stranded RNA and sexual phenotype of cross-progeny.'
  context: C. elegans, default 20 C culture; 292 gonad arms from somatically female cross-progeny and
    100 male siblings examined. Exact RNAi dose, delivery details, scoring age and contemporaneous untreated
    counts are not resolved in the inspected primary-paper transcription.
  family_mapping: CD13.1 maps to fog-2/Y113G7B.5; historical genomic reconstruction matches 327-aa Q2YS43/CAJ43447.1,
    PF01827 144-271. RNAi perturbs the transcript/whole protein, not a specific FTH surface.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:6239
  limitations: INDIRECT organism phenotype with incomplete protocol/control detail. The denominator is
    gonad arms, not independent animals. Male siblings show no reported sexual defect, so the result is
    not generalized to XO spermatogenesis. No measured TRA-2 translation rate, RNAi-resistant rescue or
    isolated-domain mechanism.
  nodes:
  - node_id: fog2-cd13-rnai
    label: Introduce CD13.1-derived fog-2 double-stranded RNA
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q2YS43
  - node_id: feminized-xx-gonad-arms
    label: Oocyte-producing instead of normally sperm-producing gonad arms
    node_type: PHENOTYPE
  edges:
  - edge_id: fog2-rnai-increases-feminization
    subject: fog2-cd13-rnai
    predicate: increases
    object: feminized-xx-gonad-arms
    mechanism: The reported RNAi treatment yields feminization in 91% of 292 somatically female gonad
      arms, while male siblings lack the sexual defect. This is the reported intervention phenotype, without
      a reconstructed untreated effect-size estimate.
    directness: INDIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
