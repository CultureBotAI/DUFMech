- graph_id: human-pdcd5-atpalfx-bead-release-2025
  title: ATP/AlFx treatment releases TRiC from immobilized PDCD5
  scope: Xing2025 ED7h-j; PDCD5-Flag/TRiC captured from HEK293F and treated on anti-Flag beads.
  context: Captured complex incubated1h at37C in lysis buffer with1mM ATP,5mM Al(NO3)3,30mM NaF,then three treatment-buffer washes; matched no-ATP/AlFx control. Western blot quantifies supernatant/bead CCT1, n=4,SD.
  family_mapping: Human PDCD5 reference O14737 sequence3,125aa,PF01984 match9-114; full Flag-tagged protein and endogenous human TRiC, not isolated domain. Physical insert/tag linker not independently authenticated.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:9606
  limitations: DIRECT refers only to treatment-induced complex separation measured in this cell-free captured preparation. It does not prove an elementary ring-motion mechanism, ATP-alone sufficiency, substrate release, or PDCD5 detachment from the beads. Co-purified components are not exhaustively excluded.
