- graph_id: human-pdcd5-ko-thermal-profiles-2025
  title: PDCD5-knockout cell line has higher soluble actin and tubulin heat-challenge signals
  scope: Xing2025 Supplementary Fig.7e-h; commercial HEK293T PDCD5-knockout ab266229 versus WT ab255449.
  context: DMEM/10%FBS,37C/5%CO2;5e5 cells per PBS aliquot heated3min,lysed40min at4C,aggregates removed. Soluble immunoblots normalized to GAPDH. Actin44.1-62C after37C reference; tubulin56.8-62.1C in a distinct series. n=2 independent experiments,SD.
  family_mapping: Human PDCD5 reference O14737 sequence3 contains PF01984 at9-114. The whole-gene cell-line comparison does not establish an isolated-domain effect or authenticate the knockout allele. Actin/tubulin antibody readouts are not assigned to a fabricated single substrate accession.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:9606
  limitations: No established rescue/clone control proves a target-specific pathway here. Higher mean soluble signal is not a folding rate or significant difference at every point. Tubulin starts with different baseline abundance; intrinsic stabilization, TRiC dependence and substrate release remain unresolved. The two temperature series are not one continuous assay.
