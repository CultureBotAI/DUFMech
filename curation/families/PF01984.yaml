  title: PDCD5 I93G/L96G lowers normalized CCT1 co-immunoprecipitation
  scope: Xing2025 ED6f/g, full-length human PDCD5-Flag WT versus combined I93G/L96G in HEK293F.
  context: Constructs expressed48h;500ug clarified lysate with20uL anti-Flag M2 beads,1h at4C,three washes. PBS pH7.4,0.1%IGEPAL,5mM MgCl2,PMSF/inhibitors. CCT1 IP divided by PDCD5 IP, normalized to WT; input/empty-construct and GAPDH controls.
  family_mapping: O14737 sequence3,125aa,NCBITaxon9606 has PF01984 match9-114. I93 and L96 verified by direct sequence indexing. Full Flag-tagged protein was tested; no isolated-domain sufficiency or physical-insert authentication.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:9606
  limitations: Association readout, not a folding rate or atomic contact mechanism. ED6 caption/source images show5replicates; Methods numerical summary says4. No uniform complete binding loss is claimed; folding/localization effects are not excluded. RKK co-IP is excluded because its expression is low.
