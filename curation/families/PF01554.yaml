- graph_id: norm-vc-sodium-binding-and-substitutions
  title: Sodium enhances low-concentration ethidium binding in WT but not three NorM-VC variants
  scope: Purified N-terminal His10-tagged NorM-VC WT and single substitutions D36N, E255Q and D371N, Raturi
    2021 Figure 4A; paper residue numbering retained.
  context: Protein is purified from L. lactis membranes using DDM and Ni-NTA. Titrations contain 2 uM
    ethidium, 50 mM KPi pH 7.0, 0.2 mM KCl and 0.05% DDM, with 0.036-1 uM protein and either no added
    sodium or 0.5 mM Na2SO4 (1 mM Na+). Fluorescence anisotropy uses 500/580 nm excitation/emission after
    about 2 min equilibration and matched elution-buffer baseline. Three independent protein preparations
    are reported, mean +/- SEM.
  family_mapping: Historical AAF94694.1 D36/E255/D371 correspond to current Q9KRU4 D32/E251/D367, verified
    by sequence comparison. D32 lies in PF01554 17-176 and E251/D367 in 243-404. Current protein begins
    MHRY whereas the historical reference begins MENSVHRY; current sequence is M plus historical residues
    6-461, not simply historical residues 5-461. Mutant labels refer to the paper's numbering, not current
    UniProt coordinates.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:243277
  limitations: Directness describes the purified-protein binding response, not an observed atomic sodium-coordination
    or transport step. WT sodium enhancement is strongest at low protein concentrations; the curves converge
    at high concentration. Single mutants retain binding. Apparent two-component fits do not independently
    count sites. Supplementary expression/purity controls were not inspected, so equivalent folding is
    not established. Li+, Cs+ and Rb+ do not mimic the WT sodium response in this assay.
  nodes:
  - node_id: sodium-added-purified-wt
    label: Add 1 mM Na+ to purified WT NorM-VC titrations
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q9KRU4
  - node_id: wt-low-concentration-binding
    label: Ethidium-binding anisotropy at low WT protein concentrations
    node_type: ACTIVITY
    grounding:
    - UniProtKB:Q9KRU4
  - node_id: d36n-versus-wt
    label: Paper D36N (current D32N) instead of WT
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q9KRU4
  - node_id: e255q-versus-wt
    label: Paper E255Q (current E251Q) instead of WT
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q9KRU4
  - node_id: d371n-versus-wt
    label: Paper D371N (current D367N) instead of WT
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q9KRU4
  - node_id: sodium-enhancement-binding
    label: Sodium-dependent enhancement of low-concentration ethidium binding
    node_type: ACTIVITY
    grounding:
    - UniProtKB:Q9KRU4
  edges:
  - edge_id: sodium-increases-wt-binding
    subject: sodium-added-purified-wt
    predicate: increases
    object: wt-low-concentration-binding
    mechanism: With sodium, WT anisotropy rises more strongly at low protein concentrations than without
      sodium. The response supports sodium-modulated ethidium binding in detergent, not sodium-driven
