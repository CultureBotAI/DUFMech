causal_graphs:
- graph_id: norm-vc-sodium-cellular-ethidium-response
  title: Added sodium lowers the ethidium fluorescence endpoint in NorM-VC-expressing cells
  scope: His10-tagged V. cholerae NorM-VC expressed in L. lactis NZ9000 delta lmrA delta lmrCD, Raturi
    2021 Figure 2A; not a native Vibrio phenotype or all MatE proteins.
  context: Cells are de-energized with 0.5 mM 2,4-dinitrophenol for 40 min at 30 C, washed three times,
    diluted to OD660 0.5 and loaded with 2 uM ethidium in 50 mM KPi, 5 mM MgSO4, pH 7.0 at 30 C. Glucose
    initiates efflux; Methods specify 12.5 mM glucose but Figure 2 specifies 20 mM. The comparison is
    1 mM added Na+ versus no added Na+, with the 400-s fluorescence endpoint and three independently prepared
    cell batches, mean +/- SEM.
  family_mapping: Q9KRU4 / norM / VC_1540, V. cholerae O1 N16961, has current PF01554 repeats at 17-176
    and 243-404 in the 457-aa sequence version 2. The paper's AAF94694.1 reference is 461 aa; its residues
    6-461 exactly match current 2-457, with different N-terminal initiation. This reference reconciliation
    does not independently resequence the N-terminal His10 assay plasmid. Intact protein is tested, not
    isolated repeats.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:243277
  limitations: Intracellular ethidium-associated fluorescence is an efflux proxy, not an absolute mass-flux
    measurement. Sodium addition also changes cellular energetics; the edge does not establish an isolated
    sodium-binding step or ion stoichiometry. Nonexpressing controls lack the comparable sodium response.
    The glucose discrepancy remains unresolved. No universal sodium requirement is inferred from this
    pH-7 comparison.
  nodes:
  - node_id: sodium-added-norm-cells
    label: Add 1 mM Na+ to glucose-energized NorM-VC-expressing cells
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q9KRU4
  - node_id: cellular-ethidium-fluorescence
    label: Normalized ethidium fluorescence at 400 s
    node_type: STATE
  edges:
  - edge_id: sodium-decreases-cellular-fluorescence
    subject: sodium-added-norm-cells
    predicate: decreases
    object: cellular-ethidium-fluorescence
    mechanism: Added sodium lowers the normalized fluorescence endpoint relative to no added sodium in
      the NorM-VC-expressing host, consistent with enhanced ethidium efflux. The matched control host
      and the separate NorM-PS comparison constrain attribution; neither a physical ion path nor antibiotic
      resistance in Vibrio is measured here.
    directness: INDIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:33976372
      source_url: https://www.nature.com/articles/s42003-021-02081-6
      snippet: ethidium
      explanation: Visually inspected Figure 2A, its caption, and transport Methods establish the sodium-versus-no-added-sodium
        endpoint. The retained context records the conflicting glucose concentrations explicitly.
