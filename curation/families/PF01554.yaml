- graph_id: norm-vc-ph-dependent-binding
  title: Raising pH increases ethidium-binding anisotropy of purified WT NorM-VC
  scope: WT His10-NorM-VC in the separate constant-protein pH titration, Raturi 2021 Figure 4B.
  context: No added sodium; 0.2 uM purified WT protein and 2 uM ethidium in the DDM/KPi binding assay.
    Buffer pH is varied from 6 to 9 in 0.2 steps with concentrated KOH. Anisotropy uses 500/580 nm and
    about 2 min equilibration; three independent protein batches, mean +/- SEM. This is not the glucose-energized
    cell assay.
  family_mapping: Intact historical 461-aa NorM-VC maps to Q9KRU4 sequence version 2 with the verified
    initiation difference and four-position internal numbering offset. Both current PF01554 intervals,
    17-176 and 243-404, belong to the tested protein context; neither repeat was isolated.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:243277
  limitations: The double-sigmoid response is observed, but assigning fitted midpoints 6.9 and 8.0 to
    specific carboxylates is an inference. Buffer alkalinization by KOH is the experimental intervention,
    not an independently controlled change of only one residue's protonation. This binding response is
    not an observed transport cycle or universal pH rule for the family.
  nodes:
  - node_id: raise-buffer-ph
    label: Raise the no-added-sodium binding buffer from pH 6 to 9
    node_type: PERTURBATION
  - node_id: wt-ph-series-anisotropy
    label: Ethidium-binding anisotropy at 0.2 uM WT NorM-VC
    node_type: ACTIVITY
    grounding:
    - UniProtKB:Q9KRU4
  edges:
  - edge_id: alkalinization-increases-binding-readout
    subject: raise-buffer-ph
    predicate: increases
    object: wt-ph-series-anisotropy
    mechanism: WT anisotropy increases with two transitions across the tested pH range. The net biochemical
      response is retained without promoting the authors' residue-specific pKa assignments to observed
      molecular events.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:33976372
      source_url: https://www.nature.com/articles/s42003-021-02081-6
      snippet: ethidium
      explanation: Visually inspected Figure 4B, biochemical Results and binding Methods establish the
        direction under fixed-protein conditions, separately from the sodium titration.
      cache_path: evidence/PF01554/raturi-2021-assays.txt
      cache_sha256: fe28ecded927079f3a936f9358af98e398e2808e1134b8eb10ac972bd449a371
