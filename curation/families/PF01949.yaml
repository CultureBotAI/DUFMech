- discussion_id: pf01949-mutation-and-assay-conflicts
  prompt: Resolve the double-mutant identity and assay-label discrepancies before assigning a catalytic residue mechanism.
  kind: CURATION_TODO
  status: OPEN
  rationale: D10A retains cleavage; Figure7E says D10A+H166R while Results and S11 say D10A-H166A. No H166 single-mutant effect or native folding control is established.
  evidence:
  - {reference: 'PMID:39426726', supports: PARTIAL, evidence_source: primary_publication, explanation: 'Main Figures4/5/7 and supplementS5/S11 were inspected. Zinc precipitation, pH4 versus tested5-10, first salt lane5 versus50mM and S5 timing remain explicit.'}
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: Obtain actual construct sequences and independently measured product termini, active protein concentration and bound-metal information. EDTA resistance alone is not proof of an apoenzyme. See evidence/PF01949/li-2024-perturbations.txt.
- discussion_id: pf01949-cellular-and-member-mapping
  prompt: Verify historical constructs and the H26 deletion allele without conflating HaloDL1 biochemistry with H. volcanii physiology.
  kind: CURATION_TODO
  status: OPEN
  rationale: Whole-protein activity is not isolated-domain catalysis; partial deletion, neighboring UDG and relative TPM do not demonstrate a complete repair pathway.
  evidence:
  - {reference: 'PMID:39426726', supports: PARTIAL, evidence_source: primary_publication, explanation: 'S12 sequence/neighborhood and the reference24-bp gap support HVO_0443 mapping; full allele, polarity, RNA-seq replication and rescue remain unresolved.'}
  - {reference: 'https://www.ebi.ac.uk/interpro/api/entry/pfam/protein/uniprot/D4GRY4/', supports: SUPPORT, evidence_source: database, explanation: 'DS2 reference D4GRY4 maps PF01949 26-197; this is not an independently sequenced H26 clone.'}
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: Resolve current Pfam boundaries for WP_009487363.1 and TLY50285.1; retain their primary DUF99 assignment and do not substitute COG1628 coordinates. RNA-seq deposit PRJNA1072706 remains unanalyzed.
- discussion_id: pf01949-remaining-family-coverage
  prompt: Extend member-specific primary coverage and compare the earlier patent experiments.
  kind: CURATION_TODO
  status: OPEN
  rationale: Five assayed homologs and one cellular background do not establish family-wide characterization or universal repair partners.
  evidence:
  - {reference: 'https://patents.google.com/patent/CN113943722A/en', supports: PARTIAL, evidence_source: primary_publication, explanation: 'Example1 is an earlier Afu/Halo ssDNA experiment; OLS17807.1 and PWI48783.1 are additional leads, not the Loki/Thor clones in Li2024.'}
  posed_by: Codex
  posed_date: '2026-10-12'
