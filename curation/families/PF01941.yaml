- graph_id: mjmat-urea-activity-2009
  title: Urea exposure reduces MjMAT assay activity
  scope: Garrido 2009 Figure 3 whole-enzyme perturbation.
  context: Overnight equilibration at 23 C in 50 mM Tris-HCl pH8, 50 mM KCl and 10 mM MgSO4; 0-8 M urea
    remains in the 55 C activity assay, 0.05 mg/ml enzyme.
  family_mapping: Q58605 v1, MJ1208, 406 aa; PF01941 2-402. Protein-level denaturant response.
  taxon: NCBITaxon:243232
  scope_status: PHENOTYPIC
  limitations: Inhibition, unfolding and altered association are not uniquely separated. Different structural
    assays use different protein concentrations; their readouts are not joined into an observed dissociation-causes-inactivation
    chain.
