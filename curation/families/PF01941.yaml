- graph_id: mjmat-urea-sedimentation-2009
  title: Urea shifts the MjMAT sedimentation distribution
  scope: Garrido 2009 Figure 4 sedimentation experiment, not the activity assay.
  context: Urea-equilibrated MjMAT, 0.3-0.4 mg/ml; analytical ultracentrifugation at 188000 g and 18 C,
    corrected sedimentation coefficients.
  family_mapping: Q58605 v1, MJ1208, 406 aa; PF01941 2-402. Whole-protein hydrodynamic experiment.
  taxon: NCBITaxon:243232
  scope_status: PHENOTYPIC
  limitations: Monomer assignment is a hydrodynamic interpretation. Gel filtration remains dimer-like
    to about 3 M urea and indicates later aggregation; centrifugal force, concentration and shape affect
