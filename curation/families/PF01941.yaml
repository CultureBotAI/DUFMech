- graph_id: tkmat-sam-synthesis-2013
  title: TkMAT preparation produces SAM from joint substrates
  scope: Schlesier 2013 Figure 3 recombinant whole-enzyme reaction.
  context: His-tagged TkMAT expressed in E. coli; 0.5 mg/ml, 10 mM ATP and L-methionine, 20 mM MgCl2,
    200 mM KCl, 100 mM Tris-HCl pH8, 37 C for 3 min, acid-quench SCX-HPLC.
  family_mapping: Q5JF22 v1, TK0545, T. kodakarensis KOD1, 405 aa; PF01941 6-401. Cited YP_182958.1 exactly
    matches current sequence. Not an isolated-domain assay.
  taxon: NCBITaxon:69014
  scope_status: MECHANISTIC
  limitations: The paper's 1155-bp gene length conflicts with the mapped 405-aa sequence; clone termini
    remain unverified. No direct phosphate-product assay or residue-specific catalytic test is supplied
    here. Crystal loop states are not observed motion.
