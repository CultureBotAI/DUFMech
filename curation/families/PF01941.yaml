- graph_id: mjmat-double-mutant-turnover-2009
  title: Two MjMAT double mutants have higher reported turnover
  scope: Garrido 2009 Table 3, separate double-mutant versus WT comparisons.
  context: Recombinant W387F-Y226W or W387F-Y233W assayed with methionine and ATP at 55 C. The tyrosine
    substitutions were made on a W387F background, with sequencing verification reported.
  family_mapping: Q58605 v1, PF01941 2-402; current sequence independently verifies Y226, Y233 and W387.
    No tag-adjusted residue renumbering is applied.
  taxon: NCBITaxon:243232
  scope_status: PHENOTYPIC
  limitations: Not single-mutant effects. W387F alone also alters reported kcat; the two substitutions'
    independent contributions and microscopic rate-limiting steps are unresolved. Similar far-UV CD and
