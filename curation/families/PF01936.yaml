- graph_id: human-marf1-fragment-cleavage-2018
  title: Human MARF1 fragment cleaves U30 RNA
  scope: Nishimura2018 Figure5B-D; purified WT238-510 and D426A/D427A fragment.
  context: 1uM protein,10pmol cold and0.1pmol labeled U30 in10uL,3mM MnCl2,20mM HEPES pH7.5,150mM NaCl,10%glycerol,1mM DTT; room temperature,1-60min. GST removed; no-protein controls and5-prime/3-prime labels.
  family_mapping: Human Q9Y4F3v6,1742aa,PF01936 353-490 inside assayed238-510. D426/D427 are within the match. This is not the352-500 crystallization construct or an assay of full-length MARF1.
  taxon: NCBITaxon:9606
  scope_status: MECHANISTIC
  limitations: Internal cleavage is supported by paired end-label patterns, not resolved atomic chemistry. D426A/D427A is one double-mutant test and retains residual activity. No-added-metal activity is not absent; Mg also supports5B cleavage. Folding and natural-target specificity remain unresolved.
