- graph_id: mouse-marf1-knockin-phenotypes-2018
  title: Marf1 D272A knockin changes reproductive and oocyte readouts
  scope: Yao2018 Figures4,5A-B andS6; homozygous knockin versus WT females.
  context: B6DBA2-background engineered allele includes two synonymous marker changes. Three females/genotype mated from6weeks to proven-fertile males; main4C8months versus supplement8-10months. Fully-grown GV oocytes for RNA/foci; ovulated complexes for stage assessment.
  family_mapping: Source Marf1 D272A maps to canonical Q8BJ34v3 D451 within PF01936 352-489 through local PDB5YAA mapping. Whole-animal allele is not purified NYN and is distinct from the crystallographic substitutions.
  taxon: NCBITaxon:10090
  scope_status: PHENOTYPIC
  limitations: These are parallel genotype effects,not a LINE1-to-damage-to-infertility causal chain. MARF1 protein increases despite unchanged Marf1 RNA. Ovulation is not abolished; compound GT/D272A also has the reproductive phenotype but does not exclude every background alternative. GammaH2AX is a marker,not direct transposition measurement.
  nodes:
  - {node_id: knockin, label: Homozygous source D272A knockin instead of WT, node_type: PERTURBATION}
