- graph_id: msmeg-fbia-deletion-cofactor-2020
  title: fbiA deletion reduces detectable mature cofactor
  scope: Grinter2020 Figure2B; M.smegmatis mc2 155 whole-gene deletion versus wild type.
  context: Stationary-phase LBT cultures; extracted lysates analyzed by LC-MS. Otherwise-isogenic deletion verified by whole-genome sequencing.
  family_mapping: MSMEG_1830/FbiA reference A0QTG2v1,327aa,taxon246196; PF01933 matches3-291. Whole-gene perturbation, not isolated-domain sufficiency.
  taxon: NCBITaxon:246196
  scope_status: PHENOTYPIC
  limitations: No fbiA rescue shown in this experiment. Mature cofactor accumulation is downstream of multiple enzymes; absence of a detectable peak is not a quantitative zero or direct reduction chemistry.
