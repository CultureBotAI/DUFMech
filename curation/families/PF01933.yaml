- graph_id: bsub-glmr-yvcj-scattering-2020
  title: GlmR reduces large-particle scattering in a YvcJ mixture
  scope: Foulquier2020 Figure4; purified-protein mixture, not a cellular competence experiment.
  context: YvcJ with0.4mM UDP-GlcNAc, with or without7uM GlmR; dynamic light scattering at25C in Tris/NaCl/glycerol.
  family_mapping: GlmR reference O06974v1,317aa,PF01933 7-292. YvcJ is a separate partner; assay uses full-length proteins rather than an isolated PF01933 fragment.
