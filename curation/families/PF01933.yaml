  scope_status: PHENOTYPIC
  limitations: Mixed-particle hydrodynamic sizes do not independently resolve oligomer stoichiometry, assign every particle to YvcJ or show YvcJ enzymatic activation. No causal link to transformation frequency is demonstrated here.
