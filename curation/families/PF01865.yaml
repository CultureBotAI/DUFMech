- graph_id: pap-heterologous-substitutions
  title: Pap substitutions reduce uptake in the heterologous operon assay
  scope: Hsieh2017 Table3-28, with protein-preparation limitations from Figure3-29.
  context: MT2006 with pUC119 lac-driven intact SmPapPit, each mutant compared with WT pTH2826. 10 uM
    33P-Pi, 37 C; protein-normalized initial uptake, biological triplicates.
  family_mapping: Pap O30498/NP_384293.1 reference numbering; PF01865 4-212 includes E54,D58,P75,R78,D93,D90,H96.
    D90A/H96Y is a double mutant, not an H96Y single-mutant test.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:266834
  limitations: Grouped node denotes five separate single mutants. Figure3-29 shows altered Pap bands for
    some variants; abundance, processing, folding and Pit translation remain alternatives to a catalytic-site
    effect. The reported double-mutant residual is not zero.
