causal_graphs:
- graph_id: pap-operon-restoration
  title: Restoring the pap-pit operon rescues the conditional deletion strain
  scope: Hsieh 2017 MSc thesis Figures 3-15 and 3-16, intact-cell complementation in RmP3924.
  context: S. meliloti RmP3924 delta-pap in the conditional Pho-regulon background; no IPTG after depletion.
    Growth in MOPS-P2, 20 mM glucose and 2 mM Pi at 30 C; separate 33P uptake assay at 10 uM Pi. Compare
    operon-restoring integration with pap-only integration.
  family_mapping: Pap O30498 sequence version 1 equals NP_384293.1, smc02862, 214 aa, PF01865 4-212. Rm1021-derived
    experimental strains, not an isolated domain.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:266834
  limitations: Restoration includes operon architecture and downstream pit expression. Pap alone is not
    sufficient. Polar effects remain unresolved; native transporter abundance is not established. Methods/Table2-1
    disagree on phnC versus phoC background naming.
  nodes:
  - node_id: restore-operon
    label: Integrate pap-pit-truncated to restore the native pap-pit operon
    node_type: PERTURBATION
    grounding:
    - UniProtKB:O30498
  - node_id: growth-trajectory
    label: OD600 growth trajectory relative to pap-only integration
    node_type: PHENOTYPE
  - node_id: phosphate-uptake
    label: Initial protein-normalized 33P-phosphate uptake velocity
    node_type: PHENOTYPE
  edges:
  - edge_id: operon-restoration-increases-growth
    subject: restore-operon
    predicate: increases
    object: growth-trajectory
    mechanism: The operon-restoring recombinant recovers the growth trajectory of the full pap-pit control.
      The alternative split-promoter recombinant does not rescue, so this is not proof of a direct Pap-to-Pit
      activation step.
    directness: INDIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: https://macsphere.mcmaster.ca/handle/11375/22200
      source_url: https://macsphere.mcmaster.ca/bitstreams/ed9a228f-14c0-4a9d-a324-390c60d1e757/download
      snippet: Initial Pi uptake velocities
      explanation: Original Figures3-15A/3-16A-C, printed103-104, show the growth comparisons and PCR-distinguished
        recombinant architectures; Methods and strain table constrain scope.
      cache_path: evidence/PF01865/hsieh-2017-pap.txt
      cache_sha256: 4e00ce85a7f30f739a003e36de3048c10c79abb3e24322b07bcfd964019de613
  - edge_id: operon-restoration-increases-uptake
    subject: restore-operon
    predicate: increases
    object: phosphate-uptake
    mechanism: Operon-restored uptake is 3.48 versus pap-only 0.78 nmol Pi/mg protein/min; full pap-pit
      gives 3.13. Figure3-15B assigns restored and pap-only values to different ANOVA/Tukey groups. Transport
      is measured in cells, not reconstituted Pap.
    directness: INDIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
