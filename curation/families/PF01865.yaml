      27.4 nmol Pi/mg protein/min. Each is a separate comparison; retained source lists SDs and no exact
      mechanistic ranking is inferred.
    directness: INDIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: https://macsphere.mcmaster.ca/handle/11375/22200
