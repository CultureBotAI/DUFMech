- graph_id: pap-native-single-substitutions
  title: P75A and R78A alter native-host growth and phosphate uptake
  scope: Hsieh2017 Figure3-21, separately tested single substitutions in intact pap-pit constructs.
  context: RmP3926 delta-pap-pit, conditional Pho-regulon background, pUCP30T-derived native-promoter
    operons. Growth at 30 C in MOPS-P2 with 2 mM Pi; separate uptake at 10 uM Pi. Each variant compared
    with WT pap-pit.
  family_mapping: O30498/NP_384293.1 Pap; PF01865 4-212 includes reference P75 and R78. Grouped node denotes
    separate single mutants, not a double mutant.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:266834
  limitations: Whole-cell effects may involve protein abundance, folding or downstream Pit translation.
    Positive residual uptake is not zero transport. Growth delay is not a permanent inability to grow,
    and statistical significance is not asserted for unmarked comparisons.
  nodes:
  - node_id: pap-single-substitution
    label: Pap P75A or R78A, each tested separately
    node_type: PERTURBATION
    grounding:
    - UniProtKB:O30498
  - node_id: early-growth
    label: OD600 growth during the early and middle time course
    node_type: PHENOTYPE
  - node_id: uptake-velocity
    label: Initial 33P-phosphate uptake velocity at 10 uM Pi
    node_type: PHENOTYPE
  edges:
  - edge_id: single-substitutions-delay-growth
    subject: pap-single-substitution
    predicate: decreases
    object: early-growth
    mechanism: Each single variant grows more slowly than the matched WT operon in the displayed time
      course. P75A eventually approaches the WT OD, preventing an interpretation of complete growth loss.
    directness: INDIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: https://macsphere.mcmaster.ca/handle/11375/22200
      source_url: https://macsphere.mcmaster.ca/bitstreams/ed9a228f-14c0-4a9d-a324-390c60d1e757/download
      snippet: Initial Pi uptake velocities
      explanation: Original Figure3-21A, printed109, visually inspected; Table2-4 defines the individual
        mutant constructs.
      cache_path: evidence/PF01865/hsieh-2017-pap.txt
      cache_sha256: 4e00ce85a7f30f739a003e36de3048c10c79abb3e24322b07bcfd964019de613
  - edge_id: single-substitutions-lower-uptake
    subject: pap-single-substitution
