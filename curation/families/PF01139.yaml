            explanation: Visually inspected Figure 7A-B supports hydrolysis in the plus-GTP time course, retaining initial 3'-phosphate contamination and the separate control-label discrepancy. No absolute absence of slow GTP-free hydrolysis is claimed.
            cache_path: evidence/PF01139/chakravarty-2012-nar.txt
            cache_sha256: 57c04fef2ec0acf5478c85eb3a4b28e5baaa452fb95e450e017e158860218aaf
      - edge_id: rtcb-guanylates-blocked-rna-end
        subject: blocked-rna-three-phosphate
        predicate: converts_to
        object: blocked-rna-guanylate
        mechanism: The delayed RNA product is assigned as the 3'-guanylylated derivative in the RtcB/GTP/Mn2+ reaction. Figures 5-6 interpretation and Figure 7 temporal ordering support this chemical step; its assignment remains explicitly inferred rather than an independently reidentified RNA structure.
        directness: DIRECT
