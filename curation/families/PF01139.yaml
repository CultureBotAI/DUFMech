  - graph_id: ecoli-rtcb-blocked-rna-processing
    title: RtcB processing of a 5'-blocked cyclic-phosphate RNA substrate
    scope: Tag-free E. coli RtcB acting on a synthetic 20-mer with a 5'-phosphate and a 2',3'-cyclic phosphate; not the ligatable 5'-OH substrate or native tRNA.
    context: The 2012 NAR Figure 7 plus-GTP time course uses 50 mM Tris pH 8.0, 2 mM MnCl2, 100 uM GTP, 1 uM RtcB and 0.1 uM labeled RNA at 37 C. RNase T1 digestion and urea-PAGE resolve terminal products over 0-120 s. RtcB, GTP and manganese are present together for both edges.
    family_mapping: E. coli RtcB corresponds to the 408-aa P46850 reference, sequence version 3, with PF01139 at 29-408. Cited purification uses Ulp1-cleaved His10-Smt3 protein followed by nickel chromatography and gel filtration. Exact source strain and final clone sequence remain unverified; this is full-length protein, not the isolated Pfam interval.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:562
    limitations: Starting RNA contains about 10% 3'-phosphate, and residual 5'-OH substrate accounts for a small ligation signal. The no-GTP control is labeled pRNAp in the caption but pRNA>p in the main text; neither identity is silently imposed, and the adopted edges use the plus-GTP time course. The specific 3'-ppG chemical assignment is inferred from mobility, GTP dependence and prior intermediate chemistry, not independently reidentified here. Enzyme-excess kinetics are not steady-state turnover.
    nodes:
      - node_id: blocked-rna-cyclic-phosphate
        label: 5'-P RNA with a 2',3'-cyclic phosphate end
        node_type: STATE
      - node_id: blocked-rna-three-phosphate
        label: 5'-P RNA with a 3'-phosphate end
        node_type: STATE
      - node_id: blocked-rna-guanylate
        label: 5'-P RNA product assigned as RNA(3')pp(5')G
        node_type: STATE
