        object: rtcb-gmp-adduct
        mechanism: GTP-derived label becomes an SDS-resistant RtcB adduct in the manganese-containing reaction. Peptide analysis and H337 substitutions support a histidinyl-GMP assignment, without resolving every bond-making microstep.
