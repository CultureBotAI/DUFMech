        label: Tag-free E. coli RtcB exposed to GTP and Mn2+
        node_type: STATE
        grounding:
          - UniProtKB:P46850
      - node_id: rtcb-gmp-adduct
        label: Covalent RtcB-GMP adduct
        node_type: STATE
