causal_graphs:
  - graph_id: ecoli-rtcb-guanylylation
    title: Purified E. coli RtcB forms a covalent guanylate adduct
    scope: Full-length recombinant E. coli RtcB, purified after His10-Smt3 tag removal; a protein-adduct assay, not an isolated domain or a cellular RNA-repair phenotype.
    context: The 2012 PNAS Figure 4B assay uses 10 uL, 50 mM Tris pH 8.0, 2 mM MnCl2, 10 uM alpha-32P-GTP and 5 uM RtcB at 37 C for 1 min. SDS-PAGE and autoradiography measure protein labeling. H337A/N/Q variants and the protein-loading gel are controls. GTP, manganese and enzyme are joint inputs.
    family_mapping: The paper's 408-aa E. coli RtcB maps to reference P46850, sequence version 3, rtcB/yhgL, b3421, PF01139 at 29-408. The reported MS peptide 325-341 exactly matches the reference and contains H337. The reference is K12; the exact cloning-template strain and full final clone sequence remain unverified, so graph taxonomy is E. coli species rather than an asserted experimental K12 strain.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:562
    limitations: Peptide mass and mutation evidence support the H337 assignment, but the graph does not assert a directly observed transition state. Figure 2's image and Results give m/z about 723.93 while its HTML caption transposes this to 732.92-732.94; no raw spectrum was reprocessed. The source's DNA-guanylylation assay is not relabeled as RNA chemistry or joined to this graph as a directly tracked molecule.
    nodes:
