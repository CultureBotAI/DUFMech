  - graph_id: ecoli-rtcb-cyclic-end-rna-ligation
    title: RtcB seals a synthetic 5'-OH cyclic-phosphate RNA
    scope: Full-length tag-free E. coli RtcB and a ligatable synthetic 20-mer with 5'-OH and 2',3'-cyclic phosphate ends; net intramolecular RNA end joining.
    context: The 2012 NAR Figure 2 WT plus-GTP assay uses 50 mM Tris pH 8.0, 2 mM MnCl2, 100 uM GTP, 1 uM RtcB and 0.1 uM labeled RNA at 37 C. RNase T1 digestion reveals a six-nucleotide ligation-junction fragment. Minus-GTP and H337A panels use longer minute-scale time courses, unlike the WT plus-GTP seconds-scale panel.
    family_mapping: The 408-aa E. coli RtcB is mapped to P46850 sequence version 3 and PF01139 at 29-408; experimental peptide identity and cited tag-removal protocol are retained separately. K12 is the mapped reference, not a verified experimental cloning-template strain.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:562
    limitations: The substrate preparation includes about 7-8% 3'-phosphate ends, but this does not account for the much larger ligated fraction. The endpoint and time course concern synthetic RNA under enzyme excess, not turnover rates or physiological tRNA substrates. This graph is not connected directly to the 5'-blocked substrate graph. No family-wide, archaeal or mammalian cofactor independence is inferred.
    nodes:
      - node_id: rtcb-ligatable-rna-reaction
        label: RtcB with 5'-OH cyclic-phosphate RNA, GTP and Mn2+
        node_type: ACTIVITY
        grounding:
          - UniProtKB:P46850
      - node_id: sealed-rna-junction
        label: Sealed RNA phosphodiester junction
        node_type: STATE
    edges:
      - edge_id: rtcb-produces-sealed-rna
        subject: rtcb-ligatable-rna-reaction
        predicate: produces
        object: sealed-rna-junction
        mechanism: The complete biochemical reaction yields the diagnostic RNase T1 fragment spanning the newly joined ends. GTP omission and H337A controls suppress efficient ligation; the graph represents the measured net reaction, not a direct one-step attack on the cyclic end.
        directness: DIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:22730297
            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3458531/
            snippet: 87% of the input substrate being ligated
            explanation: Visually inspected Figure 2 and its Results identify the junction fragment and controls. Source time units and incomplete substrate cyclization are retained; slow residual hydrolysis is not mistaken for ligation.
            cache_path: evidence/PF01139/chakravarty-2012-nar.txt
            cache_sha256: 57c04fef2ec0acf5478c85eb3a4b28e5baaa452fb95e450e017e158860218aaf
