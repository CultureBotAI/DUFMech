- graph_id: ecoli-ispd-purified-ctp-series-mutants
  title: Purified IspD substitutions lower reported CTP-series turnover
  scope: K27S, D106E, T140V and R109A versus WT in the 2004 proof's purified, tag-cleaved preparations.
    Inactive unpurified mutants belong to a separate graph.
  context: TLC product kinetics at 23 C; 5 ul with 398 nmol Tris-HCl, 40 nmol MgCl2, 79 nmol NaOH and
    0.7 U pyrophosphatase; 6/12-min sampling. CTP varies, MEP is fixed separately for each mutant. Table
    1 uses a CTP-inhibition fit, plus MEP-unsaturation corrections for T140V/R109A. At least two independent
    assay sets; variable protein doses keep consumption below 10%.
  family_mapping: Q46893 and 1I52 canonical sequences match; PF01128 spans 8-229 and contains K27, D106,
    R109 and T140. The experiments concern full-length enzyme from pHIS8-ygbP, not independent sufficiency
    of those residues or the isolated domain.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:562
  limitations: These are reported fitted parameters, not direct binding affinities or observed transition-state
    stabilization. Final assay pH and complete clones remain unverified. Between-run variation, excluded
    fit outliers and substrate-inhibition corrections matter. The proof footnote says T104V where the
    main row says T140V; K27S's corrected MEP and CTP values differ and are not silently averaged. Final
    publication comparison remains open.
