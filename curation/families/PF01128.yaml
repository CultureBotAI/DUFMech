- graph_id: ecoli-ispd-crude-extract-mutant-effects
  title: Five IspD substitutions reduce crude-extract CDP-ME production
  scope: BL21(DE3) extracts expressing D106A, D106N, K213S, K27A or T165V, compared with WT, in the 2004
    proof. These variants were not further purified. PHENOTYPIC denotes the biochemical assay effect without
    a resolved molecular cause.
  context: 217 nmol labeled MEP, 81.3 nmol CTP, 400 nmol Tris-HCl, 40 nmol MgCl2, 79 nmol NaOH and a nominal
    1-ug YgbP-containing crude sample in 5 ul; 23 C, 1/15 h. TLC background from a blank lacking YgbP
    is subtracted. Exact protein-normalization basis and final assay pH remain unresolved.
  family_mapping: Intended substitutions map to Q46893's PF01128 interval 8-229; the cited 1I52 reference
    sequence matches. Unlike purified kinetics, the crude screen precedes His8-tag cleavage. Complete
    mutant clone sequences are not independently verified.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:562
  limitations: No activity was detected under the reported screen, not proven chemically impossible under
    all conditions. Directness is UNRESOLVED because expression, soluble yield, folding and background
    enzymes can contribute. D106/T165 variants partly form inclusion bodies. The source's sensitivity
    estimate does not supply independent mutant-specific detection limits or folded-protein controls.
    Proof-only full-text access remains explicit.
