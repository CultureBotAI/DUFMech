- graph_id: ecoli-ispd-preparative-cdpme
  title: Purified E. coli IspD produces CDP-ME
  scope: Recombinant ygbP from pNCOygbP in XL1-blue, purified in the 1999 study. This is an intact enzyme
    assay, not an isolated Pfam fragment or a plant pathway experiment.
  context: 225 ug enzyme, 46 mM each MEP and CTP, 10 mM MgCl2, 100 mM Tris-HCl pH 8, 0.7 ml, 37 C for
    1 h; HPLC purification and NMR product identification.
  family_mapping: Q46893/ISPD_ECOLI, ispD/ygbP/b2747, 236-aa K12 reference, sequence version 3; PF01128
    spans 8-229. UniProt and InterPro sequences match. The paper reports initiator-methionine removal
    and an N-terminal sequence consistent with ygbP. Exact donor strain and complete plasmid sequence
    are not independently resolved.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:562
  limitations: NMR supports product identity, not a directly observed transition state. Raw spectra and
    preparative replicate/control details remain unverified. Partial-preparation nucleotide promiscuity,
    recombinant coupled-assay signals and plant label incorporation are not equivalent experiments or
    independently identified products.
