- graph_id: ecoli-ispd-ctp-isotope-trapping
  title: CTP preloading increases early labeled CDP-ME formation
  scope: Purified, thrombin-cleaved E. coli YgbP in the 2004 primary proof's Figure 3B pulse-chase comparison;
    not the distinct MEP-pulse experiment.
  context: Pulse 2 mM labeled CTP with 2.2 mM enzyme, then chase with 10 mM each CTP/MEP, 100 mM Tris
    pH 8, 10 mM MgCl2, 2 mM DTT and 4.48 U pyrophosphatase. Compare label-in-pulse with label-in-chase
    control at early sampled times; TLC/phosphorimaging. Methods uses room-temperature preincubation and
    5-s sampling.
  family_mapping: The cited construct-source structure 1I52 entity 1 exactly matches Q46893's 236-aa sequence,
    including PF01128 at 8-229. pHIS8-ygbP is expressed in BL21(DE3), then tag-cleaved for purified assays.
    Exact cleavage remnant and every later clone sequence remain unverified.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:562
  limitations: The inspected copy has lettered proof pages and placeholder publication fields; final tables/figures
    were not compared. Figure 3's percent-axis scale conflicts with the prose's trapped fraction, so only
    direction is retained. A 40-s displayed series differs from the 50-s Methods duration. Isotope trapping
    supports the authors' ordered-binding interpretation but does not directly image binding or prove
    that MEP can never associate first.
  nodes:
  - node_id: labeled-ctp-in-pulse
    label: Put labeled CTP in the enzyme pulse rather than the chase
    node_type: PERTURBATION
  - node_id: early-labeled-cdpme
    label: Early labeled CDP-ME formation after addition of both substrates
    node_type: ACTIVITY
    grounding:
    - UniProtKB:Q46893
  edges:
  - edge_id: ctp-preloading-increases-early-label
    subject: labeled-ctp-in-pulse
    predicate: increases
    object: early-labeled-cdpme
    mechanism: The CTP-pulse curve rises ahead of the matched label-in-chase control. This is a controlled
      isotope-trapping effect, not an exact binding fraction, equilibrium Kd or observed atomic trajectory.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:15379557
      source_url: https://citeseerx.ist.psu.edu/document?doi=47f611b82af525a30852494febee3418127613b0&repid=rep1&type=pdf
