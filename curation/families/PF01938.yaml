pfam_id: PF01938
curation_status: IN_PROGRESS
curation_history: history/records/PF01938
discussions:
- discussion_id: pf01938-native-rna-mechanism
  prompt: Resolve the native RNA-remodeling steps without relabeling DNA beacons or reporter phenotypes
    as direct RNA transcription measurements.
  kind: CURATION_TODO
  status: OPEN
  rationale: RNA binding, DNA-beacon fluorescence, reporter growth, mCherry fluorescence and native growth
    are distinct measurements with unresolved connecting steps.
  evidence:
  - reference: PMID:31404065
    supports: PARTIAL
    evidence_source: primary_figures_methods_and_supplement
    explanation: Figures3C/5A use oligodeoxynucleotides. Figure4 mutant tests are cellular reporters and
      complementation, not directly measured mutant RNA-unfolding reactions. I33A abundance and host-dependent
      rescue matter.
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: Preserve reference Q6M142 numbering versus tagged constructs, S0001 versus S2 reference identity,
    repeated D25A primer-table labels, and50/100ug/mL ampicillin discrepancy. RNA-seq and RIP do not independently
    establish every direct target or feedback edge.
- discussion_id: pf01938-other-members-and-induction
  prompt: Extend accession-mapped archaeal and multidomain TRAM contexts with their actual induction and
    domain boundaries.
  kind: CURATION_TODO
  status: OPEN
  rationale: MMP0076 does not characterize all35071 proteins and123 architectures; R15 induction dependence
    must not become an unconditional contradiction.
  evidence:
  - reference: PMID:28878753
    supports: PARTIAL
    evidence_source: primary_text_and_captions
    explanation: R15 TRAM3066 supports RL211 growth without IPTG but not after induction. RNase-assisted
      PP6 loss is not intrinsic TRAM RNase activity.
  - reference: PMID:40325874
    supports: PARTIAL
    evidence_source: primary_abstract_only
    explanation: PyTRAM native cold-growth and RNA-chaperone work requires exact mapping and full assay
      inspection; PYCH_0765 is the separate PyCsp.
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: Follow up Ctr3 PMID26769275 and MiaB/RimO/RumA/RlmCD/Trm2/CDKAL1/CDK5RAP1 domain-specific work.
    One capped500-entry member page is not complete coverage. See evidence/PF01938/coverage.txt.
