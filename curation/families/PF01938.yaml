- graph_id: tram0076-native-growth-37c-2019
  title: MMP0076 supports native growth at37C
  scope: Li2019 Figure1A; M. maripaludis S0001-derived deletion and complementation strains.
  context: MMP0076 replaced with pac; pMEV2-0076 rescue and empty-vector controls. Pre-reduced DSMZ141,40mM
    formate,N2/CO2 80:20 at0.1MPa,37C; triplicate OD600 growth curves.
  family_mapping: Reference MMP0076 is Q6M142v1,69aa,PF01938 13-67. Assayed host is S0001,not an assumed
    S2 wild-type culture. Whole stand-alone protein is deleted or expressed,not isolated13-67.
  scope_status: PHENOTYPIC
  limitations: Growth is a distal phenotype. Adjacent-gene RNA levels are unchanged and complementation
    supports locus specificity,not every molecular intermediate. The mutant still grows.
