- graph_id: tram0076-rl211-reporter-2019
  title: TRAM0076 expression and variants alter RL211 reporter growth
  scope: Li2019 Figures3B and4C; E. coli RL211 trpL-cat reporter.
  context: pINIII constructs,1mM IPTG,30ug/mL chloramphenicol,37C2-3days,matched minus-Cm growth controls.
    Figure3 caption gives50ug/mL ampicillin; Methods gives100ug/mL.
  family_mapping: MMP0076 Q6M142v1,PF01938 13-67; I33,R35,F39,F42,K62,F63,F65 all lie in the match and
    are separately changed to alanine. Host is E. coli; protein origin is M. maripaludis.
  taxon: NCBITaxon:562
  scope_status: PHENOTYPIC
  limitations: Reporter growth supports an antitermination interpretation without directly measuring the
    RNA hairpin. I33A abundance is reduced; folding/abundance effects are not excluded for every mutant.
    D25A,K28A,G30A,G32A retain activity. Induced TRAM3066 is a different protein and condition-specific
    negative.
