causal_graphs:
  - graph_id: pinhibens-duf1638-pooled-fitness
    title: PGA1_c13340 insertion-mutant fitness depends on the supplied nutrients
    scope: Pooled barcoded transposon mutants of Phaeobacter inhibens DSM 17395/BS107, focusing on the PGA1_c13340 row in Figure 4B; not an individual deletion, purified reaction or demonstrated B12-reactivation mechanism.
    context: The retained comparison is between the figure's ammonium-plus-sucrose and methionine-plus-sucrose conditions. The caption describes varied carbon and nitrogen sources; methods omit ammonium for nitrogen-source tests. This is not assumed to be methionine added to an otherwise identical ammonium-containing medium. General fitness methods recover pools in rich medium, transfer at OD600 0.02 into 5 mL and sequence barcodes before growth and at saturation. P. inhibens is grown aerobically with shaking; exact plotted nutrient doses, temperature and duration remain unverified.
    family_mapping: PGA1_c13340 is NCBIProtein:AFO91049.1 on the reverse strand of CP002976.1 at 1377532-1378257, with a 241-aa sequence identical to UniParc UPI0001632E23. UniParc maps PF07796 at 72-230. NCBI's CDD-based interval ends at 231; these are not silently treated as identical annotations. Historical UniProt entries are inactive, but the sequence/locus identity is retained. The experiment concerns a bacterial member, not only the archaeal members emphasized in the frozen family description.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:391619
    limitations: Relative fitness is normalized mutant abundance during pooled growth, not an absolute growth rate or direct methionine flux. No clean deletion or gene complementation is established here. Operon-terminal placement argues against polarity but is not a direct polarity control; cross-feeding and insertion-level effects remain possible. Cofitness and phylogenetic co-occurrence with RamA-like proteins do not prove interaction or electron transfer. The source's B12-reactivation figure heading is broader than its explicit uncertainty about the DUF1638 molecular function.
