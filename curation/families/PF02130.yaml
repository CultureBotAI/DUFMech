causal_graphs:
  - graph_id: ecoli-ybey-synthetic-ssrna
    title: Purified E. coli YbeY cleaves a synthetic single-stranded RNA
    scope: Purified E. coli YbeY acting on a 30-nt synthetic RNA containing 18 nt of the mature 16S 3' end and 12 nt of precursor trailer; not intact pre-16S maturation or isolated-domain catalysis.
    context: Figure 1C uses 5 uM YbeY and 5 uM 5'-32P-labeled RNA, with buffer control and 30, 90 and 120 second samples. Main methods specify 20 uL and 50 mM HEPES pH 7.5. The text describes efficient cleavage at 37 C; exact extended assay and construct details remain unverified because the supplement was inaccessible.
    family_mapping: The paper's E. coli YbeY identifier P77385 has demerged into P0A898 (E. coli K12) and P0A899 (Shigella flexneri). The E. coli reference is P0A898, b0659/JW0656, sequence version 1, 155 residues, PF02130 at 21-144. The purified protein's exact tag and expression construct are not established by the inspected main text.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:83333
    limitations: The observed endpoint is cleavage of a short model RNA. It does not establish physiological cleavage specificity, turnover kinetics, a direct 16S maturation site, protein-substrate proteolysis or family-wide activity. Duplex resistance is condition-specific. Mutant activity loss is supportive but does not exclude folding or preparation effects; no residue-level chemical step is claimed.
