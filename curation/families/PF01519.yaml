discussions:
  - discussion_id: duf16-genetic-specificity-and-domain-mechanism
    prompt: Find target-specific genetic rescue and test which DUF16-containing protein regions account for the MPN104 and MPN524 phenotypes.
    kind: CURATION_TODO
    status: OPEN
    rationale: Insertion-associated gliding and adhesion outcomes do not isolate domain function. Predicted absence of polarity is weaker than experimental complementation, and MPN524's non-DUF extension or altered adhesion could contribute to the phenotype.
    evidence:
      - reference: PMID:16923901
        supports: PARTIAL
        evidence_source: full_text
        explanation: Methods, Tables 2/3, Results, Discussion and Figure 5 were inspected. The paper explicitly identifies genetic complementation as follow-up; rescue in other target mutants is not transferred here.
      - reference: PMID:16522803
        supports: PARTIAL
        evidence_source: selected_full_text
        explanation: The MPN010 DUF16 structure is a distinct protein context. Coiled-coil architecture and the paper's suggested motility role are not direct MPN010 causal evidence.
    posed_by: Codex
    posed_date: '2026-10-11'
    notes: Additional family members, later studies, raw movies and prior assay protocols remain incompletely covered. The inherited unknown-function description and seed classification remain unchanged; these partial graphs do not establish family-wide biochemical characterization.
