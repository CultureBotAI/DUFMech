causal_graphs:
  - graph_id: m129-mpn104-insertion-phenotype
    title: MPN104 disruption lowers the fraction of gliding M129 cells
    scope: M. pneumoniae M129 Tn4001.2065 insertion mutant MPN104-29 and its filter-cloned progeny; not a clean deletion, domain-selective mutation or experiment on MPN010.
    context: Table 2 maps the insertion at genome position 134672. The screen enriched polystyrene-adherent transformants and selected altered satellite growth. Table 3 compares two filter clones with wild type using microcinematography, typically 30-50 cells per mutant and at least two experiments. Satellite growth conditions are glass, SP-4 plus 3% gelatin, 37 C; gliding analysis refers to the earlier published protocol and ordinarily uses one frame per second.
    family_mapping: MPN104/MPN_104 is UniProtKB:P75565 (C09_orf104/MP050; NCBIProtein:AAB95698.1), M129 reference taxon 272634, sequence version 1, 104 aa. PF01519 maps at 9-103 inclusive. UniProt and InterPro sequences agree; the study independently identifies MPN104 as DUF16-bearing. Reference sequence mapping does not establish the mutant protein product or domain-specific action.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:272634
    limitations: No MPN104 complementation or excision-revertant confirmation is established here. Figure 5 predicts no flanking polar effect, but that is not a measured polarity control. Glass binding and resting-time means are near wild type; no independent adhesion-loss or resolved motor-activation mechanism is asserted. Table 3 unit headings conflict with Results; gliding frequency is retained as percent, not um/s.
    nodes:
      - node_id: mpn104-29-insertion
        label: Tn4001.2065 disruption at the MPN104-29 locus
        node_type: PERTURBATION
        grounding:
          - UniProtKB:P75565
      - node_id: mpn104-gliding-frequency
        label: Fraction of cells exhibiting gliding in the M129 assay
        node_type: PHENOTYPE
    edges:
      - edge_id: mpn104-insertion-decreases-gliding-frequency
        subject: mpn104-29-insertion
        predicate: decreases
        object: mpn104-gliding-frequency
        mechanism: The insertion-mutant clones show mean gliding frequency 12.4 +/- 0.3 percent versus 27.8 +/- 0.3 percent in wild type. This is an observed insertion-associated phenotype with unresolved molecular and possible indirect effects, not proof that purified DUF16 activates a motor.
        directness: INDIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:16923901
            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1595379/
            snippet: gliding frequencies were reduced for all mutants
            explanation: Tables 2/3 and the Results specify MPN104-29, its insertion site and frequency comparison. Figure 5's no-predicted-polar-effect symbol was visually checked; genetic rescue was not reported for this target in the inspected evidence.
