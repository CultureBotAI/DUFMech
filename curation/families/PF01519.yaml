            source_url: https://www.ebi.ac.uk/interpro/api/protein/uniprot/P75565/entry/pfam/PF01519/
            snippet: 'P75565 Pfam:PF01519 interval: 9-103, inclusive'
            explanation: Connects the tested locus to this family while keeping reference sequence and mutant product distinct.
            cache_path: evidence/PF01519/MPN104-MPN524-identity.txt
            cache_sha256: 979e4dcfcdd63c25c95659d6e9dcd20b1a6f8d53a0ae1d149306e2a00004f271
  - graph_id: m129-mpn524-insertion-phenotypes
    title: MPN524 disruption reduces gliding and glass binding
    scope: Separate M. pneumoniae M129 mutant MPN524-74 with Tn4001.2065 insertion at genome position 645829; not MPN104, MPN010 or isolated DUF16.
    context: Table 3 means and SEM derive from two filter clones, with microcinematography for typically 30-50 cells and at least two experiments. Glass binding uses the same two clones and is normalized to wild type. The satellite-growth screen uses glass, SP-4 plus 3% gelatin at 37 C. Exact glass-binding incubation details are referred to a prior protocol and were not reconstructed in this review.
    family_mapping: MPN524/MPN_524 is UniProtKB:P75254 (G12_orf168/MP318; NCBIProtein:AAB95966.1), M129 taxon 272634, sequence version 1, 168 aa. PF01519 maps at 47-124 inclusive. Its C-terminal extension is not part of that interval. UniProt and InterPro reference sequences agree; the experimental perturbation is whole-locus insertion, not an isolated-domain assay.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:272634
    limitations: Genetic complementation, an excision revertant and mutant protein abundance are not established for MPN524 in the inspected study. Figure 5 predicts no polar effect but does not experimentally exclude it. Reduced attachment may contribute to altered gliding; no observed adhesion-to-motility causal edge is claimed. Table 3 velocity values are percent of WT despite the um/s heading; no 52.8 um/s absolute velocity is asserted. The DUF16 domain cannot be separated from other protein regions by this perturbation.
    nodes:
      - node_id: mpn524-74-insertion
        label: Tn4001.2065 disruption at the MPN524-74 locus
        node_type: PERTURBATION
        grounding:
