            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1595379/
            snippet: gliding frequencies were reduced for all mutants
            explanation: The specific MPN524-74 row in Table 3 supports this direction and the stated mean/SEM; no complementation is borrowed from other mutants in the paper.
