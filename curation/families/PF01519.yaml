        mechanism: MPN524-74 mean velocity is 52.8 +/- 7.8 percent of the wild-type normalized mean of 100.0 +/- 9.4. This is a cellular phenotype, not a measurement of purified motor speed or domain activity.
        directness: INDIRECT
