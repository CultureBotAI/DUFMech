            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1595379/
            snippet: Glass binding was reduced with the disruption of MPN524 but not MPN104
            explanation: Table 3 and glass-binding Results support the outcome and distinguish MPN524 from MPN104. The same phenotype is not transferred to every DUF16 protein or to isolated domains.
