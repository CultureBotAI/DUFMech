            snippet: gliding frequencies were reduced for all mutants
            explanation: Velocity support comes from the distinct velocity column of the MPN524-74 Table 3 row and the normalized interpretation in Results, not from treating the adjacent frequency quotation as a velocity measurement. No new significance test is claimed.
            cache_path: evidence/PF01519/hasselbring-2006-duf16.txt
