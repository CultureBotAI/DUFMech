        object: mpn524-glass-binding
        mechanism: MPN524-74 glass binding is 68.2 +/- 2.0 percent of wild type, compared with the normalized WT mean of 100.0 +/- 3.2. The source reports P < 0.05 for this comparison, without resolving a direct molecular adhesion mechanism.
        directness: INDIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
