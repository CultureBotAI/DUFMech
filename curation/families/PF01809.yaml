  taxon: NCBITaxon:83333
  limitations: INDIRECT genotype-derived preparation effects. Separate ferricyanide, oxygen and ATP endpoints
    are not one measured reaction chain. DCCD-sensitive ATP hydrolysis is not direct visualization of
    F1/F0 assembly or a direct YidD enzymatic activity. Exact ATP time-course and DCCD solvent-control
    details need reconciliation; no independent statistical or densitometric reanalysis.
