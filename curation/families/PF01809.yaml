- graph_id: yidd-bw25113-energized-vesicle-proxies
  title: YidD deletion reduces energized-vesicle gradient proxies
  scope: 'Geng 2015 thesis Chapter 4 Figure 2, not a verified journal version: inner membrane vesicles
    from BW25113 WT and Keio yidD::kan cells.'
  context: 'Buffer A: 50 mM HEPES-KOH pH 8, 50 mM KCl, 1 mM DTT, 5 mM MgCl2. ACMA: 12.5 ug/ml IMVs, 1
    uM dye, 30 C, 0.625 mM NADH or 1 mM ATP. Oxonol VI: 100 ug/ml IMVs, 1.25 mM NADH or 1 mM ATP; dye
    concentration not specified in the inspected Methods. Valinomycin/nigericin controls use 1 uM.'
  family_mapping: K-12 YidD P0A8C8/b4557/JW3682 equals YP_588472.1, 85 aa; PF01809 10-76. BW25113 whole-gene
    deletion is the intervention, not an isolated domain or purified protein.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: All effects INDIRECT through genotype-derived vesicles; YidC abundance is slightly reduced
    in this background. Smaller dye quenching is the readout, not calibrated delta-pH or millivolts; larger
