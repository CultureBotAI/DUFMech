- graph_id: yidd-mc4100-processing-and-abundance
  title: YidD deletion changes substrate processing and membrane abundance
  scope: 'Yu 2011 Figure 5: MC4100(DE3) WT versus almost-complete chromosomal yidD deletion retaining
    the overlapping rnpA ORF. M13P2 and CyoA-HA processing are separate from F0c membrane abundance.'
  context: LB by default; early-log cells with pCL-M13P2 or pCL-CyoA-HA induced with 100 uM IPTG for 1
    h. Mature/(mature + precursor) fractions from immunoblots; four biological replicates for processing.
    F0c is measured separately in isolated inner membrane vesicles, with Lep control. YidC abundance and
    OmpA processing are similar in the displayed WT/deletion controls.
  family_mapping: K-12 YidD P0A8C8/b4557/JW3682, 85 aa, matches YP_588472.1; PF01809 10-76. MC4100 gene
    identity and study constructs are linked to this reference, not independently resequenced historical
    clones. The deletion affects the gene, not an isolated domain. YidC is a different protein.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: INDIRECT whole-genotype effects without same-gene rescue. Processing fractions are not
    insertion-rate constants; F0c abundance is not an insertion or ATP synthase assembly assay. Figure
    5D lacks a stated replicate/error estimate. The 2015 BW25113 thesis reports little F0c abundance effect
    in a different background; the context-specific results are both retained. No universal insertion
    requirement or essentiality claim.
