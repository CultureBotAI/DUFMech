- graph_id: yidd-gfp-peripheral-localization
  title: YidD sequences redirect a GFP reporter toward the cell periphery
  scope: 'Yu 2011 Figure 4: MC4100-A expressing GFP alone, GFP-YidD or GFP-YidD-H1. Qualitative fusion-localization
    intervention, not membrane insertion of purified YidD.'
  context: M9, induction at OD660 about 0.3 with 50 uM IPTG for 1 h, fixation and paired phase-contrast/fluorescence
    imaging. Full-length YidD and the first 81 coding bases are distinct GFP fusions.
  family_mapping: P0A8C8 equals YP_588472.1, 85 aa, PF01809 10-76. H1 is residues 1-27, confirmed by the
    reported coding length and reverse-primer match at 21-27; it includes only domain residues 10-27 plus
    native flank 1-9. Table/figure place GFP N-terminally; complete linker sequences are not independently
    verified.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: INDIRECT reporter-localization effects in cells. Peripheral fluorescence is not calibrated
    membrane affinity, direct lipid binding or transbilayer insertion. This tests sufficiency in a fusion
    context, not H1 necessity in native YidD or sufficiency of the complete Pfam domain. Expression may
    exceed endogenous levels; no quantitative enrichment estimate is adopted.
  nodes:
