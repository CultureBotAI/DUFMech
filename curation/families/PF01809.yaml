  scope: 'Geng 2015 thesis Chapter 4 Figure 3: BW25113 WT versus yidD::kan IMVs; primary thesis experiments,
    not purified YidD catalysis.'
  context: 'Ferricyanide assay: 80 ug/ml IMVs, 25 C, phosphate pH 7.5, 1 mM NADH and ferricyanide, A420.
    Oxygen-linked NADH oxidation: 75 ug/ml IMVs, HEPES pH 7.5, 350 uM NADH, A340. ATP assay: 15 ug/ml
    IMVs, 37 C, HEPES pH 8, 1 mM ATP, malachite-green phosphate readout; 0.5 mM DCCD defines the sensitive
    component. Three independent measurements, mean/SD.'
  family_mapping: P0A8C8/YP_588472.1 YidD, PF01809 10-76 in the 85-aa reference; Keio BW25113 gene deletion,
    with downstream YidC abundance affected. No purified-domain preparation is tested.
