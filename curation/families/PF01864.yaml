- graph_id: apcars-product-and-assay-conditions
  title: ApCarS produces CDP-archaeol with condition-dependent endpoint output
  scope: Intact purified ApCarS-His6 assays in Ren 2017 Figure 1D and Figure S3, not native cellular flux.
  context: 0.5 uM enzyme, synthetic DGGGP, 2 mM CTP, 10 mM MgCl2, 50 mM Tris pH7.5, 75 mM NaCl, 0.1% DDM,
    125 mM imidazole, 5% glycerol; 1 h at 37, 60 or 90 C. EDTA comparisons add 20 mM. DGGGP concentration
    is not specified in the 2017 Methods paragraph.
  family_mapping: Aeropyrum pernix K1 APE_0433/carS, Q9YF05 sequence version 1 equals BAA79391.1, 174
    aa. PF01864 12-174. PDB 5GUF is native sequence plus LEHHHHHH; primary Methods specify pET21b/E. coli
    BL21(DE3).
  scope_status: MECHANISTIC
  taxon: NCBITaxon:272557
  limitations: DIRECT is a net purified-preparation effect, not a chemical microstep. Protein co-purified
    with endogenous CTP; no-added-CTP and EDTA controls are not absolute nulls. Product ion counts are
    not initial rates, separately measured PPi, or native membrane kinetics.
  nodes:
  - node_id: apcars-with-substrates
    label: ApCarS preparation with DGGGP, CTP and Mg under the stated conditions
    node_type: ACTIVITY
    grounding:
    - UniProtKB:Q9YF05
  - node_id: product-signal
    label: CDP-archaeol product ion signal
    node_type: STATE
  - node_id: add-edta
    label: Add 20 mM EDTA to the otherwise matched reaction
    node_type: PERTURBATION
  - node_id: raise-37-to-60
    label: Raise incubation temperature from 37 to 60 C
    node_type: PERTURBATION
  - node_id: raise-60-to-90
    label: Raise incubation temperature from 60 to 90 C
    node_type: PERTURBATION
  edges:
  - edge_id: preparation-produces-cdp-archaeol
    subject: apcars-with-substrates
    predicate: produces
    object: product-signal
    mechanism: HPLC-MS detects product assigned as CDP-archaeol at m/z1020.55 [M-H]-. Substrate and EDTA
      comparisons support the net preparation-level reaction, not an independently resolved sequence of
      chemical events.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:28961231
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5674157/
      snippet: CDP-archaeol
      explanation: Figure 1D and published Figure S3 chromatogram/spectrum were visually inspected; Methods
        establishes the combined assay context.
      cache_path: evidence/PF01864/ren-2017-apcars.txt
      cache_sha256: 8bac92aa3bf08a12077abc790d5599c7561f255d4268e1d2a4790680fb9377fd
  - edge_id: edta-lowers-product
    subject: add-edta
    predicate: decreases
    object: product-signal
    mechanism: EDTA lowers product output in the tested reaction comparisons; this supports metal sensitivity
      without identifying a unique ion-binding chemical step or proving zero residual turnover.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:28961231
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5674157/
      snippet: CDP-archaeol
      explanation: Figure 1D EDTA comparisons, with small residual signals retained and 20 mM EDTA specified
        by Methods.
      cache_path: evidence/PF01864/ren-2017-apcars.txt
      cache_sha256: 8bac92aa3bf08a12077abc790d5599c7561f255d4268e1d2a4790680fb9377fd
  - edge_id: warming-37-to-60-increases-product
    subject: raise-37-to-60
    predicate: increases
    object: product-signal
    mechanism: The fixed one-hour endpoint has greater product signal at 60 than 37 C; protein dynamics,
      substrate diffusion and other temperature-dependent effects are not separated.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:28961231
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5674157/
      snippet: CDP-archaeol
      explanation: Figure 1D, CTP-present EDTA-absent comparison. Not a measured activation energy or
