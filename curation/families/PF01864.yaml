- graph_id: apcars-groove-site-product-assays
  title: Tail-site substitutions lower ApCarS product output despite divergent binding effects
  scope: Complete published Figure 6D/E, separately tested single variants of intact ApCarS.
  context: 'Activity Methods: 0.5 uM protein, synthetic DGGGP, 2 mM CTP, 10 mM MgCl2, 90 C for 1 h in
    the stated detergent buffer. These conditions differ from the 4 C lipid-strip assay.'
  family_mapping: Q9YF05/BAA79391.1 native numbering; A29, Q123, L124, F126, L156 and H157 lie within
    PF01864 12-174.
  scope_status: MECHANISTIC
