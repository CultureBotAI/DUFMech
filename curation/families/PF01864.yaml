- graph_id: apcars-magnesium-monovalent-ion-assays
  title: Potassium and lithium enhance the magnesium-containing ApCarS assay
  scope: Ren 2017 Figure S4A ion-addition comparisons using purified intact protein.
  context: Activity assay at 90 C for 1 h with DGGGP and CTP; ion additions each 10 mM. Compare Mg alone
    against Mg plus KCl or LiCl. Other reaction-buffer components follow the published activity protocol,
    including background NaCl.
  family_mapping: ApCarS Q9YF05/BAA79391.1, PF01864 12-174, native protein plus C-terminal His6 expression
    tail.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:272557
  limitations: No independent sufficiency of a monovalent ion. Enhancement does not transfer to the Mn-containing
    assay; Na does not show the same enhancement. Ca residual signal prevents strict-null language. Ionic
    strength and precise coordination mechanisms are unresolved.
  nodes:
  - node_id: potassium-with-magnesium
    label: Add 10 mM KCl to the Mg-containing reaction
    node_type: PERTURBATION
  - node_id: lithium-with-magnesium
    label: Add 10 mM LiCl to the Mg-containing reaction
    node_type: PERTURBATION
  - node_id: normalized-product
    label: DDM-normalized CDP-archaeol product signal
    node_type: STATE
  edges:
  - edge_id: potassium-enhances-magnesium-assay
    subject: potassium-with-magnesium
    predicate: increases
    object: normalized-product
    mechanism: Added KCl increases endpoint product signal relative to Mg alone, conditional on the specified
      substrate and ion context.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:28961231
      source_url: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fcr.2017.122/MediaObjects/41422_2017_BFcr2017122_MOESM66_ESM.pdf
      snippet: Supplementary information
      explanation: Original Figure S4A and its caption inspected; the Mg and Mn contexts are kept separate.
      cache_path: evidence/PF01864/ren-2017-supplements.txt
      cache_sha256: 7d3b602675f5f44d97f0dfa8d8c3aa583d4cee56fe174b8bd3a077217054de10
  - edge_id: lithium-enhances-magnesium-assay
    subject: lithium-with-magnesium
    predicate: increases
    object: normalized-product
    mechanism: Added LiCl increases endpoint product signal relative to Mg alone; the result does not
      establish that Li and K occupy the same site or act identically.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:28961231
      source_url: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fcr.2017.122/MediaObjects/41422_2017_BFcr2017122_MOESM66_ESM.pdf
      snippet: Supplementary information
      explanation: Figure S4A Mg plus Li comparison, not monovalent-ion rescue without divalent ion.
      cache_path: evidence/PF01864/ren-2017-supplements.txt
      cache_sha256: 7d3b602675f5f44d97f0dfa8d8c3aa583d4cee56fe174b8bd3a077217054de10
- graph_id: apcars-ctp-binding
  title: Magnesium and individual substitutions change ApCarS CTP-binding measurements
  scope: Published Table S2 representative ITC parameters for WT and separately tested single substitutions.
  context: 25 C; 20 mM Tris pH7.5, 100 mM NaCl, 0.02% DDM; about 0.15 mM protein and 0.5 mM CTP titrant,
    one-site fit, technical triplicate. Mg concentration is not specified in the ITC Methods paragraph.
    Mutants are compared with WT+Mg.
  family_mapping: ApCarS Q9YF05 version 1/BAA79391.1; PF01864 12-174 contains every listed ITC substitution.
    Whole-protein preparations, not isolated-domain binding.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:272557
  limitations: Grouped nodes mean each named single mutant separately, never a combined mutant or equal
    effect sizes. Undetected heat is not zero molecular binding. Endogenous CTP co-purification gives
    fitted N below 1. Binding at 25 C is not catalytic activity at 90 C; errors are not established biological
    uncertainty.
  nodes:
  - node_id: magnesium-present
    label: Include Mg in the WT ITC comparison
    node_type: PERTURBATION
  - node_id: measured-affinity
    label: Apparent CTP-binding affinity from the one-site fit
    node_type: STATE
  - node_id: undetected-single-mutants
    label: N28A, P31A, K57A, D100A, K107A or D125A, each separately
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q9YF05
  - node_id: detectable-ctp-binding
    label: Detectable ITC CTP-binding response
    node_type: STATE
    grounding:
      - UniProtKB:Q9YF05
  - node_id: weaker-single-mutants
    label: D41A, R51A, G54A, D55A, T58A, R108A, R114A or D122A, each separately
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q9YF05
  edges:
  - edge_id: magnesium-increases-apparent-affinity
    subject: magnesium-present
    predicate: increases
    object: measured-affinity
    mechanism: WT Kd is 0.2 +/- 0.02 uM with Mg versus 1.6 +/- 0.18 uM without Mg in Table S2. Lower Kd
      indicates stronger fitted affinity; neither the main-caption unit typo nor fitted site count is
      interpreted as a true molar stoichiometry.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:28961231
      source_url: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fcr.2017.122/MediaObjects/41422_2017_BFcr2017122_MOESM74_ESM.pdf
      snippet: not detect
      explanation: Table S2 WT rows, units and representative-fit footnote were inspected, together with
        ITC Methods and co-purified-CTP caveat.
      cache_path: evidence/PF01864/ren-2017-supplements.txt
      cache_sha256: 7d3b602675f5f44d97f0dfa8d8c3aa583d4cee56fe174b8bd3a077217054de10
  - edge_id: six-single-mutants-lose-detectable-itc-response
    subject: undetected-single-mutants
    predicate: decreases
    object: detectable-ctp-binding
    mechanism: Each listed single substitution yields n.d. in Table S2 against detectable WT binding;
      the assay does not establish infinite Kd, abolished catalysis or a unique direct-contact mechanism.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:28961231
      source_url: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fcr.2017.122/MediaObjects/41422_2017_BFcr2017122_MOESM74_ESM.pdf
      snippet: not detect
      explanation: Six n.d. rows are interpreted as detection limits, including P31A which retains product
        in a separate catalytic assay.
      cache_path: evidence/PF01864/ren-2017-supplements.txt
      cache_sha256: 7d3b602675f5f44d97f0dfa8d8c3aa583d4cee56fe174b8bd3a077217054de10
  - edge_id: eight-single-mutants-weaken-fitted-affinity
    subject: weaker-single-mutants
    predicate: decreases
    object: measured-affinity
    mechanism: Kd point estimates in uM are D41A 2.1, R51A 3.4, G54A 1.05, D55A 0.76, T58A 8.85, R108A
      1.95, R114A 4.6 and D122A 1.4 versus WT+Mg 0.2. Each is a separate preparation and fit; broad R114A
      error and missing fold controls preclude a precise ranking of residue importance.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:28961231
      source_url: https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fcr.2017.122/MediaObjects/41422_2017_BFcr2017122_MOESM74_ESM.pdf
      snippet: not detect
      explanation: Table S2 numerical rows support direction of fitted-affinity change; uncertainties
        are retained in the evidence extract and no significance test is invented.
      cache_path: evidence/PF01864/ren-2017-supplements.txt
      cache_sha256: 7d3b602675f5f44d97f0dfa8d8c3aa583d4cee56fe174b8bd3a077217054de10
- graph_id: apcars-substitution-product-assays
  title: Individual ApCarS substitutions reduce product output
  scope: Figure 4B and Figures S5/S7 purified-protein comparisons, grouped only by shared direction of
    response.
  context: Each single variant compared separately with its panel's WT; 0.5 uM protein, DGGGP, 2 mM CTP,
    10 mM MgCl2, 90 C for 1 h in the activity buffer. Two plotted points do not establish independent
    biological replication.
  family_mapping: Q9YF05/BAA79391.1 native numbering. PF01864 12-174 includes the listed core sites and
    D12/E16/N82/Y139, but excludes D8/W9. No isolated-domain sufficiency is asserted.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:272557
  limitations: Changes in folding, stability, protein preparation or substrate interaction could contribute.
    These are observed preparation-level effects, not assignments of chemical catalysis to every residue.
    Panels are not pooled; low signal is not a strict catalytic null.
  nodes:
  - node_id: main-panel-single-mutants
    label: N28A, P31A, R51A, D55A, K57A, T58A, D100A, K107A, R108A, R114A, D122A or D125A, each separately
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q9YF05
  - node_id: additional-cl1-single-mutants
    label: D41A or G54A, each separately
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q9YF05
  - node_id: outside-span-single-mutants
    label: D8A or W9A outside the Pfam span, each separately
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q9YF05
  - node_id: periplasmic-in-span-single-mutants
    label: D12A, E16A, N82A or Y139A, each separately
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q9YF05
  - node_id: product-output
    label: CDP-archaeol endpoint signal relative to the matched panel WT
    node_type: STATE
  edges:
  - edge_id: main-panel-single-substitutions-lower-product
    subject: main-panel-single-mutants
    predicate: decreases
    object: product-output
    mechanism: Each Figure 4B single variant lowers product output. P31A, R51A, D55A and R114A retain
      appreciable signal; P31A product despite n.d. ITC prevents a simple claim that undetectable binding
      necessarily abolishes catalysis.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:28961231
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5674157/
      snippet: CDP-archaeol
