  - graph_id: yjbq-pdxb-liquid-rescue
    title: YjbQ expression supports reported liquid-medium rescue
    scope: Kim2010 Results statement reporting growth of the delta-pdxB host in liquid M9/glucose when yjbQ is overexpressed.
    context: Same study's E. coli BW25113-derived expression screen and reintroduction framework. Liquid-specific inoculum, inducer dose, incubation details, growth curves and replicate counts were not recovered; plate-method doses and TableII timing are not transferred to this assay. Supplementary Figure4 tests glycolaldehyde/pyridoxine supplementation, not YjbQ expression.
    family_mapping: Whole K12 YjbQ reference P0AF48 sequenceversion1/NP_418480.1,138 aa, maps PF01894 at6-138. General ASKA/pTrcHisB tags are documented, but experimental insert sequences were not independently reconstructed and the printed forward primers differ. This is not a second protein or isolated-domain assay.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:83333
    limitations: The qualitative result is explicitly reported in primary text; no YjbQ-specific liquid-growth curve was identified in the inspected supplement text. No quantitative rate, metabolite identity or dehydrogenase reaction is inferred. It shares an experimental source with the colony graph, rather than providing independent replication.
    nodes:
      - node_id: express-yjbq-liquid
        label: Overexpress yjbQ in the liquid-culture delta-pdxB host
        node_type: PERTURBATION
        grounding: [UniProtKB:P0AF48]
      - node_id: liquid-growth
        label: Growth in liquid M9/glucose
        node_type: PHENOTYPE
    edges:
      - edge_id: yjbq-enables-liquid-growth
        subject: express-yjbq-liquid
        predicate: enables
        object: liquid-growth
        mechanism: Primary Results distinguishes YjbQ,HisB and Php from the other selected genes by reporting growth rescue in liquid as well as solid medium. The YjbQ molecular route remains unresolved; the experimentally dissected YeaB/LtaE/ThrB pathway is not assigned to it.
        directness: INDIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:21119630
            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3010111/
            snippet: enable growth
            explanation: Primary Results under overexpression rescue names yjbQ in the three-gene both-medium group. Only this qualitative statement is adopted; the inspected supplement does not supply an identified YjbQ liquid-growth curve or a YjbQ-specific quantitative protocol.
            cache_path: evidence/PF01894/kim-2010-growth.txt
            cache_sha256: 4b35609f0d31260f901e82a8524b9d16acc5a0cf84d633e50bbe5d9b4191da66
discussions:
  - discussion_id: yjbq-reaction-and-assay-gaps
    prompt: Resolve YjbQ reactions while preserving the distinction between growth rescue and direct biochemical evidence.
    kind: CURATION_TODO
    status: OPEN
    rationale: Thiamine and vitamin B6 rescue occur in different hosts and pathways. Morett reports in-vitro TPS and mutagenesis, but full assay evidence was not obtained. Kim's proposed pathway2 entry is genetic inference and YjbQ was not assayed for4PE dehydrogenase activity; the broad statement that none of the selected proteins has this activity cannot be used as a measured YjbQ negative.
    evidence:
      - reference: PMID:18178222
        supports: PARTIAL
        evidence_source: abstract_and_accessible_publisher_excerpts
        explanation: The primary report supports qualitative thiE rescue and reports biochemical/mutagenesis work; full figures, exact conditions, active-site assignments and other-species constructs remain uninspected.
      - reference: PMID:21119630
        supports: PARTIAL
        evidence_source: full_text_tables_original_schematic_and_publisher_supplement
        explanation: TableII, supplementary TableIII and Results support genotype/context-specific growth. Supplementary purification Methods confirms insoluble YjbQ. Original Figure1 marks the pathway2 precursor unknown; no measured OHPB-production or catalytic microstep is shown for YjbQ.
    posed_by: Codex
    posed_date: '2026-10-11'
    notes: Obtain readable2008 full text, resolve the2010 printed primer and FigureS1 antibiotic discrepancies, verify actual insert sequences and liquid-growth conditions, and assess purified products and residue controls. The2010 publisher supplement was obtained after the initial CREATE event. Do not convert an unperformed assay or unavailable source into negative evidence. Native physiological function and transfer across14125 frozen family proteins remain open.
  - discussion_id: yjbq-excluded-context-transfers
    prompt: Distinguish structural and pathway-context leads from demonstrated PF01894 reactions.
    kind: CURATION_TODO
    status: OPEN
    rationale: RhiN homology and a proposed dehydration role do not establish its enzymatic reaction. The2024 tRNA-selection study cites the existing YjbQ bypass as a reason for double deletion, rather than supplying independent YjbQ replication. ST2072's Zn/sulfate structure does not prove the E. coli enzyme mechanism. Similar gene names must not merge unrelated proteins.
    evidence:
      - reference: PMID:20142038
        supports: PARTIAL
        evidence_source: selected_full_text
        explanation: RhiN-related Results and Discussion explicitly leave its function unresolved; RhiG aldolase data and whole-cluster production do not establish individual RhiN chemistry.
      - reference: doi:10.1093/nar/gkae806
        supports: PARTIAL
        evidence_source: selected_full_text
        explanation: The YjbQ-related selection rationale cites Morett2008 and removes thiE/yjbQ. The discussed ThiN H95 residue is not a YjbQ catalytic residue.
      - reference: https://www.rcsb.org/structure/1VE0
        supports: PARTIAL
        evidence_source: structural_deposition_metadata
        explanation: The inspected134-residue ST2072 deposition contains Zn/sulfate and a trimeric assembly; the2005 full paper and a residue-level functional assay were not reviewed.
    posed_by: Codex
    posed_date: '2026-10-11'
    notes: Identity comparisons, source-access outcomes and searched aliases are retained under evidence/PF01894. No frozen identity/counter changes, independent expert endorsement, full-family completion or publication are claimed.
