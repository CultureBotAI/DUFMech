causal_graphs:
  - graph_id: yjbq-thie-rescue
    title: Expressed E. coli YjbQ rescues thiamine auxotrophy
    scope: Morett2008 primary abstract and accessible Introduction/partial Methods; whole E. coli YjbQ expressed in MC1061 delta-thiE.
    context: Minimal-medium plate complementation is reported. Exact medium recipe, induction, incubation temperature, duration and replicate count were not recovered from the truncated accessible Methods. The reported37 C LB propagation is not assigned to the complementation assay.
    family_mapping: The K12 reference P0AF48 sequenceversion1 is138 aa and exactly matches NP_418480.1, AAC77026.1, BAE78058.1 and WP_000270375.1. Member-specific InterPro maps PF01894 at6-138. The actual MC1061 plasmid insert was not independently sequenced; this is whole-protein expression, not isolated-domain sufficiency.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:83333
    limitations: This qualitatively reported genetic effect was not independently inspected in original figures. Reported in-vitro TPS activity, directed evolution and residue tests need full-text assay review before mechanistic edges are added. Rescue does not establish the native physiological role or justify transferring ThiE chemistry to YjbQ. Other-species complementation constructs remain unmapped.
    nodes:
      - node_id: express-yjbq
        label: Overexpress E. coli yjbQ in MC1061 delta-thiE
        node_type: PERTURBATION
        grounding: [UniProtKB:P0AF48]
      - node_id: thiamine-auxotrophy-rescue
        label: Growth rescue of the thiamine-auxotrophic host
        node_type: PHENOTYPE
    edges:
      - edge_id: yjbq-enables-thie-host-growth
        subject: express-yjbq
        predicate: enables
        object: thiamine-auxotrophy-rescue
        mechanism: The primary abstract reports that expression of the selected E. coli gene complements loss of thiE. Accessible Introduction identifies MC1061 delta-thiE. This is retained as an indirect cellular effect, not a measured catalytic microstep or constitutive thiamine pathway.
        directness: INDIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
