  - graph_id: yjbq-pdxb-colony-rescue
    title: Expressed YjbQ supports delta-pdxB colony growth
    scope: Kim2010 TableII, supplementary TableIII and relevant Methods; BW25113-derived delta-pdxB/JU283 on M9/glucose at37 C.
    context: Supplementary TableI identifies JU283 as a selected JWK2317 single colony. M9 contains glucose0.2% and NH4Cl0.1% w/v. ASKA hits were reintroduced and independently cloned in pTrcHisB; confirmation Methods specifies five PBS washes, IPTG0.1 mM, kanamycin20 ug/ml and ampicillin100 ug/ml. TableII compares no supplement and a defined mixture without pyridoxine; TableIII separately tests serine1 mM. FigureS1 caption instead names chloramphenicol35 ug/ml with pTrcHisB; that antibiotic discrepancy remains unresolved.
    family_mapping: Whole E. coli K12 YjbQ b4056/JW4017 corresponds to P0AF48/NP_418480.1 reference138 aa with PF01894 at6-138. Both expression systems add N-terminal His6; ASKA also adds five C-terminal residues. TableV printed pTrcHisB and pET45b forward primers differ in the YjbQ start region. The reference sequence match does not independently establish the experimental insert sequence or isolated-domain sufficiency.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:83333
    limitations: TablesII/SIII +++ means1 mm colonies after3-5 days, not a directly measured specific growth rate or20% catalytic activity. pdxB complementation is faster at1-2 days. FigureS1 labels YjbQ at4 days and vector at7 days, not matched-time growth rates. Failure to rescue separate serC,pdxA,pdxJ,pdxH mutants bounds the effect but is not a matched double-knockout causal chain. Proposed OHPB entry is inferred; YjbQ dehydrogenase activity was not assayed because soluble protein was unavailable. JU283 was selected from heterogeneous Keio stocks for its30 C phenotype; transfer to all delta-pdxB isolates is not established.
    nodes:
      - node_id: express-yjbq
        label: Express yjbQ in the delta-pdxB/JU283 host
        node_type: PERTURBATION
        grounding: [UniProtKB:P0AF48]
