discussions:
  - discussion_id: ribk-donor-and-metal-discrepancies
    prompt: Resolve nucleotide-donor and metal dependence across the original RibK studies.
    kind: CURATION_TODO
    status: OPEN
    rationale: The 2008 enzyme retains ATP/GTP activity and copurified Mg; strict CTP-only and metal-independent claims are not justified by these assays.
    evidence:
      - {reference: 'PMID:18245297', supports: PARTIAL, evidence_source: primary_publication, explanation: Equal-concentration ATP/GTP yield 30%/11% of CTP activity; no-added-metal protein contains 4-5 mol Mg per mol protein.}
      - {reference: 'PMID:18073108', supports: PARTIAL, evidence_source: primary_publication, explanation: Abstract inspected but original full text returned 403; IUBMB cites this study for lack of ATP/GTP use.}
    posed_by: Codex
    posed_date: '2026-10-16'
    notes: Inspect original 2007 Methods and donor-purity/metal controls before resolving the discrepancy. EC2.7.1.161 is current nomenclature; the frozen EC2.7.1.26 description remains imported source text, not curated chemistry.
  - discussion_id: rbkr-constructs-residues-and-physiology
    prompt: Resolve exact constructs, causal residue roles and native regulatory polarity without assigning wHTH activity to PF01982 alone.
    kind: CURATION_TODO
    status: OPEN
    rationale: Reference-domain annotations and static contacts do not establish domain sufficiency, proton transfer or native transcriptional activation.
    evidence:
      - {reference: 'PMID:28073944', supports: PARTIAL, evidence_source: primary_publication, explanation: Whole-fusion biochemical assays and DNA-bound structure support distinct observations; activation and FMN-induced structural switching remain proposed.}
    posed_by: Codex
    posed_date: '2026-10-16'
    notes: Archived A0A0K1E2F9 entry33 maps AKT35049.1 to PF01982 at 88-208; the current entry is deleted. Q60365 sequence2 postdates the 2008 experiment. Verify physical inserts, cleavage junctions, folding/abundance and residue perturbations before stronger transfer.
  - discussion_id: rbkr-source-discrepancies-and-coverage
    prompt: Reconcile binding units and probe descriptions, then extend the primary-source and exact-member review.
    kind: CURATION_TODO
    status: OPEN
    rationale: Figure4 axes, text affinity values and probe lengths differ; the reviewed studies do not cover all PF01982 members.
    evidence:
      - {reference: 'PMID:28073944', supports: PARTIAL, evidence_source: primary_publication, explanation: 'Figure4 and supplement S3/TableS3 were visually inspected; myRbkR text nanomolar affinity differs from plotted micromolar titrations, and EMSA length is 104 versus 102 bp.'}
    posed_by: Codex
    posed_date: '2026-10-16'
    notes: Preserve 4D's 15 nM DNA versus general Methods 10 nM and TableS3's py probe ordering. No numerical correction or replicate refit. Obtain original 2007 full text, remaining structural images/supplements and later experiments. Gene adjacency and predicted regulons are not causal proof.
