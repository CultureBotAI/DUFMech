discussions:
- discussion_id: ribk-donor-and-metal-discrepancies
  prompt: Resolve nucleotide-donor and metal dependence across the original RibK studies.
  kind: CURATION_TODO
  status: OPEN
  rationale: The 2008 enzyme retains ATP/GTP activity and copurified Mg; strict CTP-only and metal-independent
    claims are not justified by these assays.
  evidence:
  - reference: PMID:18245297
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Equal-concentration ATP/GTP yield 30%/11% of CTP activity; no-added-metal protein contains
      4-5 mol Mg per mol protein.
  - reference: PMID:18073108
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Abstract inspected but original full text returned 403; IUBMB cites this study for lack
      of ATP/GTP use.
  - reference: https://hdl.handle.net/10900/49675
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Ammelburg's 2011 primary account supplies the original assay protocol and qualitative
      donor contrasts; Figure9G retains a small FMN-labeled ATP peak despite its negative caption.
  posed_by: Codex
  posed_date: '2026-10-16'
  notes: The 2011 dissertation is a primary account of the 2007 work, not independent replication or verified
    journal-text identity. Its assay contains 5 mM MgCl2 without a metal-removal intervention. Different
    constructs and assay conditions do not establish why 2008 ATP/GTP activity differs. Original journal
    text and donor-purity/metal controls remain follow-ups. EC2.7.1.161 is current nomenclature; the frozen
    EC2.7.1.26 description remains imported source text, not curated chemistry.
- discussion_id: rbkr-constructs-residues-and-physiology
  prompt: Resolve exact constructs, causal residue roles and native regulatory polarity without assigning
    wHTH activity to PF01982 alone.
  kind: CURATION_TODO
  status: OPEN
  rationale: Reference-domain annotations and static contacts do not establish domain sufficiency, proton
    transfer or native transcriptional activation.
  evidence:
  - reference: PMID:28073944
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Whole-fusion biochemical assays and DNA-bound structure support distinct observations;
      activation and FMN-induced structural switching remain proposed.
  - reference: https://hdl.handle.net/10900/49675
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Static apo and product complexes motivate an explicitly hypothetical ordered-binding
      and E107 base model; no causal residue intervention was inspected.
  posed_by: Codex
  posed_date: '2026-10-16'
  notes: Archived A0A0K1E2F9 entry33 maps AKT35049.1 to PF01982 at 88-208; the current entry is deleted.
    Q60365 sequence2 postdates the original studies. The 136-aa archived Q60365 and 2P3M/2VBU/2VBV references
    have an MVKL prefix relative to current 132-aa Q60365; deposited E107 maps to current E103 and PF01982
    7-125 maps to deposited 11-129. The prefix is not established as a vector tag. Verify physical inserts,
    cleavage junctions, folding/abundance and residue perturbations before stronger transfer.
- discussion_id: rbkr-source-discrepancies-and-coverage
  prompt: Reconcile binding units and probe descriptions, then extend the primary-source and exact-member
    review.
  kind: CURATION_TODO
  status: OPEN
  rationale: Figure4 axes, text affinity values and probe lengths differ; the reviewed studies do not
    cover all PF01982 members.
  evidence:
  - reference: PMID:28073944
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Figure4 and supplement S3/TableS3 were visually inspected; myRbkR text nanomolar affinity
      differs from plotted micromolar titrations, and EMSA length is 104 versus 102 bp.
  posed_by: Codex
  posed_date: '2026-10-16'
  notes: Preserve 4D's 15 nM DNA versus general Methods 10 nM and TableS3's py probe ordering. No numerical
    correction or replicate refit. Ammelburg2011 Methods and Figures9/11/12 are now inspected, with an
    ATP panel/caption discrepancy and printed preparation-volume ambiguity retained. Original 2007 journal
    text, remaining supplements and later experiments are still gaps. Gene adjacency and predicted regulons
    are not causal proof.
