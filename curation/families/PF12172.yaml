causal_graphs:
  - graph_id: tc-duf35-addition-aldolase
    title: T. curvata DUF35 addition increases Ltp2 activity
    scope: Purified Tcur3479 Ltp2 and Tcur3482 ChsH2 C-terminal construct from Thermomonospora curvata DSM 43183; in-vitro mixing experiment.
    context: Ten-minute incubation at Ltp2:DUF35 ratio 1:5; activity toward 21 uM 17-HOPC-CoA measured at 25 C in 100 mM HEPES pH 7.5 with 200 uM NADH and 16 uM TTHB247.
    family_mapping: D1AB77, sequence version 1, 319 residues; PF12172 spans 199-234. Deposited 6OK1 entity 2 is initiator M plus reference 188-319 and also includes PF01796 at 237-298.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:471852
    limitations: The tested construct includes both domains; their individual contributions are unresolved. Ltp2 alone retains weak activity and DUF35 alone is inactive. The same experiment is retained in PF01796, not independent replication. The M. tuberculosis experiment is excluded because its protein lacks a current PF12172 match; zinc binding is not itself evidence of catalytic causation.
    nodes:
      - node_id: tc-duf35-addition
        label: Addition of the ChsH2 C-terminal construct to Ltp2 at 1:5
        node_type: PERTURBATION
        grounding:
          - UniProtKB:D1AB77
      - node_id: tc-ltp2-aldolase-activity
        label: Ltp2 aldolase specific activity toward 17-HOPC-CoA
        node_type: ACTIVITY
    edges:
      - edge_id: tc-duf35-increases-ltp2-activity
        subject: tc-duf35-addition
        predicate: increases
        object: tc-ltp2-aldolase-activity
        mechanism: Mixing the purified partner construct with Ltp2 raises measured specific activity from about 0.00042 to 0.14 umol/min/mg in the coupled assay; this does not demonstrate isolated zinc-ribbon catalysis or a zinc-dependent activation mechanism.
