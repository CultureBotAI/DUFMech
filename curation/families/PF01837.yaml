causal_graphs:
  - graph_id: miyazaki-duf39-pooled-fitness
    title: DvMF_1464 insertion mutants have a methionine-rescuable fitness defect
    scope: Pooled barcoded transposon mutants of D. vulgaris Miyazaki F, measuring relative abundance of DvMF_1464 insertion strains during lactate/sulfate growth; not a clean deletion, individual growth curve or purified DUF39 reaction.
    context: Figure 3 compares defined lactate/sulfate medium without added amino acids with supplementation, including L-methionine at 1 or 10 mM. Pools are recovered in rich medium, transferred at OD600 0.02 and assayed at saturation by barcode sequencing. Miyazaki-specific methods describe anaerobic, unshaken Hungate cultures with 1 mM sulfide and 10 mL medium; generic fitness methods say 5 mL. Exact Figure 3 volume, temperature and elapsed time remain unverified.
    family_mapping: DvMF_1464 maps to NCBIProtein:ACL08412.1, CP001197.1 positions 1794909-1796081, and the identical 390-aa sequence in UniParc UPI00018940C6, with PF01837 at 22-380. Historical UniProtKB B8DLN6 is deleted because it is not in a reference proteome; it is not an unresolved protein identity. The taxon 883 archive now uses Nitratidesulfovibrio vulgaris for the same Miyazaki F strain.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:883
    limitations: Fitness is a normalized change in mutant abundance relative to the pool, not an absolute growth rate or a wild-type-versus-deletion monoculture comparison. Nutritional rescue is not genetic complementation. Insertion polarity, cross-feeding and insertion-level contributions were not independently resolved. Partial cysteine rescue and the different homoserine-dehydrogenase locus are not proof of this protein's catalytic substrate or a direct sulfur-transfer step. No isolated-domain or family-wide mechanism is assigned.
