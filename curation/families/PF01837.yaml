discussions:
  - discussion_id: duf39-assay-resolution-and-biochemistry
    prompt: Resolve assay and construct details and inspect member-specific biochemical evidence before adding DUF39 reaction steps.
    kind: CURATION_TODO
    status: OPEN
    rationale: The retained graphs establish conditional genetic and nutritional effects in two bacterial strains. Neither proves sulfur transfer, a thioaldehyde intermediate, isolated-domain catalysis or the functions of archaeal CBS/ferredoxin fusions.
    evidence:
      - reference: PMID:29324779
        supports: PARTIAL
        evidence_source: full_text
        explanation: Figure 3 supports pooled fitness and methionine rescue; strain-specific and generic methods differ on culture volume. Insertion-level data, exact timing and genetic complementation of DvMF_1464 remain outside this assessment.
      - reference: PMID:24865553
        supports: PARTIAL
        evidence_source: full_text
        explanation: Figure 4 and complementation methods support the G20 plate phenotype; the image/caption medium discrepancy, full pJK2 junctions and insertion coordinate need follow-up. Supplemental PDF/XLSX retrieval returned HTML or HTTP 403.
      - reference: PMID:25938369
        supports: PARTIAL
        evidence_source: abstract
        explanation: Archaeal homocysteine synthesis from aspartate semialdehyde and hydrogen sulfide is a primary biochemical lead; its full assays and tested constructs were not independently inspected here.
      - reference: PMID:28165724
        supports: PARTIAL
        evidence_source: abstract
        explanation: MA1821 persulfide evidence is a distinct archaeal lead. The abstract's SepCysS single-turnover result must not be transferred to MA1821 or the bacterial proteins.
    posed_by: Codex
    posed_date: '2026-10-11'
    notes: Preserve the historical UniProt deletion and corrected G20 start. Nutritional rescue is not the same as genetic rescue. Do not merge the 2014 proposed homoserine route and the later alternate model into an observed chain, or infer protein partners from cofitness alone.
