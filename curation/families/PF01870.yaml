- graph_id: pfu-synthetic-junction-cleavage
  title: Purified Pfu Hjc cleaves synthetic four-way DNA junctions
  scope: Komori1999 Figure4, immobile4J and mobile4Jh in separate reactions.
  context: 10 nM Hjc and10 nM substrate,10 mM Tris pH8.8,10 mM MgCl2,200 mM KCl,1 mM DTT,56 C1 h; denaturing
    PAGE with strand-specific labels.
  family_mapping: Pfu PF1503,E7FHX4 sequence version1,123 aa,equals BAA82839.1 from AB023635.1 and WP_011012650.1;
    PF01870 1-97. Untagged pPFHJ2/pET21a preparation, not an isolated domain.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:186497
  limitations: Predominant opposing strand2/4 cuts coexist with minor cuts. Other DNA structures can be
    weak substrates, especially at higher enzyme doses. No family-wide exclusivity or cellular repair
    claim.
