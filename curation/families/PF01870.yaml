- graph_id: pfu-extract-immunodepletion
  title: Anti-Hjc depletion reduces extract junction cleavage
  scope: Komori1999 Figure3, crude Pfu extract immunodepletion.
  context: Antibody treatment at room temperature;4 ul treated extract with10 nM junction in standard
    cleavage buffer,56 C30 min. Anti-PCNA and anti-PI-PfuI comparison antibodies; immunoprecipitate Western
    blot.
  family_mapping: Endogenous Pfu Hjc assigned to PF1503/E7FHX4,PF01870 1-97,via the original cloned gene
    and antibody experiment. Whole extract, not purified domain.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:186497
  limitations: Cell-free extract endpoint, not a cellular knockout. Co-depletion remains possible and
    no add-back rescue is shown. Anti-PCNA co-precipitation is association evidence, not a PCNA activation
    edge.
