- graph_id: pfu-reca-intermediate-resolution
  title: Pfu Hjc resolves RecA-generated DNA intermediates in vitro
  scope: Komori1999 Figure5, purified Hjc added after E.coli RecA strand exchange.
  context: RecA2.7 uM with gapped pUC1186 uM nucleotides and labeled linear DNA3 uM nucleotides; strand
    exchange37 C20 min after5 min preincubation. Hjc0-50 nM then55 C10 min; agarose analysis after deproteinization.
  family_mapping: Pfu PF1503,E7FHX4/WP_011012650.1,PF01870 1-97. The RecA component is bacterial; this
    is a mixed-species reconstitution, not a Pfu cellular pathway.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:186497
  limitations: Resolved product classes are assigned by the source's gel interpretation. RuvC control
    uses37 C1 h and cannot provide a matched rate comparison. No elementary reaction rate or intracellular
    repair measurement.
