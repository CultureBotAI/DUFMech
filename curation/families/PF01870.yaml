- graph_id: pfu-magnesium-dependent-cleavage
  title: Added magnesium supports Pfu Hjc cleavage
  scope: Komori2000 Figure4B, MgCl2 titration in the specified reconstitution.
  context: 10 nM Hjc,100 nM4Jh,56 C30 min;10 mM Tris pH8.8,200 mM KCl,1 mM DTT,variable added MgCl2. Product
    readout by gel electrophoresis.
  family_mapping: Pfu E7FHX4/WP_011012650.1,123 aa,PF01870 1-97. Intact enzyme preparation with DNA, not
    isolated domain or metal alone.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:186497
  limitations: Added-metal dependence does not identify metal ligands or prove a unique physiological
    cofactor. Mn supports lesser activity in a separate panel; zinc salt is inconsistent between text
    and figure. Temperature effects are not automatically enzyme denaturation.
