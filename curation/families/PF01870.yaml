    subject: hjc-reaction
    predicate: produces
    object: cleavage-products
    mechanism: Protein-containing reactions yield mapped cleavage products absent from matched no-protein
      lanes; the major sites are symmetrical on opposing strands, with additional minor sites retained.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
