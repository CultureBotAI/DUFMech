  - graph_id: yih1-h1511-starvation-growth
    title: GST-Yih1 overexpression reduces H1511 growth under 3AT starvation
    scope: H1511 with endogenous YIH1 and plasmid-borne GST-Yih1(2-258) versus GST-only control in Figure 5A.
    context: Spot 5 ul of tenfold serial dilutions of overnight cultures on synthetic minimal galactose medium with or without 3AT. The inspected 2011 caption does not specify plate 3AT concentration, incubation temperature or duration; the liquid 10-mM/1-h protocol is not transferred.
    family_mapping: The YCR059C fusion maps to P25637 with PF01205 at 144-251 and separate RWD at 6-108. Endogenous Yih1 remains present in this host. Current reference identity does not reconstruct every historical host or plasmid sequence.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:4932
    limitations: Growth is an indirect integrated phenotype, not direct kinase activity, viability loss or a quantified growth rate. Nonstarved plates constrain starvation specificity. This is not a normal-expression loss-of-function assay or an isolated ancient-domain effect.
