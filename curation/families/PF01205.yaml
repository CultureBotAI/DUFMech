causal_graphs:
  - graph_id: yih1-h1511-starvation-phosphorylation
    title: GST-Yih1 overexpression lowers starvation-induced eIF2alpha phosphorylation
    scope: Saccharomyces cerevisiae H1511 expressing N-terminal GST-Yih1(2-258) from pES187-B1 versus GST alone in Sattlegger 2011 Figure 5C/D. This is a whole-protein overexpression phenotype.
    context: Galactose-induced exponential cultures are treated with 10 mM 3AT for 1 h before harvesting. Immunoblots measure Ser51-phosphorylated eIF2alpha relative to total eIF2alpha; at least two independent transformants and SE are reported. Plate-growth conditions are separate.
    family_mapping: P25637/YIH1_YEAST is YCR059C, 258 aa, sequence version 1; the cited GI 6319904 resolves to matching NP_009985.1. PF01205 maps to 144-251 in the C-terminal ancient domain, despite the preserved Impact_N label. PF05773 RWD is separately at 6-108. The 2-258 fusion retains both; exact historical junctions remain unverified. P40512/PCI8 is an unrelated YIH1 synonym.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:4932
    limitations: Figure 2 confirms overexpression, not physiological dosage. RWD-only 2-132 lacks PF01205 yet inhibits, whereas 133-258 retains PF01205 but has little effect. This does not establish isolated PF01205 inhibition, direct eIF2alpha dephosphorylation or increased total translation. Binding and modeled actin switching are not an observed causal chain.
