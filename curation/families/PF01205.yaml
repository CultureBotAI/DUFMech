  - graph_id: yih1-deletion-background-starvation-growth
    title: GST-Yih1 expression reduces starvation growth without endogenous Yih1
    scope: ESY11001b, the H1511-derived yih1 deletion strain, expressing GST-Yih1(2-258) versus GST alone in Figure 5B.
    context: The same 5-ul tenfold dilution plate assay uses galactose minimal medium with or without 3AT. Plate dose, time and temperature remain unverified; the deletion background is not combined with the H1511 phosphorylation assay.
    family_mapping: The expressed P25637-mapped 2-258 fusion contains PF01205 144-251 and RWD 6-108. Endogenous YIH1 is deleted by the reported PCR-based construction; exact deletion junctions and fusion scars were not reconstructed.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:4932
    limitations: This comparison shows that the overexpression-associated growth effect does not require endogenous Yih1. It is not rescue of a deletion defect. Figure 5B's truncated-construct labels differ from Table 1, but its adopted 2-258 row is unambiguous; those truncated rows are not new edges.
