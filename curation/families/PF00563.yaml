      - edge_id: e352q-decreases-hydrolysis-turnover
        subject: rocr-e352q
        predicate: decreases
        object: rocr-hydrolysis
        mechanism: The E352Q variant has lower enzyme-normalized turnover than wild type in the same Table 1 assay. This is an observed substitution effect on catalysis, not direct observation of proton transfer by E352.
        directness: DIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:18344366
            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2394985/
            snippet: Both mutants showed >10 4 -fold reduction
            explanation: Table 1 reports WT kcat 0.67 +/- 0.03 per second and E352Q (1.1 +/- 0.1) x 10^-5 per second, a 6.1 x 10^4-fold decrease. Figure 4 was visually inspected with its different vertical scales. Figure 3 tests E352A at different magnesium levels and is not substituted for these rates.
