causal_graphs:
  - graph_id: pao1-rocr-purified-hydrolysis
    title: Purified PAO1 RocR hydrolysis and the E352Q turnover defect
    scope: Recombinant full-length PA3947/RocR and its E352Q variant; not an isolated EAL domain, cellular signaling chain or family-wide activity assignment.
    context: His6-tagged protein expressed from pET-26(b+) in E. coli BL21(DE3). Table 1 assays use 100 mM Tris pH 8.0, 23 C, 20 mM KCl and 25 mM MgCl2. HPLC measures initial product formation below 10% substrate conversion; higher mutant enzyme concentrations permit rate measurement. The substrate and Mg2+ are joint assay inputs, not independent sufficient causes.
    family_mapping: PAO1 rocR/sadR, locus PA3947, maps to UniProtKB:Q9HX69 and NCBIProtein:AAG07334.1. Reference sequence version 1 has 392 residues, with PF00563 at 147-379 and E at position 352. The separate PROSITE annotation at 140-392 is not the Pfam boundary. The final recombinant tag junctions were not independently verified.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:208964
    limitations: The substitution effect is measured directly, but does not uniquely establish a general-base role or exclude subtle structural changes. The 2012 R286W structure could not discriminate one- versus two-metal catalysis. No RocS1 phosphotransfer, biofilm effect or isolated-domain sufficiency is asserted. Other EAL proteins may be catalytically inactive; this graph covers one tested member.
