discussions:
  - discussion_id: rocr-atomic-regulation-and-family-limits
    prompt: Resolve construct details, competing catalytic models and additional EAL member contexts before expanding this graph.
    kind: CURATION_TODO
    status: OPEN
    rationale: Two direct assay-level edges do not determine atomistic catalysis, phosphorylation-dependent activation or a downstream cellular phenotype. Family membership is not evidence of catalytic competence for every EAL protein.
    evidence:
      - reference: PMID:18344366
        supports: PARTIAL
        evidence_source: full_text
        explanation: Table 1 and Figures 3-4 were inspected. Mutant kinetics support a turnover defect; pH dependence and docking motivate but do not directly observe a proton-transfer mechanism.
      - reference: PMID:22753070
        supports: PARTIAL
        evidence_source: full_text
        explanation: The later primary study explicitly leaves the one- versus two-metal distinction unresolved in its R286W structure and presents phosphorylation-dependent modulation as putative.
    posed_by: Codex
    posed_date: '2026-10-11'
    notes: The 2012 interpretation is retained in evidence/PF00563/chen-2012-rocr-limits.txt. Other mutations, experimental contexts and later literature have not received a complete family review. Status remains IN_PROGRESS.
