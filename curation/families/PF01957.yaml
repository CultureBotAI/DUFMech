- graph_id: bacillus-yqez-operon-deletion-2006
  title: Deleting the YqeZ-containing operon increases sublancin-associated inhibition
  scope: B. subtilis CU1065 without SPbeta immunity; HB5331 yqeZyqfAB::kan versus the parent lawn, exposed
    to JH642 producer.
  context: Butcher2006 Figure4A text and legend, Table3 and spot-on-lawn Methods; 0.7% LB agar, 100ul
    lawn OD600 0.4 in 2ml agar, 2ul producer OD600 0.6, overnight37C.
  family_mapping: The jointly deleted operon contains YqeZ/NfeD1, current B. subtilis 168 reference P54465
    v1, 437 aa, PF01957 382-435. CU1065 is the experimental strain, not the reference accession's exact
    verified allele. YqfA and YqfB are not independently attributed to PF01957.
  taxon: NCBITaxon:1423
  scope_status: PHENOTYPIC
  limitations: Whole-operon perturbation cannot isolate YqeZ or its domain. YqfB-only deletion is similarly
    sensitive. Producer sunA deletion and SPbeta restoration remove inhibition, but no purified-peptide
    MIC or degradation assay was performed in this comparison. Original Figure4/supplements and quantitative
    replication remain uninspected; only the text-supported qualitative direction is retained.
  nodes:
  - node_id: operon_loss
    label: Joint yqeZyqfAB deletion versus CU1065 parent
    node_type: PERTURBATION
    grounding:
    - UniProtKB:P54465
  - node_id: inhibition
    label: Sublancin-associated lawn inhibition by JH642
    node_type: PHENOTYPE
  edges:
  - edge_id: operon-loss-inhibition
    subject: operon_loss
    predicate: increases
    object: inhibition
    mechanism: Removing the three-gene locus increases the reported growth-inhibition zone in this immunity-deficient
      lawn; the responsible molecular contribution of YqeZ is not isolated.
    directness: UNRESOLVED
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:16629676
      source_url: https://onlinelibrary.wiley.com/doi/full/10.1111/j.1365-2958.2006.05131.x
      snippet: yqeZyqfAB
      explanation: Figure4A column4 and associated Results; the ledger records the native whole-operon
        genotype and matched controls, not a single-domain intervention.
      cache_path: evidence/PF01957/butcher-2006-operon-resistance.txt
      cache_sha256: dbe96f4f6d5842c32a398ede4f6a737339309d4df79feb2f98df027724f46a97
- graph_id: bacillus-yqez-operon-complementation-2006
  title: Induced YqeZ-containing operon reduces inhibition in a sigW mutant
  scope: CU1065 sigW::kan HB6161 with integrated Pxyl-yqeZyqfAB compared with the sigW mutant under matched
    xylose conditions.
  context: Butcher2006 Figure4B column3 and Methods; 20mM xylose induction, 0.7% LB agar, JH642 producer,
    overnight37C. pSG1 single-crossover integration was PCR-confirmed; this is not deletion/rescue in
    HB5331.
  family_mapping: The entire operon includes YqeZ, reference P54465 v1 with PF01957 382-435. Neither isolated
    YqeZ nor its PF01957 domain was shown sufficient. The study reports a YqfB V65E reference difference
    in CU1065/JH642, not a YqeZ mutation.
  taxon: NCBITaxon:1423
  scope_status: PHENOTYPIC
  limitations: Xylose itself reduces inhibition zones, so unmatched induced/uninduced comparisons would
    confound the effect. Partial yqfAB or yqfB constructs failed to complement but do not demonstrate
    YqeZ-only sufficiency. No direct peptide cleavage, independent domain action or complete restoration
    magnitude is assigned; original figures/supplements remain uninspected.
  nodes:
  - node_id: induced_operon
    label: Induced yqeZyqfAB in sigW mutant versus matched sigW control
    node_type: PERTURBATION
    grounding:
    - UniProtKB:P54465
  - node_id: inhibition
    label: Sublancin-associated inhibition zone under matched xylose
    node_type: PHENOTYPE
  edges:
  - edge_id: operon-expression-inhibition
    subject: induced_operon
    predicate: decreases
    object: inhibition
    mechanism: Expression of the complete operon bypasses part of the missing sigma-factor-dependent resistance
