causal_graphs:
- graph_id: ecoli-ybbj-qmca-growth-rescue-2006
  title: YbbJ coexpression enhances QmcA-assisted conditional growth rescue
  scope: E. coli AD1762 ftsH/htpX-disrupted cells with sfhC21; pSTD622 qmcA-ybbJ versus pSTD620 qmcA alone.
  context: Chiba2006 Figure2A/B text and legend. L medium with 1mM IPTG; 3-ul serial-dilution plate spots
    at 42C for 24h, and a separate liquid-growth time course shifted from 30C to 42C. Plate comparisons
    at 30C for 17h and with 0.4% glucose provide conditional controls.
  family_mapping: MC4100-derived YbbJ clone; current reference P0AAS3 v2 is 152 aa with PF01957 94-148.
    The reference sequence changed in 2007 and is not a verified historical plasmid sequence. QmcA is
    a required coexpressed partner, not a second PF01957 protein.
  taxon: NCBITaxon:562
  scope_status: PHENOTYPIC
  limitations: YbbJ alone did not suppress. Similar QmcA abundance was reported without shown data. No
    isolated PF01957 activity, direct chaperoning, proteolysis or FtsH activation is established. The
    source images, replicate counts and exact effect sizes remain uninspected; graphs retain text-supported
    direction only. Liquid and plate readouts are not sequential steps.
  nodes:
  - node_id: pair
    label: qmcA-ybbJ coexpression versus qmcA alone in the same sensitized strain
    node_type: PERTURBATION
    grounding:
    - UniProtKB:P0AAS3
  - node_id: plate
    label: Colony growth in serial-dilution spots at 42C
    node_type: PHENOTYPE
  - node_id: liquid
    label: Liquid-culture growth after the shift to 42C
    node_type: PHENOTYPE
  edges:
  - edge_id: ybbj-plate-growth
    subject: pair
    predicate: increases
    object: plate
    mechanism: Adding ybbJ to the QmcA expression construct improves the reported colony-growth suppression
      of the ftsH/htpX defect under induction; the cellular mediator is unresolved.
    directness: UNRESOLVED
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
