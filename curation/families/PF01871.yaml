        subject: i2e3-morpholino
        predicate: increases
        object: heart-rate
        mechanism: I2E3-treated embryos have a higher measured heart rate than embryos receiving the same dose of standard morpholino. No intervening molecular mechanism is demonstrated.
        directness: INDIRECT
        support: OBSERVED
