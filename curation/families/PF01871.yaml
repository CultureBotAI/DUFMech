  - graph_id: human-g177d-nuclear-pattern
    title: Human G177D changes the intranuclear fluorescence pattern
    scope: Andreoletti2016 Figure2, GFP-tagged human AMMECR1 in HEK293, HeLa and COS-7 hosts, each compared with WT.
    context: RG212378/pCMV6-AC-GFP variant1;3 ug plasmid/jetPEI per6-well culture,DMEM10% FCS,complex removal4 h,fixation24 h,fluorescence/DAPI microscopy; reagent-only negative control.
    family_mapping: Human Q9Y4X0 sequence version1 equals NP_056180.1 from NM_015365.3,333 aa,PF01871 132-301. G177 is inside the match; published primer and reference translation support G177D. Whole tagged protein,not isolated domain. COS-7 is an African green monkey host,not the protein's species.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:9606
    limitations: Both WT and mutant remain nuclear. Qualitative imaging does not measure nuclear-import loss,protein half-life,proteasome recruitment or degradation. Tag,folding,abundance and partner effects remain possible.
    nodes:
      - node_id: g177d
        label: Express GFP-tagged human G177D instead of WT AMMECR1
        node_type: PERTURBATION
        grounding:
          - UniProtKB:Q9Y4X0
      - node_id: patchy-nuclear-signal
        label: Nonuniform intranuclear GFP pattern
        node_type: PHENOTYPE
    edges:
