        subject: g177d
        predicate: increases
        object: patchy-nuclear-signal
        mechanism: The mutant produces a patchy nuclear pattern compared with the more uniform WT pattern in each tested host. This is a mutation-dependent localization readout,not a demonstrated molecular degradation pathway.
