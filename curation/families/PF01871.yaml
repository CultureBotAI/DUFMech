  - discussion_id: ammecr1-biochemistry-and-domain-scope
    prompt: Establish a member-specific biochemical mechanism before adding catalytic edges.
    kind: CURATION_TODO
    status: OPEN
    rationale: Localization,developmental and marker-expression phenotypes do not establish the conserved domain reaction. Radical-transfer/RNA-modification predictions and structural clefts remain hypotheses.
    evidence:
      - reference: PMID:31953406
        supports: PARTIAL
        evidence_source: primary_methods_and_original_supplementary_figure
        explanation: Supplementary Figure7 supports selected transcript responses; the paper's SRRT/CBC/U1 mechanism regulates Ammecr1 RNA and is not an activity of AMMECR1 protein.
    notes: See evidence/PF01871/ammecr1-identity.txt and ammecr1-gap-ledger.txt. Distinguish isoforms and AMMECR1L,verify isolated-domain function and preserve negative marker comparisons. Family-wide EX_DUF status is not experimental characterization of all7217 proteins.
