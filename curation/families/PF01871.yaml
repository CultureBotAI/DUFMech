  - graph_id: zebrafish-i2e3-heart-and-tail
    title: I2E3 splice perturbation changes heart rate and tail length
    scope: Final author-manuscript Figure4B-D, TU zebrafish at3 dpf, I2E3 morpholino1.26 ng versus matched standard-control morpholino.
    context: Inject1-2-cell embryos with1-2 nl;27 C,pH7.5. Heart beats/minute and otic-vesicle-to-tail-end distance along curvature are independent readouts.
    family_mapping: Zebrafish Q6PH60 sequence version1 equals NP_956875.1/NM_200581.1,309 aa,PF01871 109-277. The early manuscript alignment names NP_956875.1. Splice perturbation of the endogenous transcript,not a purified or isolated domain.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:7955
    limitations: WT-transcript reduction50/72/84% was measured at2.1/4.2/8.4 ng,not1.26 ng. Figure4A morphology uses2.1 ng. Do not conflate doses or convert transcript depletion into measured protein depletion. Morphant off-target effects are not absolutely excluded.
