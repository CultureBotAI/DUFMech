  - graph_id: zebrafish-human-mrna-tail-rescue
    title: Human AMMECR1 mRNA partially rescues the tail endpoint
    scope: Final Figure4C/D, TU embryos receiving I2E3 morpholino1.26 ng with versus without human AMMECR1 mRNA200 pg.
    context: pCS2+ human AMMECR1,SP6-transcribed and LiCl-purified mRNA,co-injected at1-2-cell stage;3-dpf curved otic-vesicle-to-tail-end distance. Standard morpholino and mRNA-alone controls are included.
    family_mapping: Recipient ammecr1 maps Q6PH60/NP_956875.1,PF01871 109-277. Human reference Q9Y4X0/NP_056180.1 maps132-301; exact pCS2+ rescue insert is not independently sequence-verified. Cross-species whole-protein rescue,not isolated-domain sufficiency.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:7955
    limitations: Rescue is partial and remains below control. No heart-rate rescue is plotted. Caption reports two experiments with one illustrated; text/plot significance thresholds differ. Exact rescue isoform/insert verification remains a follow-up.
    nodes:
      - node_id: human-mrna-with-i2e3
        label: Add human AMMECR1 mRNA200 pg to I2E3 morpholino1.26 ng
        node_type: PERTURBATION
      - node_id: curved-tail-length
        label: Otic-vesicle-to-tail-end distance along curvature
        node_type: PHENOTYPE
