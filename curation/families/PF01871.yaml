  - graph_id: zebrafish-e1i1-heart-rate
    title: E1I1 splice perturbation increases heart rate
    scope: Final Figure4B, TU zebrafish at3 dpf, E1I1 morpholino8.4 ng versus standard-control morpholino8.4 ng.
    context: Same1-2-cell injection and27 C protocol; hypomorphic splice context with loss of six exon1 codons.
    family_mapping: Endogenous ammecr1,Q6PH60/NP_956875.1,PF01871 109-277. The transcript intervention does not isolate or demonstrate necessity of the mapped domain.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:7955
    limitations: Earlier manuscript Methods says8.2 ng; final Figure4B and Results say8.4 ng. The graph uses the figure dose while retaining the discrepancy. Gross morphological defects were not observed in this hypomorphic context; no full loss-of-function equivalence is implied.
