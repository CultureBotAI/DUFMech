  title: Charge substitutions have client-specific reporter effects
  scope: Alternative R31/R180 glutamate or lysine constructs, not simultaneous mutations or rescue by
    adding free lysine.
  context: Same tagged exogenous HEK293 reporter system as Figure3E and S13B/C. Glutamate variants compare
    with WT; lysine variants compare with glutamate at the same site. SQS and OPRK1 fluorescence ratios
    are separately measured endpoints.
  family_mapping: Q9P0I2 v3 R31 and R180 lie within PF01956 5-191; all constructs retain C-terminal TagBFP-3xFLAG
    and other endogenous EMC components.
  taxon: NCBITaxon:9606
  scope_status: PHENOTYPIC
  limitations: Positive-charge substitution improves some client outcomes, not every client or all WT
    properties. R31K does not restore OPRK1 in S13C. K versus E changes more than electrostatic sign;
