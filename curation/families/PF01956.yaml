- graph_id: human-emc3-alanine-and-loop-reporters-2020
  title: EMC3 alanine and four-methionine variants reduce client reporter ratios
  scope: Exogenous EMC3-TagBFP-3xFLAG variants in stable HEK293 reporter cells; not endogenous mutant
    knock-ins or EMC3-null rescue.
  context: Pleiner2020 Figure3C/D and S13C; lentiviral pHAGE2/CMV WT versus variants, BFP-positive cells.
    RFP-SQS uses RFP:GFP; OPRK1-GFP uses GFP:RFP. At least three independent experiments for R31/R180/MCyt-1-S,
    representative histograms. VAMP2/TRAM2 are matched EMC-independent controls.
  family_mapping: Human Q9P0I2 v3, 261 aa, PF01956 5-191. R31/R180 and M101/M106/M110/M111 lie within
    the interval; MCyt-1-S changes all four methionines jointly. Historical plasmid sequence remains unverified;
    the C-terminal fluorescent/epitope tag is retained.
  taxon: NCBITaxon:9606
  scope_status: PHENOTYPIC
  limitations: Fluorescence is a relative abundance/stability proxy, not a directly measured insertion
    rate. EMC2/EMC4 co-IP limits gross assembly loss but does not establish equal abundance, folding or
    stoichiometry. No single-methionine effect or direct loop-capture trajectory is established. F173A
    and the outside-domain MCyt-2-S loop show no appreciable defect in the reported assays.
  nodes:
