- graph_id: human-emc-proteolysis-context-2018
  title: Protease pretreatment reduces EMC-vesicle insertion activity
  scope: Trypsin treatment of the assembled human EMC in proteoliposomes.
  context: Guna2018 FigureS19; pretreated versus untreated vesicles assayed with PURE-derived CaM-SQS
    using the C-terminal protease-protected fragment assay. Empty vesicles and WT/EMC6-deficient microsomes
    are comparison arms.
  family_mapping: EMC3 Q9P0I2 v3, PF01956 5-191, is present in the EMC5-tagged complex; no selective EMC3
    cleavage or residue perturbation was performed.
  taxon: NCBITaxon:9606
  scope_status: PHENOTYPIC
  limitations: The necessary trypsin-sensitive component is not isolated; dose/duration were not established
    from the inspected Methods. Loss of protected product is not direct proof of a specific EMC3 domain
    mechanism. S19 image and legend were inspected without assigning an exact effect size.
  nodes:
  - node_id: trypsin
    label: Trypsin pretreatment versus untreated EMC vesicles
    node_type: PERTURBATION
  - node_id: insertion
    label: Protected SQS reporter product
    node_type: STATE
  edges:
  - edge_id: pretreatment-insertion
    subject: trypsin
    predicate: decreases
    object: insertion
    mechanism: Shaving accessible protein regions reduces insertion activity of EMC vesicles under the
      reported assay, without resolving which subunit or conformational change mediates the effect.
    directness: UNRESOLVED
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:29242231
      source_url: https://www2.mrc-lmb.cam.ac.uk/groups/hegde/download/Science_2017c.pdf
      snippet: trypsin sensitive
      explanation: Supplement S19 legend, combined author PDF p32; conditional biochemical perturbation
        of the entire EMC preparation, not selective EMC3 deletion.
