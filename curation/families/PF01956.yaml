- graph_id: yeast-emc3-deletion-growth-2020
  title: EMC3 deletion impairs yeast colony growth at elevated temperature
  scope: BY4741 EMC3 deletion versus WT, not deletion of the whole EMC or the PF01956 interval alone.
  context: Bai2020 Figure1b; equal starting OD, 7 ul tenfold serial dilutions on YPD, 37 C for two days.
    The separate 30 C arm is permissive; three repeats reported.
  family_mapping: EMC3/YKL207W corresponds to S288c reference P36039 v3, 253 aa, PF01956 2-197. BY4741
    is the actual cellular background; exact historical deletion junctions remain unverified.
  taxon: NCBITaxon:4932
  scope_status: PHENOTYPIC
  limitations: Colony growth is not direct viability, liquid growth rate or universal essentiality. No
    reintroduction rescue is shown for this selected assay; loss of a complex subunit may affect many
    clients. W303-1a structural purification is not this strain comparison.
  nodes:
  - node_id: deletion
    label: BY4741 EMC3 deletion versus WT
    node_type: PERTURBATION
    grounding:
    - UniProtKB:P36039
  - node_id: growth
