discussions:
- discussion_id: pf01956-member-and-context-coverage
  prompt: Extend primary coverage to TMCO1, archaeal Ylp1 and remaining EMC3 systems without transferring
    mechanisms between them.
  kind: CURATION_TODO
  status: OPEN
  rationale: The retained experiments concern assembled human EMC, selected human/yeast EMC3 perturbations
    and selected human TMCO1/OPTI client-biogenesis contexts, not every member of this former DUF106 family.
  evidence:
  - reference: PMID:27212239
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: TMCO1 calcium-channel abstract inspected; full constructs, electrophysiology and cellular
      controls remain unreviewed.
  - reference: PMID:26256539
    supports: PARTIAL
    evidence_source: database
    explanation: Archaeal Ylp1 structural study is an imported citation lead, not yet an inspected insertion
      assay.
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: Current TMCO1 Q9UM00 v2 is 239 aa; shorter Q9UM00-1 lacks canonical 1-51, but historical clones
    remain unverified. Selected 2020 and 2022 abundance/topogenesis effects are now retained. Review the
    inaccessible 2016 channel experiments, archaeal Ylp1, later native-client/holo-insertase work and
    original genetics. See evidence/PF01956/identity-and-boundaries.txt and tmco1-isoforms-and-constructs.txt.
    All earlier corpus follow-ups remain open.
- discussion_id: pf01956-insertion-mechanism-and-constructs
  prompt: Resolve exact historical constructs and directly test the proposed insertion intermediates.
  kind: CURATION_TODO
  status: OPEN
  rationale: Reconstitution establishes whole-complex activity; cellular fluorescence, growth and localization
    do not identify each molecular step or isolated EMC3 sufficiency.
  evidence:
  - reference: PMID:32439656
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Figure3 and S13 support variant-specific reporter effects; S9 is proximity evidence and
      the loop/thinning mechanism is a model.
  - reference: PMID:32494008
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Figures1/3 support yeast phenotypes; Hxt3 RNA decreases and gross complex assembly controls
      do not exhaust alternatives.
  - reference: PMID:29242231
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Figure4 and supplementary Methods support mixed-orientation EMC reconstitution; Figure4C
      timing, vesicle preparation assignment and trypsin protocol remain qualified.
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: Verify variant plasmid sequences/junctions, endogenous-versus-exogenous stoichiometry and yeast
    alleles; inspect raw gels and unreviewed supplements. Pleiner supplement calls an amber codon UGA.
    Do not silently repair the source or turn crosslinking, membrane thinning or putative gating into
    observed sequential edges.
- discussion_id: pf01956-tmco1-channel-and-topogenesis
  prompt: Distinguish TMCO1 channel claims from partner-dependent client biogenesis and resolve the historical
    constructs.
  kind: CURATION_TODO
  status: OPEN
  rationale: The 2020 and 2022 loss-of-function effects do not by themselves establish or disprove calcium
    permeation through TMCO1, and loss of TMCO1 also affects OPTI and translocon recruitment.
  evidence:
  - reference: PMID:27212239
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Abstract and postprint landing metadata inspected; CSU/publisher PDF access failed, so
      channel figures and D140 experiments remain unreviewed.
  - reference: PMID:32820719
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Figure5 and supplement1 support endogenous EAAT1 abundance effects; the proposed client-biogenesis
      explanation for calcium phenotypes is not direct experimental mediation.
  - reference: PMID:36261522
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: Figures1/4 and Extended Data1/5 support partner abundance and separate topogenesis-sensitive
      endpoints, not isolated TMCO1 activity.
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: Map exact historical sequences before residue-level edges. Resolve siRNA gating wording, stock/final
    culture concentrations, clone junctions and uninspected source data. Inspect substrate-driven recruitment
    perturbations and the accompanying structural work separately. No direct phenotype-to-phenotype chain
    or family-wide insertase/channel equivalence is inferred.
causal_graphs:
- graph_id: human-emc-reconstituted-insertion-2018
  title: Purified human EMC supports SQS reporter insertion into vesicles
  scope: Intact human EMC purified via EMC5-3xFLAG from T-Rex HEK293 cells, not isolated EMC3.
  context: Guna2018 Figure4C/D; matched empty versus EMC proteoliposomes. Separate native-RRL and isolated
    PURE-derived CaM-SQS preparations; protected C-terminal 3F4 fragment measured by autoradiography.
    Defined-complex assay uses 0.5 mM EGTA, 32 C for 20 min, then proteinase K and fragment IP; four experiments
    per graph, mean +/- SD.
  family_mapping: The complex contains human EMC3, current reference Q9P0I2 v3, 261 aa, PF01956 5-191.
    The tag is on EMC5. Historical EMC3 sequence is not independently verified, and EMC3 is only one required
    complex component.
  taxon: NCBITaxon:9606
  scope_status: MECHANISTIC
  limitations: Whole-complex assay sufficiency only. About one-third of reconstituted EMC is productively
    oriented. Fresh vesicles or once-frozen cholesterol-containing vesicles were used; specific lane assignment
    is not resolved. Figure4C timing is not explicitly separated from the general 15-min RRL protocol.
    Protected product is not native SQS catalytic activity; VAMP2 is a poorly inserted comparison substrate,
    not proof of universal specificity.
  nodes:
  - node_id: rrl_emc
    label: EMC versus empty vesicles with native-RRL SQS reporter
    node_type: ACTIVITY
    grounding:
    - UniProtKB:Q9P0I2
  - node_id: rrl_product
    label: Protected inserted SQS reporter fragment from RRL substrate
    node_type: STATE
  - node_id: cam_emc
    label: EMC versus empty vesicles with isolated CaM-SQS and EGTA
    node_type: ACTIVITY
    grounding:
    - UniProtKB:Q9P0I2
  - node_id: cam_product
    label: Protected inserted SQS fragment from the defined CaM complex
    node_type: STATE
  edges:
  - edge_id: rrl-insertion
    subject: rrl_emc
    predicate: increases
    object: rrl_product
    mechanism: Reconstituted assembled EMC increases the membrane-protected SQS reporter product relative
      to empty vesicles in Figure4C; the molecular catalyst is the complex, not an isolated Pfam domain.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:29242231
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5788257/
      snippet: supported insertion
      explanation: Figure4C original image and main Results; empty/no-membrane, WT and EMC6-deficient
        microsome controls; native-RRL substrate.
      cache_path: evidence/PF01956/guna-2018-reconstitution.txt
      cache_sha256: bedd3a05f58fb02d6841638c08b25ceaa3586d3ae8a3994afdb30f544b424079
