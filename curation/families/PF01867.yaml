- graph_id: cas1-integration-substrate-perturbations
  title: Donor-end chemistry and target topology alter the IHF-absent reaction
  scope: Nunez2015 Figure3A-C, three separate substrate comparisons.
  context: WT Cas1-Cas2, Mg radiolabel integration protocol at37 C for1 h; each altered substrate compared
    with the matched33-bp duplex/supercoiled pCRISPR control. No IHF is supplied.
  family_mapping: Intact MG1655 Cas1 Q46896/NP_417235.1, PF01867 131-226, acting with Cas2. DNA perturbations
    do not establish isolated-domain sufficiency.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: Three separate experiments, not a combined perturbation. Dual3prime capping differs from
    single-end capping;5prime phosphorylation is compatible. Later PMID27211867 establishes an IHF-dependent
    linear-DNA context, so topology dependence is not universal. Empty supercoiled pUC19 also supports
    integration.
  nodes:
  - node_id: cap-both-ends
    label: Phosphorylate both donor 3-prime ends
    node_type: PERTURBATION
  - node_id: single-strand
    label: Supply donor strand S1 or S2 alone, each separately
    node_type: PERTURBATION
  - node_id: linearize-target
    label: Replace supercoiled pCRISPR with linear pCRISPR
    node_type: PERTURBATION
  - node_id: integration-product
    label: Radiolabeled donor-containing target product
    node_type: STATE
  edges:
  - edge_id: dual-capping-decreases-integration
    subject: cap-both-ends
    predicate: decreases
    object: integration-product
    mechanism: Blocking both3prime hydroxyls removes detectable integration, supporting the end-chemistry
      requirement in this reaction. The endpoint does not directly image the nucleophilic transition state.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:25707795
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4359072/
      snippet: Disintegration assays
      explanation: Original Figure3A/B dual-capped donor versus hydroxyl-ended duplex; Methods uses phosphatase-minus
        kinase for labeled3prime-phosphorylated substrates.
      cache_path: evidence/PF01867/nunez-2015-integration.txt
      cache_sha256: 2742611e7b117b36fce70cba810483e901f2bc10eef2e2a8b8ccac18e393db50
  - edge_id: single-strand-decreases-integration
    subject: single-strand
    predicate: decreases
    object: integration-product
    mechanism: Neither isolated donor strand yields the product seen with the annealed duplex. This is
      a substrate-state comparison, not proof that every Cas1 homolog rejects all single-stranded donors.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:25707795
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4359072/
      snippet: Disintegration assays
      explanation: Original Figure3A/B separate S1-only and S2-only lanes with and without Cas1-Cas2.
      cache_path: evidence/PF01867/nunez-2015-integration.txt
      cache_sha256: 2742611e7b117b36fce70cba810483e901f2bc10eef2e2a8b8ccac18e393db50
  - edge_id: linear-target-decreases-ihf-absent-integration
    subject: linearize-target
    predicate: decreases
    object: integration-product
    mechanism: Linear pCRISPR lacks detectable incorporation under the tested IHF-absent conditions. Later
      host-factor-supported integration into linear DNA bounds this negative; it is not a universal physical
      prerequisite for Cas1.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:25707795
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4359072/
      snippet: Disintegration assays
      explanation: Original Figure3C directly compares supercoiled and linear pCRISPR; the separate1-kb
        fragment and empty-vector results prevent sequence-requirement overstatement.
      cache_path: evidence/PF01867/nunez-2015-integration.txt
      cache_sha256: 2742611e7b117b36fce70cba810483e901f2bc10eef2e2a8b8ccac18e393db50
- graph_id: cas1-synthetic-intermediate-disintegration
  title: Cas1 releases a donor-sized duplex from synthetic Y-DNA
  scope: Nunez2015 Figure2G/H, Cas1-alone preparation in two separately tested metal conditions.
  context: 50 nM purified Cas1 with5 nM synthetic radiolabeled Y-DNA; integration buffer containing10
    mM MgCl2 or MnCl2,37 C,1 h; native15%polyacrylamide electrophoresis.
  family_mapping: Intact Q46896/NP_417235.1 Cas1, PF01867 131-226; the synthetic substrate mimics a half-site
    intermediate but was not recovered from the integration assay.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: Cas2 is optional and Cas2 alone is inactive. This is not proof that BandX in the separate
    plasmid reaction necessarily arose through this route. The original ED5 target-rejoining image is
