- graph_id: cas1-cas2-cellular-acquisition
  title: Joint Cas1-Cas2 expression expands the cellular CRISPR locus
  scope: Nunez2014 Figure1B, heterologous whole-cell acquisition assay.
  context: MG1655 cas1/cas2 on pCDF-1b in BL21-AI; LB,50 ug/ml streptomycin,0.2%arabinose,0.1 mM IPTG,20-24
    h induction. OD600-normalized cellular input and CRISPR-I PCR/agarose readout.
  family_mapping: Donor Cas1 Q46896/NP_417235.1,305 aa,PF01867 131-226. Taxon identifies the K12 donor
    reference, not BL21-AI as an identical strain.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: Whole-cell joint-expression effect, not purified Cas1 sufficiency or an isolated-domain
    experiment. PCR expansion and reported clonal sequencing do not establish protection against phage.
    No raw sequencing reanalysis or SupplementaryTable1 review is claimed.
  nodes:
