    subject: coexpress-cas1-cas2
    predicate: increases
    object: expanded-locus
    mechanism: Expanded bands appear with joint expression, unlike Cas1-only, Cas2-only or empty-vector
      controls. This phenotype includes host activities needed after initial integration and is not joined
      to the purified endpoint as a directly traced pathway.
    directness: INDIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
