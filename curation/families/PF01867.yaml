- graph_id: cas2-enhancement-in-manganese
  title: Cas2 enhances the low Cas1-alone integration signal in manganese
  scope: Nunez2015 ExtendedData2B, matched purified-protein titration.
  context: Same donor/pCRISPR radiolabel assay,10 mM MnCl2 replacing MgCl2;0/50/100/200 nM protein series,37
    C,1 h. Compare Cas1 alone with Cas1 plus Cas2 at the corresponding series positions.
  family_mapping: Intact MG1655 Cas1 Q46896/NP_417235.1; PF01867 131-226. No isolated-domain or other-member
    experiment.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: Qualitative representative gels, not measured fold stimulation. Low Cas1-alone activity
    prevents an absolute Cas2 requirement claim. The Mg condition is a separate comparison, not pooled
    with Mn.
  nodes:
  - node_id: add-cas2
    label: Add Cas2 to the Cas1 donor-target reaction in manganese
    node_type: PERTURBATION
  - node_id: integrated-dna
    label: Radiolabeled donor-containing plasmid product
    node_type: STATE
  edges:
  - edge_id: cas2-increases-integration
    subject: add-cas2
    predicate: increases
    object: integrated-dna
    mechanism: Product bands are stronger with both proteins than with Cas1 alone. This records partner-dependent
      enhancement in Mn without converting the low baseline into zero activity.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:25707795
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4359072/
      snippet: Disintegration assays
      explanation: Original ExtendedData2B and associated main-text statement; Cas2-alone and no-protein
