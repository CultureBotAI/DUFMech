causal_graphs:
- graph_id: cas1-cas2-purified-integration
  title: Purified Cas1-Cas2 integrates donor DNA into supercoiled pCRISPR
  scope: Nunez2015 Figures1B-E/2B-C and ExtendedData3, preparation-level integration and mutant comparisons.
  context: MG1655 proteins with affinity tags removed; 33-bp M13-derived duplex and pUC19-based pCRISPR
    carrying the BL21-AI locus. Radiolabel default:200 nM complex,20 nM donor,approximately5 nM target;20
    mM HEPES pH7.5,25 mM KCl,10 mM MgCl2,1 mM DTT,10%DMSO,37 C,1 h. EDTA/SDS/proteinase K treatment precedes
    gel analysis.
  family_mapping: Cas1 Q46896 sequence version1 equals NP_417235.1 and PDB4P6I entity2,305 aa. Current
    PF01867 match131-226 includes H208 and D221. Cas2 is a separate partner, not another PF01867 domain.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: Joint preparation/substrate conditions, not isolated-domain sufficiency. Radiolabeled relaxed/linear
    bands do not uniquely prove full-site insertion or completed chromosomal repair; half-site events
    predominate. BandX is not labeled donor-containing product. Mutant losses do not alone identify an
    elementary catalytic step. Cas1 K224A and Cas2 E9Q retain activity.
  nodes:
  - node_id: joint-reaction
    label: WT Cas1-Cas2 with duplex donor and supercoiled pCRISPR
    node_type: ACTIVITY
    grounding:
    - UniProtKB:Q46896
  - node_id: integrated-dna
    label: Deproteinized donor-labeled relaxed and linear plasmid products
    node_type: STATE
  - node_id: h208a
    label: Substitute Cas1 H208A with WT Cas2
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q46896
  - node_id: d221a
    label: Substitute Cas1 D221A with WT Cas2
    node_type: PERTURBATION
    grounding:
    - UniProtKB:Q46896
  - node_id: cas2-deletion
    label: Replace WT Cas2 with its beta6-beta7 deletion variant
    node_type: PERTURBATION
  edges:
  - edge_id: joint-reaction-produces-integrated-dna
    subject: joint-reaction
    predicate: produces
    object: integrated-dna
    mechanism: Joint WT proteins generate donor-containing plasmid products relative to component-omission
      controls. Retention of label after deproteinization and restriction digestion supports covalent
      integration, without assigning every band to a unique full-site product.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:25707795
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4359072/
      snippet: Disintegration assays
      explanation: Original Figures1B-E and2B-C plus integration/radiolabel Methods; BandX exclusion and
        half-site interpretation come from the associated Results.
      cache_path: evidence/PF01867/nunez-2015-integration.txt
      cache_sha256: 2742611e7b117b36fce70cba810483e901f2bc10eef2e2a8b8ccac18e393db50
  - edge_id: h208a-decreases-integration
    subject: h208a
    predicate: decreases
    object: integrated-dna
    mechanism: H208A loses detectable integration under the matched purified-protein protocol. This is
      a preparation-level substitution effect, not direct observation of histidine-mediated proton transfer.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:25707795
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4359072/
      snippet: Disintegration assays
      explanation: Original Figure1E and ExtendedData3C; matched WT Cas2 and radiolabeled donor.
      cache_path: evidence/PF01867/nunez-2015-integration.txt
      cache_sha256: 2742611e7b117b36fce70cba810483e901f2bc10eef2e2a8b8ccac18e393db50
  - edge_id: d221a-decreases-integration
    subject: d221a
    predicate: decreases
    object: integrated-dna
    mechanism: D221A lowers the donor-containing product to undetectable levels in this gel assay. Neither
      protein-folding equivalence nor an individual metal-coordination microstep is established by that
      endpoint.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:25707795
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4359072/
      snippet: Disintegration assays
      explanation: Original ExtendedData3B/C, with active K224A comparison explicitly retained rather
        than treating all displayed variants as inactive.
      cache_path: evidence/PF01867/nunez-2015-integration.txt
      cache_sha256: 2742611e7b117b36fce70cba810483e901f2bc10eef2e2a8b8ccac18e393db50
  - edge_id: cas2-deletion-decreases-integration
    subject: cas2-deletion
    predicate: decreases
    object: integrated-dna
    mechanism: The partner deletion loses detectable donor incorporation with WT Cas1. The perturbation
      removes a Cas2 interaction region; it is not a mutation inside PF01867 or proof that Cas2 nuclease
      chemistry is required.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
