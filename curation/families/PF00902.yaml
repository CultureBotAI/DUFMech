        supports: PARTIAL
        evidence_source: full_text
        explanation: Adopted Figures 1-4 separate processing, protease protection, RR specificity and energetic sensitivity. Figure 5 and Discussion expose substrate/linker dependence and model assumptions; in-vivo, structural and additional substrate contexts remain uncurated.
      - reference: PMID:17686475
        supports: PARTIAL
        evidence_source: selected_full_text
        explanation: The cited pFAT588 method establishes MC4100 origin and a C-terminal His6 tag. Complete later plasmid sequence and the other constructs remain incompletely verified.
