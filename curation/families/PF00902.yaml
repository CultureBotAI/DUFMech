    posed_date: '2026-10-11'
    notes: Inspect supplements, referenced reaction/protease methods and later primary structure or translocation experiments. Preserve all native vesicle components in sufficiency claims. Other taxa, TatC paralogs and signal substrates need separate mapping and tests. This partial self-reviewed entry remains IN_PROGRESS.
