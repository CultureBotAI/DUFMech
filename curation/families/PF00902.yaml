            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2517984/
            snippet: TatC with a hexa-histidine tag on the C-terminus
            explanation: The cited construct method resolves pFAT588's tag orientation and MC4100 DNA origin, not a purified-protein version of the later vesicle assay.
