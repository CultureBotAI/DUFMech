  - graph_id: tatac-premature-precursor-processing
    title: TatAC vesicles process TorA-MalE335 without protecting its mature domain
    scope: TatB-lacking inverted vesicles expressing TatA and TatC; observed precursor cleavage is separate from mature-protein transport.
    context: BL21(DE3) DeltaTat with p8737-tatAC; translation/vesicle reaction at 37 C for 25 min after vesicle addition. RR TorA-MalE335 from pPJ1 is compared with its RR-to-KK counterpart from pPJ2. Proteinase-K exposure tests accessibility, and Tat-positive vesicles provide a transport comparator.
    family_mapping: TatC P69423 maps to PF00902 residues 12-221, within a 258-residue reference. This intact-protein/native-membrane preparation also includes TatA and signal peptidase. No isolated Pfam interval or all-Tat-substrate transfer is supported.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:562
    limitations: Cleavage alone does not show transport of the mature passenger. RR-to-KK is a signal-peptide change, not a TatC mutation or direct binding measurement. Natural SufI/AmiC and linker variants have different cleavage behavior; the proposed hairpin topology remains a model. Complete clone sequences and referenced assay details remain open.
    nodes:
      - node_id: tatac-rr-precursor-system
        label: TatAC vesicles plus RR TorA-MalE335 precursor
        node_type: ACTIVITY
        grounding:
          - UniProtKB:P69423
      - node_id: tatac-kk-precursor-replacement
        label: RR-to-KK precursor replacement in the TatAC assay
        node_type: PERTURBATION
      - node_id: accessible-processed-male335
        label: Processed MalE335 product accessible to proteinase K
        node_type: STATE
    edges:
      - edge_id: tatac-system-produces-accessible-product
        subject: tatac-rr-precursor-system
        predicate: produces
        object: accessible-processed-male335
        mechanism: TatAC vesicles generate a mature-size MalE335 band without protection of that product against added protease. Vesicle-associated processing and exposure of the passenger are jointly retained; successful full-protein export is not inferred.
        directness: DIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:23250441
            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3538955/
            snippet: premature cleavage
            explanation: Figures 1A and 2A show processing in the TatAC lanes followed by disappearance of mature product on proteinase-K treatment, unlike Tat-positive protection.
            cache_path: evidence/PF00902/froebel-2012-tatC.txt
            cache_sha256: c4afb4ff69ccb0166e8c4cc072032b43a751ff6c4ac265808a1c8d1367cc6112
      - edge_id: rr-to-kk-decreases-tatac-processing
        subject: tatac-kk-precursor-replacement
        predicate: decreases
        object: accessible-processed-male335
        mechanism: Replacing the precursor twin arginines with lysines eliminates detected TatAC processing under the comparison conditions. The change is scoped to this precursor and assay rather than a universal recognition rule for every family member.
        directness: DIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:23250441
            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3538955/
            snippet: premature cleavage
            explanation: Figure 2A compares RR TatAC lanes 5-6 with KK lanes 11-12. The cleavage-site mutant in panel C belongs to TorA-PhoA, not MalE335, and is not borrowed for this edge.
            cache_path: evidence/PF00902/froebel-2012-tatC.txt
            cache_sha256: c4afb4ff69ccb0166e8c4cc072032b43a751ff6c4ac265808a1c8d1367cc6112
  - graph_id: tatc-only-vesicle-processing
    title: TatC as the sole Tat component supports premature precursor processing
    scope: TatC-only refers to the supplied Tat components in native inverted vesicles, not purified TatC alone. Adopted endpoint is TorA-MalE335 processing without mature-product protease protection.
    context: BL21(DE3) DeltaTat with pFAT588 produces TatC-containing vesicles. The cited plasmid is pQE60-derived with MC4100 tatC and a C-terminal His6 tag. Figure 4A compares TatC, TatAC, Tat-positive and DeltaTat vesicles in the 37 C translation/processing reaction; Figure 1B verifies Tat-component content.
    family_mapping: Native TatC reference P69423, 258 residues, sequence version 2, PF00902 at 12-221. The source identifies the pFAT588 lineage and C-terminal tag but complete 2012 clone junctions were not independently sequenced. Native reference, MC4100 DNA donor and BL21 vesicle host are distinct identifiers.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:562
    limitations: Native membrane, resident signal peptidase and precursor remain required assay context. The result does not demonstrate purified TatC sufficiency, an atomic insertion trajectory or transport of the mature passenger. It cannot be generalized to every signal peptide, and the separate pPJ10 in-vivo construct is not this vesicle construct.
    nodes:
