    prompt: Resolve TatC insertion microsteps and extend beyond the TorA-MalE335 vesicle assays.
    kind: CURATION_TODO
    status: OPEN
    rationale: Signal-peptide processing and mature-domain transport are distinct observations. Proposed hairpin insertion, TatB shielding and TatA assembly require their own evidence before becoming observed molecular edges.
