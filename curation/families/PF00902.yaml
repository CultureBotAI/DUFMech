            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3538955/
            snippet: premature cleavage
            explanation: Figure 4A lower panel lanes 7-10 establishes the TatC-versus-DeltaTat processing comparison and lack of mature-product protection. Figure 4B supplies a proposed explanation, not another observed edge.
