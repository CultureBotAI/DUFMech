        mechanism: TatC-containing vesicles produce a mature-size band that is digested by proteinase K. DeltaTat vesicles generate degradation fragments but not the corresponding mature band; all native vesicle components remain part of the tested system.
        directness: DIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
