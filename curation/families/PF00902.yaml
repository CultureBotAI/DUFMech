causal_graphs:
  - graph_id: tatc-containing-vesicle-protein-transport
    title: Tat-positive vesicles generate protease-protected mature TorA-MalE335
    scope: Intact E. coli Tat machinery in inverted membrane vesicles, not purified TatC or an isolated PF00902 fragment. Adopted readout is mature-product protection from proteinase K.
    context: BL21(DE3) DeltaTat produces vesicles with p8737 tatABCD. Radiolabeled TorA-MalE335 lacks 35 C-terminal MalE residues; vesicles are added 10 min after translation starts, followed by 25 min at 37 C. No-vesicle, TatAC and proteinase-K comparisons distinguish processing from protection. CCCP is 0.1 mM, compared with DMSO vehicle.
    family_mapping: K-12 TatC reference UniProtKB:P69423, tatC/b3839/JW3815, has 258 residues, sequence version 2, and PF00902 at 12-221 inclusive with exact UniProt/InterPro sequence agreement. The assay uses full-length Tat proteins and native membrane components; reference taxon is not the BL21 production strain. Complete p8737 clone junctions were not reconstructed.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:562
    limitations: Protection supports transport into vesicles, not a directly filmed microscopic pathway. CCCP perturbs membrane energetics, not TatC alone; no TatC proton-pump activity is asserted. Buffer and protease details rely on cited protocols, and raw gels, quantitative transport rates and supplement data were not reanalyzed.
