  - graph_id: geobacillus-alr-alanine-preincubation-loss
    title: D-alanine preincubation at pH 7 lowers retained Alr activity
    scope: WT holoenzyme in Table I's 1998 inactivation experiment, distinct from the pH-9 racemization assay and the pH-7.2 spectral time course.
    context: 10 ug holoenzyme, 0.5 umol D-alanine, 10 umol potassium phosphate pH 7, 0.01% 2-mercaptoethanol, 100 ul; 25 C for 12 h. Remaining D-to-L racemase activity is assayed afterward.
    family_mapping: Intact P10724-associated recombinant Alr; PF01168 12-229 maps within the whole enzyme. This experiment does not selectively perturb or isolate that domain.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:1422
    limitations: Table I reports activity loss, while separate spectra support a PLP/PMP interpretation. This is not an observed intracellular regulatory switch or proof that physiological D-alanine always inhibits Alr. No independently reconstructed raw kinetics or exact detection threshold is available.
