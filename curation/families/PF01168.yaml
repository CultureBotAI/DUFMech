  - graph_id: geobacillus-alr-k39a-tritium-rescue
    title: K39A reduces tritium release and methylamine increases it
    scope: WT and K39A apo-Alr in the 1998 Figure 5 labeled-PMP experiment. The adopted rescue is tritium release, not a quantified return of normal alanine-racemization turnover.
    context: 100 ul, 10 umol CHES pH 9, 8.7 nmol enzyme, 8 nmol randomly labeled [4'-3H]PMP and 8.5 umol pyruvate, 30 C. Add 50 umol methylamine hydrochloride for the rescue arm, giving 0.5 M. Acid-quenched aliquots are dried and remaining radioactivity measured; volatile release is calculated. Figure 5 displays up to 8 h.
    family_mapping: K39 is within P10724's PF01168 12-229 interval; the mutagenic primer locally matches K39A. Full-length enzyme is expressed through pAR310 in JM109. Exact complete clones and affinity-free preparation details remain scoped to the inspected protocol.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:1422
    limitations: Tritium release is not directly equated with product concentration or racemase turnover. WT and methylamine-rescued mutant reach different plateaus; an enzyme-free methylamine control is not displayed in Figure 5. Formaldehyde in the proposed recycling scheme was not identified. Figure 4's methylamine caption implies 0.1 M while its prose says 0.5 M; Figure 5's separate Methods supplies the adopted 0.5 M. The opposite PLP-to-PMP mutant reaction was not rescued under the tested conditions. Replication and complete folding controls remain limited.
    nodes:
      - node_id: k39a-labeled-pmp-assay
        label: K39A instead of WT in the labeled-PMP/pyruvate assay
        node_type: PERTURBATION
      - node_id: methylamine-added-to-k39a
        label: Add 0.5 M methylamine to K39A with PMP and pyruvate
        node_type: PERTURBATION
      - node_id: volatile-tritium-release
        label: Volatile tritium release from labeled PMP
        node_type: ACTIVITY
        grounding:
          - UniProtKB:P10724
    edges:
      - edge_id: k39a-decreases-tritium-release
        subject: k39a-labeled-pmp-assay
        predicate: decreases
        object: volatile-tritium-release
        mechanism: The K39A trace remains near baseline while WT releases label. The assay supports a residue-dependent effect without directly observing the proposed hydrogen-transfer intermediates.
        directness: DIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:9832621
            source_url: https://www.jstage.jst.go.jp/article/biochemistry1922/124/6/124_6_1163/_pdf
            snippet: no tritium was released
            explanation: Figure 5 WT/K39A comparison, page 1165 Methods and page 1168 Results; the result is bounded to the stated preparation and readout.
            cache_path: evidence/PF01168/kurokawa-1998-alr.txt
            cache_sha256: e9e2d711fb79aefad7bbfb0887c4ccfd4265728fb77db7c3a650aacabcdb477f
      - edge_id: methylamine-increases-k39a-tritium-release
        subject: methylamine-added-to-k39a
        predicate: increases
        object: volatile-tritium-release
        mechanism: Methylamine increases label release from the otherwise weak K39A preparation. Its higher final release than WT is not interpreted as greater native catalytic activity or proof of the unmeasured formaldehyde pathway.
