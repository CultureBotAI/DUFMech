causal_graphs:
  - graph_id: geobacillus-alr-racemization-and-k39a
    title: Intact alanine racemase interconverts alanine enantiomers
    scope: Purified B. stearothermophilus (now Geobacillus) alanine racemase and K39A in the 1998 study. The two substrate directions are separate assays, not a tracked molecular cycle.
    context: 1 ml with 100 umol CHES pH 9 and 30 umol D- or L-alanine, 37 C; stop at 100 C for 10 min. L-product is measured using alanine dehydrogenase/NAD+, D-product using DAAT/lactate dehydrogenase/NADH. Figure 3A varies pH in specified buffers. Exact reaction duration and enzyme amount per comparison remain unresolved.
    family_mapping: P10724/ALR_GEOSE, alr/dal, 388-aa reference sequence version 2, matches InterPro and 1L6G's canonical sequence. PF01168 spans 12-229 and includes K39, but excludes Y265 in the other domain. The 1998 mutagenic primer matches residues 34-44 with K39A; complete clones and donor strain are not independently resolved.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:1422
    limitations: These are intact-enzyme product assays. Neither the isolated N-terminal domain's sufficiency nor every proton-transfer step is observed. K39A's activity loss does not by itself prove one unique chemical role; its reported absorption similarity is not a complete folding control. Older sequence conflicts and unspecified detection limits/replicates remain explicit. Coupling enzymes measure quenched products, not live-cell peptidoglycan flux.
