discussions:
  - discussion_id: alr-residue-chemistry-and-family-coverage
    prompt: Extend alanine-racemase contexts while resolving clone, assay and chemical-rescue limits.
    kind: CURATION_TODO
    status: OPEN
    rationale: Seven experimental effects concern one intact enzyme and K39A. They do not establish isolated PF01168 activity, all family substrates, physiological regulation or a fully observed catalytic trajectory.
    evidence:
      - reference: PMID:9832621
        supports: PARTIAL
        evidence_source: inspected_primary_full_text
        explanation: Main Methods, Results, Table I and Figures 2-5 support the scoped assays; atomic schemes remain interpretations.
    notes: Establish complete historical clones and per-assay doses, times, detection limits and replication. Resolve the Figure 4 0.1/0.5 M methylamine discrepancy without changing Figure 5's independent conditions. The 1999 chemical-rescue paper PMID:9933615 was accessible only at abstract level in attempted publisher routes; its indexed erratum concerns the author's name. Tyr265, other-substrate and other-member studies need separate review and mapping. Structural similarity to YggS/PLPBP alone is not evidence of racemase activity or of current PF01168 membership. Partial same-agent scientific review; remain IN_PROGRESS.
