  - graph_id: geobacillus-alr-pmp-pyruvate-reactivation
    title: Joint PMP and pyruvate treatment restores racemase activity
    scope: WT apoenzyme in Table I's distinct reactivation experiment. This is not a time-resolved reversal in the same molecules used for D-alanine inactivation.
    context: 50 ug apoenzyme, 1 umol PMP, 2.5 umol pyruvate, 10 umol K2HPO4-KOH pH 10 and 0.01% 2-mercaptoethanol in 100 ul; 25 C for 12 h. Recovered activity is measured with D-alanine.
    family_mapping: Full P10724-associated Alr, containing PF01168 at 12-229 plus its C-terminal region. Apoenzyme preparation is by hydroxylamine treatment/dialysis, not a gene deletion or isolated-domain preparation.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:1422
    limitations: PMP, pyruvate, enzyme and alkaline conditions are a joint intervention; none is represented as independently sufficient. Activity recovery and spectral changes do not directly identify each proton-transfer step. The separate mutant methylamine experiment has different conditions.
