  - graph_id: pmp3-w303-salt-growth
    title: PMP3 deletion lowers salt-challenged growth in W303-1B
    scope: W303-1B versus its pmp3::TRP1 derivative CN3 in Navarre and Goffeau 2000 Figure 3.
    context: Seed 10 ul saturated culture into 3 ml YD with a 0-1.5 M NaCl series; measure OD600 after 15 h at 30 C and normalize each strain to its own no-added-salt culture. YD contains 2% yeast extract and 2% glucose, not peptone. Three repeats gave similar results; no error bars are displayed.
    family_mapping: The W303-1B X91499.1 CDS encodes CAA62799.1, exactly matching 55-aa UniProt P87284 sequence version 1. PF01679 spans residues 5-52 inclusive. Deletion removes the complete gene, not only this domain. S288c is the reference accession strain, not the experimental strain.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:4932
    limitations: Relative OD is a growth endpoint, not a direct transport measurement or a universal salt threshold. PCR confirms deletion, but this endpoint lacks a native PMP3 add-back. Figure 2A independently supports the same phenotype with plate growth; it is not counted as a second molecular step.
    nodes:
