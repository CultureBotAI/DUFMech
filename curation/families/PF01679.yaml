  - graph_id: pmp3-sodium-accumulation
    title: PMP3 deletion increases intracellular sodium accumulation during challenge
    scope: CN3 versus W303-1B, Navarre 2000 Figure 2B; exact challenge protocol remains disputed within the paper.
    context: Figure 2B describes 0.9 M NaCl addition to exponentially growing YD cells. Results and Methods specify 1 M; Methods additionally give a 1 h water incubation at 4 C, followed by 10 mM MES pH 6, 50 mM glucose and challenge at 28 C. After sampling, wash with 20 mM MgCl2 and 1.5 M sorbitol, extract with 2 mM CTAB and measure sodium by atomic emission. Neither conflicting dose/medium is silently preferred.
    family_mapping: CN3 deletes the whole W303-1B PMP3 gene, whose X91499.1 peptide exactly matches P87284 sequence version 1; PF01679 spans 5-52 within 55 aa.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:4932
    limitations: Intracellular content over 30-90 min is not initial influx, efflux, direct voltage or a purified transport measurement. The exact challenge dose and medium remain unresolved. No raw cell-volume calibration or replicate reanalysis was performed; an undisplayed sorbitol control is not independent inspected evidence.
    nodes:
      - node_id: cn3-sodium-assay
        label: CN3 pmp3::TRP1 rather than W303-1B under sodium challenge
        node_type: PERTURBATION
      - node_id: intracellular-sodium-content
        label: Reported intracellular sodium concentration at 30-90 min
        node_type: STATE
    edges:
      - edge_id: deletion-increases-sodium-content
        subject: cn3-sodium-assay
        predicate: increases
        object: intracellular-sodium-content
        mechanism: CN3 accumulates more sodium than the parental strain at the displayed post-challenge times. The direction is retained as an indirect cellular effect despite unresolved protocol details; no particular sodium channel or proton pathway is assigned.
        directness: INDIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
