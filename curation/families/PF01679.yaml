  - graph_id: pmp3-methylammonium-accumulation
    title: PMP3 deletion increases retained methylammonium tracer
    scope: W303-1B/CN3 uptake comparison in Navarre 2000 Figure 5B, not a calibrated membrane-potential experiment.
    context: Grow to OD600 0.8 in MM (0.7% yeast nitrogen base without amino acids, 2% glucose, required amino acids), wash and resuspend to OD600 5 in 10 mM MES pH 6 and 50 mM glucose. After 5 min add 2 mM 14C-methylammonium at 2.5 uCi/ml. Sample at 10-60 min, filter, wash with 20 mM MgCl2 and count radioactivity. Uptake temperature is not explicitly restated; two repetitions had similar results.
    family_mapping: Complete W303-1B PMP3 deletion removes the gene encoding the X91499.1/P87284-matched 55-aa protein, with PF01679 at 5-52. Neither isolated domain nor purified protein is assayed.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:4932
    limitations: Tracer uptake/retention is consistent with the authors' hyperpolarization model but is not direct voltage or proton conductance. Transporter regulation, retention and other cellular effects are not separated. A native PMP3 add-back for this endpoint is not shown.
    nodes:
      - node_id: cn3-methylammonium-assay
        label: CN3 rather than W303-1B in the methylammonium uptake assay
        node_type: PERTURBATION
      - node_id: methylammonium-label-retention
        label: Filter-retained 14C-methylammonium signal over 10-60 min
        node_type: STATE
    edges:
