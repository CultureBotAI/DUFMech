        subject: cn3-methylammonium-assay
        predicate: increases
        object: methylammonium-label-retention
        mechanism: CN3 retains more radiolabel than W303-1B throughout the displayed uptake interval. This is an indirect accumulation effect; its voltage interpretation is a proposed mediator, not an additional observed edge.
