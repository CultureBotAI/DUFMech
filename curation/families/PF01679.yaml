  - discussion_id: pmp3-molecular-mediator-and-member-coverage
    prompt: Resolve Pmp3's molecular mediator and extend member-specific evidence beyond the retained yeast phenotypes.
    kind: CURATION_TODO
    status: OPEN
    rationale: The deletion, medium-supplement and plant-replacement experiments establish indirect effects in defined yeast backgrounds. Methylammonium is a proxy and does not demonstrate a proton pore, direct voltage change, Pma1 activation or NSC1 blockade. Domain conservation cannot fill those missing steps.
    evidence:
      - reference: PMID:10835350
        supports: PARTIAL
        evidence_source: full_text_table_I_and_figures_1_to_8
        explanation: Twelve graphs retain fifteen observed indirect effects. Preserve the 0.9 M versus 1 M sodium-protocol conflict, lack of endpoint-specific native add-backs, incomplete plant rescue, separate normalization controls and medium/genotype distinctions. Figure 6 shows broadly similar ATPase and ACMA-quenching relations for the single deletion; the triple pmp1/pmp2/pmp3 ATPase result cannot be assigned uniquely to Pmp3. Proton-leak and NSC1 interpretations, plus intracellular-pH/acidification observations reported without displayed data, remain hypotheses or evidence limits.
      - reference: doi:10.1242/jcs.173211
        supports: PARTIAL
        evidence_source: abstract_introduction_initial_results_and_figure_1_caption_only
        explanation: De Block 2015 follows BY4742-derived cells with proteomics, PDR5 expression, sphingolipid interactions and proposed lipid-related stress sensing. Public text was accessible despite a separate curl 403. Remaining Results, Methods, figures and supplement were not fully assessed, so this is a follow-up lead, not evidence for the retained edges. Preserve plasma-membrane versus total-cell measurements and unresolved Ena1/Ena2 peptides when extending the graphs.
    posed_by: Codex
    posed_date: '2026-10-11'
    notes: Exact W303-1B X91499.1 and plant T20621.1 coding-sequence matches are established; YR93/CY162 alleles and integrated flanks are not independently resequenced. The imported Schizosaccharomyces pombe description is not replaced with Saccharomyces data. Other PF01679 members, later experiments, domain-specific effects and the direct molecular mechanism remain unreviewed. Partial scientific self-review; IN_PROGRESS.
