    title: Plant RCI2A replacement partially improves yeast hygromycin growth
    scope: YR93-31-RCI2A versus YR93-31 on hygromycin B, Navarre 2000 Figure 8B; YR93-1 defines the incomplete rescue benchmark.
    context: RCI2A from clone 88O14T7 replaces pmp3::URA3 chromosomally under PMP3 regulatory sequences in the pmr2/nha1 background. Tenfold dilutions of saturated cultures on YD with 100 ug/ml hygromycin B, 2 days at 30 C. YD contains 2% yeast extract, 2% glucose and 2% agar.
    family_mapping: The 54-aa Q9ZNQ7 plant donor, PF01679 6-52, matches the computed T20621.1 reverse-strand ORF. The removed yeast PMP3 gene maps to P87284, 55 aa, PF01679 5-52. PCR confirms integration; no isolated-domain construct or independent complete integrated-sequence verification is available.
