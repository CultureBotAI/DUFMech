discussions:
  - discussion_id: nadk-constructs-donor-chemistry-and-physiology
    prompt: Resolve NADK construct and kinetic-table discrepancies before extending donor-recognition or physiological mechanisms.
    kind: CURATION_TODO
    status: OPEN
    rationale: N75T has donor-specific effects in intact purified protein. Coupled assays and TLC do not establish a unique residue-level binding geometry, universal family donor preference or a cellular redox mechanism.
    evidence:
      - reference: PMID:24022322
        supports: PARTIAL
        evidence_source: full_text_and_supplement
        explanation: Main Methods/Results/Discussion and supplemental captions/table were read, with Figures 2/3 and S1-S4 visually inspected. Exact table-ratio reconciliation, donor distributions, full clones, mutant assembly and purification replicates remain unresolved. S4 is an expression-extract gel. Vibrio's K2E engineering and other proteins must be separately mapped before transferring any effect.
      - reference: PMID:11488932
        supports: PARTIAL
        evidence_source: selected_full_text
        explanation: The parent-plasmid study identifies MG1655 but its printed forward and reverse primers differ from the present reference. Its stopped isocitrate-dehydrogenase assay, nmol/min units and undetected polyphosphate activity are not interchangeable with the 2013 G6PD assay and small WT signals. No older-paper figures were independently visually reviewed.
    posed_by: Codex
    posed_date: '2026-10-11'
    notes: Other mutations, microbial/archaeal/eukaryotic homologs, immobilized-cell yield and cyanobacterial phenotypes remain outside this partial assessment. The 2013 phylogenetic narrative is not an observed causal chain. Preserve terminal-primer uncertainty and differing KND/KNDE buffer descriptions instead of silently repairing the sources. Partial scientific self-review; IN_PROGRESS.
