  - graph_id: ecoli-nadk-n75t-tetrapolyphosphate-activity
    title: N75T raises tetrapolyphosphate-dependent NADK specific activity
    scope: Purified untagged E. coli NADK WT versus N75T in Nakamichi 2013 Figure 2, with poly(P)4 as the separate phosphoryl-donor condition.
    context: At 37 C, the G6PD-coupled assay contains 5 mM tetrapolyphosphate, 5 mM NAD+, 5 mM MgCl2, 100 mM Tris-HCl pH 7.5, 5 mM glucose 6-phosphate and 0.5 U G6PD. Protein-normalized activities are compared within this donor condition, not directly equated to heterogeneous-polymer mass concentrations. Means/SD reflect three independent experiments; exact enzyme dose and rate window remain unspecified.
    family_mapping: P0A7B3 is the 292-aa K12 reference matching InterPro; N75 lies within PF01513 residues 8-121. The 2013 untagged pET-14b_ecoNADK preparations are full-length proteins expressed in BL21(DE3)pLysS, not isolated domains. The cited MG1655-derived parent plasmid has unresolved printed-primer differences from the current reference.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:562
    limitations: WT has small nonzero activity in this assay, so the effect is an increase rather than creation of activity from a proven zero. Tripolyphosphate does not show the same increase for E. coli N75T. Coupled output does not resolve donor-binding geometry, unique molecular mediation or physiological polyphosphate use; exact kinetic-table repair remains open.
