  - graph_id: ecoli-nadk-n75t-metaphosphate-tlc
    title: N75T increases the NADP-comigrating TLC product in the metaphosphate reaction
    scope: Purified E. coli NADK WT versus N75T in Nakamichi 2013 Figure 3; a qualitative product-endpoint comparison separate from the coupled specific-activity measurements.
    context: Incubate 5-ul reactions for 10 h at 37 C with 5 mM NAD+, 5 mM MgCl2, 100 mM Tris-HCl pH 7.5, 1 mg/ml meta(P)n and 0.43 ug/ml enzyme. TLC uses isobutyrate/500 mM NH4OH at 5:3 and UV detection at 254 nm. Displayed no-enzyme reactions and NAD+, NADP+, ATP and ADP standards establish the comparison; the ATP lanes are separate donor conditions.
    family_mapping: The untagged intact ecoNADK/N75T constructs map to P0A7B3 with N75 inside PF01513 8-121. MG1655-derived plasmid lineage and BL21(DE3)pLysS expression are distinguished from current K12 reference sequence and unresolved historical terminal-primer differences.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:562
    limitations: The stronger spot co-migrates with NADP+ but is not independently identified by mass spectrometry or NMR. The image supplies neither a calibrated product yield nor independent replicate uncertainty. Ten-hour product accumulation is not an initial rate or complete substrate conversion; no cellular production advantage, all-polyphosphate transfer or atomically resolved specificity change is inferred.
    nodes:
