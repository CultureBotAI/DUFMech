causal_graphs:
  - graph_id: ecoli-nadk-n75t-atp-activity
    title: N75T lowers ATP-dependent NADK specific activity in the coupled assay
    scope: Purified untagged E. coli NADK and N75T in Nakamichi 2013 Figure 2; intact enzyme, not isolated N-terminal PF01513.
    context: Compare WT and N75T at 37 C with 5 mM ATP, 5 mM NAD+, 5 mM MgCl2, 100 mM Tris-HCl pH 7.5, 5 mM glucose 6-phosphate and 0.5 U glucose-6-phosphate dehydrogenase. Specific activity is normalized to Bradford protein concentration with BSA standard; the article defines U as umol NADP+ per minute. Figure 2 reports means and SD of three independent experiments. Exact assay enzyme dose, volume and initial-rate window are not fully specified in the inspected 2013 protocol.
    family_mapping: K12 reference UniProtKB:P0A7B3, nadK/yfjB/yfjE, b2615/JW2596, is 292 aa and sequence version 1; its sequence matches InterPro. PF01513 spans 8-121 and contains N75 of GGDGN at 71-75. The inherited pET-14b construct derives from MG1655 according to the cited 2001 cloning paper and is expressed without a tag in BL21(DE3)pLysS. Historical primers differ at N2/D2 and at the translated C terminus from the current reference; the 2013 alignment shows the reference-like N terminus, but complete assay clones remain unverified.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:562
    limitations: This is a net coupled-assay mutation effect, not proof of a particular ATP-binding or phosphate-transfer microstep. Activity remains measurable with N75T. Independent purification batches and mutant folding/oligomer equivalence are not established. Figure S4 shows expression extracts, not purified enzyme. The displayed HTML/XML kinetic table has inconsistent ratios; exact repaired kcat/Km values are not adopted.
