  - graph_id: ecoli-nadk-n75t-hexametaphosphate-activity
    title: N75T raises activity with the tested hexametaphosphate mixture
    scope: Purified E. coli NADK WT versus N75T in Nakamichi 2013 Figure 2; only the commercial hexameta(P)n preparation and stated assay conditions.
    context: G6PD-coupled reactions at 37 C use 1 mg/ml hexameta(P)n, 5 mM NAD+, 5 mM MgCl2, 100 mM Tris-HCl pH 7.5, 5 mM glucose 6-phosphate and 0.5 U G6PD. Specific activity is normalized to Bradford protein; means and SD are reported for three independent experiments. This commercial reagent is a mixture of chain lengths, not an assumed pure six-unit molecule.
    family_mapping: P0A7B3 reference N75 lies in the GGDGN motif within PF01513 8-121 of the 292-aa intact enzyme. The untagged MG1655-derived pET-14b lineage was expressed in BL21(DE3)pLysS; current reference identity is not a claim that historical primer and full-clone discrepancies have been resolved.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:562
    limitations: Increased activity is relative to a nonzero WT signal and does not identify which polymer lengths supply phosphate. Exact enzyme dose, assay volume and rate window are incompletely reported; folding and oligomer equivalence are unestablished. This is not an exact donor-affinity measurement, isolated-domain sufficiency or cellular flux.
