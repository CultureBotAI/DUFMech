  - graph_id: ecoli-nadk-n75t-metaphosphate-activity
    title: N75T raises activity with the tested metaphosphate mixture
    scope: Purified E. coli NADK and N75T in the meta(P)n condition of Nakamichi 2013 Figure 2; distinct from the ten-hour TLC endpoint.
    context: Compare WT and N75T at 37 C with 1 mg/ml meta(P)n, 5 mM NAD+, 5 mM MgCl2, 100 mM Tris-HCl pH 7.5, 5 mM glucose 6-phosphate and 0.5 U G6PD. Means/SD of three independent experiments describe protein-normalized specific activity. The metaphosphate reagent contains various polymer lengths; exact assay enzyme dose, volume and rate window are not fully specified.
    family_mapping: The targeted N75 is within PF01513 8-121 of sequence-version-1 reference P0A7B3. Whole untagged recombinant enzyme retains all other regions. The 2013 source reports sequence-confirmed mutation of its inherited pET-14b construct, but no full sequence independently resolves the older primer/reference differences.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:562
    limitations: The matched WT signal is small but nonzero. A higher meta(P)n/ATP ratio also reflects lower ATP activity and is not the same quantity as this absolute donor-specific increase. Separate TLC supports product formation but does not retroactively supply this assay's rate window. No atomic donor-recognition mechanism, physiological donor switch or universal GGDGN rule is inferred.
