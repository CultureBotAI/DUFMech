  - graph_id: saoata-substitution-assays
    title: SaOatA substitutions distinguish CoASH release from glycan transfer
    scope: "Jones 2021 Figure3C: full-length recombinant WT and selected R25A/R25K/H36A/R86A/Y136A/E154A/Y206A preparations. Separate CoASH-release and G5-transfer measurements."
    context: "C43(DE3) expression, fresh-resin IMAC per preparation. Figure3C specifies 50 mM sodium phosphate pH 7, 5% DMSO, 25 C, 0.1 mM acetyl-CoA and 0.2 mM DTDP; transfer assays include 1 mM G5. This differs from Figure1's pH 6.5/1 mM donor/18 h recipe; transfer endpoint time and exact DTDP use need SI reconciliation."
    family_mapping: "Full-length reference Q2FV54 equals A0A0H2XFE4 and ABD21303.1; PF01757 19-344 includes all seven selected substitution sites. The experimental object still includes the distinct C-terminal domain; clone sequence and tag details are not independently verified."
    scope_status: MECHANISTIC
    taxon: NCBITaxon:1280
    limitations: "DIRECT concerns net preparation effects. Comparable expression/purity is not proof of unchanged folding or a particular proton-transfer role. CoASH release is not synonymous with productive glycan transfer. S453A's 5.4% rate uses ethanol rather than DMSO and is excluded from matched-rate edges. Figure3D's R25A caption conflicts with R25K Results; no R25A fitted kinetics are adopted. Remaining variants and quantitative G5 yields are unassessed."
