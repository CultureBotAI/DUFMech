  - graph_id: usa300-oata-pg-acetylation
    title: USA300 oatA genotype changes cellular PG acetylation
    scope: "Jones 2021 Figure1B: USA300 WT, markerless oatA deletion, and deletion complemented with WT, H36A or Y206A pACCJ3."
    context: "Base-labile acetyl groups normalized to muramic acid in isolated PG; three replicates with SD. Constitutive His-tagged complementation. PG-isolation conditions are not assumed identical to the tunicamycin growth assay."
    family_mapping: "USA300 reference SAUSA300_2504/A0A0H2XFE4 equals ABD21303.1 and Q2FV54, PF01757 19-344. H36 and Y206 are inside that interval, but these are whole-gene/whole-protein cellular interventions. Exact experimental clone strain and supplementary plasmid sequences are not independently verified."
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:367830
    limitations: "INDIRECT cellular genotype effects, not isolated-domain chemistry. Membrane anti-His detection in Figure3A supports expression of impaired variants but does not exclude folding/localization effects. Other variants, including residual R83A activity, remain contextual. No measured mediation from this endpoint to the separate growth experiment."
