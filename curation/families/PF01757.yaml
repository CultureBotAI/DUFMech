    context: "TSB, 37 C, 0.4 ug/ml tunicamycin, 1% DMSO and 0.25-4 mg/ml hen egg-white lysozyme. Figure1A plots 12-h relative delta-OD600, n=3 with SD; Methods monitor 20 h at 20-min intervals. Compare matched lysozyme doses, particularly 1-4 mg/ml."
    family_mapping: "USA300 OatA reference A0A0H2XFE4/ABD21303.1, PF01757 19-344; gene deletion and full-length trans complementation, not isolated-domain interventions."
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:367830
    limitations: "INDIRECT conditional growth effects, not death or a directly observed PG-to-growth chain. The no-tunicamycin assay instead shows a lag in the main-text description. Figure1A's gray empty-vector caption names WT+pALC2073 whereas Results describe deletion+empty vector; those ambiguous gray comparisons are not encoded. Exact clone background requires SI."
