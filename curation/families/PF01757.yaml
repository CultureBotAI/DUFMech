  - graph_id: saoata-acetylcoa-glycan-products
    title: Full-length SaOatA produces acetylated glycans with acetyl-CoA
    scope: "Jones 2021 Figure 1D/E: purified full-length SaOatA versus enzyme-free, published S453A and isolated C-domain preparations."
    context: "5 uM enzyme, 1 mM acetyl-CoA, 50 mM sodium phosphate pH 6.5, 18 h; either 1 mM G5 or 10 ug/ml semisynthetic GM-pentapeptide oligomers of 4-10 repeats. GM products are mutanolysin-digested for QTOF-MS. Recombinant full-length protein is expressed in E. coli C43(DE3); exact detergent recipe remains unavailable."
    family_mapping: "603-aa Q2FV54/NCTC8325 and A0A0H2XFE4/USA300 references are identical to versioned ABD21303.1; PF01757 19-344. WT MS searches use Q2FV54, not a resequenced clone. S453 and the isolated C-domain 445-601 are outside current PF01757. Full-length clone donor strain/termini require SI verification."
    scope_status: MECHANISTIC
    taxon: NCBITaxon:1280
    limitations: "DIRECT describes net purified-preparation effects, not isolated-domain sufficiency. The MS S453A search reference also has K495A/K496A and LE+His10; whether the Figure1 preparation shared those changes is unresolved. Treat it as the published S453A preparation, not an independently verified single mutant. The C-domain negative comparator is plotted only for GM-penta. No atomic relay, exact acceptor bond or calibrated product yield is inferred from these spectra."
