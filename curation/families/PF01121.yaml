  - graph_id: mycobacterial-coae-dcoa-series-substitutions
    title: Mycobacterial CoaE substitutions alter reported DCoA-series turnover
    scope: Full-length hexahistidine-tagged mycobacterial CoaE and individual R140A/R140K/D32A/L114A substitutions in the 2011 study. The R140A loss claim is explicitly CONTESTED by inconsistent source presentations.
    context: Single-coupled alpha-ketoglutarate-dehydrogenase assay, 25 C, five-minute A340 monitoring, no-DCoA blanks subtracted. DCoA varies with 10 mM ATP, 10 mM MgCl2, 20 mM KCl, 50 mM Tris pH 8, 2 U coupling enzyme, 2 mM alpha-ketoglutarate, 0.3 mM NADP and the source's 0.3 mM pyrophosphate cofactor. Exact CoaE dose is unreported. Table 2 gives apparent kcat; Figure 5 states two independent experiments in duplicate. Separate ITC kinetics use 20 C and different buffer, not this same reaction.
    family_mapping: The cited P63826 demerged into P9WPA3/Rv1631 and P9WPA2/MT1667; both 407-aa sequences exactly match archived UPI0000127CE6. P9WPA3 PF01121 spans 4-178 and contains R140/D32/L114; the intact protein also has PF04229. The 2009 source names Rv1631 but its printed forward primer mismatches the reference N terminus, so complete clone and donor-strain reconstruction remain unresolved. Two identical successors do not imply two experiments.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:1773
    limitations: Effects concern reported fitted turnover in this substrate series, not binding Kd or observed catalytic chemistry. Text/Table 2 report R140A no reaction while Figure 5A plots its Km as 240 uM. Other Km, ratio and fold-change inconsistencies prevent precise affinity/efficiency claims. Structural controls do not establish identical folding for every mutant. The printed cofactor name thymine pyrophosphate is not silently corrected, and raw kinetic fits remain unreviewed.
    nodes:
      - node_id: r140a-in-dcoa-series
        label: R140A instead of WT in the DCoA-varied assay
