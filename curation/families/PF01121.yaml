        subject: l114a-in-atp-series
        predicate: decreases
        object: atp-series-apparent-turnover
        mechanism: The ATP-varied Table 2 column reports L114A kcat of 1.152 versus WT 2.886 per minute. This decrease is kept separate from the DCoA-series increase and is not interpreted as unique transition-state destabilization.
        directness: DIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:21264299
            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3019153/
            snippet: Table 2
            explanation: The ATP-specific kcat column, not the DCoA-specific narrative, supplies the comparison. Both parameter sets are recorded in the evidence ledger with the source's contradictions and unreviewed raw-data limitation.
