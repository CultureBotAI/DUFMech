  - graph_id: mycobacterial-coae-l114a-atp-series
    title: L114A lowers apparent turnover in the separately varied ATP series
    scope: Full-length tagged mycobacterial CoaE L114A versus WT in the 2011 Table 2 ATP-varied kinetic comparison, not the DCoA-varied series.
    context: Coupled A340 assay at 25 C, 50 mM Tris pH 8, fixed 0.5 mM DCoA and varying ATP, 10 mM MgCl2, 20 mM KCl, 2 U alpha-ketoglutarate dehydrogenase, 2 mM alpha-ketoglutarate, 0.3 mM NADP and 0.3 mM the source's pyrophosphate cofactor. Five-minute monitoring with no-DCoA blanks. Exact CoaE dose and raw fit uncertainty are not supplied in the inspected table/method.
    family_mapping: L114 matches the archived P63826 sequence and both identical P9WPA3/P9WPA2 successors. PF01121 spans 4-178 in the 407-aa P9WPA3 reference. The second PF04229 domain and His tag remain part of the tested protein; a published forward-primer mismatch prevents exact clone reconstruction.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:1773
    limitations: A condition-specific fitted kcat is not a universal turnover constant or affinity. The opposite DCoA-series direction and inconsistent reported parameters elsewhere in the paper remain explicit. No elementary contact, folding equivalence or family-wide behavior is proved. The assay cofactor's printed name and raw fit details require clarification.
    nodes:
      - node_id: l114a-in-atp-series
        label: L114A instead of WT in the ATP-varied assay
        node_type: PERTURBATION
        grounding:
          - UniProtKB:P9WPA3
      - node_id: atp-series-apparent-turnover
        label: Apparent turnover from the ATP-varied kinetic series
        node_type: ACTIVITY
    edges:
