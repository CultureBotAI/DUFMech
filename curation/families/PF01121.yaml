causal_graphs:
  - graph_id: ecoli-coae-preparative-coa-formation
    title: Recombinant E. coli CoaE supports preparative CoA formation
    scope: W3110 coaE/yacE expressed in BL21(DE3) using pET28b(+), with an engineered Ala after the start codon and the measured processed N terminus ARYIVALTGGIG. Not the mycobacterial tagged fusion protein.
    context: 2001 preparative reaction contains 3 umol dephospho-CoA, 0.1 umol ATP, 1 umol MgCl2, 1 umol KCl, 3.5 umol phosphoenolpyruvate, 5 U pyruvate kinase and 2 U recombinant CoaE in 5 ml water adjusted to pH 8, 30 min at room temperature. HPLC-purified product is compared with authentic CoA by proton NMR. ATP regeneration is part of the joint reaction.
    family_mapping: K-12 reference P0A6I9, coaE/yacE/b0103/JW0100, 206 aa, sequence version 1, exactly matches InterPro and contains PF01121 at 3-177. Ala plus native residues 2-12 explains the measured N-terminal sequence after initiator removal. The modern record cites this W3110 study; complete plasmid sequence was not independently reconstructed.
    scope_status: MECHANISTIC
    taxon: NCBITaxon:83333
    limitations: Product identity is reported from NMR, but raw spectra and a preparative no-enzyme control are not supplied in the inspected material. Separate ADP and thioester-coupled assays corroborate activity under different conditions. This graph does not establish an elementary catalytic base, isolated-profile sufficiency or the products of minor alternative-substrate reactions.
