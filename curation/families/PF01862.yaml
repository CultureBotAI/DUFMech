causal_graphs:
  - graph_id: mjpdad-radiolabeled-decarboxylation
    title: Mj-PdaD decarboxylates arginine with reduced activity in two mutants
    scope: "Soriano 2008 Table 2 and Methods 2.5: intact recombinant M. jannaschii PdaD preparations, WT, E109Q and N47A."
    context: "pPRDC.19 mutant derivatives expressed in E. coli B834(DE3), N-terminal His tag removed. Assay at 343 K for 30 min: 50 mM MES/NaOH pH 6.0, 50 mM KCl, 1 mM DTT, 4 mM L-arginine plus 2 ul radiolabeled L-arginine; HCl termination and 14CO2 scintillation measurement."
    family_mapping: "MJ0316/pdaD, Q57764 sequence version 1 exactly equals AAB98302.1, 165 aa; JAL-1/DSM 2661 reference taxon 243232. PF01862 19-162 includes N47 and E109. Published primers and PDB 2QQC/2QQD confirm the substitutions; residual His0 is not included in native numbering. No isolated-domain sufficiency."
    scope_status: MECHANISTIC
    taxon: NCBITaxon:243232
    limitations: "DIRECT denotes net purified-preparation effects, not proton transfer or a measured self-processing rate. Specific activity per protein mass is not kcat per processed site. WT assay-preparation details, replicate count, uncertainty definition, blank subtraction and tracer specific activity were not independently established. Mutant processing/folding differences can contribute; neither mutant is inactive."
    nodes:
