  - graph_id: mjpdad-processing-contribution-hypothesis
    title: Incomplete N47A maturation may contribute to its activity loss
    scope: "Soriano 2008 Results 3.1-3.3 and Conclusions: proposed interpretation of N47A crystal states and separate specific-activity measurements."
    context: "Crystals grown at 295 K with 1-2 mM arginine in PEG2000/MPD/glycerol and HEPES pH 6.7-7.3; assay instead at 343 K and pH 6.0. A failed processing comparison at 338 K for 3 h supplied no relative WT/mutant rate."
    family_mapping: "Intact Q57764/AAB98302.1 N47A, PF01862 19-162; cleavage is between native S52 and S53, yielding the S53-derived pyruvoyl group. PDB 2QQD includes processed and unprocessed chains plus residual His0. This is not a claim for all PF01862 members."
    scope_status: HYPOTHETICAL
    taxon: NCBITaxon:243232
    limitations: "Crystal populations are not assay-solution processing fractions. One N47A site is mixed and modeled predominantly processed; four are unprocessed and one clearly processed. N47A local structural comparison uses S53A, not WT. Processing-rate comparison was inconclusive, and neither molecular mediation nor its quantitative contribution was established."
    nodes:
      - node_id: reduced-mature-active-fraction
        label: Proposed reduced mature pyruvoyl-bearing fraction in N47A assay solution
        node_type: STATE
      - node_id: n47a-preparation-activity
        label: N47A decarboxylation activity per unit total protein
        node_type: ACTIVITY
    edges:
      - edge_id: incomplete-maturation-may-decrease-activity
        subject: reduced-mature-active-fraction
        predicate: decreases
        object: n47a-preparation-activity
        mechanism: "An unprocessed fraction could reduce the abundance of catalytically mature sites per unit protein and contribute to the observed activity loss. Mixed crystal states and altered local contacts motivate this explanation; they do not demonstrate the intervening change in assay solution or exclude impaired turnover of the processed fraction."
        directness: UNRESOLVED
        support: HYPOTHESIZED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:18391404
            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2467525/
            snippet: Efforts to measure the rate of autoprocessing were inconclusive
            explanation: Methods 2.5, Results 3.1-3.3, Conclusions and inspected Figures 3/4 support a stated mechanistic hypothesis; no observed rate or quantitative mediation is assigned.
            cache_path: evidence/PF01862/soriano-2008-pvlargdc.txt
            cache_sha256: 49f5fe1c11257acd2a765d4ac07c2a3eccb4fbcd765ec904a45992cb3567fffb
discussions:
  - discussion_id: pvlargdc-processing-and-activity-separation
    prompt: Quantify maturation separately from catalytic activity of processed sites.
    kind: CURATION_TODO
    status: OPEN
    rationale: Mutant preparation activities and crystal states support distinct observations. The published failed processing-rate comparison cannot establish relative maturation kinetics or mediation of N47A activity loss.
    evidence:
      - reference: PMID:18391404
        supports: PARTIAL
        evidence_source: primary_methods_table_2_and_figures_3_4
        explanation: E109Q retains activity and fully processed crystal protomers; N47A retains low activity with mixed processing states. Neither establishes a unique catalytic chemical step.
    notes: See evidence/PF01862/PvlArgDC-identity.txt and pvlargdc-gap-ledger.txt. Obtain matched assay-solution processing fractions, valid WT processing controls, activity per processed site and folding controls. Do not treat PYR53 deposit metadata labeled expression tag as biological identity.
    posed_by: Codex
    posed_date: '2026-10-11'
