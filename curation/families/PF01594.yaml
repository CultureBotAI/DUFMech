  - graph_id: tqsa-deletion-lsr-reporter-phases
    title: ydgG deletion increases lsr promoter reporter output in two LBglu growth phases
    scope: BW25113 WT and ydgG::KmR carrying pLW11 lsrACDBFG::lacZ, Herzberg 2006 Figure 3; not direct intracellular AI-2 quantitation.
    context: LB plus 0.2% glucose; overnight cultures are diluted to obtain exponential cells at OD600 0.6 and stationary cells at OD600 6. Beta-galactosidase activity is reported as ONPG cleavage per minute per protein mass. Figure 3 uses duplicate experiments and SD; the two phases remain separate endpoints.
    family_mapping: The complete BW25113 ydgG deletion maps at gene level to 344-aa P0AFS5, whose current PF01594 domain spans 17-328. The reporter plasmid is a separate assay entity and does not measure the isolated domain.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:83333
    limitations: lsr transcription is an indirect intracellular-signal proxy affected by regulatory context, including glucose catabolite repression. The authors propose a future luxS/ydgG double-mutant test; AI-2 mediation is not uniquely established. No intracellular chemical concentration, export velocity or serial reporter-to-biofilm chain is inferred.
