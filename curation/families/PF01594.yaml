causal_graphs:
  - graph_id: tqsa-deletion-extracellular-activity-lb
    title: Whole-gene ydgG deletion lowers extracellular AI-2 reporter activity in LB
    scope: E. coli K-12 BW25113 and its complete ydgG::KmR replacement, Herzberg 2006 pp. 589-590; not a purified TqsA transport assay.
    context: Overnight donor cultures are diluted 1:100 in LB and harvested at OD600 0.6. Filter-sterilized supernatants are assayed with V. harveyi BB170 luminescence normalized per reporter cell. The cited detailed reporter protocol was not independently inspected; no absolute AI-2 concentration or reporter incubation time is invented.
    family_mapping: P0AFS5 / tqsA/ydgG / b1601 is the 344-aa K12 reference, sequence version 1, with PF01594 17-328. The paper identifies b1601/ydgG and verifies the complete BW25113 deletion by five PCRs. Reference sequence and InterPro match exactly, but the historical assay strain/clone was not independently sequenced. Deletion removes the whole gene, not only the domain.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:83333
    limitations: Reporter activity is not a direct chemical concentration or membrane flux. Pleiotropy, polarity and altered signal production/uptake remain possible. This assay cannot distinguish increased export from decreased uptake; the later structural study did not demonstrate TqsA transport with its attempted methods.
