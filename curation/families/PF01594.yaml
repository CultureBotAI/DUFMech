  - graph_id: tqsa-deletion-biofilm-lb
    title: ydgG deletion decreases attached material in LB without added glucose
    scope: The condition-specific opposite-direction BW25113 comparison in Herzberg 2006's 96-well assay.
    context: Unsupplemented LB; cultures start at OD600 0.05 after overnight growth. Both bottom and air-liquid-interface material contribute to the 0.1% crystal-violet stain after 20 min. Two independent experiments with four wells each; incubation duration and temperature of this initial experiment are not specified in the inspected Methods.
    family_mapping: BW25113 complete ydgG::KmR replacement corresponds to the gene encoding P0AFS5, whose reference domain is PF01594 17-328. This is a whole-gene phenotype, not isolated-domain biochemical activity.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:83333
    limitations: This decrease prevents a medium-independent claim that ydgG deletion increases biofilm. The endpoint is attached stainable material, not a molecular transport rate; no causal mediator is uniquely established.
