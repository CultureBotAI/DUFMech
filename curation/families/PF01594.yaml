  - graph_id: tqsa-complemented-extracellular-activity
    title: Induced ydgG complementation restores extracellular reporter activity
    scope: BW25113 ydgG::KmR with pCA24NydgG+ and empty-vector controls, Herzberg 2006 extracellular complementation experiment.
    context: Cultures receive IPTG and 30 ug/ml chloramphenicol, are harvested at OD600 0.6, washed twice for 10 min at 8820g to remove antibiotic that inhibits the Vibrio reporter, and resuspended in 20 ml LB plus 0.2% glucose. Supernatants are sampled after growth to OD600 0.9. The retained endpoint is 1.5 mM IPTG, compared with the uncomplemented/vector context and normalized to WT with pCA24N.
    family_mapping: The historical pCA24NydgG+ expresses the b1601/ydgG gene corresponding to P0AFS5, PF01594 17-328. Full historical tag/linker sequence is not established. Gene-level trans-complementation does not isolate the domain or rule out every overexpression-mediated effect.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:83333
    limitations: Restoration concerns the extracellular BB170 bioassay only; it is not direct export, restoration of intracellular lsr output or a universal rescue of all deletion phenotypes. Washed OD600-0.9 cultures must not be merged with the plasmid-free OD600-0.6 comparisons.
    nodes:
      - node_id: induce-tqsa-complement
        label: Induce pCA24NydgG+ in the deletion background with 1.5 mM IPTG
        node_type: PERTURBATION
      - node_id: complemented-extracellular-output
        label: Extracellular BB170 activity after antibiotic removal and regrowth
        node_type: ACTIVITY
    edges:
      - edge_id: complementation-increases-extracellular-output
        subject: induce-tqsa-complement
        predicate: increases
        object: complemented-extracellular-output
        mechanism: Induced ydgG expression increases the deletion strain's extracellular reporter activity toward the WT-empty-vector level; the reported complemented/WT ratio at 1.5 mM IPTG is 1.0 +/- 0.3. This is genetic support for the phenotype, not resolution of export versus uptake.
        directness: INDIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:16385049
            source_url: https://bpb-us-e1.wpmucdn.com/sites.psu.edu/dist/b/137198/files/2021/08/096.pdf
            snippet: YdgG
            explanation: Complementation Methods p. 589 and Results p. 591 explicitly state the wash/regrowth protocol, empty-vector comparator, dose series and restoration endpoint.
            cache_path: evidence/PF01594/herzberg-2006-assays.txt
            cache_sha256: e1f5bf2694297e49b7d31b5dcc8dec7dc4efaf8d00796473fdd68e0a7ef1c795
  - graph_id: tqsa-deletion-biofilm-lbglu
    title: ydgG deletion increases crystal-violet-stained attached material in LBglu
    scope: BW25113 ydgG::KmR versus WT in the 96-well assay, Herzberg 2006 p. 589; not the separate flow-cell experiment.
    context: LB plus 0.2% glucose; overnight cultures diluted to OD600 0.05. Attached material at the bottom and air-liquid interface is stained with 0.1% crystal violet for 20 min. Two independent experiments, each four wells, are reported. Initial-assay culture duration and temperature are not explicit in the inspected Methods.
    family_mapping: Complete ydgG replacement affects the whole P0AFS5-associated gene, including PF01594 17-328 and its flanks; the current reference is 344 aa and gene-matched to BW25113, not independently clone-sequenced.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:83333
    limitations: Staining is an attached-mass proxy, not a uniquely AI-2-mediated mechanism or direct domain activity. The paper reports separate trans-complementation with different antibiotic/induction conditions; that is not silently substituted into this plasmid-free comparison. The direction reverses in unsupplemented LB.
