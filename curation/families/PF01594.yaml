discussions:
  - discussion_id: tqsa-transport-direction-and-phenotype-mediators
    prompt: Resolve direct TqsA transport and assay-specific mediators before extending reporter effects into a molecular pathway.
    kind: CURATION_TODO
    status: OPEN
    rationale: The historical knockout/rescue data support scoped cellular effects but do not distinguish enhanced export from inhibited uptake, and structure/binding does not by itself establish transport.
    evidence:
      - reference: PMID:16385049
        supports: PARTIAL
        evidence_source: full_text_and_figure_3
        explanation: Eight observed indirect effects retain separate extracellular, intracellular-proxy, complementation and medium-specific staining contexts. The exact historical clone, initial well-assay time/temperature and detailed reporter protocol remain open. Other motility, flow-cell and complementation endpoints require separate curation; MIC ordering is ambiguous.
      - reference: PMID:35698912
        supports: PARTIAL
        evidence_source: selected_full_text
        explanation: The 2022 Discussion explicitly reports inability to demonstrate TqsA transport with attempted methods. Native-MS binding and proposed structural movement do not supply an observed transmembrane step. Preliminary mutants, the suspect printed mass-shift unit and uninspected supplementary spectra require further assessment; condition-specific negative antiport results are not universal nonfunction.
    posed_by: Codex
    posed_date: '2026-10-11'
    notes: Do not transfer Upf0118 antiport to TqsA or collapse the four E. coli family members. Retain the LB biofilm decrease, glucose-dependent regulation, possible deletion pleiotropy and lack of established AI-2-specific mediation. Partial scientific self-review; IN_PROGRESS.
