  - graph_id: tqsa-deletion-extracellular-activity-lbglu
    title: Whole-gene ydgG deletion lowers extracellular reporter activity in glucose-supplemented LB
    scope: The separate BW25113 ydgG::KmR versus WT comparison in Herzberg 2006 LBglu cultures.
    context: LBglu is LB plus 0.2% glucose. Overnight donor cultures are diluted 1:100 and harvested at OD600 0.6. Filtered supernatants are tested with BB170 luminescence normalized per reporter cell. This plasmid-free comparison is not the washed OD600-0.9 complementation assay.
    family_mapping: b1601/ydgG maps to P0AFS5, 344 aa, PF01594 17-328; the intervention replaces the entire BW25113 gene with a kanamycin cassette. K12 reference identity is not independent historical clone resequencing.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:83333
    limitations: This indirect bioassay does not establish absolute extracellular AI-2, protein-mediated flux or a single transport direction. Glucose changes regulatory context; the LB result is not substituted for this condition.
