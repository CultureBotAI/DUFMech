  - graph_id: cthy28-dt40-rescue
    title: Expressed RNAi-resistant chicken Thy28 restores DT40 Pax5 readouts
    scope: Fujita2015 Figure6F/G and SupplementS2, Seq3 knockdown with expressed3xFLAG-cThy28 silent mutant.
    context: Full-length DT40 cDNA, N-terminal3xFLAG, synonymous changes at the Seq3 target; pcDNA-Hyg-3xFL-cThy28-mut co-transfected with shRNA. Two expressing rescue clones; RNA normalized to GAPDH,n=3. S2 includes two nonexpressing rescue clones.
    family_mapping: Chicken Q90679/AAA75591.1 maps PF01878 at73-235. RefSeq NP_989618.2 has W51 rather than L51 outside that match; the internal DT40 insert sequence is not independently verified. Silent RNAi-resistance substitutions do not test protein residues.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:9031
    limitations: Rescue supports an on-target contribution but cannot isolate the EVE domain or direct molecular action. Figure6F and SupplementS2 reuse some lanes, not independent replication. Nonexpressing rescue clones fail to restore Pax5.
