causal_graphs:
  - graph_id: thy28-wehi-membrane-readouts
    title: Thy28-V5 expression partially reduces challenged WEHI-231 membrane phenotypes
    scope: Toyota2012 Figure2A/B, stable Thy28-V5 versus vector control in mouse WEHI-231.
    context: Anti-IgM10 ug/ml; RPMI1640 with10%FBS,50 uM mercaptoethanol and100 ug/ml kanamycin,37 C/5%CO2. DiOC6 staining40 nM and annexinV/7-AAD flow cytometry; at least10000 events. Figure2B uses clones3/6.
    family_mapping: Mouse Thy28 reference Q91YJ3 equals BAC21100.1/NP_653126.1,226 aa,PF01878 at56-219. Human THYN1 Q9P016 also maps56-218. The Thy28-V5 insert sequence/species is unresolved; mouse host identity does not verify the insert. No isolated EVE domain is tested.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:10090
    limitations: Stable overexpression is not physiological necessity. Figure1 confirms Thy28-V5 expression and similar IgM/MHCI surface signals. Clone selection, tag effects and indirect signaling remain possible. Protection is partial, time- and clone-dependent; no uniform reduction of every death quadrant is claimed.
    nodes:
      - node_id: thy28-v5-expression
        label: Stable Thy28-V5 expression under anti-IgM challenge
        node_type: PERTURBATION
      - node_id: dioc6-low-cells
        label: Fraction of cells with low DiOC6 signal
        node_type: PHENOTYPE
      - node_id: early-annexin-cells
        label: AnnexinV-positive 7-AAD-negative fraction at24 h
        node_type: PHENOTYPE
    edges:
      - edge_id: expression-reduces-potential-loss
        subject: thy28-v5-expression
        predicate: decreases
        object: dioc6-low-cells
        mechanism: Thy28-V5 cells have fewer low-potential cells over12-48 h; the representative48 h values are75.6% vector versus59.9% Thy28. This is a partial cellular protection phenotype, not direct control of a mitochondrial channel.
        directness: INDIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
          - reference: PMID:22139584
            source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6275998/
            snippet: Data represent one of three independent experiments.
            explanation: Original Figure2A and flow Methods distinguish DiOC6 loss from a measured molecular death mechanism; substantial loss remains.
            cache_path: evidence/PF01878/toyota-2012-assays.txt
            cache_sha256: 0c5633d14e0ff634ec33baa4ceb1aa9969700b3d40008b3c9925d7b3dfcda85e
      - edge_id: expression-reduces-early-annexin-fraction
        subject: thy28-v5-expression
        predicate: decreases
        object: early-annexin-cells
        mechanism: At24 h the lower-right annexinV/7-AAD quadrant is33.3% in vector versus15.8% and3.8% in clones3/6. At48 h clone3 approaches control,54.2% versus56.6%; clone6 remains38.1%. Clone6 secondary-necrotic24 h cells are15.3% versus12.8% vector, so an all-quadrant protection claim is unsupported.
        directness: INDIRECT
