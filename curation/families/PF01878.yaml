  - graph_id: thy28-wehi-oxidation-readout
    title: Thy28-V5 clones reduce the live-gated oxidation-probe readout
    scope: Toyota2012 Figure4, clones3/6 versus vector.
    context: Anti-IgM10 ug/ml for24/36/48 h;1 uM H2DCFDA staining30 min at37 C; FSC/SSC viable gate with7-AAD viability confirmation. Medium-only48 h provides the unstimulated comparison.
    family_mapping: Reference Q91YJ3/NP_653126.1 maps PF01878 at56-219; tagged construct sequence unresolved. This is a cellular whole-protein intervention.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:10090
    limitations: H2DCFDA fluorescence is not specific H2O2 quantitation or mitochondrial source localization. Baselines differ and gating selects surviving cells; probe handling, redox state and survival can influence the signal. The unpublished12 h observation is not adopted as a measured edge.
