        node_type: STATE
      - node_id: pax5-protein
        label: Pax5 immunoblot abundance
        node_type: STATE
      - node_id: aid-rna
        label: GAPDH-normalized AID transcript abundance
        node_type: STATE
    edges:
      - edge_id: knockdown-reduces-pax5-rna
        subject: cthy28-knockdown
        predicate: decreases
        object: pax5-rna
        mechanism: Both shRNA sequences reduce total Pax5 and the1A/1B transcript readouts relative to shGFP. Steady-state RNA measurements do not distinguish transcription from RNA turnover, and the residual signal precludes an absolute requirement for every Pax5 transcript.
        directness: INDIRECT
        support: OBSERVED
        evidence_kind: EXPERIMENTAL
        evidence:
