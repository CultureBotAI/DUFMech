  - graph_id: cthy28-dt40-knockdown
    title: Chicken Thy28 knockdown lowers selected DT40 expression readouts
    scope: Fujita2015 Figure6D/E and SupplementS1, two clones each for Seq3/Seq4 versus shGFP controls.
    context: Stable pSUPER-Neo shRNAs in chicken DT40 B cells, G4181.5 mg/ml selection. RT-PCR normalized to GAPDH,mean/SEM,n=3; immunoblot with beta-tubulin loading control. No anti-IgM challenge is applied in this experiment.
    family_mapping: cThy28 reference Q90679 sequenceversion1 equals AAA75591.1,242 aa,PF01878 at73-235. NP_989618.2 differs at51 outside EVE. DT40 cDNA and TableS2 terminal primers support gene assignment, not exact internal sequence; no isolated domain is tested.
    scope_status: PHENOTYPIC
    taxon: NCBITaxon:9031
    limitations: Whole-transcript knockdown cannot identify a DUF residue mechanism. Pax5 transcripts remain nonzero. Retained IgM argues against wholesale loss of B-cell phenotype but is not exhaustive identity profiling. AID need not be directly regulated by Thy28.
    nodes:
      - node_id: cthy28-knockdown
        label: Stable chicken Thy28 knockdown with Seq3 or Seq4
