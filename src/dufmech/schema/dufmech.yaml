id: https://w3id.org/dufmech/schema
name: dufmech
title: DUFMech Family Records
description: Frozen family identities with separately curated, evidence-backed assertions.
license: BSD-3-Clause
prefixes:
  linkml: https://w3id.org/linkml/
  dufmech: https://w3id.org/dufmech/
  Pfam: https://www.ebi.ac.uk/interpro/entry/pfam/
  InterPro: https://www.ebi.ac.uk/interpro/entry/InterPro/
default_prefix: dufmech
default_range: string
imports:
  - linkml:types
  - mech_shared
classes:
  FamilyRecord:
    tree_root: true
    description: A source-derived family projection; SEEDED is not scientific review.
    attributes:
      id:
        identifier: true
        required: true
        pattern: '^Pfam:PF[0-9]{5}$'
      pfam_id:
        required: true
        pattern: '^PF[0-9]{5}$'
      name:
        required: true
      short_name:
        required: true
      interpro_id:
        pattern: '^InterPro:IPR[0-9]{6}$'
      seed_status:
        required: true
        range: SeedStatus
      characterization_status:
        required: true
        range: CharacterizationStatus
      curation_status:
        required: true
        range: CurationStatus
      review_id:
        description: Retained completed record report; required with matching content and history for REVIEWED.
        pattern: '^(reports/yaml_record_review/[A-Za-z0-9_.-]+[.]md|reviews/structured/[A-Za-z0-9][A-Za-z0-9._-]{0,159}/review[.]yaml)$'
      curation_history:
        description: Stable directory containing canonical append-only history for this family.
        pattern: '^history/records/PF[0-9]{5}$'
      curation_events:
        description: Read-only index derived from validated canonical history sidecars, never an authoring surface.
        range: CurationEvent
        multivalued: true
        inlined_as_list: true
      description:
        description: Imported source description, not a verified functional assertion.
      source_url:
        required: true
        range: uri
      counters:
        range: FamilyCounters
        inlined: true
      provenance:
        required: true
        range: SnapshotProvenance
        inlined: true
      score_provenance:
        range: SnapshotProvenance
        inlined: true
      assertions:
        range: FunctionalAssertion
        multivalued: true
        inlined_as_list: true
      causal_graphs:
        range: CausalGraph
        multivalued: true
        inlined_as_list: true
      discussions:
        range: Discussion
        multivalued: true
        inlined_as_list: true
      datasets:
        range: Dataset
        multivalued: true
        inlined_as_list: true
      cross_corpus_links:
        range: CrossCorpusLink
        multivalued: true
        inlined_as_list: true
      sequence_reasoning_graphs:
        description: Sequence-coordinate-aware reasoning graphs linking reference sequences, explicit regions, coordinate mappings, deduplicated observations, and evidence-graded functional claims.
        range: RegionReasoningGraph
        multivalued: true
        inlined_as_list: true
  FamilyCuration:
    description: Human-owned overlay. Imported identity and counters cannot be overridden.
    attributes:
      pfam_id:
        required: true
        pattern: '^PF[0-9]{5}$'
      curation_status:
        required: true
        range: CurationStatus
      review_id:
        pattern: '^(reports/yaml_record_review/[A-Za-z0-9_.-]+[.]md|reviews/structured/[A-Za-z0-9][A-Za-z0-9._-]{0,159}/review[.]yaml)$'
      curation_history:
        pattern: '^history/records/PF[0-9]{5}$'
      assertions:
        range: FunctionalAssertion
        multivalued: true
        inlined_as_list: true
      causal_graphs:
        range: CausalGraph
        multivalued: true
        inlined_as_list: true
      discussions:
        range: Discussion
        multivalued: true
        inlined_as_list: true
      datasets:
        range: Dataset
        multivalued: true
        inlined_as_list: true
      cross_corpus_links:
        range: CrossCorpusLink
        multivalued: true
        inlined_as_list: true
      sequence_reasoning_graphs:
        description: Sequence-coordinate-aware reasoning graphs linking reference sequences, explicit regions, coordinate mappings, deduplicated observations, and evidence-graded functional claims.
        range: RegionReasoningGraph
        multivalued: true
        inlined_as_list: true
  CurationEvent:
    description: Generated record-level view of a canonical sidecar event; the referenced history record is authoritative.
    attributes:
      timestamp:
        description: Preserve the canonical UTC timestamp spelling and precision through model serialization.
        range: string
        all_of:
          - range: datetime
        required: true
        pattern: '^20[0-9]{2}-'
      curator:
        required: true
      action:
        required: true
      outcome:
        required: true
      summary:
        required: true
      history_record:
        required: true
        pattern: '^history/records/PF[0-9]{5}/[A-Za-z0-9_.-]+[.]ya?ml$'
      event_index:
        range: integer
        minimum_value: 0
        required: true
      llm_assisted:
        range: boolean
        required: true
  FamilyCounters:
    attributes:
      proteins:
        range: integer
        minimum_value: 0
      matches:
        range: integer
        minimum_value: 0
      proteomes:
        range: integer
        minimum_value: 0
      taxa:
        range: integer
        minimum_value: 0
      structures:
        range: integer
        minimum_value: 0
      alphafold_models:
        range: integer
        minimum_value: 0
      domain_architectures:
        range: integer
        minimum_value: 0
  SnapshotProvenance:
    attributes:
      snapshot_id:
        required: true
      path:
        required: true
        pattern: '^data/worklists/[A-Za-z0-9_-]+[.]json$'
      sha256:
        required: true
        pattern: '^[a-f0-9]{64}$'
      generated_at:
        required: true
        pattern: '^\d{4}-\d{2}-\d{2}T.*(Z|[+-]\d{2}:\d{2})$'
      source_url:
        description: Upstream URL when the snapshot is acquired rather than locally derived.
        range: uri
  FunctionalAssertion:
    description: Scoped experimental or computational claim, not implied by a DUF name.
    attributes:
      assertion_id:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      statement:
        required: true
      evidence_kind:
        required: true
        range: EvidenceKind
      scope:
        required: true
        description: Exact family/subfamily/protein scope and limits of generalization.
      sequence_id:
        description: Optional reference sequence identifier when this assertion is anchored to a specific sequence in a sequence reasoning graph.
        pattern: '^[A-Za-z0-9_.:-]+$'
      region_id:
        description: Optional region identifier when this assertion is anchored to an explicit sequence interval or site.
        pattern: '^[A-Za-z0-9_.:-]+$'
      synthesized_claim_id:
        description: Optional link to a SynthesizedClaim in a RegionReasoningGraph.
        pattern: '^[A-Za-z0-9_.:-]+$'
      evidence:
        required: true
        range: ClaimEvidence
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
  CausalGraph:
    description: A scoped directed mechanism or phenotype graph, not family-wide functional proof.
    attributes:
      graph_id:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      title:
        required: true
      scope:
        description: Exact tested protein or construct and limits of generalization.
        required: true
      context:
        description: Organism, strain, perturbation, conditions and necessary cofactors or partners.
        required: true
      family_mapping:
        description: Evidence mapping the tested object to this Pfam domain, with coordinate limits.
        required: true
      scope_status:
        range: CausalScope
        required: true
      taxon:
        pattern: '^NCBITaxon:[0-9]+$'
      limitations:
        description: Unresolved steps, alternative explanations and unsupported transfers.
        required: true
      feedback_explanation:
        description: Required when directed cycles or self-edges represent actual feedback.
      nodes:
        range: CausalNode
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      edges:
        range: CausalEdge
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
  CausalNode:
    attributes:
      node_id:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      label:
        required: true
      node_type:
        range: CausalNodeType
        required: true
      grounding:
        description: Verified entity CURIEs; absence means ungrounded, not a fabricated identifier.
        multivalued: true
        pattern: '^[A-Za-z][A-Za-z0-9_.-]*:\S+$'
      sequence_id:
        description: Optional reference sequence identifier for sequence-anchored state, activity, or perturbation nodes.
        pattern: '^[A-Za-z0-9_.:-]+$'
      region_id:
        description: Optional sequence region or residue site identifier for region-localized nodes.
        pattern: '^[A-Za-z0-9_.:-]+$'
  CausalEdge:
    description: Evidence for a directed relation, rather than citations only establishing the endpoints.
    attributes:
      edge_id:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      subject:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      predicate:
        required: true
        range: CausalPredicate
      object:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      mechanism:
        description: What the evidence supports about this directed step and its conditions.
        required: true
      directness:
        required: true
        range: CausalDirectness
      support:
        required: true
        range: CausalSupport
      evidence_kind:
        required: true
        range: EvidenceKind
      evidence:
        required: true
        range: ClaimEvidence
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
  ClaimEvidence:
    description: A primary-source quotation retained locally for an independently checkable claim.
    attributes:
      reference:
        required: true
        pattern: '^(PMID:[0-9]+|doi:10[.][0-9]{4,9}/\S+|https://\S+)$'
      source_url:
        required: true
        range: uri
      snippet:
        required: true
      explanation:
        required: true
      cache_path:
        required: true
        pattern: '^evidence/[A-Za-z0-9_./-]+[.]txt$'
      cache_sha256:
        required: true
        pattern: '^[a-f0-9]{64}$'
  RegionReasoningGraph:
    description: >-
      Sequence-coordinate-aware reasoning graph connecting reference sequences,
      explicit 1-based inclusive regions, coordinate mappings, deduplicated
      observations, and evidence-graded functional claims while separating
      epistemic evidence links from biological causation.
    attributes:
      graph_id:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      pfam_id:
        required: true
        pattern: '^PF[0-9]{5}$'
      title:
        required: true
      description:
        description: Summary of the reasoning scope, tested sequences, and unresolved questions.
      sequences:
        range: SequenceIdentity
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      regions:
        range: SequenceRegion
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      coordinate_mappings:
        range: CoordinateMapping
        multivalued: true
        inlined_as_list: true
      observations:
        range: RegionObservation
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      evidence_groups:
        range: EvidenceGroup
        multivalued: true
        inlined_as_list: true
      synthesized_claims:
        range: SynthesizedClaim
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      reasoning_edges:
        range: ReasoningEdge
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      causal_graph_refs:
        description: Optional references to CausalGraph.graph_id entries representing biological causal mechanisms.
        multivalued: true
        pattern: '^[A-Za-z0-9_-]+$'
  SequenceIdentity:
    description: >-
      Identified reference protein sequence with explicit version or SHA-256 digest
      and isoform context for coordinate validation.
    attributes:
      sequence_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      uniprot_accession:
        required: true
        pattern: '^([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})$'
      isoform:
        description: Explicit UniProt isoform identifier when non-canonical or isoform-pinned.
        pattern: '^([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})-[0-9]+$'
      sequence_version:
        description: UniProt sequence version integer when known.
        range: integer
        minimum_value: 1
      sequence_length:
        required: true
        range: integer
        minimum_value: 1
      sequence_sha256:
        required: true
        pattern: '^[a-f0-9]{64}$'
      sequence_md5:
        pattern: '^[a-f0-9]{32}$'
      taxon_id:
        pattern: '^NCBITaxon:[0-9]+$'
      organism:
        description: Source organism scientific name.
      uniprot_release:
        description: Upstream UniProt release or snapshot version from which the sequence was captured.
      source_url:
        range: uri
  SequenceInterval:
    description: Canonical 1-based inclusive interval [start, end] on an identified reference sequence.
    attributes:
      start:
        required: true
        range: integer
        minimum_value: 1
      end:
        required: true
        range: integer
        minimum_value: 1
      start_uncertain:
        range: boolean
      end_uncertain:
        range: boolean
      residue_identity:
        description: Expected one-letter amino-acid sequence or residue at this interval when verified.
        pattern: '^[A-Z]+$'
  SequenceRegion:
    description: >-
      An explicit contiguous or discontinuous region, site, construct, or
      unlocalized whole-protein span on an identified sequence.
    attributes:
      region_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      sequence_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      label:
        required: true
      region_kind:
        required: true
        range: RegionKind
      coordinate_status:
        required: true
        range: CoordinateStatus
      intervals:
        description: >-
          Canonical 1-based inclusive intervals on the reference sequence; ordered and
          non-overlapping for localized regions, or empty when coordinate_status is
          UNKNOWN_LOCALIZATION.
        range: SequenceInterval
        multivalued: true
        inlined_as_list: true
      source_coordinate_system:
        required: true
        range: CoordinateSystem
      source_coordinates_text:
        description: Original coordinates as reported in the source before conversion to 1-based reference numbering.
      conversion_provenance:
        description: How source coordinates (e.g., construct numbering, PDB author numbering, or HMM profile states) were converted.
      pfam_id:
        pattern: '^PF[0-9]{5}$'
      interpro_id:
        pattern: '^InterPro:IPR[0-9]{6}$'
  ResidueCorrespondence:
    description: Explicit residue-level correspondence between two coordinate systems or homologous sequences.
    attributes:
      source_position:
        required: true
        range: integer
        minimum_value: 1
      source_residue:
        pattern: '^[A-Z]$'
      target_position:
        required: true
        range: integer
        minimum_value: 1
      target_residue:
        pattern: '^[A-Z]$'
      pdb_insertion_code:
        pattern: '^[A-Za-z0-9]$'
      mutation_substitution:
        pattern: '^[A-Z][0-9]+[A-Z*]$'
      note:
        description: Context on conservation, catalytic role, or engineered substitution.
  CoordinateMapping:
    description: >-
      Explicit mapping between two regions (e.g., construct to domain, structure to
      UniProt, or homolog alignment) retaining coverage, gaps, and uncertainty.
    attributes:
      mapping_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      source_region_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      target_region_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      mapping_kind:
        required: true
        range: CoordinateMappingKind
      equivalence_status:
        required: true
        range: MappingEquivalenceStatus
      overlap_residues:
        range: integer
        minimum_value: 0
      source_coverage:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
      target_coverage:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
      alignment_gaps:
        range: integer
        minimum_value: 0
      residue_correspondences:
        range: ResidueCorrespondence
        multivalued: true
        inlined_as_list: true
      mapping_uncertainty:
        description: Explicit boundary uncertainty, insertion codes, construct tags, or alignment ambiguity.
      provenance_note:
        required: true
  RegionObservation:
    description: >-
      Standardized experimental observation, curated annotation, or computational
      prediction anchored to a sequence region, separating observation from interpretation.
    attributes:
      observation_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      region_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      sequence_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      evidence_kind:
        required: true
        range: EvidenceKind
      source_kind:
        required: true
        range: ObservationSourceKind
      method:
        required: true
        description: Experimental assay, structural determination method, or computational model/database.
      assay_conditions:
        description: Substrate, cofactor, buffer, temperature, partner protein, or in vivo context.
      tested_construct_region_id:
        pattern: '^[A-Za-z0-9_.:-]+$'
      mutation_region_ids:
        multivalued: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      observed_effect:
        required: true
        description: Direct empirical measurement or computational hit output, kept distinct from functional interpretation.
      interpretation:
        required: true
        description: Proposed functional meaning derived from the observation.
      polarity:
        required: true
        range: ObservationPolarity
      raw_score:
        range: float
      score_metric:
        range: ScoreMetricKind
      primary_experiment_key:
        required: true
        pattern: '^[A-Za-z0-9_.:/-]+$'
        description: >-
          Canonical key identifying the underlying experiment or primary prediction
          run so mirrored records or repeated reports are grouped rather than double-counted.
      derived_from_observation_ids:
        multivalued: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      limitations:
        description: Assay scope limits, unlocalized whole-protein perturbation, or model confidence limits.
      evidence:
        range: ClaimEvidence
        multivalued: true
        inlined_as_list: true
  EvidenceGroup:
    description: >-
      Deduplicated group of compatible observations sharing a primary experiment or
      prediction source so mirrored records are not counted as independent confirmation.
    attributes:
      group_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      primary_experiment_key:
        required: true
        pattern: '^[A-Za-z0-9_.:/-]+$'
      evidence_kind:
        required: true
        range: EvidenceKind
      polarity:
        required: true
        range: ObservationPolarity
      observation_ids:
        required: true
        multivalued: true
        minimum_cardinality: 1
        pattern: '^[A-Za-z0-9_.:-]+$'
      deduplication_rationale:
        required: true
        description: Why member observations represent a single independent evidence unit or distinct method.
  SynthesizedClaim:
    description: >-
      Evidence-graded functional claim or aspect of function at supported specificity
      and sequence scope, retaining supporting and contradicting evidence groups.
    attributes:
      claim_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      label:
        required: true
      function_aspect:
        required: true
        range: FunctionAspect
      ontology_term_id:
        pattern: '^(GO:[0-9]{7}|Rhea:[0-9]+|EC:[0-9]+(\.[0-9-]+){0,3}|CHEBI:[0-9]+|Pfam:PF[0-9]{5}|InterPro:IPR[0-9]{6}|UniProtKB:[A-Z0-9-]+)$'
      ontology_term_label:
        description: Canonical label of the ontology term when ontology_term_id is provided.
      target_region_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      claimed_scope:
        required: true
        range: ClaimScope
      synthesis_status:
        required: true
        range: SynthesisStatus
      supporting_evidence_groups:
        multivalued: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      contradicting_evidence_groups:
        multivalued: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      supporting_observation_ids:
        multivalued: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      contradicting_observation_ids:
        multivalued: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      mapping_ids:
        multivalued: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      scope_rationale:
        required: true
        description: Why the claimed scope is supported at this specificity and not broader.
      scope_transfer_blocks:
        multivalued: true
        description: Explicit blocks preventing silent transfer to full protein, paralogues, or whole family.
      synthesis_explanation:
        required: true
        description: How independent evidence groups, coordinate mappings, and contradictions were synthesized.
      discriminating_experiments:
        multivalued: true
        description: Specific experiments that would resolve remaining ambiguity or test transfer.
  ReasoningEdge:
    description: >-
      Typed edge in a RegionReasoningGraph explicitly distinguishing coordinate
      mappings, evidence support/contradiction, and homology inferences from biological causation.
    attributes:
      edge_id:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      subject:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      predicate:
        required: true
        range: ReasoningPredicate
      object:
        required: true
        pattern: '^[A-Za-z0-9_.:-]+$'
      edge_category:
        required: true
        range: ReasoningEdgeCategory
      support:
        required: true
        range: CausalSupport
      evidence_kind:
        required: true
        range: EvidenceKind
      rationale:
        required: true
enums:
  CausalScope:
    permissible_values:
      MECHANISTIC:
        description: Includes at least one directly observed experimental mechanism step.
      PHENOTYPIC:
        description: Includes an experimentally observed effect without claiming a resolved molecular mechanism.
      HYPOTHETICAL:
        description: Proposed directed explanations, not observed causal effects.
  CausalNodeType:
    permissible_values:
      STATE:
      ACTIVITY:
      PROCESS:
      PERTURBATION:
      PHENOTYPE:
  CausalPredicate:
    permissible_values:
      increases:
      decreases:
      required_for:
      enables:
      produces:
      degrades:
      converts_to:
  CausalDirectness:
    permissible_values:
      DIRECT:
      INDIRECT:
      UNRESOLVED:
  CausalSupport:
    permissible_values:
      OBSERVED:
      INFERRED:
      HYPOTHESIZED:
      CONTESTED:
  SeedStatus:
    permissible_values:
      UNKNOWN_CANDIDATE:
      KNOWN_HISTORICAL_DUF:
      EX_DUF:
        description: >-
          Pfam renamed the family away from a DUF/UPF name; its previous identifiers
          record the former name. Naming history, not experimental evidence.
      FALSE_POSITIVE_TEXT_HIT:
  CharacterizationStatus:
    permissible_values:
      UNSCORED:
      UNKNOWN_CANDIDATE:
      KNOWN_HISTORICAL_DUF:
      PARTIALLY_CHARACTERIZED:
  CurationStatus:
    permissible_values:
      SEEDED:
      IN_PROGRESS:
      REVIEWED:
  EvidenceKind:
    permissible_values:
      EXPERIMENTAL:
      COMPUTATIONAL:
      CONTEXTUAL:
  RegionKind:
    permissible_values:
      DOMAIN_HIT:
      DISCONTINUOUS_DOMAIN:
      EXPERIMENTAL_CONSTRUCT:
      CATALYTIC_SITE:
      BINDING_SITE:
      MUTATION_SITE:
      STRUCTURAL_OBSERVATION_REGION:
      ADJACENT_ARCHITECTURAL_DOMAIN:
      FULL_LENGTH_PROTEIN:
      UNKNOWN_LOCALIZATION:
  CoordinateStatus:
    permissible_values:
      EXACT:
      UNCERTAIN_BOUNDARY:
      DISCONTINUOUS:
      WHOLE_PROTEIN_UNLOCALIZED:
      UNKNOWN_LOCALIZATION:
  CoordinateSystem:
    permissible_values:
      UNIPROT_CANONICAL:
      UNIPROT_ISOFORM:
      CONSTRUCT_NUMBERING:
      MATURE_PEPTIDE:
      PDB_SEQRES:
      PDB_AUTHOR:
      HMM_PROFILE:
      ALIGNMENT_COLUMN:
      UNSPECIFIED:
  CoordinateMappingKind:
    permissible_values:
      CONSTRUCT_TO_REFERENCE:
      DOMAIN_TO_CONSTRUCT:
      STRUCTURE_TO_UNIPROT:
      ISOFORM_TO_CANONICAL:
