stages:
- stage: 1
  key: open_issue_triage
  goal_text: Use triage-and-resolve-issues on DUFMech's supervisor-frozen open-issue inventory. Read every
    member's evidence, comments and linked open work before grouping family/member/construct claims, worklist
    and sequence provenance, and browser/accessibility defects or proposals. Coordinate with existing
    curation and infrastructure PRs; do not duplicate them. Assign one severity:critical/high/medium/low
    label with reasons and retain stable groups, plans and every disposition. Resolve all critical/high
    issues or hold on their blocking prerequisites; then work the one or two largest eligible remaining
    groups within the primary and secondary's single shared four-hour wall-clock budget. Preserve DUF/UPF/EX_DUF
    identity, exact protein/construct/residue scope, source rights and uncertainty; a family assignment
    or model is not experimental function. Use native maintained writers and validation, retain the five
    required evidence outputs, finish the full authorized commit sequence, and stop for supervisor closure.
  skill_paths:
  - .claude/skills/dufmech-evolve-workflow/SKILL.md
  - .claude/skills/triage-and-resolve-issues/SKILL.md
  applicability: enabled
- stage: 2
  key: add_records
  goal_text: Use the repository-local add/discovery skills to review candidates and add new DUF, UPF and
    EX_DUF Pfam families until a repeated, recorded search of the bounded frontier finds no further admissible
    new records. Preserve unresolved candidates and search limits.
  skill_paths:
  - .claude/skills/dufmech-evolve-workflow/SKILL.md
  - .claude/skills/add-record/SKILL.md
  applicability: enabled
- stage: 3
  key: causal_graphs
  goal_text: Review every eligible record and use the repository-local causal-graph and curation instructions
    to review, edit and update its evidence-backed native mechanism representation. Record source-limited
    gaps and representation/writer blockers; do not invent fields or unsupported edges.
  skill_paths:
  - .claude/skills/dufmech-evolve-workflow/SKILL.md
  - .claude/skills/curate-causal-graphs/SKILL.md
  - .claude/skills/curate-yaml-record/SKILL.md
  applicability: enabled
- stage: 4
  key: protein_examples
  goal_text: Review all records and add verified UniProt protein examples or the native equivalent where
    applicable, prioritizing gene and protein elements of mechanism graphs. Preserve exact organism, sequence
    and claim scope; document inapplicability and representation/writer blockers.
  skill_paths:
  - .claude/skills/dufmech-evolve-workflow/SKILL.md
  - .claude/skills/ground-causal-graph-proteins/SKILL.md
  - .claude/skills/dufmech-protein-examples/SKILL.md
  applicability: enabled
- stage: 5
  key: record_review
  goal_text: Use DUFMech repository-local record-review and cohort-review skills to review every eligible
    record in a frozen inventory. Save actual versioned review reports, stable findings, coverage, provenance,
    input hashes, limitations and dispositions through native persistence plus the parent workflow evidence
    manifest. Preserve unresolved findings for the next grouped-remediation goal; complete this goal with
    its own commit sequence.
  skill_paths:
  - .claude/skills/dufmech-evolve-workflow/SKILL.md
  - .claude/skills/review-yaml-record/SKILL.md
  - .claude/skills/review-yaml-category/SKILL.md
  applicability: enabled
- stage: 6
  key: resolve_review_findings
  goal_text: Consume the current cycle's accepted review outputs and carried-forward findings in DUFMech.
    Group related problems by cause and repair ownership, deduplicate against real GitHub issues, create
    or reuse issues, implement the accepted fixes through native writers, validate and obtain fresh review.
    Preserve immutable original reports and save the issue map, finding dispositions, linked new review
    evidence and unresolved blockers. Finish with the complete commit sequence.
  skill_paths:
  - .claude/skills/dufmech-evolve-workflow/SKILL.md
  - .claude/skills/review-open-issues/SKILL.md
  applicability: enabled
- stage: 7
  key: infrastructure
  goal_text: Freeze DUFMech INFRA_TASKS.md at a documented cutoff and turn the bounded intake into a dependency-aware
    implementation plan. Group related needs into real GitHub issues, implement selected requirements
    and upgrades, validate outcomes, update issue-linked dispositions and explicitly carry forward blocked
    or deferred tasks. Save the ledger snapshot, plan, validation and parent evidence manifest; finish
    the full commit sequence, write the closure receipt and stop; the coordinator alone dispatches the
    next goal or cycle.
  skill_paths:
  - .claude/skills/dufmech-evolve-workflow/SKILL.md
  - .claude/skills/review-open-issues/SKILL.md
  applicability: enabled
