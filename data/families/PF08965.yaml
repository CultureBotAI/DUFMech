description: This domain is found in Aca2 repressor from Pectobacterium phage ZF40, the uncharacterised
  protein YdiL from Escherichia coli and related sequences. Aca2 regulates the transcription and translation
  of phage anti-CRISPR acrIF8 gene through DNA binding and translationally by binding conserved RNA stem-loops
  on mRNAs. This protein contains six alpha-helices and two parallel beta-strands [[cite:PUB00160094],[cite:PUB00158951],[cite:PUB00158952]].
