description: This domain represents a set of tandem leucine rich repeats found in human F-box/LRR-repeat
  protein 15 (FBXL15) and similar eukaryotic proteins. FBXL15 is the substrate recognition component of
  a SCF (SKP1-CUL1-F-box protein), an E3 ubiquitin-protein ligase complex which mediates the ubiquitination
  and subsequent proteasomal degradation of SMURF1, thereby acting as a positive regulator of the BMP
  signalling pathway. It is required for dorsal/ventral pattern formation and bone mass maintenance [[cite:PUB00147666]].
