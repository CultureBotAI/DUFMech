description: 'This conserved domain is found in Thyroid adenoma-associated proteins (THADA) and the yeast
  homologue, TRM732. Trm732 forms a complex with the methyltransferase Trm7 to 2''- O-methylate tRNA residue
  32 (Nm32), being required for Trm7 methylation activity. In humans, mutations of the Trm7 homologue
  FTSJ1, which interacts with THADA, impair Nm32 modifications, associated with non-syndromic X-linked
  intellectual disability [[cite:PUB00098320],[cite:PUB00098321],[cite:PUB00098322]]. It has been suggested
  that these proteins may play a role in additional biological processes not related to translation. This
  domain contains a RRSAGLP conserved motif that is required for tRNA modification activity (Funk HM et.al.,
  Preprint from bioRxiv, 03 Jun 2021 DOI: 10.1101/2021.06.03.446962) [[cite:PUB00098320],[cite:PUB00098321],[cite:PUB00098322]].'
