description: This is a family of unknown function. Family members are found in Bacteria and Eukaryotes.
  In algae, this family is found on the N-terminal of diphthamide synthase family [pfam:PF01902] and is
  predicted to be a membrane transporter belonging to The ATP-binding Cassette (ABC) family [[cite:PUB00091274]].
  In nematoda, it is found on the N-terminal side of ribosomal protein family L14 [pfam:PF00238]. It is
  also found on the N-terminal of Cob(I)alamin adenosyltransferase [pfam:PF01923] in other eukaryotes.
  Family members found in homo sapiens such as [swissprot:Q5VUE5], have been shown to be highly expressed
  in 15 high-grade neuroendocrine tumor cell lines and YAP1-positive small-cell lung cancer cell lines
  [[cite:PUB00091275]] as well as being up-regulated in two human Multiple Myloma cell lines in response
  to selective nuclear export inhibitor KPT-276 [[cite:PUB00091276]]. The HMM profile of this family reveals
  4 highly conserved cysteines.
