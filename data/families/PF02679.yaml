description: In methanobacteria (2R)-phospho-3-sulfolactate synthase (ComA) catalyses the first step of
  the biosynthesis of coenzyme M from phosphoenolpyruvate (P-enolpyruvate). This novel enzyme catalyses
  the stereospecific Michael addition of sulfite to P-enolpyruvate, forming L-2-phospho-3-sulfolactate
  (PSL). It is suggested that the ComA-catalysed reaction is analogous to those reactions catalysed by
  beta-elimination enzymes that proceed through an enolate intermediate [[cite:PUB00010730]].
