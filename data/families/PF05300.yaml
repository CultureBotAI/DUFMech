description: MIC19 (also known as ChChd3) and MIC25 (also known as ChChd6) are components of the MICOS
  complex, a large protein complex of the mitochondrial inner membrane that plays crucial roles in the
  maintenance of crista junctions, inner membrane architecture, and formation of contact sites to the
  outer membrane [[cite:PUB00086469],[cite:PUB00086470],[cite:PUB00093460]]. MIC19 plays an important
  role in the maintenance of the MICOS complex stability and the mitochondrial cristae morphology [[cite:PUB00086469]].
