- graph_id: marc-antibiotic-rna-2008
  title: Antibiotic exposure raises steady-state marC RNA
  scope: McDermott2008 AG100 drug-exposed versus untreated cultures, not a MarC efflux or direct transcription
    assay.
  context: 'Original Figure 1 Northern blot: mid-exponential LB cultures, 30 C, one-hour exposure. Separate
    tetracycline and chloramphenicol 5 ug/ml conditions.'
  family_mapping: E. coli K-12 MarC P0AEY1/b1529/JW1522 sequence version 1, 221 aa, PF01914 5-217. This
    is reference mapping, not independent sequencing of historical strains or proof of isolated-domain
    function.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:562
  limitations: The stronger blot signal is not quantified as a fold-change or significance estimate. The
    authors favor mRNA stabilization over true induction; MarR binding and direct transcription are not
    established. Salicylate and marR-inactive comparison are negative in the inspected conditions. Susceptibility
    negatives are retained separately from RNA effects.
