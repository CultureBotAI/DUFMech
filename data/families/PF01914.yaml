description: Integral membrane protein family that includes the protein MarC. MarC was thought to be a
  multiple antibiotic resistance protein. Nevertheless, a study has shown that MarC is not involved in
  multiple antibiotic resistance [[cite:PUB00077123]]. The function of this family is unclear.
