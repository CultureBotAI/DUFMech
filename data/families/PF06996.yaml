description: This is a family of Gram-negative bacterial proteins that form part of the type VI pathogenicity
  secretion system (T6SS), including TssG. TssG is homologues to phage tail proteins and is required for
  proper assembly of the Hcp tube in bacteria [[cite:PUB00077772]].One other member in this family, SciB
  (Q93IT4) from Salmonella enterica, is thought to be involved in virulence [[cite:PUB00011185]].
