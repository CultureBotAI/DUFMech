description: This entry represents the KEN domain found at the N-terminal of Endoplasmic reticulum membrane-associated
  RNA degradation protein (EMARD, also known as C6orf70 in human), which belongs to the HEPN superfamily.
  It carries the characteristic, highly conserved RxxxxHG sequence motif [[cite:PUB00091124]]. This domain
  may be a RNase that is involved in the degradation of rRNAs, mRNAs associated with the endoplasmic reticulum
  membrane. EMARD may play a role in neuronal migration during embryonic development [[cite:PUB00089893]].
