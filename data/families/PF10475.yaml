description: This is a family of vacuolar-sorting proteins 54, from eukaryotes. Along with VPS52 and VPS53
  this forms the Golgi-associated retrograde protein complex GARP [[cite:PUB00090044]]. VPS54 is separated
  into N- and C-terminal regions each of which has a different function. This N-terminal family of is
  important for GARP complex assembly and stability, whereas the C-terminal domain, [pfam:PF07928], brings
  about localisation to an early endocytic compartment [[cite:PUB00109230]].
