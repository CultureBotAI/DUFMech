description: This domain is found in the conserved fungal proteins SPP41 (suppressor of PrP4, there are
  four members, 1 to 4). In S. cerevisiae it is conserved towards the C-terminus of HMG domains. The function
  is not known. However, it has been shown that SPP41 is involved in negative regulation of expression
  of spliceosome components PRP4 and PRP3 and that it relocalizes to the cytosol in response to hypoxia
  [[cite:PUB00098543],[cite:PUB00098542]].
