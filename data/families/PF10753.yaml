description: GhoT is part of the GhoT-GhoS type V toxin-antitoxin (TA) system [[cite:PUB00065335],[cite:PUB00074308]].
  OrtT is homologous to GhoT, but it is not part of a TA pair. In this case, it acts as an independent
  toxin to reduce growth during stress related to amino acid and DNA synthesis [[cite:PUB00074307]].
