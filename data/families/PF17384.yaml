description: This family represents the C-terminal domain from the bacterial ribosome assembly factor
  RimP. In Gram-negative bacteria, RimP knockout causes slow cell growth whereas in Gram-positive Streptococcus
  pneumoniae, the deletion of RimP is lethal. RimP is essential for survival under stress conditions in
  Mycobacterium. RimP is seen in four ribosome assembly states (states A to D) bound on the front of the
  30S subunit [[cite:PUB00164403]]. RimP contains two domains, an N-terminal and a C-terminal domain having
  a Sm-like fold, characteristic of the Sm/Lsm superfamily proteins, connected by an unstructured region
  [[cite:PUB00021814],[cite:PUB00164403]].
