description: Caf4 is a WD40 repeats containing protein involved in mitochondrial fission. It displays
  physical interactions with CCR4-NOT complex [[cite:PUB00053527]]. It has a paralogue, Mdv1. Both Caf4
  and Mdv1 act as adapter proteins, binding to Fis1 on the mitochondrial outer membrane and recruiting
  the dynamin-like GTPase Dnm1 to form mitochondrial fission complexes [[cite:PUB00053320]]. However,
  Fis1 and Caf4, but not Mdv1, determine the polar localization of Dnm1 clusters on the mitochondrial
  surface [[cite:PUB00074937]].
