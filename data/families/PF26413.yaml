description: This entry represents a family of uncharacterised proteins in archaea. The proteins containing
  this domain are predominantly found in the class Halobacteria, which are known for their adaptation
  to high-salt environments. The proteins in this family are typically around 100 to 300 amino acids in
  length. Many of these proteins are predicted to be integral membrane proteins, as suggested by the presence
  of multiple transmembrane helices. The family contains a C-terminal zinc ribbon domain.
