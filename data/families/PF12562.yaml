description: This domain is found at the C-terminal end of Telomere-binding protein I6 from poxvirus,
  I6 binds tightly and with great specificity to the hairpin form of the viral telomeric sequence. This
  protein is thought to play a role in the initiation of vaccinia virus genome replication and/or genome
  encapsidation [[cite:PUB00010106]]. The family is found in association with [pfam:PF04595].
