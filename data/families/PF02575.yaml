description: This is a family of DNA-binding proteins. Members of this family form homodimers which bind
  DNA via a tweezer-like structure [[cite:PUB00026293],[cite:PUB00057452],[cite:PUB00057453]]. The conformation
  of the DNA is changed when bound to these proteins [[cite:PUB00057453]]. In bacteria, these proteins
  may play a role in DNA replication-recovery following DNA damage [[cite:PUB00026293]].
