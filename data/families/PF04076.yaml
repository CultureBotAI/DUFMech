description: Proteins in this family form an OB-fold. Analysis of the predicted binding site of BOF family
  proteins implies that they lack nucleic acid-binding properties [[cite:PUB00016305]]. They contain an
  predicted N-terminal signal peptide which indicates that they localise in the periplasm where they may
  function to bind proteins, small molecules, or other typical OB-fold ligands [[cite:PUB00016305]]. As
  hypothesised for the distantly related OB-fold containing bacterial enterotoxins, the loss of nucleotide-binding
  function and the rapid evolution of the BOF ligand-binding site may be associated with the presence
  of BOF proteins in mobile genetic elements and their potential role in bacterial pathogenicity [[cite:PUB00016305]].
