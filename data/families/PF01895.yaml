description: This family contains phosphate regulatory proteins including PhoU. PhoU proteins are known
  to play a role in the regulation of phosphate uptake. The PhoU domain is composed of a three helix bundle
  [[cite:PUB00031207]]. The PhoU protein contains two copies of this domain. The domain binds to an iron
  cluster via its conserved E/DXXXD motif.
