discussions:
- discussion_id: phou-chemical-and-interface-uncertainty
  prompt: Resolve metal, phosphate and partner-interaction mechanisms without promoting reporter effects
    or models to atomic causal steps.
  kind: CURATION_TODO
  status: OPEN
  rationale: E. coli Mn-probe data and mycobacterial net RegX3 phosphorylation support distinct experimentally
    scoped effects. Neither establishes universal iron occupancy, direct Pi binding, a PhoU phosphatase
    active site, or inhibition of SenX3 autophosphorylation. Whole proteins carry two PF01895 repeats,
    and mutations can affect folding or abundance.
  evidence:
  - reference: PMID:24563032
    supports: PARTIAL
    evidence_source: primary_methods_results_and_original_figures
    explanation: Figure5 probe/dose limits, Figure6 plasmid-versus-integrant distinction and Figure7 qualitative
      fractionation are retained. Unavailable supplementary Mg/SEC curves and the coelution condition
      discrepancy need inspection.
  - reference: PMID:25953406
    supports: PARTIAL
    evidence_source: primary_methods_results_and_original_figures
    explanation: Separate AP, growth and BACTH results prevent a uniform loss-of-function claim. DCA/docking
      remains a hypothesis; Figure5B omits R148E. Figure2 medium discrepancy and exact fusion orientation/dose
      need resolution.
  - reference: PMID:40588129
    supports: PARTIAL
    evidence_source: primary_methods_results_and_original_figures
    explanation: PhoU1/Pi alters net RegX3 phosphorylation without reducing SenX3 autophosphorylation.
      Direct Pi binding, a predicted alpha6 site and the balance of phosphotransfer versus phosphatase
      activities need discriminating biochemical tests.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: Recover supplements, verify constructs and matched protein concentrations, assay occupancy and
    isolated reaction rates, and retain negative/condition-dependent results. Do not draw metal-to-membrane-to-kinase
    arrows by joining distinct assays. Exact references and the access audit are retained under evidence/PF01895.
