description: Queuosine salvage proteins occur in most Eukarya as well as in a few bacteria possible via
  horizontal gene-transfer. Queuosine (Q) is a chemical modification found at the wobble position of tRNAs
  that have GUN anticodons, and it ensures faithful translation of the respective C- and U-ending codons.
  Most bacteria synthesize queuosine de novo, whereas eukaryotes rely solely on salvaging this essential
  component from the environment or the gut flora. This entry represents queuosine salvage proteins (Qng1,
  also known as DUF2419) which have been identified as a queuosine nucleoside glycosylases that play an
  essential role in allowing eukaryotic cells to salvage Q from bacterial sources and to recycle Q from
  endogenous tRNAs [[cite:PUB00075552],[cite:PUB00101386]].
