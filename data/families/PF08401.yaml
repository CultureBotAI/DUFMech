description: This is the ssDNA binding domain of anti-restriction factor ArdC deployed by plasmids and
  phages in polyvalent proteins related to the BHD domains of XPC/Rad4 and the Tc-38 domain found in kinetoplastid
  minicircle binding proteins [[cite:PUB00098071],[cite:PUB00091133],[cite:PUB00098072]]. The structure
  of this domain is composed of three alpha-helices and a three-stranded beta-sheet that supports a long
  and protuberant beta-hairpin [[cite:PUB00098072]]. This domain is also found in the N-terminal region
  of the RP4 TraC1 primase [[cite:PUB00043496]], together with the Toprim domain (pfam:PF01751, pfam:PF13362
  and pfam:PF13662).
