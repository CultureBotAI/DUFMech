description: This entry represents the N-terminal domain of proteins that are highly conserved in species
  ranging from archaea to vertebrates and plants [[cite:PUB00020303]], including several Shwachman-Bodian-Diamond
  syndrome (SBDS) proteins from both mouse and humans. Shwachman-Diamond syndrome is an autosomal recessive
  disorder with clinical features that include pancreatic exocrine insufficiency, haematological dysfunction
  and skeletal abnormalities. It is characterised by bone marrow failure and leukemia predisposition.
  Members of this entry play a role in RNA metabolism [[cite:PUB00020304]][[cite:PUB00020305]]. In yeast
  these proteins have been shown to be critical for the release and recycling of the nucleolar shuttling
  factor Tif6 from pre-60S ribosomes, a key step in 60S maturation and translational activation of ribosomes
  [[cite:PUB00045126]]. This data links defective late 60S subunit maturation to an inherited bone marrow
  failure syndrome associated with leukemia predisposition [[cite:PUB00045126]].
