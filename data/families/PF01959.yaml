- graph_id: methanocaldococcus-joint-pyridine-assays-2004
  title: Separate NAD and NADP joint assays produce the DHQ-derived readout
  scope: Full-length MJ0400 plus MJ1249 preparations assayed together with alternative added pyridine
    nucleotides; not independently sufficient MJ1249, NAD or NADP.
  context: White2004 Table2 rows10/11,125ul with Tris28mM pH7.5, MgCl2 5.6mM, ASA1.6mM and DKFP2.2mM,30min60C.
    The same12.8ug MJ0400 and35.7ug MJ1249 are used. Postreaction NaBH4 converts DHQ to quinic acid, assayed
    by GC-MS with shikimate internal standard. NAD and NADP are tested separately; their individual concentrations
    are not specified in Table2.
  family_mapping: Intact MJ1249/Q58646 v1 contains PF01959 1-173 and PF26558 187-361; MJ0400/Q57843 supplies
    a separate upstream activity. Full-protein and multienzyme context are not transferred to the isolated
    domain or to bacterial GriH.
  taxon: NCBITaxon:243232
  scope_status: MECHANISTIC
  limitations: Qualitative product formation only. The paper reports330nmol for the NAD condition and150nmol
    for NADP, but330nmol exceeds the stated200nmol ASA and275nmol DKFP inputs; absolute yield and stoichiometry
