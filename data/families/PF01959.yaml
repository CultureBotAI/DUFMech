description: This entry represents the N-terminal TIM barrel domain of 3-dehydroquinate synthase II. This
  family includes members of 3-dehydroquinate synthase II ([ec:1.4.1.24]), encoded by aroB genes in M.
  maripaludis which is widely distributed in methanogens. In M. jannaschii, proteins ADTH synthase (AroA)
  and DHQ synthase II (AroB) are required to convert 6-deoxy-5-ketofructose-1-phosphate (DKFP) and aspartate
  semialdehyde to 3-dehydroquinate (DHQ) in vitro [[cite:PUB00109170],[cite:PUB00060486]].
