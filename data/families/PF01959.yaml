causal_graphs:
- graph_id: methanocaldococcus-joint-phosphate-assay-2004
  title: MJ0400 and MJ1249 jointly generate the measured DHQ-related product pool
  scope: Purified full-length Methanocaldococcus jannaschii MJ0400 and MJ1249 expressed separately in
    E. coli BL21-CodonPlus(DE3)-RIL; the causal source is the complete two-enzyme assay, not an isolated
    domain.
  context: White2004 Table2 rows1-3 and Methods p7620; 12.8ug MJ0400 plus35.7ug MJ1249, DKFP1.9mM and
    ASA1.4mM in145ul phosphate9.7mM pH7.2,30min60C under argon. Single-enzyme controls are each below0.012nmol;
    the pair reports7nmol summed DHQ and DHB by derivative GC-MS with quinic-acid internal standard.
  family_mapping: The paper identifies MJ1249 as Q58646; current v1 reference is361aa with PF01959 1-173
    and PF26558 187-361, strain JAL-1/DSM2661/ATCC43067. MJ0400/Q57843 is a separate required assay partner;
    no PF01959 assignment is made for its activity. Historical plasmid sequences were not independently
    reconstructed.
  taxon: NCBITaxon:243232
  scope_status: MECHANISTIC
  limitations: The output sums DHQ and its reported downstream DHB readout, not a pure DHQ yield. No isolated-domain
    sufficiency, cellular essentiality, residue-level chemistry or direct observation of every intermediate
    is established. MJ0400 preparation contained a small chloramphenicol-acetyltransferase contaminant.
    No replicate/error estimates or raw chromatograms were reviewed.
