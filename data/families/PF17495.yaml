description: Family members include OrfA protein, a multifunctional accessory protein found in Feline
  immunodeficiency virus (FIV), a lentivirus that causes AIDS in domestic cats [[cite:PUB00085284]]. Multiple
  potential functions have been ascribed to OrfA, including transactivation of viral protein expression
  [[cite:PUB00085285]], effects on virion formation and infectivity [[cite:PUB00085286]], host cell cycle
  arrest [[cite:PUB00085291]] and downregulation of cell surface expression of the primary FIV receptor,
  CD134 [[cite:PUB00085287]].
