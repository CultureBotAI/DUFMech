description: This domain is found at the C-terminal of bacterial regulatory ATPase RavA (Regulatory ATPase
  variant A) [[cite:PUB00091615],[cite:PUB00097491]] and is the second subdomain that forms the discontinuous
  triple helical domain [[cite:PUB00091615]]. RavA forms an hexamer in which the triple helical domain
  mediates the lateral interactions between neighbouring RavA monomers [[cite:PUB00097491]].
