description: 'Dyp-19, formerly known as DUF2211, is a transmembrane domain family that is required to
  orient the neuroblast cells, QR and QL accurately on the anterior-posterior axis: QL and QR are born
  in the same anterior-posterior position, but polarise and migrate left-right asymmetrically, QL migrating
  towards the posterior and QR migrating towards the anterior. It is also required, with unc-40, to express
  mab-5 correctly in the Q cell descendants [[cite:PUB00044879]]. The Dpy-19 protein derives from the
  C. elegans DUMPY mutant, [swissprot:P34413].'
