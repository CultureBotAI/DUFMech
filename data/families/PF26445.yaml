description: This entry represents a domain from a family of uncharacterised proteins in Halobacteria.
  The proteins containing this domain are predominantly found in various genera within the Haloferacaceae
  family, including Halonotius, Halorubrum, and others. The domain is typically found in proteins ranging
  from approximately 88 to 133 amino acids in length. The reviewed protein D4GXW3 from Haloferax volcanii
  contains this domain. This domain is composed of a four stranded beta sheet with alpha helices packed
  on one side.
