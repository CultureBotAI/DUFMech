description: This entry represents a C-terminal alpha-helical domain of approximately 130 residues. The
  domain is found at the C-terminus of proteins that typically contain an AAA_5 domain ([pfam:PF07728])
  and sometimes an MrcB_N domain ([pfam:PF12102]). These proteins are often annotated as restriction endonucleases
  or dynein-related ATPases. This family is found in bacteria including Bacillota, Pseudomonadota and
  Bacteroidota. The function of this domain remains to be determined.
