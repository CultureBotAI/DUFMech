description: Coenzyme F420 is a hydride carrier cofactor that functions during methanogenesis. This family
  of proteins represents CofC, a nucleotidyl transferase that is involved in coenzyme F420 biosynthesis.
  CofC has been shown to catalyse the formation of lactyl-2-diphospho-5'-guanosine from 2-phospho-L-lactate
  and GTP [[cite:PUB00045885]].
