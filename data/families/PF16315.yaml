  edges:
  - edge_id: btcdh-produces-unsaturated-oligosaccharides
    subject: btcdh-mature-protein-with-gags
    predicate: produces
    object: unsaturated-gag-oligosaccharides
    mechanism: The purified enzyme converts chondroitin sulfate and hyaluronan into unsaturated oligosaccharides,
      which is beta-elimination across the glycosidic bond rather than hydrolysis. Products of hyaluronan
      range from a disaccharide to an octasaccharide and do not change on longer digestion, so they are
      limit products of this enzyme. This is an observed in vitro product measurement on the mature full-length
      protein; it does not localise the chemistry to the DUF4955 domain.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:30262663
      source_url: https://pubmed.ncbi.nlm.nih.gov/30262663/
      snippet: When incubated with HA, BtCDH generated a series of unsaturated HA sugars, including Δ4,5UA-GlcNAc,
        Δ4,5UA-GlcNAc-GlcA-GlcNac, Δ4,5UA-[GlcNAc-GlcA]2-GlcNac, and Δ4,5UA-[GlcNAc-GlcA]3-GlcNac, as
        end products and hence was classed as endo-acting
      explanation: Identifies the products as unsaturated, which is what makes this a lyase rather than
        a hydrolase, and gives their size range. The endo-acting reading of these products is contested
        by the later study and is not asserted by this edge.
      cache_path: evidence/PF16315/ndeh-2018-btcdh-pl29.txt
      cache_sha256: 749f6126e1872b9d74925481139be0612f01a7bb0b178e518ab60d9849bb1b42
    - reference: PMID:32005816
      source_url: https://pubmed.ncbi.nlm.nih.gov/32005816/
      snippet: The surface lyase, BT3328PL29, showed its highest enzymatic activity and affinity against
        CS-A > CS-C > HA and little activity on DS, differing from previous data18.
      explanation: Independent kinetics from a second study ranking the substrates, which is why chondroitin
        sulfate and hyaluronan are retained in the node label and dermatan sulfate is not. The same sentence
        records the disagreement with the earlier report.
      cache_path: evidence/PF16315/ndeh-2020-gag-pul.txt
      cache_sha256: fba6312dd4a63ae05f3f11a55cb264540f99fae9b4a7b22d2e33f75340f42a31
    - reference: https://www.ebi.ac.uk/interpro/api/entry/pfam/PF16315/protein/uniprot/Q8A2H7/
      source_url: https://www.ebi.ac.uk/interpro/api/entry/pfam/PF16315/protein/uniprot/Q8A2H7/
      snippet: 'Q8A2H7 Pfam:PF16315 interval: 716-867, inclusive (InterPro match score 1.3e-69)'
      explanation: Grounds the tested protein on this family and supplies the coordinate limit. Identity
        grounding only; it carries no causal weight.
      cache_path: evidence/PF16315/BtCDH-identity.txt
      cache_sha256: 108683327ecd9bf041a85d31e35a7ff5ee7213fc1a03d83c0466eea9b4317ff6
  - edge_id: btcdh-surface-exposure-enables-extracellular-degradation
    subject: btcdh-on-cell-surface
    predicate: enables
    object: extracellular-cs-degradation
    mechanism: Protease added to intact cells destroys the protein while a periplasmic control enzyme
      survives, and antibody staining of intact cells agrees, so the protein is reachable from outside
      the cell. Whole cells under conditions that limit transport degrade chondroitin sulfate extensively,
      which places cleavage of the polymer outside the outer membrane rather than in the periplasm.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:30262663
      source_url: https://pubmed.ncbi.nlm.nih.gov/30262663/
      snippet: The results showed degradation of BtCDH L and BtCDH H in PK-treated but not control cells
      explanation: Protease accessibility of the protein in intact cells, controlled against a periplasmic
        enzyme in the same extracts, is the primary localisation result. The immunofluorescence confirmation
        is retained in the same extract.
      cache_path: evidence/PF16315/ndeh-2018-btcdh-pl29.txt
      cache_sha256: 749f6126e1872b9d74925481139be0612f01a7bb0b178e518ab60d9849bb1b42
    - reference: PMID:30262663
      source_url: https://pubmed.ncbi.nlm.nih.gov/30262663/
      snippet: The results showed extensive degradation of both CSA and CSC by the WT strain, visible
        as a smear of products
      explanation: Whole-cell assay under transport-limiting conditions, which is what makes the degradation
        extracellular rather than periplasmic.
      cache_path: evidence/PF16315/ndeh-2018-btcdh-pl29.txt
      cache_sha256: 749f6126e1872b9d74925481139be0612f01a7bb0b178e518ab60d9849bb1b42
  - edge_id: btcdh-deletion-decreases-extracellular-degradation
    subject: btcdh-deletion
    predicate: decreases
    object: extracellular-cs-degradation
    mechanism: Cells lacking the gene degrade chondroitin sulfate A much less in the whole-cell assay,
      so this enzyme carries part of the surface activity. Degradation is reduced and not abolished, and
      the authors read the remainder as other surface enzymes, so the step is contributory rather than
      solely attributable to this protein. Growth on the same substrates in pure culture is unaffected,
      which is recorded in the limitations.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:30262663
      source_url: https://pubmed.ncbi.nlm.nih.gov/30262663/
      snippet: This was significantly reduced in the knockout strain especially for the CSA substrate
        in which just a single band of generated product was observed
      explanation: Pairs the deletion strain with wild type in the same surface assay, which is what connects
        the in vitro chemistry to an activity of the living cell surface.
      cache_path: evidence/PF16315/ndeh-2018-btcdh-pl29.txt
      cache_sha256: 749f6126e1872b9d74925481139be0612f01a7bb0b178e518ab60d9849bb1b42
    - reference: PMID:30262663
      source_url: https://pubmed.ncbi.nlm.nih.gov/30262663/
      snippet: We also observed that the absence of BtCDH did not completely prevent extracellular degradation
        of CS in whole-cell assays, suggesting the presence of other unknown surface CS-degrading enzymes.
      explanation: The authors' own limit on the same result, retained so the edge is not read as making
        this enzyme the only surface lyase.
      cache_path: evidence/PF16315/ndeh-2018-btcdh-pl29.txt
      cache_sha256: 749f6126e1872b9d74925481139be0612f01a7bb0b178e518ab60d9849bb1b42
