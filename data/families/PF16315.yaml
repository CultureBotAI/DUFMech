discussions:
- discussion_id: pl29-chemistry-not-yet-assigned-to-duf4955
  prompt: Does the DUF4955 domain carry the PL29 lyase active site, or is it a non-catalytic part of the
    chain?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: The only assayed member of this family is the mature full-length BtCDH, roughly residues
    19-868 of UniProtKB:Q8A2H7. PF16315 covers 716-867, PF16378 covers 25-199, and 200-715 is unassigned
    by Pfam, so more than half the chain lies outside either domain. Nothing published separates them,
    as there is no truncation, domain swap, active-site variant or structure for any family member, and
    the family has no solved structures and no Enzyme Commission number attached to the domain. The reasonable
    readings are that PF16315 is the catalytic domain, that the unassigned region is, or that the active
    site lies at an interface. Settling it needs constructs, not more sequence comparison. Until then
    the lyase chemistry is a property of the protein in this record, not of the domain.
  evidence:
  - reference: PMID:30262663
    supports: PARTIAL
    evidence_source: full_text
    explanation: Supplies the chemistry and the recombinant construct, which is the mature full-length
      protein. It notes the position of the DUF4955 domain at the C terminus but assays no fragment of
      it.
  - reference: https://www.ebi.ac.uk/interpro/api/entry/pfam/PF16315/protein/uniprot/Q8A2H7/
    supports: PARTIAL
    evidence_source: database
    explanation: Gives the domain intervals and the unassigned region between them, which is what makes
      the assignment question concrete. A single API snapshot of current matches; it will drift with releases.
  posed_by: Claude Code
  posed_date: '2026-10-30'
  notes: A structure of any PL29 member, or a DUF4955-only construct, would answer this. The family has
    164 AlphaFold models and no experimental structures; inspecting a model for a lyase fold would be
    a lead rather than an answer.
- discussion_id: duf4988-shared-with-non-catalytic-surface-binding-partner
  prompt: Is the PF16378 (DUF4988) region of BtCDH a catalytic part of the lyase, or a surface module
    shared with non-enzymatic glycan-binding proteins?
  kind: INTERPRETATION
  status: OPEN
  rationale: BtCDH carries PF16378 at 25-199 alongside PF16315. The same family matches the neighbouring
    surface glycan-binding protein BT3329 (UniProtKB:Q8A2H6) at 25-207 with a stronger score, and BT3329
    has no PF16315 and no reported enzyme activity. The second study reports the same overlap as a conserved
    region of about 300 residues shared with binding-protein genes of other utilisation loci. That makes
    a glycan-binding or surface-assembly role the better reading of PF16378 and argues against transferring
    lyase activity to it from this protein. No binding assay has been reported for the region in either
    protein, so this is an architectural argument, not a demonstrated function, and it is recorded here
    rather than as an edge on either family.
  evidence:
  - reference: PMID:32005816
    supports: PARTIAL
    evidence_source: full_text
    explanation: Reports the shared N-terminal region between the lyase and the binding protein, and the
      surface interaction among the three locus proteins. It does not assay the region on its own.
  - reference: https://www.ebi.ac.uk/interpro/api/entry/pfam/PF16378/protein/uniprot/Q8A2H6/
    supports: PARTIAL
    evidence_source: database
    explanation: Shows the same Pfam family on a protein with no lyase domain and no reported activity,
      which is the architectural point. Identity mapping only.
  posed_by: Claude Code
  posed_date: '2026-10-30'
  notes: Bears on PF16378, whose own record is untouched by this overlay. If that family is curated later,
    this is the place to start. Contributed from a KBase gene-annotate dashboard review of an environmental
    B. thetaiotaomicron BtCDH allele (ai4curation/ai-gene-review PR 5758). Imported identity, counters
    and seed classification are unchanged.
causal_graphs:
- graph_id: btcdh-pl29-surface-gag-lyase
  title: The DUF4955 protein BtCDH (BT_3328) is a cell-surface PL29 glycosaminoglycan lyase
  scope: Recombinant BtCDH of Bacteroides thetaiotaomicron VPI-5482 (UniProtKB:Q8A2H7, BT_3328), expressed
    without its N-terminal lipoprotein signal, and the deletion strain lacking the whole BT_3328 open
    reading frame. One tested protein, the founding member of polysaccharide lyase family PL29, not a
    family-wide property of PF16315.
  context: Purified enzyme was incubated with chondroitin sulfate A and C, dermatan sulfate and hyaluronan.
    Activity was followed at 235 nm, which reports the unsaturated uronate formed by beta-elimination,
    and products were analysed by TLC, size-exclusion chromatography and mass spectrometry. Whole wild-type
    and deletion-strain cells were reincubated with chondroitin sulfate under conditions in which transport
    is limited, so only surface activity is seen. Localisation used proteinase K shaving and immunofluorescence
    with antibodies raised against the protein.
  family_mapping: UniProtKB:Q8A2H7 is 868 residues with one Pfam:PF16315 interval at 716-867, inclusive,
    and one Pfam:PF16378 (DUF4988) interval at 25-199. Residues 200-715 carry no Pfam match. Coordinate
    limit, the tested enzyme is the mature full-length protein, roughly residues 19-868, which spans both
    domains and the unassigned region between them. No truncation, domain-deletion or active-site variant
    has been reported, so the measured activity maps to the whole mature protein and not to the PF16315
    interval. Which part of the chain carries the catalytic site is unresolved.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:226186
  limitations: The two studies disagree on dermatan sulfate, degraded in the first and reported as little
    activity in the second, and the second was unable to reproduce the first on this point. Cleavage mode
    is also unsettled, read as endo-acting from the limit products of hyaluronan in the first study and
    as cleavage from the reducing end from labelled oligosaccharides in the second. Deleting the gene
    does not stop growth on any of these substrates in pure culture, so surface cleavage by this enzyme
    is not required for their use, and other surface activity remains in the mutant. Nothing here assigns
    the chemistry to the DUF4955 domain, and no structure or active-site variant exists for any family
    member. The family counters on this record cover 259 proteins, of which one has been assayed.
  nodes:
