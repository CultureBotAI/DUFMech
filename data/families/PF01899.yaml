discussions:
- discussion_id: mrpe-mechanism-and-source-discrepancies
  prompt: Resolve construct and numerical discrepancies before assigning a direct MrpE ion-binding or
    conformational mechanism.
  kind: CURATION_TODO
  status: OPEN
  rationale: T113A changes abundance and complex signals, whereas T113Y and P114G lose much transport
    despite retained detected complexes. These distinct perturbations do not directly observe sodium occupancy
    or the proposed E-G-to-A-D activation step. P114A retains function; whole-gene deletion retains a
    small alkaline-pH response.
  evidence:
  - reference: PMID:18408029
    supports: PARTIAL
    evidence_source: primary_methods_results_and_original_figures
    explanation: Figure5 provides the scoped transport/abundance/complex/kinetic endpoints. The antibody
      peptide discrepancy, unavailable deletion-boundary supplement and intermediate His10 wording need
      resolution; EF468713.1 verifies the final His7 parent.
  - reference: PMID:20624916
    supports: PARTIAL
    evidence_source: primary_methods_results_and_readable_original_table
    explanation: Footnoted T113A/P114G reuse differs from2008 values. P114G growth is positive in Table1
      despite reduced-resistance prose, and T113Y is not below5% WT at pH9. Preserve the discrepancies
      and obtain S2-S6.
  - reference: PMID:32735215
    supports: PARTIAL
    evidence_source: primary_structure_text_and_original_figures
    explanation: Two-TM/cytoplasmic MrpE topology supersedes the earlier prediction. L41W retains a dimer
      peak and salt-growth complementation; its mutant transport kinetics were not displayed. Proposed
      H131/partner-histidine sodium entry is not an observed binding edge.
  - reference: PMID:36241630
    supports: PARTIAL
    evidence_source: primary_methods_results_and_deposited_polymer_sequence
    explanation: The7QRU MrpE sequence differs from the2008 parent at54,62,158. No strong Na/Mg density
      was found by the authors; competing paths and conformational gating remain models. No raw map reanalysis
      was performed.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: Retained source assessments are in evidence/PF01899. Measure ion occupancy and transport under
    matched abundance/assembly conditions before adding molecular edges. Do not replace apparent Km with
    Kd, turn association into activation, or count reused rows as independent experiments.
