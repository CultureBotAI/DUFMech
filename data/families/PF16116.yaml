description: This family consists of uncharacterised proteins around 200 residues in length and is mainly
  found in various Bacteroides and Capnocytophaga species. The function of this family is unknown. Distant
  homology analysis suggests a possible similarity of proteins from this family to TIM barrel glycoside
  hydrolases and, subsequently its involvement in carbohydrate metabolism.The domain lies downstream of
  glycosyl hydrolases 42 suggesting that as a domain it might represent the carbohydrate-binding region
  of the enzyme.
