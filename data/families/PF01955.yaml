  scope: Whole-protein Mm0173 CbiZ expressed in E. coli ER2566, not an isolated PF01955 fragment.
  context: Woodson2004 Methods and Figures5-6; pMmCBIZ5 C-terminal chitin-binding tag cleaved before assay.
    AdoCbi reaction uses 4ug enzyme, 150uM substrate, 100ul, 50mM Na-HEPES pH7.5, 5mM DTT, 37C for2h in
    dim light. DicyanoCbi is a separate reported substrate test.
  family_mapping: Q8Q0G3 v1, 200aa, MM_0173/cbiZ, AAM29869.1; PF01955 residues15-198. Source M. mazei
    Go1/Goe1, taxon192952. Exact historical tag-cleavage scar and clone sequence remain unresolved.
  taxon: NCBITaxon:192952
