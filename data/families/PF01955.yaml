  limitations: HPLC follows cyanide derivatization; MALDI measures a ligand-free species, not intact AdoCby.
    Aminopropanol coproduct was not separately measured. Dicyano-substrate activity is text-reported without
    a separate chromatogram. Printed kinetic rates need protocol reconciliation; no residue-level mechanism
    or family-wide specificity is claimed.
