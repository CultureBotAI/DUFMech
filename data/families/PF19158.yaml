description: This family contains uncharacterised proteins. It also contains the anacyclamide synthesis
  protein AcyE. Cyanobactins are small, cyclic peptides found in cyanobacteria. They are ribosomally synthesised
  and post-translationally modified. Cyanobactin biosynthesis clusters contain 7-12 genes [[cite:PUB00060495]].
  Anaclyclamides are a type of cyanobactin produced in strains of the cyanobacteria Anabaena [[cite:PUB00060495]].
  AcyE is a 49-amino-acid protein with N-terminal homology to the peptide precursor proteins in the other
  cyanobactin pathways [[cite:PUB00094616]]. The core peptide of AcyE is cleaved during post-translational
  processing of the precursor peptide [[cite:PUB00094616]].
