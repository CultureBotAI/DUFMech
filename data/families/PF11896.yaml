description: This entry represents domain N and S of GlgE. GlgE is a homodimer and a member of the GH13_3
  CAZy subfamily. Each subunit of GlgE is composed of five domains, domain A is a (beta/alpha)8 barrel,
  typical of the catalytic domain of this family of enzymes, that forms part of the dimer interface. Domain
  B corresponds to an insertion after the third beta-strand of domain A [[cite:PUB00017702]]. In GlgE,
  domain B is fairly typical for a GH13 enzyme [[cite:PUB00060751]] in having a pair of anti-parallel
  strands and one short helix. The C-terminal domain C has a beta-sandwich fold. The N-terminal domain
  N, which also consists of a beta-sandwich fold, forms the core of the dimer interface. The final domain
  arises from an insertion within domain N and forms a four-helix bundle where the last helix is discontinuous
  and slightly kinked. This domain, which will henceforth be referred to as domain S, participates in
  the dimer interface and interacts directly with domain B of the neighbouring subunit [[cite:PUB00060749]].
