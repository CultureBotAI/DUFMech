description: In eukaryotes this family is predicted to play a role in protein secretion and Golgi organisation
  [[cite:PUB00075420]]. In plants this family includes [swissprot:A9X6Y0], which is involved in water
  permeability in the cuticles of fruit [[cite:PUB00075421]]. [swissprot:P54797] has been found to be
  expressed during early embryogenesis in mice [[cite:PUB00011316]]. This protein contains a conserved
  NRDE motif. This gene has been characterised in Drosophila melanogaster and named as transport and Golgi
  organisation 2, hence the name Tango2.
