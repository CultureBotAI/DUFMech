description: SpoIIM is on e of four stage II sporulation proteins that is necessary for the forespore
  inside the mother-cell to be properly internalised through the breakdown of peptidoglycans trapped between
  the membranes of the septum separating the forespore and the mother-cell. The four proteins working
  in sequence are SpoIIB, [pfam:PF05036], SpoIIM, SpoIIP, [pfam:PF07454], and finally SpoIID, [pfam:PF08486].
  D, M and P are in a complex with each other and the complex assembles in a hierarchical manner such
  that M, which serves as a membrane anchor, recruits P to the septum and P, in turn, recruits D to the
  septum [[cite:PUB00109154]].
