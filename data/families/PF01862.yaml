- graph_id: mjpdad-processing-contribution-hypothesis
  title: Incomplete N47A maturation may contribute to its activity loss
  scope: 'Soriano 2008 Results 3.1-3.3 and Conclusions: proposed interpretation of N47A crystal states
    and separate specific-activity measurements.'
  context: Crystals grown at 295 K with 1-2 mM arginine in PEG2000/MPD/glycerol and HEPES pH 6.7-7.3;
    assay instead at 343 K and pH 6.0. A failed processing comparison at 338 K for 3 h supplied no relative
    WT/mutant rate.
  family_mapping: Intact Q57764/AAB98302.1 N47A, PF01862 19-162; cleavage is between native S52 and S53,
    yielding the S53-derived pyruvoyl group. PDB 2QQD includes processed and unprocessed chains plus residual
    His0. This is not a claim for all PF01862 members.
  scope_status: HYPOTHETICAL
  taxon: NCBITaxon:243232
  limitations: Crystal populations are not assay-solution processing fractions. One N47A site is mixed
    and modeled predominantly processed; four are unprocessed and one clearly processed. N47A local structural
    comparison uses S53A, not WT. Processing-rate comparison was inconclusive, and neither molecular mediation
    nor its quantitative contribution was established.
