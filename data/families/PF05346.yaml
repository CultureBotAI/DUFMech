description: This family is a family of eukaryotic membrane proteins. It was previously annotated as including
  a putative receptor for human cytomegalovirus gH [[cite:PUB00019476]] but this has has since been disputed
  [[cite:PUB00044752]]. Analysis of the mouse Tapt1 protein (transmembrane anterior posterior transformation
  1) has shown it to be involved in patterning of the vertebrate axial skeleton.
