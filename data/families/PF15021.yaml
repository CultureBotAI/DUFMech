description: SHLD1, also known as RINN3, is a component of the shieldin complex, a vertebrate-specific
  protein complex which functions as a downstream effector in the 53BP1 pathway, regulates NHEJ (non-homologous
  end joining) [[cite:PUB00089626],[cite:PUB00154232]]. This entry represents a conserved helical domain
  found at the C-terminal of SHLD1.
