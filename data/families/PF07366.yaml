description: This family includes SnoaL [[cite:PUB00021066]] a polyketide cyclase involved in nogalamycin
  biosynthesis. This family was formerly known as DUF1486. The proteins in this family adopt a distorted
  alpha-beta barrel fold [[cite:PUB00021066]]. Structural data together with site-directed mutagenesis
  experiments have shown that SnoaL has a different mechanism to that of the classical aldolase for catalysing
  intramolecular aldol condensation [[cite:PUB00021066]].
