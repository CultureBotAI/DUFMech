description: 'This group of families is one of several protein families that are always found associated
  with prokaryotic CRISPRs, themselves a family of clustered regularly interspaced short palindromic repeats,
  DNA repeats found in nearly half of all bacterial and archaeal genomes. These DNA repeat regions have
  a remarkably regular structure: unique sequences of constant size, called spacers, sit between each
  pair of repeats [[cite:PUB00020781]]. It has been shown that the CRISPRs are virus-derived sequences
  acquired by the host to enable them to resist viral infection. The Cas proteins from the host use the
  CRISPRs to mediate an antiviral response. After transcription of the CRISPR, a complex of Cas proteins
  termed Cascade cleaves a CRISPR RNA precursor in each repeat and retains the cleavage products containing
  the virus-derived sequence. Assisted by the helicase Cas3, these mature CRISPR RNAs then serve as small
  guide RNAs that enable Cascade to interfere with virus proliferation [[cite:PUB00106643]]. Cas5 contains
  an endonuclease motif, whose inactivation leads to loss of resistance, even in the presence of phage-derived
  spacers [[cite:PUB00109113]]. This family used to be known as DUF73. DevR appears to be negative auto-regulator
  within the system [[cite:PUB00020781]].'
