description: This entry represents the RZ type zinc finger domain, found in NFX1-type zinc finger-containing
  protein 1 (ZNFX1) and E3 ubiquitin-protein ligase RNF213 from humans. It contains two conserved histidine
  residues and four conserved cysteine residues in a CHC3H motif. It can bind divalent transition metals,
  with a preference for Zn2+. ZNFX1 is an RNA-binding protein that initiates the antiviral response and
  is required to restrict the replication of RNA viruses [[cite:PUB00100916],[cite:PUB00100918]]. RNF213
  is a giant E3 ubiquitin ligase that can catalyse ubiquitination of both proteins and lipids, which is
  involved in various processes, such as lipid metabolism, angiogenesis and cell-autonomous immunity.
  It functions as a key immune sensor by catalysing ubiquitination of the lipid A moiety of bacterial
  LPS via its RZ-type zinc-finger and restricts the proliferation of cytosolic bacteria [[cite:PUB00100919],[cite:PUB00100915]].
  RNF213 is a major susceptibility factor of Moyamoya disease [[cite:PUB00100917]].
