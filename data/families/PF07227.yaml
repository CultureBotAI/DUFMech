description: PHD_oberon is a plant homeodomain finger domain of Oberon proteins from plants. Oberon is
  necessary for maintenance and/or establishment of both the shoot and root apical meristems in Arabidopsis.
  Oberon proteins are made up of a PHD finger domain and a coiled-coil domain. The PHD-finger domain is
  found in a wide variety of proteins involved in the regulation of chromatin structure [[cite:PUB00067922]].
  Oberon proteins mediate the TMO7 (the direct target of MP) expression through modification of, or binding
  to, chromatin at the TMO7 locus. TMO7 stands for the target of Monopteros 7 (MP) (or Auxin response
  factor 7) [[cite:PUB00076514]].
