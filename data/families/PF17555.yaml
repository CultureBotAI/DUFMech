description: T6SSs are toxin delivery systems. It is a multiprotein complex requiring numerous core proteins
  (Tss proteins) including cytoplasmic, transmembrane, and outer membrane components. The needle or tube
  apparatus is comprised of a phage-like complex, similar to the T4 contractile bacteriophage tail, which
  is thought to be anchored to the membrane by a trans-envelope complex [[cite:PUB00090998]]. TssN proteins
  have multiple predicted transmembrane (TM) regions. In Flavobacterium johnsoniae, three specific components
  (TssN, TssO and TssP) are absent in the other sub-types of T6SS [[cite:PUB00090999]].
