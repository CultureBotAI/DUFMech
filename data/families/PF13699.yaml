description: This entry represents a domain found in a group of prokaryotic proteins that was previously
  known as DUF4157. This domain has been recently identified as a highly conserved eCIS (extracellular
  Contractile Injection System) core domain [[cite:PUB00154361]]. eCIS is a cell-free toxin-delivery system
  that evolved from a bacteriophage tail and is prevalent in prokaryotes. This eCIS core DUF4157 domain
  contains an HEXXH motif that is characteristic of many families of metallopeptidases and a putative
  metal-binding site for a divalent cation such as zinc. Proteobacterial members of this family are thought
  to be related to the type VI secretion system (T6SS). This region is responsible for the toxicity of
  the protein in the bacterial periplasm [[cite:PUB00100134]]. eCIS-associated toxins carry DUF4157 domains
  in their N-terminus or are found adjacent to genes with this domain [[cite:PUB00154361]]. No peptidase
  activity has been reported for this domain so far.
