description: This is the ATP-binding domain found in proteins that are associated with Bacteriophage Exclusion
  (BREX) system, a defense system that allows bacteriophage adsorption but blocks phage DNA replication
  [[cite:PUB00093365]]. This domain is found in the ATP-binding proteins BrxC/pglY (due to its homology
  with pglY from Pgl system) and BrxD [[cite:PUB00093365]].
