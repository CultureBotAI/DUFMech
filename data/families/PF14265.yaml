description: This entry includes the capsid assembly scaffolding protein Gp46 from Staphylococcus phage
  80alpha, which is involved in icosaedric procapsid assembly. It coassembles with capsid proteins to
  form the procapsid [[cite:PUB00153369]]. The scaffolding protein is found within the capsid as a series
  of concentric shells. During DNA packaging, the scaffolding protein molecules are released from the
  procapsid.
