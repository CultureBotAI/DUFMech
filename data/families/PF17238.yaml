description: This entry represents a helical domain that can be found in NUP160, also known as SAR1, a
  nucleoporin protein in Arabidopsis thaliana. It is a member of the NUP107-160 nuclear pore sub-complex
  [[cite:PUB00085245]]. NUP160 plays a role in normal auxin signalling, which works in synergy with ethylene
  to control various ethylene-dependent phenomena [[cite:PUB00155768]]. Also, it contributes to pathogen
  defense [[cite:PUB00085247]], nucleocytoplasmic mRNA export [[cite:PUB00155768]], and is required for
  disease resistance [[cite:PUB00085246]].
