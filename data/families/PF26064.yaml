description: This entry represents a family of uncharacterised integral membrane proteins found in DNA
  viruses that infect archaea and halobacteria, incuding Matrix protein Halorubrum pleomorphic virus 1
  (VP3). These proteins contain four predicted transmembrane helices. These proteins have a pair of beta
  hairpin structures inserted between the first and second alpha helices. There is some evidence that
  this beta hairpin may mediate a homodimerisation interaction (AlphaFold3 W0JNP7 ipTM=0.7 pTM=0.74).
