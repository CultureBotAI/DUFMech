- graph_id: gnk2-by4741-growth-delay
  title: WT Gnk2 delays BY4741 growth, with attenuation by R93A or soluble mannan
  scope: S. cerevisiae BY4741 exposed to purified mature Ginkgo Gnk2; Miyakawa 2014 Figure 7A, not the
    delta-mnn2 culture or an in-plant infection test.
  context: BY4741 MATa his3delta1 leu2delta0 met15delta0 ura3delta0, potato dextrose broth at 25 C. Transfer
    pre-culture at OD600 1 into fresh medium at OD600 0.01 with 2 uM WT/R93A or no protein. Monitor OD600
    until 2.55. The WT-plus-saccharide arms contain 0.5% w/v yeast mannan or 50 mM D-mannose. Methods
    state two repetitions; Figure 7 shows growth curves without statistical confidence intervals.
  family_mapping: Purified mature A4ZDL6 residues 27-134 plus extra N-terminal Met; current PF01657 36-131
    corresponds to mature 10-105. Mature R93 maps to precursor R119 inside the domain. The yeast is the
    assay organism, not the source of this Ginkgo protein.
  scope_status: PHENOTYPIC
  limitations: Turbidity delay is indirect physiology, not direct cell-wall damage, killing or measured
    spore germination. The Discussion specifies longer lag rather than reduced log-phase growth rate.
    R93A and mannan attenuation are not complete null effects. Saccharide-only controls are not displayed,
    so competitive sequestration is an interpretation, not a uniquely established causal step. Similar
    R93A thermal stability and mannan NMR results are author-reported supplementary controls, not visually
    inspected here.
