    supports: PARTIAL
    evidence_source: full_text_and_visually_inspected_figures_5_7_8
    explanation: Preserve Methods 1.25-20 versus Figure 5 0.625-10 mM mannobiose, small delta-mnn2 and
      R93A residual delays, lack of displayed saccharide-only controls, and separate disc/36-h endpoints.
      Supplementary CD/DSF/NMR controls are author-reported, not independently visually inspected. Historical
      domain 56-108 differs from current mature PF01657 10-105; all three tested residues lie within the
      current interval.
  - reference: PMID:26315821
    supports: PARTIAL
    evidence_source: uniprot_citation_lead_only
