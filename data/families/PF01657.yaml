- discussion_id: pf01657-gnk2-causal-coverage
  prompt: Resolve the SPR dose discrepancy and supplement access, then assess later Gnk2 actin work and
    other DUF26 members without assuming a common mechanism.
  kind: CURATION_TODO
  status: OPEN
  rationale: Four direct binding-assay effects and ten indirect growth effects support a scoped Gnk2 example,
    not a complete binding-to-cell-death trajectory or universal function of PF01657.
  evidence:
