causal_graphs:
- graph_id: gnk2-mannobiose-spr
  title: Gnk2 substitutions reduce alpha1,2-mannobiose binding responses
  scope: Purified mature Ginkgo biloba Gnk2 WT, N11A, R93A and E104A; Miyakawa 2014 Figure 5. Not the
    His-tagged NMR screening construct or a family-wide lectin mechanism.
  context: Mature Ala1-Phe108 plus an extra N-terminal Met, expressed periplasmically in E. coli BL21(DE3)
    using pET26b and pDsbABCD1. Untagged protein purified by SP Sepharose, Mono S and Superdex 75. Immobilize
    from 50 ug/ml acetate pH6 onto a noncarbohydrate GLH chip at approximately 10000 RU; ProteOn XPR36
    running buffer is 10 mM HEPES pH7 and 150 mM NaCl. Methods give analyte 1.25-20 mM, whereas Figure
    5 labels 0.625-10 mM; the twofold discrepancy remains unresolved. Assays described as triplicate.
  family_mapping: A4ZDL6 sequence version 1 is 134 aa; mature 1-108 corresponds to precursor 27-134. UniProt/InterPro
    sequences match, with current PF01657 36-131, or mature 10-105. N11/R93/E104 correspond to precursor
    N37/R119/E130, all within that interval. PDB 4XRE entity 1 exactly matches Met plus the mature reference.
    This is a domain-bearing mature protein, not an isolated Pfam-interval construct.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:3311
  limitations: Responses are directly observed binding-assay effects, not activation of another protein
    or fungal killing. N11A retains visible response; low mutant signals do not establish zero affinity.
    The reported WT KD of 5.9 +/- 0.2 mM is not independently verified, especially given the dose discrepancy.
    The authors report similar mutant CD spectra, but supplementary S5 was not visually accessible here;
    immobilized active fractions and local folding are not independently established. Static mannose contacts
    do not directly observe the mannobiose binding trajectory.
