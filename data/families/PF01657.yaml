description: This domain is often found in association with the kinase domains [pfam:PF00069] or [pfam:PF07714].
  In many proteins it is duplicated. It contains six conserved cysteines which are involved in disulphide
  bridges [[cite:PUB00052808]]. It has a role in salt stress response [[cite:PUB00109166]] and has antifungal
  activity [[cite:PUB00109167]].
