- graph_id: gnk2-mnn2-dependent-growth-response
  title: The delta-mnn2 yeast background strongly attenuates the Gnk2 growth delay
  scope: S. cerevisiae BY4741 and its separately supplied delta-mnn2 variant, each compared with its own
    no-Gnk2 control; Miyakawa 2014 Figure 7A/B.
  context: Potato dextrose broth, 25 C, initial OD600 0.01, 2 uM WT Gnk2, OD600 followed to 2.55. MNN2
    encodes an N-linked-glycan alpha1,2-mannosyltransferase; deletion alters those mannosylated branches,
    not all cell-wall mannan. No MNN2 complementation is shown.
  family_mapping: The applied protein is mature Ginkgo A4ZDL6 plus extra Met, with PF01657 at precursor
    36-131. The genetic perturbation is in the target yeast, not in Gnk2 or its Pfam domain.
  scope_status: PHENOTYPIC
  limitations: The edge compares treatment responses against each strain's own baseline, not simply absolute
    treated-culture growth. Figure 7B has a small residual delay, so the Results' no-influence wording
    is not adopted literally. No rescue or direct glycan occupancy measurement isolates the deleted gene's
    immediate molecular effect. Delta-och1 was too growth impaired to assay and is not evidence of Gnk2
    resistance.
