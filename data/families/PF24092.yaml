description: This domain is found C-terminal in uncharacterised bacterial proteins. It is predicted to
  adopt a seven-stranded antiparallel beta-sheet with similarity to Mog1p/PsbP-like domains. Some proteins
  containing this domain have a lipoprotein attachment motif at the N-terminus suggesting they may be
  associated with the membrane. This domain is usually found in two copies that share little if any sequence
  similarity to each other.
