description: This entry represents the C-terminal alpha helical bundle domain. The eukaryotic GINS complex
  is essential for the initiation and elongation phases of DNA replication [[cite:PUB00012381],[cite:PUB00015004],[cite:PUB00152224]].
  It consists of four paralogous protein subunits (Sld5, Psf1, Psf2 and Psf3), all of which are included
  in this family. The GINS complex is conserved from yeast to humans, and has been shown in human to bind
  directly to DNA primase [[cite:PUB00109209]].
