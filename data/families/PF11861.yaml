description: This domain is functionally uncharacterised and it is found in the central region of fungal
  SPB1 and mammalian homologue FTSJ3. This domain is found associated with [pfam:PF07780], [pfam:PF01728].
  SPB1 is an adoMet-dependent rRNA methyltransferase required for proper assembly of pre-ribosomal particles
  during the biogenesis of the 60S ribosomal subunit [[cite:PUB00016377]]. FTSJ3, SPB1 homologue in humans,
  is associated with NIP7 (involved in the biogenesis of 40S subunit) and functions in pre-rRNA processing
  [[cite:PUB00068805]].
