description: This presumed domain is functionally uncharacterised. This domain family is found in plants,
  and is approximately 120 amino acids in length. It is found in hypothetical UvrD-like Helicases and
  related sequences, all containing a P-loop motif that is characteristic of the AAA superfamily. This
  domain is located towards the N-terminal, adjacent the AAA domain ([pfam:PF13086]). There are two conserved
  motifs, GD and RIW. There is also a highly conserved D residue.
