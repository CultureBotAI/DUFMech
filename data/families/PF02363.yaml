description: This Cysteine repeat C-X3-C-X3-C is repeated in sequences of this family, 34 times in [swissprot:O17970].
  The function of these repeats is unknown as is the function of the proteins in which they occur. Most
  of the sequences in this family are from C. elegans. This motif forms an alpha helix and two tandem
  copies of this repeat associate and likely form a disulphide bonded bihelical structure.
