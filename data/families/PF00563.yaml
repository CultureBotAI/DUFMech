description: This domain is found in diverse bacterial signaling proteins. It is called EAL after its
  conserved residues. The EAL domain is a good candidate for a diguanylate phosphodiesterase function
  [[cite:PUB00007150]]. The domain contains many conserved acidic residues that could participate in metal
  binding and might form the phosphodiesterase active site [[cite:PUB00007150]].
