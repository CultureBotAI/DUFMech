description: This protein is expressed in the tail neuron PVT and in uterine cells in C. elegans [worm-base].
  In Saccharomyces cerevisiae this is AdoMet dependent proline di-methyltransferase. This enzyme catalyses
  the di-methylation of ribosomal proteins Rpl12 and Rps25 at N-terminal proline residues. The methyltransferases
  described here specifically recognise the N-terminal X-Pro-Lys sequence motif, and they may account
  for nearly all previously described eukaryotic protein N-terminal methylation reactions. A number of
  other yeast and human proteins also share the recognition motif and may be similarly modified [[cite:PUB00073462]].
  As with other methyltransferases, this family carries the characteristic GxGxG motif.
