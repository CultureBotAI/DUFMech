description: This is an extracellular domain at the C-terminus of Piezo, or FAM38 mechanosensitive non-specific
  cation channel proteins [[cite:PUB00075636],[cite:PUB00063634]]. Piezo is a family of proteins that
  form mechanosensitive non-specific cation channels whose conductance is higher for Li+, intermediate
  for Na+ and lowest for Li+. Divalent ions except for Mn2+ permeate the channel but more slowly than
  monovalent ions and can reduce K+ currents [[cite:PUB00075636],[cite:PUB00063634],[cite:PUB00155396],[cite:PUB00155399]].
  These channels have a homotrimeric three-blade propeller-shaped structure that use a cap-motion and
  plug-and-latch mechanism to gate their ion-conducting pathways [[cite:PUB00063634],[cite:PUB00155396],[cite:PUB00155399]].
  Each protomer consists of 38 TM helices that form unusual non-planar blades, and an extracellular cap-like
  structure, the latter represented in this entry [[cite:PUB00063634],[cite:PUB00155396],[cite:PUB00155399],[cite:PUB00155398]].
  This domain is embedded in the centre of the trimer and may control the transmembrane constriction site
  suggested to act as a transmembrane gate [[cite:PUB00155398]]. This domain adopts a distinctive beta-sandwich
  fold [[cite:PUB00063634],[cite:PUB00155396],[cite:PUB00155399],[cite:PUB00155397],[cite:PUB00155398]].
