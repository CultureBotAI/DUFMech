  scope: Zhang2022 Figure1C/D, human Memo1 added to preformed Cu(I)-BCA2 under anaerobic conditions.
  context: N2 glovebox stocks; CuCl stock stabilized with ascorbate; BCA to Cu ratio 2.5. Figure1 says
    10 uM Cu; supplementary Methods says 20 uM Cu and 50 uM BCA for Memo1. This discrepancy remains unresolved.
  family_mapping: Human Q9Y316 sequence version1 equals NP_057039.1/NM_015955.5, 297 aa, PF01875 8-291.
    pET28a/BL21(DE3), His-affinity and SEC preparation, Western identity check; exact insert and tag cleavage
    are not independently verified. Whole preparation, not isolated domain.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:9606
  limitations: Decreased chromophore supports competition for Cu(I), not catalysis. Two equal-affinity
    sites and 4e-15 M are model assumptions/estimate; unequal sites remain possible. Do not compare directly
    with glutathione-containing 2024 ITC affinities.
