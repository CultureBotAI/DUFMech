description: Proteins containing this domain include Xenopus laevis Vexin and its human homologue, C8orf46.
  Vexin is transiently expressed in differentiating progenitors in the developing central nervous system
  (CNS) and is required for neurogenesis in the neural plate and retina [[cite:PUB00089657]]. This entry
  corresponds to a presumed SH3 domain.
