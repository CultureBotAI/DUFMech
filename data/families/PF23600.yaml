description: This entry represents the N-terminal domain of CdpA (Cell division protein A, HVO_0739) from
  Haloferax volcanii and similar archaeal proteins. CdpA is a ring assembly and anchor protein. It forms
  part of an anchor complex linked to FtsZ2 and other cell division proteins [[cite:PUB00161026]]. This
  domain, which is predicted to show four transmembrane helices, possibly together with the linker region
  of CdpA, are important for CdpA midcell localisation, FtsZ1 ring condensation, and FtsZ2 ring assembly
  and positioning [[cite:PUB00161026]]. In CdpA and other members of this group, this domain is found
  associated with [pfam:PF23601]. In some other members these domains are associated with repeats of [pfam:PF07411].
  AlphaFold predicts a confident dimeric structure for this domain.
