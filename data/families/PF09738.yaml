description: LRRFIP1 is a transcriptional repressor which preferentially binds to the GC-rich consensus
  sequence (5'- AGCCCCCGGCG-3') and may regulate expression of TNF, EGFR and PDGFA [[cite:PUB00078055]].
  LRRFIP2 may function as activator of the canonical Wnt signalling pathway, in association with DVL3,
  upstream of CTNNB1/beta-catenin [[cite:PUB00078057]].
