description: This family of plant proteins includes RDM1 from Arabidopsis, which is a component of the
  RNA-directed DNA methylation (RdDM) effector complex and may have a role in linking siRNA production
  with pre-existing or de novo cytosine methylation [[cite:PUB00057309]]. As part of the DDR complex with
  two other RdDM components, it has been shown to facilitate association of PolV to chromatin [[cite:PUB00109101],[cite:PUB00096469]].
