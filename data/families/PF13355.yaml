description: This domain corresponds to the C-terminal intermembrane space (IMS) region from protein accumulation
  and replication of chloroplasts 6 (ARC6) and its paralogue PARC6 [[cite:PUB00096838]]. ARC6 and PARC6
  are components of the plastid division machinery which are essential for the chloroplast replication
  process [[cite:PUB00096838],[cite:PUB00096839]], which implies the assembly and constriction of the
  tubulin-like FtsZ ring on the stromal surface of the inner envelope membrane (IEM) and the dynamin-like
  ARC5 ring on the cytosolic surface of the outer envelope membrane (OEM). ARC6 is evolutionarily related
  to the cyanobacterial cell division protein Ftn2/ZipN [[cite:PUB00096838]], having similar structures.
  This domain from ARC6 and PARC6 interacts with PDV2 and PDV1 respectively. PDV proteins recruit dynamin-like
  ARC5 ring to the chloroplast surface and mediates its constriction. ARC6/PARC6 are key to connect and
  coordinate Fst and ARC5 rings during fission [[cite:PUB00096837],[cite:PUB00096840]].
