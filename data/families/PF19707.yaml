description: This entry represents a member of a biosynthetic gene cluster (BGC). This BGC (BGC0001070)
  is described by MIBiG as an example of the following biosynthetic classes, NRP (non-ribosomal peptide)
  and polyketide. It includes a member from the kirromycin biosynthetic gene cluster from Streptomyces
  collinus Tu 365 [[cite:PUB00098988],[cite:PUB00098989]]. This family appears to be predominantly found
  in Actinobacteria.
