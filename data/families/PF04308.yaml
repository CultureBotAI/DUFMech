description: RNaseH_like is a family of uncharacterised eubacterial proteins that are distant homologues
  of Ribonuclease H-like. The family maintains all the core secondary structure elements of the RNase
  H-like fold and shares several conserved, presumably active site residues with RNase HI. This finding
  suggests that it functions as a nuclease [[cite:PUB00020735]].
