description: This domain, previously known as DUF7643, is found N-terminal in the tail-associated lysin
  (Tal, gp59) and related sequences from phages and bacteriophages. gp59 is comprising the tip of the
  phage tail. The domain represented by this entry is one of the two tail tube domains (TT1 and TT2) that
  form a quasi-sixfold adapter to the distal tail protein (Dit, gp58) hexamer [[cite:PUB00156034]]. These
  two domains merge into a continuous eight-stranded beta-sheet on one side.
