description: This glycosyltransferase domain is found at the N-terminal end of Inner membrane protein
  STM0557 from Salmonella typhimurium ([swissprot:Q8ZR61]) and in similar sequences mainly found in bacteria.
  STM0557 is involved in the the addition of glucose to the galactose moiety of the S.Typhimurium O-antigen
  via an alpha 1-4 linkage [[cite:PUB00163180],[cite:PUB00163181]]. This domain is predicted to show an
  all-alpha configuration with several transmembrane helices. There is a conserved NYL sequence motif.
  It was previously known as DUF6056.
