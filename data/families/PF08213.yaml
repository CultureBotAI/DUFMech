description: This domain of unknown function is found at the C terminal end of Mitochondrial small ribosomal
  subunit protein mS38, also known as Mitochondrial mRNA-processing protein COX24 in yeast which is involved
  in the splicing of the COX1 mRNA [[cite:PUB00076420]]. COX24 is a component of the mitochondrial ribosome
  (mitoribosome), responsible for the synthesis of mitochondrial genome-encoded proteins, including at
  least some of the essential transmembrane subunits of the mitochondrial respiratory chain. The mitoribosomes
  are attached to the mitochondrial inner membrane and translation products are cotranslationally integrated
  into the membrane [[cite:PUB00089004],[cite:PUB00098057]]. This domain is also found in COX24 mammalian
  homologue Aurora kinase A-interacting protein [[cite:PUB00078824]]. This entry also includes uncharacterised
  proteins from bacteria.
