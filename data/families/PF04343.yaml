description: This entry has been described to include subclades of DUF488 domains (namely DUF488-s, for
  DUF488-short subclade, DUF488-l for long subclade and DUF488-u for DUF488-standalone subclade) which
  all which contain the ancestral core of the domain. DUF488-s commonly pairs with the DUF488-l subclade
  on the genome. In the case of DUF488-l and DUF488-u, the core domain is followed by a single beta-strand
  that stacks at the C-terminus of the core beta-sheet and a multi-helical 'cap' [[cite:PUB00153826]].
  Unlike the DUF488-s and DUF488-l subclades, DUF488-u is not found adjacent to other DUF488 subclades
  on the genome [[cite:PUB00153826]].
