description: This family consists of several bacterial and archaeal proteins of around 200 residues in
  length. The function of this family is unknown. The family carries a repeated glycine-zipper sequence-
  motif, GxxxGxxxG, where the x following the G is frequently found to be an alanine. As glycine-zippers
  occur in membrane proteins, this family is likely to be found spanning a membrane.
