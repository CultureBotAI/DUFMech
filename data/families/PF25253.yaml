description: This entry represents the N-terminal domain found in DUF7855 family proteins found in halobacteria.
  This domain is predicted to mediate dimerisation as well as DNA-binding. This domain belongs to the
  dimeric alpha/beta barrel superfamily. There is a notable pocket in each subunit beneath the DNA-binding
  interface that might might to a small molecule to regulate DNA-binding. The protein A0A371M7Z4 appears
  to bind to the DNA sequence GAGGTTACCTGGGCCAGGTAACCTC (pTM-0.9 iPTM=0.89).
