description: This family has been characterised as 3-octaprenyl-4- hydroxybenzoate carboxy-lyase enzymes
  [[cite:PUB00020511]]. This enzyme catalyses the third reaction in ubiquinone biosynthesis. For optimal
  activity the carboxy-lase was shown to require Mn2+ [[cite:PUB00020511]]. This entry represents the
  central RIFT-related domain.
