- graph_id: anfdc-crystal-photoisomerization-2018
  title: UV exposure produces ketimine-containing AnFdc crystal states
  scope: Whole AnFdc WT and E282Q crystals prepared in darkness; molecular-state changes, separate from
    solution activity assays.
  context: Dark-purified/crystallized protein compared with UV-exposed crystals. Structures resolve iminium
    versus ketimine-containing states; WT ketimine persists after return to darkness.
  family_mapping: A2QHE5 version 1, PF01977 119-318; E282 is internal. The complete enzyme has additional
    Pfam domains; no isolated-domain photochemistry is tested.
  taxon: NCBITaxon:425011
  scope_status: MECHANISTIC
  limitations: Structural occupancy is not complete quantitative solution conversion. E282Q also contains
    hydroxylated cofactor; its ketimine occupancy is below 50 percent. Specific internal/external proton-transfer
    mechanisms remain proposed.
