- graph_id: anfdc-cinnamate-decarboxylation-2015
  title: AnFdc converts cinnamic acid to styrene
  scope: Purified full-length Aspergillus niger Fdc1 coexpressed with E. coli UbiX; a whole-enzyme reaction,
    not an isolated-domain assay.
  context: Recombinant AnFdc from E. coli BL21(DE3), with bound prFMN; 350 uL, 50 mM KCl and 50 mM sodium
    phosphate pH 6, 25 C. Cinnamic acid disappearance and styrene-assigned UV appearance are followed
    over time.
  family_mapping: A2QHE5 sequence 1/entry 95 is the 500-aa An03g06590 reference. PF01977 maps to 119-318;
    PF20695 to 14-103 and PF20696 to 324-460. Deposited 4ZA4 equals the reference plus LEHHHHHH. See evidence/PF01977/member-mapping.txt.
  taxon: NCBITaxon:425011
  scope_status: MECHANISTIC
  limitations: Does not measure native fungal flux, isolated-domain sufficiency or the complete atomistic
    trajectory. UbiX supplies cofactor and is not assigned this decarboxylation. Reference taxonomy is
    not the expression host.
