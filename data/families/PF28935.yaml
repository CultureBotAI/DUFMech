description: This domain is found in uncharacterised proteins mainly from gram negative bacteria which
  are probably related to the RND tripartite drug efflux pumps. The domain represented in this entry folds
  into a six-stranded closed beta-barrel with a greek-key topology which has a structural similarity to
  the C-terminal domain of alanine racemase. This domain is interrupted by the barrel-sandwich hybrid
  domain which is inserted after the first beta-strand of the barrel. This model does not include the
  N-terminal strand.
