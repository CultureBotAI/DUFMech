description: This protein family includes PII-interacting protein X (PipX) from Synechococcus elongatus
  and similar proteins found in cyanobacteria. PipX modulates the expression of genes involved in nitrogen
  assimilation by interacting with the global nitrogen transcription factor NtcA and the signal transduction
  protein PII. It is involved in several regulatory pathways [[cite:PUB00100697]]. The crystal structure
  of this protein shows a tudor-like domain (TLD), formed by a highly bent beta-sheet that mediates the
  interactions with both PII and NtcA, and two C-terminal helices [[cite:PUB00054483]].
