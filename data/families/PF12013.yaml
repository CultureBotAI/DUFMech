description: This family of proteins is functionally uncharacterised. This protein is found in eukaryotes.
  Proteins in this family are typically between 247 to 1018 amino acids in length. Family members include
  orsellinic acid/F9775 biosynthesis cluster protein D (orsD) from Emericella nidulans. The orsD gene
  is part of the cluster that encodes components for the biosynthesis of orsellinic acid, as well as biosynthesis
  of the cathepsin K inhibitors F9775 A and F9775 B [[cite:PUB00083127]] [[cite:PUB00083128]], but the
  function of orsD is unknown. OrsD contains two segments that are likely to be C2H2 zinc binding domains.
