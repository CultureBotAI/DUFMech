description: This family consists of several bacterial ThuA-like proteins. ThuA appears to be involved
  in utilisation of trehalose [[cite:PUB00013786]]. The thuA and thuB genes form part of the trehalose/sucrose
  transport operon thuEFGKAB, which is located on the pSymB megaplasmid. The thuA and thuB genes are induced
  in vitro by trehalose but not by sucrose and the extent of its induction depends on the concentration
  of trehalose available in the medium [[cite:PUB00109706]]. ThuA is involved in the conversion of of
  disaccharides to their respective 3-keto derivatives [[cite:PUB00076441]].
