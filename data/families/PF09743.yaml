description: The ubiquitin fold modifier 1 (Ufm1) is the most recently discovered ubiquitin-like modifier
  whose conjugation (ufmylation) system is conserved in multicellular organisms. Ufm1 is known to covalently
  attach with cellular protein(s) via a specific E1-activating enzyme (Uba5), an E2-conjugating enzyme
  (Ufc1), and a E3-ligating enzyme [[cite:PUB00054168]].
