description: This entry represents a conserved region found in Phosphatidate phosphatase APP1 from yeast,
  which contains the catalytic motif DXDX(T/V) [[cite:PUB00071676],[cite:PUB00098278]], present in other
  Mg+2-dependent phosphatases. This domain has a weak sequence similarity to the haloacid dehalogenase-like
  domain [[cite:PUB00071676]]. APP1 catalyses the dephosphorylation of phosphatidate to yield diacylglycerol
  and may play a role in vesicular trafficking through its phosphatidate phosphatase activity at cortical
  actin patches [[cite:PUB00071676],[cite:PUB00098278]].
