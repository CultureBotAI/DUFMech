description: These probable extra-cytoplasmic solute receptors are strongly overrepresented in several
  beta-proteobacteria [[cite:PUB00019234]]. This family, formerly known as Bug - Bordetella uptake gene
  (bug) product - is a family of bacterial tripartite tricarboxylate receptors of the extracytoplasmic
  solute binding receptor-dependent transporter group of families, distinct from the ABC and TRAP-T families
  [[cite:PUB00106922]]. The TctABC system has been characterised in S. typhimurium [[cite:PUB00106923]],
  and TctC is the extracytoplasmic tricarboxylate-binding receptor which binds the transporters TctA and
  TctB, two integral membrane proteins. Complete three-component systems are found only in bacteria [[cite:PUB00106923]].
