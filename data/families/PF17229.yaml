description: This entry represents the N-terminal disordered region of SMG1, which is a member of the
  phosphoinositide 3 kinase-like kinase (PIKK) family. SMG1 associates with components of the mRNA surveillance
  complex and is involved in the regulation of nonsense-mediated mRNA decay [[cite:PUB00085231]]. It also
  plays an important role in genotoxic stress responses to DNA damage [[cite:PUB00085233]].
