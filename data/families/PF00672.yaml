- graph_id: tsr-g235p-soft-agar-chemotaxis
  title: Tsr G235P loses the WT soft-agar chemotactic response
  scope: pRR53 Tsr-G235P versus WT pRR53 and pRR48 vector control in adaptation-proficient UU1250. The
    soft-agar response is a separate experiment from tethered-cell rotation.
  context: Fresh transformant colonies toothpick-inoculated on tryptone soft agar containing 50 ug/mL
    ampicillin, incubated at 32.5 C for 8 h, as in Figure 2. pRR53 is IPTG-inducible and 100 uM is the
    reported optimal WT screening level; the photographed plate caption does not independently specify
    its IPTG dose.
  family_mapping: Full-length Tsr corresponds to P02942, sequence version 2, 551 residues, with G235 inside
    PF00672 at 217-263. The study verifies mutant coding sequences; the native strain background and the
    current K-12 reference are kept distinct.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: Colony morphology and expansion are a chemotaxis readout, not a purified serine-binding
    measurement or a measured growth rate. G235P retains approximately WT steady-state rotation and spreads
    more than the nonreversing vector control. Thus loss of this response does not establish immobility
    or a simple lack of kinase activity. No exact colony radius or statistical effect size is inferred
    from the image.
