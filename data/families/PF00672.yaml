- graph_id: tsr-g235c-adaptation-defective-rotation
  title: Tsr G235C reduces clockwise rotation in adaptation-defective cells
  scope: Full-length pRR53 Tsr-G235C compared with WT Tsr in RP437-derived UU1535, which lacks the MCP
    receptors and the CheR/CheB adaptation enzymes. This is distinct from the UU1250 G235E comparison.
  context: Unstimulated antibody-tethered cells with unmodified Tsr retaining the QEQE major-site pattern.
    Figure 4 scores 100 cells into five rotation categories; the CW-time estimate is a weighted sum, not
    a direct kinase measurement. Exact tethering induction, temperature and buffer remain unspecified
    in the inspected 2008 Methods.
  family_mapping: P02942 Tsr, K-12 reference taxon 83333, 551 residues, sequence version 2, has PF00672
    at 217-263. Reference G235 matches the mutated connector position. Current UniProt and InterPro sequences
    agree; exact complete experimental plasmid sequence was not independently reconstructed.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: CCW is the default motor direction, so low CW output may reflect defective receptor-complex
    assembly rather than a specific native kinase-off conformation. The at-most-15% classification is
    not an exact per-mutant estimate or a universal zero. Expression controls do not prove local folding,
    and dominant heterodimer behavior is not a rescue of this rotation endpoint.
