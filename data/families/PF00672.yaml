discussions:
- discussion_id: tsr-hamp-molecular-output-and-context-coverage
  prompt: Resolve HAMP molecular output states and extend beyond the three scoped Tsr mutant phenotypes.
  kind: CURATION_TODO
  status: OPEN
  rationale: Motor rotation and soft-agar chemotaxis are different cellular readouts. Neither establishes
    a specific HAMP packing geometry, direct phosphorylation step or universal need for HAMP in kinase
    activation. Host adaptation state materially changes WT output.
  evidence:
  - reference: PMID:18621896
    supports: PARTIAL
    evidence_source: full_text
    explanation: Methods, Table 1, Figures 2/4 and relevant Results support the three scoped effects.
      Coding-sequence checks and abundance controls do not eliminate local structural or complex-assembly
      alternatives; tethering conditions and broader mutant coverage remain incomplete.
  - reference: PMID:24205875
    supports: PARTIAL
    evidence_source: selected_full_text
    explanation: The later Tsr deletion study distinguishes physiological and nonphysiological output
      states and discusses competing structural interpretations. Its deletion results are not transferred
      to G235 substitutions, and no packing-model arrow is promoted to an observed mechanism.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: Retrieve exact tethering conditions and independent rescue or direct kinase/assembly measurements
    for these variants. Curate other Tsr mutants, HAMP-containing proteins and deletion contexts separately
    with primary evidence. The 2002 cited behavioral weighting method was inspected; unrelated crosslinking
    conditions were not borrowed. Raw movies and later-study figures/supplements were not reanalyzed.
    Family status remains IN_PROGRESS.
causal_graphs:
- graph_id: tsr-g235e-adaptation-proficient-rotation
  title: Tsr G235E increases clockwise rotation in adaptation-proficient cells
  scope: Full-length pRR53 Tsr-G235E compared with WT pRR53 Tsr in E. coli K-12 RP437-derived UU1250,
    lacking all five MCP receptors but retaining CheR/CheB. Not an isolated HAMP-domain or purified kinase
    assay.
  context: Antibody-tethered cells under unstimulated steady-state conditions; Figure 4 displays 100 cells
    per strain and mutant. The five rotation categories are converted to an estimated fraction of CW time
    using weights 0, 0.25, 0.5, 0.75 and 1. This is not simply a percentage of CW cells. pRR53 is IPTG-controlled;
    exact tethering induction, temperature and buffer are not restated in the 2008 Methods, and soft-agar
    conditions are not transferred.
  family_mapping: UniProtKB:P02942, tsr/cheD, b4355/JW4318, is a 551-residue K-12 reference, taxon 83333,
    sequence version 2. UniProt and InterPro sequences agree exactly; PF00672 maps at 217-263 inclusive,
    containing G235. The study sequenced the entire mutant tsr coding region. Reference mapping does not
    imply the RP437-derived assay hosts are MG1655 or that the complete plasmid junctions were independently
    verified.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: The CW-locked class is a cellular reporter category, not direct measurement of CheA phosphorylation
    or a particular HAMP packing state. The greater-than-75% threshold is not an exact G235E value. Protein
    abundance of at least 50% WT was established in UU1535 for the relevant mutant set, not as a folding
    assay in UU1250. No raw movies, independent-replicate count or clean restoration of this endpoint
    is established here.
