description: The Tail Tip Fiber Protein family includes proteins involved in the attachment and penetration
  of bacteriophages into host cells. Members of this family are responsible for recognizing and irreversibly
  binding to specific host receptors, which triggers structural changes in the viral tail necessary for
  the injection of viral DNA into the host. This process is critical for the successful infection and
  propagation of the virus. The family includes proteins that initiate distal tail tip assembly during
  phage tail assembly and play a key role in the virus entry by mediating the attachment to the host receptor
  and inducing DNA ejection through the receptor's pore. This entry represents the beta prism domain which
  is formed from a homotrimeric complex of members of this family.
