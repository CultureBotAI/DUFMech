description: This entry represents the C-terminal domain of mitochondrial D-glutamate cyclase, which converts
  D-glutamate to 5-oxo-D-proline [[cite:PUB00086027]]. This is a conserved domain also found in uncharacterised
  proteins from bacteria and archaea. Structural studies of the hypothetical protein TON_0340 from Thermococcus
  onnurineus revealed an active-site cavity harbouring a metal-binding site containing six invariant aspartate
  and glutamate residues that adopts an alpha/beta-structure [[cite:PUB00151593]]. Biochemical and mutational
  analysis show that TON_0340 is a Mn+2-dependent phosphatase [[cite:PUB00151593]].
