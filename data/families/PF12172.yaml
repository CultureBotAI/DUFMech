description: 'This domain is found at the C-terminal end of the probable enoyl -CoA hydratase alpha subunit
  from Thermomonospora curvata (ChsH2) and similar archaeal and bacterial proteins. ChsH2 is likely to
  be involved in bile acid degradation. The C-terminal region of this protein is organised into two domains:
  an N-terminal zinc finger domain with a three-stranded antiparallel beta-sheet and an N-terminal alpha-helix
  (this entry) and a OB-fold domain ([pfam:PF01796]) [[cite:PUB00155451]]. The domain is duplicated in
  some members like [swissprot:O53566] from M.tuberculosis. The structure of [swissprot:Q97WQ4] from Saccharolobus
  solfataricus reveals two long N-terminal helices followed by a rubredoxin -like zinc ribbon domain represented
  in this family and a C-terminal OB fold domain [[cite:PUB00097287]]. Zinc is chelated by the four conserved
  cysteines in the alignment.'
