description: This family includes members such as low psii accumulation1 (lpa1) from plants as well as
  Rep27 proteins found in unicellular green alga Chlamydomonas reinhardtii. The Arabidopsis LPA1 is a
  chaperone required for efficient photosystem II (PSII) assembly. It binds to psbA during de novo biogenesis
  of PSII [[cite:PUB00086019]]. Other studies show that REP27 in Chlamydomonas reinhardtii chloroplast
  thylakoids, plays a dual role in the regulation of D1 protein turnover by facilitating cotranslational
  biosynthesis insertion (C-terminal domain) and activation (tetratricopeptide repeat [TPR] motifs) of
  the nascent D1 during the PSII repair process [[cite:PUB00138194]].
