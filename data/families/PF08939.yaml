description: This domain is found in Basophilic leukemia-expressed protein Bles03 from humans (also known
  as UPF0696 protein C11orf68, [swissprot:Q9H3H3]) and various proteins from eukaryotes, bacteria and
  archaea. Bles03 has been suggested to have phosphothreonine lyase activity and to play a role in the
  biosynthesis of dehydro amino acids [[cite:PUB00039014]]. It shows a two-layer sandwich architecture
  with a a nine-stranded beta-sheet and three alpha-helices on each side [[cite:PUB00100679]].
