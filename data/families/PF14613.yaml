description: This is a domain found at the C-terminal end of the putative cell signalling protein HAM1
  from Cryptococcus neoformans and similar fungal sequences. HAM1 may act as a negative regulator of mating
  during vegetative growth [[cite:PUB00110896]]. Proteins with this domain often also contain an N-terminal
  domain [pfam:PF19343]. The member [swissprot:Q7SB48], named HAM-13, is thought to associate with MAPKs
  and to be required for proper cell communication but it is also possible to be involved in other processes
  such as cell signalling or trafficking [[cite:PUB00110895]].
