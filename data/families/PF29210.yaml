description: This entry represents a C-terminal domain of approximately 40 residues found in anti-sigma
  factor antagonist proteins from spirochaetes, predominantly from Treponema and Leptospira species. The
  domain contains conserved cysteine residues in a CPIC...CSEC motif, suggesting potential metal binding.
  Anti-sigma factor antagonist proteins regulate sigma factor activity in bacterial stress responses.
  The protein TP0233 from Treponema pallidum has been shown to interact with flagellar motor components
  [[cite:PUB00163734]]. The specific function of this domain remains to be determined.
