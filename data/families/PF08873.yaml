description: This family is represented by Bacteriophage Mu, Gp37 (also known as Probable tail terminator
  protein) which may stop tail tube polymerization by capping the rapidly polymerising tail tube once
  it has reached its requisite length and prevent its depolymerization [[cite:PUB00052083]]. This family
  also has prophages matches, such as the Gp37 protein from the FluMu prophage.
