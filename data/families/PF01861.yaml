- graph_id: tkbpsa-donor-incubation-peptide
  title: Donor-incubated Tk-BpsA yields a mass-shifted terminal peptide
  scope: Hidese 2019 LC-MS/MS Results and Figure 5 caption; tryptic analysis of the intact Tk-BpsA/dcSAM
    preparation without polyamine acceptor.
  context: 100 uM protein plus 1 mM dcSAM, 50 mM PIPES-NaOH pH 7.6, 80 C for 30 min; nonreducing SDS/PAGE,
    in-gel trypsin and Orbitrap analysis. Iodoacetamide alkylation omitted to avoid a near-isobaric modification.
    10 mM dcSAM instead caused aggregation.
  family_mapping: Q5JIZ3/BAD85880.1 terminal peptide 331-351 is GFEDEITVGQELYDDEESSTT; PF01861 is 106-350,
    so the peptide includes one extra-domain terminal residue. Five acidic-site labels in the paper conflict
    with this sequence; possible reference sites are E341/D344/D345/E346/E347.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:69014
  limitations: Observed mass-shifted species, not uniquely localized occupancy, demonstrated ester chemistry
    or productive carrier turnover. No donor-free MS comparison was established in the inspected text,
    so no quantified donor-dependent increase is claimed. Missing single-adduct and D159/D160 signals
    are detection-limited negatives. Raw spectra and original figure images were not independently inspected.
