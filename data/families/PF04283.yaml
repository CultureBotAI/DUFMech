description: This is a family of proteins that are archaea-specific components of the bacterial-like chemotaxis
  signal transduction system of archaea. In H. salinarum, the CheF proteins interact with the chemotaxis
  proteins CheY, CheD and CheC2 as well as the flagella-accessory proteins FlaCE and FlaD, and are essential
  for any tactic response. CheF probably functions at the interface between the bacterial-like chemotaxis
  signal transduction system and the archaeal flagellar apparatus. This region is predicted to contain
  a tandem of two PH-like domains.
