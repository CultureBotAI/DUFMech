description: This family is found to carry modified motifs characteristic of PD-(D/E)XK endonuclease superfamily.
  These are the conserved Glu of motif I, the Asp surreounded by hydrophobics of motif II, EIKS of motif
  III, and the lysine of mmotif IV has migrated to an alpha-helix following the third core beta-strand.
  The conserved patch of positively charged lysine and arginine residues in the motif IV apha-helix might
  be involved in substrate-binding or be contributing to active site formation [[cite:PUB00044133]]. Members
  with an additional N-terminal coi9led-coil domain, are annotated as tropomyosin, coiled-coil or microtubule
  binding proteins [[cite:PUB00016549],[cite:PUB00044133]].
