description: Members of this family act as galactosyltransferases, belonging to glycosyltransferase family
  92 [[cite:PUB00075505],[cite:PUB00075506],[cite:PUB00075507]]. The aligned region contains several conserved
  cysteine residues and several charged residues that may be catalytic residues. This is supported by
  the inclusion of this family in the GT-A glycosyl transferase superfamily.
