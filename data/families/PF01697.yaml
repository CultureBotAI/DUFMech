discussions:
- discussion_id: galt1-purified-enzyme-and-family-coverage
  prompt: Resolve GALT-1 assay and construct gaps, and extend GT92 member coverage independently.
  kind: CURATION_TODO
  status: OPEN
  rationale: Eight graphs retain fifteen observed effects across crude-extract biochemistry, two genetic
    backgrounds, joint-construct rescue and a selected glycan fraction. Neither the full protein's isolated
    PF01697 domain nor every GT92 member has a resolved causal mechanism.
  evidence:
  - reference: PMID:19858195
    supports: PARTIAL
    evidence_source: inspected_primary_html_and_main_figures
    explanation: Product, donor, acceptor, metal and rescue comparisons are supported, but the printed
      MES/metal units, historical clone and supplemental beta1,4 analysis need further inspection. All
      biochemical assays use raw Sf9 extract.
  - reference: PMID:20062796
    supports: PARTIAL
    evidence_source: inspected_primary_full_text_figures_and_supplement
    explanation: The pmk-1 phenotype and selected glycan deficit are supported with exon2 allele mapping
      and peak structural analysis. Lectin staining used fut-8 and cannot be transferred to galt-1.
  notes: Verify 2009 supplemental primers/S3 and assay units using an accessible primary copy; current
    PMC PDF returned HTML, publisher403 and ETH429. Distinguish exact long NP_504545.2 mapping from unverified
    historical clones, putative DXD chemistry from residue tests, and apparent crude-extract Km from intrinsic
    constants. Inspect purified enzyme, other alleles and matched glycome rescue when available. Pigeon
    PMID19959475 and Populus GalS1 PMID36849618 are unintegrated family leads; do not transfer nematode
    core-fucose specificity to plant galactan extension/capping. Status remains IN_PROGRESS with partial
    scientific self-review, not family completion.
  posed_by: Codex
  posed_date: '2026-10-11'
