- graph_id: galt1-free-glycan-metal-comparisons
  title: Metal and EDTA substitutions alter the radiolabel readout
  scope: Titz 2009 Figure 5B, raw GALT-1 expression extract, free GnGnF6 glycan and UDP-[14C]Gal; not
    the peptide assays or 12-h TLC comparison.
  context: Standard 2-h room-temperature reaction with 40 uM free acceptor, 1 mM UDP-Gal at 28.5 mCi/mmol,
    0.5 ul extract in 2.5 ul. Neutral products counted after AG1-X8 removal of charged donor. MnCl2 is
    replaced by equal nominal concentrations of metal chloride, water or Na2EDTA; HTML prints 10 uM metal
    and 40 uM MES, unresolved.
  family_mapping: The extract contains whole C. elegans GALT-1/O16374-associated protein, PF01697 189-394
    in a 425-aa reference. Altering the reaction environment is not residue-specific evidence for D289/D291
    coordination.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:6239
  limitations: Readout is product-associated neutral-fraction radioactivity, with possible hydrolysis
    background. Water-added extract retains residual cofactors and is not metal-free. Three to seven independent
    experiments with SD do not establish a significant Mn/Fe/Co ranking, an exclusive Mn requirement or
    a purified-enzyme metal-binding mechanism.
