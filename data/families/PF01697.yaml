- graph_id: galt1-extract-core-galactosylation
  title: GALT-1 expression extract supports core-fucose-associated galactosylation
  scope: Titz 2009 Figure 2, untagged full-coding-region C. elegans GALT-1 expressed in Sf9 cells; raw
    postnuclear extract, not purified protein or isolated domain.
  context: Joint reaction of 0.5 ul extract, 1 mM UDP-Gal and 40 uM dabsyl-GEN[GnGnF6]R in 2.5 ul, MES
    pH6.5 with MnCl2, 2 h at room temperature. HTML prints MES 40 uM and MnCl2 10 uM; those unusual units
    remain unresolved, not silently corrected to mM.
  family_mapping: GALT-1/M03F8.4 maps to O16374, 425 aa, current PF01697 189-394. Historical NP_504545.2
    matches the reference and predates the study; the complete experimental clone is not independently
    verified. N-terminal membrane/glycosylation regions extend outside the domain.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:6239
  limitations: DIRECT describes the joint biochemical preparation-to-product observation, not autonomous
    purified GALT-1 chemistry. Figure 2B's caption reverses the displayed precursor order; use parent
    masses. The exact beta1,4 assignment additionally cites uninspected 2009 supplement S3. No elementary
    catalytic steps or family-wide substrate specificity are established.
