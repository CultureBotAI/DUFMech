    GALT-1 expression extract.
  context: 0.5 ul raw extract, 1 mM UDP-Gal, 40 uM supplied glycopeptide, 2 h at room temperature in 2.5
    ul MES pH6.5/MnCl2. Compare each indicated replacement with its named parent substrate; printed buffer/metal
    units remain unresolved.
