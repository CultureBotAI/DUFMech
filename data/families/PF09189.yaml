description: This entry represents an archaeal MoaD-like domain with a ubiquitin-like fold found in various
  archaebacterial proteins. These proteins have a highly conserved Gly-Gly motif at their C-terminus,
  a hallmark of the MoaD/ThiS/ubiquitin superfamily [[cite:PUB00011756],[cite:PUB00035630]]. The bacterial
  MoaD protein functions as a sulfur carrier in molybdenum cofactor (Moco) biosynthesis, with the C-terminal
  Gly-Gly motif being essential for activation by the MoeB enzyme. After activation, MoaD receives a sulfur
  atom to form a thiocarboxylate intermediate that acts as a sulfur donor. Based on the conserved Gly-Gly
  motif and association with ThiS genes and MoaB-like proteins, these archaeal proteins likely function
  as sulfur carriers in cofactor biosynthesis pathways, similar to their bacterial counterparts.
