description: Prolamin_like (in which DUF784 and DUF1278 have been merged) is found to be expressed in
  the plant embryo sac and to be regulated by the Myb98 transcription factor. Computational analysis has
  revealed that members are homologous to the plant prolamin superfamily (Protease inhibitor-seed storage-LTP
  family, [pfam:PF00234]) [[cite:PUB00057502]]. In contrast to typical prolamin members that have eight
  conserved Cys residues forming four pairs of disulfide bonds, this domain contains only six conserved
  Cys residues that may form three pairs of disulfide bonds. The domain may have a potential function
  in lipid transfer or protection during plant embryo sac development and reproduction [[cite:PUB00057503]].
