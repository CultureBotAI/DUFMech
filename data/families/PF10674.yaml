description: 'Ycf54 is found encoded in the chloroplast genomes of algae, also found in plants and cyanobacteria.
  It is a component of the MgPME-cyclase complex and plays two roles: first, it plays a critical role
  in the assembly/stability of the Mg-cyclase complex and its constituents; secondly, it is required for
  normal Pchlide formation [[cite:PUB00151582],[cite:PUB00097432]]. This protein is required for optimal
  MgPME-cyclase activity, although it is not absolutely essential.'
