description: Lysozymes are ancient and important components of the innate immune system of animals that
  hydrolyse peptidoglycan, the major bacterial cell wall polymer. Various mechanisms have evolved by which
  bacteria can evade this bactericidal enzyme, one being the production of lysozyme inhibitors. MliC (membrane
  bound lysozyme inhibitor of c-type lysozyme) of E. coli and Pseudomonas aeruginosa, possess lysozyme
  inhibitory activity and confer increased lysozyme tolerance upon expression in E. coli [[cite:PUB00054072]].
  Structural analyses show that the invariant loop of MliC plays a crucial role in the inhibition of the
  lysozyme by its insertion into the active site cleft of the lysozyme, where the loop forms hydrogen
  and ionic bonds with the catalytic residues [[cite:PUB00051886]].
