description: This domain is found in the Telomerase protein component 1 (TEP1) and it contains an homology
  region to the telomerase associated protein from Tetrahymena p80 [[cite:PUB00099027]]. TEP1 is a component
  of the telomerase ribonucleoprotein complex and is thought to be responsible for catalysing the addition
  of new telomeres to chromosomes. TEP1 is also a component of the vault particle, a cytoplasmic ribonucleoprotein
  complex, in which it is required for vault RNA stability and its association with the vault particle
  [[cite:PUB00035328]]. This domain is localised between the TROVE ([pfam:PF05731]) and DUF4062 ([pfam:PF13271])
  domains.
