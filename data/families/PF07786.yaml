description: This entry includes the catalytic domain of HGSNAT (Heparan-alpha-glucosaminide N-acetyltransferase).
  It contains the conserved histidine in the active site (His269), thought to hold the acetyl group during
  the transfer across the membrane and required for its enzymatic activity. HGSNAT transfers an acetyl
  group from cytoplasmically derived acetyl-CoA to terminal N-glucosamine residues of heparan sulfate
  within the lysosomes [[cite:PUB00090705]].
