description: 'This domain (previously known as DUF3324) is found in WxL interacting proteins (WxLIP) which
  play a role in virulence and are widely distributed in firmicutes. The WxL proteins usually occur within
  a gene cluster that contains two WxL proteins and a WxL interacting protein composed of three domains:
  peptidoglycan binding domain (PGBD), host binding domain (HBD), and transmembrane helix (TMH). The domain
  represented by this entry is likely to interact with proteins on the surface of eukaryotic host endothelial
  cells. This HBD domain is frequently found in combination with PGBD domain ([pfam:PF06030]) and both
  were shown to function synergistically as a single unit that binds to the peptidoglycan and interacts
  with the eukaryotic host [[cite:PUB00154331]]. The HBD domain is predicted to adopt a beta-sandwich
  with an Ig-like topology.'
