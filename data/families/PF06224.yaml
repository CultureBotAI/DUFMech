description: This protein family includes DNA glycosylase AlkZ from Streptomyces sahachiroi (also known
  as Azi36) and similar proteins predominantly found in bacteria. AlkZ is an enzyme that provides self-resistance
  from azinomycin B (AZB) toxicity by unhooking interstrand cross- links (ICLs). The crystal structure
  of AlkZ revealed a C-shaped configuration with three tandem winged helix-turn-helix (wHTH) motifs and
  a positively charged surface that shows residues of great importance for the enzymatic activity [[cite:PUB00100682]].
