  posed_by: Codex
  posed_date: '2026-10-12'
  notes: PF01923 is former DUF80, currently Cob_adeno_trans/IPR016030. Separate PduO, EutT and MMAB experimental
    systems must not be joined into one observed chain. The active SePduO1-185 construct includes flanking
    sequence; SeEutT H67/C79/C80/C83 and LrPduO F187/tail183-188 fall outside their PF01923 matches. Historical
    tags and clone endpoints remain qualified. No-added-metal SePduO retains activity; Zn-loaded SeEutT
    resists the oxidation that disables Fe-loaded protein; LmEutT has no demonstrated transition-metal
    requirement but still uses MgATP. LmEutT accepts cob(I)inamide but not cob(II)inamide with the tested
    biological reducing systems. Human MMAB ADP supports bound product in FigureS1 without sustained release;
    AMP spectra cannot distinguish absent binding from unchanged coordination. These negatives do not
    generalize across all members. Retain Johnson2001 dose-unit conflicts; Johnson2004 1-193/1-293 label
    and PPPi percentage discrepancy; Mera2009 reduction versus adenosylation-lag wording; Moore2014 C83A
    zinc, extinction units, reconstitution ratio and arabinose concentration conflicts; Costa2018 supplement
    numbering and catalytic-efficiency arithmetic; Gouda2023 ATP-caption versus ADP-methods discrepancy.
    No silent source corrections. Gouda2023 ADP single-turnover spectra are retained in the ledger; the
    specific panel's reductant details require further verification before a graph is added.
