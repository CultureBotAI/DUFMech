description: Cobalamin adenosyltransferase This family contains the gene products of PduO and EutT which
  are both cobalamin adenosyltransferases. PduO is a protein with ATP:cob(I)alamin adenosyltransferase
  activity. The main role of this protein is the conversion of inactive cobalamins to AdoCbl for 1,2-propanediol
  degradation [[cite:PUB00013593]].The EutT enzyme appears to be an adenosyl transferase, converting CNB12
  to AdoB12 [[cite:PUB00009955]].
