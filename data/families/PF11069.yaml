description: This is a eukaryotic family of proteins which includes a group of cilia- and flagella-associated
  protein, including Kur from zebrafish and C21orf59 from humans. Kur has been shown to play a dual role
  in cilia motility and polarization [[cite:PUB00089805]]. Primary ciliary dyskinesia (PCD) is caused
  when defects of motile cilia lead to chronic airway infections, male infertility, and situs abnormalities.
  Mutations in the C21orf59 gene cause ciliary dyskinesia, primary, 26 (CILD26) [[cite:PUB00089729]].
