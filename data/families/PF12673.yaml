description: This is the SPOCS domain found in three copies in SipL from C. difficile, N-terminal to the
  LysM domain ([pfam:PF01476]) [[cite:PUB00101296]]. SipL (for SpoIVA-interacting protein) is involved
  in coat localization, and, together with SpoIVA, is a critical spore morphogenetic protein [[cite:PUB00101297]].
