description: This entry, previously known as UPF0016, represents the budding yeast Divalent cation/proton
  antiporter GDT1 and its homologue, the human TMEM165 that are functionally related and form a new group
  of Golgi-localised cation/Ca(2+) exchangers. Budding yeast GDT1 is a Golgi-localised calcium transporter
  required for stress-induced calcium signalling and protein glycosylation [[cite:PUB00079030]]. TMEM165,
  also a Golgi protein, transports Ca2+ and Mn2+, which are both required for proper protein glycosylation
  in cells [[cite:PUB00079031],[cite:PUB00152812]]. Most members of the family contain two copies of a
  region that contains an EXGD motif. Each of these regions contains three predicted transmembrane regions.
