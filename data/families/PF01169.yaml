- graph_id: gdt1-dml1-ph-dependent-cation-uptake
  title: Higher external pH increases calcium and manganese uptake readouts
  scope: Separate Fura-2 calcium and manganese assays in GDT1-expressing DML1 cells, comparing pH 8.0
    with 6.8 in Figure 3. DIRECT describes the gradient intervention on the transport readout, not exclusive
    attribution to purified Gdt1.
  context: Load 10 uM Fura-2/AM with 1.7 mM probenecid for 2 h at 28 C. Wash in 100 mM KCl, 1 mM MgCl2,
    1 mM EGTA and 50 mM Tris at the chosen pH; resuspend in corresponding EGTA-free, calcium-sponge-treated
    buffer. Add 25 uM CaCl2 or, separately, 10 uM MnCl2. Measure Ca-associated 340/380 ratio or Mn-associated
    360-nm quenching, with 510-nm emission; N=3 biological replicates.
  family_mapping: Yeast P38301-associated GDT1 expressed from pNZ8048 in DML1; both PF01169 repeats, 42-127
    and 193-277, belong to the tested protein. Exact 2023 clone/junction sequence is not independently
    resolved.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:4932
  limitations: Empty-vector controls lack pH dependence; 0.5 ug/ml nigericin added 2 min before cations
    removes significant between-pH differences without abolishing uptake. Neither every adjacent pH comparison
    nor an absolute transport stoichiometry is established. Fura-2 reports accumulation-associated fluorescence,
    not single-channel current. Exact recording temperature and membrane orientation remain unverified;
    28 C is explicitly the loading temperature.
