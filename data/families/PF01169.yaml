- graph_id: gdt1-yeast-glucose-pulse-ph
  title: GDT1 deletion changes compartment pH after glucose re-addition
  scope: BY4742-derived gdt1::KanMX4 versus WT in Figure 6, with separate cytosolic and Golgi pH-probe
    cultures. This is whole-gene physiology, not an isolated repeat or directly measured reverse transport.
  context: Low-fluorescence defined medium with 50 mM MES pH 5.0. Wash three times, deprive glucose for
    60 min at 28 C, record 2 min baseline and add glucose to 2%. Compare cytosolic pH at +120 s (N=3)
    and Golgi pH at +720 s (N=5). Yeast pHluorin readout uses the cited 400/480-nm excitation, 507-nm
    emission protocol, distinct from bacterial sfpHluorin.
  family_mapping: Native S. cerevisiae GDT1/YBR187W, represented by P38301 and its two PF01169 repeats,
    is deleted as a whole gene. BY4742 is distinct from the S288c reference annotation; full strain resequencing
    is not claimed.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:4932
  limitations: Cytosolic final pH at +720 s is not different; steady-state Figure 5 shows no significant
    GDT1-deletion pH effect. The +120 s Golgi comparison is borderline and not an adopted edge. Calcium
    signaling and other pumps can mediate the effects; no Figure 6 complementation or simultaneous ion-gradient
    measurements establish the proposed reverse-transport model.
