- graph_id: gdt1-dml1-alkaline-pulse
  title: GDT1 expression increases the alkaline-pulse pH response
  scope: Yeast GDT1 expressed with sfpHluorin in Lactococcus lactis DML1, compared with the sensor-only
    control in Deschamps 2023 Figure 2A. This is a whole-cell response, not an isolated transporter assay.
  context: Two-hour nisin induction; 2 ml cells at OD600 10 in 100 mM KCl, 1 mM EGTA, 1 mM MgCl2 and 20
    mM MOPS pH 7.4, 28 C, 300-rpm stirring. Pre-treat control with 10 mM HCl for 4 min to match initial
    intracellular pH, then add 20 mM NaOH to control or 10 mM to GDT1 cells. Blank-corrected 390/470-nm
    sfpHluorin ratio, emission 507 nm; N=5-7 biological replicates.
  family_mapping: P38301/GDT1_YEAST is the 280-aa S288c reference, sequence version 1, with PF01169 repeats
    at 42-127 and 193-277. UniProt and InterPro sequences match. The 2023 operon has a reported silent
    NcoI-site change; full clone/junction sequences are unresolved. DML1 is the expression host, not the
    Gdt1 source species.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:4932
  limitations: Directness is UNRESOLVED for expression-to-pH attribution because endogenous transport
    or altered membrane integrity can contribute. Counterion experiments support the exchange model but
    do not measure single-protein stoichiometry or orientation. Figure 1's calibration caption says digitonin
    while Methods and supplement S1 specify nigericin. The distinct tagged delta23 construct from 2016
    is not silently assigned to this experiment.
