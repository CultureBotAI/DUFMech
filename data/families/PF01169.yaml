  scope: DML1 expressing GDT1 alone versus empty vector in Figure 4A/B. No intracellular pH sensor is
    used in this experiment.
  context: 100 OD600 units of induced cells washed twice in 50 mM Tris pH 7 and once in 1 mM Tris pH 7,
    resuspended in 20 ml weak buffer. After 2 min baseline add 20 mM CaCl2; pH-meter recording with stirring.
    Compare acidification slopes during recording minutes 5-10; N=3-7 biological replicates for slope
    comparisons.
  family_mapping: P38301-associated yeast GDT1 expressed via the 2023 SphI/HindIII pNZ8048 construct.
    Both PF01169 repeats map to the reference; exact cloned termini remain unresolved.
