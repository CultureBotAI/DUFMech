  taxon: NCBITaxon:4932
  limitations: The immediate salt-associated pH drop occurs in both strains and is not the GDT1-specific
    endpoint. Whole-cell net acidification does not isolate protein-specific H+ transport, buffering,
    metabolism or membrane leakage, so directness remains UNRESOLVED. Temperature, exact clone and transport
    stoichiometry are open.
