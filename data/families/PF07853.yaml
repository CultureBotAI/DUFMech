description: This domain is found in proteins expressed by bacterial or archaeal species. Some of these
  are annotated as being transmembrane proteins, and in fact many of these sequences contain a high proportion
  of hydrophobic residues. One protein containing this domain is immunity protein SdpI (swiss:O32241)
  from Bacillus subtilis, which provides protection for the cell against the toxic effects of its own
  SdpC killing factor, and also functions as a receptor/signal transduction protein [[cite:PUB00055038]].
