description: This domain is found in uncharacterised fungal proteins. It is predicted to fold into an
  alpha/beta structure composed of a four-stranded antiparallel beta-sheet packed on both sides with alpha-helices.
  It also contains a long alpha-hairpin, stabilised by conserved interactions, which is inserted after
  the first strand and may be functionally important. In addition, it contains a highly conserved KTGYx(5-6)[FW]DLD
  sequence motif which may constitute a part of a binding interface.
