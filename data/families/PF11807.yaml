description: Oxidase ustYa is involved in the production of ustiloxins, toxic cyclic peptides, in fungi.
  Ustiloxins were found to be the first example of cyclic peptidyl secondary metabolites that are ribosomally
  synthesized in filamentous fungi. The homologous genes ustYa and ustYb (which are found in the gene
  cluster for ustiloxins) have been shown to be involved in cyclization of the peptide.
