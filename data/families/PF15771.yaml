description: Interactor of HORMAD1 protein 1 (IHO1, previously known as coiled-coil domain-containing
  protein 36 or DUF4700) is required for DNA double-strand breaks (DSBs) formation in unsynapsed regions
  during meiotic recombination. It is thought to function, in collaboration with SPO11-auxiliary proteins
  MEI4 and REC114, through the formation of DSB-promoting recombinosomes on chromatin at the onset of
  meiosis [[cite:PUB00083216]].
