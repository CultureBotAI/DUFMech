description: This domain is found in E3 ubiquitin-protein ligases TTC3 and DZIP3 and its function is unknown.
  TTC3 mediates ubiquitination and degradation of phosphorylated Akt, apparently its preferable target
  [[cite:PUB00094613]]. DZIP3 is also able to bind RNA through a Lys-rich region which enhances is ubiquitination
  activity. It is suggested that RNA-binding proteins or ribonucleoprotein particles might be physiological
  targets for this enzyme, which could be important during viral infections, especially for those replicating
  through RNA intermediates [[cite:PUB00077706]]. This domain is also found in uncharacterised proteins
  found in viruses.
