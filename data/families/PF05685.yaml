description: This entry includes a group of putative nuclease, including hypothetical protein TT1808 (also
  known as Uma2 or TTHA1514), an AT-rich DNA-binding protein from Thermus thermophilus. This domain has
  a 3-layer alpha/beta/alpha topology similar to that found in restriction endonucleases [[cite:PUB00035698]].
  The nuclease domain is ubiquitously found in enzymes involved in metabolism of nucleic acids, mostly
  in nucleases with diverse biological functions [[cite:PUB00035699]].
