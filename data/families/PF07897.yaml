description: The EAR motif is the ethylene-responsive element binding factor-associated amphiphilic repression
  motif. This motif binds to the Groucho/Tup1-type co-repressor TOPLESS (TPL) and TPL-related proteins.
  The motif is frequently to be find at the N-terminus of NINJA, or Novel INteractor of JAZ, proteins
  [[cite:PUB00066523]]. The EAR motif, defined by the consensus sequence patterns of either LxLxL or DLN
  xxP, is the most predominant form of transcriptional repression motif so far identified in plants. It
  is highly conserved in transcriptional regulators that are known to function as negative regulators
  in a broad range of developmental and physiological processes across evolutionarily diverse plant species
  [[cite:PUB00075457]]. This family is closely related to family AUX_IAA Pam:PF02309 which also has an
  LxLxL signature.
