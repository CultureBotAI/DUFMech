description: This entry represents a domain found in the YozE-like family. YozE-like is a family of Firmicute
  proteins that carries a four-helix motif similar to sterile alpha motif (SAM) domains. The family is
  suggested to fall into two subfamilies, possibly with differing functions based on the different surface
  charges on the three structural representatives, YozE MW0776 and MW1311. What this function is is not
  yet known although it is likely to involve binding to DNA [[cite:PUB00075372]].
