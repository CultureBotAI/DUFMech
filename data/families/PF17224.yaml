description: This small family of proteins found in Clostridiales is functionally uncharacterized. Proteins
  in this family are around 130 amino acids in length. Based on NMR structure 2MCA, it forms a beta-sandwich
  structure consisting of two 4-stranded antiparallel b-strands. The structure is very similar to glutamine
  glutamyltransferases (1l9n) and peptide transporters (5a9h).
