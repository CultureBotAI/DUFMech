description: This entry includes budding yeast steryl acetyl hydrolase 1 (Say1) and fission yeast Mug180.
  Say1 is a a membrane-anchored deacetylase required for the deacetylation of acetylated sterols. It is
  involved in the resistance to eugenol and pregnenolone toxicity [[cite:PUB00054134]]. Mug180 has a role
  in meiosis [[cite:PUB00044889]].
