description: This family includes a range of acyltransferase enzymes. This domain is found in a wide range
  of acyltransferase enzymes, including, mainly, bacterial proteins which catalyse the transfer of acyl
  groups, other than amino-acyl, from one compound to another, such as Glucans biosynthesis protein C
  (OPGC) or protein OatA from Listeria monocytogenes serovar 1/2a and Staphylococcus aureus, an integral
  membrane protein which is responsible for O-acetylation at the C6-hydroxyl group of N-acetylmuramyl
  residues, forming the corresponding N,6-O-diacetylmuramic acid of the peptidoglycan, a modification
  that determines lysozyme resistance [[cite:PUB00097284],[cite:PUB00097283]]. This domain is also present
  in eukaryotic proteins, namely O-acyltransferase like protein (OACYL) from mouse and RHY1 (Regulator
  of hypoxia-inducible factor 1) [[cite:PUB00097285]] and NRF6 (Nose resistant to fluoxetine protein 6)
  from Caenorhabditis elegans [[cite:PUB00097286]].
