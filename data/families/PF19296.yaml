description: This entry represents the alpha helical (AH) domain found in RelA/SpoT proteins, adjacent
  to the ACT domain [[cite:PUB00095792],[cite:PUB00098872]]. The AH domain interacts with A/R tRNA and
  links the very C-terminal subdomains with TGS domain. RelA/SpoT-homologue proteins (RHS) mediate the
  stringent response in bacteria which enables its metabolic adaptation under stress conditions. These
  enzymes synthesise the second messenger (p)ppGpp, which is a regulatory metabolite of the stringent
  response characterised by growth arrest and the modulation of gene expression in response to various
  nutritional stresses [[cite:PUB00095792],[cite:PUB00098872],[cite:PUB00059269]].
