description: This entry represents an uncharacterised bacterial protein domain. This domain is found in
  single domain proteins as well as in large multidomain proteins that contain immunity related domains.
  This suggests that this family may play a role in a toxin/antitoxin system. The domain contains two
  structural sites that contain two conserved histidines and an aspartate that may be functionally important.
