description: This family includes mitochondrial pyruvate carrier proteins, such as Mpc 1/2 and their homologues.
  They mediate the uptake of pyruvate into mitochondria [[cite:PUB00066748]]. In humans, Mpc1 and Mpc2
  associate to form an ~150-kilodalton complex in the inner mitochondrial membrane [[cite:PUB00066748]].
  MPC1 contains two predicted transmembrane regions. MPC2 contains three predicted transmembrane regions.
  Several studies have demonstrated MPC involvement in the control of cell fate in cancer and gluconeogenesis
  in models of type 2 diabetes [[cite:PUB00136144]].
