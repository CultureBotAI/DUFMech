description: This entry represents the VPS13 adaptor binding (VAB) domain, previously known as SHR-BD,
  found in vacuolar protein sorting-associated protein 13 (VPS13) [[cite:PUB00100501]]. Proteins containing
  this domain are involved in vesicle fusion, autophagy, and actin regulation [[cite:PUB00100501]] and,
  through membrane-specific adaptor proteins such as Ypt35, Spo71 and the mitochondrial membrane protein
  Mcp1, VPS13 proteins are recruited to different membranes. This domain interacts with Ypt35 which recruits
  VPS13 to endosomal and vacuolar membranes, and with Mcp1 to target VPS13 at mitochondria. Defects in
  the human protein VPS13A cause chorea-acanthocytosis, an autosomal recessive neurodegenerative disorder
  [[cite:PUB00100501],[cite:PUB00016718]]. In plants, this domain is found to be the region which interacts
  with SHR or the SHORT-ROOT transcription factor, a regulator of root-growth and asymmetric cell division
  that separates ground tissue into endodermis and cortex. The plant protein containing the SHR-BD is
  named SHRUBBY or SHBY UniProt:Q9FT44 [[cite:PUB00100502]].
