- graph_id: rida-retained-ilve-activity
  title: RidA increases retained IlvE activity in an IlvA and serine mixture
  scope: The Salmonella RidA comparison in the 2013 Figure 1B radioactive IlvE assay. Other species' homologs
    and cellular extracts are not this graph.
  context: 50 mM potassium phosphate pH 9, 50 uM PLP, 12.5 mM 2-ketoglutarate, 0.75 ug IlvE, 10 ug IlvA,
    50 mM serine and 16 ug RidA where indicated. Methods list these mixtures preincubated 2 h at 37 C,
    then 5 mM radiolabeled isoleucine (20 nCi) for 15 min at 37 C. TLC-resolved 2-keto-3-methylvalerate
    reports IlvE specific activity. Two replicates with ranges, independently repeated at least twice.
