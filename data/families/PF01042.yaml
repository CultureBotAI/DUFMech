description: Endoribonuclease active on single-stranded mRNA. Inhibits protein synthesis by cleavage of
  mRNA [[cite:PUB00007949]]. Previously thought to inhibit protein synthesis initiation [[cite:PUB00002939]].
  This protein may also be involved in the regulation of purine biosynthesis [[cite:PUB00007948]]. YjgF
  (renamed RidA) family members are enamine/imine deaminases. They hydrolyze reactive intermediates released
  by PLP-dependent enzymes, including threonine dehydratase [[cite:PUB00064878]]. YjgF also prevents inhibition
  of transaminase B (IlvE) in Salmonella [[cite:PUB00109184]].
