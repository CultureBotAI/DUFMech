description: Members of this family are small hypothetical proteins of 60 to 100 residues from Cyanobacteria
  and some Proteobacteria. Prochlorococcus marinus strains have two members, other species one only. Interestingly,
  of the eight most conserved residues, four are aromatic and three are invariant tryptophans. It appears
  all species that encode this protein can synthesise tryptophan de novo.
