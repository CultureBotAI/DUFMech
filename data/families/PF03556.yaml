description: This domain binds to cullins and to Rbx-1, components of an E3 ubiquitin ligase complex for
  neddylation [[cite:PUB00047735],[cite:PUB00050725],[cite:PUB00057468]]. Neddylation is the process by
  which the C-terminal glycine of the ubiquitin-like protein Nedd8 is covalently linked to lysine residues
  in a protein through an isopeptide bond. The structure of this domain is composed entirely of alpha
  helices [[cite:PUB00047735],[cite:PUB00050725]].
