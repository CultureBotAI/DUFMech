description: This model describes the N-terminal domain of a group of mostly uncharacterised proteins,
  including 5-methylcytosine-specific restriction enzyme B (also known as MrcB) from E. coli. MrcB recognises
  N4- and C5-methylcytosine (and 5-hydroxy-methylcytosines) produced by a broad range of DNA methylases
  and appears to act against 5-methylcytosine preceded by a purine residue [[cite:PUB00070724]]. The N-terminal
  domain of MrcB has been shown to be a DNA-binding domain, and the crystal structure has been solved
  [[cite:PUB00100346]].
