description: This domain is found in bacteria, archaea and eukaryotes, and is approximately 50 amino acids
  in length. It contains an evolutionary conserved signature W-X-Y-X6-11-GPF-X4-M-X2-W-X3-GYF, the site
  of interaction with proline-rich peptides. Family members include RME-8 (Required for receptor-mediated
  endocytosis 8), a DNAJC13 protein. RME-8 was first identified as a protein that is required for endocytosis
  in Caenorhabditis elegans. It coordinates the activity of the WASH complex with the function of the
  retromer SNX dimer to control endosomal tubulation [[cite:PUB00091010]]. Family members found in Arabidopsis
  include Arabidopsis trithorax-related3 (Atxr3), also known as set domain group 2 (Sdg2). It is the major
  enzyme responsible for H3K4me3 in Arabidopsis and SDG2-dependent H3K4m3 is critical for regulating gene
  expression and plant development [[cite:PUB00085381]]. Another family member found in Arabidopsis is
  Tic56. It is an essential subunit of a 1-MDa protein complex at the inner chloroplast envelope membrane
  [[cite:PUB00091011]]. Furthermore, Tic56 is important for rRNA processing and chloroplast ribosome assembly
  [[cite:PUB00091012]].
