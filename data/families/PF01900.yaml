description: tRNA processing enzyme ribonuclease P (RNase P) is a ubiquitous ribozyme that catalyzes a
  Mg2-dependent hydrolysis to remove the 5'-leader sequence of precursor tRNA (pre-tRNA). Archaeal and
  eukaryotic RNase P consist of a single RNA and archaeal RNase P has four or five proteins, while eukaryotic
  RNase P consists of 9 or 10 proteins [[cite:PUB00007201]]. Human RNase P is composed of a singular protein
  Pop1 and three subcomplexes, the Rpp20-Rpp25 heterodimer, Pop5-Rpp14- (Rpp30)2-Rpp40 heteropentamer,
  and Rpp21-Rpp29-Rpp38 heterotrimer. This family includes Rnp2 (also known as Pop5) from archaea [[cite:PUB00097410]]
  and Pop5/Rpp14 from eukaryotes [[cite:PUB00100655],[cite:PUB00097413]].
