description: This domain of unknown function is found in Focadhesin from animals and RST1 (RESURRECTION
  1) from plants. Focadhesin (FOCAD) is a focal adhesion protein with potential tumour suppressor function
  in gliomas [[cite:PUB00075175]]. RST1 was originally identified in a genetic screen for factors involved
  in the biosynthesis of epicuticular waxes [[cite:PUB00098180]]. Later, RST1 and RST1 INTERACTING PROTEIN
  (RIPR) have been shown to act as cofactors of the cytoplasmic exosome and the Ski complex in plants
  [[cite:PUB00098179]]. It is involved in the suppression of siRNA-mediated silencing of transgenes and
  certain endogenous transcripts [[cite:PUB00098181]]. Structure predictions suggest that this is an alpha-helical
  domain with and armadillo-like fold.
