      a particular UppS residue or elementary reaction.
    directness: UNRESOLVED
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:9882662
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC93402/
