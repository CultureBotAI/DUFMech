- graph_id: ecoli-upps-coupled-detergent-response
  title: Triton addition increases the UppS coupled-assay signal
  scope: Recombinant untagged E. coli UppS together with yeast inorganic pyrophosphatase in Apfel 1999
    Figure 6; the observed coupled output is not assigned to an isolated UppS elementary step.
  context: Compare 0.01% Triton X-100 with omission in the coupled phosphate assay. Other standard components
    are 100 mM Tris-HCl pH 7.5, 0.2 mM MgCl2, 10 uM IPP, 10 uM FPP and 0.003 U S. cerevisiae inorganic
    pyrophosphatase in 100 ul for 30 min at 35 C. Malachite-green A660 is calibrated against phosphate;
    Figure 6 normalizes each series to its maximum. Exact UppS dose is not given in the caption.
  family_mapping: Intact recombinant UppS is mapped through historical Q47675 and its exact archived sequence
    to P60472, PF01255 24-244. The yeast coupling enzyme is a required assay partner, not a PF01255 member.
    Reference identity does not establish every historical expression junction.
  scope_status: PHENOTYPIC
  limitations: Figure 6 shows residual signal without detergent, and higher detergent concentrations lower
    the signal again. This is not absolute detergent dependence, monotonic activation, or a cellular membrane
    mechanism. Solubilization, product release, the coupling enzyme and detection chemistry are not separately
    resolved. The Methods color-reagent acid notation remains uncorrected; raw triplicates were not reanalyzed.
  nodes:
  - node_id: triton-point-zero-one-percent
    label: 0.01% Triton X-100 rather than omission in the complete coupled reaction
    node_type: PERTURBATION
  - node_id: coupled-phosphate-output
    label: Normalized phosphate-dependent A660 output of the UppS/pyrophosphatase assay
    node_type: PHENOTYPE
  edges:
  - edge_id: triton-increases-coupled-output
    subject: triton-point-zero-one-percent
    predicate: increases
    object: coupled-phosphate-output
    mechanism: The 0.01% detergent condition yields greater normalized output than the zero-detergent
      condition in the visually inspected Figure 6. The effect is retained at assay level because the
      molecular step responsible is not independently isolated.
    directness: UNRESOLVED
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:9882662
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC93402/
      snippet: residual activity
      explanation: Figure 6 and its caption support the direction, normalization and nonzero omission
