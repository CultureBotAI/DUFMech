discussions:
- discussion_id: upps-product-clone-and-coupling-coverage
  prompt: Resolve original clone and product data, separate coupled-assay effects, and extend cis-prenyltransferase
    member coverage.
  kind: CURATION_TODO
  status: OPEN
  rationale: Product formation and two coupled-assay comparisons do not establish a complete residue-level
    mechanism. Frozen UPF0015 metadata and the M. luteus example remain distinct from the adopted E. coli
    preparation. Operon-level essentiality, product-length variants and eukaryotic homologs need independent
    scope and evidence.
  evidence:
  - reference: PMID:9882662
    supports: PARTIAL
    evidence_source: full_text
    explanation: Figure 6 was visually inspected; product TLC is reported but unshown. The pneumococcal
      Results and Discussion retain downstream-operon and promoter-strength caveats and are not adopted
      as E. coli effects.
  - reference: PMID:9677368
    supports: PARTIAL
    evidence_source: abstract
    explanation: Original M. luteus cloning study is an inspected abstract lead, not full experimental
      coverage.
  - reference: doi:10.1074/jbc.M106747200
    supports: PARTIAL
    evidence_source: selected_full_text
    explanation: Abstract and selected Methods identify Bos-12, FXa processing and mutant/product experiments.
      Mutant figures and exact sequence-coordinate transfer were not reviewed, so no L137A or tunnel-motion
      edge is adopted.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: Preserve residual output rather than claiming absolute cofactor dependence. Obtain the original
    TLC and full clone sequences, and inspect later product-specificity and partner-dependent eukaryotic
    contexts. Partial scientific self-review; status remains IN_PROGRESS.
causal_graphs:
- graph_id: ecoli-upps-prenyl-product-formation
  title: Recombinant E. coli UppS forms long-chain prenyl products
  scope: Untagged recombinant E. coli UppS in Apfel 1999; intact protein rather than an isolated PF01255
    segment or every cis-prenyltransferase.
  context: The pUppS-wt-EC construct uses the upstream GTG start and is expressed in BL21(DE3)(pLysS),
    then purified by ammonium sulfate fractionation, Phospho-Ultrogel and Superdex 200. The standard radioactive
    assay uses 100 ul, 100 mM Tris-HCl pH 7.5, 0.2 mM MgCl2, 0.05% Triton X-100, 10 uM FPP and 10 uM radiolabeled
    IPP for 30 min at 35 C. Companion product identification uses potato acid phosphatase and reversed-phase
    TLC; its precise incubation recipe is not separately specified.
  family_mapping: Historical Q47675/YAES_ECOLI has demerged into several entries. Its archived UPI0000137D08
    sequence exactly matches the 253-aa K12 reference UniProtKB:P60472 (ispU/uppS/yaeS), sequence version
    1, and the InterPro sequence. PF01255 maps to residues 24-244 inclusive. This reference mapping does
    not establish the historical PCR donor strain or all clone junctions; BL21 is the expression host.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:562
  limitations: Reported major dephosphorylated products comigrate with both undecaprenol and decaprenol;
    C30-C45 products also occur. TLC is described as data not shown, not independently inspected chromatography.
    No exclusive C55 product, stereochemical remeasurement, eight resolved condensation microsteps, isolated-domain
    sufficiency or cellular peptidoglycan flux is claimed. Native one-/two-Met forms and tagged preparations
    are not silently equated with the adopted recombinant preparation.
