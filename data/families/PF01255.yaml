- graph_id: ecoli-upps-coupled-magnesium-response
  title: Magnesium addition increases the UppS coupled-assay signal
  scope: Recombinant untagged E. coli UppS plus yeast inorganic pyrophosphatase in Apfel 1999 Figure 6,
    separate from the detergent series and product-identification experiment.
  context: Compare 0.5 mM MgCl2 with omission. Other standard coupled-assay components are 100 mM Tris-HCl
    pH 7.5, 0.05% Triton X-100, 10 uM each IPP/FPP and 0.003 U yeast inorganic pyrophosphatase in 100
    ul, 35 C for 30 min. Phosphate-dependent A660 output is normalized to the maximum within this series;
    the enzyme dose and raw triplicates remain unverified.
  family_mapping: Historical Q47675 maps by archived sequence identity to E. coli reference P60472, PF01255
    residues 24-244. The adopted construct is the untagged recombinant protein, not M. luteus O82827 from
    the frozen family description or an isolated domain.
  scope_status: PHENOTYPIC
  limitations: Residual signal without added MgCl2 is visible. Both the prenyltransferase and coupling
    reaction can contribute to the Mg-dependent output; direct UppS metal occupancy or catalytic metal
    stoichiometry is not shown. The nonmonotonic concentration series is not generalized to all doses
    or to in-vivo growth. No edge connects this mixed-enzyme optical assay to pneumococcal essentiality.
  nodes:
  - node_id: magnesium-point-five-millimolar
    label: 0.5 mM MgCl2 rather than omission in the complete coupled reaction
    node_type: PERTURBATION
  - node_id: magnesium-series-phosphate-output
    label: Normalized phosphate-dependent A660 output in the magnesium series
    node_type: PHENOTYPE
  edges:
  - edge_id: magnesium-increases-coupled-output
    subject: magnesium-point-five-millimolar
    predicate: increases
    object: magnesium-series-phosphate-output
    mechanism: Added 0.5 mM MgCl2 increases the coupled optical output relative to omission in Figure
