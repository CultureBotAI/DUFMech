description: This family consists of several eukaryotic proteins including JAMP, a Jun N-terminal kinase
  1 (JNK1)-associated membrane protein. It associates with JNK1 through its C-terminal domain and regulates
  the duration of JNK1 activity in response to diverse stress stimuli [[cite:PUB00086473]]. It is an important
  component for coordinated clearance of misfolded proteins from the ER [[cite:PUB00086474],[cite:PUB00086475]].
