description: This entry represents a group of bacterial, fungal and plant sequences, including 2-oxoadipate
  dioxygenase/decarboxylase (referred to as HGLS and YdcJ) from Escherichia coli. YdcJ, which is involved
  in D-lysine metabolism, catalyses a successive decarboxylation and intramolecular hydroxylation of 2-oxoadipate
  forming 2-hydroxyglutarate in a Fe(II) and oxygen-dependent manner. Members of this protein family are
  thought to belong to the the vicinal oxygen chelate (VOC) superfamily [[cite:PUB00102155],[cite:PUB00102156]].
  The structure has been solved (PDB:3iuz, PDB:6w1g).
