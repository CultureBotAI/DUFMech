description: This domain can be found in human 5'-3' DNA helicase ZGRF1 and similar eukaryotic proteins.
  ZGRF1 promotes repair of replication -blocking DNA lesions through stimulation of homologous recombination
  (HR) [[cite:PUB00098331],[cite:PUB00153163]]. This domain can also be found in Mte1 (Mph1-associated
  telomere maintenance protein 1) from Saccharomyces cerevisiae, which is involved in telomere maintenance
  [[cite:PUB00044234]] and in and fission yeast Dbl2, involved in meiotic chromosome segregation. However,
  there is no evidence to suggest that this domain, which is predicted to adopt an all-beta structure,
  is implicated in DNA damage resistance or nuclear focus formation [[cite:PUB00044235],[cite:PUB00089971],[cite:PUB00101196],[cite:PUB00101195]].
