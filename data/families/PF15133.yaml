description: In humans, TASL (TLR adaptor interacting with SLC15A4 on the lysosome) is encoded by CXorf21
  that is associated with systemic lupus erythematosus [[cite:PUB00093601]]. It is an immune adaptor that
  is required for recruitment and activation of IRF5 by TLR7, TLR8 and TLR9, in mechanistic analogy to
  IRF3 and its three adaptors STING, MAVS and TRIF. TASL interacts with the endolysosomal transporter
  SLC15A4 forming the SLC15A4-TASL complex, which is required for endolysosomal TLR signalling. TASL contains
  a pLxIS motif that is important for its function [[cite:PUB00095082]].
