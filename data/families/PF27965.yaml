description: This domain is found in uncharacterised proteins mainly from Actinomycetes. It is predicted
  to adopt a globular structure in which two alpha-helices are sandwiched between two four-stranded beta-sheets.
  Besides a conserved RxF sequence motif, this domain contains several conserved positively charged residues
  which may be essential for function.
