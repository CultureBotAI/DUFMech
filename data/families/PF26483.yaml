description: This entry represents the C-terminal domain from a family of uncharacterised proteins from
  halophilic archaea. The proteins in this family are predominantly found in the class Halobacteria, which
  includes families such as Natrialbaceae, Haloferacaceae, and Haloarculaceae. The proteins in this family
  are generally around 270-330 amino acids in length. This domain is found associated with a peptidase
  M23 family like domain at the N-terminus.
