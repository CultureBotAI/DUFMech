description: This domain is found in uncharacterised proteins from bacteria, archaea and eukaryotes, including
  NTF2-Like SgcJ protein from Streptomyces carzinostaticus, which plays a role in the biosynthesis of
  the 9-membered enediyne antitumor antibiotic C-1027. It shows a cone-like alpha+beta barrel structure
  with a long N-terminal alpha- helix, a curved six-stranded antiparallel beta-sheet and two additional
  shorter alpha-helices. Its specific function is still unkown [[cite:PUB00100883]].
