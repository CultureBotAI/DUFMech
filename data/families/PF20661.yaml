description: This domain (previously known as DUF6813) is found in the transcriptional regulator SutA
  from Pseudomonas aeruginosa and similar proteins mainly from Gammaproteobacteria. In Pseudomonas aeruginosa,
  SutA adapts bacteria to hypoxia and nutrition-limited environment during chronic infection by increasing
  transcriptional activity of an RNA polymerase (RNAP) holoenzyme. SutA interacts directly with RNAP holoenzyme
  and the RNAP-beta protrusion is its primary anchor site. This domain comprises an alpha-helix and a
  beta-strand and is responsible for interaction with RNAP-beta protrusion [[cite:PUB00152756]]. It contains
  a conserved FLxxGG sequence motif that appears to be located near the C-terminal helix cap. The SutA-RBD
  alpha-helix binds to a hydrophobic groove on RNAP-beta protrusion [[cite:PUB00152756]].
