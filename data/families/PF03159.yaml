description: This family aligns residues towards the N-terminus of several proteins with multiple functions.
  The members of this family all appear to possess 5'-3' exonuclease activity [ec:3.1.11.-]. Thus, the
  aligned region may be necessary for 5' to 3' exonuclease function. The family also contains several
  Xrn1 and Xrn2 proteins. The 5'-3' exoribonucleases Xrn1p and Xrn2p/Rat1p function in the degradation
  and processing of several classes of RNA in Saccharomyces cerevisiae. Xrn1p is the main enzyme catalysing
  cytoplasmic mRNA degradation in multiple decay pathways, whereas Xrn2p/Rat1p functions in the processing
  of rRNAs and small nucleolar RNAs (snoRNAs) in the nucleus [[cite:PUB00020569]].
