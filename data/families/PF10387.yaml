description: This family of bacterial and fungal proteins has several members annotated as being putative
  molybdopterin-guanine dinucleotide biosynthesis protein A; however this could not be verified. Hence
  the function is not known. This family also includes the DUF3532 that was found to be related and was
  merged into this family. Members of this family also fall into the NE0471 N-terminal domain-like superfamily,
  a family of proteins with a unique fold in SCOP:143880.
