description: E or 'early' set domains are associated with the catalytic domain of galactose oxidase at
  the C-terminal end. Galactose oxidase is an extracellular monomeric enzyme which catalyzes the stereospecific
  oxidation of a broad range of primary alcohol substrates, and possesses a unique mononuclear copper
  site essential for catalysing a two-electron transfer reaction during the oxidation of primary alcohols
  to corresponding aldehydes. The second redox active centre necessary for the reaction was found to be
  situated at a tyrosine residue. The C-terminal domain of galactose oxidase may be related to the immunoglobulin
  and/or fibronectin type III superfamilies. These domains are associated with different types of catalytic
  domains at either the N-terminal or C-terminal end, and may be involved in homodimeric/tetrameric/dodecameric
  interactions. Members of this family adopt a secondary structure consisting of a bundle of seven, mostly
  antiparallel, beta-strands surrounding a hydrophobic core. The 7 strands are arranged in 2 sheets, in
  a Greek-key topology [[cite:PUB00014151]]. This domain is found in sugar-utilising enzymes, such as
  galactose oxidase or chitinase [[cite:PUB00028414],[cite:PUB00044942],[cite:PUB00080765],[cite:PUB00080766],[cite:PUB00003324]].
