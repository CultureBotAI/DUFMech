description: The 125-residue ALOG (Arabidopsis LSH1 and oryza G1) domain is rich in basic amino acids,
  especially arginine, and is highly conserved among land plants. Members of the ALOG family of proteins
  function as key developmental regulators. It has been proposed that the ALOG domain originated from
  the N-terminal DNA-binding domains of integrases belonging to the tyrosine recombinase superfamily encoded
  by a distinct type of DIRS1-like LTR retrotransposon found in several eukaryotes. Secondary structure
  predictions revealed an all-alpha helical domain with four conserved helices [[cite:PUB00072583],[cite:PUB00072584]].
  Some proteins known to contain an ALOG domain are Arabidopsis thaliana LIGHT_DEPENDENT SHORT HYPOCOTYLS1
  (LSH1),involved in phytochrome- dependent light signalling; Oryza G1, involved in the specification
  of sterile lemma identity and Plant defence proteins.
