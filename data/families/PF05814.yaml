description: This family consists mainly of baculovirus proteins. Family members include Autographa californica
  multiple nucleopolyhedrovirus (AcMNPV), protein AC76. Ac76 has been shown to be involved in intranuclear
  microvesicle formation. Functional studies suggest that ac76 is essential for both BV (budded virus)
  and ODV (occlusion-derived virus) development but is not required for viral DNA synthesis [[cite:PUB00082598]].
