description: Amidase_YiiX is a family of permuted papain-like amidases. It has amidase specificity for
  the amide bond between a lipid and an amino acid (or peptide). From the structure, a tetramer, each
  monomer is made up of a layered alpha-beta fold with a central, 6-stranded, antiparallel beta-sheet
  that is protected by helices on either side. The catalytic Cys154 in UniProtKB:Q74NK7, PDB:3kw0, is
  located on the N-terminus of helix alphaF. The two additional helices located above Cys154 contribute
  to the formation of the active site, where the lysine ligand is bound [[cite:PUB00075488]].
