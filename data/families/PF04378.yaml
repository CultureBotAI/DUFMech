description: RlmJ is ribosomal RNA large subunit methyltransferase J is required for full methylation
  of 23S ribosomal RNA (rRNA) during ribosome biogenesis. The ribosomal RNA of E. coli carries 24 residues
  that require methylation, and this methyltransferase is the last to be described, that modifies A2030
  [[cite:PUB00068648]]. RlmJ displays a variant of the Rossmann-like methyltransferase (MTase) fold with
  an inserted helical subdomain. On binding cofactor and substrate a large shift of the N-terminal motif
  X tail is induced in order to make it cover the cofactor-binding site and to trigger active-site changes
  in motifs IV and VIII [[cite:PUB00068650]].
