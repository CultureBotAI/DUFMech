description: This domain of unknown function is found in uncharacterised bacterial proteins. This domain
  is about 60 amino acids in length and contains the conserved motifs GPY, GxxC and GCxC. These conserved
  cysteine residues and the fact that this domain has overlaps with families in clan CL0172 suggest that
  it is related to thioredoxins and it is likely in thiol-disulfide isomerases.
