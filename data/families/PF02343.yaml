description: This family of proteins represents the protein product of the gene R03H10.4 which is located
  near a sequence that matches the TRA-1 binding consensus. TRA-1 is a transcription factor which controls
  sexual differentiation in C.elegans. R03H10.4 shows male-enriched reporter gene expression and acts
  as a direct target of TRA-1 regulation [[cite:PUB00055609]].
