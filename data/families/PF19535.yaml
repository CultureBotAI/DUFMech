description: This entry represents a member of a biosynthetic gene cluster (BGC). This BGC (BGC0001035)
  is described by MIBiG as an example of the following biosynthetic classes, NRP (non-ribosomal peptide),
  polyketide and other (Aminocoumarin). This family includes a protein from the pneumocandin B0 biosynthetic
  gene cluster from Glarea lozoyensis ATCC 20868 and appear to be predominantly found in fungi [[cite:PUB00098936],[cite:PUB00098937]].
