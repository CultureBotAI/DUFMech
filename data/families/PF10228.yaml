description: Histone PARylation factor 1 (HPF1, previously known as C4orf27) is a key regulator of ADP-ribosylation
  (ADPr) signaling in response to DNA damage. It forms a complex with PARP-1 (poly(ADP-ribose) polymerase
  1), creating a composite active site. HPF1 is essential for Ser-ADPr (ADPr on serine residues), which
  represents the major fraction of ADPr synthesised after DNA damage. This protein is organised into two
  tightly-associated domains connected via an elaborate linker, showing an alpha-beta structure [[cite:PUB00081458],[cite:PUB00101317],[cite:PUB00101318],[cite:PUB00101316]].
