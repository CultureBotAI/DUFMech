description: SusE and SusF are two outer membrane proteins composed of tandem starch specific carbohydrate
  binding modules (CBMs) with no enzymatic activity. They are are likely to play an important role in
  starch metabolism in Bacteroides. It has been speculated that they could compete for starch in the human
  intestinal tract by sequestering starch at the bacterial surface and away from competitors [[cite:PUB00062486]].
  SusE has higher affinity for starch compared to SusF. SusE contains two starch specific CBMs whereas
  SusF contains three. This entry represents the two SusE and the second and third SusF CBMs.
