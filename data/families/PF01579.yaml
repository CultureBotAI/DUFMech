- graph_id: c36c5-5-rnai-lbp2-aggregation
  title: C36C5.5 RNAi shifts the LBP-2 aggregation distribution upward
  scope: C. elegans LBP-2::tagRFP reporter animals in Gallotta et al. Figure 1k, with RNAi against C36C5.5;
    not EXC-13 or a domain-selective perturbation.
  context: Day 6, 25 C, one independent experiment; L4440 empty vector and rab-5 RNAi are negative and
    positive controls. Figure 1 source data report counts in zero, 1-10 and greater-than-10 aggregate
    categories. Exact strain, RNAi insert and exposure start were not established from the accessible
    caption and source sheet; the distinct day-4/from-egg Extended Data 2 experiment is not substituted.
  family_mapping: C36C5.5, now exh-1, is UniProtKB:O16405, C. elegans N2 reference taxon 6239, sequence
    version 1, 204 residues, PF01579 at 34-198 inclusive. UniProt and InterPro sequences agree. O16406
    is C36C5.12 and is not this tested gene.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:6239
  limitations: Main text and Methods were paywalled; exact panel-specific strain and knockdown specificity
    remain open. One independent experiment is not replicated merely because it contains many animals.
    The endpoint is reporter aggregation, not a directly measured holdase reaction or family-wide function.
