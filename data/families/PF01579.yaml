causal_graphs:
- graph_id: exc13-rnai-canal-morphology
  title: EXC-13 RNAi increases abnormal excretory-canal morphology
  scope: C. elegans BK540 exposed to feeding RNAi targeting exc-13/C03G6.5; not isolated DUF19 or an isogenic
    C44Y mutant.
  context: BK540 is rrf-3(pk1426) II; qpIs11[unc-119; Pvha-1::gfp] I. L2 parents were exposed and F1 young
    adults examined on days 4-6, with general culture at 20 C. BK541 sid-1(pk3321) is the RNAi-refractory
    control; dpy-11, exc-1 and erm-1 are induction controls. Supplement Table S2 identifies Ahringer clone
    V-16K12; its exact insert sequence remains unverified.
  family_mapping: EXC-13/C03G6.5 maps to UniProtKB:O01454, C. elegans reference taxon 6239, sequence version
    4, 203 residues, PF01579 at 33-198 inclusive. UniProt and InterPro sequences agree. Reference mapping
    establishes family membership, not the RNAi specificity, mutant product or domain sufficiency.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:6239
  limitations: No target-specific rescue is established. Table 2 and Supplement Table S2 disagree on sample
    count and frequency; these are not pooled. The main-table P value is just outside the authors' high-confidence
    cutoff. VC40373 carries other mutations and has a different phenotype, so it is not treated as isolated
    C44Y causation. No disulfide, secretion or biochemical mechanism is inferred.
