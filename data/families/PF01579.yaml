    mechanism: Table 2 reports 19 percent affected among 79 canals versus 0 percent among 100 BK540 controls.
      Figure 4D illustrates focal basal vesicles/cysts. The affected subset's length score is 3.5 +/-
      0.32 SD on an ordinal 0-4 scale, not an all-canal mean or micrometre measurement. The length-distribution
      Fisher 3x2 P=1.2e-6 does not separately test each pictured morphology. Supplement S2 instead reports
