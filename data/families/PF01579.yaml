- graph_id: c36c5-5-overexpression-without-coelomocytes
  title: C36C5.5 overexpression reduces reporter aggregation without coelomocytes
  scope: Separate coelomocyte-absent arms in Gallotta et al. Figure 2e; C36C5.5 overexpression compared
    with secreted-GFP overexpression, not the sibling control from panel b.
  context: Day 6, two independent experiments with LBP-2::tagRFP reporter and coelomocytes absent. Table
    5 catalogs DCD387 with unc-119(ed3), cdIs32 coelomocyte ablation, uqIs27 C36C5.5 fusion and uqIs5
    reporter; a unique panel-to-strain assignment and exact assay temperature remain unverified from the
    accessible material.
  family_mapping: C36C5.5/exh-1 is O16405, PF01579 at 34-198 in the 204-residue reference. Neither the
    coelomocyte ablation transgene nor secreted GFP is the DUF19 member; this comparison tests C36C5.5
    overexpression in a fixed ablation context.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:6239
  limitations: This is not an experiment demonstrating that endogenous C36C5.5 acts only independently
    of coelomocytes. It does not establish direct binding as the causal intermediate or transfer the effect
    to EXC-13. Main Methods, clone junctions and raw images remain unreviewed.
