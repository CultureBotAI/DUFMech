description: This family, formerly known as DUF112, is a family of bacterial and archaeal tripartite tricarboxylate
  transporters of the extracytoplasmic solute binding receptor-dependent transporter group of families,
  distinct from the ABC and TRAP-T families [[cite:PUB00106923]]. TctA is part of the tripartite TctABC
  system which, as characterised in S. typhimurium [[cite:PUB00106922]], is a secondary carrier that depends
  for activity on the extracytoplasmic tricarboxylate-binding receptor TctC as well as two integral membrane
  proteins, TctA and TctB. complete three-component systems are found only in bacteria. TctA is a large
  transmembrane protein with up to 12 predicted membrane spanning regions in bacteria and up to 11 such
  in archaea, with the N-terminal within the cytoplasm. TctA is thought to be a permease, and in most
  other bacteria functions without TctB and TctC molecules [[cite:PUB00106923]].
