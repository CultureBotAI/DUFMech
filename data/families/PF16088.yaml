description: This is a family of unknown function found in eukaryotes. Family members include BORCS7 (BLOC-1-related
  complex sub-unit 7) also known as Diaskedin (from the Ancient Greek 'diaskedazo', meaning 'to disperse')
  or C10orf32. It constitutes sub-unit 7 of the BORC complex (BLOC-one-related complex). BORC is a multisubunit
  complex that regulates the positioning of lysosomes at the cell periphery, and consequently affects
  cell migration. BORC associates with the lysosomal membrane, where it functions to recruit the small
  GTPase Arl8. This initiates a series of interactions that promote the microtubule-guided transport of
  lysosomes toward the cell periphery [[cite:PUB00082308]][[cite:PUB00074975]].
