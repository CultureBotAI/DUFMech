description: This entry represents the C-terminal domain of antitoxin components of a type II toxin-antitoxin
  (TA) system, including Xre from Pseudomonas putida, MbcA from Mycobacterium sp. and ParS from Sphingobium
  sp. [[cite:PUB00098292],[cite:PUB00098291],[cite:PUB00093678],[cite:PUB00098290]]. This domain interacts
  with the toxin component and sterically blocks its active site, neutralising its effect [[cite:PUB00098291],[cite:PUB00093678]].
  These antitoxins also have a HTH domain at the N-terminal.
