description: This family of archaebacterial proteins, formerly known as DUF114, has been found to be a
  serine proteinase distantly related to ClpP proteinases that belong to the serine proteinase superfamily.
  The family has a catalytic triad of Ser, Asp, His residues in a linear sequential arrangement (SDH),
  which shows an altered residue ordering compared with the classical ClpP proteinases (SHD) but similar
  to that of the carboxypeptidase clan [[cite:PUB00053691]].
