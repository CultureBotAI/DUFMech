description: This family consists of oxidoreductases involved in the synthesis of different polyketides
  and derivatives. Questin oxidase GedK from Aspergillus terreus catalyzes the ring cleavage of the anthraquinone
  questin to form benzophenone desmethylsulochrin [[cite:PUB00086982]]. It is part of the gene cluster
  that mediates the biosynthesis of geodin, an intermediate in the biosynthesis of other natural products
  [[cite:PUB00081405]]. MdpL from Emericella nidulans is part of the gene cluster that mediates the biosynthesis
  of monodictyphenone [[cite:PUB00086983]].
