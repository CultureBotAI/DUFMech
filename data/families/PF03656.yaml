description: The Pam16 protein ([swissprot:P42949]) is the fifth essential subunit of the pre-sequence
  translocase-associated protein import motor (PAM) [[cite:PUB00019986]]. In Saccharomyces cerevisiae,
  Pam16 is required for preprotein translocation into the matrix, but not for protein insertion into the
  inner membrane [[cite:PUB00019986]]. Pam16 has a degenerate J domain. J-domain proteins play important
  regulatory roles as co-chaperones, recruiting Hsp70 partners and accelerating the ATP-hydrolysis step
  of the chaperone cycle [[cite:PUB00005482]]. Pam16's J-like domain strongly interacts with Pam18's J
  domain, leading to a productive interaction of Pam18 with mtHsp70 at the mitochondria import channel
  [[cite:PUB00033671]]. Pam18 stimulates the ATPase activity of mtHsp70.
