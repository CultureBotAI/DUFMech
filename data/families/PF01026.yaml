    subject: tatd-magnesium-ssdna-system
    predicate: produces
    object: shorter-ssdna-products
    mechanism: The enzyme concentration series in the magnesium-containing reaction converts the 20-nt
      substrate into shorter gel-resolved products. Separate 5'- versus 3'-labeling and terminal-blocking
      tests support 3'-5' exonucleolysis without resolving the chemical microsteps.
    directness: DIRECT
