- graph_id: tatd-internal-thf-duplex-incision
  title: Untagged TatD preparation incises an internal AP-site analogue in duplex DNA
  scope: Purified E. coli TatD in the 2023 bacterial Figure 6 assay, not the human TATDN proteins or the
    2014 tagged preparation.
  context: Synthetic tatD in modified pET-21 produces untagged protein in BL21(DE3). Reaction contains
    10 uM protein, 100 nM FAM-labeled THF duplex, 5 mM CaCl2, 20 mM EPPS pH 8.0, 50 mM NaCl and 2.5% glycerol
    at 37 C; gel time points are 1, 30 and 120 min. Table S1 gives FAM-CGTCTCCTGAAC/(THF)/GTGCTATCGCTC
    annealed with GAGCGATAGCACAGTTCAGGAGACG.
  family_mapping: E. coli TatD reference P27859 maps to PF01026 residues 2-257. The synthetic gene's exact
    sequence/version and full clone junctions are not independently supplied here; current native mapping
    is not a tag or strain assertion about all bacterial paralogs.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:562
  limitations: The measured substrate contains THF, not a natural AP site. No matched no-enzyme/mock-purification
    control is labeled for the bacterial Figure 6 lanes; human BH110 controls are not transferred. Substrate
    and metal both differ between Mg/exonuclease and Ca/AP panels, so calcium alone is not shown to switch
    activity. Table S1 places THF after 12 bases while the manuscript Figure 5 caption says position 12.
    No cellular repair chain or metal microstep is asserted.
  nodes:
  - node_id: tatd-calcium-thf-duplex-system
    label: Untagged TatD preparation plus THF duplex and 5 mM CaCl2
    node_type: ACTIVITY
    grounding:
    - UniProtKB:P27859
  - node_id: thf-incision-product
    label: Discrete shorter labeled product from the internal-THF duplex
    node_type: STATE
  edges:
