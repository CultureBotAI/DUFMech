- graph_id: tatd-magnesium-ssdna-digestion
  title: Purified tagged TatD digests ssDNA in a magnesium-containing reaction
  scope: Full-length E. coli TatD with a C-terminal His tag, not an isolated Pfam domain or a cellular
    repair pathway.
  context: K-12 tatD in pET22b expressed in BL21-CodonPlus-RIPL and purified by Ni-NTA and Q-Sepharose.
    Figure 2B uses 40 nM 5'-32P-labeled 20-nt ssDNA, 0-0.5 uM TatD, 2 mM Mg2+, 3 mM MOPS, 75 mM NaCl,
    pH 7.2, 10 uL, 37 C for 1 h. Substrate sequence is CAAACTCTCTCTCTCTCAAC.
  family_mapping: UniProtKB:P27859, tatD/b4483/JW5931, K-12 reference of 260 residues, sequence version
    3; exact UniProt/InterPro sequence agreement and PF01026 at 2-257 inclusive. Native reference, DNA
    donor and expression host are distinct; the complete tagged clone sequence is not independently reconstructed.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:562
  limitations: This is a joint enzyme/substrate/cofactor assay, not magnesium sufficiency or all-family
    activity. No-metal, Ca2+ and Zn2+ negatives apply only to the tested ssDNA conditions; they do not
    exclude AP endonuclease activity on another substrate. Proposed metal stoichiometry and catalytic
    microsteps remain unresolved. The source's 20 mM protease-K quench unit is questionable and not silently
    corrected.
  nodes:
  - node_id: tatd-magnesium-ssdna-system
    label: Tagged TatD plus 20-nt ssDNA and 2 mM Mg2+
    node_type: ACTIVITY
    grounding:
    - UniProtKB:P27859
  - node_id: shorter-ssdna-products
    label: Shorter labeled DNA products from the 20-nt substrate
    node_type: STATE
