- graph_id: tatd-deletion-chronic-peroxide-growth
  title: Whole-gene TatD deletion reduces colony growth under chronic peroxide
  scope: E. coli K-12 WT and DeltaTatD cells from the Keio collection; a whole-gene growth phenotype,
    not direct proof of a particular DNA-repair reaction.
  context: Serial dilution spots with chronic 1 mM H2O2, incubated overnight at 37 C in Figure 3B. Drug-free
    spots are the unstressed comparator; separate MMS, MMC and UV-C tests do not display the same defect.
    Basal plate-medium details and exact deletion stock identity remain unresolved.
  family_mapping: K-12 tatD reference P27859/b4483/JW5931 contains PF01026 at 2-257, within 260 residues.
    Deleting the gene perturbs the whole protein; the tested stock's deletion boundaries are not independently
    reconstructed.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: No genetic rescue is shown for this adopted comparison. Spot growth is not a quantified
    survival probability, and impaired peroxide growth does not establish a direct nuclease-to-repair-to-survival
    chain. Acute outgrowth and the later three-paralog deletion are different experiments.
  nodes:
