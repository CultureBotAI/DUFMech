- graph_id: tatd-residue-substitution-digestion-effects
  title: TatD H62A and acidic substitutions reduce ssDNA digestion
  scope: Separate purified single-residue variants of the full-length C-terminally tagged E. coli TatD
    preparation in Figure 5C.
  context: WT and QuikChange mutants use the same purification workflow and 20-nt ssDNA assay. Figure
    5C displays a 0.5/1/2 concentration series without units in its image or caption. General methods
    specify 37 C in MOPS/NaCl pH 7.2, but this panel's duration, DNA dose and metal concentration are
    not resolved; Figure 2B values are not substituted.
  family_mapping: P27859 sequence version 3 contains H62, E91, E201 and D203, all within PF01026 residues
    2-257. H64, H127 and H152 are also verified and their alanine mutants retain activity. These are intact-protein
    perturbations, not isolated-domain tests.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:562
  limitations: Directness refers to the measured biochemical digestion endpoint, not a demonstrated histidine
    general base, exact metal ligation or proton transfer. Altered folding or effective protein concentration
    is not excluded for every variant. Panel-specific dose units and complete clone sequences require
    follow-up.
