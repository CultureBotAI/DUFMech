description: The name MOZART is derived from letters of 'mitotic-spindle organizing proteins associated
  with a ring of gamma-tubulin'. This family operates as part of the gamma-tubulin ring complex, gamma-TuRC,
  one of the complexes necessary for chromosome segregation. This complex is located at centrosomes and
  mediates the formation of bipolar spindles in mitosis; it consists of six subunits. However, unlike
  the other four known subunits, this family does not carry the conserved 'Spc97-Spc98' GCP domain, so
  the TUBCGP nomenclature cannot be used for it. MOZART1 is required for gamma-TuRC recruitment to centrosomes
  [[cite:PUB00056001]].
