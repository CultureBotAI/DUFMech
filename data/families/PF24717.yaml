description: This family of uncharacterised proteins is found in bacteria (Bacteroidota and Chloroflexi).
  Proteins in this family are approximately 80 amino acids in length. The proteins are likely to be integral
  membrane proteins with two transmembrane alpha helices. Structural modelling suggests that these proteins
  form a dimeric arrangement with the pairs of alpha helices tilted at close to 45 degrees angle compared
  to the lipid membrane. Based on the positive inside rule it is likely that the N and C-terminii of the
  proteins have a cytoplasmic location. Given the geometry of the protein complex it may not span the
  entire membrane.
