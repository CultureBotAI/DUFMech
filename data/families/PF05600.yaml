description: This family contains several eukaryotic sequences such as CDK5RAP3 (also known as C53 or
  LZAP) which serves as a probable tumour suppressor. Initially identified as a CDK5R1 interactor controlling
  cell proliferation [[cite:PUB00086010],[cite:PUB00086014]]. It negatively regulates NF-kappa-B-mediated
  gene transcription through the control of RELA phosphorylation [[cite:PUB00043152],[cite:PUB00086011]].
  It also regulates mitotic G2/M transition checkpoint and mitotic G2 DNA damage checkpoint [[cite:PUB00086012],[cite:PUB00086013]].
  It has been shown to bind Wip1 and stimulates its phosphatase activity [[cite:PUB00086015]].
