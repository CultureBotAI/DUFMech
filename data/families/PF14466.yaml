description: A small family of bacterial proteins, found in several Bacteroides species. Structure determination
  (NMR and Xray) shows an immunoglobulin beta-barrel fold. Multiple homologues have been found in human
  gut metagenomics data sets. Structural experimentation shows it to share features with two well-established
  protein architectures in the SCOP database, ie, C2 (calcium/lipid-binding domain) of [pfam:PF00168]
  and PLAT/LH2 (lipase/lipooxigenase domain) of [pfam:PF01477]. The C2 and PLAT/LH2 domains bind Ca2+
  in their functions of targeting proteins to cell-membranes; this domain is also shown to bind Ca2+ as
  well as to be a novel fold [[cite:PUB00075637]].
