description: This domain is predominantly found in Firmicute bacterial proteins and is functionally uncharacterised.
  It is found in proteins that are likely to be surface exposed. It is predicted to fold into a globular
  structure with C-type lectin topology. This domain is frequently found in combination with other carbohydrate-binding
  domains implying that it may be involved in carbohydrate recognition/binding.
