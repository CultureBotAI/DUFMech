description: This domain is found at the N-terminal of Nuclear speckle splicing regulatory protein 1 (NRP1,
  also known as Nuclear speckle-related protein 70 and Coiled-coil domain-containing protein 55) and contains
  a coiled-coil domain that plays a critical role in NRP1 alternative splicing activity and self-oligomerization.
  NRP1 is a RNA-binding protein that mediates pre-mRNA alternative splicing regulation [[cite:PUB00093376],[cite:PUB00093375]].
