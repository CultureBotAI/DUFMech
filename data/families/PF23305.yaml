description: This domain is found in uncharacterised proteins mainly from Fungi. This domain is predicted
  to adopt a globular structure consisting of a curved beta-sheet and alpha- helices packed on it. This
  domain is probably distantly related to the N-terminal domain of STE-like transcription factors ([pfam:PF02200])
  based on the similarity of their predicted structures. The predicted structure of this domain has a
  partial similarity to pseudo Winged helix domains.
