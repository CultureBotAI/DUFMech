description: This domain has been annotated as Rac1-binding domain [[cite:PUB00093956],[cite:PUB00093955]].
  It can be found in human CYRIA/CYRIB and at the N terminus of CYFIP1/2 [[cite:PUB00093957]]. CYFIP proteins
  are known RAC1 effectors that stimulate actin polymerization [[cite:PUB00093957]]. In mice, CYRIB (also
  known as CYRI or FAM49B) negatively regulates RAC1-driven cytoskeletal remodelling and plays a role
  in restricting infection mediated by Mycobacterium tuberculosis and Listeria monocytogenes [[cite:PUB00093957]].
