description: This entry represents the N-terminal domain of a family of eukaryotic proteins, including
  the human uncharacterised protein C5orf34, which has been reported to be correlated with an unfavourable
  prognosis of patients from a variety of human malignancies [[cite:PUB00154384]]. This domain is predicted
  to show an alpha-beta structure with high structural similarity to a polo box.
