description: This domain has a cyclophilin-like fold, consisting of an eight-stranded beta-barrel with
  an alpha helix located between the beta-2 and beta-3 strands and a 310 helix located between the beta-7
  and beta-8 strands. The catalytic site found in human cyclophilin is not conserved in this domain, suggesting
  a different function for this domain [[cite:PUB00039053],[cite:PUB00048358]].
