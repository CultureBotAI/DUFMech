description: This family includes sequences of largely unknown function but which share a number of features
  in common. They are expressed by bacterial species, and in many cases these bacteria are known to associate
  symbiotically with plants. Moreover, the majority are coded for by plasmids, which in many cases are
  known to confer on the organism the ability to interact symbiotically with leguminous plants. An example
  of such a plasmid is NGR234, which encodes Y4CF, a protein of unknown function that is a member of this
  family [[cite:PUB00004254]]. Other members of this family are expressed by organisms with a documented
  genomic similarity to plant symbionts [[cite:PUB00015202]].
