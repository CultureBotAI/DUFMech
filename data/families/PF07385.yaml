description: Members of this family of sugar isomerases belong to the cupin superfamily and consist of
  group I and II of D-lyxose isomerases [[cite:PUB00103833]]. The enzyme from Cohnella laevoribosii has
  been shown to be specific for D-lyxose, L-ribose, and D-mannose [[cite:PUB00075374]]. E. coli sugar
  isomerase (EcSI) shows a preference for D-lyxose and D-mannose [[cite:PUB00055252]] and its active site
  is highly similar to YdaE from the sigma B regulon of Bacillus subtilis [[cite:PUB00103833]].
