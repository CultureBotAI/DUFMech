description: NKAIN (Na,K-Atpase INteracting) proteins are a family of evolutionary conserved transmembrane
  proteins that localise to neurons, that are critical for neuronal function, and that interact with the
  beta subunits, beta1 in vertebrates and beta in Drosophila, of Na,K-ATPase. NKAINs have highly conserved
  trans-membrane domains but otherwise no other characterised domains. NKAINs may function as subunits
  of pore or channel structures in neurons or they may affect the function of other membrane proteins.
  They are likely to function within the membrane bilayer [[cite:PUB00044756]].
