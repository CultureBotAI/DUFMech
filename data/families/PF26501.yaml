description: This entry represents the N-terminal integral membrane domain of a family of uncharacterised
  proteins from halophilic archaea that contain four domains. The proteins in this family are predominantly
  found in the class Halobacteria, which includes families such as Haloferacaceae, Natrialbaceae, and
  Haloarculaceae. These proteins are typically around 400 amino acids in length. This domain contains
  three predicted transmembrane helices.
