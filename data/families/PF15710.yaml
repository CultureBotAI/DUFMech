description: Brme1 (also known as Meiok21) is a component of meiotic recombination bridges involved in
  meiotic double-strand break repair [[cite:PUB00095580],[cite:PUB00095581]]. The C-terminal domain of
  Brme1 physically interacts with the N-terminal domain of HSF2BP [[cite:PUB00095580]]. BRME1 facilitates
  the loading of RAD51 and DMC1 recombinases onto DSBs (DNA double-strand breaks) through interaction
  with MEILB2/HSF2BP and replacing ssDNA binding proteins [[cite:PUB00095581]]. Brme1 is highly expressed
  in mice testes and fetal ovaries. Knockout of Brme1 results in male mice infertility [[cite:PUB00095580]].
