description: This entry represents a domain found in eukaryotic Gag or capsid-like retrotranspon-related
  proteins, including LDOC1, and RTL1/3-8 from animals. LDOC1 is a MZF-1-interacting protein, inhibits
  NF-kappaB activation and relates with cancer and some other diseases [[cite:PUB00070719],[cite:PUB00076517],[cite:PUB00076518],[cite:PUB00076519]].
  LDOC1 is a small protein and this entry covers almost its full length. In RTL proteins, it represents
  the N-terminal capsid-like domain. RTL1 plays an essential role in capillaries endothelial cells for
  the maintenance of feto-maternal interface and for development of the placenta [[cite:PUB00091629]].
  RTL3 plays a role in postnatal myogenesis, may be involved in the regulation of satellite cells self-renewal
  [[cite:PUB00163386]].
