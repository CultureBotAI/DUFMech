description: Eukaryotic N-glycosylation is catalysed in the ER lumen, where the enzyme oligosaccharyltransferase
  (OTase) transfers donor glycans from a dolichol pyrophosphate (DolP) carrier (Lipid-linked oligosaccharide;
  LLO) to polypeptides. The yeast OTase is a hetero-oligomeric complex composed of essential (Ost1, Ost2,
  Wbp1, Stt3, and Swp1) and nonessential (Ost3, Ost4, Ost5, and Ost6) subunits. This domain family is
  found in Ost5, [swissprot:Q92316]. The precise function of this subunit is not known, however Ost5 appears
  to form a sub-complex with Ost1, and this sub-complex associates with the catalytic Stt3 subunit of
  OTase. Down regulation of Ost5 resulted in a limited effect on glycosylation and no effect on the stability
  of Ost1 or Stt3 subunits [[cite:PUB00109240],[cite:PUB00109241]].
