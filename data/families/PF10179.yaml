description: This domain is found towards the N-terminal of Neuron-derived neurotrophic factor (NDNF)
  which contains the first fibronectin type III domain and one of the predicted N-linked glycosylation
  sites [[cite:PUB00092493],[cite:PUB00092492]]. NDNF is a glycosylated and disulfide-bonded secreted
  protein expressed in brain and spinal cord that promotes migration and neurite growth. It also promotes
  endothelial cell survival, vessel formation and plays an important role in the process of revascularization.
