description: XTBD is a family of eukaryotic proteins that act as an XRN2-binding module. XRN2 is an essential
  exoribonuclease in eukaryotes that processes and degrades a number of different substrates. XTBD is
  found on a number of different proteins to link them to XRN, such as PAXT-1 [[cite:PUB00075685]].
