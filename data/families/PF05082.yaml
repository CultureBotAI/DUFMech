description: This family contains several uncharacterised bacterial proteins. These proteins are found
  in nitrogen fixation operons so are likely to play some role in this process. They consist of two alpha
  helices which are joined by a four residue linker. The helices form an antiparallel bundle and cross
  towards their termini. They are likely to form a rod-like dimer [[cite:PUB00052824]]. They have structural
  similarity to the regulatory protein Rop, [pfam:PF01815].
