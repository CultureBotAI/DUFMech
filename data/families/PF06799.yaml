description: This family consist of proteins found in plants and algal chloroplasts, and in cyanobacteria.
  It includes CGLD27 (Conserved in the green lineage and diatoms 27), which has been described as one
  out of 14 Fe-responsive orthologues in Chlamydomonas and Arabidopsis, indicating that it is an important
  component of the iron deficiency response of the plant lineage [[cite:PUB00086879]].
