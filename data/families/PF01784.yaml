causal_graphs:
- graph_id: ecoli-ybgi-fole-liquid-growth
  title: Additional ybgI deletion lowers early culture density in a folE mutant
  scope: E. coli K-12 MG1655-derived ybgI folE double mutant compared with its folE-only mutant; whole-gene
    genetic comparison, not isolated-domain biochemistry.
  context: Liquid LB with 0.3 mM deoxythymidine, starting OD600 0.1, 37 C; growth followed for 40 h with
    five replicates. The adopted comparison is the lower double-mutant OD600 during approximately 5-15
    h in Figure 8b.
  family_mapping: The study explicitly identifies E. coli YbgI as UniProtKB:P0AFP6; b0710/JW0700, sequence
    version 1, 247 residues, PF01784 spans 1-246. Reference coordinates do not imply an isolated-domain
    test.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: The result is conditional on folE deficiency and liquid-medium timing; ybgI deletion alone
    was similar to wild type. No ybgI rescue of this liquid-growth endpoint was established, and indirect
    or allele-context effects remain possible. Later prose describing better double-mutant growth on dT
    is unresolved and not generalized over the inspected curve. No metal-insertion or GTP-cyclohydrolase
    mechanism is assigned.
