description: This entry represents a domain centrally found in Phosphomevalonate dehydratase small subunit
  from Aeropyrum pernix (PMDh-S) and similar prokaryotic proteins previously annotated as aconitase X
  subunit 2, the swiveling domain subunit [[cite:PUB00080857]]. PMDh-S is a component of a hydro-lyase
  that catalyses the dehydration of mevalonate 5-phosphate (MVA5P) to form trans- anhydromevalonate 5-phosphate
  (tAHMP) [[cite:PUB00098043],[cite:PUB00154971]]. It is involved in the archaea; mevalonate (MVA) pathway,
  which provides fundamental precursos for isoprenoid biosynthesis such as isopentenyl diphosphate (IPP)
  and dimenthylallyl diphosphate (DMAPP) [[cite:PUB00098043],[cite:PUB00154970]]. This domain is also
  found at the N-terminal end of Cis-3-hydroxy-L-proline dehydratase from Agrobacterium fabrum (LhpI),
  which catalyses the dehydration of cis-3-hydroxy-L-proline (c3LHyp) to Delta1-pyrroline-2- carboxylate
  (Pyr2C) [[cite:PUB00088769]].
