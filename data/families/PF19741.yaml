description: This entry represents a member of a biosynthetic gene cluster (BGC). This BGC (BGC0001774)
  is described by MIBiG as an example of the following biosynthetic class, other (unspecified). It includes
  a member from the MS-271 biosynthetic gene cluster from Streptomyces sp [[cite:PUB00099453]]. This family
  appears to be predominantly found in Actinobacteria. Some members of this family have been identified
  as putative cholesterol esterases.
