description: This domain family corresponds to the N-terminal of CD-NTase associated protein 4 (Cap4)
  from bacteria and archaea. CD-NTase-associated protein 4 (Cap4) is a nucleotide second messenger sensor
  that functions is CBASS immunity. This is the effector domain which has dsDNA nuclease activity, sharing
  structural homology with type II restriction endonucleases and it has the putative active-site conserved
  residues required for divalent metal coordination. This domain is inactive as a monomer; after Cap4
  signal recognition through its C-terminal SAVED domain ([pfam:PF18145]), it oligomerises to closely
  locate two nuclease effector domains. This domain does not participates in ligand specificity and it
  has a promiscuous DNA cleavage response [[cite:PUB00094500]].
