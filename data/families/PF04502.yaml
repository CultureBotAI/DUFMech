description: This is a family of eukaryotic proteins that includes CCDC130 and CCDC94 from humans, Saf4
  from fission yeasts and Yju2 from budding yeasts. Saf4 (also known as cwc16) is involved in mRNA splicing
  where it associates with cdc5 and the other cwf proteins as part of the spliceosome [[cite:PUB00008533]].
  Yju2 is a splicing factor that is associated with the Prp 19-associated complex and acts after Prp2
  in promoting the first catalytic reaction of pre-mRNA splicing [[cite:PUB00079198]].
