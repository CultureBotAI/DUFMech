description: This entry represents the cupin domain, with a conserved jelly roll-like beta-barrel fold
  capable of homodimerisation found in bacteria, plant and fungi. It is present in EutQ family from the
  eut operon, involved in ethanolamine degradation. EutQ is essential during anoxic growth and has acetate
  kinase activity [[cite:PUB00096913]]. The cupin domain from EutQ does not possess the His residues responsible
  for metal coordination in other classes of cupins [[cite:PUB00063996]]. This domain is also found in
  (S)-ureidoglycine aminohydrolase (UGlyAH) from E.coli, which is involved in the anaerobic nitrogen utilisation
  via the assimilation of allantoin. It catalyses the deamination of allantoin to produce S-ureidoglycolate
  and ammonia from S-ureidoglycine [[cite:PUB00078751],[cite:PUB00096858]].
