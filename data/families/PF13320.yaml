description: This domain is found at the C terminus of protein members of the glycoside hydrolase family
  123, including N-acetylgalactosaminidase from Clostridium perfringens. This enzyme removes specific
  terminal N-D-acetylgalactosamine from glycosphingolipids. This catalytic domain adopts an alpha/beta
  barrel configuration with a two-stranded beta sheet and a pair of alpha-helices at the C-terminal end
  [[cite:PUB00100654],[cite:PUB00151590]].
