description: CRISPR (clustered regularly interspaced short palindromic repeats) elements and cas (CRISPR-associated)
  genes are widespread in Bacteria and Archaea. The CRISPR/Cas system operates as a defense mechanism
  against mobile genetic elements (i.e., viruses or plasmids). Csa1 is part of the archaeal subtype I-A
  system. Cas1 has not yet been enzymatically characterised [[cite:PUB00073621]].
