description: 'This family was first named TPM domain after its founding proteins: TLP18.3, Psb32 and MOLO-1.
  In Arabidopsis, this domain is called the thylakoid acid phosphatase -TAP - domain and has a Rossmann-like
  fold [[cite:PUB00056969]]. In plants, the family resides in the thylakoid lumen attached to the outer
  membrane of the chloroplast/plastid. It is active in the photosystem II [[cite:PUB00057495],[cite:PUB00078747]].'
