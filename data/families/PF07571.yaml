description: TAF6_C is the C-terminal domain of the TAF6 subunit of the general transcription factor TFIID.
  The crystal structure reveals the presence of five conserved HEAT repeats. This region is necessary
  for the complexing together of the subunits TAF5, TAF6 and TAF9 [[cite:PUB00075536],[cite:PUB00099783],[cite:PUB00122818]].
