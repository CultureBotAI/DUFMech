description: This family consists of anthrone oxygenases found in bacteria and fungi, and involved in
  the synthesis of different products. GedH from Aspergillus terreus is part of the gene cluster that
  mediates the biosynthesis of geodin [[cite:PUB00081405]], EncC from Neosartorya fumigata is involved
  in the biosynthesis of endocrocin [[cite:PUB00081406]], and MdpH from Aspergillus nidulans in the biosynthesis
  of monodictyphenone [[cite:PUB00081407]].
