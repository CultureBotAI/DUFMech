description: This entry represents a likely zinc-binding domain found at the C-terminus of a set of archaebacterial
  proteins, including CdpA (Cell division protein A, HVO_0739) from Haloferax volcanii, a a ring assembly
  and anchor protein that forms part of an anchor complex linked to FtsZ2 and other cell division proteins.
  This domain plays a significant role in cell division but its specific function is currently unknown
  [[cite:PUB00161026]]. AlphaFold prediction show a structure forming 2-3 beta strands.
