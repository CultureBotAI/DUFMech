description: This family of proteins is functionally uncharacterised.This family of proteins is found
  in bacteria. Proteins in this family are approximately 140 amino acids in length. These proteins share
  two CXXC motifs suggesting these are zinc binding proteins. This protein is found in clostridia in an
  operon with three signalling proteins, suggesting this protein may be a DNA-binding transcription regulator
  downstream of an as yet unknown signalling pathway (Bateman A pers obs).
