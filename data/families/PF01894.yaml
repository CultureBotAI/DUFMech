description: This family includes YjbQ from Escherichia coli, its orthologue from Pyrococcus furiosus
  and similar sequences. These proteins have been shown to have sufficient thiamine phosphate synthase
  activity to complement thiE mutants. However, it is presumed that this is a secondary activity, and
  the primary function of the YjbQ family enzyme remains unknown [[cite:PUB00101019],[cite:PUB00101020]].
