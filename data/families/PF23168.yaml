description: This domain is found N-terminal in the homologues of human Cullin-7 (CUL7) and Cullin-9 (CUL9).
  It adopts a beta-barrel structure with some similarity to chromodomains and is known as a small beta-domain
  (SBD) [[cite:PUB00156050],[cite:PUB00155195]]. In both CUL7 and CUL9, this domain is usually followed
  by an ARM-like domain.
