description: Hachiman antiphage defense system has been described in Ralstonia solanacearum species complex
  (RSSC), and is composed of two genes, hamAB, which encode a protein of unknown function HamA, represented
  in this entry, and an helicase (HamB). Only one strain (KACC10722) from phylotype IV shows this system
  complete and both genes are organised in an operon [[cite:PUB00097806],[cite:PUB00097805]].
