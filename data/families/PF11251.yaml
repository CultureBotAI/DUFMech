description: This entry, previously known as DUF3050, represents HamA, the key enzyme responsible for
  forming the nitrogen-nitrogen bond in the diazeniumdiolate moiety of fungicide fragin [[cite:PUB00163876]].
  HamA adopts a heme oxygenase-like fold, forming a hydrophobic cavity within a helical bundle that likely
  accommodates the substrate [[cite:PUB00163876]].
