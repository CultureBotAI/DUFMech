description: This entry represents a conserved repeated domain found twice in FAZ1 from Trypanosoma brucei
  and similar sequences from trypanosomatids [[cite:PUB00155625]]. This domain is found near the central
  region and at the very C-terminal of FAZ1. At least 50% of the T. cruzi genome is repetitive sequence,
  consisting mostly of large gene families of surface proteins, retrotransposons, and subtelomeric repeats
  [[cite:PUB00155626]].
