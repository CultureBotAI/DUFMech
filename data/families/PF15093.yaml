description: This family (previously DUF4555) includes the homologs of human sperm-associated microtubule
  inner protein 4 (SPMIP4) that is found predominantly in testis [[cite:PUB00151495]]. SPMIP4 is a microtubule
  inner protein (MIP) part of the axonemal dynein-decorated doublet microtubules (DMTs). Members of this
  family adopt rather extended conformation and contain a single or multiple Mn motifs. Each Mn motif
  consists of a 5- to 6-residue helix flanked by a Tyr/Phe residue on one end and by a Ser/Thr on the
  other that binds the shoulder of the alpha-tubulin S9/S10 loop [[cite:PUB00151502]]. Members of this
  family are likely to stabilise the microtubule structure in the sperm flagella [[cite:PUB00151496]].
