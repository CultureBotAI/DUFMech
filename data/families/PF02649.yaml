description: This is a family of prokaryotic proteins with type I GTP cyclohydrolase activity. GTP cyclohydrolase
  I is the first enzyme of the de novo tetrahydrofolate biosynthetic pathway present in bacteria, fungi,
  and plants, and encoded in Escherichia coli by the folE gene; it is also the first enzyme of the biopterin
  (BH4) pathway in Homo sapiens[[cite:PUB00051207]]. The invariate, highly conserved glutamate residue
  at position 216 in [swissprot:Q5F9K6] is likely to be the substrate ligand and the metal ligand is likely
  to be the cysteine at position 147. The enzyme is Zinc 2+ dependent [[cite:PUB00057465]].
