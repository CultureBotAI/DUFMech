description: This entry, previously known as DUF2877, represents the Oxamate carbamoyltransferase subunit
  AllH and related bacterial proteins. AllH is a component of a carbamoyltransferase involved in the anaerobic
  nitrogen utilization via the assimilation of allantoin [[cite:PUB00155434]]. It catalyses the conversion
  of oxalurate (N-carbamoyl-2-oxoglycine) to oxamate and carbamoyl phosphate.
