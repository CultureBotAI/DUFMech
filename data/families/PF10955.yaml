description: Fin (formerly known as YabK) is a small protein required for efficient switching from sigma(F)-
  to sigma(G)-directed gene expression during sporulation in Bacillus subtilis. Fin has been proposed
  to be an anti-sigma(F) factor which, by disabling sigma(F), promotes the switch to late developmental
  gene expression in the forespore [[cite:PUB00078865]].
