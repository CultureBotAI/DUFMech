description: This eukaryotic family includes a number of plant organ-specific proteins. The predicted
  amino acid sequence suggests that these proteins could be exported and glycosylated [[cite:PUB00056161]].
  Family members consist of an N-terminal region with no repeats and a C-terminal region which carries
  multiple tandem repeats. The N-terminal region ends before the repeats region and is defined as the
  area that extends from the end of the signal peptide to the start of the tandem repeat region. Its length
  varies considerably, ranging from 30 to 80 amino acids. Generally, these proteins vary in size where
  it is suggested that thirty-six percent of the sequences had fewer than 150 amino acids; 41% ranged
  from 150 to 250, and 23% had more than 250 amino acids. Accordingly, these proteins belong to category
  II of proteins having repeats in tandem; that is, those with the repeats ranging in length from 20 to
  40 residues. The second region (C-terminal) in the mature protein is the tandem repeat oligopeptide
  area. The repeats start with a common hexapeptide (E/D)FEPRP and end with X4Y i .e. (D/E)FEPRPX4Y. Full-length
  sequences revealed considerable variability in the number of repeats, ranging from 2 to 17. The length
  of the repeats also varied, ranging from 12 amino acids to 34 amino acids [[cite:PUB00109583]].
