description: Family in the SLOG superfamily, related to YspA and cpYpsA families and shows associations
  with NAD utilization and ADP-ribosylation domains including NUDIX, NADAR and MACRO. Members of this
  family are predicted to function as sensors of nucleotide, nucleotide-derived ligands, or nucleic acids,
  which are potentially processed/modified by associating effectors. Also associates in a distinct system
  with a phosphoribosyltransferase (PRTase) domain [[cite:PUB00091021]].
