description: This is a family of short uncharacterised proteins predominantly found in bacteria. This
  model matches four of the twelve transmembrane helices of cytochrome c and quinol oxidase subunit I
  ([pfam:PF00115]) and contains the HxH motif conserved in both. A DALI search suggests that this family
  may be related to Cox1, however, there is no evidence for the involvement of this family in any Cox1-like
  assembly. AlphaFold prediction suggests that these proteins contain four transmembrane alpha helices
  which can for a homotrimeric complex.
