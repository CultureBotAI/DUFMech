description: This family consists of proteins predominantly found in bacteria, including Alkaline phosphatase
  PhoX from Pseudomonas fluorescens ([swissprot:Q3K5N8]), a phosphomonoesterase with no phosphodiesterase
  activity. This protein adopts a six-bladed beta-propeller fold, with the active site located at the
  bottom of the cavity at the centre of the propeller [[cite:PUB00100675]].
