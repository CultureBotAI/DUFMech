description: This is a domain found predominantly in eukaryotes and associated with [pfam:PF00628] [pfam:PF01753]
  [pfam:PF00439] [pfam:PF00855]. Family members include protein kinase C-binding protein 1 (also known
  as ZMYND8) which acts as a transcriptional corepressor of the H3K4 demethylase JARID1D [[cite:PUB00085454]].
  ZMYND8 (zinc finger and MYND [myeloid, Nervy, and DEAF-1] domain containing 8) binds acetylated damaged
  chromatin, including actively transcribed regions, as a means of recruiting the nucleosome remodeling
  and histone deacetylation (NuRD) chromatin remodeling complex for transcriptional repression and DNA
  double-strand break (DSB) repair by homologous recombination (HR) [[cite:PUB00103635]].
