description: This family, which contains bacterial and fungal glycoside hydrolases, is also known as GH125.
  They function as metal-independent alpha-mannosidases, with specificity for alpha-1,6-linked non-reducing
  terminal mannose residues[[cite:PUB00055745]]. Structurally this family is part of the 6 hairpin glycosidase
  superfamily.
