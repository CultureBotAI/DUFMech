description: This Pleckstrin homology (PH) domain is found in the middle region of Rttp106, a histone
  chaperone involved in heterochromatin-mediated silencing [[cite:PUB00033392]]. It is also found in the
  final part of the middle domain of various FACT (facilitates chromatin transactions) complex subunits,
  such as Spt16 and either Pob3 (yeast) or the related SSRP1 (higher eukaryotes). This domain plays a
  role in DNA binding [[cite:PUB00101033],[cite:PUB00101035],[cite:PUB00101032]].
