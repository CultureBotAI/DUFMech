description: This entry includes coiled-coil domain-containing proteins 90 (CCDC90) and related proteins.
  CCDC90A is a key regulator of the mitochondrial calcium uniporter (MCU) and hence was renamed MCUR1
  [[cite:PUB00097799],[cite:PUB00076354],[cite:PUB00097801]]. A study in mammals and in yeast homologue
  fmp32 has reported that MCUR1 is a cytochrome c oxidase assembly factor and that it has an indirect
  role as a regulator of MCU [[cite:PUB00075452]], however, subsequent publications confirmed the function
  of MCUR1 as a regulator of MCU [[cite:PUB00097799],[cite:PUB00097800]]. The role of CCDC90B proteins
  is still not known.
