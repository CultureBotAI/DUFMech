description: Pupylation is a novel protein modification system found in some bacteria [[cite:PUB00053382]].
  This family of proteins are the enzyme that can conjugate proteins of the Pup family to lysine residues
  in target proteins marking them for degradation. The archetypal protein in this family is PafA (proteasome
  accessory factor) from Mycobacterium tuberculosis [[cite:PUB00053383]]. It has been suggested that these
  proteins are related to gamma-glutamyl-cysteine synthetases [[cite:PUB00053382]].
