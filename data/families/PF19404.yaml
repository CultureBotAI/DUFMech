description: This entry represents a small domain that is found in tandem repeats in Bacteroidota bacterial
  surface proteins, commonly associated with PA14 adhesive domain. This domain is composed of a beta hairpin
  followed by an alpha helix. There is a conserved pair of cysteine residues in each domain that form
  a disulphide bridge that presumably stabilises this small domain.
