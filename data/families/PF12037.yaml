description: This is the conserved N-terminal domain of ATPase family AAA domain-containing protein 3
  (ATAD3) which is involved in dimerisation [[cite:PUB00097486]] and interacts with the inner surface
  of the outer mitochondrial membrane [[cite:PUB00089261]]. This domain is found associated with the AAA
  ATPase domain ([pfam:PF00004]). ATAD3 is essential for mitochondrial network organisation, mitochondrial
  metabolism and cell growth at organism and cellular level. It may also play an important role in mitochondrial
  protein synthesis.
