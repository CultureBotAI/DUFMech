description: Programmed cell death 10 protein (PDCD10/CCM3) is part of the CCM complex and is required
  for neuronal migration [[cite:PUB00076417]]. Outside of this complex, it is crucial in vascularization
  and in angiogenesis as it functions in vessel permeability and stability [[cite:PUB00096889]]. PDCD10/CCM3
  contains an N-terminal dimerisation domain and a C-terminal focal adhesion targeting-homology (FAT-H)
  domain (represented in this entry) [[cite:PUB00076418]].
