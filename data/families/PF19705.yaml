description: This entry represents PolF haem-oxygenase-like diiron oxidase which converts the desaturated
  l-isoleucine to polyoximic acid via an intramolecular C-N cyclization [[cite:PUB00164341]]. PolF exhibits
  dual functionality, orchestrating the sequential desaturation and cyclization with l-isoleucine as the
  initial substrate [[cite:PUB00164341]]. PolF folds into a seven-helix bundle, with three core helices
  coordinating the iron cofactor. Members of this family contain a highly conserved H-X3-E-X2-H sequence
  motif that completes the coordination of the diiron cofactors. A member belongs to a biosynthetic gene
  cluster (BGC). This BGC (BGC0000877) includes a member from the polyoxin A biosynthetic gene cluster
  from Streptomyces cacaoi subsp. asoensis [[cite:PUB00098985],[cite:PUB00098986]].
