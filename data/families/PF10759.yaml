description: This is a family of bacterial proteasome cofactors. The family member from Mycobacterium
  tuberculosis, protein Rv3780, was shown to form rings and cap proteasome core particles. It enhanced
  peptide and protein degradation by proteasomes in an adenosine triphosphate (ATP)-independent manner,
  promoting degradation of the heat shock protein repressor HspR [[cite:PUB00076684],[cite:PUB00109445]].
