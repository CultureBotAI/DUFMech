description: This entry represents a beta barrel domain found in primarily in bacteria, but also in archaea
  and in kinetoplastids. Proteins in this family are typically between 150 and 242 amino acids in length.
  The domain is often found in integral membrane proteins. This family contains the Tsi4 immunity protein
  from P. aeruginosa which acts as an immunity protein to the Tse4 toxin [[cite:PUB00155609]]. AlphaFold
  multimer modelling shows that these two protein are likely to interact directly.
