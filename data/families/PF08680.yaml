description: This entry represents sporulation protein SpoIIT and related proteins. TATA-box_bdg is a
  family of bacterial proteins.SpoIIT from Bacillus subtilis contains a circularly permuted TATA-box binding
  protein-like fold. It participates in cell-cell signalling pathways during sporulation. It functions
  in the SpoIIGA-dependent proteolytic activation of sigma E in the mother cell [[cite:PUB00162567]].
