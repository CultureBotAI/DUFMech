description: This entry represents the N-terminal domain of bacterial proteins, such as the dermonecreotic
  toxin (ToxA) from Pasteurella multocida, an osteolytic toxin that induces bone resorption. It is a potent
  mitogen. This toxin is associated with the severe progressive form of the atrophic rhinitis a major
  respiratory disease in pigs. This domain contributes to the membrane localisation of its C-terminal
  domains [[cite:PUB00040389]].
