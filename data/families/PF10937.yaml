description: This entry represents the alpha-ketoglutarate dehydrogenase component 4 (Kgd4, also referred
  to as Ymr31/MRPS36) which was originally identified as a subunit of the mitochondrial ribosome [[cite:PUB00056057],[cite:PUB00012961],[cite:PUB00010175]].
  Through biochemical studies, it was shown that this protein co purifies with the oxoglutarate dehydrogenase
  complex (OGDC). Both mitochondrial ribosome 28S subunit and OGDC have a similar size and OGDC is highly
  abundant, being found to contaminate ribosomal preparations [[cite:PUB00089008]]. Kgd4 plays an evolutionarily
  conserved role in the organisation of mitochondrial alpha-KGDH complexes of fungi and animals which
  constitutes a molecular adaptor that is necessary to form a stable alpha-KGDH enzyme complex [[cite:PUB00089008],[cite:PUB00100356]].
