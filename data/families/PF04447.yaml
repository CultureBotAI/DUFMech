description: This domain is found in phage proteins, such as A0A2H5BHG5 from Acinetobacter phage SH-Ab
  15497, which are associated with PurZ, an enzyme that catalyses the synthesis of diaminopurine (Z),
  a DNA modification that gives phages an advantage for evading host restriction enzymes activity [[cite:PUB00097959]].
  This domain has dATP and dGTP pyrophosphohydrolase activity; it catalyses the hydrolysis of dATP/dGTP
  to pyrophosphate and dAMP/dGMP, respectively, with little or no activities for NTPs and pyrimidine dNTPs.
  It is suggested that enzymes containing this domain supply dGMP as the substrate for PurZ, elevating
  dZTP level to promote Z incorporation [[cite:PUB00097959]].
