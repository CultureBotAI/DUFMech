description: BMFP consists of two structural domains, a coiled-coil C-terminal domain via which the protein
  self-associates as a trimer, and an N-terminal domain disordered at neutral pH but adopting an amphipathic
  alpha-helical structure in the presence of phospholipid vesicles, high ionic strength, acidic pH or
  SDS. BMFP interacts with phospholipid vesicles though the predicted amphipathic alpha-helix induced
  in the N-terminal half of the protein and promotes aggregation and fusion of vesicles in vitro.
