description: This family represents bacterial proteins predominantly found in Gammaproteobacteria. YggL
  from E.coli has been characterised and it interacts with ribosome subunits 50S and 70S. It is a 50S-binding
  protein likely to be involved in particle assembly. It is a small protein extremely conserved in Gammaproteobacteria
  but also present in orders Burkholderiales and Neisseriales from Betaproteobacteria [[cite:PUB00095181]].
