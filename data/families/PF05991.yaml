description: This family consists of bacterial proteins related to YacP. This family is uncharacterised
  functionally, but it has been suggested that these proteins are nucleases due to them containing a NYN
  domain. NYN (for N4BP1, YacP-like Nuclease) domains were discovered by Anantharaman and Aravind [[cite:PUB00056584]].
  Based on gene neighborhoods it was suggested that the bacterial YacP proteins interact with the Ribonuclease
  III and TrmH methylase in a processome complex that catalyzes the maturation of rRNA and tRNA [[cite:PUB00056584]].
