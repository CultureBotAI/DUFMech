description: This family contains repetitive element (RE) from a subgroup of HECT E3 ubiquitin ligases
  and the Y-family translesion polymerases, including human HUWE1 and Arabidopsis UPL1. Each of these
  repetitive elements are approximately 20 amino acids in length and contain two predicted helical segments
  separated by a Leu-Pro motif. The REs from the Y-family polymerases were shown to bind ubiquitin and
  were the basis for a novel ubiquitin-binding domain called the ubiquitin-binding motif (UBM) [[cite:PUB00091009]].
