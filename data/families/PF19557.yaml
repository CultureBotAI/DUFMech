description: This entry (ex DUF6079) represents the P-loop domain at the N-terminal in Probable ATP-binding
  protein BrxC and ATPase pglY. BrxC is a core protein of a type 1 BREX system, which provides immunity
  against bacteriophage. The ATPase PglY is part of a type 2 BREX system, which provides immunity against
  bacteriophage infections [[cite:PUB00093365],[cite:PUB00161155],[cite:PUB00151239],[cite:PUB00105105]].
  PglY hydrolyses ATP but not other nucleotides, and its activity is inhibited by the non-hydrolysable
  ATP analogue 5-adenylyl beta,gamma-imidodiphosphate.
