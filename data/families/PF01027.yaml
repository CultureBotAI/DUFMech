causal_graphs:
- graph_id: yetj-ph-and-d171n-calcium-flux
  title: Lower pH and D171N reduce calcium influx in the 2020 BsYetJ proteoliposomes
  scope: BsYetJ-containing proteoliposomes in the 2020 Figure 5C transport assay. The separate nanodisc
    DEER experiments and human Bax-inhibitor phenotypes are not this causal system.
  context: Fura-2-preloaded proteoliposomes receive externally added calcium. Figure 5C compares WT and
    D171N at pH 6, 7 and 8; influx is reported in nM/min with SEM and n=3. Exact lipids, protein/lipid
    ratio, calcium and dye doses, buffers, temperature, time window and tag are in uninspected supplementary
    methods and remain unresolved.
  family_mapping: B. subtilis 168 reference UniProtKB:O31539, current calJ alias yetJ, BSU07200, has 214
    residues and sequence version 1; exact UniProt/InterPro sequence agreement. PF01027 spans 10-210 inclusive
    and contains D171. Complete experimental clone, background substitutions and tag are not independently
    verified; a 2019 Delta5 crystallographic construct is not transferred to this assay.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:1423
  limitations: Directness refers to the measured membrane calcium-flux endpoint, not observed D171 protonation,
    salt-bridge disruption or pore motion. The earlier study's pH-7 optimum differs from the pH-8 maximum
    here; no universal pH rule is inferred. Panel C does not display an empty-liposome control, so no
    purified-protein sufficiency edge is added. Mutation can affect assembly or incorporation as well
    as gating. Exact supplementary methods and raw traces remain uninspected.
