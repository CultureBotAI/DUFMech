description: This domain found in archaeal proteins, including PF2050 from Pyrococcus furiosus ([swissprot:Q8TZE5]).
  PF2050, with an overall globular structure, contain this domain twice, each showing an antiparallel
  beta-sheet and an alpha-helical bundle, and shows a positively charged basic cleft on one side. This
  protein interacts with circular and linear dsDNA [[cite:PUB00100885]].
