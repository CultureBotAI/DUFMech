description: This entry represents the catalytic C-terminal domain of the LpxI enzyme that is involved
  in biosynthesis of lipid A. Specifically it carried out the hydrolysis of UDP-2,3-diacyl- glucosamine.
  This step is either carried out by LpxI or LpxH [[cite:PUB00091500]]. This domain comprises a five-stranded
  mixed beta-sheet bracketed by one alpha-helix on one side and three on the other. This domain is structurally
  related to a superfamily that includes cytosine deaminase [[cite:PUB00091500]].
