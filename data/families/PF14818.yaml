description: This entry represents a coiled-coil region found in microtubule cross-linking factors 1 and
  2 (also known as SOGA1/2), which are members of the SOGA (suppressor of glucose by autophagy) family
  and in the uncharacterised human protein KIAA0408. SOGA1 regulates autophagy by playing a role in the
  reduction of glucose production in an adiponectin- and insulin-dependent manner [[cite:PUB00067397]].
  SOGA1/2 are required for faithful chromosome segregation during mitosis [[cite:PUB00153172]]. These
  proteins contain long coiled-coils that dimerize and holds two N-terminal domains that bind to microtubules
  [[cite:PUB00153172]]. This region is found in association with [pfam:PF11365].
