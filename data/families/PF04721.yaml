description: The PAW domain is found at the C-terminus of PGNase, or peptide-N-glycanase, enzymes. It
  was named for 'domain present in PNGases and other worm proteins' [[cite:PUB00011448]]. PNGase catalyses
  the deglycosylation of several misfolded N-linked glycoproteins by cleaving off the bulky glycan chain
  before these proteins are degraded by the proteasome. PNGase specifically acts on the unfolded form
  of high-mannose type N-glycosylated proteins, and this domain appears to be the mannose-binding domain,
  which contributes to the oligosaccharide-binding specificity of PNGase [[cite:PUB00041628]].
