description: Proteins containing this domain include early growth response protein 1/2/3 (EGR1/2/3). EGR1
  is a transcriptional regulator that binds specifically to 9-bp target sequences containing two CpG sites
  that can potentially be methylated at four cytosine bases [[cite:PUB00086408]]. EGR2, also known as
  Krox20, is an E3 ligase that sumoylates its Nab coregulators [[cite:PUB00086407]]. This domain has a
  single completely conserved residue P that may be functionally important. Furthermore, it is found associated
  with [pfam:PF00096].
