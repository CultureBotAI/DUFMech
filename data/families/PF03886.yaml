description: ABC_trans_aux is a family of bacterial proteins that act as auxiliarires to the ABC-transporter
  in the gamma-hexachlorocyclohexane uptake permease system in Sphingobium japonicum. Gamma-hexachlorocyclohexane,
  or Lindane, can be used as the sole source of carbon in S.japonicum in aerobic conditions. Lindane is
  an insecticide [[cite:PUB00075438]].
