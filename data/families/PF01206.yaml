- graph_id: ecoli-tusa-fes-assembly-readout
  title: Equimolar TusA reduces the IscU Fe-S assembly-associated optical signal
  scope: Concentration-dependent effect of E. coli TusA in the reconstituted IscS/IscU system, retaining
    the observed optical outcome separately from the proposed sulfur-diversion mechanism.
  context: Figure 5A/D compares 0, 1, 5, 10 and 50 uM TusA with 50 uM IscU, 25 uM Fe2+, 1 uM IscS and
    250 uM L-cysteine in anaerobic 50 mM Tris-HCl, 100 mM NaCl, pH 8. Reductants are either 2 mM DTT or
    the conjunction of 1 uM Fdx, 1 uM Fpr and 100 uM NADPH. Following 30 min preincubation, IscS and cysteine
    initiate the reaction. A456 is recorded every 5 min for 40 min in independent triplicates; assay temperature
    is not specified in the inspected caption.
  family_mapping: TusA is mapped to the 81-aa E. coli K12 reference P0A890, PF01206 residues 10-79, not
    to all TusA-like paralogs. Full experimental clone sequence and template strain remain unverified.
    IscU was His6-tagged then thrombin-cleaved according to the 2024 Methods.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:562
  limitations: A456 is a biochemical assembly readout, not direct atom tracing or identification of a
    inhibited elementary reaction. Lower TusA doses do not show the same clear reduction. Protein competition
    and sulfur diversion are explanatory models, not additional observed edges. The B/E spectral caption's
    yellow-line reference is inconsistent with the no-TusA red-line key; only the A/D concentration time
    courses are adopted.
