discussions:
- discussion_id: tusa-sulfur-relay-and-clone-coverage
  prompt: Resolve the experimental clone sequence and extend primary-evidence coverage to TusA sulfur
    relay, tRNA thiolation and Moco contexts.
  kind: CURATION_TODO
  status: OPEN
  rationale: Two 2024 assay contexts do not cover the full TusA mechanism or its paralogs. Direct sulfur-transfer
    chemistry needs its own inspected primary evidence; protein binding and reduced assembly signal alone
    do not establish that chain.
  evidence:
  - reference: PMID:38980029
    supports: PARTIAL
    evidence_source: full_text
    explanation: Figures 1 and 5 were visually inspected. Native MS supports mixed complexes, while intracellular
      concentrations and sulfur partitioning remain proposed explanations.
  - reference: PMID:23281480
    supports: PARTIAL
    evidence_source: selected_full_text
    explanation: The cited 2013 Table 1 establishes the pJD34 expression-vector lead, not the complete
      2024 clone sequence. Its cellular phenotypes were not independently adopted in this graph batch.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: The 2006 sulfur-relay study PMID:16387657 and additional 2024 TusA/Fur and CyaY studies remain
