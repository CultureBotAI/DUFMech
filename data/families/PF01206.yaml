    subject: tusa-present-with-iscs
    predicate: increases
    object: iscs-sulfide-production
    mechanism: The purified IscS-TusA preparation produces sulfide at about three times the activity of
      IscS alone under the stated conditions. This is a directly tested protein-dependent biochemical
      effect, without assigning an elementary catalytic or cellular regulatory mechanism.
