causal_graphs:
- graph_id: ecoli-tusa-desulfurase-assay
  title: TusA increases purified IscS sulfide-production activity
  scope: Recombinant E. coli TusA and IscS in the 2024 purified-protein assay; not all PF01206 members,
    an isolated domain or intracellular sulfur flux.
  context: Figure 1 uses gel-filtered precomplexes formed at a 1:3 IscS-to-partner ratio for 20 min at
    30 C in 50 mM Tris-HCl, 200 mM NaCl, pH 8. Activity is measured over 10 min at 30 C with 1 mM DTT
    and 1 mM L-cysteine by methylene-blue sulfide quantification against Na2S standards. IscS alone and
    TusA alone are controls. The paper reports BL21(DE3) expression and untagged TusA/IscS for interaction
    studies; exact Figure 1 protein doses and complete clone sequences remain unverified.
  family_mapping: E. coli K12 reference UniProtKB:P0A890 (tusA/sirA/yhhP, b3470/JW3435), sequence version
    1, 81 aa, maps to PF01206 at 10-79 inclusive. InterPro and UniProt sequences agree. The cited 2013
    protocol lists pJD34, tusA in pET11b; the 2024 cloning template strain is not independently verified.
    BL21 is the expression host, not an inferred template identity.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:562
  limitations: The readout is sulfide release in a reducing biochemical assay. It does not resolve allosteric
    activation versus sulfur-acceptor turnover, a specific residue's chemistry, intracellular sulfur partitioning
    or tRNA/Moco synthesis. TusA alone has no detected assay activity. Mixed IscS2/IscU/TusA complexes
    occur in the study, so mutually exclusive occupancy of an entire IscS dimer is not assumed.
  nodes:
