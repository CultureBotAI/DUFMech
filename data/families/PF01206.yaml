    label: Purified TusA present with IscS in the cysteine/DTT assay
    node_type: PERTURBATION
    grounding:
    - UniProtKB:P0A890
  - node_id: iscs-sulfide-production
    label: IscS sulfide-production activity measured by methylene blue
