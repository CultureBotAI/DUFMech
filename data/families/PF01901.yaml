- graph_id: o157-wzy-tn5-tube-staining-2020
  title: Wzy disruption reduces tube biofilm staining in the tested O157 strain
  scope: Sheng2020 Figure1B; ATCC43895 wzy-Tn5 versus its parental culture.
  context: Qualitative crystal-violet tube assay at37 C under static conditions. The30 C library screen
    is a separate assay, not a replicate of this endpoint.
  family_mapping: The2024follow-up cites CP008957.1; AIG69277.1/EDL933_3111 equals Q8X4T7/BAB36267.1,394
    aa,PF01901 8-205,score0.041. ATCC documents ATCC700927 as derived from ATCC43895. Their lineage relationship
    is established; the experimental stock, insertion junction and affected domain segment are not independently
    sequenced here.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83334
  limitations: No Wzy-specific rescue or downstream-expression control was established. csgB complementation
    is not wzy rescue. The later2024study retains residual biofilm under its conditions; do not infer
    universal absence or direct PF01901 chemistry.
