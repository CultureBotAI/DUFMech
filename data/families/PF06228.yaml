description: This family is found within haem utilisation operons. It has a similar structure to that
  of [pfam:PF05171]. [pfam:PF05171] usually occurs as a duplicated domain, but this domain occurs as a
  single domain and forms a dimer. The organisation of the dimer is very similar to that of the duplicated
  [pfam:PF05171] domains [[cite:PUB00041480],[cite:PUB00048554]]. It binds haem via conserved histidines
  [[cite:PUB00048554]].
