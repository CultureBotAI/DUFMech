- graph_id: ecoli-ybey-rnaser-defective-70s
  title: Joint YbeY and RNase R treatment degrades rRNA in defective 70S preparations
  scope: In vitro treatment of separate 70S preparations from E. coli MC4100 delta-ybeY and kasugamycin-treated
    MC4100; the two substrate contexts are distinct comparisons within Figure 3, not independent replications.
  context: Isolated 70S at 5.5 uM with YbeY and commercial RNase R at 5 uM each; the kasugamycin culture
    condition is 200 ug/mL. Main reaction methods specify 20 uL and 50 mM HEPES pH 7.5. rRNA is extracted
    after treatment and resolved by Synergel/agarose electrophoresis. Exact Figure 3 incubation time,
    temperature and additional buffer components require the unavailable extended methods.
  family_mapping: E. coli YbeY maps from historical P77385 to UniProtKB:P0A898, b0659/JW0656, reference
    sequence version 1, PF02130 at 21-144 of 155 residues. The graph concerns the intact-protein preparation
    in conjunction with RNase R, not a sufficient isolated PF02130 domain.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: Neither enzyme alone nor H114A/H124A YbeY plus RNase R gives the adopted rRNA-band-loss
    endpoint. Matched wild-type 70S and 30S controls resist treatment. Ordered initiation and exonucleolytic
    microsteps remain proposed, and gel band loss does not demonstrate degradation of ribosomal proteins.
    Purification tag and full construct details remain unresolved; in vivo quality-control flux and polysome
    endpoints are not adopted here.
