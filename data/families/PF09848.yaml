description: This domain is found in at the C terminus of group 3 Schlafen proteins from mammals, and
  represents the DNA/RNA helicase domain [[cite:PUB00070629]]. Schlafen proteins are involved in the control
  of cell proliferation, induction of immune responses, and in the regulation of viral replication [[cite:PUB00070625],[cite:PUB00070629],[cite:PUB00098266]].
  These proteins inhibit DNA replication and promote cell death in response to DNA damage. They play a
  role in genome surveillance to kill cells with defective replication [[cite:PUB00098266]]. This domain
  is also found in various uncharacterised prokaryotic proteins fused to a DNA helicase, GIY-YIG or PD-(D/E)XK
  catalytic domain or HsdR-N(terminal) domain, which are similar to AAA DNA helicase, Type III restriction
  enzyme ATPase, RecD and RuvB helicase [[cite:PUB00098266]].
