description: Complex III (cytochrome bc1) is a protein complex of the mitochondrial inner membrane that
  transfers electrons from ubiquinol to cytochrome c. UQCC3 functions in complex III assembly. The human
  UQCC3 is the ortholog of the fungal complex III assembly factor CBP4 [[cite:PUB00087489]]. It is also
  a potent antiviral protein independent of interferon production [[cite:PUB00087490]].
