- graph_id: pab1135-probe-comparisons
  title: Changing the RNA probe changes the PAB1135 binding readout
  scope: Luz2010 Figure3, matched protein doses across the three synthetic probes.
  context: Each probe is supplied at 1 pmol with 50, 100, 200 or 400 pmol trypsin-treated PAB1135; 20
    ul, 30 min at 37 C in the same reported Mn-containing buffer. Compare C8U5G8 separately with U8C5A8
    and UUA/C.
  family_mapping: Full-length reference Q9UXX8/CAB50635.1 maps PF01877 at 9-132; the experimental preparation
    is proteolytically processed with unresolved exact termini. No PAB1135 residue mutation or isolated
    Pfam construct is tested.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:272844
  limitations: RNA sequence and predicted secondary structure change together. Reported folding energies
    are -15.9 versus -1.9 kcal/mol for C8U5G8 versus U8C5A8; these are not measured binding free energies.
    Three probes do not prove universal sequence independence, and the weaker probes have nonzero shifts.
