causal_graphs:
- graph_id: pab1135-protein-dose
  title: Increasing PAB1135 preparation increases the structured-probe binding readout
  scope: Luz2010 Figure3A lanes7-10 and Figure3B, C8U5G8 probe titration.
  context: Trypsin-treated GE5 PAB1135, 50-400 pmol protein and 1 pmol labeled RNA in 20 ul, 30 min at
    37 C. Tris-HCl pH8, 20 mM KCl, 5 mM MnCl2, 1 mM DTT, BSA and RNasin; 8% native PAGE. Tris concentration
    is not stated.
  family_mapping: Q9UXX8 sequence version1 equals CAB50635.1 and WP_010868849.1, 154 residues; PF01877
    maps 9-132. GE5 genomic PCR in pET28a, expressed in BL21-CodonPlus(DE3)-RIL. Trypsin removes the His-tag
    and unspecified native N-terminal residues; the assayed termini are not sequence-verified.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:272844
  limitations: Preparation-level binding assay, not isolated-domain sufficiency or an RNA-processing reaction.
    High nominal protein excess, no fitted KD or saturation, and no replicate/error-bar information in
    Figure3. Native RNA conformers and exact active-protein concentration remain unresolved.
