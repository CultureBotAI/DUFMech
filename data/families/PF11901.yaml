description: This repeat of unknown function was first identified in Diptera proteins; later on it was
  found in a wide range of invertebrates and vertebrates [[cite:PUB00101198]], such as natterin [[cite:PUB00056184],[cite:PUB00101201]].
  It is often present in proteins comprising only two or four DM9 repeats and occasionally is linked to
  other domains at its N- or C-terminal. In the mannose-specific lectin CGL1 from Crassostrea gigas, DM9
  exhibits high binding specificity and avidity toward D-mannose residue and served as a pattern recognition
  receptor (PRR) with a broad range of recognition spectrum to various pathogen-associated molecular patterns
  [[cite:PUB00101199]]. It also mediates immune recognition and cellular encapsulation [[cite:PUB00101200]].
