description: This entry represents the SiaC family regulatory phosphoprotein which undergoes a regulatory
  phosphorylation at Thr-68 of founder protein PA0170 from Pseudomonas aeruginosa, but in more distant
  homologs, T can be S. Also, it is part of motif NTSS, so may contain more than one phosphorylation site.
  Phosphorylation causes regulatory change to protein-protein interaction, in a pathway that seems broadly
  distributed, involves a diguanylate cyclase, and in the case of Pseudomonas aeruginosa affects aggregation
  and biofilm formation responses.
