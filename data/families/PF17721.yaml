description: POU domain class 2-associating factor 2 (also known as Protein OCA-T1) is a transcriptional
  coactivator that specifically associates with POU2F3 [[cite:PUB00101325]], forming a complex that drives
  the development of tuft cells, a rare chemosensory cells that coordinate immune and neural functions
  within mucosal epithelial tissues [[cite:PUB00101325]].
