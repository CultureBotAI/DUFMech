description: This domain is found in several cell surface proteins, such as extracellular matrix-binding
  protein ebh [[cite:PUB00014728]]. Some members are involved in antibiotic resistance (e.g [swissprot:Q9RL69]
  and [swissprot:Q9LCJ9]) [[cite:PUB00014727]] and/or cellular adhesion (e.g. [swissprot:Q931R6]) [[cite:PUB00014728]].
  In some proteins it is repeated more than fifteen times, being the most repeated domain in streptococci
  [[cite:PUB00097824]]. This is a predominantly alpha-helical domain that form a long, thin, fibre-like
  structure and it has been proposed to function as a stalk that helps the adhesive non-repeat region
  (NRR) of proteins protrude beyond the cell surface [[cite:PUB00097823],[cite:PUB00065268]].
