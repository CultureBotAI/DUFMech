causal_graphs:
- graph_id: yded-peroxide-growth-and-rescue
  title: YdeD deletion and plasmid expression alter peroxide-stressed growth
  scope: Whole-gene ydeD perturbations in E. coli BW25113 and its JW5250 ydeD::KmR derivative. Comparisons
    use pSTV29 or pYdeD; neither isolated EamA repeat is tested.
  context: Figure 1A serial dilutions of overnight cultures on LB agar with 0.5 mM H2O2, incubated at
    30 C for 24 h, with peroxide-free LB controls. pYdeD carries a 1.5-kb ydeD fragment in the lac-promoter
    pSTV29 vector. Panel A does not specify peroxide pretreatment or an IPTG dose; panel B pretreatment
    is not transferred. The malformed HTML control-concentration text is resolved only to the image's
    LB control, not an invented 10 mM condition.
  family_mapping: UniProtKB:P31125, eamA/ydeD, b1533/JW5250, is a 299-residue K-12 reference with sequence
    version 2. UniProt and InterPro sequences agree exactly; PF00892 maps at 7-130 and 143-286 inclusive.
    The matching JW5250 locus grounds the deletion, but the assay host is BW25113 and the complete pYdeD
    insert sequence was not independently reconstructed. No independent function is assigned to either
    repeat.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: Colony growth in serial spots is not a calibrated survival rate, purified cysteine flux
    or a resolved peroxide-scavenging reaction. Plasmid rescue supports gene involvement but does not
    exclude every dosage or secondary effect. Exact insert junctions, induction, dilution factors and
    independent replicate count remain unresolved. The pDES multi-gene experiments and proposed FliY recycling
    chain are not folded into this graph.
