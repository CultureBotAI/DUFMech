description: Members of this family are integral membrane proteins. This family includes a protein with
  hemolytic activity from Bacillus cereus [[cite:PUB00019707]]. It has been proposed that YOL002c encodes
  a Saccharomyces cerevisiae protein that plays a key role in metabolic pathways that regulate lipid and
  phosphate metabolism [[cite:PUB00019708]]. In eukaryotes, members are seven-transmembrane pass molecules
  found to encode functional receptors with a broad range of apparent ligand specificities, including
  progestin and adipoQ receptors, and hence have been named PAQR proteins [[cite:PUB00071573]]. The mammalian
  members include progesterone binding proteins [[cite:PUB00071574]]. Unlike the case with GPCR receptor
  proteins, the evolutionary ancestry of the members of this family can be traced back to the Archaea.
  This family belongs to the CREST superfamily [[cite:PUB00085069]], which are distantly related to GPCRs.
