description: This family consists of several bacterial proteins of unknown function, however members have
  been suggested to be an accessory protein for sulfite reduction. This is based on the observation that
  they strongly cofit with various genes in the sulfate assimilation pathway in various Pseudomonas as
  well as in Marinobacter adhaerens HP15 and C. basilensis 4G11 (see Supplementary note 5 in [[cite:PUB00093610]].)
