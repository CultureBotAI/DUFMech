description: Many bacteria are covered in a layer of surface-associated polysaccharide called the capsule.
  These capsules can be divided into four groups depending upon the organisation of genes responsible
  for capsule assembly, the assembly pathway and regulation [[cite:PUB00062058]]. This family plays a
  role in group 4 capsule biosynthesis [[cite:PUB00066719]]. These proteins have a beta-grasp fold [[cite:PUB00044948]].
  Two beta-grasp domains, D2 and D3, are arranged in tandem. There is a C-terminal amphipathic helix which
  packs against D3. A helical hairpin insert in D2 binds to D3 and constrains its position, a conserved
  arginine residue at the end of this hairpin is essential for structural integrity [[cite:PUB00099551]].
  This is the C-terminal domain which covers D3 and D4 domains [[cite:PUB00099551]].
