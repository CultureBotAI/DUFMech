description: 'The Phage_holin_BhlA family is a family of holin-like proteins from both bacteriophages
  and bacterial chromosomes. In bacteriophage, holins are small membrane proteins that accumulate and
  oligomerise to form non-specific lesions in the cytoplasmic membrane allowing the release of the second
  protein, endolysins, to access the peptidoglycan [[cite:PUB00110260]]. Most holins share common structural
  features: two or three transmembrane domains separated by a beta-turn, a short hydrophilic N-terminus,
  a highly charged C-terminus and a dual translational start motif. The BhlA holin of Bacillus is found
  to be toxic to the host cell where the site of action of is on the cell membrane and causes bacterial
  death by cell membrane disruption [[cite:PUB00110261]].'
