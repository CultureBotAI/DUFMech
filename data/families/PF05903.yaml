description: The PPPDE superfamily (after Permuted Papain fold Peptidases of DsRNA viruses and Eukaryotes),
  consists of predicted thiol peptidases with a circularly permuted papain-like fold. The inference of
  the likely DUB function of the PPPDE superfamily proteins is based on the fusions of the catalytic domain
  to Ub-binding PUG (PUB)/UBA domains and a novel alpha-helical Ub-associated domain (the PUL domain,
  after PLAP, Ufd3p and Lub1p) [[cite:PUB00020916]].
