description: This family includes Nucleotide-binding protein YajQ and similar sequences mainly found in
  bacteria. YajQ was characterised as a putative nucleic acid-binding protein based on the similarity
  of its (ferredoxin-like) three-dimensional topology with that of RNP-like RNA-binding domains. In Pseudomonas
  syringae, YajQ functions as a host protein involved in the temporal control of bacteriophage Phi6 gene
  transcription. This protein shows two domains each of which has the same topology [[cite:PUB00036972],[cite:PUB00079423],[cite:PUB00161038],[cite:PUB00079422]].
