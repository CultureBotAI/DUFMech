description: This entry represents the first region from the so-called delivery domain from Lymphostatin.
  Lymphostatin is a key virulence factor of enteropathogenic and enterohaemorrhagic Escherichia coli,
  playing roles in bacterial colonisation of the gut and in the inhibition of lymphocyte proliferation
  and proinflammatory responses [[cite:PUB00164033]]. Lymphostatin is composed of six distinct domains
  which enable complex interactions with host cells. These domains include two glycosyltransferase domains,
  one PaToxP-like protease domain, an ADP-ribosyltransferase domain, a vertex domain and a delivery domain
  [[cite:PUB00164033]]. The delvery domain is involved in the receptor binding and translocation. It is
  an evolutionary conserved translocation and delivery apparatus in LCT-like toxins [[cite:PUB00164033]].
  The delivery domain shows some flexibility and can adopt different conformations.
