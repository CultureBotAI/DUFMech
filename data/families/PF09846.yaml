description: This entry includes archaeal proteins whose function is unclear. Some members of this entry
  have been described as OapB/Arvb, encoded by oapB gene which is part of the three-gene cluster oapABC,
  involved in generation of extracellular vesicles (arv, archaeal vesiculating GTAse) [[cite:PUB00154442],[cite:PUB00154443]].
  It has been suggested that OapB/ArvB could be a guanine nucleotide exchange factor (GEF), however, further
  experimental research is required to confirm this [[cite:PUB00154443]].
