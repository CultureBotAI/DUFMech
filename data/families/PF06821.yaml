description: Members of this family have serine hydrolase activity. They contain a conserved serine hydrolase
  motif, GXSXG/A, where the serine is a putative nucleophile [[cite:PUB00070832]]. This family has an
  alpha-beta hydrolase fold [[cite:PUB00019449],[cite:PUB00049125]]. Eukaryotic members of this family
  have a conserved LXCXE motif, which binds to retinoblastomas. This motif is absent from prokaryotic
  members of this family [[cite:PUB00049125]].
