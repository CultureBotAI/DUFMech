description: This entry represents a C-terminal domain found in some glycosyl hydrolase family 2 proteins.
  This domain follows the N-terminal ([pfam:PF02837]), catalytic ([pfam:PF00703]) and C-terminal ([pfam:PF02836])
  domains characteristic of this family. The domain is approximately 170-185 residues in length. These
  proteins include exo-beta-1,4-galactosidases involved in degrading galactan substituents from plant
  cell wall polysaccharides. The family is found in diverse bacteria including Bacteroidota and Bacillota.
  The function of this domain remains to be determined.
