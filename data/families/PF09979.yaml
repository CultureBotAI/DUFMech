description: This entry, previously known as DUF2213, represents the Pseudomonas phage Pa193 gp24 scaffolding
  protein and various hypothetical and phage-related proteins. The structure of gp24 was partly resolved
  featuring small helical hairpin [[cite:PUB00163741]]. gp24 functions as a scaffolding protein for capsid
  assembly. It forms a pentamer that probably is directly stabilizing the capsid five-fold vertices [[cite:PUB00163741]].
