description: Adenoviruses express up to 20 distinct mRNAs from five major late transcription unit (MLTU)
  regions, L1 to L5. The L4 region expresses L4-33K and a related protein, L4-22K [[cite:PUB00076403]].
  L4-22K and L4-33K have complementary but not redundant functions that provide the normal pattern of
  mRNA production during the late phase of infection [[cite:PUB00076403]]. L4-33K is an alternative RNA
  splicing factor that up-regulates several MLTU splice acceptor sites as the late phase progresses [[cite:PUB00076403],[cite:PUB00076401]].
  L4-22K plays a role in genome packaging via its binding, in association with IVa2, to the A2 sequence
  within the packaging signal [[cite:PUB00076402]]. Additionally, L4-22K plays an important role in the
  temporal switch from the early to late phase of infection by regulating both early and late gene expression
  [[cite:PUB00076404],[cite:PUB00144935]].
