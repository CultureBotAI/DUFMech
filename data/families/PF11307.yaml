description: This entry, previously known as DUF3109, represents a bacterial family of probable redox
  regulatory proteins. A member of this family, Rv0495c, from Mycobacterium tuberculosis is essential
  for maintaining intracellular redox homeostasis [[cite:PUB00161582]]. Deletion of the Rv0495c gene (delta
  Rv0495c) results in increased levels of reactive oxygen species and a higher NAD+/NADH ratio, leading
  to a highly oxidised intracellular state [[cite:PUB00161582]]. Despite showing a growth defect in macrophages,
  the absence of Rv0495c increases M. tuberculosis pathogenicity in vivo, enhancing the bacterium's ability
  to proliferate inside the host.
