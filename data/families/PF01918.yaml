  title: Alba lysine substitutions lower DNA-binding affinity
  scope: Bell2002 recombinant S. solfataricus Alba and individual K16A/K16E/K17A/K17E substitutions.
  context: Original Figure 3; purified proteins binding a 50-bp DNA duplex, triplicate apparent Kd estimates
    with standard errors. Comparisons are within this protein/probe titration, not across later studies.
  family_mapping: S. solfataricus P2 Alba1 P60849 sequence version 2, SSO0962, 97 aa; PF01918 10-72 includes
    K16/K17/F60. This is current reference mapping, not independent historical clone sequencing or proof
    of isolated 10-72 sufficiency.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:273057
  limitations: Mutations can affect conformation as well as a nucleic-acid contact; they are not acetyl-lysine
