description: This is a family of metal-sensitive repressors, involved in resistance to metal ions. Members
  of this family bind copper, nickel or cobalt ions via conserved cysteine and histidine residues. In
  the absence of metal ions, these proteins bind to promoter regions and repress transcription. When bound
  to metal ions they are unable to bind DNA, leading to transcriptional derepression [[cite:PUB00041403],[cite:PUB00057455],[cite:PUB00057456],[cite:PUB00057457],[cite:PUB00035608]].
