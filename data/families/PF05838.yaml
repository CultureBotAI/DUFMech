description: This family acts as a lysozyme (N-acetylmuramidase), [ec:3.2.1.17]. It contains a conserved
  EGGY motif near the N-terminus, the glutamic acid within this motif is essential for catalytic activity
  [[cite:PUB00109141]]. In bacteria, it may activate the secretion of large proteins via the breaking
  and rearrangement of the peptidoglycan layer during secretion [[cite:PUB00021044],[cite:PUB00109142]].
  It is frequently found at the N-terminus of proteins containing a C-terminal [pfam:PF09374] domain.
