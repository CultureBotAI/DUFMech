description: This family has structural similarity to an endo-1,3-1,4-beta glucanase belonging to glycoside
  hydrolase family 16. A member containing this domain, BT2157 from B. thetaiotaomicron [[cite:PUB00097337]],
  was initially described as a 3-keto trehalose hydrolase involved in trehalose degradation [[cite:PUB00097337]].
  However, members of this group of proteins, previously known as DUF1080, have been reported to be 3-keto-alpha-glucoside-1,2-lyases
  and 3-keto-2-hydroxy-glucal hydratases and named AL/BT2 enzymes [[cite:PUB00160473]].
