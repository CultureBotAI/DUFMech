description: This family is an aTrm56 that catalyses the 2'-O-methylation of the cytidine residue in archaeal
  tRNA, using S-adenosyl-L-methionine. Biochemical assays showed that aTrm56 forms a dimer and prefers
  the L-shaped tRNA to the lambda form as its substrate [[cite:PUB00046137]] [[cite:PUB00046138]]. aTrm56
  consists of the SPOUT domain, which contains the characteristic deep trefoil knot for AdoMet binding,
  and a unique C-terminal beta-hairpin [[cite:PUB00046136]].
