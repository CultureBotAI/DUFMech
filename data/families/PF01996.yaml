description: F420-0:Gamma-glutamyl ligase ([ec:6.3.2.-]) is an enzyme involved in F420 biosynthesis pathway.
  It catalyses the GTP-dependent successive addition of multiple gamma-linked L-glutamates to the L-lactyl
  phosphodiester of 7,8-didemethyl-8-hydroxy-5-deazariboflavin (F420-0). This reaction produces polyglutamated
  F420 derivatives. GTP + F420-0 + n L-glutamate -> GDP + phosphate + F420-n
