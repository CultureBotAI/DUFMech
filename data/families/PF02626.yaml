description: Urea carboxylase (UC) catalyses a two-step, ATP- and biotin-dependent carboxylation reaction
  of urea. It is composed of biotin carboxylase (BC), carboxyltransferase (CT), and biotin carboxyl carrier
  protein (BCCP) domains. The CT domain of UC consists of four subdomains, named A, B, C and D. This domain
  covers the A and B subdomains of the CT domain. This domain covers the whole length of KipA (kinase
  A) from Bacillus subtilis [[cite:PUB00064884]]. It can also be found in S. cerevisiae urea amidolyase
  Dur1,2, which is a multifunctional biotin-dependent enzyme with domains for urea carboxylase and allophanate
  (urea carboxylate) hydrolase activity[[cite:PUB00076467]].
