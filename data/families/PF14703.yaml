description: PHM7_cyt is the predicted cytosolic domain of integral membrane proteins, such as yeast PHM7
  and TM63A_HUMAN TRANSMEMBRANE PROTEIN 63A, SwissProt:O94886. This domain usually precedes the 7TM region,
  [pfam:PF02714], and follows a RSN1_TM, [pfam:PF13967]. Fold recognition programs consistently and with
  high significance predict this domain to be distantly homologous to RNA binding proteins from the RRM
  clan.
