description: This entry represents the catalytic domain of Non-reducing end beta-L-arabinofuranosidase
  from Bifidobacterium longum (Beta -AFase) and similar proteins that belong to the glycoside hydrolase
  family 127 (GH127). This domain folds into an (alpha /alpha)6 barrel. Beta-AFase has been characterised
  as an unusual beta-L-arabinofuranosidase enzyme, [ec:3.2.1.185]. It releases l-arabinose from the l-arabinofuranose
  (Araf)-beta1,2-Araf disaccharide and also transglycosylates 1-alkanols with retention of the anomeric
  configuration [[cite:PUB00075450],[cite:PUB00151606]].
