description: In budding yeast, Get4 is part of the GET complex that inserts the tail-anchored (TA) proteins
  into the endoplasmic reticulum membrane [[cite:PUB00092561],[cite:PUB00092562]]. In humans, Get4 is
  part the BAG6/BAT3 complex, maintains misfolded and hydrophobic patches-containing proteins in a soluble
  state and facilitates their proper delivery to the endoplasmic reticulum, or alternatively promotes
  their sorting to the proteasome where they undergo degradation [[cite:PUB00092560],[cite:PUB00086005],[cite:PUB00086007],[cite:PUB00086008]].
  The BAG6/BAT3 complex is involved in the post-translational delivery of tail-anchored/type II transmembrane
  proteins to the endoplasmic reticulum membrane [[cite:PUB00092560],[cite:PUB00086008],[cite:PUB00092563]].
