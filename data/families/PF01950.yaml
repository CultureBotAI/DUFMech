- graph_id: kw128-fbp-deletion-growth-2004
  title: Fbp deletion reduces growth in defined gluconeogenic media
  scope: KOD1-derived KW128 compared with delta-fbp-8J, not wild-type KOD1 versus a domain mutant.
  context: Anaerobic 85 C; rich-medium preculture followed by synthetic ASW-AA with 20 amino acids and
    sulfur, with or without 5 g/L sodium pyruvate. Starch supplementation is a separate positive growth
    condition.
  family_mapping: Entire 1128-bp fbp/TK2164 CDS replaced with trpE; PCR, sequencing and Southern validation
    reported. Reference Q8NKR9 v1, PF01950 6-372; KW128 is delta-pyrF delta-trpE::pyrF.
  taxon: NCBITaxon:69014
  scope_status: PHENOTYPIC
  limitations: OD660 is not viability. Amino-acid-only growth result is reported without its curve. No
    fbp reintroduction rescue; the monocistronic transcript does not exhaustively exclude polarity. Loss
    of a bifunctional protein does not identify which activity limits growth or demonstrate universal
    essentiality.
