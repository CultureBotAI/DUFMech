- graph_id: tk-fbp-hydrolysis-2004
  title: Purified Thermococcus Fbp converts FBP to F6P
  scope: Whole-protein Fbp from Thermococcus kodakarensis KOD1, expressed in E. coli.
  context: Sato2004 Table2; purified preparation with 2 mM FBP at 85 C; F6P detected by coupled glucose-6-phosphate
    isomerase/dehydrogenase assay. FBP-minus and thermal-decomposition corrections were applied.
  family_mapping: Q8NKR9 v1, 375 aa, fbp/TK2164; historical AB081839.1/BAC10571.1 and genome BAD86353.1;
    PF01950 residues 6-372. Historical recombinant clone was not independently resequenced.
  taxon: NCBITaxon:69014
  scope_status: MECHANISTIC
  limitations: Whole protein, not isolated-domain catalysis. Exact assay buffer and metal concentration
    refer to uninspected Rashid2002 methods. The 95 C kinetic constants are not the 85 C activity endpoint.
    No aldolase, residue chemistry or universal family activity is inferred from this experiment.
  nodes:
