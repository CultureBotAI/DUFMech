description: This is a family of bacterial and archaeal fructose-1,6-bisphosphatases (FBPases). FBPase
  catalyses the hydrolysis of D-fructose-1,6-bisphosphate (FBP) to D-fructose-6-phosphate (F6P) and orthophosphate
  and is an essential regulatory enzyme in the glyconeogenic pathway.
