description: This entry represents a class of MavL-like macrodomain enzymes whose representative members
  show unique selectivity for mono-ADP-ribosylated arginine residue in synthetic substrates, including
  [swissprot:Q9W2W5] and [swissprot:Q9W4J9] from Drosophila melanogaster, which are distantly related
  to MavL from Legionella pneumophila [[cite:PUB00155313]]. They are (ADP-ribosyl)hydrolases that share
  a mode of ADP-ribose interaction distinct from previously characterised macrodomains [[cite:PUB00155313]].
