description: This domain is found at the C-terminal of Erythromycin biosynthesis protein CIII (EryCIII)
  from Saccharopolyspora erythraea and similar proteins found in bacteria and eukaryotes. This protein
  is organised into two domains, both of them with a Rossmann-like alpha/beta fold. The C-terminal domain
  contains the nucleotide disphospho-sugar (NDP-sugar) binding site [[cite:PUB00074327]].
