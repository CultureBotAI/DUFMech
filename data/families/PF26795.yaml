description: This domain is found in uncharacterised proteins mainly from alphaproteobacteria. It is predicted
  to fold into an alpha/beta structure composed of a four-stranded beta-sheet and alpha-helix. It contains
  to highly conserved cysteine residues that are predicted to form disulfide bond bridging the alpha-helix
  and the beta-sheet. Besides the conserved cysteine residues, this domain contains a conserved NLxDP
  sequence motif which may have a functional role.
