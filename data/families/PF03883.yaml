  scope: MG1655-derived E. coli SB53 versus LC106; whole-gene deletion in a catalase/peroxidase-deficient
    background.
  context: Aerobic LB, 37 C, OD600 0.2; whole-cell EPR after chelator treatment.
  family_mapping: Reference YaaA is P0A8I3, b0006, sequence version 1, 258 residues; PF03883 spans 1-243.
