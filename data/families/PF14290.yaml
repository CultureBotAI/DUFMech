description: Complex II [succinate dehydrogenase (succinate-ubiquinone oxidoreductase); SDH] is the only
  enzyme shared by both the electron transport chain and the tricarboxylic acid (TCA) cycle in mitochondria.
  In plants, this complex is considered unusual because it has accessory subunits (SDH5-SDH8), in addition
  to the catalytic subunits of SDH found in all eukaryotes (SDH1- SDH4). This family represents the accessory
  complex II subunit Succinate dehydrogenase subunit 5 mitochondrial, from plants [[cite:PUB00098021],[cite:PUB00097630]].
