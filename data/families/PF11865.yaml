description: This entry represents a domain found in human serine/threonine-protein kinase mTOR and its
  homologues, a central regulator of cellular metabolism, growth and survival in response to hormones,
  growth factors, nutrients, energy and stress signals [[cite:PUB00151556],[cite:PUB00151557],[cite:PUB00151558],[cite:PUB00151559],[cite:PUB00151555]].
  In Saccharomyces cerevisiae, the TOR proteins, TOR1 and TOR2, regulate growth in a rapamycin-sensitive
  manner [[cite:PUB00015261]]. This domain consists of HEAT repeats [[cite:PUB00103870],[cite:PUB00151560]].
