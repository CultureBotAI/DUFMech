description: This entry represents the N-terminal domain from a family of uncharacterised proteins from
  halophilic archaea. The proteins in this family are predominantly found in the class Halobacteria, which
  includes families such as Natrialbaceae, Haloferacaceae, and Haloarculaceae. The proteins in this family
  are generally around 270-330 amino acids in length. This domain show similarity to the Peptidase M23
  family suggesting this domain may act as an endopeptidase.
