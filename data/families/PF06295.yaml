description: This family includes Z-ring associated protein G from Escherichia coli (ZapG) and similar
  proteins predominantly found in gammaproteobacteria. ZapG is involved in cell division, cell envelope
  biogenesis and cell shape maintenance. It is a key regulator of cell envelope growth, playing a crucial
  role in coordinating cell width, elongation and division to maintain cell envelope integrity. It plays
  an important role in the lipopolysaccharide (LPS) assembly/transport [[cite:PUB00151520],[cite:PUB00104752],[cite:PUB00151522],[cite:PUB00151523]].
  This protein adopts an alpha helical configuration.
