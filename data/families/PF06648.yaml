description: This family is represented by Autographa californica nuclear polyhedrosis virus (AcMNPV)
  protein Ac75, which is required for the egress of nucleocapsids from the nucleus, formation of intranuclear
  microvesicles and subsequent budded virion formation, in addition to protein Ac93. Ac75 is not an integral
  membrane protein, but it interacts with integral membrane protein Ac76 and is associated with the nuclear
  membrane [[cite:PUB00089650]].
