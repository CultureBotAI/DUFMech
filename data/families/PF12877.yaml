description: This entry represents an alpha/beta domain found in the KIAA1549 protein from human ([swissprot:Q9HCM3])
  which has been implicated in pilocytic astrocytomas [[cite:PUB00056166],[cite:PUB00056167],[cite:PUB00056168]].
  It has been found to be fused to BRAF gene in many cases of pilocytic astrocytomas. The fusion is due
  mainly to a tandem duplication of 2 Mb at 7q34 [[cite:PUB00056166],[cite:PUB00056167]]. The BRAF protein
  is a well characterised oncoprotein. It is a serine/threonine protein kinase which is implicated in
  MAP/ERK signalling, a critical pathway for the regulation of cell division, differentiation and secretion
  [[cite:PUB00056166],[cite:PUB00056167],[cite:PUB00056168]]. More recently, KIAA1549 has been described
  to play a role in photoreceptor function [[cite:PUB00101492]]. This protein contains three homologous
  domains of this type found in tandem.
