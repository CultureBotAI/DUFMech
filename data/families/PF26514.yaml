description: This entry represents an alpha helical domain from a family of uncharacterised proteins in
  the Stenosarchaea group. The proteins in this family are primarily found in archaea, particularly within
  the Halobacteriales and Methanobacteriota. The domain is approximately 180 amino acids in length. Proteins
  containing this domain are predicted to be integral membrane proteins, as suggested by the presence
  of multiple transmembrane helices.
