description: This domain is found in proteins that may have a role in protein folding or as a chaperone,
  including DnaJ homolog subfamily C member 28. DnaJ is a member of the J-protein family (also known as
  HSP40), which are defined by the presence of a J domain that regulate the activity of 70kDa heat-shock
  proteins [[cite:PUB00109020]]. The function of this domain is not yet known.
