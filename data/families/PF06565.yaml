description: This entry represents the DM10 domain, which consists of approximately 105 residues whose
  function is unknown. It has been identified in nucleoside diphosphate kinases, namely Nucleoside diphosphate
  kinase 7 (NDK7), which contain a single copy of the DM10 domain [[cite:PUB00085676],[cite:PUB00087484]],
  and in uncharacterised proteins including Rib72 from Chlamydomonas and EF-hand domain-containing protein
  1/EF-hand domain-containing family member C2 (EFHC1/2) from mammals, which contain multiple copies of
  DM10 domains. In Chlamydomonas, and possibly mammals, DM10 domain-containing proteins are tightly bound
  to the flagellar doublet microtubules. This suggests that DM10 domains might act as flagellar NDK regulatory
  modules or as units specifically involved in axonemal targeting or assembly [[cite:PUB00043716],[cite:PUB00097750]].
  This domain have a PH-like fold which includes seven beta strands, with a short 3-4 residue helix after
  the first strand, and a more extended alpha helical region at the C terminus [[cite:PUB00087484],[cite:PUB00043716]].
