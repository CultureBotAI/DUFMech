description: This entry includes acetylaranotin biosynthesis cluster protein L (AtaL) from Aspergillus
  terreus, which is a non-ribosomal peptide synthetase. It is required for the biosynthesis of the toxin
  acetylaranotin, which is a disulfide bridged cyclic dipeptide [[cite:PUB00086035]]. There are a number
  of steps in the biosyntheis of this epipolythiodioxopiperazine toxin from two phenylananines, but the
  specific function of AtaL has yet to be determined [[cite:PUB00086035]]. Homologues are also known from
  bacteria.
