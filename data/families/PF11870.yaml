description: This domain is functionally uncharacterised. This domain is found at the C-terminal of a
  family of 4Fe-4S, iron-sulphur cluster binding proteins, including Lactate utilisation protein B (LutB).
  These proteins have a perfect 4Fe-4S binding motif C-x(2)-C-x(2)-C-x(3)-CP followed by either a perfect
  or imperfect (the first Cys replaced by Ser) second copy. Members probably bind two 4Fe-4S iron-sulphur
  clusters. This domain is found in LutB proteins in association with the LUD domain ([pfam:PF02589])
  and usually Fer4_8 ([pfam:PF13183]). The LutABC operon is involved in lactate-utilisation and is essential
  [[cite:PUB00076952],[cite:PUB00053899]].
