description: SelO and its homologues are widespread among most eukaryotic taxa, and are also common in
  many major bacterial taxa. SelO is a conserved pseudokinase that transfers AMP from ATP to Ser, Thr,
  and Tyr residues on protein substrates (AMPylation). It contains a protein kinase fold with ATP flipped
  in the active site [[cite:PUB00092455]]. In eukaryotes, it is a mitochondrial protein that may be involved
  in redox biology [[cite:PUB00092456]].
