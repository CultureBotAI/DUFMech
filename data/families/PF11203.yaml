description: EccE is a family of largely Gram-positive bacterial transmembrane componenets of the type
  VII secretion system characterised in Mycobacterium tuberculosis, systems ESX1-5. Translocation of virulent
  peptides through the membranes is thought to be mediated via a complex that includes EccB, EccC, EccD,
  EccE, and MycP [[cite:PUB00083129],[cite:PUB00106938]]. EccB, EccC, EccD, and EccE form a stable complex
  in the mycobacterial cell envelope [[cite:PUB00083131]].
