description: This domain is found in a group of putative heme-iron utilisation proteins, such as HugZ.
  It can also be found in C-terminal of the glutamyl-tRNA reductase-binding (GluTRBP) protein from Arabidopsis
  [[cite:PUB00075508]]. GluTRBP is involved in the regulation of glutamyl-tRNA reductase (GluTR) which
  is important for the synthesis and distribution of 5-aminolevulinate, a precursor in heme and chlorophyll
  biosynthesis [[cite:PUB00075509]]. GluTRBP is necessary for efficient photosynthetic electron transport
  in chloroplasts [[cite:PUB00075510]].
