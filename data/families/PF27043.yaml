description: This domain is found in uncharacterised proteins mainly from Myxococcota lineage. It is predicted
  to fold into a globular structure comprising a four stranded beta-sheet packed with two helices. It
  contains two highly conserved cysteine and a histidine residues that may coordinate a metal ion. The
  position of the fourth residues is not conserved but it is always present in a close proximity.
