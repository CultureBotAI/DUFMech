description: This family consists of several insect proteins including protamine A (ProtA), protamine
  B (ProtB) and protamine-like protein 99C (Prtl99C) from Drosophila melanogaster. They contain a HMG-box
  and are involved in chromatin compaction during spermiogenesis [[cite:PUB00083892],[cite:PUB00083890]].
  Prtl99C is a sperm chromatin-associated protein that is essential for male fertility [[cite:PUB00083890]].
