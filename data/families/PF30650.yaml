description: This entry represents an N-terminal helical domain of approximately 60 residues found in
  bacterial SAM-dependent methyltransferases. This domain is always located N-terminal to a methyltransferase
  domain ([pfam:PF09445], [pfam:PF13649]) and is frequently followed by a THUMP-like domain ([pfam:PF18096]).
  The family is found almost exclusively in Actinomycetota, particularly in Streptomyces species and related
  genera. The specific function of this N-terminal domain remains to be determined.
