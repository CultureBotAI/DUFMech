description: Nuclear receptors (NRs) are a family of ligand-inducible transcription factors, and, like
  other transcription factors, they contain a distinct DNA binding domain that allows for target gene
  recognition and several activation domains that possess the ability to activate transcription [[cite:PUB00063250]].
  One of these activation domains is at the N-terminal, although there are two distinct motifs within
  this domain, between residues 20-36 and between 74 and the end of this domain, which are the binding
  regions. One of the co-activators is TIF1beta, which appears to bind at the first motif [[cite:PUB00063251]].
