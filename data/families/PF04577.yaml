description: This family represents the Glycosyltransferase Family 61. Members in this family are further
  processed into a mature form. It includes O-linked-mannose beta-1,4-N-acetylglucosaminyltransferase
  2 (POMGnT2, also known as AGO61 or EOGLT) [[cite:PUB00083303]] and EGF domain-specific O-linked N-acetylglucosamine
  transferase (EOGT) [[cite:PUB00083304]]. This family also includes plant beta-1,2-xylosyltransferases
  [[cite:PUB00122264]].
