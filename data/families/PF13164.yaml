description: Diedel (die) was identified as an insect immune response protein. It is up-regulated after
  a septic injury and may act as a negative regulator of the JAK/STAT signalling pathway [[cite:PUB00078735]].
  Its homologues can be found in Drosophila and Acyrtosiphon pisum. Interestingly, the orthologues of
  the die gene are present in the genome of insect DNA viruses of the Baculoviridae and Ascoviridae families.
  The viral homologues suppress the immune deficiency (IMD) pathway in Drosophila [[cite:PUB00078736]].
