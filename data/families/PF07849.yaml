description: This entry represents the helical membrane plugin (HMP) domain found in a group of uncharacterised
  prokaryotic proteins, including the [NiFe]-hydrogenase Huc from Mycobacterium smegmatis [[cite:PUB00161758]].
  It is involved in the construction of oxidoreductases in prokaryotes, which allows quinone channelling
  between the membrane and various redox catalytic subunits [[cite:PUB00161759]]. It was previously known
  as DUF1641.
