description: TRIC (trimeric intracellular cation) channels are differentially expressed in intracellular
  stores in animal cell types. TRIC subtypes contain three proposed transmembrane segments, and form homo-trimers
  with a bullet-like structure. Electrophysiological measurements with purified TRIC preparations identify
  a monovalent cation-selective channel [[cite:PUB00053854]].
