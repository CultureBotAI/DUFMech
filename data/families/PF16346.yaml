description: This domain is found at the C-terminal end of BT1760 from Bacteroides thetaiotaomicron and
  similar bacterial proteins that predominantly belong to the glycoside hydrolase family 32 (GH32). BT1760
  is an endo-levanase that requires its C-terminal beta-sandwich domain to fold and function correctly.
  This domain shows two facing beta-sheets consisting of seven and eight antiparallel beta-strands [[cite:PUB00100993]].
