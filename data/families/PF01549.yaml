description: This domain of is found in several C. elegans proteins. The domain is 30 amino acids long
  and rich in cysteine residues. There are 6 conserved cysteine positions in the domain that form three
  disulphide bridges. The domain is found in the potassium channel inhibitor ShK in sea anemone [[cite:PUB00030746]][[cite:PUB00033687]].
