causal_graphs:
- graph_id: shk-recombinant-mouse-kv13-current
  title: Recombinant mature ShK decreases mouse Kv1.3 current
  scope: Enterokinase-cleaved recombinant Stichodactyla helianthus ShK tested on mouse Kv1.3 stably expressed
    in L929 fibroblasts, Chang 2012 Figure 6A/C; not every ShKT-containing protein.
  context: Refolded recombinant peptide is cleaved from thioredoxin and purified by RP-HPLC, leaving no
    extra N-terminal residue. Whole-cell patch clamp at room temperature uses 200-ms pulses from -80 to
    +40 mV every 30 s. Pipette solution contains 145 mM KF, 10 mM HEPES, 10 mM EGTA and 2 mM MgCl2, pH
    7.2, 290 mOsm; bath contains 160 mM NaCl, 4.5 mM KCl, 2 mM CaCl2, 1 mM MgCl2 and 10 mM HEPES, pH 7.2,
    300 mOsm. Figure 6C's caption reports 3-5 determinations per point.
  family_mapping: P29187 / K1A_STIHL is the 35-aa mature peptide, sequence version 1, from taxon 6123.
    The published primers overlap by 21 bases and encode DDDDK followed by exact P29187 and a stop codon;
    this verifies the printed design, not independent clone resequencing. Current PF01549's curated description
    explicitly includes ShK; integrated IPR003582 maps P29187 residues 3-35 and includes the PF01549 signature.
    However, P29187 has no current UniProt Pfam cross-reference or direct PF01549 hit and is absent from
    the inspected PF01549.30 seed. This is curated-family plus integrated-domain association, not a verified
    current Pfam HMM interval. Mouse channel assay host is taxon 10090; exact channel clone sequence was
    not independently verified.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:6123
  limitations: The functional Hill-fit midpoint is not an independently measured physical binding constant.
    Current reduction establishes a scoped channel-blocking response, not atomic pore contacts or a complete
    immunosuppression pathway. Full text and captions were read, but figure images, raw currents and supplementary
    NMR data were not visually inspected. Other family members, channel paralogs and independent peptide
    batches remain unassessed.
