- graph_id: shk-recombinant-mouse-kv11-current
  title: Recombinant mature ShK decreases mouse Kv1.1 current
  scope: The separate mouse Kv1.1-expressing L929 line in Chang 2012 Figure 6C; the example trace in Figure
    6B uses synthetic ShK and is not misattributed to recombinant peptide.
  context: RP-HPLC-purified, enterokinase-cleaved recombinant ShK is applied during room-temperature whole-cell
    recording. Pulses run from -80 to +40 mV for 200 ms every 30 s. Pipette solution is 145 mM KF, 10
    mM HEPES, 10 mM EGTA, 2 mM MgCl2, pH 7.2, 290 mOsm; bath is 160 mM NaCl, 4.5 mM KCl, 2 mM CaCl2, 1
    mM MgCl2, 10 mM HEPES, pH 7.2, 300 mOsm. Dose-response values use peak current at +40 mV and 3-5 determinations
    per point according to the caption.
  family_mapping: Tested mature ShK corresponds to sequence-version-1 P29187, 35 aa from Stichodactyla
    helianthus; the printed overlapping primers encode that exact mature sequence after DDDDK. PF01549's
    curated family description includes this peptide and its integrated IPR003582 interval is 3-35. That
    interval is not a current PF01549 HMM hit; the current direct Pfam query is empty and the entire inspected
    PF01549.30 seed lacks P29187. The mouse channel and host are separate assay entities, not sea-anemone
    gene products.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:6123
  limitations: The 15 +/- 5 pM functional inhibition midpoint does not prove physical affinity, absolute
    selectivity, a Lys22 pore-plug geometry or activity of all family proteins. Figure 6C's caption/Results
    were inspected but its image and raw recordings were unavailable. Exact channel clones, independent
    purification batches, other channel classes and native-organism function require separate evidence.
