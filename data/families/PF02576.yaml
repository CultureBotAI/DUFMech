description: This entry represents the N-terminal domain of the ribosome maturation factor RimP (also
  known as yhbC). RimP facilitates the maturation of the 30S ribosomal subunit [[cite:PUB00053910]]. The
  N-terminal domain contains two alpha-helices and a three-stranded beta-sheet. It is suggested that the
  N-terminal domain of SP14.3 (RimP orthologue) could function as a protein module that binds to other
  proteins, especially those that contain highly positively charged surfaces. [[cite:PUB00021814]].
