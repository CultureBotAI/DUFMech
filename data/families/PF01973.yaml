  title: PF0930 produces pterin diphosphate in a purified-protein assay
  scope: Recombinant P. furiosus PF0930/MptE, mapped to Q8U2A9; whole-protein biochemical activity, not
    isolated-domain sufficiency.
  context: 3.5 ng enzyme with 100 uM 6-HMD and 1 mM ATP in 200 uL containing 8 mM MgCl2, 16 mM DTT and
    40 mM TES/KCl pH 7.4; argon, 70 C, 10 minutes. Products detected after iodine oxidation.
  family_mapping: Q8U2A9 sequence 1/entry 94 is the 231-residue PF0930 reference; current InterPro PF01973
    match is 37-183 inclusive. The study cloned PF0930 into modified pET24d; exact extra construct residues
    remain unverified. See evidence/PF01973/member-mapping.txt.
  taxon: NCBITaxon:186497
  scope_status: MECHANISTIC
  limitations: Product identity is supported by chromatography, optical spectra and desalted MS, but no
    atomic mechanism, native flux or isolated Pfam truncation is tested. CTP/UTP/GTP retain activity,
    so ATP is not an exclusive donor. The monophosphate peak's origin is unresolved.
