description: Several members of this family are annotated as being ATP/GTP-binding site motif A (P-loop)
  proteins, but this could not be confirmed. The one PDB:3NRF structure solved for this family exhibits
  an immunoglobin-like beta-sandwich fold. Crystal packing suggests that a tetramer is a significant oligomerisation
  state, and a disulfide bridge is formed between Cys 125 at the C-terminal end of the monomer, and Cys
  69.
