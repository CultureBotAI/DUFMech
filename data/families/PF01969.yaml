description: Members of this family may be involved in the activation of nickel-pincer cofactor-dependent
  enzymes. LarC from Lactobacillus plantarum is involved, together with LarB and LarE, in the synthesis
  of the enzyme-bound cofactor of lactate racemase (LarA). Larc C binds Ni2+, and functions in nickel
  delivery to pyridinium-3,5-bisthiocarboxylic acid mononucleotide (P2TMN), to form the mature cofactor
  [[cite:PUB00085157],[cite:PUB00086644]].
