    concentrations before versus after equal-volume mixing are unresolved.
  family_mapping: LarCMt maps to Q2RFJ5 v1/Moth_2512 in M. thermoacetica ATCC39073/JCM9320,396aa with
    PF01969 4-383 spanning both structural regions. The2022 full plasmid sequence was not independently
    reconstructed; reported mutated native residues agree with the reference. LarA/B/E are distinct assay
    partners.
