description: BKACE, beta-keto acid cleavage enzyme plays, a role in lysine degradation. In certain instances
  it catalyses the conversion of 3-keto-5-aminohexanoate and acetyl-CoA into acetoacetate and 3-aminobutyryl-CoA
  [[cite:PUB00056558]]. The family is found to have at least 14 slightly different potential new enzymatic
  activities, all of which can therefore be designated as beta-keto acid cleavage enzymes [[cite:PUB00103502]].
