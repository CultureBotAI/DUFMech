description: This family represents the tubulin epsilon and delta complex protein 1 (TEDC1). This complex
  is required for centriole maintenance and it is a component of several ciliary structures. It acts as
  a positive regulator of hedgehog signalling, which play key roles in embryonic development and in cancers
  [[cite:PUB00094182]]. Additionally, this protein may play a role in counteracting perturbation of actin
  filaments, such as after treatment with the actin depolymerising microbial metabolite Chivosazole F
  [[cite:PUB00094181]].
