description: This entry represents the bifunctional nuclease (BFN) domain which is specific to bacteria
  and plant organisms. It has both RNase and DNase activities [[cite:PUB00057454]]. The dimer of the BFN
  domain forms a wedge, each monomer being a basic triangular shape. The BFN domain is composed of an
  eight-stranded, distorted beta-sheet consisting of a four-stranded antiparallel beta-sheet, and a four-stranded
  mixed beta-sheet. This domain can be found in M. tuberculosis Carbon monoxide resistance (Cor) proteins.
  Cor consists entirely of this domain with homologues in a variety of organisms, including most mycobacteria,
  Bacteroides sp., Chlamydia sp., Streptomyces sp., and Rhodococcussp. One of the homologs from Oryza
  minuta protein OmBBD was reported to exhibit DNase and RNAse activity in vitro [[cite:PUB00057454]].
  OmBBD carries a C-terminal UvrB domain that is absent in the mycobacterial sequences. UvrB is one component
  of the UvrABC endonuclease system. Hence, it was proposed that OmBBD's observed nuclease activity may
  come not from this domain but from an interaction of the C-terminal UvrB with the catalytic UvrC nuclease
  [[cite:PUB00109344]].
