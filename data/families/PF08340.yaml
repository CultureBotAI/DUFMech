description: This domain is found at the C-terminal end of Endoribonuclease YicC from Escherichia coli
  and similar bacterial sequences. YicC, which is important for cells in the stationary phase, and essential
  for growth at high temperatures [[cite:PUB00020576]], contributes to degradation of the small RNA (sRNA)
  RhyB via collaboration with the exoribonuclease PNPase [[cite:PUB00151089]] and seems to generate a
  3'-OH and a 5'-phosphate group [[cite:PUB00151088]].
