description: The region featured in this family is found in a number of C. elegans proteins, in one case
  ([swissprot:Q19034]) as a repeat. In many of the family members, this region is associated with the
  CHK region described by SMART as being found in ZnF_C4 and HLH domain-containing kinases. In fact, one
  member of this family ([swissprot:Q9GUC1]) is annotated as being a member of the nuclear hormone receptor
  family, and contains regions typical of such proteins (Interpro:IPR000536, Interpro:IPR008946, and Interpro:IPR001628).
