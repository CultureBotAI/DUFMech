description: This entry represents an N-terminal domain of approximately 90 residues found in S8 family
  serine peptidases (subtilisins). The domain is found N-terminal to the Peptidase_S8 catalytic domain
  ([pfam:PF00082]). In Bacteroidota members, the proteins often contain a C-terminal T9SS secretion signal
  ([pfam:PF18962]). This family is found in bacteria including Pseudomonadota, Actinomycetota and Bacteroidota,
  as well as fungi (Ascomycota). The function of this domain remains to be determined.
