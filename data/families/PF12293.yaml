description: T4BSS_DotH_IcmK is a family of bacterial transporter proteins from Proteobacteria. DotH is
  an integral outer membrane component and it may form an outer membrane complex along with DotD and DotC
  functionally equivalent to secretins. DotH is the strongest candidate for the VirB9 counterpart of other
  T4BSS systems [[cite:PUB00075640]].
