description: This domain is found at the C-terminal end of sulfatases and alkaline phosphatases from bacteria,
  eukaryotes and archaea, including N-sulphoglucosamine sulphohydrolase from humans (SGSH) and Bifunctional
  sulfatase/alpha-L-rhamnosidase from Formosa agariphila (P36_S1_25). It shows a four-stranded antiparallel
  beta-sheet, with four surrounding alpha-helices, followed by a C-terminal extension consisting of a
  small two-stranded antiparallel beta-sheet [[cite:PUB00093668],[cite:PUB00100986]].
