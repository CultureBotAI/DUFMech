description: This entry represents a group of eukaryotic and archaeal proteins. Eukaryotic members include
  EMC3, a subunit of the ER membrane protein complex (EMC) required for protein folding [[cite:PUB00061987]],
  and TMCO1, a ER calcium load-activated calcium channel [[cite:PUB00081416]]. Archaeal members may function
  as insertases of the archaeal plasma membrane [[cite:PUB00086930]].
