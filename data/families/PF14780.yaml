description: This domain is found at the N-terminal of nucleolus and neural progenitor protein (NEPRO)
  which may play a role in cortex development as part of the Notch signalling pathway. Downstream of Notch
  may repress the expression of proneural genes and inhibit neuronal differentiation thereby maintaining
  neural progenitors [[cite:PUB00101272]]. NEPRO may also play a role in preimplentation embryo development
  [[cite:PUB00101273]]. NEPRO interacts with multiple protein subunits of RMRP and is implicated in Anauxetic
  dysplasia 3 [[cite:PUB00101274]]. NEPRO is likely the human orthologue of RMP1 subunit from yeast and
  they share a four-helix bundle domain structure.
