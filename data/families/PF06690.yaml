description: The iron guanylylpyridinol (FeGP) cofactor biosynthesis enzymes are encoded in a cluster
  of at least seven conserved genes (hcgA-G). This family represents the (SAM)-dependent methyltransferase
  HgcC [[cite:PUB00098593],[cite:PUB00098592]], which covalently attaches the methyl group at the 3-position
  of the pyridinol ring. It is predominantly found as a monomer in solution, composed of a Rossmann-like
  coenzyme-binding-domain consisting of six parallel and one peripheral antiparallel strand flanked by
  six alpha-helices and a smaller alpha/beta domain [[cite:PUB00098593]].
