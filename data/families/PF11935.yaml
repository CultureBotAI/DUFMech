description: This is the N-terminal domain found in the symplekin protein from animals and PTA1 protein
  from budding yeasts and is typically between 239 to 261 amino acids in length. Symplekin is a scaffold
  protein that functions as a component of a multimolecular complex involved in histone mRNA 3'-end processing
  [[cite:PUB00068954],[cite:PUB00068955]]. PTA1 is involved in pre-tRNA processing. PTA1 is a subunit
  of the cleavage and polyadenylation factor (CPF), which plays a key role in polyadenylation-dependent
  pre-mRNA 3'-end formation and cooperates with cleavage factors including the CFIA complex and NAB4/CFIB
  [[cite:PUB00070276]]. This domain has the ARM or HEAT fold, with seven pairs of antiparallel alpha-helices
  arranged in the shape of an arc. It is important for interaction with Ssu72 and stimulates Ssu72 C-terminal
  domain phosphatase activity in vitro [[cite:PUB00065426]].
