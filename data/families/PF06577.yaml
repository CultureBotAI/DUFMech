description: This family includes envelope integrity protein A (EipA), a protein required for B. abortus
  envelope stress resistance and infection. It's gene expression is directly activated by CtrA which binds
  to the promoter region. eipA encodes a soluble periplasmic protein that adopts an unusual eight-stranded
  beta-barrel fold [[cite:PUB00091721]].
