description: The key element of this domain is the CX31-38CCX33-34CXXC sequence motif normally found at
  the C-terminus in archaeal and bacterial Hdr-like proteins [[cite:PUB00109129]]. There may be one or
  two copies, and the motif is probably an iron-sulfur binding cluster. In some instances one of the cysteines
  is replaced by an aspartate, and aspartate can in principle also function as a ligand of an iron-sulfur
  cluster [[cite:PUB00109129]]. The entry includes a subunit from heterodisulphide reductase and a subunit
  from glycolate oxidase ([swissprot:P52074]) [[cite:PUB00007282]] and glycerol-3-phosphate dehydrogenase.
