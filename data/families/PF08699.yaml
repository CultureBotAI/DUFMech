description: ArgoL1 is a region found in argonaute [[cite:PUB00035384]] proteins. It normally co-occurs
  with [pfam:PF02179] and [pfam:PF02171]. It is a linker region between the N-terminal and the PAZ domains.
  It contains an alpha-helix packed against a three-stranded antiparallel beta-sheet with two long beta-strands
  (beta8 and beta9) of the sheet spanning one face of the adjacent N and PAZ domains. L1 together with
  linker 2, L2, PAZ and ArgoN forms a compact global fold [[cite:PUB00038652]].
