description: This domain is found at the N-terminal of bacterial toxin systems, including Tse7 (type IV
  secretion exported 7) from Pseudomonas aeruginosa, a type VI secretion exported toxin with DNase activity
  that induces growth arrest and ultimately DNA degradation within target cell [[cite:PUB00098743]]. The
  structure of this domain has a PAAR-like organisation necessary for interaction with T6SS VgrG tip and
  correct toxin delivery [[cite:PUB00098743],[cite:PUB00098744]].
