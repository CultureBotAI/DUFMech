description: This is a family of transcriptional regulators. In mammals, it activates the transcription
  of mitochondrially-encoded COX1 [[cite:PUB00057436]]. In bacteria, it negatively regulates the quorum-sensing
  response regulator by binding to its promoter region [[cite:PUB00057437]]. This entry represents the
  second and third domains in this protein, with one domain nested within the other.
