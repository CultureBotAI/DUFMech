- graph_id: proabylysin-tail-latency-hypothesis
  title: Proabylysin intramolecular tail may suppress proteolysis
  scope: Structural interpretation of recombinant proabylysin 4JIU and Figure 3A, not demonstrated protease
    activation.
  context: A Q101-V105 C-terminal segment occupies the putative substrate cleft in reverse substrate orientation,
    with V105 carboxylate coordinating Zn. Negative tested-substrate panels and unsuccessful activation
    trials are retained as limits.
  family_mapping: Q9V1Y2/CAB49216.1, native numbering; deposited L2V scaffold, paper K2V discrepancy retained.
    PF01863 2-88 contains H60/E61/H64 and H72, but not Q101-V105. Whole-protein architecture, not a domain-only
    mechanism.
  scope_status: HYPOTHETICAL
  taxon: NCBITaxon:272844
  limitations: Structural occupancy supports a proposed explanation for inactivity, not proof of reversible
    inhibition or a functional zymogen. No active abylysin was obtained. Tail truncation destabilizes
