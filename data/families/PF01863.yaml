- graph_id: ecoli-ygjp-utp-assay
  title: Purified E. coli YgjP preparation converts UTP to UMP
  scope: 'Sevin 2017 Supplementary Figure 16 and Tables 3/9: intact His6-YgjP preparation, not an isolated
    domain or in-vivo flux.'
  context: 50 ug/mL purified enzyme with 10 mM UTP; three replicates, mean and SD. Mass-spectrometric
    UTP and UMP ion traces compared with heat-inactivated YgjP. Selected TALON and anion-exchange fractions
    are shown in Figure 16b. Assay buffer, temperature and heat-inactivation protocol were not verified.
  family_mapping: Table 3 identifies b3085/ygjP. Reference P42597 sequence version 2 exactly equals BAE77135.1
    and AAC76120.2, 167 aa; PF01863 94-149. The reference is K-12, but exact historical ASKA clone sequence,
    donor strain and expression host remain unverified. No residue-specific or isolated-domain attribution.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:562
  limitations: DIRECT means a net purified-preparation effect, not proof of a chemical microstep or exclusion
    of every copurifying activity. Distinct ion response scales preclude molar stoichiometry or kcat.
    PPi appears in the reaction scheme, not a separately quantified trace. Main article Methods and full
    cellular datasets were not inspected.
