- graph_id: proabylysin-truncation-thermal-transition
  title: Proabylysin C-terminal deletions lower the reported thermal transition
  scope: 'Lopez-Pelegrin 2013 activation results: two purified deletion preparations compared with the
    full-length recombinant proabylysin scaffold.'
  context: Synthetic pCRI7 constructs expressed in E. coli BL21(DE3), without an added tag. Sypro Orange
    thermofluor on iCycler iQ; deletion preparations were heat-treated at 50-65 C during purification,
    versus 85 C for full length. Exact dye-assay buffer, ramp, replicate count and uncertainty were not
    established.
  family_mapping: PAB3079 Q9V1Y2 version 1 equals CAB49216.1, 105 aa; Pyrococcus abyssi GE5 reference
    taxon 272844. PF01863 2-88 excludes the deleted M104/V105 sites. Reference and PDB 4JIU establish
    L2V in the recombinant scaffold, contradicting the paper's K2V label. Separate deletion sequences
    were not deposited in the inspected sources.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:272844
  limitations: Preparation-level thermal effects, not isolated-domain sufficiency, quantified unfolding
    energetics or protease activation. The published WT comparator is the recombinant full-length scaffold.
    Different purification heat treatments and missing raw thermal curves limit mechanistic attribution;
    the two deletions do not isolate the contribution of M104 alone.
