- graph_id: projannalysin-partner-helix-latency-hypothesis
  title: Projannalysin partner helix may suppress proteolysis
  scope: Structural interpretation of the recombinant projannalysin dimer 4JIX and Figure 3B-D, kept distinct
    from the proabylysin intramolecular model.
  context: Partner E102-I110 helix lies across each putative cleft. I110 carboxylate is 4.1-4.2 A from
    Zn, unlike proabylysin V105 coordination. Purified protein is dimeric by size exclusion; crystallographic
    geometry alone does not prove intracellular dimerization or catalytic activity.
  family_mapping: MJ0123 Q57587 version 1 equals AAB98111.1, 110 aa; JAL-1/DSM 2661 taxon 243232. PF01863
    7-95 contains H69/E70/H73 and H81 but excludes E102-I110. PDB 4JIX has K2A plus residual N-terminal
    GP after His6/TEV cleavage; native numbering, not polymer seq_id, is used.
  scope_status: HYPOTHETICAL
  taxon: NCBITaxon:243232
  limitations: The proposed trans-blocking mechanism is not directly tested by a folded active product.
