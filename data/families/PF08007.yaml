description: This entry includes proteins with a JmjC domain that belong to the cupin superfamily, including
  Bifunctional lysine-specific demethylase and histidyl-hydroxylase NO66 [[cite:PUB00090402]], Ribosomal
  oxygenase 1/2 [[cite:PUB00090403],[cite:PUB00090404]], and 50S ribosomal protein L16 3-hydroxylase from
  Escherichia coli [[cite:PUB00090405],[cite:PUB00099121]]. Proteins are bifunctional, acting as histone
  lysine demethylases and ribosomal histidine hydroxylases.
