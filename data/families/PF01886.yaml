    evidence_source: selected_full_text_and_figure
    explanation: Wang2024 selected Results and simulation Methods plus original Figure2 place SSO0941
      in an energy/force benchmark. Fragmented-DFT comparison and computational samples are not DUF61
      biological perturbation data. No RNA-processing edge is supported by the inspected benchmark sections.
  posed_by: Codex
