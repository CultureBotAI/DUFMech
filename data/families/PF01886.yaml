    supports: PARTIAL
    evidence_source: abstract_and_structural_deposition
    explanation: Zhou2018 abstract and PDB5VFK metadata support structural observations for SSO0941. The
      full paper and supplements were not inspected. Twenty submitted NMR conformers are not twenty biological
      replicates; the author-defined monomer assignment is not an activity requirement. InterPro and RCSB
      repetition of this abstract is one evidential origin.
  - reference: PMID:39506110
