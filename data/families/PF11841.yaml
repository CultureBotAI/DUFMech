description: This domain is found in eukaryotes and predominantly in ELMO (Elongation and Cell motility)
  proteins and corresponds to the armadillo repeats domain (ARR). It may play an important role in defining
  the functions of the ELMO family members and may be functionally linked to the ELMO domain in these
  proteins [[cite:PUB00073882],[cite:PUB00109603]], being involved in protein-protein interactions.
