description: ThrE is a family of bacterial and Archaeal proteins that catalyse the export of L-threonine
  from the cell [[cite:PUB00075540]]. UniProtKB:Q79VD1 has been characterised as being necessary for this
  export. The domain exhibits 10 putative TMs and catalyses the proton-motive-force-dependent efflux of
  threonine and serine [[cite:PUB00075541]].
