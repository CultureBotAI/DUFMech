description: This family of bacterial proteins includes the outer membrane lipoprotein Flpp3 from Francisella
  tularensis ([swissprot:Q5NF33]). Flpp3, a virulence determinant of tularemia, shows a six stranded beta-sheet
  supported with two crossing alpha-helices. It has a hydrophobic internal cavity that has been suggested
  to bind a small organic molecule. However, its specific function is still unknown [[cite:PUB00100865],[cite:PUB00100866]].
