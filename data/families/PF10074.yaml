description: This domain is found in a group of proteins from proteobacteria, including the hexameric
  transcription factor from Yersinia pseudotuberculosis RovC, which is essential for the activation of
  one of the Type VI secretion systems of this organism (T6SS4). This domain folds into a distinct variant
  of the helix-turn-helix domain that shows an 'extended-turn' motif. It is responsible for DNA binding,
  participating in transcriptional activation and antiactivation to initiate or inhibit horizontal gene
  transfer [[cite:PUB00152791],[cite:PUB00152792]].
