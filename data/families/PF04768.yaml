description: 'This is the C-terminal NAT or N-acetyltransferase domain of bifunctional N-acetylglutamate
  synthase/kinases. It catalyzes the first two steps in arginine biosynthesis. This domain contains the
  putative NAGS - N-acetylglutamate synthase - active site. It is found at the C-terminus of Neurospora
  crassa acetylglutamate synthase - amino-acid acetyltransferase, EC: 2.3.1.1. It is also found C-terminal
  to the amino acid kinase region ([pfam:PF00696]) in some fungal acetylglutamate kinase enzymes [[cite:PUB00110296]].
  it stabilises the yeast NAGK, N-acetyl-L-glutamate kinase, slows catalysis and modulates feed-back inhibition
  by arginine [[cite:PUB00059379]]. This domain is found to be the N-acetyltransferase (NAT) domain, and
  it has a typical GCN5-related NAT fold and a site that catalyzes NAG synthesis which is located >25
  Angstrom away from the L-arginine binding site in the N-terminal domain [pfam:PF00696] [[cite:PUB00074836]].'
