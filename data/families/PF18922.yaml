description: 'This family of proteins is functionally uncharacterised. This family of proteins is found
  in bacteria, archaea, eukaryotes and viruses. Proteins in this family are typically between 260 and
  408 amino acids in length. This entry corresponds to a region of about 200 amino acids in length with
  multiple conserved motifs. There are two conserved sequence motifs: GAP and NGG. In some proteins this
  domain is found associated with various glycosyl transferase enzyme domains, suggesting this domain
  has a related role in glycan biosynthesis.'
