description: This entry represents Thoeris anti-defense 2 from Bacillus phage SP01 (Tad2) and similar
  sequences from tailed bacteriophages and bacterial prophages. Tad2 is an anti-defence protein that counteracts
  the host Thoeris antiviral defence system. It sequesters the immune signalling molecules produced by
  Thoeris TIR-domain proteins in response to phage infection [[cite:PUB00153732]]. This entry also includes
  AcrIIA7 Cas9 inhibitor protein gene.
