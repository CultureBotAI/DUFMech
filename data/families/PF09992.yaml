description: This is a family conserved from bacteria to humans. The structure of a member from Bacteroides
  has been crystallised and modelled onto the luminal region of the human member of the family, the transmembrane
  glycoprotein N-acetylglucosamine-1-phosphodiester alpha-N-acetylglucosaminidase. There is some conservation
  of potentially functional residues, implying that in the bacterial members this family acts in some
  way as a phosphodiester glycosidase [[cite:PUB00078675]]. The human protein is also present, so the
  eukaryotic members are likely to be catalysing the second step in the formation of the mannose 6-phosphate
  targeting signal on lysosomal enzyme oligosaccharides [[cite:PUB00108993]].
