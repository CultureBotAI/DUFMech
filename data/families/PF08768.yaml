description: This domain can be found in THAP4 from mammals and At1g79260 from Arabidopsis. THAP4 catalyzes
  the heme-based conversion of peroxynitrite into nitrate-NO3- in vitro [[cite:PUB00095798]]. At1g79260
  is a nitrophorin-like heme-binding protein that may reversibly bind nitric oxide (NO) and be involved
  in NO transport [[cite:PUB00063678]]. This entry also includes the beta-barrel domain of Caenorhabditis
  elegans protein male abnormal 7 (Mab-7) which plays an important role in determining body shape and
  sensory ray morphology [[cite:PUB00095799]]. Nitrobindins (Nbs), constituting a heme-protein family
  spanning from bacteria to Homo sapiens, display an all-beta-barrel structural organisation. Proteins
  containing this domain are putatively related to fatty acid-binding proteins (FABPs) [[cite:PUB00040845]].
