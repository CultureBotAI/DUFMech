description: This domain is found in multiple copies in a number of bacterial proteins mainly from Actinomycetales.
  It is closely related to domains represented by [pfam:PF01345] and [pfam:PF24346]. Similarly to them,
  this domain contains a conserved N-terminal lysine and a C-terminal asparagine with central aspartate/glutamate
  residues suggesting that some members may contain an isopeptide bond. This domain is sometimes found
  in combination with [pfam:PF01345] or [pfam:PF24346].
