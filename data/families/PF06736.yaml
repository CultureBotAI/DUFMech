description: This family represents the conserved region of transmembrane protein 175 which is an organelle-specific
  potassium channel responsible for potassium conductance in endosomes and lysosomes. It forms a potassium-permeable
  leak-like channel, which regulates luminal pH stability and is required for autophagosome-lysosome fusion.
  TMEM175 is the major lysosomal potassium conductance [[cite:PUB00076705],[cite:PUB00101904]]. It is
  present in eukaryotes, where TMEM175 has two repeats of 6-transmembrane-spanning segments, and also
  in prokaryotes in which it has one copy [[cite:PUB00076705],[cite:PUB00101904],[cite:PUB00097918]].
