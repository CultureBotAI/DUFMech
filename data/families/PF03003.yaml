description: Pox_G9-A16 is a family of two of the eight entry-fusion complex proteins of pox viruses.
  the viral fusion proteins are components of the mature virion, MV, membrane. Extracellular enveloped
  virions (EVs), the infecting particles are MVs with an additional membrane that is opened or removed
  prior to the fusion of the MV and cell membrane during virus entry. G9 and A16 interact closely with
  each other and each is required for membrane fusion and virus entry as well as for interaction with
  A56/K2 [[cite:PUB00078710]].
