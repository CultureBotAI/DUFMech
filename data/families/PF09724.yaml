description: Sister chromatid cohesion protein Dcc1 is a component of the Ctf18-RFC complex. This complex
  is required for the efficient establishment of chromosome cohesion during S-phase and for loading the
  replication clamp Pol30/PCNA, which functions in DNA replication and repair [[cite:PUB00045276],[cite:PUB00109231]].
  Ctf18-RFC loads PCNA onto DNA in an ATP-dependent manner. It may also have PCNA-unloading activity [[cite:PUB00045277]].
