- graph_id: ttr52-substitutions-ptdser-strip-binding
  title: D51A, D80A and N85A reduce TTR-52 binding to PtdSer on lipid strips
  scope: Separately affinity-purified WT and substituted full-length TTR-52-mCherry-Flag secreted from
    transfected 293T cells, 2012 Figure 4. The mammalian production host does not make this a mammalian
    TTR assay.
  context: P-6001 lipid strips; 25 mM Tris-HCl pH 7, 150 mM NaCl, 0.1% Tween 20, 0.1 mM ZnSO4 and 0.2
    mM CaCl2. Block 1 h at 22 C with 1% dried milk; protein incubation overnight at 4 C without milk,
    three washes, anti-Flag detection. Anti-TTR-52 blot checks protein presence. Two independent experiments;
    exact protein dose is not specified.
  family_mapping: D51, D80 and N85 match G5ED35 sequence version 1 and lie within PF01060 at 28-112. The
    study's earlier cDNA deposit matches this reference exactly. Full-length secreted fusion preparations
    are not isolated domain fragments; cleavage and fusion junctions remain construct-specific uncertainties.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:6239
  limitations: Directness concerns the measured immobilized-lipid binding endpoint, not atomic ion coordination,
    bilayer insertion or receptor activation. Blot presence is not exact equimolar loading or a folding
    control. Other lipid signals remain visible in mutant strips. The crystallized six-alanine M5 protein
    and modeled WT coordinates do not directly show a WT binding trajectory. The 2010 strip protocol has
    tenfold higher cation concentrations and is not merged here.
