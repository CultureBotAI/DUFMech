causal_graphs:
- graph_id: ttr52-sm211-corpse-persistence
  title: The sm211 V43M allele increases embryonic corpse persistence
  scope: Whole-animal C. elegans ttr-52(sm211) phenotype compared with N2 Bristol, not an isolated-domain
    biochemical reaction or a gene-null allele.
  context: 2010 Figure 1C; sm211 backcrossed four times to N2. Thirty-three corpses from three WT embryos
    and 32 from three mutant embryos were followed. Four-dimensional microscopy of 300-min embryos uses
    118 mM NaCl/48 mM KCl egg buffer, 26-um stacks with 1.3-um spacing, every 5 min for 150 min. Displayed
    mean durations are 28 +/- 2 versus 55 +/- 6 min, SEM.
  family_mapping: G5ED35 ttr-52/F11F1.7 has 135 residues, sequence version 1, exact UniProt/InterPro agreement
    and PF01060 at 28-112 inclusive. The study's deposited HM130527.1 translation ADO60153.1 matches G5ED35
    exactly. V43 lies inside the match; sm211 is V43M, not the distinct tm2078 deletion.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:6239
  limitations: Corpses are nested within six embryos, not 65 independent embryo replicates. Exact imaging
    temperature and handling of the >110-min histogram bin remain unresolved. Gene mapping and corpse-count
    rescue support the target but do not separately rescue every lifetime endpoint. Altered localization
    can mediate V43M effects; no unique ligand-contact chemistry or increased apoptosis is inferred.
