    subject: sm211-v43m-versus-n2
    predicate: increases
    object: embryonic-corpse-duration
    mechanism: Corpses persist longer in the backcrossed mutant than in N2 under the same microscopy comparison,
      supporting impaired clearance. The observation does not resolve a direct domain-specific chemical
      mechanism or imply more cells initiate apoptosis.
    directness: INDIRECT
