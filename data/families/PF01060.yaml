- graph_id: ttr52-tm2078-wt-transgene-rescue
  title: WT TTR-52 transgene expression reduces persistent corpse counts in tm2078
  scope: Full-length WT TTR-52::mCherry under heat-shock promoters in the ttr-52(tm2078) deletion background,
    2012 Figure 3 upper panel. This is not the sm211 allele or its lifetime assay.
  context: With versus without transgene expression, scored in 1.5-fold embryos after 1 h heat shock at
    33 C and recovery at 20 C, examined 3.5 h after treatment. Two independent transgenic lines, n >=
    15 per line, SEM. The graph adopts the WT rescue comparison, not all substitution or truncation constructs
    in the same figure.
  family_mapping: Full-length G5ED35 sequence version 1 contains PF01060 at 28-112 and agrees with the
    2010 deposited cDNA translation. The signal region 1-20 and C-terminal I113/L132 are outside the current
    profile. Complete transgene junctions and tm2078 deletion boundaries remain unverified.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:6239
  limitations: Corpse count supports genetic rescue of a clearance phenotype, not direct measurement of
    single-corpse duration or prevention of apoptosis. The comparison follows a heat-shock expression
    protocol; it does not establish an isolated protein-dose effect independent of that intervention.
    Variant-label discrepancies elsewhere in Figure 3 are excluded from this WT edge.
