- graph_id: ttr52-sm211-ced1-rings
  title: The sm211 allele decreases CED-1 ring labeling around corpses
  scope: CED-1::GFP localization in 1.5-fold C. elegans embryos carrying smIs34, compared with smIs34;ttr-52(sm211),
    in the 2010 Figure 4B experiment.
  context: Pced-1CED-1::GFP marks corpses identified by Nomarski morphology. Serial optical sections span
    20 um at 1-um spacing. Fifteen embryos per stage and genotype, SEM; the adopted 1.5-fold comparison
    is approximately 64% versus 34% labeled corpses with reported P < 0.0001. Comma-stage data are a separate
    comparison.
  family_mapping: sm211 changes V43 to M in G5ED35, within PF01060 28-112. Reference sequence version
    1 matches the study's HM130527.1 protein translation exactly. Intact secreted TTR-52 is the implicated
    protein, not a purified 28-112 fragment.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:6239
  limitations: Reporter rings are a cellular localization endpoint, not a molecular binding constant or
    a directly tracked recruitment-to-engulfment chain. V43M can change secretion/localization and is
    not interchangeable with a deletion. Separate pull-down and co-IP experiments show association, not
    automatic receptor activation. No endpoint-specific rescue or raw image reanalysis is claimed here.
