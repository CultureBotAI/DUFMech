description: Mitoguardin (Miga) was first identified in flies as a mitochondrial outer-membrane protein
  that promotes mitochondrial fusion. Later, the mammalian Miga homologues, Miga1 and Miga2, were identified.
  They are found to promote mitochondrial fusion by regulating mitochondrial phospholipid metabolism via
  MitoPLD [[cite:PUB00077967],[cite:PUB00077968]].
