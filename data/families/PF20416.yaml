description: This domain is found towards the C-terminal the U3 small nucleolar RNA-associated protein
  20 (UTP20) from yeast and its human homologue, also known as DRIM (Down-Regulated In Metastasis). DRIM
  is differentially expressed in metastatic and non-metastatic human breast carcinoma cells [[cite:PUB00014724]].
  Proteins of this entry are involved in processing of non-coding RNA as components of the small-subunit
  (SSU) processome; SSU processome is involved in the biogenesis of the 18S rRNA [[cite:PUB00014725],[cite:PUB00101284]].
  UTP20 is a huge alpha-solenoid that functions as a scaffold [[cite:PUB00101286],[cite:PUB00101285]].
