description: This family of proteins, found from plants to humans, is PRAT4 (A and B), a Protein Associated
  with Toll-like receptor 4. The Toll family of receptors - TLRs - plays an essential role in innate recognition
  of microbial products, the first line of defence against bacterial infection [[cite:PUB00109675]]. PRAT4A
  influences the subcellular distribution and the strength of TLR responses and alters the relative activity
  of each TLR. PRAT4B regulates TLR4 trafficking to the cell surface and the extent of its expression
  there [[cite:PUB00109676]][[cite:PUB00109677]]. TLR4 recognizes lipopolysaccharide (LPS), one of the
  most immuno-stimulatory glycolipids constituting the outer membrane of the Gram-negative bacteria. This
  family has also been described as a SAP-like MIR-interacting protein family.
