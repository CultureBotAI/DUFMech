description: This domain is predominantly found at the C-terminal end of proteins from cyanobacteria and
  plants, including Biogenesis factor required for ATP synthase 1 (BFA1, [swissprot:F4J1U2]) from Arabidopsis
  thaliana. BFA1 promotes the assembly of the CF1 subcomplex of the chloroplast ATP synthase by specifically
  interacting with the gamma and beta subunits. This domain consists of ten beta-sheets and one alpha-
  helix forming a typical beta-barrel, which locates perpendicularly to [pfam:PF12204] [[cite:PUB00100989]].
