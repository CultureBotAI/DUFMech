description: Members of this entry are serine/threonine-protein kinases and includes ATG1 from yeasts,
  Unc-51 from C. elegans and ULK1-2 from humans. ATG1 is required for vesicle formation in autophagy and
  the cytoplasm-to-vacuole targeting (Cvt) pathway [[cite:PUB00101056],[cite:PUB00066530]]. Unc-51 is
  important for axonal elongation and axonal guidance [[cite:PUB00042769]] and ULK1-2 are involved in
  autophagy in response to starvation [[cite:PUB00098424]]. They consist of a kinase domain at the N-terminal
  ([pfam:PF00069]) and two tandem microtubule interacting and transport (MIT) domains (tMIT) at the C-terminal.
  MIT domains are known to mediate protein-protein interactions. In ATG1, MIT domains mediate the interaction
  with ATG13 [[cite:PUB00101056]]. In ULK1-2, MIT domains control the regulatory function and localization
  of the proteins and also mediate interactions with additional autophagy proteins [[cite:PUB00098424]].
  This is the C-terminal MIT domain (MIT2).
