description: This family contains several S-adenosylmethionine decarboxylase proteins from bacterial and
  archaebacterial species. S-adenosylmethionine decarboxylase (AdoMetDC), a key enzyme in the biosynthesis
  of spermidine and spermine, is first synthesised as a proenzyme, which is cleaved post translationally
  to form alpha and beta subunits. The alpha subunit contains a covalently bound pyruvoyl group derived
  from serine that is essential for activity [[cite:PUB00019108],[cite:PUB00019109]].
