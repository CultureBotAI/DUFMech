description: This is the Rubicon homology domain (RH) characterised at the C-terminal of Rubicon, PLEKHM1
  and Pacer, proteins that modulate late steps in autophagy [[cite:PUB00100995],[cite:PUB00100997]]. Rubicon
  (RUBCN) negatively regulates autophagy and endolysosomal trafficking by inhibiting PI3K complex II (PI3KC3-C2),
  which impairs autophagosome maturation process. PLEKHM1 is an adapter protein that regulates Rab7-dependent
  and HOPS complex-dependent fusion events in the endolysosomal system and couples autophagic and the
  endocytic trafficking pathways [[cite:PUB00100999],[cite:PUB00100998]]. On the other hand, Pacer positively
  regulates autophagy, promoting autophagosome maturation by facilitating the biogenesis of phosphatidylinositol
  3-phosphate (PtdIns3P) in late steps of autophagy; it antagonises RUBCN [[cite:PUB00101000]]. This domain
  contains nine conserved cysteines and one conserved histidine, which have been predicted to bind divalent
  zinc cations being required for Rubicon and PLEKHM1 to interact with Rab7.
