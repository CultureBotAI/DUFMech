description: This entry includes small conductance mechanosensitive channels (MscS), which assembles to
  a homoheptameric complex [[cite:PUB00019883],[cite:PUB00019884],[cite:PUB00019885],[cite:PUB00101036],[cite:PUB00062568],[cite:PUB00101037]].
  Each monomer consists of a N-terminal transmembrane region and a large cytoplasmic segment composed
  of a five-stranded antiparallel beta-sheet (middle/second) domain and a C-terminal alpha/beta-domain
  [[cite:PUB00101036],[cite:PUB00062568],[cite:PUB00101037],[cite:PUB00064132]]. This is the beta domain
  which adopts a Sm-like barrel structure.
