- graph_id: mscs-double-cysteine-redox-response
  title: DTT reversibly restores pressure-evoked N117C/G168C MscS activity
  scope: Full-length N117C/G168C MscS in MJF429, which lacks mscK and mscS but retains MscL. The endpoint
    is detectable MscS channel activity, not a directly measured disulfide reaction.
  context: Figure 6B inside-out patches with the 2011 pH 7.2 bath and +15 mV pipette protocol. Control,
    2.5 mM DTT and washout are compared at the illustrated pressure steps; MscL openings remain a pressure-response
    control. Single-cysteine channels are active in Figure 6A, but its caption does not assign their individual
    patches to a strain.
  family_mapping: P0C0S1 reference N117 and G168 both lie in PF00924 residues 114-180. N117 belongs structurally
    to TM3b and G168 to the beta domain. Native full-length channel mutations, not a truncated-domain
    reconstitution, underlie these comparisons.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: Reversible reducing-agent dependence supports a redox-sensitive constraint but does not
    itself measure an S-S bond or distinguish closed from inactivated states. Complete construct sequence,
    temperature, independent replicate counts and folding controls are unresolved. No universal redox
    regulation of WT MscS is inferred.
