causal_graphs:
- graph_id: mscs-interface-pressure-adaptation
  title: G168D impairs MscS current adaptation and N117K restores it in the double mutant
  scope: Full-length E. coli MscS variants in inside-out membrane patches from MJF465 lacking mscK, mscS
    and mscL; adopted endpoint is current decline during sustained pressure, not an isolated beta-domain
    activity.
  context: pTRCMscS variants; bath 400 mM sucrose, 200 mM KCl, 90 mM MgCl2, 4 mM CaCl2, 5 mM HEPES at
    pH 7.2. Pipette solution omits sucrose; pipette voltage is +15 mV. Pressure steps are separated by
    at least 3 min. Figure 4 displays three pressure responses from the same patch per genotype, not three
    independent replicates.
  family_mapping: UniProtKB:P0C0S1, mscS/yggB/b2924/JW2891, is a 286-residue K-12 reference, sequence
    version 1. Exact UniProt/InterPro agreement places PF00924 at 114-180, including N117 and G168. The
    paper's structural beta domain is 128-181 and places N117 in TM3b. HMM and structural boundaries must
    not be conflated; complete experimental clone junctions remain unverified.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: The 2011 protocol does not distinguish desensitization from inactivation. No direct salt-bridge
    formation or interdomain motion is measured; cartoons are interpretations. Pressure levels differ
    among traces and no exact common-pressure rate is claimed. Temperature, patch-specific induction and
    independent replication are not established by the adopted panels.
