- graph_id: mscs-crowding-conditioned-inactivation
  title: Cytoplasmic Ficoll promotes tension-conditioned WT MscS inactivation more than G168D
  scope: Figure 4D/E of the 2014 study, using full-length WT and G168D MscS and pulse-step-pulse availability
    measurements. This is distinct from the 2011 sustained-pressure adaptation protocol.
  context: pB10b expression; Methods name MJF465 and PB113, with retained MscL in PB113 used for mutant
    midpoint calibration, but do not assign each Figure 4 patch to one strain. Inside-out bath has 400
    mM sucrose, 200 mM KCl, 50 mM MgCl2, 5 mM CaCl2, 5 mM HEPES at pH 7.4; pipette potential 30 mV. Cytoplasmic
    Ficoll 400 is 5% w/v, n=3 patches per genotype, with a 10-second conditioning tension between test
    pulses.
  family_mapping: G168D changes the reference glycine within P0C0S1 PF00924 residues 114-180. The intact
    channel, membrane and controlled mechanical perturbation are the tested system, not isolated beta-domain
    sufficiency. Full pB10b clone sequence is not independently reconstructed.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: Inactivation is operationally measured through the decreased channel population available
    at the second test pulse. Tension is required; Ficoll alone is not assigned a sufficient cause. Pressure-to-tension
    conversion uses reference midpoints and a constant-curvature assumption. Cage compression, salt bridges
    and specific atomic trajectories are not directly observed. Panels A/B use 10% Ficoll and must not
    be substituted for the D/E conditions.
