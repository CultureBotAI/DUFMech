description: 'This entry represents the N-terminal domain of the DOCK-C subfamily (DOCK 6, 7, 8) and DOCK-D
  subfamily (DOCK 9, 10, 11). DOCK family members are evolutionarily conserved guanine nucleotide exchange
  factors (GEFs) for Rho-family GTPases [[cite:PUB00014935],[cite:PUB00073863]], required during several
  cellular processes, such as cell motility and phagocytosis. DOCK proteins are categorised into four
  subfamilies based on their sequence homology: DOCK-A (DOCK1/180, 2, 5), DOCK-B subfamily (DOCK3, 4),
  DOCK-C subfamily (DOCK6, 7, 8), DOCK-D subfamily (DOCK9, 10, 11) [[cite:PUB00014935]].'
