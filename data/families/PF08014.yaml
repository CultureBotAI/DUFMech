description: This entry includes microtubule-associated tyrosine carboxypeptidases, proteins that remove
  the C-terminal tyrosine residue of alpha-tubulin, thereby regulating microtubule dynamics and function
  [[cite:PUB00101358]]. They are also able to remove the C-terminal phenylalanine residue of alpha-tubulin
  TUBA8 [[cite:PUB00101358]]. These proteins recognise adjacent tubulin dimers along the same protofilament
  [[cite:PUB00101358]].
