description: This protein family includes Protein YebY from Escherichia coli and similar proteins predominantly
  found in Gammaproteobacteria. YebY is a component of the AZY copper uptake system, where it functions
  as a negative regulator of the copper importer YebZ [[cite:PUB00163268]]. At high copper concentrations,
  YebY may act as a safety valve, preventing toxic copper overload by inhibiting the import activity of
  YebZ and YobA [[cite:PUB00163268]]. The reduced form of YebY binds Cu(+) and Cu(2+) with low affinity
  and shows low specificity, also binding Co(2+), Ni(2+), and Ag(+) [[cite:PUB00100157]]. However, the
  low affinity of copper binding, together with the stabilisation imparted by a disulphide bond, suggests
  that this metal binding is likely not physiologically relevant [[cite:PUB00100157]].
