description: This family consists of several short hypothetical Enterobacteria proteins of unknown function.
  Structural analysis of the surface features of the protein YvyC has revealed a single cluster of highly
  conserved residues on the surface. Additionally, these residues fall into two groups which lie within
  the two largest of the three cavities identified over the surface. The conclusion from this is that
  these two cavities with, Leu 58, Glu 75, Ile 82, and Glu 83 and Pro 86, conserved, are likely to be
  important for the molecular function and reflect the cavities found on the surface of the FlaG proteins
  in [pfam:PF03646].
