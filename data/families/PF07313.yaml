description: This family includes N-acetylmuramoyl-L-alanine amidase (AMA) from Bacteroides uniformis
  and similar bacterial proteins. AmiA hydrolyses GlcNAc-1,6-anhydro-MurNAc-peptide into disaccharide
  and stem peptide. It shows an alpha/beta/alpha three-layered sandwich fold with a catalytic core that
  consists of a central five-stranded beta-sheet and four alpha-helices. It is structurally related to
  NlpC/P60 gamma- D-Glu-meso-diaminopimelic acid amidases [[cite:PUB00100890]].
