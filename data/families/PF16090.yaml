description: This domain is found in protein capicua homolog (Cic) and similar animal proteins. Cic is
  a transcriptional repressor which plays a role in the development of the central nervous system (CNS).
  In concert with ATXN1 and ATXN1L, it is involved in brain development [[cite:PUB00148730],[cite:PUB00053281],[cite:PUB00148732]].
  This domain is predicted to adopt a mainly beta-configuration.
