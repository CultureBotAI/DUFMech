- graph_id: trmbl1-md-mutants-2007
  title: TrmBL1 mutant preparations reduce reported MD-promoter EMSA retardation
  scope: Full-length P. furiosus PF0124/TrmBL1 C-His6 pSL242-derived Y49N, D50N and Y49N/D50N preparations
    compared with the paper's WT comparator. Its exact tag is unresolved; general WT DNA experiments use
    N-His6. These are preparation comparisons, not isolated substitution effects proven free of tag/folding
    confounds.
  context: Original Figure 10 caption gives 1.25 and 2.5 uM WT/mutant protein. General EMSA 10 uL, 25
    mM HEPES pH 7.5/150 mM NaCl, 40 nCi labelled PCR DNA stated as 0.5-1 uM, 0.5 ug poly(dI-dC), 40 C
    for 10 min; 6% native PAGE at room temperature, 200 V/1x TBE. MD fragment endpoints and lane order
    remain unverified.
  family_mapping: Q8U4G4 sequence 1/entry 96 reference has 341 aa with Y49/D50 inside PF01978 (10-77);
    PF11495 (112-248) and PF31112 (256-339) are separate regions. Mutant sequencing is reported but complete
    inserts were not inspected. TrmB Y50/D51 are not these residues/protein.
  scope_status: PHENOTYPIC
  limitations: Original Figure 10 image was not inspected; source Results/caption/methods support reported
    outcomes only. WT-tag equivalence is asserted generally without shown data; exact comparator, active
    fraction and mutant folding/assembly remain unresolved. No zero affinity, atomic DNA contact, isolated-domain
    sufficiency, epistasis or family-wide essentiality is concluded. D50N is not Y49N; ledger L3-L5.
