discussions:
- discussion_id: trmb-construct-and-domain-boundaries
  prompt: Resolve complete constructs and distinguish PF01978-dependent effects from other-domain and
    whole-protein effects.
  kind: CURATION_TODO
  status: OPEN
  rationale: Q7LYW4 and Q9HGZ9 have identical reference bodies and PF01978 at 11-77, but the pSL152 species
    attribution differs between Lee2003 and the Surma thesis. Y50 is within PF01978; E87 and the sugar-binding
    domains are not. Reference equivalence cannot establish identical experimental inserts or strains.
  evidence:
  - reference: PMID:12426307
    supports: PARTIAL
    evidence_source: primary_publication
    explanation: The original cloning methods identify T. litoralis chromosomal DNA and C-terminal His6
      pSL152; full inserted sequence was not independently inspected.
  - reference: doi:10.5283/epub.14529
    supports: PARTIAL
    evidence_source: doctoral_thesis
    explanation: Methods calls the same plasmid PF1743 and Chapter 7 uses supplied mutant plasmids; complete
      inserts and mutant-specific folding controls remain unresolved.
  - reference: PMID:23576322
    supports: PARTIAL
    evidence_source: primary_publication_and_deposition
    explanation: Reported V161A and inconsistent C-terminal tails disagree with the 3QPH sequence and
      actual Val161 atoms. No silent sequence correction or neutrality assumption is made.
  posed_by: Codex
  posed_date: '2026-10-15'
  notes: See all five PF01978 ledgers for reference, construct and assay provenance. Q8U4G4 sequence version
    1/entry 96 maps PF01978 to 10-77; TrmBL1 E40/D50 are inside it, but E81/E85/D86 are outside. ED85AA
    is a double perturbation, not two independently tested causes. Materials list VC1 and the methods
    report sending mutant plasmids for sequencing, but complete physical inserts remain independently
    unverified. Thesis pCS19/C-terminal His6 differs from the 2007 transcription preparation; FBPase cloning
    sites disagree. No isolated-domain sufficiency or atomic DNA contact is asserted. Lee2007 Y49 also
    maps inside PF01978; pSL242 mutants carry C-terminal His6, while general WT DNA assays use N-terminal
    His6. The Figure 10 WT comparator tag and assay-specific tags for SEC and radioligand binding remain
    unresolved.
- discussion_id: trmb-assay-context-and-residual-activity
  prompt: Resolve preparation carryover and assay-specific outcomes before assigning a single sugar-to-DNA
    regulatory mechanism.
  kind: CURATION_TODO
  status: OPEN
  rationale: Trehalose relieves transcriptional repression but increases region-1 EMSA retardation under
    different conditions. The thesis stores proteins in glucose-containing buffer without dialysis; no-added-sugar
    assays are not established sugar-free. Y50N and E87A retain concentration-dependent repression.
  evidence:
  - reference: PMID:12426307
    supports: SUPPORT
    evidence_source: primary_text_and_captions
    explanation: Figures 6 and 8 describe different trehalose effects; original figure images were not
      available through the attempted access routes.
  - reference: doi:10.5283/epub.14529
    supports: SUPPORT
    evidence_source: doctoral_thesis_and_original_figures
    explanation: Methods pp.39-41 and Figures 18-23, 32-35, 45-48 and 51 retain glucose carryover, residual/nonmonotonic
      activity, unmatched buffers or nuclease amounts and diffuse shifts. Figure 22B retains 2% signal
      despite zero-output prose; Figure 35 tables contradict blanket below-10% wording. These prevent
      exact affinity, stoichiometry and atomic-contact claims.
  posed_by: Codex
  posed_date: '2026-10-15'
  notes: Obtain stock compositions, active fractions, replicate/error estimates and direct occupancy/competition
    measurements. Retain prior residuals, nonmonotonicity, Figure 20 percentage-point distinction and
    Figure 28/41-43 discrepancies. Figure 52 requires same-dose and panel-specific WT controls; some nominally
    complete repression retains 8/12/10. Figure 53 has template-label and 25/30 ng DNA conflicts. Figure
    54 WT/mutant comparisons match nuclease dose even though no-protein lanes do not. Own-promoter EMSA/footprints
    failed through aggregation; that is not measured loss of mutant binding. See all five ledgers; no
    uniform inhibition, stable activation or native flux claim is made. The fifth ledger retains Lee2007's
    reported maltotriose competition, not a fitted Kd/Km; Results fructose versus Methods sucrose remains
    conflicting. SEC apparent mass is not measured subunit stoichiometry. Original 2007 figure images
    were not inspected.
