- graph_id: trmbl1-maltotriose-chase-2007
  title: Unlabelled maltotriose reduces the reported TrmBL1-associated tracer signal
  scope: Lee2007 recombinant full-length P. furiosus PF0124/TrmBL1 preparation, assay-specific tag and
    complete insert unresolved. This precipitation/filter assay does not isolate the PF01978 domain.
  context: Reported 5 uM protein/0.47 uM radiolabelled maltotriose with a 5 mM unlabelled competitor.
    General assay 100 uL, 25 mM HEPES pH 7.5/300 mM KCl, 70 C for 5 min; saturated ammonium-sulphate precipitation,
    ice for 10 min, 0.45 um cellulose-nitrate filtration, 95%-saturated wash and scintillation counting.
    Chase timing is unspecified.
  family_mapping: Q8U4G4 sequence 1/entry 96 reference has 341 aa; PF01978 10-77, PF11495 112-248, PF31112
    256-339. The reference body does not establish the full tagged construct or the domain responsible
    for the sugar response.
