- graph_id: tl-trmb-tm-transcription-2003
  title: TrmB represses reconstituted malE transcription with sugar-specific relief
  scope: Full-length T. litoralis pSL152 TrmB with a C-terminal His6 tag; whole-protein activity in a
    heterologous reconstituted transcription system.
  context: Linearized pMLP malE template, P. furiosus TBP/TFB/RNAP, 80 C; 0.8-3.2 ug TrmB. At 3.2 ug TrmB,
    added maltose at 100 uM or trehalose at 2.5 mM relieves repression. Buffer and component amounts are
    retained in ledger S1a; reaction duration and volume remain unresolved.
  family_mapping: Q7LYW4 sequence 1/entry 91 is the 338-aa T. litoralis reference, with PF01978 11-77,
    PF11495 110-234 and PF31112 249-335. The exact study strain and full insert were not independently
    established; this is not isolated PF01978 activity.
  scope_status: MECHANISTIC
  limitations: Primary methods, results and Figure 8 caption inspected, not its original image. The gdh
    lane controls the transcription system, not a full TrmB specificity series. Relief of repression does
    not establish DNA release or native transporter flux; trehalose prose/caption threshold wording differs.
