description: This family of proteins is found in eukaryotes and includes Cation channel sperm-associated
  auxiliary subunit TMEM249 from human (also known as C8orfK29). It is an auxiliary component of the CatSper
  complex, a complex involved in sperm cell hyperactivation [[cite:PUB00100197]]. TMEM249 contributes
  to the assembly of the CatSpermasome.
