description: This family represents a group of uncharacterised proteins including a bacterial stress protein
  YcjX. The crystal structure of YcjX from Shewanella oneidensis has now been solved, and shows it to
  be a Ras-like GTP-binding protein. However, YcjX utilizes a non-canonical switch 2' motif not found
  in any other G protein [[cite:PUB00098451]].
