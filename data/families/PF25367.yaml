description: This entry represents a domain of unknown function (DUF) identified in Trypanosoma. Based
  on structural predictions, this domain is hypothesised to adopt a winged helix-turn-helix (HTH) fold.
  Winged helix DNA-binding proteins share a characteristic winged helix-turn-helix DNA-binding motif,
  in which the "wings", or loops, are small beta-sheets [[cite:PUB00013195]].
