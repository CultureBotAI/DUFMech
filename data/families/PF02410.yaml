description: This family is expressed by almost all bacterial and eukaryotic genomes but not by archaea.
  Its function is to down-regulate protein synthesis under conditions of nutrient shortage, and it does
  this by binding to protein L14 of the large ribosomal subunit, thus acting as a ribosomal silencing
  factor (RsfS) by blocking the joining of the ribosomal subunits [[cite:PUB00064845]]. This family is
  structurally homologous to nucleotidyltransferases.
