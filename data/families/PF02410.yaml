causal_graphs:
- graph_id: ecoli-rsfs-preassociation
  title: E. coli RsfS suppresses ribosome association and oligo(Phe) synthesis
  scope: Purified N-terminal His6-tagged E. coli b0637 RsfS, called RsfA in the paper, expressed in BL21(DE3);
    E. coli ribosomal subunits and purified translation factors.
  context: Preincubate 18 pmol 50S with 180 ug poly(U) and with or without 360 pmol RsfS in 90 uL for
    10 min at 37 C, then 10 pmol 30S for 10 min. Buffer contains 20 mM HEPES pH 7.6 at 0 C, 4.5 mM Mg
    acetate, 150 mM K acetate, 4 mM beta-mercaptoethanol, 2 mM spermidine and 0.05 mM spermine. Sister
    aliquots undergo sucrose gradients or precharged Phe-tRNA/factor-dependent synthesis for 2 min at
    30 C.
  family_mapping: b0637 maps to UniProtKB:P0AAT6, sequence version 1, 105 residues; PF02410 spans 9-104.
    The experiment uses the tagged protein, not an isolated domain interval.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: The two endpoints are measured separately in sister aliquots, not independent replication.
    Preassembled programmed 70S does not show the same strong suppression; no literally zero effect is
    claimed. Steric contacts from docking and binding assays are not separate observed causal steps. Human
    mitochondrial and later pre-50S biogenesis contexts remain separate.
