description: This domain of unknown function occurs in Epoxyqueuosine reductase QueG, an iron-sulfur cluster-binding
  protein, together with the 4Fe-4S binding domain ([pfam:PF00037]). QueG catalyses the conversion of
  epoxyqueuosine (oQ) to queuosine (Q), which is a hypermodified base found in the wobble positions of
  tRNA(Asp), tRNA(Asn), tRNA(His) and tRNA(Tyr) [[cite:PUB00058202]].
