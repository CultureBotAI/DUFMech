description: This family includes lipoprotein GfcB (YmcC), involved in group 4 capsule polysaccharide
  formation [[cite:PUB00066719]]. YjbF is a family of Gram-negative bacterial outer-membrane lipoproteins,
  predicted to be a beta-barrel and possibly a porin that is one of four gene-products expressed from
  an operon, yjbEFGH, which is regulated by the Rcs phosphorelay in a RcsA-dependent manner, similar to
  that of other exopolysaccharide biosynthetic pathways. It is highly possible that the yjbEFGH operon
  encodes a system involved in EPS secretion since none of the products is predicted to have enzymic activity,
  the products are all secreted and YbjF and H are predicted to be beta-barrel lipoproteins similar to
  porins. It may be that the operon products play some role in biofilm formation and/or matrix production
  [[cite:PUB00066719]].
