description: LptE (formerly known as RplB) is involved in lipopolysaccharide-assembly on the outer membrane
  of Gram-negative organisms. The lipopolysaccharide component of the outer bacterial membrane is transported
  from its source of origin to the outer membrane by a set of proteins constituting a transport machinery
  that is made up of LptA, LptB, LptC, LptD, LptE. LptD appears to be anchored in the outer membrane,
  and LptE forms a complex with it. This part of the machinery complex is involved in the assembly of
  lipopolysaccharide in the outer leaflet of the outer membrane [[cite:PUB00053165]].
