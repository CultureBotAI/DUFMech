description: This entry, previously known as DUF778, represents RTE1 (REVERSION-TO-ETHYLENE SENSITIVITY1)
  from Arabidopsis thaliana. RTE1 is positive regulator of the ETR1 ethylene receptor, leading to negative
  regulation of ethylene responses.[[cite:PUB00092499],[cite:PUB00092500]]. This entry also includes Arabidopsis
  RTE1 homologue, RTH, which acts via RTE1 in regulating ethylene responses and signaling [[cite:PUB00092501]].
  This domain is also present in TMEM222 from animals which in humans plays a role in brain development
  and function and mutations result in autosomal recessive neurodevelopmental disorder. This domain has
  been identified as structurally similar to peptidase C97 domain ([pfam:PF05903]).
