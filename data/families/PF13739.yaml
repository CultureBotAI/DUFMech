description: This domain forms an alpha-beta-two layer sandwich. It is found in the Bacillus subtilis
  proteins anti-sigma-V factor RsiV, which downregulates SigV activity [[cite:PUB00084362]], and peptidoglycan-N-acetylmuramic
  acid deacetylase PdaC, which catalyzes the deacetylation of N-acetylmuramic acid which makes the peptidoglycan
  resistant to lysosyme [[cite:PUB00084363]]. It is found in association with Heat-shock cognate 70kd
  protein 44kd ATPase, [pfam:PF11738].
