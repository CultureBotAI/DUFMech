description: Mec-17 is the protein product of one of the 18 genes required for the development and function
  of the touch receptor neuron for gentle touch. Mec-17 is specifically required for maintaining the differentiation
  of the touch receptor [[cite:PUB00053857]]. The family shares all the residue-motifs characteristic
  of Gcn5-related acetyl-transferases, though the exact unction is still unknown [[cite:PUB00044970]].
