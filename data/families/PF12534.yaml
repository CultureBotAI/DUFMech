description: Pannexin_like is a family of the four transmembrane domains of metazoan leucine-rich-repeat-containing
  8 proteins. These four TMs associate into hexamers resulting in homo- or heteromeric channels that connect
  the cytosol to the extracellular space. The family is found in association with [pfam:PF00560] [[cite:PUB00075689]].
