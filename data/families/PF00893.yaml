- graph_id: emre-positive-potential-proton-efflux
  title: Positive-inside potential supports outward proton flux through EmrE
  scope: Figure 7F WT versus E14Q E. coli EmrE proteoliposomes after valinomycin then ethidium addition;
    neutral-potassium WT preparation is a separate comparator within the assay.
  context: 3:1 POPC/POPG; pH about 7.5 on both sides, 50 mM MOPS inside and 0.05 mM outside. Inside contains
    1 mM KCl and 99 mM NaCl; outside contains 100 mM KCl. Valinomycin at 1 ug/mL generates positive-inside
    potential. External pH is measured by microelectrode and acid/base calibration. Figure 7H reports
    SD and n=3; the main text does not resolve panel-specific ethidium dose, temperature or protein-to-lipid
    ratio within its overall 1:400-1:1000 range.
  family_mapping: P23895 full-length reference has PF00893 at 3-94; E14Q changes the mapped glutamate.
    The 2017 experiment cites the pET15b/His6-cleavage protocol leaving GS at the N terminus. Purification-host
    BL21(DE3) and K-12 reference identity remain distinct; complete later construct sequences are not
    established here.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: The observed variable is proton movement. Its compatibility with electrogenic antiport
    does not independently fix every drug/proton stoichiometry or prove an elementary proton-transfer
    role for E14. E14Q is a functional control, not a folding-rescue experiment. The figure does not show
    rapid drug-free leakage when potential is applied.
