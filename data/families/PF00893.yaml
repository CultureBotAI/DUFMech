description: This family is the Small Multidrug Resistance (SMR) family. Several members have been shown
  to export a range of toxins, including ethidium bromide ([[cite:PUB00019898]] and quaternary ammonium
  compounds [[cite:PUB00002174]], through coupling with proton influx [[cite:PUB00019899]].
