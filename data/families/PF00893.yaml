discussions:
- discussion_id: emre-microscopic-coupling-and-family-coverage
  prompt: Resolve microscopic proton/drug coupling and extend beyond the three reconstituted EmrE contexts.
  kind: CURATION_TODO
  status: OPEN
  rationale: Direct proton-flux measurements do not independently identify every transported drug molecule,
    transient binding state or unique stoichiometric pathway. Neither a universal strict antiport cycle
    nor a rapid proton leak follows from these observations.
  evidence:
  - reference: PMID:29114048
    supports: PARTIAL
    evidence_source: full_text
    explanation: Figure 7 and Results support three condition-specific proton responses and E14Q controls.
      Figure 6 is simulation, and the negative-potential discussion retains competing microscopic routes.
      The supplemental PDF route returned HTML; its additional tables and traces were not inspected.
  - reference: PMID:22178925
    supports: PARTIAL
    evidence_source: selected_full_text
    explanation: The cited expression method specifies Chang pET15b, N-terminal His6 cleavage and a GS
      remnant. Only relevant construct/purification sections were adopted, not an independent curation
      of its NMR or structural graphs.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: Obtain the supplement, exact later clone and assay conditions; test drug movement and microscopic
    alternatives with independent primary measurements. The 2026 proton-hopping study is a follow-up lead
    whose full text was inaccessible in the attempted routes, not adopted evidence. Other SMR members,
    substrates, mutation contexts and cellular resistance remain incompletely reviewed. Status remains
    IN_PROGRESS.
causal_graphs:
- graph_id: emre-ph-gradient-proton-efflux
  title: Ethidium addition drives EmrE-dependent proton release under a pH gradient
  scope: Reconstituted E. coli EmrE in 3:1 POPC/POPG liposomes, Figure 7D. This is an intact-protein membrane
    assay, not an isolated Pfam interval or a cellular drug-resistance assay.
  context: Interior 100 mM MES at pH 6; exterior 0.5 mM MOPS adjusted to about pH 8; 100 mM KCl on both
    sides. External ethidium is 50 uM. The experiment compares 1:500 and 1:1000 EmrE-to-lipid molar ratios
    at fixed liposome amount, empty liposomes and DCCD-inactivated EmrE. A microelectrode follows external
    pH; calibrated base additions quantify release. Subsequent valinomycin and protonophore additions
    are controls, not requirements for the initial release.
  family_mapping: UniProtKB:P23895, emrE/b0543/JW0531, is a 110-residue K-12 reference, sequence version
    1, with exact UniProt/InterPro sequence agreement and PF00893 at 3-94 inclusive. Reference E14 is
    within that interval. The paper names E. coli EmrE expressed in BL21(DE3) and cites the Chang pET15b
    protocol with N-terminal His6 removal leaving GS. Complete 2017 plasmid sequences were not independently
    verified; reference numbering excludes the GS remnant and K-12 is not the expression-host identity.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: Proton release is directly measured, whereas drug accumulation and exact microscopic coupling
    ratios are not independently read out by this pH trace. Similar release at two protein densities argues
    against binding-only release but does not establish a unique transport cycle. Assay temperature remains
    unresolved; the unavailable supplement and raw traces were not reanalyzed. This result does not imply
    universal strict 2H-per-drug antiport.
