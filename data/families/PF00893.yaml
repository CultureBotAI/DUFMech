- graph_id: emre-negative-potential-proton-influx
  title: Negative-inside potential reverses the net EmrE proton response
  scope: Figure 7G WT and E14Q proteoliposomes with valinomycin added before ethidium. The reversed order-of-addition
    trace is a separate interpretive control, not the same time course.
  context: 3:1 POPC/POPG at pH about 7.5, with 50 mM MOPS inside and 0.05 mM outside. Inside has 100 mM
    KCl; outside has 1 mM KCl and 99 mM NaCl. Valinomycin at 1 ug/mL establishes negative-inside potential
    before ethidium addition. A calibrated external-pH microelectrode reports net proton uptake. Exact
    panel-specific ethidium dose, temperature and protein-to-lipid ratio remain unresolved from the main
    text.
  family_mapping: E. coli EmrE P23895, 110 native residues, sequence version 1; PF00893 interval 3-94
    contains native E14. This is an intact reconstituted protein from the cited expression/purification
    workflow, not an isolated-domain assay or direct measurement in the K-12 reference strain.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: Proton influx is observed, but a unique simultaneous proton/drug symport path is not. The
    source discusses mixed import/export stoichiometries as an alternative and acknowledges that the assay
    cannot definitively distinguish them. Raw traces, supplementary quantitation, folding controls and
    complete mutant clone sequence were not independently assessed. No universal proton leak or all-SMR
    mechanism is assigned.
