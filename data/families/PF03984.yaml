description: This repeat is found as seven tandem copies in carbohydrate-binding proteins, including Fucose-binding
  Lectin from Photorhabdus laumondii ([swissprot:Q7N8J0]) and similar fungal and bacterial proteins. It
  is composed of beta-strands and forms a seven-bladed beta-propeller structure [[cite:PUB00100843],[cite:PUB00100844]].
  It is found in association with BNR repeats, which also form a beta-propeller.
