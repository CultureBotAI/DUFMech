description: This entry represents a small N-terminal domain of approximately 40 residues found in bacterial
  signal transduction histidine kinases and diguanylate cyclases. The domain is composed of an alpha helix
  and beta hairpin. It is located N-terminal to PAS domains ([pfam:PF00989]) and ultimately HisKA ([pfam:PF00512])
  and HATPase_c ([pfam:PF02518]) domains. This family is found in bacteria, predominantly Pseudomonadota
  and Bacteroidota. The function of this domain remains to be determined.
