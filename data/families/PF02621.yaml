description: This family includes two enzymes which are involved in menaquinone biosynthesis. One which
  catalyses the conversion of cyclic de-hypoxanthine futalosine to 1,4-dihydroxy-6-naphthoate, and one
  which may be involved in the conversion of chorismate to futalosine [[cite:PUB00045374]]. These enzymes
  comprise two domains with alpha/beta structures, a large domain and a small domain. A pocket between
  the two domains may form the active site, a conserved histidine located within this pocket could be
  the catalytic base [[cite:PUB00057460]].
