description: This family consists of several short bacterial proteins, including Uncharacterized protein
  YqgQ from Bacillus subtilis. YqgQ folds into a three-helical bundle, with the helix order being left-handed
  and with the third helix flanked by a loop. Based on sequence and structural homology, this protein
  is thought to be involved in single-stranded nucleic acid binding [[cite:PUB00101010]].
