description: 'This domain is found in bacteria, archaea and a few lower eukaryotes species. There are
  two conserved sequence motifs: LDP and DHA. Many members of this family have been annotated as dihydropteroate
  synthases, however no experimental evidence can be found for this and [swissprot:Q57571] has been shown
  not to possess dihydropteroate synthase activity [[cite:PUB00057368]]. In bacteria, this domain is found
  in predicted conflict systems that also encode genes for an active Thymidylate synthase and a pterin-dependent
  one-carbon carrier (MtrA domain). This system is predicted to deplete virally generated nucleotides
  and replace them with a nucleotide that restricts invasive DNA or protects host DNA [[cite:PUB00155486]].'
