description: This Mediator complex subunit was formerly known as Srb4 in yeasts or Trap80 in Drosophila
  and human. The Med17 subunit is located within the head domain and is essential for cell viability to
  the extent that a mutant strain of cerevisiae lacking it shows all RNA polymerase II-dependent transcription
  ceasing at non-permissive temperatures.
