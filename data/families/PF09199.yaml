description: This OB-fold domain folds into a five-stranded beta-barrel [[cite:PUB00018994]]. Members
  of this family are found in various staphylococcal toxins described as staphylococcal superantigen-like
  (SSL) proteins that are related to the staphylococcal enterotoxins (SEs) or superantigens. These SSL
  proteins of which 11 have so far been characterised have a typical SE tertiary structure consisting
  of a distinct oligonucleotide/oligosaccharide binding (OB-fold), this domain, linked to a beta-grasp
  domain, family Stap_Strp_tox_C, [pfam:PF02876]. SSLs do not bind to T-cell receptors or major histocompatibility
  complex class II molecules and do not stimulate T cells. SSLs target components of innate immunity,
  such as complement, Fc receptors, and myeloid cells 2,3,4,5,6,7,8]. SSL protein 7 (SSL7) is the best
  characterised of the SSLs and binds complement factor C5 and IgA with high affinity and inhibits the
  end stage of complement activation and IgA binding to FcalphaR [[cite:PUB00065773]].
