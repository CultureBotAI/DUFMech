description: This domain contains several highly conserved charged amino acids, suggesting this may be
  an enzymatic domain (Bateman A pers. obs). The entry includes SanA [swissprot:P33017] and Sfix ([swissprot:O33790])
  from Salmonella typhimurium which are involved in Vancomycin resistance [[cite:PUB00019464]]. These
  proteins may be involved in murein synthesis [[cite:PUB00019465]]. This domain is found in Escherichia
  coli YdcF, which has been shown to bind S-adenosyl-L-methionine (AdoMet), but whose biochemical function
  has not been identified [[cite:PUB00050945]].
