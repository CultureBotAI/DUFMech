description: Members of this family of bacterial domains are predominantly found in transglutaminase and
  transglutaminase-like proteins. Their exact function is, as yet, unknown, but they are likely to act
  as amidoligase enzymes [[cite:PUB00053382]] Protein in this family are found in conserved gene neighborhoods
  encoding a glutamine amidotransferase-like thiol peptidase (in proteobacteria) or an Aig2 family cyclotransferase
  protein (in firmicutes) [[cite:PUB00053382]].
