description: The function of this protein domain family is yet to be characterised. It is putatively thought
  to lie in the C-terminal domain of the DNA nucleotide repair protein, Xeroderma pigmentosa complementation
  group A (XPA). The function of XPA is to bind to DNA and repair any mismatched base pairs. This domain
  family is often found in eukaryotes, and is approximately 70 amino acids in length. There is a conserved
  DPE sequence motif. In humans, this protein is encoded for in the chromosomal position, Chromosome 5
  open reading frame 65. Mutations in the gene lead to myelodysplastic syndromes, where there is inefficient
  stem cell production in the bone marrow. This suggests that the protein may have a role in forming blood
  cells [[cite:PUB00067380]].
