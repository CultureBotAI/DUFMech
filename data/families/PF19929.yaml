description: This family includes immunity protein CdiI from Erwinia chrysanthemi and related sequences,
  predominantly from gammaproteobacteria. It is an immunity protein component of a toxin-immunity protein
  module, which functions as a cellular contact-dependent growth inhibition (CDI) system. CDI modules
  allow bacteria to communicate with and inhibit the growth of closely related neighbouring bacteria in
  a contact-dependent fashion. It protects cells against the DNase activity of CdiA, its cognate toxin
  protein, but not against non-cognate CdiA from E.coli strain 536/UPEC. Immunity protein CdiI is species-specific
  [[cite:PUB00057480]].
