description: family of short proteins of bacterial proteins of phage origin, exemplified by protein SPBc2p013
  from Bacillus phage SPBc2, found in various Bacillus and Pseudomonas species. Structure show unexpected
  structural similarity to greek key beta barrels from the E-set domain, especially to domains involved
  in carbohydrate and protein- protein binding. However functional consequences of this similarity are
  not confirmed.
