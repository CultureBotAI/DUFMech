description: This entry represents a small family of single-pass membrane proteins described as small
  integral membrane proteins, including SMIM5/18/22 which have been described as variants of the Cancer-Associated
  Small Integral Membrane Open reading frame 1 (CASIMO1), a small open reading frame (sORF)-encode protein.
  CASIMO1 controls cell proliferation and interacts with squalene epoxidase (SQLE) modulating lipid droplet
  formation. CASIMO1 RNA is overexpressed predominantly in hormone receptor-positive breast tumors. Loss
  of CASIMO1 disturbs the organisation of the actin cytoskeleton, leads to inhibitions of cell motility,
  and stalls the cell cycle in the G0/G1 phase [[cite:PUB00102005]].
