description: This entry represents a domain found in GH172 family of enzymes including DFA I synthase/hydrolase
  from Bifidobacterium dentium, Exo-alpha-D-arabinofuranosidase from Microbacterium arabinogalactanolyticum
  and related proteins [[cite:PUB00161976],[cite:PUB00161977],[cite:PUB00161978]]. These proteins contain
  a pair of homologous structurally similar domains which adopt jelly-roll beta-sandwich. They assemble
  into trimeric structure that can form other higher order assemblies.
