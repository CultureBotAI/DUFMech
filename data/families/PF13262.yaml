description: This entry, previously know as DUF4054, represents Pseudomonas bacteriophage E217 head-to-tail
  connector protein gp27 and related proteins, including bacteriophage T1 adaptor protein gp45 [[cite:PUB00153918],[cite:PUB00163740]].
  Twelve copies of the head-to-tail adaptor gp27 assemble on the portal dodecamer [[cite:PUB00153918]].
  Gp27 assembles to the portal by inserting its extended C-terminal tail at the interface generated by
  two portal subunits, suggesting the head-to-tail connector oligomerizes upon binding instead of existing
  as a pre-formed ring [[cite:PUB00153918]].
