description: This entry represents a set of three HEAT repeats found towards the N-terminal region of
  Gcn1 protein, which acts as a translation activator that mediates translational control by regulating
  Gcn2 kinase activity [[cite:PUB00042775]]. It is a ribosome collision sensor that activates a translation
  quality control pathway when a ribosome has stalled during translation [[cite:PUB00159899]].
