description: Circadian-associated transcriptional repressor (Ciart or Chrono) is a negative regulatory
  component of the circadian clock. It functions as a transcriptional repressor, modulating BMAL1-CLOCK
  activity. It also regulates metabolic pathways such as the glucocorticoid response triggered by behavioral
  stress [[cite:PUB00075744],[cite:PUB00075743],[cite:PUB00075745]].
