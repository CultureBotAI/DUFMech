description: This family includes Kiwa protein KwaB from E.coli, a component of antiviral defense system
  Kiwa composed of KwaA and KwaB. The expression of Kiwa in E.coli (strain MG1655) confers resistance
  to phages lambda and SECphi18 [[cite:PUB00097806]]. This family also includes a phylogenetically broad
  range of bacteria associated with the human gut microbiome. A member of this family from Lactobacillus
  casei CRL 705 is part of the gene cluster involved in synthesis of bacteriocin toxin [[cite:PUB00016503]].
