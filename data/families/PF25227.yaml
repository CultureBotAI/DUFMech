description: This entry represents a domain of unknown function. In some proteins the is a C-terminal
  HTH domain that presumably binds to DNA. This domain may bind to an as unyet identified ligand to enable
  regulation of bacterial genes. This domain contains a large beta sheet composed of 11 beta strands with
  helices packed on the convex face. There is some evidence from structure prediction that this domain
  may dimerise and form a large structure that has a large hole through it that might accommodate DNA.
