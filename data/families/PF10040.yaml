description: Cas6 is a member of the RAMP (repeat-associated mysterious protein) superfamily [[cite:PUB00043288]].
  It is among the most widely distributed Cas proteins and is found in both bacteria and archaea [[cite:PUB00020781]].
  Cas6 functions in the generation of CRISPR-derived guide RNAs for invader defense in prokaryotes [[cite:PUB00054084]].
