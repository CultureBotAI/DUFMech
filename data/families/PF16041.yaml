description: This entry includes E3 ubiquitin-protein ligase APD1 to 4 from Arabidopsis. They are involved
  in pollen mitosis II (PMII) regulation during male gametogenesis [[cite:PUB00096500]]. This entry represents
  a functionally uncharacterised domain found in the middle of APD1-4 and in uncharacterised sequences
  mainly from arthropods. There are two completely conserved C residues that may be functionally important.
