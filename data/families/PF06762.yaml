description: This entry represents a domain found in the transmembrane proteins lipase maturation factor,
  LMF1 and LMF2. Lipoprotein lipase and hepatic lipase require LMF1 to fold into their active states [[cite:PUB00057509]].
  It acts as a chaperone required for maturation and transport of active lipoprotein lipase (LPL), through
  the secretory pathway [[cite:PUB00057511],[cite:PUB00098585]]. This domain is predicted as a transmembrane.
  It contains two structural repeats each of which is similar to members of the DoxD-like superfamily.
