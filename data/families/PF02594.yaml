description: This entry represents the homologues of UPF0235 protein PF1765 from from Pyrococcus furiosus.
  This proteins folds into a five-stranded curved mixed beta-sheet packed on one side with two alpha-helices
  [[cite:PUB00163221]]. PF1765 binds variably to dsDNA, ssDNA, and RNA, with a modest preference for single-stranded
  substrates [[cite:PUB00029013]].
