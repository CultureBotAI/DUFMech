description: This family represents Peptidoglycan L,D-endopeptidase MepK from Escherichia coli and similar
  bacterial proteins. MepK cleaves meso-diaminopimelic acid cross-links in peptidoglycan. It acts in conjunction
  with other elongation-specific D, D-endopeptidases to create space for the efficient incorporation of
  nascent peptidoglycan strands into the sacculus, thereby enabling cell wall expansion [[cite:PUB00160786]].
