description: This zinc ribbon domain is found in Endoplasmic reticulum junction formation protein (LNP1)
  and other related eukaryotic proteins. LNP1 plays a role in endoplasmic reticulum (ER) network formation
  [[cite:PUB00155939]]. It binds to the reticulons and Yop1p and resides at ER tubule junctions in both
  yeast and mammalian cells [[cite:PUB00155939]]. Lnp1 dimerises in vitro via this zinc finger domain
  and this is required for proper ER structure but not for the nuclear pore complex (NPC) integrity [[cite:PUB00155940]].
  The latter role is determined by the interactions with other ER components, including Rtn1, Yop1, Pom33,
  and Per33 [[cite:PUB00155940]].
