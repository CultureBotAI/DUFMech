description: This domain, previously known as DUF8189, is found in the L-fucose-binding lectins PHL and
  PLLs(1-5) from various Photorhabdus species and their homologues. This domain forms a seven-bladed beta-propeller
  [[cite:PUB00100843],[cite:PUB00109482],[cite:PUB00161611]]. Each blade makes a W-motif composed of four
  antiparallel beta-strands (beta1-beta4) connected by beta-turns and loops. The C and N terminus are
  located on the same side of the torus and create a cap of the inner cavity of the torus. With exception
  of PLL3, which is a monomer, all other domains assemble into oligomeric structures, either homo-dimeric
  or homo-tetrameric, connected with an inter-subunit disulfide bridge [[cite:PUB00100843],[cite:PUB00109482],[cite:PUB00161611]].
  Besides L-fucose or fucosylated saccharides, some of these domains bind to unusual O-methylated disaccharide
  3,6-O-Me2-d-Glc-beta1-4(2,3-O-Me2)-l-Rha-alpha (MGMR) [[cite:PUB00161611]].
