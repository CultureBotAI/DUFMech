description: This protein forms part of a contractile injection system [[cite:PUB00097484]]. Photorhabdus
  virulence cassette (PVC) represents one group of extracellular CISs that are present in both bacteria
  and archaea [[cite:PUB00097484]]. This entry include Pvc16. This family of proteins is found in bacteria
  and archaea. Proteins in this family are typically between 190 and 320 amino acids in length. This domain
  alone in Pvc16 is able to produce PVC particles with normal length but without the outer sheath, indicating
  the main function of this N-terminal domain in terminating the tube growth [[cite:PUB00097484]].
