description: This entry represents the C-terminal helices found in members of the ABC type 3 transporter
  family of permeases, including Cell division protein FtsX from Gram-negative and Gram-positive bacteria
  [[cite:PUB00096431]], Permease protein MacB [[cite:PUB00072503]], Lipoprotein-releasing system transmembrane
  protein LolC ([swissprot:P57382]) which has been shown to transport lipids targeted to the outer membrane
  across the inner membrane [[cite:PUB00071889]]. This region contains three transmembrane helices.
