description: This is the second beta-propeller domain of ER membrane protein complex subunit 1. ER membrane
  protein complex subunit 1 is a component of the ER membrane protein complex (EMC, composed of EMC1,
  EMC2, EMC3, EMC4, EMC5 and EMC6). In Saccharomyces cerevisiae, the EMC seems to be required for efficient
  folding of proteins in the endoplasmic reticulum (ER) [[cite:PUB00061987]]. EMC1 contains two eight-bladed
  beta-propellers and stabilises the entire EMC complex, contacting six of the remaining eight subunits
  [[cite:PUB00096682]]. The beta-propellers are in the lumen and may serve as a platform for recruitment
  of co-factors at the site of nascent protein insertion [[cite:PUB00096682]].
