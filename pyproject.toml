[project]
name = "dufmech"
version = "0.1.0"
description = "Domain of Unknown Function mechanism knowledge base"
authors = [
    {name = "DUFMech Contributors"}
]
readme = "README.md"
license = {text = "CC0-1.0"}
requires-python = ">=3.10"
keywords = [
    "DUF",
    "Pfam",
    "InterPro",
    "protein families",
    "unknown function",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/CultureBotAI/DUFMech"
Repository = "https://github.com/CultureBotAI/DUFMech"

[project.scripts]
duf-puf-freeze = "dufmech.snapshot_cli:main"
duf-puf-freeze-alphafold = "dufmech.alphafold_snapshot_cli:main"
duf-puf-freeze-cath = "dufmech.cath_snapshot_cli:main"
duf-puf-freeze-cdsearch = "dufmech.cdsearch_snapshot_cli:main"
duf-puf-freeze-members = "dufmech.member_snapshot_cli:main"
duf-puf-freeze-mgnify = "dufmech.mgnify_snapshot_cli:main"
duf-puf-freeze-pdbe-kb = "dufmech.pdbe_kb_snapshot_cli:main"
duf-puf-freeze-quickgo = "dufmech.quickgo_snapshot_cli:main"
duf-puf-freeze-rcsb = "dufmech.rcsb_snapshot_cli:main"
duf-puf-freeze-rhea = "dufmech.rhea_snapshot_cli:main"
duf-puf-freeze-string = "dufmech.stringdb_snapshot_cli:main"
duf-puf-freeze-threedbeacons = "dufmech.threedbeacons_snapshot_cli:main"
duf-puf-freeze-uniparc = "dufmech.uniparc_snapshot_cli:main"
duf-puf-members = "dufmech.member_cli:main"
duf-puf-score = "dufmech.scoring_cli:main"
duf-puf-worklist = "dufmech.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dufmech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
