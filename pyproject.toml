[project]
name = "dufmech"
version = "0.1.0"
description = "Domain of Unknown Function mechanism knowledge base"
authors = [
    {name = "DUFMech Contributors"}
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
keywords = [
    "DUF",
    "Pfam",
    "InterPro",
    "protein families",
    "unknown function",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "linkml>=1.10,<2",
    # Older ShEx parsers import typing.io, removed in Python 3.13.
    "pyshex>=0.9.0",
    "pyshexc>=0.10.3.post1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "sssom-schema>=1.0",
]

[project.urls]
Homepage = "https://github.com/CultureBotAI/DUFMech"
Repository = "https://github.com/CultureBotAI/DUFMech"

[project.scripts]
duf-puf-freeze = "dufmech.snapshot_cli:main"
duf-puf-freeze-alphafold = "dufmech.alphafold_snapshot_cli:main"
duf-puf-freeze-cross-mech = "dufmech.cross_mech_snapshot_cli:main"
duf-puf-freeze-pfam-previous-names = "dufmech.pfam_history_snapshot:main"
duf-puf-freeze-example-candidates = "dufmech.example_candidates_snapshot:main"
duf-puf-migrate-exduf = "dufmech.exduf:main"
duf-puf-freeze-cath = "dufmech.cath_snapshot_cli:main"
duf-puf-freeze-cdsearch = "dufmech.cdsearch_snapshot_cli:main"
duf-puf-freeze-efi-gnt = "dufmech.efi_gnt_snapshot_cli:main"
duf-puf-freeze-eggnog = "dufmech.eggnog_snapshot_cli:main"
duf-puf-freeze-jgi-img = "dufmech.jgi_img_snapshot_cli:main"
duf-puf-freeze-members = "dufmech.member_snapshot_cli:main"
duf-puf-freeze-mgnify = "dufmech.mgnify_snapshot_cli:main"
duf-puf-freeze-ncbifam = "dufmech.ncbifam_snapshot_cli:main"
duf-puf-freeze-pdbe-kb = "dufmech.pdbe_kb_snapshot_cli:main"
duf-puf-freeze-quickgo = "dufmech.quickgo_snapshot_cli:main"
duf-puf-freeze-rcsb = "dufmech.rcsb_snapshot_cli:main"
duf-puf-freeze-rhea = "dufmech.rhea_snapshot_cli:main"
duf-puf-freeze-string = "dufmech.stringdb_snapshot_cli:main"
duf-puf-freeze-threedbeacons = "dufmech.threedbeacons_snapshot_cli:main"
duf-puf-freeze-uniparc = "dufmech.uniparc_snapshot_cli:main"
duf-puf-members = "dufmech.member_cli:main"
duf-puf-score = "dufmech.scoring_cli:main"
duf-puf-worklist = "dufmech.cli:main"
duf-puf-reclassify = "dufmech.reclassify:main"
dufmech-records = "dufmech.records:main"
dufmech-review = "dufmech.reviews:main"
dufmech-history = "dufmech.history:main"
dufmech-knowledge-gaps = "dufmech.knowledge_gaps:main"
dufmech-exports = "dufmech.exports:main"
dufmech-id-labels = "dufmech.id_labels:main"
dufmech-research = "dufmech.research:main"

[build-system]
# Isolated build dependencies are not governed by the runtime uv lock.
requires = [
    "hatchling==1.32.4",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dufmech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "src/dufmech/datamodel/dufmech.py",
    # CLAW owns these byte-identical payloads; behavioral and checksum checks still run.
    "scripts/record_review.py",
    "tests/test_record_review_contract.py",
    "scripts/check_vendored_sync.py",
    "scripts/validate_id_label_correspondence.py",
    "scripts/chem_formula.py",
    "scripts/deep_research_contract.py",
    "scripts/auto_merge_ready_prs.py",
    "scripts/verify_merge_integrity.py",
    "tests/test_skill_frontmatter.py",
    "tests/test_curation_timestamp_schema.py",
    "tests/test_id_label_empty_adapter.py",
    "tests/test_id_label_unknown_prefix.py",
    "tests/test_id_label_plausibility.py",
]
