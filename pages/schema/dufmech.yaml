id: https://w3id.org/dufmech/schema
name: dufmech
title: DUFMech Family Records
description: Frozen family identities with separately curated, evidence-backed assertions.
license: BSD-3-Clause
prefixes:
  linkml: https://w3id.org/linkml/
  dufmech: https://w3id.org/dufmech/
  Pfam: https://www.ebi.ac.uk/interpro/entry/pfam/
  InterPro: https://www.ebi.ac.uk/interpro/entry/InterPro/
default_prefix: dufmech
default_range: string
imports:
  - linkml:types
  - mech_shared
classes:
  FamilyRecord:
    tree_root: true
    description: A source-derived family projection; SEEDED is not scientific review.
    attributes:
      id:
        identifier: true
        required: true
        pattern: '^Pfam:PF[0-9]{5}$'
      pfam_id:
        required: true
        pattern: '^PF[0-9]{5}$'
      name:
        required: true
      short_name:
        required: true
      interpro_id:
        pattern: '^InterPro:IPR[0-9]{6}$'
      seed_status:
        required: true
        range: SeedStatus
      characterization_status:
        required: true
        range: CharacterizationStatus
      curation_status:
        required: true
        range: CurationStatus
      review_id:
        description: Retained completed record report; required with matching content and history for REVIEWED.
        pattern: '^(reports/yaml_record_review/[A-Za-z0-9_.-]+[.]md|reviews/structured/[A-Za-z0-9][A-Za-z0-9._-]{0,159}/review[.]yaml)$'
      curation_history:
        description: Stable directory containing canonical append-only history for this family.
        pattern: '^history/records/PF[0-9]{5}$'
      curation_events:
        description: Read-only index derived from validated canonical history sidecars, never an authoring surface.
        range: CurationEvent
        multivalued: true
        inlined_as_list: true
      description:
        description: Imported source description, not a verified functional assertion.
      source_url:
        required: true
        range: uri
      counters:
        range: FamilyCounters
        inlined: true
      provenance:
        required: true
        range: SnapshotProvenance
        inlined: true
      score_provenance:
        range: SnapshotProvenance
        inlined: true
      assertions:
        range: FunctionalAssertion
        multivalued: true
        inlined_as_list: true
      causal_graphs:
        range: CausalGraph
        multivalued: true
        inlined_as_list: true
      discussions:
        range: Discussion
        multivalued: true
        inlined_as_list: true
      datasets:
        range: Dataset
        multivalued: true
        inlined_as_list: true
      cross_corpus_links:
        range: CrossCorpusLink
        multivalued: true
        inlined_as_list: true
  FamilyCuration:
    description: Human-owned overlay. Imported identity and counters cannot be overridden.
    attributes:
      pfam_id:
        required: true
        pattern: '^PF[0-9]{5}$'
      curation_status:
        required: true
        range: CurationStatus
      review_id:
        pattern: '^(reports/yaml_record_review/[A-Za-z0-9_.-]+[.]md|reviews/structured/[A-Za-z0-9][A-Za-z0-9._-]{0,159}/review[.]yaml)$'
      curation_history:
        pattern: '^history/records/PF[0-9]{5}$'
      assertions:
        range: FunctionalAssertion
        multivalued: true
        inlined_as_list: true
      causal_graphs:
        range: CausalGraph
        multivalued: true
        inlined_as_list: true
      discussions:
        range: Discussion
        multivalued: true
        inlined_as_list: true
      datasets:
        range: Dataset
        multivalued: true
        inlined_as_list: true
      cross_corpus_links:
        range: CrossCorpusLink
        multivalued: true
        inlined_as_list: true
  CurationEvent:
    description: Generated record-level view of a canonical sidecar event; the referenced history record is authoritative.
    attributes:
      timestamp:
        description: Preserve the canonical UTC timestamp spelling and precision through model serialization.
        range: string
        all_of:
          - range: datetime
        required: true
        pattern: '^20[0-9]{2}-'
      curator:
        required: true
      action:
        required: true
      outcome:
        required: true
      summary:
        required: true
      history_record:
        required: true
        pattern: '^history/records/PF[0-9]{5}/[A-Za-z0-9_.-]+[.]ya?ml$'
      event_index:
        range: integer
        minimum_value: 0
        required: true
      llm_assisted:
        range: boolean
        required: true
  FamilyCounters:
    attributes:
      proteins:
        range: integer
        minimum_value: 0
      matches:
        range: integer
        minimum_value: 0
      proteomes:
        range: integer
        minimum_value: 0
      taxa:
        range: integer
        minimum_value: 0
      structures:
        range: integer
        minimum_value: 0
      alphafold_models:
        range: integer
        minimum_value: 0
      domain_architectures:
        range: integer
        minimum_value: 0
  SnapshotProvenance:
    attributes:
      snapshot_id:
        required: true
      path:
        required: true
        pattern: '^data/worklists/[A-Za-z0-9_-]+[.]json$'
      sha256:
        required: true
        pattern: '^[a-f0-9]{64}$'
      generated_at:
        required: true
        pattern: '^\d{4}-\d{2}-\d{2}T.*(Z|[+-]\d{2}:\d{2})$'
      source_url:
        description: Upstream URL when the snapshot is acquired rather than locally derived.
        range: uri
  FunctionalAssertion:
    description: Scoped experimental or computational claim, not implied by a DUF name.
    attributes:
      assertion_id:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      statement:
        required: true
      evidence_kind:
        required: true
        range: EvidenceKind
      scope:
        required: true
        description: Exact family/subfamily/protein scope and limits of generalization.
      evidence:
        required: true
        range: ClaimEvidence
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
  CausalGraph:
    description: A scoped directed mechanism or phenotype graph, not family-wide functional proof.
    attributes:
      graph_id:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      title:
        required: true
      scope:
        description: Exact tested protein or construct and limits of generalization.
        required: true
      context:
        description: Organism, strain, perturbation, conditions and necessary cofactors or partners.
        required: true
      family_mapping:
        description: Evidence mapping the tested object to this Pfam domain, with coordinate limits.
        required: true
      scope_status:
        range: CausalScope
        required: true
      taxon:
        pattern: '^NCBITaxon:[0-9]+$'
      limitations:
        description: Unresolved steps, alternative explanations and unsupported transfers.
        required: true
      feedback_explanation:
        description: Required when directed cycles or self-edges represent actual feedback.
      nodes:
        range: CausalNode
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      edges:
        range: CausalEdge
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
  CausalNode:
    attributes:
      node_id:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      label:
        required: true
      node_type:
        range: CausalNodeType
        required: true
      grounding:
        description: Verified entity CURIEs; absence means ungrounded, not a fabricated identifier.
        multivalued: true
        pattern: '^[A-Za-z][A-Za-z0-9_.-]*:\S+$'
  CausalEdge:
    description: Evidence for a directed relation, rather than citations only establishing the endpoints.
    attributes:
      edge_id:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      subject:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      predicate:
        required: true
        range: CausalPredicate
      object:
        required: true
        pattern: '^[A-Za-z0-9_-]+$'
      mechanism:
        description: What the evidence supports about this directed step and its conditions.
        required: true
      directness:
        required: true
        range: CausalDirectness
      support:
        required: true
        range: CausalSupport
      evidence_kind:
        required: true
        range: EvidenceKind
      evidence:
        required: true
        range: ClaimEvidence
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
  ClaimEvidence:
    description: A primary-source quotation retained locally for an independently checkable claim.
    attributes:
      reference:
        required: true
        pattern: '^(PMID:[0-9]+|doi:10[.][0-9]{4,9}/\S+|https://\S+)$'
      source_url:
        required: true
        range: uri
      snippet:
        required: true
      explanation:
        required: true
      cache_path:
        required: true
        pattern: '^evidence/[A-Za-z0-9_./-]+[.]txt$'
      cache_sha256:
        required: true
        pattern: '^[a-f0-9]{64}$'
enums:
  CausalScope:
    permissible_values:
      MECHANISTIC:
        description: Includes at least one directly observed experimental mechanism step.
      PHENOTYPIC:
        description: Includes an experimentally observed effect without claiming a resolved molecular mechanism.
      HYPOTHETICAL:
        description: Proposed directed explanations, not observed causal effects.
  CausalNodeType:
    permissible_values:
      STATE:
      ACTIVITY:
      PROCESS:
      PERTURBATION:
      PHENOTYPE:
  CausalPredicate:
    permissible_values:
      increases:
      decreases:
      required_for:
      enables:
      produces:
      degrades:
      converts_to:
  CausalDirectness:
    permissible_values:
      DIRECT:
      INDIRECT:
      UNRESOLVED:
  CausalSupport:
    permissible_values:
      OBSERVED:
      INFERRED:
      HYPOTHESIZED:
      CONTESTED:
  SeedStatus:
    permissible_values:
      UNKNOWN_CANDIDATE:
      KNOWN_HISTORICAL_DUF:
      EX_DUF:
        description: >-
          Pfam renamed the family away from a DUF/UPF name; its previous identifiers
          record the former name. Naming history, not experimental evidence.
      FALSE_POSITIVE_TEXT_HIT:
  CharacterizationStatus:
    permissible_values:
      UNSCORED:
      UNKNOWN_CANDIDATE:
      KNOWN_HISTORICAL_DUF:
      PARTIALLY_CHARACTERIZED:
  CurationStatus:
    permissible_values:
      SEEDED:
      IN_PROGRESS:
      REVIEWED:
  EvidenceKind:
    permissible_values:
      EXPERIMENTAL:
      COMPUTATIONAL:
      CONTEXTUAL:
