description: This family consists of several mammalian proteins of around 240 residues in length. Family
  members include regulator of chromosome segregation 1 (RCS1), also known as FAM64A, CATS or PIMREG (PICALM-interacting
  mitotic regulator). It is a substrate of APC/C. It may control the metaphase to anaphase transition
  [[cite:PUB00084339]]. It is also a substrate of the Kinase Interacting Stathmin (KIS). RCS1 is highly
  expressed in cancer cell lines in a cell cycle dependent manner and is induced by mitogens [[cite:PUB00084340]].
