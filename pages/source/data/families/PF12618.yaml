description: PHD finger protein 20 (PHF20) is a Methyllysine-binding protein, component of the MOF histone
  acetyltransferase protein complex. It consists of tandem Tudor domains at the N-terminal, an AT hook,
  a C2H2-type zinc finger, and a plant homeodomain (PHD) finger [[cite:PUB00059425],[cite:PUB00094038],[cite:PUB00061037]].
  This entry represents the AT-hook domain, a putative DNA-binding domain [[cite:PUB00059425],[cite:PUB00094038],[cite:PUB00061037]].
