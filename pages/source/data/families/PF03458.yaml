description: This domain contains three transmembrane helices. Proteins containing this domain are important
  for glycine utilisation, being identified as glycine transporters. Some members of the family are also
  important for alanine utilisation. In these proteins this domain is found in pairs [[cite:PUB00093610]].
  An archaeal member of this family which contains this domain is a TRIC-type potassium channel [[cite:PUB00098630]].
