description: This family of proteins is found in eukaryotes and includes Piercer of microtubule wall 1/2
  proteins (PIRC1/2). In mice PIRC1 expression is induced by p53 may play a role in DNA damage response
  and has been shown to function at the initial step of left-right asymmetry specification of the visceral
  organs [[cite:PUB00111186]]. PIRC1/2 are microtubule inner proteins involved in the attachment of outer
  dynein arms (ODAs) to dynein-decorated doublet microtubules (DMTs) in cilia axoneme [[cite:PUB00100771]].
