- graph_id: glnd-nt-construct-and-residue-2010
  title: GlnD N-terminal constructs and substitutions alter GlnB uridylylation
  scope: Zhang2010 E. coli His-tagged full-length GlnD, 1-371 fragment, 329-890 deltaNT and individual
    G93L, G93V or G94D variants; not isolated-Pfam-domain assays.
  context: Purified proteins; native-PAGE GlnB modification endpoint at 30 C after 60 min, 60 uM GlnB,
    UTP initiated by 1 ul of 50 mM stock into a 50 ul reaction, 1 mM ATP, 10 mM alpha-KG, 25 mM MgCl2
    with or without 1 mM MnCl2. Figure 5 enzyme-free control and plotted enzyme concentrations 0.025-2
    uM.
  family_mapping: E. coli K-12 GlnD P27249 sequence version 2, b0167/JW0162, 890 aa; PF01909 at 85-144
    includes G93/G94/D107. The paper draws NT at 74-169. The 1-371 fragment contains additional sequence
    and domain context; deltaNT retains 329-890. Reference numbering agrees, without independent historical
    clone sequencing.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: Readout is average modified subunits per GlnB trimer, not initial velocity or an atomic
    chemical step. Net transfer/removal competition can affect the endpoint. G94L retains substantial
    activity, so loss is not universal for glycine substitutions. No precise bar-derived effect sizes,
    equal-folding controls or isolated 85-144 sufficiency are claimed. NTase membership does not transfer
    this substrate or mechanism across PF01909.
