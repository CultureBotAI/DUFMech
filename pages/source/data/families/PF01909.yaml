- graph_id: glnd-glutamine-mg-response-2010
  title: Glutamine lowers GlnB uridylylation under magnesium-only assay conditions
  scope: Matched no-glutamine versus 10 mM glutamine conditions for 2 uM full-length, HD-AA or HD-QN E.
    coli GlnD.
  context: Figure 8A; Mg-only UTase protocol with GlnB, UTP, ATP and alpha-KG, 30 C/60 min endpoint. Every
    edge compares glutamine addition within the same enzyme construct and cofactor condition.
  family_mapping: Full-length P27249 sequence version 2 includes PF01909 at 85-144 and HD region 468-601.
    HD-AA/QN alter residues 514/515 outside PF01909; glutamine response is a whole-enzyme property, not
    a demonstrated ligand-binding function of PF01909.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: HD variants lack detectable UR in the separate Figure 4 assays, helping distinguish inhibited
    transfer from enhanced removal. Exact binding site and allosteric relay were not measured. The 1-371
    fragment lacks the same inhibition, but its altered structure remains an alternative. Figure 8B Mg/Mn
    results differ and must not be merged into this graph; its WT endpoint can fall through competing
    removal.
