- graph_id: glnd-hd-removal-controls-2010
  title: GlnD HD substitutions reduce GlnB demodification outside the PF01909 domain
  scope: Full-length E. coli GlnD H514A/D515A and H514Q/D515N variants compared with full-length reference
    enzyme.
  context: Figure 4 native-PAGE endpoint after 60 min at 30 C, 40 uM fully modified GlnB, 0.1/0.5/2 uM
    GlnD, no UTP. Mg-UR uses 50 mM MgCl2, 0.5 mM ATP, 0.5 mM alpha-KG and 2.5 mM glutamine. Mn-UR uses
    1 mM MnCl2 and 10 mM glutamine, omitting MgCl2, ATP and alpha-KG.
  family_mapping: P27249 sequence version 2 carries PF01909 at 85-144, but H514/D515 lie in PF01966 at
    468-601. These whole-protein controls distinguish activities and do not assign demodification to PF01909.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: Figure 4 plots remaining UMP on an inverted axis; the encoded outcome is extent of removal,
    not the plotted ordinate or an initial rate. Protocols differ in several components, so comparisons
    are within each protocol. Figure 5 retained transfer activity argues against completely inactive preparations
    but does not exclude local structural changes. No metal-binding geometry is established.
