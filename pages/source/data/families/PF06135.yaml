description: IreB is a cytosolic 10.5-kDa protein that is highly conserved among low-GC Gram-positive
  bacteria . Studies of E. faecalis mutants lacking ireB revealed that IreB acts downstream of IreK as
  a negative regulator of cephalosporin resistance in E. faecalis. IreB can be modified by phosphorylation
  in vivo, and mutations that prevent modification at the known sites of phosphorylation (T4 and T7) influence
  the ability of IreB to modulate cephalosporin resistance. Furthermore, mutations that impair dimerization
  abolish the regulation of cephalosporin resistance [[cite:PUB00091063]].
