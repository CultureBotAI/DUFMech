description: This entry represents a the central transmembrane domain from family of uncharacterised proteins
  from halophilic archaea. The family is predominantly found in the class Halobacteria, which includes
  members from the families Natrialbaceae and Haloferacaceae. Proteins in this family are typically between
  150 and 350 amino acids in length. They are predicted to be membrane-associated, as suggested by the
  presence of two transmembrane helices represented by this domain.
