description: 'This family of proteins is functionally uncharacterised. This family of proteins is found
  in bacteria and archaea. There are highly conserved sequence motifs: FSxWFF and ExxxFP. There are eleven
  conserved tryptophan residues, which may suggest to play an important role. Proteins members of this
  family are likely composed of transmembrane helices and probably carry out transporter activity.'
