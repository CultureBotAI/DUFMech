description: The proteins in this family are OHCU decarboxylase - enzymes of the purine catabolism that
  catalyse the conversion of OHCU into S(+)-allantoin [[cite:PUB00042841]]. This is the third step of
  the conversion of uric acid (a purine derivative) to allantoin. Step one is catalysed by urate oxidase
  ([pfam:PF01014]) and step two is catalysed by HIUases ([pfam:PF00576]).
