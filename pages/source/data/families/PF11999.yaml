description: This family includes members found in bacteria, fungi and archaea, many of which are ice-binding
  proteins (IBPs) [[cite:PUB00094907]]. In Antarctic bacterium Flavobacterium frigoris PS1, FfIBP is an
  ice-binding protein that inhibits ice growth through direct interaction with ice crystals to permit
  the survival of polar organisms in extremely cold environments [[cite:PUB00089804]]. In arctic yeast
  Leucosporidium sp, LeIBP, an ice-binding protein, can lower the freezing point below the melting point
  once it binds to ice [[cite:PUB00058444]]. Family members also have a single completely conserved glycine
  residue that may be functionally important.
