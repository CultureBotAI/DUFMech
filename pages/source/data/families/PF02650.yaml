description: This domain is found at the C-terminus of the sporulation regulator WhiA. It is predicted
  to form a DNA-binding helix-turn-helix structure [[cite:PUB00044539]]. The WhiA protein also contains
  two N-terminal domains that are distant homologues of LAGLIDADG homing endonucleases [[cite:PUB00044539]].
