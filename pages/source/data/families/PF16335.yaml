description: This entry represents the six helical-hairpin domain found in homologues of Glutaminase A
  from Aspergillus oryzae. Glutaminase catalyzes the hydrolysis of glutamine to glutamic acid and plays
  a key role in nitrogen metabolism. It catalyzes the hydrolysis not only of L-glutamine but also of D-glutamine
  [[cite:PUB00035385]]. This domain share similarity with six-hairpin glycosidases.
