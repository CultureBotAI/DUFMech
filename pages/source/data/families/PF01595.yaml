causal_graphs:
- graph_id: ttcorb-liposome-magnesium-uptake
  title: Reconstituted TtCorB supports magnesium accumulation in proteoliposomes
  scope: Full-length Tepidiphilus thermophilus CorB 1-445 with C-terminal His6, Chen 2021 Figure 6a and
    Supplementary Figure 8a/b; not Thermus thermophilus or isolated CNNM transmembrane domain.
  context: POPE/POPG 3:1 vesicles contain 50 uM mag-fura-2 in 20 mM HEPES-KOH pH 7.5, 100 mM KCl, 50 mM
    NaCl and initially 0.5 mM EDTA. UDM-purified protein is reconstituted by Sephadex G-50 detergent removal,
    one freeze/thaw and 0.8-um extrusion. Dilute 10 ul vesicles into 190 ul EDTA-free buffer at 25 C.
    Following a 1-min baseline, add 5 mM MgCl2 for the WT/empty and protein-loading comparisons. The separate
    MgCl2 series uses 0.75, 1.5, 3 and 5 mM. Monitor 330/369-nm excitation and 509-nm emission for 10
    min; Triton/EDTA calibration yields intravesicular magnesium. Captions report three independent measurements,
    mean +/- SEM.
  family_mapping: A0A0K6IWT9 sequence version 1 is 445 aa and maps to PF01595 at 19-189. UniProt and InterPro
    sequences exactly match. The paper identifies this accession and intact pET29a construct. CBS/CorC
    regions are also present; the isolated Pfam domain was not tested.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:876478
  limitations: Directness concerns magnesium accumulation in purified-protein vesicles, not an observed
    atomic transport cycle. Orientation and active fraction are not measured, so influx into these vesicles
    is not native cellular import/export direction. Independent measurements are not stated to be independent
    purifications. Empty controls receive matched 0.05% UDM buffer. The concentration/loading series are
    separate interventions, not a serial causal chain or a fitted Michaelis constant. Ion counter-substrates
    and exchange stoichiometry remain unresolved.
