- graph_id: mtcorb-liposome-magnesium-uptake
  title: Reconstituted MtCorB gives modest magnesium accumulation above empty vesicles
  scope: Full-length Methanoculleus thermophilus CorB 1-426 with C-terminal His6, Chen 2021 Figure 6a;
    distinct from MtCorB delta-C crystallization constructs.
  context: POPE/POPG 3:1, protein/lipid 1:30 wt/wt, encapsulated 50 uM mag-fura-2, pH 7.5 with 100 mM
    KCl and 50 mM NaCl. After a 1-min baseline at 25 C, add 5 mM MgCl2 and follow calibrated intravesicular
    magnesium for 10 min. Empty liposomes receive matched 0.05% UDM buffer. Three independent measurements,
    mean +/- SEM; reconstitution Methods call MtCorB UDM-purified, whereas purification Methods specify
    DDM.
  family_mapping: A0A1G8XA46 sequence version 1, 426 aa, NCBITaxon 2200; current PF01595 13-187, verified
    by exact UniProt/InterPro sequence equality. The Pfam interval is not identical to structural TM residues
    1-154. Neither isolated CBS 199-322 nor the delta-C structure inherits this full-length transport
    assay.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:2200
  limitations: The smaller MtCorB signal relative to TtCorB is not zero function or evidence of an intrinsically
    slower transporter; lipid compatibility may differ. The purification/reconstitution detergent discrepancy
    remains unresolved. Protein orientation, counterion and stoichiometry are not established. No archaeal
    cellular direction or human CNNM transport claim is inferred.
