- graph_id: ttcorb-substitution-transport-effects
  title: TtCorB cavity substitutions increase or decrease liposomal magnesium accumulation
  scope: Separate single substitutions in intact His6-TtCorB, compared with WT under Chen 2021 Figure
    6d/e conditions.
  context: POPE/POPG 3:1, protein/lipid 1:30 wt/wt, 5 mM added MgCl2, pH 7.5, 25 C, 100 mM KCl and 50
    mM NaCl, mag-fura-2 excitation 330/369 nm and emission 509 nm. The 10-min time courses use empty-liposome
    and WT comparisons, three independent measurements, mean +/- SEM. Supplementary Figure 8c/d supplies
    size-exclusion and reconstituted-protein SDS-PAGE controls.
  family_mapping: Reference A0A0K6IWT9 S26, S30, N76, S117, E118, P121 and K122 were sequence-verified
    and all lie inside PF01595 19-189. Each mutation is in the full 445-aa protein, not an isolated-domain
    construct; domain position does not isolate its causal microstep.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:876478
  limitations: All plotted loss-of-response mutants retain accumulation above empty controls. E33A and
    N80A are described as near WT, not zero-effect proof. Several variants, especially S26A/S30A/N76A,
    have earlier or broadened SEC peaks. Strong incorporation bands do not establish equal folding, oligomerization,
    orientation or active fraction. Directness means the net purified-vesicle effect; an elementary metal-coordination
    or pi-helix-motion mechanism remains unresolved.
