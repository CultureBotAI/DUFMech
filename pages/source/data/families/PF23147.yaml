description: This domain is found towards the N terminus of yeast NAD-specific glutamate dehydrogenase
  (GDH2, also known as DHE2) and similar fungal proteins. GDH2 is involved in the degradation of glutamate
  to ammonia and alpha-ketoglutarate. This domain is predicted to adopt a globular structure composed
  of four alpha-helices.
