description: This domain of unknown function is found in Lysine-specific demethylase 3B (KDM3B, also known
  as JmjC domain-containing histone demethylation protein 2B or JHDM2B) and related proteins. KDM3B is
  a histone demethylase that specifically demethylates lysine at position 9 of histone H3 [[cite:PUB00153916]].
  This enzyme plays a central role in histone code. This domain is predicted to adopt an open beta-barrel
  with an SH3-like topology.
