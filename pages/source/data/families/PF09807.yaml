description: ELP6 is a subunit of the RNA polymerase II elongator complex. The Elongator complex promotes
  RNA-polymerase II transcript elongation through histone acetylation in the nucleus and tRNA modification
  in the cytoplasm. ELP5 and ELP6 play a major role in the migration, invasion and tumorigenicity of melanoma
  cells, as integral subunits of Elongator [[cite:PUB00075653]]
