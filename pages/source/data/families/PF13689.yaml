description: This family of proteins is found in bacteria and includes YfiR from E. coli. YfiR has been
  shown to regulate YfiN, a diguanylate cyclase and a bifunctional protein that produces c-di-GMP in response
  to reductive stress and then dynamically relocates to the division site to arrest cell division in response
  to envelope stress in Escherichia coli. YfiR may serve as a periplasmic redox sensor that regulates
  YfiN activity in response to reducing conditions [[cite:PUB00088310],[cite:PUB00088309]]. HmsC in Yersinia
  Pestis is the orthologue of YfiR from E. coli [[cite:PUB00091013]]. HmsC is a periplasmic protein that
  interacts directly with the periplasmic domain (PD) of HmsD and causes proteolytic degradation of HmsD,
  which in turn negatively regulates Y. pestis biofilm formation [[cite:PUB00091014]].
