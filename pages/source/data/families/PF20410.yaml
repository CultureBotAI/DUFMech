description: This conserved domain is found in Xanthomonas VirD4 interacting proteins (XVIPs) and other
  type IV secretion system (T4SS) specialised in translocating effector proteins (toxic effector proteins,
  X-Tfes) into competing gram-negative species, leading to target cell death. This domain interacts with
  the central all-alpha domain of VirD4. Its structure shows two well ordered N-terminal antiparallel
  alpha-helices that pack against a carboxyl-terminal three-stranded antiparallel beta sheet [[cite:PUB00151936],[cite:PUB00145392],[cite:PUB00151937]].
