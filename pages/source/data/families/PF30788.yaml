description: This entry represents a small domain of approximately 60 residues. The domain is typically
  found following AAA_16 domains ([pfam:PF13191]) in multidomain proteins that often also contain guanylate
  cyclase domains ([pfam:PF00211]). Proteins containing this domain include adenylate and guanylate cyclases.
  This family is found in bacteria (Actinomycetota, Myxococcota, Pseudomonadota) and eukaryotes. The function
  of this domain remains to be determined.
