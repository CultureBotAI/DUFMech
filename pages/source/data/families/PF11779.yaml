description: Serine palmitoyltransferase (SPT) catalyzes the first committed step in sphingolipid biosynthesis.
  In mammals, two small subunits of serine palmitoyltransferase, ssSPTa and ssSPTb, substantially enhance
  the activity of SPT, conferring full enzyme activity upon it [[cite:PUB00056204]]. The 2 ssSPT isoforms
  share a conserved hydrophobic central domain, which is predicted to reside in the membrane.
