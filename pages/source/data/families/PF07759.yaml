description: This is a family of proteins of unknown function expressed by various bacterial species.
  Some members of this family (e.g. [swissprot:Q8Z8Z7], [swissprot:Q8ZRF4]) are thought to be lipoproteins.
  Another member of this family ([swissprot:Q93SV8]) is thought to be involved in photosynthesis [[cite:PUB00015226]].
