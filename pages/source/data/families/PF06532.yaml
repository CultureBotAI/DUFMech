description: This family includes CC3252 (NrsF- Negative regulator of sigma F) from Caulobacter crescentus,
  which is proposed to be an anti-sigma factor. In particular, overexpression of NrsF prevents the induction
  of the sigF regulon after dichromate stress [[cite:PUB00086036]]. Family members also include the anti-sigma
  factor OsrA (blr3039) from Bradyrhizobium japonicum, which is involved in sensing reactive oxygen species.
  There is evidence that OsrA binds an ECF-type sigma factor (EcfF) in vivo. Furthermore, the conserved
  cysteine residues 129 and 179 of OsrA are shown to be required for normal function [[cite:PUB00109140]].
  Family members have 6 predicted transmembrane regions.
