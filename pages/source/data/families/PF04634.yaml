description: This protein family includes the immunity protein YezG from Bacillus subtilis and similar
  sequences predominantly found in Firmicutes. YezG is the antitoxin component of a LXG toxin-antitoxin
  (TA) module that promote kin selection, mediate competition in biofilms, and drive spatial segregation
  of different strains, probably helping to avoid warfare between strains in biofilms [[cite:PUB00101092]].
  It shows an alpha/beta structure with an antiparallel beta-sheet.
