description: Small domain family found in proteins of of unknown function. Some are secreted (e.g. [swissprot:O25998])
  and implicated in motility in bacteria. Also occurs in Leishmania spp. as an essential gene. Over-expression
  in L.amazonensis increases virulence ([swissprot:O43987]; [[cite:PUB00016654]]). A pair of cysteine
  residues show correlated conservation, suggesting that they form a disulphide bond.
