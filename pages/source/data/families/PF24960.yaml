description: This domain, previously known as DUF7766, is found in Outer surface lipoprotein BB0158 from
  Borrelia burgdorferi and related proteins mainly from Spirochaetales. It folds into a double beta-barrel
  structure capped with alpha-helices PDB:8q4k. This domain forms a swapped dimer in which the N-terminal
  beta-strand from one monomer is replaced the N-terminal beta-strand from the other monomer [[cite:PUB00160310]].
  BB0158 is part of a family of paralogous proteins found in B. burgdorferi, known as paralogous gene
  family 44 (PFam44) [[cite:PUB00019466]]. This protein potentially plays a role in the pathogenesis of
  Lyme disease.
