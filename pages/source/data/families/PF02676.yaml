description: The methyltransferase TYW3 (tRNA-yW- synthesising protein 3) has been identified in yeast
  to be involved in wybutosine (yW) biosynthesis [[cite:PUB00044611]]. yW is a complexly modified guanosine
  residue that contains a tricyclic base and is found at the 3' position adjacent the anticodon of phenylalanine
  tRNA. TYW3 is an N-4 methylase that methylates yW-86 to yield yW-72 in an Ado-Met-dependent manner [[cite:PUB00044611]].
