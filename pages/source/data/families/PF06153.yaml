description: CdAMP is a family of bacterial cyclic-di-AMP receptor proteins. Cyclic-di-AMP (c-di-AMP)
  is a bacterial secondary messenger involved in various processes, including sensing of DNA-integrity,
  cell wall metabolism and potassium transport. CdAMP_rec has a ferredoxin-like fold and is structurally
  related to Pii-signal transduction proteins [[cite:PUB00075460]].
