description: This bacterial family of proteins has no known function. This family includes the B. subtilis
  YqhV protein which is found just upstream of the SpoIIIA operon, suggesting it may play a role in sporulation
  or its regulation [[cite:PUB00034563]]. The protein is composed of three hydrophobic alpha helices that
  may form transmembrane helices.
