description: This domain is found in Rad26 from Myceliophthora thermophila ([swissprot:G2QDY6]) and similar
  fungal proteins. Rad26 is a functional subunit of the Rad3-Rad26 complex that is responsible for bringing
  the kinase to sites of DNA damage. The central region of Rad26 is formed by five helical repeats forming
  an alpha-solenoid arrangement [[cite:PUB00100970]].
