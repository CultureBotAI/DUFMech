description: This domain is characteristic of cilia- and flagella-associated protein 20 (CFA20). CFA20
  is a cilium- and flagellum-specific protein that plays a role in axonemal structure organisation and
  motility [[cite:PUB00072946],[cite:PUB00072975]]. In Chlamydomonas reinhardtii, it stabilises outer
  doublet microtubules (DMTs) of the axoneme and may work as a scaffold for intratubular proteins, such
  as tektin and PACRG, to produce the beak structures in DMT1 [[cite:PUB00072975],[cite:PUB00072976]].
  Other proteins contain a domain with homology to CFA20. WDR90/POC16 contains such a domain in its N
  terminus, followed by a large C-terminal domain with multiple WD40 repeats [[cite:PUB00072975]]. This
  domain is also present in the N terminus of uncharacterised protein C3orf67.
