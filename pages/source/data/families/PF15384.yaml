description: PAXX is a set of eukaryotic proteins that belong to the XRCC4 superfamily of DNA-double-strand
  break-repair proteins. PAXX interacts directly with DSB-repair protein Ku and is recruited to DNA-damage
  sites in cells thus functioning with XRCC4 and XLF to bring about DSB repair and cell survival in response
  to DSB-inducing agents [[cite:PUB00074304]].
