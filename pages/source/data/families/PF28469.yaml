description: This domain is found in a group of uncharacterised proteins mainly found in actinomycetes.
  This domain, which contains highly conserved W, D, G residues and a conserved motif FxHRHR, is predicted
  to form an antiparallel beta sheet and alpha helices. Bet_v_1 domains contain a hydrophobic ligand-binding
  pocket [[cite:PUB00053295]]. The specific function of this family is unknown.
