description: This is a family of prokaryotic proteins that form one of the subunits, ScpB, of the segregation
  and condensation complex, condensin, that plays a key role in the maintenance of the chromosome. In
  prokaryotes the complex consists of three proteins, SMC, ScpA (kleisin) and ScpB. ScpB dimerises and
  binds to ScpA. As originally predicted, ScpB is structurally a winged-helix at both its N- and C-terminal
  halves. IN Bacillus subtilis,one Smc dimer is bridged by a single ScpAB to generate asymmetric tripartite
  rings analogous to eukaryotic SMC complex ring-shaped assemblies [[cite:PUB00109191],[cite:PUB00109192]].
