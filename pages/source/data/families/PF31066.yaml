description: This entry represents a domain of approximately 70 residues found in BPTF (Bromodomain PHD
  finger transcription factor) proteins and related DDT domain-containing proteins in eukaryotes. This
  domain is located downstream of the WSD domain ([pfam:PF15613]). BPTF is a subunit of the NURF chromatin
  remodelling complex that catalyses ATP-dependent nucleosome sliding [[cite:PUB00101089]]. In plant RLT
  (RINGLET) proteins, this domain is also present downstream of the WSD domain. The function of this domain
  remains to be determined.
