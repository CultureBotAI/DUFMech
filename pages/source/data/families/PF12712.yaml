description: This family represent the N-terminal domain of the structure. In two related Bacteroides
  species the gene lies immediately upstream from a putative ATP binding component of an ATP transporter
  and a putative histidinol phosphatase. The structure of this domain is strikingly similar to the N-terminal
  structure of 1tui, also of unknown function. The domain carries four conserved tryptophan residues.
