description: This family includes the Escherischia coli protein HofP, one of eight genes shown to be required
  for the utilization of extracellular DNA as a nutrient source in starving conditions, allowing DNA to
  be the sole source for carbon and energy [[cite:PUB00068649]]. Proteins in this entry appear are found
  only in Enterobacteriaceae.
