description: WEMBL consists of several plant proteins required for the chloroplast avoidance response
  under high intensity blue light. This avoidance response consists in the relocation of chloroplasts
  on the anticlinal side of exposed cells. Acts in association with PMI2 to maintain the velocity of chloroplast
  photo-relocation movement via the regulation of cp-actin filaments [[cite:PUB00066738]]. Thus several
  member-sequences are described as "myosin heavy chain-like".
