description: This entry represents the bacteriophage T7 Gp1.2 protein, a small protein that inhibits the
  Escherichia coli dGTPase (Dgt). Dgt hydrolyzes dGTP to deoxyguanosine and triphosphate, which can limit
  T7 phage replication by restricting the available dGTP pool. Gp1.2 binds to Dgt and prevents dGTP hydrolysis,
  preserving the nucleotide pool necessary for phage DNA replication. The protein adopts a barrel-shaped
  fold with a three-stranded antiparallel beta sheet covered on one side by two parallel alpha helices.
  The N-terminus of Gp1.2 inserts into the active site of Dgt, trapping the active site in a non-catalytic
  conformation.
