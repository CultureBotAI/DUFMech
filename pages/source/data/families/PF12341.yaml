description: Mcl1_mid, or the middle domain of minichromosome loss protein 1, is the domain that lies
  between a 7-bladed beta-propeller at the N-terminus, family WD40 [pfam:PF00400] etc, and a Homeobox
  (HMG) domain, [pfam:PF00505], at the C-terminus. The full length proteins with all three domains are
  referred to as DNA polymerase alpha accessory factor Mcl1, but the exact function of this domain is
  not known.
