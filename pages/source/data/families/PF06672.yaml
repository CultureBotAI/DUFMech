description: This family represents MagC and related proteins that adopt an NlpC/P60-like fold but are
  catalytically inactive [[cite:PUB00164055]]. The structure consists of a six-stranded beta-sheet and
  five alpha-helices with a Cys-His-His catalytic triad characteristic of NlpC/P60 peptidases. However,
  a conserved tryptophan residue distorts the active site conformation, rendering these proteins unable
  to cleave peptidoglycan while retaining the ability to bind it [[cite:PUB00164055]]. In Pseudomonas
  aeruginosa, MagC is part of a type II alpha-2- macroglobulin complex encoded by the magABCDEF operon,
  where it directly interacts with the macroglobulin MagD [[cite:PUB00164055]]. These proteins are proposed
  to anchor the macroglobulin complex to the peptidoglycan layer in the bacterial periplasm [[cite:PUB00164055]].
