description: This entry represents the N-terminal domain of proteins described as cilia- and flagella-associated
  protein. Proteins containing this domain includes FAP61 from Chlamydomonas reinhardtii. FAP61 is part
  of the calmodulin and spoke-associated complex (CSC) required for wild-type motility and for the stable
  assembly of a subset of radial spokes in motile cilia [[cite:PUB00076499]].
