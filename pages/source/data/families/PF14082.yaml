description: This domain is found mostly in bacteria. It is found at the C-terminal of Shedu protein SduA,
  the only component of antiviral defense system Shedu. Expression of Shedu in B.subtilis (strain BEST7003)
  confers resistance to phages phi105, phi29, rho14 and to a lesser extent to SPP1 [[cite:PUB00097806]].
  This domain may have endonuclease activity [[cite:PUB00066699]].
