description: This family of archaeal proteins includes pantothenate synthetase from Methanosarcina mazei
  and 4-phosphopantoate--beta-alanine ligase (phosphopantothenate synthetase) from Pyrococcus kodakaraensis.
  Pantothenate synthetase catalyses the condensation of pantoate with beta-alanine in an ATP-dependent
  and ADP-producing reaction [[cite:PUB00066834]]. 4-phosphopantoate--beta-alanine ligase catalyses the
  conversion of (R)-4-phosphopantoate and beta-alanine to 4'-phosphopantothenate in the CoA biosynthesis
  pathway. It cannot use (R)-pantoate as substrate and thus does not display pantothenate synthetase activity
  [[cite:PUB00060435]].
