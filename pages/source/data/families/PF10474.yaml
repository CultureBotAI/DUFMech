description: The function of this domain is unknown but it is found at the C terminus of syndetin (VPS50),
  a unique component of the endosome-associated retrograde protein (EARP) complex. The EARP complex otherwise
  shares four of its five subunits with the Golgi-associated retrograde protein (GARP) complex. The EARP
  complex is localised to recycling to endosomes where it acts as a tethering complex for recycling of
  plasma membrane receptors [[cite:PUB00077150]].
