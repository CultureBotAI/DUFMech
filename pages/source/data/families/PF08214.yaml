description: This entry represents a histone acetyltransferase catalytic domain found in fungal proteins,
  including RTT109 (also known as KAT11) from budding and fission yeasts and Candida species. This domain
  catalyses the acetylation of lysine residues on histone H3, including H3K56, H3K9, H3K14, H3K23 and
  H3K27 [[cite:PUB00045009],[cite:PUB00042670]]. The domain functions within a complex with histone chaperones
  such as VPS75 that regulate substrate specificity [[cite:PUB00051225]]. Acetylation of H3K56 by this
  domain promotes nucleosome assembly, DNA repair and transcriptional regulation during S-phase [[cite:PUB00045009],[cite:PUB00042670]].
  The domain is also found in other histone acetyltransferases including p300/CBP which share a similar
  fold but differ in catalytic properties and cofactor requirements [[cite:PUB00051225]]. Members of this
  family show conservation across most eukaryotic fungi.
