description: This domain binds to cellulose and to bacterial cell walls. It is found in glycosyl hydrolases
  and in scaffolding proteins of cellulosomes (multiprotein glycosyl hydrolase complexes). In the cellulosome
  it may aid cellulose degradation by anchoring the cellulosome to the bacterial cell wall and by binding
  it to its substrate [[cite:PUB00057467]]. This domain has an Ig-like fold [[cite:PUB00007734]].
