description: This domain can be found in uncharacterised proteins in viruses, archaea and bacteria, most
  notably it is found in YhcG proteins found in E.coli. This entry represents the C-terminal PDDEXK domain
  belonging to the PD-(D/E)XK superfamily of nucleases involved in DNA recombination and repair [[cite:PUB00091061]].
  Profile HMM analysis identified a relationship between this C-terminal domain of YhcG and [pfam:PF01939]
  , a family of NucS endonucleases [[cite:PUB00054003]]. YHcG was identified in association with DNA processing
  enzymes, including the restriction complexes HsdMRS and McrABC, the integrases IntF and IntS, and the
  recombinase PinE [[cite:PUB00091061]].
