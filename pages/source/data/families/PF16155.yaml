description: This family, previously known as DUF4863, represents 4-hydroxylaminobenzoate lyase (PnbB)
  and related proteins mainly found in various proteobacteria, but also several fungal species. PnbB catalyses
  the conversion of 4-hydroxylaminobenzoate to 3,4-dihydroxybenzoate (protocatechuate) and ammonium. This
  enzyme is involved in the degradation of nitroaromatic compounds [[cite:PUB00158932],[cite:PUB00114928]].
  Proteins from this family have a cupin-like fold and may be related to a group of lyases involved in
  the metabolism of benzoate.
