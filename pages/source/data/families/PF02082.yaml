description: Several proteins in this family form iron-sulfur clusters enabling iron dependent DNA transcription
  regulation [[cite:PUB00109206]]. The iron binding is mediated by three conserved cysteine residues.
  Members of this family can also bind O-acetyl-L-serine, [Fe-S] and nitric oxide (Matilla et. al., FEMS
  Microbiology Reviews, fuab043, 45, 2021, 1. https://doi.org/10.1093/femsre/fuab043).
