description: This entry represents an N-terminal domain of approximately 70 residues found in secreted
  alpha/beta hydrolases in Actinomycetes, particularly Streptomycetaceae, Microbacteriaceae, and Micrococcaceae.
  This domain is found N-terminal to various hydrolase domains including Abhydrolase_1 ([pfam:PF00561])
  and Peptidase_S9 ([pfam:PF00326]). The function of this domain remains to be determined.
