description: This entry, mainly found in Bacteroides, includes the putative surface glycan binding protein
  (SGBP) BT4661 from Bacteroides thetaiotaomicron ([swissprot:Q89YS0]). BT4661 appears to play a role
  in the bacterial degrading apparatus of the host glycosaminoglycans heparin (Hep) and heparan sulfate
  (HS). It shows six discrete domains that adopt an Ig-like fold arranged in an extended, curved conformation
  [[cite:PUB00100963]]. This is the first Ig-like domain.
