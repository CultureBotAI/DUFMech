description: This entry represents a member of a biosynthetic gene cluster (BGC). This BGC (BGC0001577)
  is described by MIBiG as an example of the following biosynthetic class, RiPP (ribosomally synthesised
  and post-translationally modified peptide). It includes lantibiotic duramycin, duramycin B and cinnamycin.
