description: This is a family of proteins conserved from fungi to humans, including fungal Inclusion body
  clearance protein Iml2 protein, animal tetratricopeptide repeat protein 39A/B/C (TT39A/B/C) and some
  uncharacterised proteins. Members of this family carry a tetratricopeptide repeat [pfam:PF07719] at
  their C terminus. This entry includes Iml2 and its paralogue-YKR018C from S. cerevisiae; Iml2 localises
  to the cytoplasm and nucleus [[cite:PUB00016470]], and its expression is increased in response to DNA
  replication stress [[cite:PUB00066967]]. It is found to be involved in lipid droplet-mediated inclusion
  body clearing after protein folding stress [[cite:PUB00088292]]. In humans, TTC39A (also known as DEME6)
  is expressed in primary breast carcinomas but not in normal breast tissue, and has a putative eukaryotic
  RNP-1 RNA binding region and a candidate anchoring transmembrane domain. It is coordinately regulated
  with oestrogen receptor, but is not necessarily oestradiol-responsive [[cite:PUB00044224]]. TTC39B has
  been linked to lipid metabolism [[cite:PUB00072592]].
