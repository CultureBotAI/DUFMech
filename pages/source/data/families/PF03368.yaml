description: This domain is found in members of the Dicer protein family which function in RNA interference,
  an evolutionarily conserved mechanism for gene silencing using double-stranded RNA (dsRNA) molecules.
  It is essential for the activity of Dicer [[cite:PUB00067933],[cite:PUB00043694]]. It is a divergent
  double stranded RNA-binding domain [[cite:PUB00043692]]. The N-terminal alpha helix of this domain is
  in a different orientation to that found in canonical dsRNA-binding domains. This results in a change
  of charge distribution at the potential dsRNA-binding surface and in the N- and C-termini of the domain
  being in close proximity [[cite:PUB00066744]]. This domain has weak dsRNA-binding activity. It mediates
  heterodimerisation of Dicer proteins with their respective protein partners [[cite:PUB00066744]].
