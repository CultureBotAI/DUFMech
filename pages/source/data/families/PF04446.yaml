description: The Thg1 protein from Saccharomyces cerevisiae is responsible for adding a GMP residue to
  the 5' end of tRNA His [[cite:PUB00020433]]. The catalytic domain Thg1 contains a RRM (ferredoxin) fold
  palm domain, just like the viral RNA-dependent RNA polymerases, reverse transcriptases, family A and
  B DNA polymerases, adenylyl cyclases, diguanylate cyclases (GGDEF domain) and the predicted polymerase
  of the CRISPR system [[cite:PUB00057251]]. Thg1 possesses an active site with three acidic residues
  that chelate Mg++ cations [[cite:PUB00057251]]. Thg1 catalyzes polymerization similar to the 5'-3' polymerases
  [[cite:PUB00057251]][[cite:PUB00057252]].
