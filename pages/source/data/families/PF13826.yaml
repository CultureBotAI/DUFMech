description: This entry includes Monooxygenase af470-like from Aspergillus fumigatus, which is part of
  the fma gene cluster that mediates the biosynthesis of fumagillin, a meroterpenoid with numerous biological
  activities [[cite:PUB00081410]]. It has been suggested that af470 mediates the oxidative cleavage of
  the terminal alkene of the dodecapentaenoate side chain into the carboxylic acid present in fumagillin
  [[cite:PUB00081411]].
