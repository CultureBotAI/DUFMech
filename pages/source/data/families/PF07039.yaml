description: SAGA-associated factor 29 (SGF29) is involved in transcriptional regulation as a chromatin
  reader component of some histone acetyltransferase (HAT) SAGA-type complexes like the TFTC-HAT, ATAC
  or STAGA complexes [[cite:PUB00053704],[cite:PUB00088833],[cite:PUB00099984],[cite:PUB00058697],[cite:PUB00099985]].
  It specifically recognises and binds methylated 'Lys-4' of histone H3 (H3K4me), with a preference for
  the trimethylated form (H3K4me3). It also may be involved in MYC-mediated oncogenic transformation [[cite:PUB00053704]].
  This entry represents the two tandem tudor-like domains found at the C-terminal of yeast and human SGF29
  proteins and the plant homologues. Each of them has a negatively-charged pocket capable of binding H3A1
  and an aromatic cage for the recognition of H3K4me2/3 residues [[cite:PUB00099984],[cite:PUB00058697]].
