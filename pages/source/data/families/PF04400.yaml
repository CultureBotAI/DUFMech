description: The NqrM gene is often found adjacent to the nqr operons that encode (Na+)-NQR subunits.
  It is involved in the maturation of (Na+) translocating NADH:quinone oxidoreductase in proteobacteria.
  The four conserved Cys residues found in NqrM are required for (Na+)- NQR maturation and may serve as
  ligands for a metal ion or metal cluster used to build up the (Na+)-NQR molecule [[cite:PUB00077340]].
