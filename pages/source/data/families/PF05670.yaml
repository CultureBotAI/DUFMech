description: 'This domain occurs in proteins that have been annotated as Fibronectin/fibrinogen binding
  protein by similarity. This annotation comes from [swissprot:O34693] where the N-terminal region is
  involved in this activity [[cite:PUB00011315]]. It is an RNA binding domain of the NFACT (NEMF, FbpA,
  Caliban, and Tae2) proteins. This NFACT-R family is found in two eukaryotic gene contexts: fused to
  the NFACT-N and NFACT-C domains in the NFACT protein involved in the ribosomal quality control pathway
  which contributes to CAT-tailing and as a standalone domain [[cite:PUB00091027]]. Additionally this
  domain contains a conserved motif D/E-X-W/Y-X-H that may be functionally important.'
