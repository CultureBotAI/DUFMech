description: SymE (SOS-induced yjiW gene with similarity to MazE ) is an SOS-induced toxin. It inhibits
  cell growth, decreases protein synthesis and increases RNA degradation. It may play a role in the recycling
  of RNAs damaged under SOS response-inducing conditions. It is predicted to have an AbrB fold, similar
  to that of the antitoxin MazE. Its translation is repressed by the antisense RNA SymR, which acts as
  an antitoxin [[cite:PUB00064452],[cite:PUB00053151]].
