description: This family of proteins is functionally uncharacterised. This family of proteins is found
  in bacteria. Proteins in this family are typically between 137 and 164 amino acids in length. These
  proteins are integral membrane proteins with four transmembrane helices. The contain several conserved
  histidines and AlphaFold 3 predicts a confident zinc binding site. Structure prediction also suggests
  that these proteins might form a homotetrameric complex UniProt:A0A3B9LPY9 iPTM=0.9. The four subunits
  are alternating in different orientations in the presumed membrane. The structure prediction also suggests
  a central pore between the subunits.
