description: This domain is found in human Distal membrane-arm assembly complex protein 1 (DMAC1), which
  is required for the assembly of the mitochondrial NADH:ubiquinone oxidoreductase complex, Tam6 from
  Schizosaccharomyces pombe (also known as Dmo2), which is required for the stability and maturation of
  Cox2p, the second subunit of the COX complex, and similar eukaryotic proteins. This domain is predicted
  to show two alpha helices.
