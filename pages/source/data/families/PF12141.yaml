description: This entry represents a group of fungal beta-mannosyltransferase that are involved in cell
  wall biosynthesis [[cite:PUB00086020]]. For example, in Candida albicans, BMT1-4 enzymes act stepwise
  to add beta-mannoses on to cell-wall phosphopeptidomannan (PPM). While Bmt5 and Bmt6 are involved in
  the addition of the first and third beta-mans to phospholipomannan (PLM), respectively [[cite:PUB00097617]].
  Furthermore, in Saccharomyces cerevisiae, BMT5 and BMT6 are responsible for methylation of uridine residues
  in the 25S rRNA [[cite:PUB00075659]].
