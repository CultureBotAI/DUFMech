description: This domain is found in uncharacterised proteins mainly from Trypanosomatidae species. It
  is predicted to fold into a beta-barrel structure that is reminiscent to the beta-barrel observed in
  VirK family proteins [pfam:PF06903]. These two barrels, however, relate not only by circular permutation
  but also by strand flip with a change of directionality.
