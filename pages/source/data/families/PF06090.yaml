description: This is a family of inositol-pentakisphosphate 2-kinases (EC 2.7.1.158) (also known as inositol
  1,3,4,5,6-pentakisphosphate 2-kinase, Ins(1,3,4,5,6)P5 2-kinase) and InsP5 2-kinase). This enzyme phosphorylates
  Ins(1,3,4,5,6)P5 to form Ins(1,2,3,4,5,6)P6 (also known as InsP6 or phytate). InsP6 is involved in many
  processes such as mRNA export, nonhomologous end-joining, endocytosis and ion channel regulation.
