description: This entry represents putative lysis proteins from Bacteriophage MS2 and Bacteriophage BZ13.
  The bacteriophage MS2 lysin protein swiss:C0M1L5 was identified as an overlapping cistron in the bacteriophage
  MS2 RNA [[cite:PUB00053761]]. This proteins induces the formation of specific membrane adhesion sites
  between the inner and outer membranes, apparently leading to host cell lysis. Lysis may be performed
  via activation of host murein hydrolases [[cite:PUB00097482],[cite:PUB00097483]].
