description: This entry represents the C-terminal domain in Centrosome-associated protein 350 (Cep350),
  Protein TRM32 and Protein LONGIFOLIA 1/2 found in eukaryotes. This domain contains a helical fold. LNG2
  in association with LNG1, regulates leaf morphology by promoting longitudinal polar cell elongation
  independently of ROT3. It associates with microtubules and recruits TON1A and TON1B to the cytoskeleton
  through its C-terminal [[cite:PUB00078481],[cite:PUB00095561]].
