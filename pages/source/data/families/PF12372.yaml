description: This entry represents HEAT repeats from Huntingtin (HTT), which are part of the N-terminal
  HEAT domain. These are a second set, separated from N-HEAT_1 ([pfam:PF20926]) by an unstructured region
  [[cite:PUB00018624],[cite:PUB00100583]]. HTT is expressed in many tissues with various expression levels
  and is involved in a number of cellular functions. However, its exact function is not yet clear. An
  abnormal polyglutamine (polyQ) expansion in this protein causes Huntington's disease (HD) a progressive
  autosomal-dominant neurodegenerative disease characterised by an uncontrolled motor movement known as
  chorea, cognitive disorder and depression [[cite:PUB00018624]]. HTT consists of multiple HEAT repeats
  organised in N-terminal, bridge and C-terminal domains [[cite:PUB00018624]], which function as a scaffold
  that mediated interactions with binding partners.
