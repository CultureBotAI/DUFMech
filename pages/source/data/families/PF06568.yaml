description: This arginine rich domain is found at the C-terminal end of YjiS from Salmonella Typhimurium
  and similar short sequences from proteobacteria. YjiS, an inner membrane-associated small protein, acts
  as as a suppressor of flagella production, leading to pathogen escape from infected host cells [[cite:PUB00160930]].
  In the plant pathogen Agrobacterium tumefaciens, some small proteins that contain this domain are involved
  in nutrient acquisition and central carbon metabolism [[cite:PUB00160928]]. CcaF1 from Rhodobacter sphaeroides
  is an RNA binding protein that has a role in the oxidative stress defence [[cite:PUB00160929]]. In some
  uncharacterised proteins, this domain, previously known as DUF1127, covers the whole sequence.
