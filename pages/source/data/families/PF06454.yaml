description: This domain is found in plant proteins including THH1/TOM1/TOM3 from Arabidopsis. TOM1 and
  TOM3 are transmembrane proteins necessary for the efficient multiplication of tobamoviruses [[cite:PUB00090719]].
  THH1 supports tobamovirus multiplication, but to a lesser extent than TOM1 and TOM3 [[cite:PUB00090720]].
  Members containing this domain are part of the GPCR superfamily and involved in stress tolerance [[cite:PUB00097749],[cite:PUB00097748]].
