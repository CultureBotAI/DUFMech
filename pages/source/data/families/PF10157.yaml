description: This is a family of conserved proteins found from nematodes to humans. Family members include
  BORCS6 (BLOC-1-related complex sub-unit 6) also known as Lyspersin (lysosome-dispersing protein) or
  C17orf59. It constitutes sub-unit 6 of the BORC complex (BLOC-one-related complex). BORC is a multisubunit
  complex that regulates the positioning of lysosomes at the cell periphery, and consequently affects
  cell migration. BORC associates with the lysosomal membrane, where it functions to recruit the small
  GTPase Arl8. This initiates a series of interactions that promote the microtubule-guided transport of
  lysosomes toward the cell periphery [[cite:PUB00082308],[cite:PUB00074975]]. this entry represents a
  C-terminal alpha helix according to structure predictions.
