description: This domain family corresponds to the N-terminal domain of NSP3 (non-structural protein 3,
  also known as nsp3) found in Betacoronavirus, which is encoded on the replicase polyprotein. This family
  includes the NSP3a domain which has the ubiquitin-like 1 (UB1) and glutamic acid-rich acidic (AC) hypervariable
  domains [[cite:PUB00094113]]. NSP3a interacts with numerous other proteins involved in replication and
  transcription and may serve as a scaffolding protein for these processes. The N-terminal NSP3a domain
  interacts with N (nucleocapsid) protein to colocalise genomic RNA with the nascent replicase-transcriptase
  complex at the earliest stages of infection, essential for the virus [[cite:PUB00094112]]. The C-terminal
  Glu-rich subdomain is best described as a flexible tail attached to the globular UB1 subdomain [[cite:PUB00047544]].
  The family is found in association with [pfam:PF08716], [pfam:PF01661], [pfam:PF05409], [pfam:PF06471],
  [pfam:PF08717], [pfam:PF06478], [pfam:PF09401], [pfam:PF06460], [pfam:PF08715], [pfam:PF08710].
