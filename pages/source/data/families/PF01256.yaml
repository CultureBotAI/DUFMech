causal_graphs:
- graph_id: yeast-nnr2-atp-nadhx-dehydration
  title: ATP supports NADHX-to-NADH conversion by yeast Nnr2
  scope: Purified N-terminal His-tagged S. cerevisiae YKL151C/Nnr2 in Marbaix 2011 Figure 2C; not every
    PF01256 member or cellular metabolite repair.
  context: Spectrophotometric NADH production in the Figure 2C ATP series at pH 7.1 and 30 C with about
    20 uM (S)-NADHX. General assay conditions use 25 mM HEPES, 2 mM MgCl2 and 0.05-0.2 mg/ml BSA; nucleotide
    concentration is varied as plotted rather than assumed to equal the general 0.2-1 mM range. The corresponding
    ADP series and zero-nucleotide condition are controls. Exact panel-specific enzyme dose and BSA concentration
    are not reported.
  family_mapping: YKL151C/NNR2 maps to S288c reference UniProtKB:P36059, 337 aa, sequence version 1; PF01256
    spans 35-305. UniProt and InterPro sequences agree. Table S1 primer coding termini match MLAELSHR
    and VFAKLFG-stop locally. The pET100/D-Topo insert was sequence-confirmed by the authors, but complete
    clone sequence, fusion junction and boiled-cell template strain were not independently reconstructed.
    BL21 Star(DE3) is the expression host.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:4932
  limitations: This is an intact recombinant-protein reaction, not isolated-domain sufficiency. Methods
    permit mixed stocks or 70-85%-pure enriched fractions; Figure 2C does not specify which stock or which
    spectrophotometric wavelength was used. Spontaneous epimerization and mixed-species expression do
    not establish intracellular flux. The plotted ATP response and reciprocal ADP result are condition-specific,
    not a universal nucleotide rule for PF01256. No phosphorylated intermediate or residue-level catalytic
    trajectory is directly observed.
