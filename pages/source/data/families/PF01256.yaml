- graph_id: ecoli-yjef-r-enriched-nadhx-repair
  title: Intact YjeF and ADP convert an R-enriched NADHX mixture to NADH
  scope: The bifunctional E. coli YjeF preparation in Marbaix 2011 Figure 2D; this is a whole-protein
    net conversion, not an isolated dehydratase acting directly on pure R-NADHX.
  context: HPLC time course at pH 8 and 30 C with 2.1 ug/ml YjeF, 5 mM KCl and an R-enriched NADHX preparation,
    with or without 0.1 mM ADP-Mg. Equal-volume 8 M urea/10 mM EDTA stops reactions. Figure 2D gives means
    and SD for three replicates; the caption also reports little change in no-enzyme controls with ADP-Mg.
    HPLC separates epimers and NADH by retention and UV criteria; the full incubation buffer composition
    is not independently specified for this panel.
  family_mapping: The 515-aa P31806 reference maps to PF01256 at 258-496 and separate PF03853 at 40-199.
    Both domains remain in the recombinant pET100/D-Topo His fusion; no domain deletion or isolated-domain
    assay was performed here. Reference/primer matches do not reconstruct every historical clone or template
    strain.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:562
  limitations: The starting fraction contains both epimers, not pure R substrate. Without ADP, YjeF accelerates
    epimer interconversion without comparable NADH formation; with ADP both epimers decline as NADH increases.
    These observations are not split into independently sufficient domains or atomically tracked molecules.
    ADP-to-AMP stoichiometry is reported as unshown data and is not added as a separate observed edge.
    Cyclic NADHX repair is not inferred.
