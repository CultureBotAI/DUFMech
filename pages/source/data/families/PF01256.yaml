- graph_id: ecoli-yjef-adp-nadhx-dehydration
  title: ADP supports NADHX-to-NADH conversion by intact E. coli YjeF
  scope: N-terminal His-tagged E. coli YjeF/Nnr in Marbaix 2011 Figure 2C; separate from the yeast ATP
    assay and the pH-8 HPLC time course.
  context: The pH-7.1 ADP series uses about 20 uM (S)-NADHX at 30 C, with general spectrophotometric conditions
    of 25 mM HEPES, 2 mM MgCl2 and 0.05-0.2 mg/ml BSA. ADP concentration is varied as plotted. ATP and
    no-nucleotide comparisons are retained; exact YjeF dose and BSA concentration for this panel are unspecified.
    Purification includes metal affinity, Source 30Q and Superdex 200 after expression in BL21 Star(DE3).
  family_mapping: UniProtKB:P31806 (nnr/yjeF, b4167/JW4125), K12 reference, is 515 aa and sequence version
    2. PF01256 spans 258-496; a separate PF03853 match at 40-199 belongs to the N-terminal region. UniProt
    and InterPro agree exactly; Table S1 primer coding termini match MTDHTMK and ESSNSAP-stop locally.
    The actual genomic template strain and complete His fusion remain unverified.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:562
  limitations: Full-length YjeF contains both repair activities; this assay does not prove isolated PF01256
    sufficiency or assign its epimerase reaction to that domain. Figure 2C does not distinguish a mixed
    from an enriched stock or specify which optical wavelength was used. A small ATP-associated signal
    is not promoted to efficient ATP use, nor is universal ATP inactivity asserted. No ADP-binding geometry,
    phosphorylated intermediate or physiological repair rate is resolved by this optical assay.
