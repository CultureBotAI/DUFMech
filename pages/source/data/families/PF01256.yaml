description: Hydration of NAD(P)H to NAD(P)HX, which inhibits several dehydrogenases, is corrected by
  an ATP-dependent dehydratase and an epimerase. The ATP-dependent dehydratase has been identified as
  the product of the vertebrate Carkd (carbohydrate kinase domain) gene [[cite:PUB00073185],[cite:PUB00100876]].
  Variants of this enzyme leads to deficient NADHX repair mitochondrial dysfunction in humans, associated
  with a lethal neurometabolic disorder in early childhood [[cite:PUB00100876]]. In E. coli, it is found
  as the C-terminal domain of a bifunctional enzyme (YjeF) that also includes the epimerase and uses ADP
  instead of ATP [[cite:PUB00060794]]. These enzymes are widespread in eukaryotes, prokaryotes, and archaea.
