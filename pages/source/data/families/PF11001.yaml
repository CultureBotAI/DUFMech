description: This entry represents mitochondrial proteins from fungi, such as subtelomeric hrmA-associated
  cluster protein AFUB_079030 from Aspergillus fumigatus and YDR124W from yeast. Null mutant showed severe
  fragmentation of mitochondria and its expression is strongly induced by alpha factor. These proteins
  may have a role in maintenance of mitochondrial morphology [[cite:PUB00101836]]. This entry represents
  an helical bundle domain which seems to adopt a similar arrangement than the EIN3-like DNA-binding domain
  (Based on structural comparison, DALI server). AFUB_079030 is part of the subtelomeric hrmA-associated
  cluster (HAC) containing genes that alter the hyphal surface (such as reduced total chitin or increased
  beta-glucan exposure) and perturb inter-hyphal interactions within the developing biofilms, resulting
  in a loss of vertically aligned polarised growing filaments [[cite:PUB00153731]].
