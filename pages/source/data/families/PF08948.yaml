description: The spike structure of bacteriophage PRD1 is comprised of proteins P2, P5, and P31. P5 is
  an elongated multidomain trimer. This domain is found at the N-terminal of bacteriophage PRD1 spike
  protein P5 and mediates the interaction with protein P31. The C-terminal domain appears to contain the
  residues responsible for the trimerization of the protein [[cite:PUB00032209],[cite:PUB00088279]].
