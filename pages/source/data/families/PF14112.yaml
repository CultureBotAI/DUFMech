description: A predicted immunity protein with an alpha+beta fold and conserved tryptophan,tyrosine and
  an acidic residues. Proteins containing this domain are present in bacterial polymorphic toxin systems
  as an immediate gene neighbor of the toxin gene, which usually contains toxin domains of the ColD/E5,
  Tox-REase-4, Ntox49 or Ntox14 families [[cite:PUB00066726]]. The domain is also found in heterogeneous
  polyimmunity loci.
