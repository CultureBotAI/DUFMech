description: This is the N-terminal domain of proteins from photosynthetic organisms including plants
  and cyanobacteria, such as Tab2 proteins. Tab2 was first identified in Chlamydomonas reinhardtii as
  a RNA binding protein required for translation of the chloroplast PsaB photosystem I subunit [[cite:PUB00083885]].
  Later, the Tab2 homologue (ATAB2) from Arabidopsis was found involved in the signalling pathway of light-controlled
  synthesis of photosystem proteins during early plant development [[cite:PUB00083887]], presumably functioning
  as an activator of translation with targets at PSI and PSII [[cite:PUB00098288]].
