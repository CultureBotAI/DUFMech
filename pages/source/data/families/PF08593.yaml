description: This entry represents the C-terminal domain found in Meiotically up-regulated gene 135 protein
  from Schizosaccharomyces pombe (Mug135, also known as Tdk1, O74876) and similar fungal proteins that
  are annotated as meiotically up-regulated gene products. Mug135 is a killer meiotic driver (KMD), a
  selfish genetic element that by selectively kills meiotic products lacking its gene, thereby promoting
  its own propagation. This protein exists in a nontoxic tetrameric form during vegetative growth and
  meiosis but transforms into a distinct toxic form in spores [[cite:PUB00159004],[cite:PUB00159007]].
  These proteins generally contain a long coiled-coil region with this domain found at the C-terminus.
