description: 'This domain is found in proteins from bacteria and archaea, including Inner membrane protein
  YgaP from Escherichia coli, a membrane protein with a rhodanese domain (Pfam: PF00581) that may have
  sulfurtransferase activity. YgaP adopts a dimeric assembly. This entry represents the transmembrane
  domain. It consist of two slightly tilted alpha-helices [[cite:PUB00100968]]. Structure prediction suggests
  that this region may homodimerise to form a 4 helical bundle.'
