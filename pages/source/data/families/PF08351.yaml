description: This domain of unknown function is often found at the N-terminal of the bacterial tRNA(Met)
  cytidine acetyltransferase TmcA. TmcA catalyses the formation of N(4)-acetylcytidine (ac4C) at the wobble
  position of tRNA(Met) by using acetyl-CoA as an acetyl donor and either ATP or GTP [[cite:PUB00050413],[cite:PUB00056806],[cite:PUB00107449]].
  This modification is thought to ensure precise recognition of the AUG codon by strengthening C-G base-pair
  interaction and also prevent misrecognition of the near cognate AUA codon [[cite:PUB00050413]]. This
  domain is also found in mammalian N-acetyltransferase 10 (NAT10) and fungal protein Kre33. Kre33 and
  NAT10 are RNA cytosine acetyltransferases with specificity toward both 18S rRNA and tRNAs and contain
  additional putative nuclear and nucleolar localisation signals (NLS and NoLS respectively) [[cite:PUB00076725],[cite:PUB00076726],[cite:PUB00107449]].
