description: This domain is found linked to a wide range of non-homologous domains in a variety of bacteria.
  It has been shown to be homologous to the adenylyl cyclase catalytic domain [[cite:PUB00007061]] and
  has diguanylate cyclase activity [[cite:PUB00016966]]. This observation correlates with the functional
  information available on two GGDEF-containing proteins, namely diguanylate cyclase and phosphodiesterase
  A of Acetobacter xylinum, both of which regulate the turnover of cyclic diguanosine monophosphate. In
  the WspR protein of Pseudomonas aeruginosa, the GGDEF domain acts as a diguanylate cyclase, PDB:3bre,
  when the whole molecule appears to form a tetramer consisting of two symmetrically-related dimers representing
  a biological unit. The active site is the GGD/EF motif, buried in the structure, and the cyclic dimeric
  guanosine monophosphate (c-di-GMP) bind to the inhibitory-motif RxxD on the surface. The enzyme thus
  catalyses the cyclisation of two guanosine triphosphate (GTP) molecules to one c-di-GMP molecule [[cite:PUB00016971],[cite:PUB00109145],[cite:PUB00050740]].
