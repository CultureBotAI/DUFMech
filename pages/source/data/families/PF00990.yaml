causal_graphs:
- graph_id: pled-purified-cyclase-feedback
  title: Purified PleD synthesis, product inhibition and joint DivJ-ATP stimulation
  scope: Full-length C. crescentus PleD with a C-terminal His6 tag from pCC2; purified-protein assays,
    not isolated GGDEF sufficiency or a measured cellular feedback loop.
  context: The 2004 Genes & Development TLC assays use 50 uL, 75 mM Tris pH 7.8, 250 mM NaCl, 25 mM KCl,
    10 mM MgCl2 and 100 uM GTP. Figure 5B uses 50 ug PleD; Figures 6A and 7A use 25 ug. The TLC assay
    temperature is not specified in the inspected methods; the separate HPLC protocol is 90 min at 25
    C. GTP and magnesium are joint reaction inputs.
  family_mapping: PleD references Q9A5I5 (CB15, CC_2462) and B8GZM2 (NA1000/CB15N, CCNA_02546) have identical
    454-aa sequences, both version 1. Q9A5I5 maps to PF00990 at 289-447. Deposited 1W25 matches native
    residues 2-454 plus His6, with CB15 source taxonomy but a SIFTS B8GZM2 mapping. The exact pCC2 cloning
    template remains unverified; species-level taxonomy avoids conflating the two reference strains.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:155892
  limitations: Separate compatible biochemical assays support the graph, not a single measured feedback
    trajectory. Product inhibition is qualitative here; the later PNAS noncompetitive interpretation supersedes
    the earlier competitive-binding suggestion, but its supplementary fit was not inspected. DivJ-plus-ATP
    stimulation does not itself resolve phosphorylation, dimerization and domain-motion microsteps. The
    exact DivJ fragment boundaries and pCC2 template sequence remain unverified. No family-wide catalytic
    competence or cell-cycle phenotype is inferred.
  feedback_explanation: PleD makes c-di-GMP, and added c-di-GMP decreases PleD's initial product-formation
    rate in a separate assay. These experimentally supported directions define negative product feedback
    under the stated in-vitro conditions; they do not establish a cellular steady state or measured oscillation.
