description: GPHR_N is the N-terminal 5TM region of the Golgi pH regulator proteins in eukaryotes. It
  plays vital roles in the transport of newly synthesized proteins from the Golgi to the plasma membrane,
  in the glycosylation of proteins along the exocytic pathway and the structural organisation of the Golgi
  apparatus [[cite:PUB00059167],[cite:PUB00059166],[cite:PUB00109674]].
