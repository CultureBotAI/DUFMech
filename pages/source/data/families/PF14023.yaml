description: This family of domains is functionally uncharacterised, however it is distantly related to
  bestrophin proteins. Structure prediction suggests that these proteins can form homopentamers as Bestrophin
  proteins do. These proteins may function as chloride channels. This domain is sometimes found at the
  C-terminus in large RHS proteins suggesting that it may function as a toxin. This domain was formerly
  known as DUF4239.
