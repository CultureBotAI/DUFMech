description: This entry represents an uncharacterized protein found in various phages that infect bacteria
  including Escherichia, Salmonella, Shigella, Klebsiella, Enterobacter, Citrobacter and Cronobacter.
  The protein ranges in length from around 66 to 98 amino acids. The protein forms a single compact domain
  composed of a four stranded beta sheet and two alpha helices. The structure shows some weak structural
  similarity to the BRICHOS domain. No clear function is known for these proteins.
