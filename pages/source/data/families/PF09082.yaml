description: This entry represents a putative zinc finger domain. Proteins containing this domain typically
  consist of a beta-sheet region followed by an alpha-helix and an unstructured C-terminus. The beta-sheet
  region contains a CXCX...XCXC sequence with Cys residues located in two proximal loops and pointing
  towards each other. The precise function of this set of bacterial proteins is, as yet, unknown [[cite:PUB00008047]].
