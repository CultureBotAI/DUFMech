description: This domain is predominantly found in viral proteins from the family Picornaviridae. It is
  VP4 of the viral polyprotein which, in poliovirus, is part of the capsid that consists of 60 copies
  each of four proteins VP1, VP2, VP3, and VP4 arranged on an icosahedral lattice [[cite:PUB00109098]].
  VP4 is on the inside and differs from the others in being small, myristoylated and having an extended
  structure. Productive infection involves the externalisation of the VP4, which is cleaved from the rest,
  along with the N-terminus of VP1. There thus seem to be three stages of the virus, ie a multi-step process
  for cell entry involving RNA translocation through a membrane channel formed by the externalised N termini
  of VP1 [[cite:PUB00109099]].
