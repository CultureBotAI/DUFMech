description: Omp_AT is a family of Gram-negative Gamma-proteobacteria outer membrane autotransporter beta-barrel
  proteins. Secondary structure prediction indicates a beta-barrel domain of 12 beta-strands. with an
  N terminal helix running along the central barrel axis perpendicular to the 12 antiparallel strands
  that form the barrel. Autotransporter translocation units defined by a beta-barrel of 12 to 14 antiparallel
  strands with an N terminal helix perpendicular to the barrel [[cite:PUB00086595]].
