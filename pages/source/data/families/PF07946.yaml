description: This family represents CCDC47 proteins which are a component of the PAT complex, an endoplasmic
  reticulum (ER)-resident membrane multiprotein complex that facilitates multi-pass membrane proteins
  insertion into membranes [[cite:PUB00097218]]. The PAT complex, formed by CCDC47 and Asterix proteins,
  acts as an intramembrane chaperone by directly interacting with nascent transmembrane domains (TMDs),
  releasing its substrates upon correct folding, and is needed for optimal biogenesis of multi-pass membrane
  proteins [[cite:PUB00097218]]. CCDC47 ([swissprot:Q96A33]) is required to maintain the stability of
  Asterix [[cite:PUB00097218],[cite:PUB00097217]]. CCDC47 is associated with various membrane-associated
  processes and is component of a ribosome-associated ER translocon complex involved in multi-pass membrane
  protein transport into the ER membrane and biogenesis [[cite:PUB00097241]]. It is also involved in the
  regulation of calcium ion homeostasis in the ER [[cite:PUB00097242]], being also required for proper
  protein degradation via the ERAD (ER-associated degradation) pathway [[cite:PUB00097243]].
