description: This family consists of several related groups of proteins one of which is the LptC family.
  LptC is involved in lipopolysaccharide-assembly on the outer membrane of Gram-negative organisms. The
  lipopolysaccharide component of the outer bacterial membrane is transported form its source of origin
  to the outer membrane by a set of proteins constituting a transport machinery that is made up of LptA,
  LptB, LptC, LptD, LptE. LptC is located on the inner membrane side of the intermembrane space.
