description: This domain is found at the C-terminal end of human Transmembrane 7 superfamily member 3
  (TM7SF3), which is is involved in the inhibition of cytokine-induced death of pancreatic beta cells,
  towards the N terminus of human Transmembrane protein 198 (TM198), which plays a role in Wnt signalling
  and in similar proteins mainly found in animal, fungi and bacteria. This domain is predicted to adopt
  an all alpha-helical structure.
