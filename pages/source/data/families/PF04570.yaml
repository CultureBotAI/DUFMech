description: zf-FLZ is a FCS-like zinc-finger domain found in higher plants. It is bryophitic in origin.
  It carries a zf-FCS-like C2-C2 zinc finger, consisting of a consensus cysteine-signature sequence with
  conserved phenyl alanine and serine residue associated with a third cysteine. It acts as a protein-protein
  interaction module [[cite:PUB00070912]].
