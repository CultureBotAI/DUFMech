description: This is the FLD domain found in tRNA(Ile2) 2-agmatinylcytidine synthetase TiaS. TiaS is an
  archaeal ATP-dependent agmatine transferase that catalyses the formation of 2-agmatinylcytidine (agm2C)
  at the wobble position (C34) of tRNA(Ile2) [[cite:PUB00056803],[cite:PUB00154283],[cite:PUB00106019]].
  This modified base specifically recognises AUA codons. TiaS consists of four domains, the TCKD domain
  ([pfam:PF22641]) at the N-terminal followed by the FLD domain, an OB fold domain and a zinc ribbon domain
  (ZRD) domain at the C-terminal [[cite:PUB00154283]]. This domain is responsible for agmantine binding
  [[cite:PUB00056803]].
