description: This domain has been identified in fungi and bacteria. It is found in fatty acid synthase
  beta subunit from fungi, including Fas1 from yeasts and aflB from Aspergillus parasiticus. This is an
  inserted helical domain, whose function is not clear, and is found together with the MaoC-like domain
  ([pfam:PF01575]) and the acyltransferase domain ([pfam:PF00698]) [[cite:PUB00016843]]. Fas1 is a fatty
  acid synthetase that catalyses the formation of long-chain fatty acids from acetyl-CoA, malonyl-CoA
  and NADPH [[cite:PUB00006544]]. AflB is part of the gene cluster that mediates the biosynthesis of aflatoxins
  [[cite:PUB00083132]].
