description: This domain is found in the human Protein shortage in chiasmata 1 ortholog (SHOC1) and related
  proteins from chordate. SHOC1 is an integral to the formation of crossover recombination intermediates
  during mammalian meiosis [[cite:PUB00090399]]. SHOC1 preferentially binds branched DNA molecules but
  apparently lacks in vitro endonuclease activity [[cite:PUB00090399]]. The core of SHOC1 resembles the
  DNA repair endonuclease XPF. This domain has significant similarity to P-loop AAA ATPase domains. This
  aligns with the SHOC1 ATPase activity, which is stimulated by the presence of single-stranded DNA [[cite:PUB00090399]].
