description: This is a presumed domain found in a group of uncharacterised sequences from bacteria. According
  to structure predictions, this domain is found towards the C-terminal, after a glycosyltransferase domain
  ([pfam:PF13231]), and it may adopt an alpha/beta structure. In some instances, this domain is followed
  by and all-beta domain at the very C-terminal of the sequences ([pfam:PF23157]). The function of this
  domain is unknown.
