description: Glyco_trans_A_1 is family of found predominantly at the N-terminus of various prokaryotic
  alpha-glucosyltransferases. According to whether the domain exists as a whole molecule or as a half
  molecule determines the number of sugar residues that the molecule transfers. Two-domain proteins are
  processive in that they transfer more than one sugar residue, processively; single domain proteins transfer
  just one sugar moiety [[cite:PUB00075675],[cite:PUB00064844]].
