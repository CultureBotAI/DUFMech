description: This domain forms part of the WASH-complex of domains and proteins that activates the Arp2/3
  complex, see [pfam:PF04062]. The Arp2/3 complex regulates endocytosis, sorting, and trafficking within
  the cell. The WAHD domain attaches to the FAM21 proteins via its N-terminal residues and to the microtubules
  via its C-terminal residues.
