description: This is a family of putative bacterial lipoproteins necessary for the uptake of haem-iron.
  The structure of UniProtKB:Q0PBW2, PDB:2g5g, comprises a large parallel beta-sheet with flanking alpha-helices
  and a smaller domain consisting of alpha-helices. Two cofacial haem groups (~3.5 Angstom apart with
  an inter-iron distance of 4.4 Angstrom) bind in a pocket formed by a dimer of two ChaN monomers [[cite:PUB00075535],[cite:PUB00040938]].
