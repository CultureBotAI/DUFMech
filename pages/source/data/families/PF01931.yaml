description: NTPase_I-T is a family of NTPases with supreme activity against ITP and XTP. Active site
  analysis and structure comparison of YjjX strongly suggested that it is an NTP binding protein with
  nucleoside triphosphatase activity. YjjX exhibits a mixed alpha-beta fold [[cite:PUB00038960],[cite:PUB00037841]].
