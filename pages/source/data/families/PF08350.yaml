description: This archaeal domain of unknown function has been found at the middle of Methanogenesis regulatory
  protein FilR1 [[cite:PUB00091155],[cite:PUB00098067]] and at the C-terminus of archaeal proteins, including
  several transcriptional regulators of the ArsR family (see [pfam:PF01022]). FilR1 is a member of the
  two-component regulatory system FilI/FilRs which is involved in the regulation of methanogenesis.
