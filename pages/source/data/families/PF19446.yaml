description: This entry represents a member of a biosynthetic gene cluster (BGC). This BGC (BGC0000838)
  is described by MIBiG as an example of the following biosynthetic class, polyketide, in particular the
  flexirubin biosynthetic gene cluster from Flavobacterium johnsoniae. This protein has no known function.
  It is found in Actinobacteria, Proteobacteria and Bacteroidetes. Proteins in this family are typically
  between 234 and 271 amino acids in length.
