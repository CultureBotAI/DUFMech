description: This domain is widely distributed in all domains of life and occur in stand-alone form and
  as C-terminal fusions to pantothenate kinase (PanK) in plants and animals. They are metal-dependent
  phosphatases involved in metabolic damage-control processes termed "damage pre-emption" or "housecleaning".
  S.cerevisiae Damage-control phosphatase YMR027W and the human orthologue Damage-control phosphatase
  ARMT1 (also known as C6orf211) are involved in response to DNA damage, a damage pre-emption function.
  Crystal structure of Damage-control phosphatase At2g17340 from Arabidopsis revealed a novel protein
  fold and several conserved residues coordinating a metal ion (probably Mg2+), which exhibits a high
  degree of conservation, suggesting that the metal-binding site is central for the function [[cite:PUB00088733]].
