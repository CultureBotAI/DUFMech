description: 'This domain is N-terminal in outer membrane protein SusF from Bacteroides thetaiotaomicron
  and similar sequences from bacteroidetes. SusF is a starch-binding protein organised into three tandem
  domains packed against each other: N-terminal (this entry), middle, and C-terminal. The last two, represented
  by [pfam:PF16411], are common to SusE and SusF. This domain forms a beta-sandwich that is similar in
  overall-fold and topology to several immunoglobulin superfamily domains found in cell adhesion proteins
  [[cite:PUB00062486]].'
