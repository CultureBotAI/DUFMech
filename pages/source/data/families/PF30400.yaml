description: This entry represents a C-terminal domain found in RHS (rearrangement hotspot) family proteins
  and related polymorphic toxin proteins. It is often associated with ADP-ribosyltransferase toxin domains
  ([pfam:PF03496]) and RHS repeats ([pfam:PF03527]). In Escherichia coli K12, the domain is found in YibJ,
  which may be a pseudogene. The family is predominantly found in Actinomycetota, particularly Pseudonocardiaceae,
  and also in Proteobacteria. The function of this domain remains to be determined. Shows similarity to
  SteB family [pfam:PF29776] and [pfam:PF14252].
