description: This entry represents the transactivation domain of Far upstream element-binding protein
  1/2 (FUBP1/2) which is found at the C-terminal. FUBP1 regulates MYC expression by binding to a single-stranded
  far-upstream element (FUSE) upstream of the MYC promoter. FUBP2, also known as KSRP (K homology-type
  splicing regulatory protein), is a single-strand-RNA binding protein that integrate different levels
  of gene expression and is required for proper immune response, lipid metabolism, cell fate decisions,
  and tissue regeneration [[cite:PUB00084324]]. This domain contains the tyrosine residues required for
  transactivation and adopts an alpha-helical configuration [[cite:PUB00159898]].
