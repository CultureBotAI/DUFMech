- graph_id: rsmh-lb-doubling-time
  title: RsmH-containing deletions prolong doubling time in LB
  scope: 'Kimura and Suzuki 2010 Table 1: BW25113 WT versus rsmH single and rsmH/rsmI double deletions
    at 37 C.'
  context: 'LB 1-ml cultures in 96-well format, OD600 measurements every 15 min. Three independent experiments;
    mean +/- SD doubling times in minutes: WT 20.4 +/- 0.3, rsmH 23.5 +/- 0.8, double deletion 26.3 +/-
    2.5. Other temperatures are retained in the ledger but not represented by these edges.'
  family_mapping: 313-aa K-12 RsmH P60390/b0082/JW0080, PF01795 5-310, with matching NP_414624.1 and BW25113
    WIA74303.1 references. Double deletion additionally removes RsmI; neither intervention isolates the
    Pfam interval.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: INDIRECT whole-genotype growth effects without adopted rescue. Longer doubling time means
    slower growth, not increased growth rate. The assay does not establish a cell-division-specific mechanism,
    lethality, universal essentiality or that reporter changes quantitatively explain growth. Results
    are not transferred to other taxa or media.
