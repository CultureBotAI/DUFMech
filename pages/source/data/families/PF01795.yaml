- graph_id: rsmh-purified-ribosome-methylation
  title: RsmH reconstitutes N4 methylation in a 30S assay
  scope: 'Kimura and Suzuki 2010 Figure 3: purified His-tagged E. coli RsmH, alone or jointly with the
    distinct RsmI enzyme, and substrates from BW25113-derived rsmH/rsmI double deletion cells.'
  context: 100-ul reactions at 37 C for 1 h; 100 mM NH4Cl, 20 mM HEPES-KOH pH 7.6, 10 mM magnesium acetate,
    6 mM beta-mercaptoethanol, 1 mM SAM when supplied. Methods specify 10 pmol recombinant proteins RsmH
    and/or RsmI; 5 pmol 30S or tightly coupled 70S versus 2.5 pmol naked 16S. AdoHcy treatment and dialysis
    precede assays; RNA extraction, RNase T1 digestion and LC/MS detect products.
  family_mapping: 313-aa K-12 RsmH P60390, b0082/JW0080, equals versioned MG1655 NP_414624.1 and parental
    BW25113 WIA74303.1; current PF01795 5-310. Old seed accession P18595 is demerged. ASKA pCA24N N-terminal
    His-tagged clone is not independently resequenced, and exact terminal additions remain unverified.
    RsmI is a separate enzyme, not a PF01795 alias.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: DIRECT means net purified-preparation effects, not atomic methyl transfer or isolated PF01795
    sufficiency. RsmH-alone product is low. The naked-RNA comparison changes both substrate state and
    dose; the displayed negative comparisons use both enzymes. No universal inactivity, methylation order,
    required enzyme-enzyme interaction, absolute detection limit or late assembly intermediate is established.
