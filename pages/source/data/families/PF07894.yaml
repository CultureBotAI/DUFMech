description: This entry represents the scaffolding anchor of CK1 domain (SACK1 domain) found in the FAM83
  family, which includes FAM83A-H. This domain was formerly known as DUF1669 and it has been identified
  as a CK1 binding domain, which allows the correct subcellular localisation of both FAM83 proteins and
  the CK1 binding partners and their function [[cite:PUB00155374]]. These proteins are involved in diverse
  biological processes, depending on their subcellular localisation and binding partners. FAM83A-H interact
  with the alpha and alpha-like isoforms of CK1, while FAM83A, B, E, and H also interact with the delta
  and epsilon isoforms of CK1. FAM83 members have function as intermediaries in EGFR/RAS signalling [[cite:PUB00084963]].
  FAM83D has been reported to localise to the mitotic spindle and interact with the chromokinesin kinesin
  family member 22 (KIF22, also called Kid) [[cite:PUB00124155]]. FAM83G, also known as PAWS1 interacts
  with the transcription factor SMAD1 and promotes the transcription of non-canonical bone morphogenetic
  protein (BMP) target genes [[cite:PUB00155375]]. FAM83H mutations have been associated with amelogenesis
  imperfecta [[cite:PUB00092186]].
