description: This family is found in eukaryotes. Family members include MRN complex-interacting protein
  (MRNIP), which plays a role in preventing the accumulation of damaged DNA in cells. It associates with
  the MRE11-RAD50-NBS1 (MRN) damage-sensing complex and is rapidly recruited to sites of DNA damage. Phosphorylation
  of a serine promotes nuclear localization of MRNIP [[cite:PUB00083234]].
