description: These proteins are related to the [pfam:PF00462] family. This entry includes several viral
  glutaredoxins and many related bacterial and eukaryotic proteins of unknown function. The best characterised
  member is G4L ([swissprot:P68460]) from Vaccinia virus (strain Western Reserve/WR) (VACV), which is
  necessary for virion morphogenesis and replication [[cite:PUB00020627]]. This is a cytoplasmic protein
  which functions as a shuttle in a redox pathway between membrane-associated E10R and L1R or F9L [[cite:PUB00020628]].
