description: Family member FomD is a protein encoded in the fosfomycin biosynthesis gene cluster [[cite:PUB00009885],[cite:PUB00100530]],
  which hydrolyses (S)-HPP-CMP to give (S)-HPP and CMP in the presence of Mn2 or Co2 [[cite:PUB00100530]].
  FomD also hydrolyses cytidylyl 2-hydroxyethylphosphonate (HEP-CMP), which is a biosynthetic intermediate
  before C-methylation. FomD structure revealed that it has a beta-barrel fold consisting of a large twisted
  antiparallel beta-sheet, a key feature of DUF402-containing proteins. The function of this domain is
  unknown. It has a Tyr residue which activates a water molecule to promote nucleophilic attack on the
  phosphorus atom of the phosphonate moiety [[cite:PUB00100530]]. This domain has also been found in Ntdp
  (nucleoside tri- and diphosphatase, also known as Sa1684) from Staphylococcus aureus [[cite:PUB00100531]].
