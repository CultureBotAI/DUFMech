description: This family is represented by Bacteriophage Mu, Gp27. It is probably the small subunit of
  terminase, which recognises viral DNA, binding to the packaging initiation site (pac) and regulates
  the ATPase activity of the terminase large subunit [[cite:PUB00097490]]. The characteristics of the
  protein distribution suggest prophage matches in addition to the phage matches.
