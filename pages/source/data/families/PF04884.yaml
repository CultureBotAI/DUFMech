description: In plants, this domain plays a role in auxin-transport, plant growth and development [[cite:PUB00057512],[cite:PUB00057513]]
  and appears to be expressed by all cells in the plant as well as in plastids. The family has been shown
  to play a role in vitamin B6 photo-protection and homoeostasis in plants [[cite:PUB00066759]]. In line
  with various literature findings, these proteins likely function as transporters and may be directly
  involved in the transport of one or more forms of the vitamin.
