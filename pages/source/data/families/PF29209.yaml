description: This entry represents the second domain found in uncharacterised proteins from spirochaetes,
  predominantly from Treponema species. The domain adopts a long alpha-helical hairpin structure and is
  approximately 110 residues in length. This domain is found between an N-terminal domain ([pfam:PF29208])
  and a C-terminal domain ([pfam:PF29207]) in proteins exclusive to spirochaetes. The function of this
  domain remains to be determined.
