description: This entry, previously known as DUF3732 represents the C-terminal region of Salmonella enterica
  Lamassu LmuB. Lamassu is a diverse family of defense systems that protect bacteria, including seventh-pandemic
  strains of Vibrio cholerae, against both plasmids and phage infection. During phage infection, Lamassu
  targets essential cellular processes, thereby halting phage propagation by terminating the infected
  host. This region forms extensive interactions with the LmuB N-terminal region [[cite:PUB00164006]].
