description: This entry represents the C-terminal region found in viral movement proteins (MP) of the
  30K type. This region has been suggested to be conserved in secondary structure in Ophioviruses Mps.
  It contains two parts, (i) a long segment with the potential to form an alpha-helix (alphaB), rich in
  charged residues, and (ii) a region highly variable in sequence downstream of alphaB. The C-terminal
  region corresponds to a protease domain which contains a strictly conserved DTG tripeptide also found
  in related aspartic retroviral proteases. This protease is required for autocleavage of the Movement
  Protein of ophioviruses in an N-terminal part that supports movement of viral particles through the
  plant, and this C-terminal part which retains protease activity [[cite:PUB00097831]]. Mutations in the
  aspartate residue in the core domain [pfam:PF17644] had an impact on cell to cell movement [[cite:PUB00091032]].
