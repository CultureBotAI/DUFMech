description: This entry represents the C-terminal in TamB proteins. TamB is an integral inner membrane
  protein that forms a complex - the translocation and assembly module or TAM [[cite:PUB00078749]] - with
  the outer membrane protein, TamA. TAM is responsible for the efficient secretion of the adhesin protein
  Ag43 in E.coli K-12 [[cite:PUB00076280]].
