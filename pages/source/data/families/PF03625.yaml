description: Domain is found in an undescribed set of proteins [[cite:PUB00016669]]. Normally occurs uniquely
  within a sequence, but is found as a tandem repeat ([swissprot:Q9X8B8]). Shows interesting phylogenetic
  distribution with majority of examples in bacteria and archaea, but it is also found in some fungal
