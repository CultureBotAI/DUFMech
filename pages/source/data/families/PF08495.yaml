description: The FIST N domain is a novel sensory domain, which is present in signal transduction proteins
  from Bacteria, Archaea and Eukarya. Chromosomal proximity of FIST-encoding genes to those coding for
  proteins involved in amino acid metabolism and transport suggest that FIST domains bind small ligands,
  such as amino acids [[cite:PUB00044261]].
