description: An ATP-grasp family that is present both as catalytically active and inactive versions. Contextual
  analysis suggests that it functions in a distinct peptide synthesis/modification system that additionally
  contains a transglutaminase, an NTN-hydrolase, the Alpha-E domain, and a transglutaminase fused N-terminal
  to a circularly permuted COOH-NH2 ligase. The inactive forms are often fused N-terminal to the Alpha-E
  domain [[cite:PUB00057486]].
