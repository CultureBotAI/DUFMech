description: This entry represents a family of uncharacterised archaeal proteins. They are predicted to
  have a structure composed of seven nearly orthogonally packed strands, four of which are located at
  the N-terminus and three at the C-terminus. The N- and C-terminal strands clamp to form a beta-sandwich.
  They are separated by a ~50 aa long disordered region which contains a repetitive SPY sequence motif.
