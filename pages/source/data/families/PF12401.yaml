description: This domain can be found at the N terminus of FHA domain-containing protein Fha from Mycobacterium
  tuberculosis. The FHA (Fork Head Associated) domain is a phosphopeptide- specific binding domain that
  enables the protein to specifically bind to sequences containing phosphothreonine. FhaA is one of the
  major substrates of Ser/Thr protein kinases (STPK) [[cite:PUB00059641]] and plays a role in the regulation
  of cell growth and peptidoglycan synthesis by binding to MviN. It may inhibit the late stages of peptidoglycan
  synthesis [[cite:PUB00057590]].
