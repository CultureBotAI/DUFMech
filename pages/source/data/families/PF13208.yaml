description: The TerB_N domain is found N-terminal to TerB, and TerB_C containing proteins [[cite:PUB00066658]].
  It has a predominantly alpha-helical structure and contains an absolutely conserved glutamate [[cite:PUB00066658]].
  The presence of a conserved acidic residue suggests that it might chelate metal like TerB [[cite:PUB00066658]].
  These proteins occur in a two-gene operon containing an AAA+ ATPase and SF-II DNA helicase suggesting
  a role in stress-response or phage defence [[cite:PUB00066658]].
