description: This entry includes MYG1 exonuclease from human and its orthologues. MYG1 is a 3'-5' exonuclease
  which cleaves in situ on specific transcripts in both nucleus and mitochondrion. It is involved in regulating
  spatially segregated organellar RNA processing, acting as a coordinator of nucleo-mitochondrial crosstalk
  [[cite:PUB00155300]]. In nucleolus, processes pre-ribosomal RNA involved in ribosome assembly and alters
  cytoplasmic translation. In mitochondrial matrix, it processes 3'-termini of the mito-ribosomal and
  messenger RNAs and controls translation of mitochondrial proteins [[cite:PUB00155300]]. Overexpression
  of MYG1 has been associated with the autoimmune disorder vitiligo, suggesting that MYG1 may play some
  role in human innate immunity [[cite:PUB00155301]]. Studies in yeast suggested a potential antiviral
  function of MYG1 [[cite:PUB00155302]].
