description: This family includes spermatogenesis-associated serine-rich protein 2 (SPATS2) and SPATS2-like
  proteins from mammals. SPATS2 is involved in spermatogenesis and likely to be a cytoplasmic RNA-binding
  protein [[cite:PUB00101497],[cite:PUB00101498]]. SPATS2 is highly expressed in hepatocellular carcinoma
  (HCC) and may function as an oncogene. It constitutes a novel diagnostic prognostic marker in liver
  cancer and a potential therapeutic target for the treatment of HCC [[cite:PUB00101499]].
