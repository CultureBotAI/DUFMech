description: This domain is found at the N-terminal of the putative transcriptional regulator TbsP from
  Halobacterium volcanii ([swissprot:D4GXF9], also known as HVO_2861) and similar sequences predominantly
  found in Halobacteria. TbsP is required for adhesion to abiotic surfaces (i.e., biofilm formation) and
  maintains wild-type cell morphology and motility. This domain shows weak structural similarity with
  the DNA -binding protein TrmBL2 of P. furiosus ([pfam:PF11495]) [[cite:PUB00153356]].
