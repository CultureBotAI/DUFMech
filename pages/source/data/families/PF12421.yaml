description: This entry represents the C-terminal receptor binding domain of Tip attachment protein J
  from Escherichia phage lambda (GpJ) and similar bacterial and viral proteins. J attaches the virion
  to the host receptor LamB, inducing viral DNA ejection. This domain, which determines the host specificity
  of the phage, shows an immunoglobulin-like fold [[cite:PUB00155963],[cite:PUB00109155]]. Many of the
  proteins in this entry are annotated as fibronectin type III. This domain was previously known as DUF3672
  and is normally found associated with [pfam:PF09327] and [pfam:PF13550].
