description: This is a bacterial family of proteins with unknown function. AbiGi is a family of putative
  type IV toxin-antitoxin system antitoxins. The AbiG abortive phage resistance system affects lactococcal
  bacteriophages phiP335 and phiQ30 but not the other P335 phage species. AbiGii toxin appears to confer
  resistance to phages by a mechanism of abortive infection that acts by interfering with phage RNA synthesis
  [[cite:PUB00016885]]. The cognate toxin is found in [pfam:PF16873].
