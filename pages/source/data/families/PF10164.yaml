description: This is a highly conserved family of proteins which contains three pairs of cysteine residues
  within a length of 42 amino acids and is rich in proline residues towards the N-terminus. It includes
  a membrane protein that has been found to be highly expressed in the mouse brain and consequently, several
  members have been assigned as brain protein I3 (Bri3) [[cite:PUB00083183]]. Their function is unknown
  but they appear to play a role in TNF-induced cell death [[cite:PUB00095376]].
