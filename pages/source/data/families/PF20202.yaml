description: This domain is functionally uncharacterised and is found in proteins from bacteria and archaea.
  This domain is found in Protein LicC (swiss:P14183), a CTP:phosphocholine cytidylyltransferase involved
  in LPS biosynthesis. Members containing this domain are annotated as nucleotidyltransferases. It is
  probable that this domain has a Rossmann like fold.
