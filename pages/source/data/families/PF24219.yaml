description: This entry represents a family of uncharacterized proteins found in bacteriophages. The function
  of this protein family is currently unknown. The family appears to be conserved across various phage
  species that infect Escherichia coli and related bacteria. The family includes members from Phage T2,
  T4 and T6. Members of this family are typically short proteins of around 60-67 amino acids in length.
  Bacteriophage T4 contains four proteins that belong to this family. The structure of these proteins
  is predicted to be composed of two alpha helices that pack together. Structure prediction suggests these
  proteins may homodimerise (iPTM=0.83).
