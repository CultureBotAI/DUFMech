description: This domain is found in Antitoxin SocA from Caulobacter vibrioides and in similar proteins
  widespread across bacteria, archaea and tailed bacteriophages. SocA is the antitoxin component of an
  atypical type II toxin-antitoxin (TA) system which neutralises the toxic activity of toxin SocB by acting
  as an adapter to promote its degradation by the protease ClpXP [[cite:PUB00100422],[cite:PUB00100160]].
