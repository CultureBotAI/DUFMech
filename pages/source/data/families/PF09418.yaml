description: This entry represents a novel family of non-canonical E2 ubiquitin-conjugating enzymes that
  lack the typical HPN motif found in other E2 enzymes. The domain contains a highly conserved catalytic
  cysteine (C572 in PF3D7_0811400) that forms a thioester bond with ubiquitin. This was experimentally
  validated through mutational analysis and biochemical assays [[cite:PUB00160741]]. The domain is found
  in the C-terminal region of proteins, while the N-terminal region contains coiled helices involved in
  protein-protein interactions with other ubiquitin pathway components like Rbx1. The domain represents
  a new class of E2 enzymes particularly found in Apicomplexan parasites.
