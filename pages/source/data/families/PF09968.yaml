description: This domain is found in Uncharacterized protein MJ0754 from Methanocaldococcus jannaschii
  and similar proteins from bacteria and archaea. MJ0754 adopts a dimeric assembly, with each monomer
  consisting of six alpha-helices [[cite:PUB00100681]]. It is a member of a broad superfamily of ferritin-like
  diiron-carboxylate proteins whose function is unknown. The conserved residues of a diiron centre are
  present within the putative active site.
