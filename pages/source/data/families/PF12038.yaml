description: 'This is the N-terminal domain of tRNA-queuosine alpha-mannosyltransferase (QTMAN, also known
  as GTDC1) from animals. QTMAN is a glycosyltransferase that specifically catalyses mannosylation of
  cytoplasmic tRNA(Asp) modified with queuosine at position 34 (queuosine(34)) to form mannosyl-queuosine(34)
  [[cite:PUB00153407]]. Mannosylation of queuosine(34) in tRNA(Asp) is required to slow-down elongation
  at cognate codons GAC and GAU, thereby regulating protein translation [[cite:PUB00153407]]. This domain
  is about 170 amino acids in length and adopts a Rossmann-fold. This domain is found associated with
  [pfam:PF00534] found at the C-terminal. This domain has two conserved sequence motifs: HENQ and FNS
  and it also has a single completely conserved residue S that may be functionally important. This domain
  is also found in uncharacterised bacterial sequences.'
