description: This family consists of several highly related Baculovirus proteins and includes Autographa
  californica multiple nucleopolyhedrovirus (AcMNPV) protein AC81, which is required for nucleocapsid
  envelopment. Ac81 contains a functional hydrophobic transmembrane (TM) domain, whose deletion resulted
  in a phenotype similar to that of Ac81 knockout [[cite:PUB00082599]].
