description: This domain is found at the N-terminal end of Spore protein YkvP from Bacillus subtilis and
  similar sequences from firmicutes. YkvP is intrinsic to mature spores. The conserved motif in YkvP is
  thought to function as a kind of signal sequence involved in protein assembly to forespores during sporulation
  [[cite:PUB00062761]].
