description: CTNNBL is a family of eukaryotic nuclear proteins of the catenin-beta-like 1 type that contain
  an armadillo motif. A human nuclear protein with this domain ([swissprot:Q8WYA6]) is thought to have
  a role in apoptosis [[cite:PUB00017164]]. The interaction of CTNNBL1 with its known partners (the Prp19-CDC5L
  complex and AID) is mediated by recognition of NLS (nuclear localisation signal) motifs. The RNA-splicing
  factor Prp31 is also an interactor, with recognition also occurring through the NLS. CTNNBL1 uses its
  central armadillo (ARM) domain to bind NLS-containing partners [[cite:PUB00110056],[cite:PUB00110057]].
