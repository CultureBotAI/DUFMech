description: This domain of unknown function is found in uncharacterised proteins from bacteria and archaea.
  This domain is about 75 amino acids in length and it contains the conserved motif CxxxGxCP. Towards
  the C-terminal there are two conserved residues, a Glycine and an Aspartate. Some of the proteins containing
  this domain also have an ankyrin repeat-containing region. This domain is related to the Emfourin proteins
  [pfam:PF20242] and may have a related peptidase inhibitor function.
