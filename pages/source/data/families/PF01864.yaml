description: CDP-archaeol synthase functions in the archaeal lipid biosynthetic pathway. It catalyses
  the transfer of the nucleotide to its specific archaeal lipid substrate, leading to the formation of
  a CDP-activated precursor (CDP-archaeol) to which polar head groups are attached [[cite:PUB00076744]].
  Bacterial members of this family are uncharacterized.
