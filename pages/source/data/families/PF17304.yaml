description: This entry includes Mitochondrial outer membrane protein OM14 from yeast and similar fungal
  sequences. OM14 is a mitochondrial membrane receptor for cytosolic ribosomes. It interacts with the
  nascent chain-associated complex (NAC) bound to ribosomes, contributing to co-translational mitochondrial
  import [[cite:PUB00155773],[cite:PUB00089691]]. This entry represents two transmembrane found at the
  C-terminal of OM14.
