description: Brr6_like_C_C is the highly conserved C-terminal region of a group of proteins found in fungi.
  It carries four highly conserved cysteine residues. It is suggested that members of the family interact
  with each other via di-sulfide bridges to form a complex which is involved in nucleocytoplasmic transport
  [[cite:PUB00044174]]. Brr6 in yeast is an essential integral membrane protein of the NE-ER, wit two
  predicted transmembrane domains, and is a dosage suppressor of Apq12, [pfam:PF12716] [[cite:PUB00055994]].
