description: SmAKAP is a small membrane-bound PKA-RI-specific protein kinase A-anchoring protein, referred
  to as small membrane-AKAP. It is probably tethered to the plasma membrane most through a dual acylation
  of its N-terminal Met-Gly-Cys- motif (myristoylation and palmitoylation, respectively). It specifically
  targets PKA-RI isoforms to the plasma membrane. It localizes to plasma membranes, is enriched at cell-cell
  junctions and associates with filopodia [[cite:PUB00067440]].
