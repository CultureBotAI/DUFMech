description: This family of proteins is predominantly found in Saccharomycetales, including YNR034W-A
  (also known as Ego4) and YCR075W-A (Ego2) from Saccharomyces cerevisiae. Ego2 is a component of the
  yeast EGO complex (EGOC), which is responsible for the amino acid-dependent activation of the target
  of rapamycin complex 1 (TORC1). Ego2 adopts a Roadblock domain fold that consists of a central core
  beta-sheet of five anti-parallel beta-strands flanked by a long alpha-helix on the bottom side. Ego4
  shows a similar configuration. It interacts with the GTPase Gtr2, but its specific function remains
  unknown [[cite:PUB00100978],[cite:PUB00100979]].
