description: This entry represents a domain found at the C-terminal of bacterial proteins, including N,N-dimethylformamidase
  beta (DMFA2) subunit from Paracoccus [[cite:PUB00101281]], the large subunit of dimethylformamidase
  (DMFase), an enzyme containing a Fe+3 ion in the active site that catalyses the hydrolytic cleavage
  of the amide bond in N,N-dimethyl formamide. This domain is described as domain III, which adopts an
  alpha/beta/alpha fold, with five beta-strands that are parallel and sandwiched between alpha-helices.
  This domain is also found in some uncharacterised fungal sequences.
