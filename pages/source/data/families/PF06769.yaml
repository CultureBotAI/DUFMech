description: YoeB_toxin is a family of bacterial toxins that forms one component of the type II toxin-antitoxin
  system in E. coli whose antitoxin is represented by YefM, found in [pfam:PF02604]. The plasmid encoded
  Axe-Txe proteins in Enterococcus faecium act as an antitoxin-toxin pair. When the plasmid is lost, the
  antitoxin is degraded relatively quickly by host enzymes. This allows the toxin to interact with its
  intracellular target, thus killing the cell or impeding cell growth [[cite:PUB00015566]]. These toxins
  are highly potent protein synthesis inhibitors, specifically blocking the initiation of translation.
  In the case of YoeB, it binds to the 50 S ribosomal subunit in 70 S ribosomes and interacts with the
  A site leading to mRNA cleavage at this site. As a result, the 3'-end portion of the mRNA is released
  from ribosomes, and translation initiation is effectively inhibited [[cite:PUB00075545],[cite:PUB00075546]].
