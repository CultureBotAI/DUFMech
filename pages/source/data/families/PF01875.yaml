description: This family contains members from all branches of life. The molecular function of this protein
  is unknown, but Memo (mediator of ErbB2-driven cell motility) a human protein is included in this family
  [[cite:PUB00044702]]. It has been suggested that Memo controls cell migration by relaying extracellular
  chemotactic signals to the microtubule cytoskeleton [[cite:PUB00044702]].
