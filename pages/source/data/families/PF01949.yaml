description: This family includes Endonuclease dU from Archaeoglobus fulgidus (Endo_dU, AF_1433) and similar
  proteins mainly found in archaea. Sequence and structure analysis to identify RNase H-like superfamily
  members, has clustered this family in endonuclease Clade V, thus suggesting endonuclease activity of
  these proteins [[cite:PUB00098031]]. Endo_dU, which cleave the 3'-side of deoxyuridine (dU) on DNA substrates,
  shows a typical RNase H-like fold, with a core structure of five beta-strands and three alpha-helices.
  It may participate in DNA repair [[cite:PUB00160071]]. This family was formerly known as DUF99.
