description: Members of this protein family are essentially universal in the class Clostidia and therefore
  highly abundant in the human gut microbiome. This short peptide is designated SCIFF, for Six Cysteines
  in Forty-Five residues. It is a presumed ribosomal natural product precursor, always found associated
  with a yet-uncharacterised radical SAM protein that resembles other peptide modification radical SAM
  enzymes and is designated SCIFF radical SAM maturase [[cite:PUB00055953]].
