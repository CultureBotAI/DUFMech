description: This family includes SRP-independent targeting protein 2 (SND2) from yeast and transmembrane
  protein 208 (TMEM208) from mammals. Both are localized to the endoplasmic reticulum (ER) [[cite:PUB00083911],[cite:PUB00083915]].
  SND2 works together with SND1 and SND3 in an alternative targeting route to the ER [[cite:PUB00083911]].
  TMEM208 regulates both ER stress and autophagy. It contains three predicted transmembrane regions [[cite:PUB00083915]].
  SND2 also known as Env10 in Saccharomyces cerevisiae, and its homologue as Mug69 in Schizosaccharomyces
  pombe. They were identified as proteins involved in vacuolar processing and morphology [[cite:PUB00066964]]
  and meiosis [[cite:PUB00044889]], respectively.
