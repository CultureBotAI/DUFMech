  scope: WT yeast Dus2 acting on the reported synthetic pre-tRNA-Leu preparation in Figure 3 and oxidative-half-reaction
    Results. No nucleotide position is independently assigned by this endpoint.
  context: Dithionite-prereduced enzyme reacts anaerobically at 25 C in the pH-7.5 HEPES/NaCl/MgCl2/glycerol
    buffer. Results give 60 uM enzyme and 700 uM RNA, whereas the caption gives 35 uM enzyme. Flavin reoxidation
