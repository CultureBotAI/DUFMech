- graph_id: dus2-nadph-flavin-reduction
  title: NADPH reduces the flavin of purified yeast Dus2
  scope: Recombinant WT Saccharomyces cerevisiae Dus2 in Rider 2009 Figure 2 and reductive-half-reaction
    Results. This is an anaerobic purified-protein assay, not cellular RNA modification.
  context: Mix 15 uM oxidized enzyme with anaerobic NADPH concentration series at 4 C in 100 mM HEPES
    pH 7.5, 100 mM NaCl, 10 mM MgCl2 and 10% glycerol. Stopped-flow absorbance at 450 nm measures flavin
    reduction. DTT is removed immediately before assays.
  family_mapping: P53720/DUS2_YEAST is SMM1/DUS2/YNR015W, 384 aa, sequence version 1, with PF01207 at
    32-352. UniProt and InterPro sequences agree. The study uses the supplied pEfx-4b yeast DUS2 plasmid
    and BL21(DE3) expression, cobalt-affinity and DEAE purification. Exact historical tag junctions and
    clone sequence remain unverified.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:4932
  limitations: Minor slower spectral phases may reflect damaged protein. The observed reduction does not
    independently establish the proposed NADP dissociation rate or every hydride-transfer microstep. FMN
    in this preparation is not a claim that all family members have identical cofactor or substrate behavior.
