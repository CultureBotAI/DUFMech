- graph_id: dus2-ecoli-trna-aerobic-dihydrouridine-loss
  title: Aerobic yeast Dus2 treatment lowers dihydrouridine in bulk bacterial tRNA
  scope: Recombinant yeast Dus2 with bulk E. coli tRNA in the 18-h reverse-reaction experiment. This is
    a mixed-species in-vitro endpoint.
  context: Treat 90 uM bulk E. coli tRNA with 40 uM Dus2 aerobically for 18 h and assay dihydrouridine
    content. General kinetics default to 4 C, but the endpoint paragraph does not explicitly restate temperature.
    Do not borrow the anaerobic stopped-flow conditions as an exact endpoint recipe.
  family_mapping: The enzyme maps to P53720 with PF01207 32-352; the bacterial RNA mixture is a separate
    substrate whose strain and individual tRNA composition are not resolved. It is not a pure yeast physiological
    system.
  scope_status: MECHANISTIC
  limitations: The measured content decreases but is not eliminated. The assay does not identify each
    affected tRNA or nucleotide, measure cellular reverse flux, or independently characterize every oxidation
    product. Oxygen-supported endpoint turnover is distinct from the short anaerobic spectral assay.
