description: This family includes EarA from Methanococcus maripaludis (MMP1718, [swissprot:Q6LWJ1]) and
  similar sequences from archaea. EarA is a transcriptional activator that directly regulates the fla
  operon, which contains genes involved in archaella formation [[cite:PUB00158985],[cite:PUB00158986]].
  Proteins in this family possess a winged helix DNA -binding domain.
