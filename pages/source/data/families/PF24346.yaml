description: This domain is found in multiple copies in a number of bacterial proteins. It is closely
  related to the CLIPPER domain ([pfam:PF01345]) and therefore it was named CLIPPER 2 (Cross-Linked IsoPeptide
  Protein in the Extracellular Region 2) [[cite:PUB00163642]]. Similarly to CLIPPER, this domain contains
  a conserved N-terminal lysine and a C-terminal asparagine with central aspartate/glutamate residues
  suggesting that it may contain an isopeptide bond. In addition, it contains a semi-conserved TNTGNV
  sequence motif in which a highly conserved asparagine probably plays a role in stabilising the rod structure
  formed by repetitive copies of this domain. Both CLIPPER and CLIPPER_2 domains are frequently found
  in tandem within surface polypeptides of bacteria and archaea, often alternating between the two families
  in tandem.
