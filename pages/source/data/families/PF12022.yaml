description: The COG complex comprises eight proteins (COG1-8) and plays critical roles in Golgi structure
  and function [[cite:PUB00012274]]. It is necessary for retrograde trafficking in the Golgi apparatus
  and for protein glycosylation [[cite:PUB00097774]]. COG complex, together with exocyst, Golgi-associated
  retrograde protein (GARP) and Dsl1 complexes, is a member of the CATHR (complexes associated with tethering
  containing helical rods) family sharing an evolutionary origin and structural features [[cite:PUB00100047]].
  This domain represents the C-terminal of COG complex subunit 2 and consists of a conserved alpha-helical
  bundle. In Arabidopsis, COG2 forms a complex with FPP3/VETH1 and FPP2/VETH2 and ensures the correct
  secondary cell wall (SCW) deposition pattern by recruiting exocyst components to cortical microtubules
  in xylem cells during secondary cell wall deposition [[cite:PUB00097774]].
