description: This entry represents the Serine/threonine-protein phosphatase 4 regulatory subunit 3 (also
  known as SMEK homologue) PP4R3, which forms a complex with the phosphatase 4 catalytic subunit (PP4c),
  localising it to the DNA damage repair machinery [[cite:PUB00101025],[cite:PUB00035452],[cite:PUB00101024],[cite:PUB00101026]]
  and regulates its activity. PP4c is involved in developmental progression, chemotaxis, expression of
  stress response genes and cell movement. These proteins contain an N-terminal EVH1 domain and this alpha
  solenoid region.
