description: This family of presumed domains is found in bacteria and archaea. Proteins in this family
  are typically between 152 and 220 amino acids in length. In some of the proteins this domain is associated
  with an N-terminal HTH domain, suggesting that they are transcriptional regulators. This suggests that
  this may be a previously unidentified ligand binding domain.
