description: This family of proteins is functionally uncharacterised. This family of proteins is found
  in cyanobacteria. Proteins in this family are approximately 90 amino acids in length. A member of this
  family, the ssr1528 gene was found to be regulated by an sRNA NsiR4 [[cite:PUB00088099]]. In addition
  the expression of that gene was repressed under conditions of nitrogen depletion suggesting it may have
  a role related to cellular nitrogen status [[cite:PUB00088099]].
