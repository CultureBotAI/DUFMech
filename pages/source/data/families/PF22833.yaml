description: This entry represents a domain located C-terminal to [pfam:PF15025] in a family of eukaryotic
  proteins, including the human uncharacterised protein C5orf34, which has been reported to be correlated
  with an unfavourable prognosis of patients from a variety of human malignancies [[cite:PUB00154384]].
  This domain is predicted to show an alpha-beta structure with high structural similarity to a polo box
  [[cite:PUB00152793]].
