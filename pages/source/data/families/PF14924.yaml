description: This domain is found at the N-terminal of MAP10 (Microtubule associated protein 10, also
  known as MTR120/KIAA1383) from mammals. There are two completely conserved G residues that may be functionally
  important. It adopts a C2-like fold. MAP10 localises to stabilised MTs during interphase and to the
  mitotic apparatus during mitosis. It may promote microtubule stability and ensures normal progress of
  cytokinesis [[cite:PUB00068314]].
