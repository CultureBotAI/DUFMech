causal_graphs:
- graph_id: cthtpt1-terminal-phosphate-removal
  title: CthTpt1-dependent RNA terminal phosphate removal
  scope: Purified full-length His6-CthTpt1 (ABN54255.1) from Clostridium thermocellum ATCC 27405, expressed
    in E. coli.
  context: Separate 10-mer AUCACGCUUA substrates bearing a terminal 2'- or 3'-phosphate; 0.2 uM RNA, 0.5
    uM enzyme, 1 mM NAD+, 100 mM Tris-HCl pH 7.5, 37 C, 30 minutes.
  family_mapping: A3DJX6, kptA/Cthe_3059, sequence version 1, 182 residues; PF01885 spans reference residues
    8-172. Current species name is Acetivibrio thermocellus.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:203119
  limitations: Terminal removal is approximately stoichiometric under these conditions, not demonstrated
    multiple-turnover catalysis. PAGE product assignment uses T4 Pnkp and CIP controls. Intermediate chemistry,
    endogenous substrates and domain-only sufficiency are not established here; tested Runella and human
    homologs lack equivalent terminal activity.
