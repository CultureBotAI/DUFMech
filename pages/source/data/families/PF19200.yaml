description: This domain represents the N-terminal domain of 6-phospho-N-acetylmuramidase (MupG) from
  Staphylococcus aureus [[cite:PUB00097906]], also found in putative phospho sugar glycosidases from Gram-negative
  and -positive species, but mainly firmicutes. MupG [[cite:PUB00097906]], specifically cleaves MurNAc
  6P-GlcNAc, a product of cell wall turnover, into the sugars MurNAc 6P and GlcNAc, involved in cell wall
  turnover and recycling. Since some species, for example Lactobacillus plantarum, possess several putative
  paralogs, the substrate specificity of the proteins containing this domain may not be limited to cell
  wall sugars, but may include phosphorylated disaccharides in general. Most of these proteins appear
  to consist of two structural subdomains, as it can be seen in the two available crystal structures of
  Enterococcus faecalis (PDB:2p0o) and Bacillus cereus (PDB:1X7F). This entry is the larger N-terminal
  domain that constitutes a TIM-barrel like structure and the C-terminal domain is similar to the cyclophilin
  family. It should be noted that some proteins lack the C-terminal domain.
