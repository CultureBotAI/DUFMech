description: This domain is found on the C-terminal of large number of uncharacterized proteins with broad
  phylogenetic distribution, which includes human gut Bacteroides, g-proteobacteria (Vibrio and Shewanella)
  and also spirochetes from Leptospira genus. Solved structure of Bacteroides ovatus protein BACOVA_00967
  shows a large beta barrel with an immunoglobulin-like fold and significant structural similarity to
  collagen-binding domain of adhesin from S. aureus (1amx), but with several additional long loops and
  secondary structure elements. Function of this domain is unknown.
