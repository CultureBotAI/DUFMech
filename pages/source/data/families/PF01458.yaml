- graph_id: ecoli-sufb-substitutions-bound-sulfur
  title: C254A and C405A lower sulfur retained by the SufBCD complex
  scope: Separately purified E. coli SufBCD variants in Yuda 2017 Figure 4c, not residue-resolved sulfur
    occupancy or a complete Fe-S synthesis pathway.
  context: React 10 uM SufBCD, 0.5 uM each SufS/SufE and 2 mM L-cysteine in 125 ul of 50 mM Tris-HCl pH
    7.8, 150 mM NaCl at 30 C for 3 h without DTT. Remove smaller components using a 100-kDa ultrafilter,
    normalize retained complex by A280, then release bound sulfur with 2 mM DTT and measure methylene
    blue at 670 nm. Means/SD derive from at least three measurements.
  family_mapping: P77522 SufB has PF01458 225-466, encompassing both C254 and C405. C254A and C405A primer
    pairs encode only their intended local substitutions relative to the current sequence. Intact SufBCD
    and required SufS/SufE partners were assayed, not the isolated family region.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: WT retains 4.8 +/- 0.9 sulfur atoms per complex, C405A 1.0 +/- 0.1, and C254A has no detected
    signal; the detection limit is unspecified. Retained sulfur is an operational complex-level endpoint,
    not proof of every attachment site, a C254-to-C405 transfer trajectory, FADH2 chemistry or an assembled
    Fe-S cluster. SufD C358A retains roughly WT sulfur and is not represented as another loss mutation.
