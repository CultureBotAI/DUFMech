- graph_id: ecoli-sufb-substitutions-sufse-output
  title: SufB substitutions reduce stimulation of the SufSE sulfide-output assay
  scope: Purified E. coli SufBCD complexes carrying separate C254A, Q285A or W287A SufB substitutions
    in Yuda 2017 Figure 4a; not isolated PF01458 or a stand-alone SufB desulfurase.
  context: Compare each variant with its panel's WT at 3 uM SufBCD, with 0.5 uM SufS, 2 uM SufE, 2 mM
    L-cysteine and 2 mM DTT in 25 mM Tris-HCl pH 7.8, 150 mM NaCl, 30 C for 10 min. Released sulfide is
    detected as methylene blue and activity normalized per mg SufS. pGSO164-derived complexes were expressed
    in YT2512 and chromatographically purified; SufS and untagged SufE were separately supplied.
  family_mapping: E. coli K12 SufB is UniProtKB:P77522, 495 aa, sequence version 2, with PF01458 at 225-466.
    C254, Q285 and W287 lie inside it. Partner SufD P77689 has the homologous family interval 166-393
    but does not inherit the SufB-specific substitution effect. Table S2 C254A primers agree locally with
    the reference; full historical clones and junctions remain unverified.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:83333
  limitations: C254A removes added-complex stimulation, not basal SufSE output. Q285A/W287A retain stimulation.
    This net purified-system readout does not directly track persulfide chemistry or assign the chemical
    step responsible. S3 supports comparable complex assembly and Figure 4b retains SufE interaction,
    but neither proves identical local folding. Means and SD reflect at least three measurements, not
    established independent protein batches.
