description: Two structures have been solved form this DUF, PDB:4mjf and PDB:3sbu. TOPSAN records that
  both proteins are the only structural representatives of Pfam PF14254, DUF4348. There are no other significant
  hits in FFAS. DUF4348 has ~200 proteins, all from Bacteroidetes, and all with a single domain architecture
  with just one DUF4348 domain. There appears to be a possible gene duplication in the protein as the
  N-terminal domain (approx residues 25-174) and C-terminal domain (approx residues 175-286) superimpose
  quite well with ~1.9A r.m.s.d. and ~30% sequence identity.
