description: Anamorsin, subsequently named CIAPIN1 for cytokine-induced anti-apoptosis inhibitor 1, in
  humans is the homologue of yeast Dre2, a conserved soluble eukaryotic Fe-S cluster protein, that functions
  in cytosolic Fe-S protein biogenesis. It is found in both the cytoplasm and in the mitochondrial intermembrane
  space (IMS) [[cite:PUB00055951]]. CIAPIN1 is found to be up-regulated in hepatocellular cancer, is considered
  to be a downstream effector of the receptor tyrosine kinase-Ras signalling pathway, and is essential
  in mouse definitive haematopoiesis [[cite:PUB00055952]]. Dre2 has been found to interact with the yeast
  reductase Tah18, forming a tight cytosolic complex implicated in the response to high levels of oxidative
  stress [[cite:PUB00109169]]. These proteins consist of two domains, the N-terminal well-folded one,
  with a S-adenosylmethionine methyltransferase-like fold and the C-terminal more flexible domain, represented
  in this entry, which contains two highly conserved cysteine rich motifs that bind Fe-S clusters [[cite:PUB00067100],[cite:PUB00056284]].
