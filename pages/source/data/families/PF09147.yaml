description: This domain is found in the N-terminal of carbapenam-3-carboxylate synthase (carA), and is
  composed of two antiparallel six-stranded beta-sheets that form a sandwich, flanked on each side by
  two alpha-helices [[cite:PUB00022497]]. carA is involved in the biosynthesis of carbapenam-3-carboxylate,
  a beta-lactam antibiotic of the carbapenem class. It catalyses the ATP-dependent formation of (3S,5S)-carbapenam-3-carboxylate
  from (2S,5S)-5-carboxymethylproline [[cite:PUB00069787],[cite:PUB00069788],[cite:PUB00069789]].
