description: This entry represents the Hobbit protein from Drosophila melanogaster and its homologues
  such as the mitochondrial FMP27 protein from yeast (also known as Hob1) and BLTP2 (also known as KIAA0100)
  from human. These proteins are localized to endoplasmic reticulum-plasma membrane (ER-PM) contact sites
  described as conserved lipid-binding proteins. They are tube-forming transport proteins which bind to
  phosphatidylinositols and affect phosphatidylinositol-4,5-bisphosphate (PtdIns-4,5-P2) distribution
  [[cite:PUB00101862],[cite:PUB00101860],[cite:PUB00101861]]. They belong to the repeating beta-groove
  (RBG) superfamily together with VPS13, ATG2, SHIP164, Csf1/BLTP1 proteins, which are all conserved lipid
  transfer proteins containing long hydrophobic grooves [[cite:PUB00101860],[cite:PUB00101861]]. They
  all share the same structure consisting of multiple repeating modules comprising five beta-sheets followed
  by a loop.
