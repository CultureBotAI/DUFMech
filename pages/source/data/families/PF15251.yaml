description: This entry represents the Telomere attrition and p53 response 1 protein (TAPR1) from eukaryotes,
  including TAPR1 from human (also known as C16orf72/HAPSTR1), which is a multistress-responsive protein
  that functions as a negative regulator of TP53/P53 in the cellular response to telomere erosion and
  probably also DNA damage. It may attenuate p53/TP53 activation through the E3 ubiquitin ligase HUWE1
  which also promotes TAPR1's degradation [[cite:PUB00100199],[cite:PUB00101217]]. This family also includes
  uncharacterised proteins from fungi, such as YJR056C from yeast.
