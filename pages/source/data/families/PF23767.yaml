description: This protein domain is found in a variety of staphylococcus phage proteins. It was shown
  to be the antitoxin TscA of a toxin-antitoxin system [[cite:PUB00159162]], with TscT being the toxin
  [pfam:PF07342]. It is composed of two alpha helices and a beta hairpin and shows weak structural similarity
  to archaeal prefoldins. Members of this family form a confident homodimer structure with AlphaFold 3
  (A0A0H3JR29 iPTM=0.81).
