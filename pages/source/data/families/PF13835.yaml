description: This family includes Wadjet protein JetB, a component of anti plasmid transformation system
  Wadjet type I, composed of JetA, JetB, JetC and JetD. Expression of Wadjet type I in B.subtilis (strain
  BEST7003) reduces the transformation efficiency of plasmid pHCMC05 [[cite:PUB00097806]]. The Wadjet
  proteins JetA, JetB, and JetC show sequence similarity to subunits of the bacterial condensin complex
  MukBEF, a member of the SMCs complex superfamily. The overall structure of JetB and its interaction
  with JetA is very similar to that of MukE, and the overall positioning of the JetB dimer with respect
  to JetA is also similar to the MukF-MukE complex [[cite:PUB00163953]]. JetB is composed of two winged
  helix domains.
