description: This domain is found at the N-terminal of HFX_2341 from Haloferax mediterranei and similar
  archaeal proteins. HFX_2341 is a global regulator involved in cas gene regulation. This domain contains
  a conserved sequence motif HxxPxxG and a conserved asparagine residue. It is often found associated
  with [pfam:PF22665].
