description: This entry represents a family of small uncharacterised proteins of approximately 140 residues
  found exclusively in cyanobacteria. The family is widely distributed across the phylum, including members
  of the orders Nostocales, Oscillatoriales, Synechococcales, and Chroococcales. Transcriptomic analysis
  of Trichodesmium erythraeum identified the homologue Tery_1686 among genes responsive to iron availability
  [[cite:PUB00163730]]. The function of this family remains to be determined.
