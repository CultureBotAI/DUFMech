description: This entry represents a domain found at the N-terminal end of FlmR from Flagellimonas meridianipacifica
  (Swiss A0A2T0MFS9), OhkR from Ohtaekwangia koreensis (Swiss A0A1T5M544) and similar uncharacterised
  proteins found in animals and bacteria. FlmR and OhkR have been reported to be peptide arginases that
  modify Arg residues to ornithine in bioactive RiPP peptides [[cite:PUB00162570]]. This domain is predicted
  to adopt an alpha/beta arginase-like fold.
