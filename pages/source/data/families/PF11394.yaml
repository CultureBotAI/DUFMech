description: This entry represents the N-terminal domain of Type VI lipase adapter protein Tla3, an adapter
  protein that targets and loads the Tle3 toxin onto the H2 type VI secretion system (H2-T6SS) machinery
  through an interaction with the TTR domain of VgrG2b [[cite:PUB00100136]] and it seems specific for
  Tle3 [[cite:PUB00100136]]. This domain and its C-terminal ([pfam:PF20995]) are both required for the
  interaction with the toxin [[cite:PUB00100136]].
