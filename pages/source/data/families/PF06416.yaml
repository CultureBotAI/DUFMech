description: Many bacterial pathogens deliver effector proteins into host cells via a type III secretion
  system. These effector proteins then alter the host cell's biology in ways that are advantageous to
  the pathogen. The NleG protein and its homologues form the largest family of effector proteins in the
  enterohemorrhagic Escherichia coli O157:H7, with 14 members identified in the Sakai strain alone [[cite:PUB00056590]].
