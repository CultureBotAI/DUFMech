description: This entry represents a domain of unknown function found in uncharcaterised proteins from
  Alphaproteobacteria, predominantly in Rhodobacterales (including Roseobacteraceae and Paracoccaceae).
  The domain is approximately 100 residues in length and is predicted to adopt an alpha/beta structure
  containing a four stranded antiparallel beta-sheet. STRING analysis shows these proteins are consistently
  associated with cell division and secretion system proteins, including DivIB ([pfam:PF03799]), RodZ
  ([pfam:PF13464]) and SPOR domain proteins ([pfam:PF05036]). The specific function of this domain remains
  to be determined.
