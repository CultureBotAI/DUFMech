description: IcmF_C family represents a conserved region situated towards the C-terminal end of IcmF-like
  proteins. It was thought to be involved in Vibrio cholerae cell surface reorganisation that results
  in increased adherence to epithelial cells leading to an increased conjugation frequency [[cite:PUB00012816]].
  IcmF as a whole interacts with DotU whereby these bind tightly and form the docking area of the T6SS
  within the inner membrane. The exact function of this domain is not clear [[cite:PUB00075434]].
