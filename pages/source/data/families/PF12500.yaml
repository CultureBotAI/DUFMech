description: This domain occurs C-terminal to PRTase_2 and has highly conserved GXXE and TRSP signatures
  [[cite:PUB00066658]]. It is found in bacteria. These genes are found in the biosynthetic operon associated
  with the Ter stress response operon and are predicted to be involved in the biosynthesis of a ribo-nucleoside
  involved in stress response [[cite:PUB00066658]].
