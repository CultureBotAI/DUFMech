  title: DIDS decreases purified BEST1 current in the bilayer assay
  scope: Tagged chicken BEST1 1-405 in the 2016 Figure 1I/J planar bilayer experiment, not drug treatment
    of retinal cells.
  context: Standard symmetric 30 mM KCl solutions with about 300 nM free calcium, 20 mM HEPES-NaOH pH
    7.6, POPE/POPG 3:1 and 22-24 C. DIDS is added to both sides through 1 mM with one minute mixing. Current
    magnitude at -100 mV is normalized to no DIDS. Three experiments; up to 2% DMSO vehicle does not noticeably
    alter current.
  family_mapping: The E1C3A0 experimental region 1-405 exactly matches A0A8V0ZZU7 and contains PF01062
    at 1-324. The EGEEF-tagged, processed construct is distinguished from the full-length reference and
    other bestrophins.
