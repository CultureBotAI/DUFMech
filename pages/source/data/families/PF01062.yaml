- graph_id: best1-bilateral-egta-current-loss
  title: Bilateral calcium chelation decreases purified chicken BEST1 current
  scope: Chicken BEST1 encoded residues 1-405 plus C-terminal EGEEF, expressed in Pichia and reconstituted
    in planar bilayers. Not the full 762-aa protein, human retinal cells or bacterial KpBest.
  context: 2016 Figure 1B-D representative same-bilayer comparison. Symmetric 30 mM KCl, 20 mM HEPES-NaOH
    pH 7.6, 0.21 mM EGTA and 0.19 mM CaCl2 initially give about 300 nM free calcium; 3:1 wt/wt POPE/POPG,
    22-24 C. Add 10 mM EGTA to both sides. Currents at +100 mV are averaged over the final 200 ms of a
    2-s pulse; empty-bilayer currents are subtracted.
  family_mapping: Historical E1C3A0 is deleted, but its archived sequence and current A0A8V0ZZU7 match
    exactly at 1-405; PF01062 spans 1-324 inclusive. Five full-length differences lie beyond 405. PDB
    4RDQ entity 1 exactly matches current residues 2-405 plus EGEEF, consistent with the cited purification's
    MS/Edman-confirmed Thr2 start. Other mutant clone sequences are not independently reconstructed.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:9031
  limitations: This is a direct current endpoint after chelation, not an observed atomic gate-closing
    trajectory. Both channel orientations are present; bilateral chelation is not interchangeable with
    one-sided treatment. The construct extends beyond the Pfam profile and does not prove isolated-domain
    sufficiency or a universal family calcium threshold.
