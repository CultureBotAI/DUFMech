- graph_id: best1-clasp-mutation-and-neck-rescue-flux
  title: Clasp substitutions reduce coupled chloride flux and TripleA restores it
  scope: D301A/D304A compared with WT, and the joint TripleA/D301A/D304A construct compared with D301A/D304A,
    in 2016 Figure 4A/C/D proteoliposomes. Only the external 2-uM-calcium condition is adopted here.
  context: 0.1 mg/ml protein and 10 mg/ml POPE/POPG before 100-fold dilution; internal 100 mM Na2SO4,
    10 mM HEPES pH 8.2, 1 mM EGTA. External 125 mM NaCl and calcium-EGTA give about 2 uM free calcium.
    CCCP initiates ACMA quench coupled to anion influx. The cited 2014 method supplies 2 uM ACMA, 1 uM
    CCCP, 0.5 mg/ml BSA and external pH 8.1. Comparisons were purified/reconstituted in parallel and assayed
    on the same day.
  family_mapping: D301/D304 and I76/F80/F84 lie within A0A8V0ZZU7 PF01062 residues 1-324 and the experimentally
    mapped 1-405 construct. The 2014 purification confirms Thr2 processing and the deposited sequence
    matches residues 2-405 plus EGEEF. Complete 2016 mutant clone sequences remain unverified.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:9031
  limitations: ACMA reports coupled acidification, not direct chloride concentration or a tracked molecular
    gate. The 2016 traces do not specify exact replicate count or recording temperature; bilayer temperature
    is not borrowed. Empty vesicles were prepared but are not displayed in Figure 4. Size-exclusion similarity
    does not eliminate every folding/incorporation alternative. Outside-only calcium activates only the
    appropriate orientation; this can affect WT/mutant flux comparisons.
