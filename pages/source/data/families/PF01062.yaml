- graph_id: best1-trans-calcium-reactivation
  title: Trans-side calcium restores BEST1 current after orientation-selective silencing
  scope: Purified tagged chicken BEST1 1-405 in the 2016 Figure 1E/F bilayer protocol. The cis-side population
    remains silenced during trans perfusion.
  context: Symmetric 30 mM KCl, POPE/POPG 3:1, pH 7.6, 22-24 C. After adding 10 mM EGTA to cis, trans
    solutions use 1 mM EGTA/calcium-EGTA mixtures to vary free calcium from near zero to 350 nM. Current
    magnitude at -100 mV is normalized to the 350-nM response. Three separate bilayers, SEM; two-second
    pulses and final 200-ms averaging.
  family_mapping: E1C3A0 archived 1-405 matches current A0A8V0ZZU7 exactly; PF01062 is 1-324. The purified
    construct includes the EGEEF tag and processing to Thr2 established in the cited original method;
    it is not full-length BEST1 or an isolated Pfam fragment.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:9031
  limitations: The fitted half-response concentration of 17 +/- 3 nM is assay-specific and is not a directly
    measured calcium-binding Kd. Increasing current magnitude at a fixed negative voltage does not imply
    a universal direction of chloride flow. No atomic motion, stoichiometric binding event or human disease
    mechanism is directly tracked.
