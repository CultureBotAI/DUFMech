- graph_id: best1-neck-mutations-retained-current
  title: Neck substitutions increase the current fraction retained after calcium chelation
  scope: Individual F80A/F80N and joint I76A/F80A/F84A TripleA constructs of tagged chicken BEST1 1-405,
    compared with WT in 2016 Figure 3C.
  context: Symmetric 30 mM KCl bilayers, POPE/POPG 3:1, pH 7.6, 22-24 C, initially about 300 nM free calcium.
    Add 10 mM EGTA to both sides and stir four minutes. Current at +100 mV after chelation is normalized
    to each construct's calcium-present current. Three separate bilayers per comparison, SEM.
  family_mapping: I76, F80 and F84 are verified in the identical historical/current 1-405 region of E1C3A0/A0A8V0ZZU7
    and within PF01062 residues 1-324. TripleA is one joint perturbation, not three independently sufficient
    mutations.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:9031
  limitations: Normalized retained fraction is not absolute current, single-channel conductance or open
    probability; precise incorporation is unknown. F80I is described as nearly WT-like in calcium dependence
    relative to the larger mutant effects and is not assigned an all-or-none independence edge. Neck mutations
    do not substantially switch anion/cation selectivity. Structural gate and quadrupole models are interpretations,
    not directly observed trajectories.
