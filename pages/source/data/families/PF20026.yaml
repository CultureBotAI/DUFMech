description: 'This domain of unknown function is found in uncharacterised proteins mainly from bacteria,
  but it is also found in eukaryotes. Some proteins containing this domain also contain zinc finger C2H2-type
  domains. There are three conserved motifs: TxI/V, RxFF and FxF, and a conserved W/Y residue at the C-terminal.'
