description: This family of proteins is found in prokaryotes, including the nickel responsive protein
  SCO4226 from Streptomyces coelicolor ([swissprot:Q9FCE4]). SCO4226 adopts a dimeric configuration able
  to bind four nickel ions, with each monomer showing a typical ferredoxin-like fold with five beta-strands
  packing against two alpha-helices. It seems to play a role in cellular nickel homeostasis, detoxification,
  and/or nickel utilization in specialised cytoplasmic compartment [[cite:PUB00093075]].
