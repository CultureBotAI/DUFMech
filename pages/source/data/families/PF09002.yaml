description: This is the endonuclease domain found in a set of bacterial proteins, including Card1 (cyclic-oligoadenylate-activated
  single-stranded ribonuclease and single-stranded deoxyribonuclease 1) from Treponema succinifaciens
  ([swissprot:F2NWD3]), a protein that is part of type III CRISPR-Cas immune response system. This protein
  consists of a CARF (CRISPR-associated Rossman fold) domain at the N-terminal, an helical hinge domain
  and a C-terminal endonuclease domain [[cite:PUB00153094]].
