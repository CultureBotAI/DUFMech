description: This domain is found across all species from bacteria to human, and the function was determined
  first in a hyperthermophilic bacterium to be an NTPase [[cite:PUB00055956]]. The structure of one member-sequence
  represents a variation of the RecA fold, and implies that the function might be that of a DNA/RNA modifying
  enzyme [[cite:PUB00032635]]. The sequence carries both a Walker A and Walker B motif which together
  are characteristic of ATPases or GTPases. The protein exhibits an increased expression profile in human
  liver cholangiocarcinoma when compared to normal tissue [[cite:PUB00041591]].
