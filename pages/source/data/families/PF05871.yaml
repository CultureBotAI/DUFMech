description: This family of conserved eukaryotic proteins are subunits of the endosome associated complex
  ESCRT-II which recruits transport machinery for protein sorting at the multivesicular body (MVB) [[cite:PUB00019520]].
  This protein complex transiently associates with the endosomal membrane and thereby initiates the formation
  of ESCRT-III, a membrane-associated protein complex that functions immediately downstream of ESCRT-II
  during sorting of MVB cargo. ESCRT-II in turn functions downstream of ESCRT-I, a protein complex that
  binds to ubiquitinated endosomal cargo [[cite:PUB00019520]].
