description: This domain is currently only found in a small set of S. coelicolor secreted proteins. There
  are four conserved cysteines that probably form two disulphide bonds. Proteins 2SCK31.15C ([swissprot:Q9ADK5])
  and SCO3675 ([swissprot:Q9X8V7]) also have probable beta-propellers at their C-termini. This family
  includes [swissprot:P01077] a known peptidase inhibitor of known structure. This protein has a crystallin
  like fold [pfam:PF00030] and is distantly related by sequence. It is not known whether other members
  of this family are peptidase inhibitors.
