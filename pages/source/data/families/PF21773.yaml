description: 'This domain, previously know as DUF6872, is found in Outer dynein arm-docking complex subunit
  1 (ODAD1, CCDC114) from humans and similar eukaryotic proteins. In mammals, CCDC114 forms a hetero-coiled
  coil with ODAD1/CCDC151 within the A07/A08 interprotofilament cleft, analogous to the DC1/2 coiled coil
  of the trimeric ODA-DC observed in C. reinhardtii axoneme [[cite:PUB00152762],[cite:PUB00100771]]. DC2
  is a homolog of the human ODAD1/CCDC151 and in C.reinhardtii it is a part of the ODA-DC that consists
  of three proteins: DC1, DC2, and DC3. The N-terminal halves of DC1 and DC2 form a microtubule-bound
  heteromeric coiled-coil [[cite:PUB00152762],[cite:PUB00152763]].'
