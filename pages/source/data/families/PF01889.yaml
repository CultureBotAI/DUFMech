- graph_id: ali-tagged-processing
  title: Ali deletions alter mature-band output of tagged lipoproteins
  scope: Hong2025 Figure3c, H. volcanii H53-derived deletions versus H53 with matched plasmid-expressed
    C-terminal myc-tagged substrates.
  context: Hv-Cab,45 C;200 ug/ml tryptophan for expression,harvest OD6000.8. Whole-lysate immunoblots
    with Ponceau controls,representative of at least two experiments. Substrate processing is inferred
    from band mobility,not sequenced cleavage products.
  family_mapping: AliA is HVO_2859/D4GXF7 sequenceversion2/ADE04977.2,379 aa,PF01889 at87-379. AliB is
    HVO_2611/D4GUE1 sequenceversion1/ADE03618.1/WP_004042703.1,269 aa,PF01889 at17-263. Exact reference
    sequences match; whole-gene deletions do not isolate the domain. H53 assays are distinct from the
    DS2 reference record.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:2246
  limitations: Lower mature-band output is not direct proof of a catalytic reaction or cleavage order.
    Lipobox Cys mutations are in substrates,not AliA/B. HVO_0844 still matures,but its mature signal also
    decreases with aliA deletion. Main text reports matched complementation and failed cross-complementation;
    Supplementary Figure6 and exact inserts were not inspected. Tagged HVO_1176 results differ from endogenous2026
    proteomics.
