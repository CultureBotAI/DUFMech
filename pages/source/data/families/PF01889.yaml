description: This entry represents AliA and AliB from Haloferax volcanii and similar uncharacterised transmembrane
  proteins from archaea. Ali stands for archaeal lipoprotein biogenesis components. These proteins are
  important for lipoprotein lipidation as well as for for the organism's cell shape, growth and motility
  [[cite:PUB00162475]].
curation_history: history/records/PF01889
discussions:
- discussion_id: ali-catalysis-and-substrate-contexts
  prompt: Resolve AliA catalytic sufficiency and AliB processing chemistry without collapsing substrate-specific
    observations.
  kind: CURATION_TODO
  status: OPEN
  rationale: Whole-gene deletions support the retained cellular effects,but do not establish purified
    lipid-transfer activity,lipid donor identity,AliB peptidase activity or a conserved-residue mechanism.
    Tagged HVO_1176 and endogenous proteomics disagree; HVO_B0139 misses a stringent proteomic threshold.
    These contexts cannot be merged into universal lipidation requirements.
  evidence:
  - reference: PMID:40998839
    supports: PARTIAL
    evidence_source: full_text_and_figures
    explanation: Original Figures3-5 and Methods establish biogenesis/physiology phenotypes; in-vitro
      stand-alone activity and residue tests remain future work in the Discussion. Matched and cross-complementation
      are reported in text,but Supplementary Figure6 was not inspected.
  - reference: PMID:42641884
    supports: PARTIAL
    evidence_source: full_text_and_figures
    explanation: Original Figures2-5 distinguish broad AliA-associated changes from the narrower AliB
      response. AliB bulk lipid comparison(p0.077),TX distribution(p0.98) and reported aliA qPCR trend(p0.174)
      do not justify increase/decrease arrows. Figure3 validation counts depend on filtering and missing
      data,not direct lipid-peptide sequencing.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: Obtain readable supplements,exact inserts and mutant-genome evidence; inspect additional substrate/taxon
    studies. The primary qPCR control threshold printed as deltaCt<=10 and the prose ordering of WT/aliB
    medians remain unresolved. The866 proteins counted in the frozen family are not all functionally characterized.
    Preprints and database echoes are not independent experimental origins.
- discussion_id: ali-shared-controls-and-name-collision
  prompt: Preserve the shared lipid-control provenance and distinguish archaeal AliA/AliB from pneumococcal
    namesakes.
  kind: CURATION_TODO
  status: OPEN
  rationale: The2026 lipid deposit explicitly links its WT/double-deletion controls to the2025 deposit.
    Repeated plots must not be counted as independent replication. PF01889 is former DUF63,not pneumococcal
    PF00496 peptide-binding Ali proteins.
  evidence:
  - reference: https://purl.stanford.edu/nk164tn8116
    supports: SUPPORT
    evidence_source: primary_data_repository_metadata
    explanation: The record identifies single-mutant YH_57/aliB and YH_113/aliA data and points H53/double-deletion
      data to vq241jx8767. Metadata were inspected; raw LC-MS integration was not repeated.
  - reference: https://www.ebi.ac.uk/interpro/api/entry/pfam/PF01889/
    supports: SUPPORT
    evidence_source: database
    explanation: Current InterPro and the frozen previous-name TSV identify the archaeal family and historical
      DUF63 alias. Member-specific APIs verify AliA87-379 and AliB17-263; original FASTAs match the stated
      UniProt reference versions.
