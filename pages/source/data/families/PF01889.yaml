- graph_id: ali-lipid-anchor-readout
  title: AliA-containing deletions eliminate detectable recovered methylthio-archaeol
  scope: Hong2025 Figure4 and Hong2026 Figure5,processed bulk TX extracts from H53 and deletion derivatives.
  context: 80mg starting total protein;TX extraction,methyl iodide and alkaline release,LC-MS m/z683.7/700.8/705.7
    against a synthetic methylthio-archaeol standard and10-point calibration. Three biological replicates
    per strain. The2026 deposit identifies new single-mutant samples and reuses the earlier WT/double-mutant
    dataset.
  family_mapping: AliA/HVO_2859/D4GXF7 PF01889 at87-379;AliB/HVO_2611/D4GUE1 at17-263. Double deletion
    is one intervention; both references belong to the same family but have distinct roles.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:2246
  limitations: This is a cellular genotype-to-processed-lipid readout,not purified enzyme catalysis or
    a site-resolved substrate bond. Undetected is assay-bounded. Comparable core-archaeol profiles argue
    against bulk lipid-synthesis loss. AliB single deletion is not significantly increased or decreased
    versus WT(p0.077). Shared WT/double data are not independent replication across papers; raw integrations
    were not reanalyzed.
