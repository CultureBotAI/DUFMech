description: This domain is found in several proteins including gamma-butyrobetaine dioxygenase, Fe-S
  cluster assembly factor HCF101 and trimethyllysine dioxygenase proteins. Gamma-butyrobetaine hydroxylase
  (GBBH) is a alpha-ketoglutarate-dependent dioxygenase that catalyzes the biosynthesis of L-carnitine
  by hydroxylation of gamma-butyrobetaine (GBB). GBBH is a dimeric enzyme. The monomer consists of a catalytic
  double-stranded beta-helix domain and a smaller N-terminal domain. The N-terminal domain has a bound
  Zn ion, which is coordinated by three cysteines and one histidine. The N-terminal domain could facilitate
  dimer formation, but its precise function is not known [[cite:PUB00075680]]. Other family members have
  been suggested to be involved in FeS cluster maintenance (see Supplementary note 5 in [[cite:PUB00093610]].)
