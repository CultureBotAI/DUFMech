description: This entry represents cilia- and flagella-associated protein, HOATZ, and related proteins,
  found in metazoa. In mice HOATZ is encoded by the gene designated 4833427G06Rik (C11orf88). Mouse Hoatz
  mRNA is specifically expressed in tissues with motile cilia and flagella [[cite:PUB00135090]]. Hoatz
  knockout mice developed hydrocephalus and male infertility, and the ependymal cilia frequently showed
  disorganised axonemes [[cite:PUB00135090]].
