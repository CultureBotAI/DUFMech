description: This family of proteins is functionally uncharacterised. This family of proteins is found
  in bacteria, archaea and eukaryotes. Proteins in this family are typically between 137 and 165 amino
  acids in length. Proteins in this family are related to the thiosulfate transporter, but appear to be
  about half the length. Suggesting this family may operate as a dimer to make a functional transporter.
