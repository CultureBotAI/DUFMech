description: This entry represents the N-terminal P-loop kinase domain of RNase adapter protein RapZ and
  related proteins. RapZ plays a central role in RNA-mediated regulation of amino-sugar metabolism [[cite:PUB00075613],[cite:PUB00150969],[cite:PUB00153826]].
  It is a RNA-binding protein that recruits the major endoribonuclease RNase E to sRNAs GlmZ [[cite:PUB00075613],[cite:PUB00150969]].
