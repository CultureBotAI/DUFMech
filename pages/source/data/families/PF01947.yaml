description: This domain is found in chorismate pyruvate-lyases ([ec:4.1.3.40], also known as 4-HB synthase
  and p-hydroxybenzoic acid synthase) such as those found in Mycobacterium tuberculosis where it removes
  the pyruvyl group from chorismate to provide 4-hydroxybenzoate (4HB) [[cite:PUB00086017]]. The chorismate
  pyruvate-lyase encoded by sll1797 in cyanobacteria Synechocystis sp. , has been shown to catalyse the
  initial and essential step in plastoquinone biosynthesis [[cite:PUB00097745]]. In E. coli, the chorismate
  lyase (UbiC) catalyses the conversion of chorismate to p-hydroxybenzoate and pyruvate in the biosynthesis
  of ubiquinone as well [[cite:PUB00097746]].
