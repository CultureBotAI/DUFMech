description: Ysc84 is a family of Las17-binding proteins found in metazoa. Together, Las17 and Ysc84 are
  essential for proper polymerisation of actin; Ysc84 is able to bind to and stabilise the actin dimer
  presented by Las17 and thereby promote polymerisation. An active actin cytoskeleton is necessary for
  adequate endocytosis. ([pfam:PF00018]), or a FYVE zinc finger ([pfam:PF01363]).
