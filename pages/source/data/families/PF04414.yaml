description: Several aminoacyl-tRNA synthetases have the ability to transfer the D-isomer of their amino
  acid onto their cognate tRNA. D-aminoacyl-tRNA deacylases hydrolyse the ester bond between the polynucleotide
  and the D-amino acid, thereby preventing the accumulation of such mis-acylated and metabolically inactive
  tRNA molecules.
