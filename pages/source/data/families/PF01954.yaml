      characterization.
  - reference: doi:10.2210/pdb2nwt/pdb
    supports: SUPPORT
    evidence_source: structural_deposition
    explanation: 2NWT entity1 is exactly O28071 residues1-61 plus LEHHHHHH at62-69, with chainsA/B. Twenty
