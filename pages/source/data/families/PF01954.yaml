description: This family includes short bacterial and archaebacterial proteins thought to be antitoxin
  components of the a type II toxin-antitoxin (TA) system. This entry includes AF2212 from Archaeoglobus
  fulgidus which has sequence similarity with the AbrB superfamily of DNA-binding proteins, identified
  as antitoxins [[cite:PUB00056596],[cite:PUB00056164]]. The secondary structure of AF2212 revealed at
  least three beta-strands that are most conserved in other AbrB superfamily members [[cite:PUB00056164]].
