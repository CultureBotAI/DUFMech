description: This domain occurs as an additional C-terminal iron-sulfur cluster binding domain in many
  radical SAM domain, [pfam:PF04055] proteins. The domain occurs in a number of proteins that modify a
  protein to become an active enzyme, or a peptide to become a ribosomal natural product. The domain is
  named SPASM because it occurs in the maturases of Subilitosin, PQQ, Anaerobic Sulfatases, and Mycofactocin.
