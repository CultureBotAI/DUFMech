description: This is the beta-sandwich domain found in ER membrane protein complex subunit 7 (EMC7) [[cite:PUB00096682],[cite:PUB00096681]],
  which is an integral membrane component of the EMC. EMC is widely conserved and involved in membrane
  protein biogenesis. It mediates the insertion into endoplasmic reticulum membranes of newly synthesized
  membrane proteins in an energy-independent manner, both post-translational insertions of tail-anchored
  proteins and co-translational insertion of multipass membrane proteins [[cite:PUB00096679],[cite:PUB00096678]].
  This entry includes UPF0620 protein C83.10 from S. pombe, an orthologue of animal EMC7. This domain
  is also found in nodal modulators, which have been identified as part of a protein complex that participates
  in the nodal signalling pathway during vertebrate development [[cite:PUB00054165]].
