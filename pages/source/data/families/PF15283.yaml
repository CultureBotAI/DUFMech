description: Large family of predicted secreted proteins mostly from CFG group, but also from Burkholderia,
  Pseudomonas and Streptomyces. Function of these proteins is not known. A 3D structure of a representative
  of this family from Bacteroides uniformis was solved by JCSG and deposited to PDB as 4ghb. There is
