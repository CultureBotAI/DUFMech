description: This domain is found in the type VI secretion system (T6SS) protein Phospholipase effector
  Tle1 from Pseudomonas aeruginosa ([swissprot:Q9HYV3]), which hydrolyse membrane phospholipids. Tle1
  is organised into two distinct parts, the phospholipase catalytic module (this entry) and the putative
  membrane-anchoring module ([pfam:PF22137]). This domain adopts a compact conformation with a classical
  mixed alpha/beta-hydrolase fold that shows of seven central parallel beta-sheets and 13 alpha-helices
  [[cite:PUB00154252]].
