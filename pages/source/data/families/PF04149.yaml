- graph_id: sco7615-7616-deletion-r2ye
  title: SCO7615/SCO7616 deletion on R2YE
  scope: Joint-gene perturbation in S. coelicolor M145, not isolated SCO7616 activity.
  context: Solid R2YE, day 7; wild-type M145 comparator.
  family_mapping: SCO7616 is UniProtKB:Q9F3E1, sequence version 1, 89 residues; current Pfam PF04149 feature
