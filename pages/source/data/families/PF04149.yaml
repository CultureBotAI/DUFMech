causal_graphs:
- graph_id: scr2-act-induction
  title: Scr2-dependent actinorhodin induction
  scope: Scr2 (SCO4442; UniProtKB:Q9KZY4), not all DUF397 proteins or an isolated domain.
  context: S. coelicolor M145 and scr2-deletion derivatives, Scr1 overexpression, liquid YES plus xylose,
    eight days.
  family_mapping: UniProt Q9KZY4 sequence version 1 is 63 residues; its Pfam PF04149 annotation spans
    residues 10-62. The experiment perturbs the whole gene.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:100226
  limitations: No direct Scr1-Scr2 binding or catalytic mechanism established here; no family-wide transfer.
    Other media, times and paralogs require separate graphs.
  nodes:
  - node_id: scr2-present
    label: Scr2 present in a Scr1-overexpression background
    node_type: STATE
    grounding:
    - UniProtKB:Q9KZY4
  - node_id: induced-act
    label: Scr1-induced actinorhodin production
    node_type: PHENOTYPE
  edges:
  - edge_id: scr2-required-for-act
    subject: scr2-present
    predicate: required_for
    object: induced-act
    mechanism: Loss of scr2 prevents induction by Scr1 alone; joint expression restores it. This is a
      conditional requirement, not sufficiency of Scr2.
    directness: INDIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:30524403
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6262351/
      snippet: these two genes must act in conjunction
      explanation: Figure 3A-B compares deletion strains and expression constructs, with empty-vector
        controls and three independent experiments; supports the scoped phenotype dependency.
      cache_path: evidence/PF04149/santamaria-2018-scr2.txt
