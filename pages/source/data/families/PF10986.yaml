description: This entry represents the ZrgA family of zinc uptake proteins. ZrgA plays a predominant role
  in zinc acquisition in Vibrio parahaemolyticus and other members of the Vibrionaceae family. The protein
  is part of the ZrgABCDE system that functions as a zinc transporter [[cite:PUB00159002]]. ZrgA expression
  is negatively regulated by the zinc uptake regulator (Zur) and is derepressed under zinc limitation
  conditions. The gene is part of an operon that includes zrgB (ABC transporter permease), zrgC (ABC transporter
  ATP-binding protein), zrgD and zrgE. The ZrgA protein contains several conserved motifs potentially
  involved in zinc binding. The wild type ZrgA can bind up to 10 zinc ions with four high-affinity zinc
  binding sites [[cite:PUB00159005]]. The structures of ZrgA from Vibrio cholerae and its homologue, protein
  PA4063 from Pseudomonas aeruginosa, were determined bound to zinc [[cite:PUB00159005],[cite:PUB00159006]].
  These proteins adopt an alpha/beta structure consisting of a six-stranded meander beta-sheet and two
  alpha-helices packed on it with an unique topology.
