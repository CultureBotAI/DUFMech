description: This is a domain of unknown function found in Minor capsid protein P2 from Paramecium bursaria
  Chlorella virus 1 and related sequences from Mimiviridae and Phycodnaviridae. Minor capsid protein P2
  is one of the minor capsid proteins that constitute a network internal to the major capsid proteins
  and outside the lipid membrane [[cite:PUB00154526]]. The minor capsid proteins glue and stabilize the
  capsomers [[cite:PUB00154526]]. It also acts as a molecular tape measure protein that determines the
  size of the viral capsid [[cite:PUB00154526]].
