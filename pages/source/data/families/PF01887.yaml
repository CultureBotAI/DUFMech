description: This is a family of proteins, previously known as DUF62, found in archaebacteria and bacteria.
  The structure of proteins in this family is similar to that of a bacterial fluorinating enzyme [[cite:PUB00047427]].
  S-adenosyl-l-methionine hydroxide adenosyltransferases utilises a rigorously conserved amino acid side
  chain triad (Asp-Arg-His) which may have a role in activating water to hydroxide ion [[cite:PUB00054078]].
  This family used to be known as DUF62.
