description: MlaE is a permease which in E. coli is a component of the Mla pathway, an ABC transport system
  that functions to maintain the asymmetry of the outer membrane [[cite:PUB00059298]]. In [swissprot:Q7DD59]
  it is involved in L-glutamate import into the cell [[cite:PUB00057443]]. In [swissprot:Q8L4R0] it is
  involved in lipid transfer within the cell [[cite:PUB00057443]].
