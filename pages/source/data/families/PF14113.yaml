description: Tae4 is a new form of toxin-antitoxin system protein for a type VI secretion system, T6SS.
  T6SS has roles in interspecies interactions, as well as higher order host-infection, by injecting effector
  proteins into the periplasmic compartment of the recipient cells of closely related species. Pseudomonas
  aeruginosa produces at least three effector proteins to other cells and thus has three specific cognate
  immunity proteins to protect itself. Tae4, or type VI amidase effector 4, in Enterobacter cloacae has
  a cognate Tai4 or type VI amidase immunity 4 protein [[cite:PUB00075621]]. The immunity protein is Tai4,
  [pfam:PF16695].
