description: YdjM is a family of putative LexA-binding proteins. Members are predicted to be membrane-bound
  metal-dependent hydrolases that may be acting as phospholipases. It is a member of the SOS network,
  that rescues cells from UV and other DNA-damage. Expression of YdjM is regulated by LexA [[cite:PUB00075708],[cite:PUB00155923]].
