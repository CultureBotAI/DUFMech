- graph_id: trmb-pfk-rnap-occlusion-model
  title: TrmB occupancy may obstruct RNAP recruitment at the PFK promoter
  scope: Proposed explanation for full-length TrmB-associated PFK footprinting and transcriptional repression;
    not a directly observed recruitment experiment.
  context: Figure 32 locates a protected region at -15 to +27 around the PFK start, with unequal DNaseI
    doses across no-protein/protein lanes. Separate Figure 33A shows repression. Ledger R6 retains the
    protocol mismatch and the source's proposed interpretation.
  family_mapping: Q9HGZ9/Q7LYW4 version 1 reference PF01978 11-77 in multidomain TrmB; neither isolated-domain
    occupancy nor a residue-level DNA contact is established. Exact assay insert/taxon remains unresolved.
