    evidence_source: doctoral_thesis_and_original_figures
    explanation: Methods pp.39-41 and Figures 18-23, 32-35, 45-48 and 51 retain glucose carryover, residual/nonmonotonic
      activity, unmatched buffers or nuclease amounts and diffuse shifts. Figure 22B retains 2% signal
