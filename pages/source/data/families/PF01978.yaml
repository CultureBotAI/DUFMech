  limitations: Footprint DNA protection and runoff inhibition do not directly measure RNAP recruitment.
    DNaseI amounts vary from 0.0025 U without protein to 0.01-0.02 U with protein. No matched-nuclease
    no-protein comparison, recruitment kinetics or DNA-bound atomic structure was established.
