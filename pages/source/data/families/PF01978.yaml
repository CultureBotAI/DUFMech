    evidence_source: doctoral_thesis_and_original_figures
    explanation: Methods pp.39-41, Figures 45-48 and 51 retain glucose carryover, residual/nonmonotonic
      activity, unequal footprint nuclease amounts and a diffuse MD shift. These prevent exact affinity,
