description: This entry represents proteins found in Coronaviruses and includes the Non-structural Protein
  6 (NSP6). Coronaviruses encode large replicase polyproteins which are proteolytically processed by viral
  proteases to generate mature Nonstructural Proteins (NSPs) [[cite:PUB00094417]]. NSP6 is a membrane
  protein containing 6 transmembrane domains with a large C-terminal tail [[cite:PUB00094417]]. NSP6 from
  the avian coronavirus, infectious bronchitis virus (IBV) and the mouse hepatitis virus (MHV) have been
  shown to localise to the ER and to generate autophagosomes [[cite:PUB00094416]]. Coronavirus NSP6 proteins
  have also been shown to limit autophagosome expansion. This may favour coronavirus infection by reducing
  the ability of autophagosomes to deliver viral components to lysosomes for degradation [[cite:PUB00094416]].
  NSP6 from IBV, MHV and severe acute respiratory syndrome coronavirus (SARS-CoV) have also been found
  to activate autophagy [[cite:PUB00094416],[cite:PUB00094418]].
