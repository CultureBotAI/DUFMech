description: This domain is found in several Enterobacterial proteins of around 90 residues in length,
  including E. coli YdgH, YhcN, BhsA and McbA, which play a role in stress response, biofilm formation
  and pathogenesis [[cite:PUB00097758],[cite:PUB00097759]]. BhsA (also known as ComC) reduces the permeability
  of the outer membrane to copper and may decrease biofilm formation by repressing cell-cell interaction
  and cell surface interaction [[cite:PUB00097760]]. Members of this entry have one copy of this domain
  with the exception of YdgH, which has three copies. The function of this domain is unknown, however,
  it is suggested to be directly involved in host-pathogen interaction [[cite:PUB00097759]].
