description: Family of ATP-grasp enzymes belonging to the R2K clade, wherein one of the absolutely-conserved
  lysine residues has migrated to the RAGYNA domain which is a part of the core ATP-grasp module. This
  family is predicted to catalyze peptide ligation reactions on protein substrates in biological conflict
  contexts, probably between bacteriophages and their hosts [[cite:PUB00091030]].
