- graph_id: hxlr-heterologous-gfp-response
  title: HxlR substitutions reduce the formaldehyde-induced GFP reporter response in E. coli
  scope: E. coli BW25113 carrying pBAD-HxlR constructs labeled WT, C11A or K13A and a B. subtilis 168
    hxlAB-promoter GFP reporter, Zhu 2021 Figure 1f and Supplementary Figure 2e.
  context: Dilute overnight cultures 1:100 into LB, grow to OD600 0.6, induce HxlR with 4 mM L-arabinose
    for 1 h, then treat with or without 600 uM formaldehyde for 40 min. Measure GFP by flow cytometry
    at 488-nm excitation and 530/30BP emission. Supplementary Figure 2b/c provides colony-count viability
    controls and scatter gating. These are not the purified pET28a constructs or native B. subtilis cultures.
  family_mapping: The source gene is P42406 from B. subtilis 168, with current PF01638 19-107; C11 and
    K13 are outside that interval. Supplementary Table 2's pBAD forward primer is compatible with an MGRM
    start instead of reference MSRM if translated from its apparent start, but Methods describe Gibson
    assembly. A primer-implied S2G possibility remains unresolved; author WT/C11A/K13A labels do not prove
    exact native N-terminal sequence.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:679895
  limitations: GFP distributions are indirect reporter phenotypes, not direct transcription-rate, formaldehyde-detoxification
    or native-operon measurements. C11A has lower basal reporter signal, whereas K13A has higher basal
    signal and little further induction. Viability/gating controls do not establish equal mutant protein
    abundance, folding or localization. The pBAD sequence discrepancy is preserved rather than claiming
    a resequenced WT plasmid. Separate biochemical and cellular assays are not joined into one observed
    trajectory.
