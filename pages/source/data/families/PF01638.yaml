- graph_id: hxlr-k13a-dna-binding-response
  title: K13A HxlR binds DNA but lacks the WT formaldehyde enhancement
  scope: Purified K13A HxlR in Zhu 2021 Supplementary Figure 2d; its titration range differs from WT/C11A
    Figure 1e.
  context: Supplementary Figure 2d uses 0.05, 0.1, 0.15 and 0.2 uM K13A, with or without treatment labeled
    0.6 mM formaldehyde. Shared EMSA Methods specify 1 mM pretreatment of 100 uM protein for 1-2 h at
    37 C, followed by dilution into 50 nM BRH duplex with HEPES pH 7.0, KCl, MgCl2 and glycerol. The formaldehyde
    discrepancy is unresolved. Representative gel from three independent experiments; the WT positive
    response is from the separate Figure 1e range.
  family_mapping: K13 is verified in P42406 and lies outside PF01638 19-107. The intact pET28a-derived
    HxlR mutant is tested, not the isolated HxlR-like domain. The 7BZD sequence check concerns WT structural
    protein, not an independently resequenced K13A assay stock.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:224308
  limitations: The edge denotes loss of the WT treatment response, not lower absolute DNA binding at identical
    WT/K13A concentrations. K13A retains strong basal shifts and the authors describe higher basal binding.
    Different concentration ranges do not establish a quantitative affinity ratio. Directness is confined
    to the biochemical response; a unique structural intermediate or conformational trajectory is not
    demonstrated.
