- graph_id: hxlr-wt-c11a-dna-binding-response
  title: Formaldehyde enhances WT HxlR DNA binding, with little enhancement in C11A
  scope: Purified pET28a-derived WT and C11A HxlR, Zhu 2021 Figure 1e; separate from cellular reporter
    and K13A titrations.
  context: EMSA Methods pretreat 100 uM protein with or without 1 mM formaldehyde for 1-2 h at 37 C in
    20 mM HEPES pH 7.5 and 300 mM NaCl. Figure 1e instead labels 0.6 mM formaldehyde; this discrepancy
    remains unresolved. Final WT/C11A protein is 0.2, 0.4 or 0.6 uM in 20 ul with 50 nM 50-bp BRH duplex,
    20 mM HEPES pH 7.0, 50 mM KCl, 5 mM MgCl2 and 10% glycerol. Table 2 specifies BRH-F/R, not the optimized
    20-bp crystallization duplex. Representative gels from three independent experiments.
  family_mapping: P42406 / B. subtilis 168 reference 1-120 contains PF01638 19-107; C11 is outside that
    interval. The N-terminal His tag is thrombin-cleaved, with GSH retained in the sequence-verified structural
    preparation. Neither C11A nor WT is an isolated Pfam-domain construct.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:224308
  limitations: Gel-shift enhancement is a direct biochemical binding response, not a measured transcription
    rate or fitted KD. C11A retains basal binding; lack of enhancement is not complete loss of DNA binding.
    Equal mutant folding and active fraction are not established by these gels. The formaldehyde concentration
    discrepancy is not resolved by assumed dilution, and static structural differences do not directly
    observe helix flipping.
