causal_graphs:
- graph_id: hxlr-formaldehyde-intact-mass-product
  title: Formaldehyde produces a plus-12-Da species of purified intact HxlR
  scope: Purified B. subtilis 168 HxlR expressed from pET28a in E. coli BL21(DE3), Zhu 2021 Supplementary
    Figure 1c; not the synthetic peptide, cellular MS/MS or FAsor fusion assay.
  context: Incubate 100 uM HxlR with 1 mM formaldehyde in 20 mM HEPES pH 7.5 and 300 mM NaCl for 1 h at
    37 C; desalt by Micro Bio-Spin 6 and analyze by Bruker Solarix XR FT-MS. Purification removes the
    N-terminal His tag with thrombin, followed by DTT treatment and SEC. The structural preparation retains
    a GSH cleavage extension.
  family_mapping: P42406 sequence version 3 is 120 aa; UniProt/InterPro sequences match, with PF01638
    at 19-107. PDB 7BZD entity 1 is exactly GSH plus this reference. C11 and K13 are outside the current
    Pfam interval. The experiment therefore concerns an intact domain-bearing protein, not chemistry by
    the isolated Pfam domain.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:224308
  limitations: Intact-mass spectra establish new plus-12-Da species, not their unique chemical topology
    alone. Separate crystal density, cellular tryptic MS/MS and synthetic-peptide substitutions support
    the C11/K13 methylene assignment. Those samples are not one time-resolved reaction trajectory. Unmodified
    and sodium-adduct species persist; no quantitative yield, chemical reversibility or obligatory sequential
    intermediate is asserted.
