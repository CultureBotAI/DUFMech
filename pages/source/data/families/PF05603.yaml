description: This domain is found at the N-terminal end of Protein Hikeshi from humans and its orthologues
  OPI10 from other eukaryotes. Hikeshi is an specific nuclear import carrier for HSP70 proteins following
  heat-shock stress, which is required to protect cells from heat- shock damages. The N-terminal domain
  shows a jelly-roll/beta- sandwich fold with two layers of beta-sheets consisting of three and five and
  five antiparallel beta-strands [[cite:PUB00101203]].
