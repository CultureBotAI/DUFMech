description: This domain is found in fungal proteins, including copper acquisition factor BIM1 from Cryptococcus
  neoformans, a cell-surface bound protein that functions in the copper-accumulation pathway shared by
  the CUF1-dependent copper transporter CTR1 [[cite:PUB00101283],[cite:PUB00101282]]. BIM1 facilitates
  copper acquisition in the brain of mammalian hosts and acts as a copper-dependent virulence trait in
  fungal meningitis [[cite:PUB00101283]]. This domain has a lytic polysaccharide monooxygenase-like (LPMO,
  [pfam:PF03067]) fold, which are evolutionarily related but have diverged to a different biological function.
