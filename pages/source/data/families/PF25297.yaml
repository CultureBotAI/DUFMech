description: This domain is found in uncharacterised bacterial proteins. It is predicted to contain two
  structural beta(3)-alpha repeats that swap their alpha-helix in a similar way as observed in the known
  ssDNA-binding transcriptional regulator domains. It is likely that this domain is distantly related
  to them and probably represents the minimal two repeat containing fold.
