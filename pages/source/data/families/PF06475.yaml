description: This family has a novel fold known as a spiral beta-roll, consisting of a 15-stranded beta
  sheet wrapped around a single alpha helix. It forms dimers. It has some structural similarity to the
  E. coli lipoprotein localisation factors LolA, [swissprot:P61316] and LolB, [swissprot:P61320]. Its
  structure suggests that it may have a role in glycolipid binding. Its genomic context supports a role
  in glycolipid metabolism [[cite:PUB00057505]].
