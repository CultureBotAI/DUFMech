description: This is the N-terminal all helix domain found in N-acyltransferases (NATs), the gene products
  orf11 and dbv8. The all-helix domain is composed of eight helices with two helix-turn-helix motifs in
  tandem. It is structurally akin to the AAA+ protein family (ATPases associated with diverse cellular
  activities) [[cite:PUB00091662]].
