description: This domain is found at the C-terminal end of U4/U6 and U4/U5/U6- small nuclear ribonucleoprotein
  Prp3, part of the tri-RNA complex that form the spliceosome. Prp3 plays a key role in the recognition
  of the snRNA duplex. This binding domain, highly conserved among eukaryotes, interacts with the 3' end
  of U6 snRNA. It adopts a ferredoxin-like fold, showing a five-stranded mixed beta-sheet with three alpha-helices,
  two of them running parallel to the beta-strands on one side of the sheet and one on the other. This
  fold is extended with a long beta-hairpin, an extra beta-strand, an helix and a final loop at the C
  terminus. It is located C-terminal to [pfam:PF08572] [[cite:PUB00100665],[cite:PUB00100667],[cite:PUB00100664],[cite:PUB00100666]].
