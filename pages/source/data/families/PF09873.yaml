description: This family includes MJ1481 from Methanocaldococcus jannaschii and similar archaeal proteins.
  MJ1481 has been reported to be SepCysE, a translation factor, essential for the methanococcal Cys biosynthesis.
  SepCysE forms a bridge between Sep-tRNA:Cys -tRNA synthase (SepCysS) and O-phosphoseryl-tRNA synthetase
  (SepRS), forming the transsulfursome complex, enabling substrate channelling of Sep-tRNACys [[cite:PUB00093677],[cite:PUB00093676]].
