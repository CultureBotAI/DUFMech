description: This is a family of Gram-negative bacterial outer membrane lipoproteins. LpoB is required
  for the function of the major peptidoglycan synthase enzyme PBP1B. It interacts with PBP1B protein via
  the UvrB-like non-catalytic domain on that protein. LpoB has a 54-aa-long flexible N-terminal stretch
  followed by a globular domain with similarity to the N-terminal domain of the prevalent periplasmic
  protein TolB. The long, flexible N-terminal region of LpoB enables it to span the periplasm and reach
  its docking site in PBP1B. Peptidoglycan is the essential polymer within the sacculus that surrounds
  the cytoplasmic membrane of bacteria [[cite:PUB00110446]].
