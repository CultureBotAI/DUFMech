description: Members of this entry are found mostly in g-proteobacteria, especially in Vibrio. Strangely
  enough, there seems to be one eukaryotic homolog in Nematostella vectensis (NEMVEDRAFT_v1g226006), where
  the PA0388-like domain is fused with a domain homogous to the Methionine biosynthesis protein MetW (see
  below). In several Pseudomonas species, but also in Vibrio vulnificus and Azotobacter vinelandii PA0388
  homologs are genomic neighbors of Nucleoside 5-triphosphatase RdgB (dHAPTP, dITP, XTP-specific) (EC
  3.6.1.15) and Methionine biosynthesis protein MetW. On the other hand, in most Vibrio species it appears
  as a part of a conserved operon involved in possible response to stress.
