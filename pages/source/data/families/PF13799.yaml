description: This entry, previously known as DUF4183, represents the so-called Fibrillar ENdospore Appendages
  or F-ENAs found mainly in Bacilli lineage. F-ENA subunits assemble into trimeric units that stack axially
  into a helical ultrastructure fibers [[cite:PUB00163791]]. F-ENAs contribute to spore clustering. At
  the spore distal terminus, F-ENAs are decorated with a flexible tip fibrillum that consists of the collagen-like
  protein F-BclA [[cite:PUB00163791]].
