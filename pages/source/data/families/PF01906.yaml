discussions:
- discussion_id: duf74-assay-and-member-coverage
  prompt: Validate YbjQ joint-genotype phenotypes and recover the retron-screen primary context.
  kind: CURATION_TODO
  status: OPEN
  rationale: Ten indirect effects preserve a multiplicative single-mutant comparator. These are not a
    direct molecular network or an isolated YbjQ mechanism.
  evidence:
  - reference: PMID:24586182
    supports: SUPPORT
    evidence_source: primary_tables_and_screen_protocols
    explanation: All ten exact YbjQ recipient rows are retained with scores and donor context; repeated
      colony measurements do not exclude every marker, polar or secondary-mutation effect.
  - reference: https://archiv.ub.uni-heidelberg.de/volltextserver/31572/1/Bomponis_PhD_Thesis.pdf
    supports: PARTIAL
    evidence_source: uninspected_primary_source_lead
    explanation: Indexed section 2.6/Figure 19 suggests a YbjQ deletion/retron-induction phenotype, but
      PDF access returned challenge HTML. The figure and complete controls were not inspected, so no observed
      edge is derived from the snippet.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: Seek raw normalized fitness, independent alleles, complementation and exact Keio-derived clones.
    Retrieve the retron thesis figure and assess the published supplements; the related Bobonis2022 main
    HTML has no YbjQ occurrence, not proof that all supplementary data lack it. Most of the 9784 frozen
    members remain unassessed. Keep IN_PROGRESS and preserve family versus protein versus domain scope.
- discussion_id: duf74-metal-binding-and-construct-gap
  prompt: Resolve biochemical function and exact self-association constructs without promoting predictions
    to mechanisms.
  kind: CURATION_TODO
  status: OPEN
  rationale: A structural metal-binding label, static pentamers, neighborhood associations and a fusion
    selection do not establish a native YbjQ metal-binding or assembly mechanism.
  evidence:
  - reference: PMID:14973045
    supports: PARTIAL
    evidence_source: primary_fusion_selection
    explanation: Table 1 includes YbjQ/b0866, but its fragment boundaries and clone-specific insert-dependence
      controls were not recovered. Selected lambda-repressor fusions can reflect indirect association
      or false positives; native pentamer stoichiometry was not measured by this assay.
  - reference: https://grs.uncg.edu/wp-content/uploads/2025/03/2025-Showcase-Directory.pdf
    supports: PARTIAL
    evidence_source: primary_conference_abstract
    explanation: Page 3, poster 35 reports predictions, expression/purification and ongoing metal-binding
      assays, not a finished metal-binding result with verified member and construct mapping.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: Recover the original fusion clone and controls, inspect member-specific binding/stoichiometry
    data and map deposited constructs to reference sequences. Do not infer a causal conformational transition
    from different static structures. Keep YbjQ/b0866 distinct from YjbQ/b4056/PF01894; the Leptospirillum
    and Sodalis thiamine nomenclature discrepancies need sequence-based resolution before transfer.
- discussion_id: duf74-rv1762c-revision-and-negative-context
  prompt: Retain the Rv1762c revision and nonsignificant pooled result before adding an oxidative-protection
    mechanism.
  kind: CURATION_TODO
  status: OPEN
  rationale: Co-purification is not direct encapsulation. An individual-mutant result was removed during
    review, and the published pooled Tn-seq result is not significant.
  evidence:
