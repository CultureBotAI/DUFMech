    supports: PARTIAL
    evidence_source: primary_figure_supplement_and_peer_review
    explanation: Figure 1D reports MS co-purification. The author response confirms removal of uncomplemented
      Rv1762c mutant data with an unresolved encapsulation link. Supplement sheet TnSeq H2O2 low pH, row
      1802 (RVBD_1762c), gives log2 FC +0.52, p=0.3979 and adjusted p=1; it is not an observed increase
      edge.
  - reference: https://www.ebi.ac.uk/interpro/api/entry/pfam/protein/uniprot/O06797/
    supports: SUPPORT
    evidence_source: current_partial_domain_mapping
    explanation: H37Rv O06797 is 262 aa, equal to NP_216278.1 and CCP44528.1, with partial PF01906 provider
      matches at 65-123 and 170-244. Whole-protein annotation is not domain-specific functional proof.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: Final Figure 2F is Cfp29 complementation, not Rv1762c. Nichols2020 thesis Figure 3.5F was not
    inspected and is not independent replication. Seek Rv1762c-specific primary controls and direct cargo/function
    evidence; preserve assay-specific nonsignificance without claiming no effect in every condition. Do
    not transfer DyP/Cfp29 effects to this protein or to all PF01906 members.
causal_graphs:
- graph_id: ybjq-joint-deletion-relative-growth-2014
  title: YbjQ joint deletions alter colony growth relative to multiplicative expectations
  scope: Babu2014 Table S2; all ten exact b0866__ybjQ recipient rows, each a separate joint genotype.
  context: Hfr Cavalli donor deletion::Cm transferred into a Keio F- recipient deletion::Kan; rich LB
    with dual selection, 36 h outgrowth at 32 C. Protocol S2 reports two screens, four biological recipient
    colonies and eight measurements per pair.
  family_mapping: E. coli K-12 YbjQ P0A8C1, sequence version 1, equals NP_415387.1 and AAC73953.1; 107
    aa with PF01906 at 1-105. b0866/JW0850 reference identity is not independent sequencing of the historical
    assay clone. YbjQ is distinct from YjbQ/b4056/PF01894.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: Normalized double-mutant colony growth is compared with multiplicative expected fitness
    from the single mutants, not WT or the addition of one deletion. Positive scores are not WT rescue
    or faster absolute growth. All ten donors are non-essential and labeled This Study in Table S1; Table
    S16 verifies their Hfr Cavalli deletion::Cm context. Raw colony images, row-specific dispersion, exact
    clone sequences and allele-specific rescue were not inspected. Marker, polar and secondary-mutation
    effects remain alternatives; no gene-to-gene interaction mechanism, heavy-metal binding or Fe-S chemistry
    is inferred.
