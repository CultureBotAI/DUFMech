description: This family consists of several eukaryotic proteins. Suppressor of IKBKE 1 (SIKE) is a physiological
  suppressor of IKK-epsilon and TBK1, which are two IKK-related kinases involved in virus- and TLR3-triggered
  activation of interferon regulatory factor 3 (IRF-3). Other members of this family are circulating cathodic
  antigen (CCA), found in Schistosoma mansoni (Blood fluke) [[cite:PUB00011317],[cite:PUB00059263]], and
  FGFR1 oncogene partner 2, which may be involved in wound healing pathway [[cite:PUB00059262]].
