description: This is a family of proteins that from part of the condensin complex that regulates chromosome
  segregation. This is the A subunit, which binds to the ScpB subunit, [pfam:PF04079], and SMC, [pfam:PF02463],
  to participate in chromosomal partition during cell division [[cite:PUB00109191],[cite:PUB00109192]].
  The condensin complex pulls DNA away from the mid-cell into both cell halves [[cite:PUB00020315]]. These
  proteins are part of the Kleisin superfamily.
