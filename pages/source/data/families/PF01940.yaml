description: Members of this family have several predicted transmembrane helices. One member of the family
  has been characterised as protein PGR (AtPGR). PGR is suggested to be a potential glucose-responsive
  regulator in carbohydrate metabolism in plants. This entry also includes protein VTE6, which is a Pphytyl-phosphate
  kinase catalysing the conversion of phytyl-monophosphate to phytyl-diphosphate [[cite:PUB00092523]].
