description: Membrane-anchored junction protein (MAJIN) is a meiosis-specific telomere-associated protein
  involved in meiotic telomere attachment to the nucleus inner membrane, a crucial step for homologous
  pairing and synapsis. It is a component of the MAJIN-TERB1-TERB2 complex, which promotes telomere cap
  exchange by mediating attachment of telomeric DNA to the inner nuclear membrane and replacement of the
  protective cap of telomeric chromosomes [[cite:PUB00077546]].
