description: This domain is specific to the human splicing factor 3b subunit 2 and it's orthologues. Splicing
  factor 3b subunit 2 or SAP145 is a suppressor of U2 snRNA mutations. Pre-mRNA splicing is catalysed
  by a large ribonucleoprotein complex called the spliceosome. Spliceosomes are multi-component enzymes
  that catalyse pre-mRNA splicing and form step-wise by the ordered interaction of UsnRNPs and non-snRNP
  proteins with short conserved regions of the pre-mRNA at the 5' and 3' splice sites and branch site
  [[cite:PUB00013034]].
