description: This domain is found in Golgi associated RAB2 interactor proteins and it is likely a Rab2B-binding
  domain [[cite:PUB00100833],[cite:PUB00100832],[cite:PUB00100834]]. Some members included in this entry,
  such as GAR1A/B and GAR2, are RAB2B effector proteins required for accurate acrosome formation and normal
  male fertility [[cite:PUB00100833],[cite:PUB00100834]]. GARI-L4 is a RAB2B effector protein required
  for the compacted Golgi morphology [[cite:PUB00100832]]. GARIL5 is a Rab2B effector protein which promotes
  cytosolic DNA-induced innate immune responses [[cite:PUB00100835]].
