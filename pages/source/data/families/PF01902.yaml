description: This entry represents the N-terminal domain of Diphthamide synthase. Diphthamide synthase
  catalyses the last amidation step of diphthamide biosynthesis using ammonium and ATP. Diphthamide synthase
  is evolutionarily conserved in eukaryotes. Diphthamide is a post-translationally modified histidine
  residue found on archaeal and eukaryotic translation elongation factor 2 (eEF-2) [[cite:PUB00073561]].
  In some members of this family e.g. [swissprot:Q12429], this domain is associated with [pfam:PF01042].
  The enzyme classification is [ec:6.3.1.14].
