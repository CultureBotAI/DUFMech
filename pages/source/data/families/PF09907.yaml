description: HigB_toxin is a family of RelE-like prokaryotic proteins that function as mRNA interferases.
  HigB cleaves translated mRNA only, and cleavage depended on translation of the target RNAs. HigB belongs
  to the RelE super-family of RNases. The toxin-antitoxin gene-pair is induced by environmental stress
  factors.
