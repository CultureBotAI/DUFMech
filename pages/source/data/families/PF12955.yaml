description: This entry represents the C-terminal domain (previously known as DUF3844) of the uncharacterised
  endoplasmic reticulum membrane protein C1709.03 which was renamed to vacuolar sorting protein Vps3844
  [[cite:PUB00156045]]. This domain contains eight largely conserved cysteine residues and the region
  comprising amino acids 354 to 380 is important for protein trafficking to the vacuole. This protein
  is conserved in fungi, particularly S. pombe, but lacks representation in S. cerevisiae [[cite:PUB00156045]].
