description: This family of uncharacterised proteins from Clostridia and Bacilli classes has an unusual
  structure of three beta propeller repeats that do not form a barrel, as in well known 6-, 7- etc beta
  propeller barrels, but instead are stacked in a three-layer beta-sheet sandwich. The function of all
  the proteins from this family is unknown.
