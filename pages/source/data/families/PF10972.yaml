description: CsiV, a small periplasmic protein (cell-shape integrity in Vibrio), is essential for growth
  of Vibrio cholerae in the presence of DAA, non-canonical amino-acids, the typical components of peptidoglycan
  side-chains in Vibrio cholerae. CsiV interacts with LpoA, the lipoprotein activator of penicillin-binding-protein1A
  that is necessary for mediating the assembly of peptidoglycan. CsiV acts through LpoA to promote peptidoglycan
  biogenesis in V. cholerae and other vibrio species as well as in the other genera where this protein
  is found [[cite:PUB00075620]].
