description: This represents a family of archaeal, bacterial and eukaryotic glycosyl hydrolases, that
  belong to superfamily GH116. The primary catabolic pathway for glucosylceramide is catalysis by the
  lysosomal enzyme glucocerebrosidase. In higher eukaryotes, glucosylceramide is the precursor of glycosphingolipids,
  a complex group of ubiquitous membrane lipids [[cite:PUB00044658]]. Mutations in the human protein cause
  motor-neurone defects in hereditary spastic paraplegia [[cite:PUB00078737]]. The catalytic nucleophile,
  identified in UniProtKB:Q97YG8_SULSO, is a glutamine-335, with the likely acid/base at Asp-442 and the
  aspartates at Asp-406 and Asp-458 residues also playing a role in the catalysis of glucosides and xylosides
  that are beta-bound to hydrophobic groups. The family is defined as GH116, which presently includes
  enzymes with beta-glucosidase, [ec:3.2.1.21], beta-xylosidase, [ec:3.2.1.37], and glucocerebrosidase
  [ec:3.2.1.45] activity [[cite:PUB00044658],[cite:PUB00073615]].
