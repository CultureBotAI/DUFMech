description: This domain is found at the N-terminal end of Scytalone dehydratase-like protein Arp1 from
  Metarhizium brunneum and similar fungal proteins. Arp1 is part of the Pks2 gene cluster that encode
  for proteins that mediate the formation of infectious structures (appressoria), enabling these fungi
  to kill insects faster [[cite:PUB00095155]]. This domain is predicted to fold into a partly open beta-barrel
  capped with two helices on one side.
