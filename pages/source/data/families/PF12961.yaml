description: The search results from NCBI sequence alignment indicates a conserved domain belonging to
  ASCH superfamily [[cite:PUB00044668]]. Dali searching results show that the protein is a structurally
  similar to the PUA domain, suggesting it may be involved in RNA recognition. It has been reported that
  the deletion of PUA genes results in impaired growth (RluD) and competitive disadvantage (TruB) in Escherichia
  coli. Suggestions have been put forward that, apart from their usual catalytic role, certain PUS enzymes
  (e.g. TruB) may also act as chaperones for RNA folding. The interface interaction indicates that the
  biomolecule of protein NP_809782.1 should be a dimer.
