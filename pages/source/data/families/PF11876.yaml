description: This entry represents bacterial immunity proteins that in are encoded by the PAAR2 cluster
  [[cite:PUB00103837]] and have been named Type VI immunity for VRR-NUC (TsiV). These proteins form an
  effector-immunity pair with TseV (type VI effector VRR-NUC), the TseV-TsiV pair [[cite:PUB00103837],[cite:PUB00103836]].
  These are alpha+beta class of proteins whose surface is mainly electronegative with a a hydrophobic
  core formed by the N-terminal region [[cite:PUB00103837]].
