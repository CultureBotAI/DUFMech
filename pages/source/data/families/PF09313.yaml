description: This domain, previously known as DUF1971, is found at the N-terminal associated with [pfam:PF03848],
  and covering the whole length of the sequence in other bacterial uncharacterised proteins. TehB plays
  a role in both resistance to oxidative damage and haem uptake/utilisation, and is important for virulence
  of this organism in an animal model of invasive disease. It also protects H.influenzae from tellurite
  exposure in vitro [[cite:PUB00161042]]. In Escherichia coli, TehB is thought to utilise a methyltransferase
  activity in the detoxification of tellurite [[cite:PUB00014885]].
