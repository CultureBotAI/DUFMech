description: 'This family (previously known as DUF5309) represents the bacteriophage SU10 major capsid
  protein and related proteins found in phages and bacteriophages. The capsid of SU10 is organised in
  fivefold symmetry and build from 715 copies of major capsid protein [[cite:PUB00153713]]. The major
  capsid protein of SU10 adopts an HK97 fold, which is common among tailed bacteriophages and herpesviruses
  [[cite:PUB00153713]]. This protein forms a capsomers of two types: pentamers and hexamers.'
