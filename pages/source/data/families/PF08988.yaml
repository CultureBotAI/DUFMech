description: T3SS_needle_E is a family of proteins from the operon that builds and controls the needle
  of the injection system of type III secretion. The YscE protein, produced by the pathogen Yersinia,
  assumes a secondary structure composed of two anti-parallel alpha-helices separated by a flexible loop
  [[cite:PUB00049490]]. The family is cytoplasmic and may help to stabilise and prevent early polymerisation
  of the needle-protein F [[cite:PUB00048615],[cite:PUB00109133]].
