description: This domain is found at the C-terminal of FecR [[cite:PUB00151597],[cite:PUB00016138]], which
  adopts a secretin N0-like fold [[cite:PUB00151597]]. FecARI are responsible for induction of the ferric
  citrate uptake system. When ferric citrate binds FecA, a signal is transmitted across the outer membrane
  to FecR, a cytoplasmic membrane protein that transmits signal across the membrane and activates the
  sigma-70 family protein FecI [[cite:PUB00016138]].
