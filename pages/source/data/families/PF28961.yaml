description: This entry represents an N-terminal putative sensor domain found in histidine kinase proteins.
  This domain precedes the histidine kinase A (HisKA) phosphoacceptor domain ([pfam:PF00512]) and the
  histidine kinase ATPase C-terminal domain ([pfam:PF02518]). The domain is approximately 145-155 residues
  in length. This family is found predominantly in Bacteroidota, particularly in the orders Flavobacteriales,
  Cytophagales and Sphingobacteriales. The function of this sensor domain remains to be determined.
