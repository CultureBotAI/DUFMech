description: This entry represents the DNA binding domain (DBD) present in GLABROUS1 enhancer-binding
  protein (GeBP) and GeBP-like proteins, such us storekeeper and storekeeper-like (STKL) transcription
  factors. GeBP and GeBP-like proteins play a redundant role in cytokinin hormone pathway regulation [[cite:PUB00153966],[cite:PUB00153967],[cite:PUB00081457]].
  Storekeeper was identified as a B-box motif binding factor that regulates expression of patatin, a storage
  protein in potato [[cite:PUB00081460]]. Storekeeper-like transcription factors STKL1 and STKL2 function
  as transcription factors in the glucose signalling pathway [[cite:PUB00081459]]. The overall predicted
  structure of this DNA binding domain (DBD) reveals a bundle of four helices, with helices alpha1 to
  alpha3 making up a single myb-type helix-turn-helix (HTH) domain.
