description: This family consists of several Calicivirus VP2 proteins [[cite:PUB00097361]]. VP2 is a minor
  capsid protein encoded by all caliciviruses. forms a large portal-like assembly at a unique three-fold
  axis of symmetry, following receptor engagement. This assembly-which was not detected in undecorated
  virions-is formed of twelve copies of VP2, arranged with their hydrophobic N termini pointing away from
  the virion surface.
