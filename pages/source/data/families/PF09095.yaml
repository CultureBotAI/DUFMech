description: This entry represents a domain found in prokaryotic alpha-amylase and 4-alpha-glucanotransferase.
  It adopts a beta-sandwich fold, in which two layers of anti-parallel beta-sheets are arranged in a nearly
  parallel fashion. The exact function of this family is, as yet, unknown, however it has been proposed
  that they may play a role in transglycosylation reactions [[cite:PUB00014074]].
