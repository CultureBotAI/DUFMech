description: AveC catalyzes the stereospecific spiroketalization of a dihydroxy-ketone polyketide intermediate
  in the biosynthetic pathway of Avermectin, a potent antiparasitic agent. Additionally, it has a unique
  dehydration activity that serves to determine the regiospecific saturation pattern for spiroketal diversity
  [[cite:PUB00081205]]. MeiC, the counterpart in the biosynthesis of AVE-like meilingmycin, also has spirocyclase
  activity, but lacks the dehydratase activity.
