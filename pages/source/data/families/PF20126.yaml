description: This entry represents a family of proteins found in archaea and bacteria. These proteins
  have been recently described as the toxin component TumE from the novel toxin-antitoxin system TumA,
  which constitutes a translation-targeting toxic effector [[cite:PUB00154744]]. These proteins are predicted
  to adopt a conserved alpha+beta fold, where two alpha-helices pack against an antiparallel beta-sheet
  with seven strands [[cite:PUB00154744]].
