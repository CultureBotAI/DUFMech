description: This family is found in various Platyhelminthes, with many of the sequences annotated as
  being the polyprotein of the transposon Ty3-I Gag-Pol. However, the genomic location of other members
  suggests that this region is not always found in a transposon. The family members are characterised
  by a highly conserved DxDxDxCC motif. The function of this family is currently unknown.
