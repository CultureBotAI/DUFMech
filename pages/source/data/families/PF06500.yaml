description: The FrsA-like family includes FrsA, an esterase found to have the alpha/beta-hydrolase fold
  [[cite:PUB00094022],[cite:PUB00094021],[cite:PUB00058796]]. t also includes the hydrolytic polyketide
  shortening protein Ayg1 from fungi [[cite:PUB00080691]], 2,6-dihydropseudooxynicotine hydrolase from
  Paenarthrobacter nicotinovorans [[cite:PUB00041915]] and Fus2 from Gibberella species [[cite:PUB00082317]].
  The enzyme 2,6-dihydroxy-pseudo-oxynicotine hydrolase is involved in the nicotine-degradation pathway
  of Arthrobacter nicotinovorans [[cite:PUB00041915]]. Fus2 is part of the gene cluster that mediates
  the biosynthesis of the mycotoxin fusarin C. Fus2 catalyses closure of the 2-pyrrolidone ring of the
  intermediate 20-hydroxy-prefusarin to form another intermediate, 20-hydroxy-fusarin, which is then oxidized
  by Fus8 [[cite:PUB00082317]].
