description: This entry represents an uncharacterized protein domain found in phage, predominantly those
  infecting bacteria in the Enterobacteriaceae family such as Escherichia, Salmonella, Klebsiella and
  Vibrio. The protein is typically around 80 to 100 amino acids in length. In some phage the protein contains
  a predicted central coiled-coil region. The function of this protein family is currently unknown.
