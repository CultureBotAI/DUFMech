description: This is the conserved C-terminal domain of Vasopressin V1a/b receptors (V1R), which is involved
  in receptor trafficking and facilitates the interaction between the intracellular loops of the receptor,
  the G proteins and coupling to phospholipase C [[cite:PUB00038629],[cite:PUB00098105]]. This domain
  is unstructured and may reflect its conformational plasticity that may be necessary for proper function
  of V1R [[cite:PUB00038629]].
