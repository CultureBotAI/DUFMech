description: This family of proteins is found in bacteria, archaea and viruses. Proteins in this family
  are typically between 101 and 135 amino acids in length. There is a completely conserved aspartate and
  a conserved EXNP motif that may be functionally important. These and others residues form a deep pocket
  that may bind to an as yet unidentified ligand. This family is related to [pfam:PF01889].
