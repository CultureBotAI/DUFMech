description: This domain appears to be found only in a small family of Chlamydia species [[cite:PUB00097825]].
  It is usually found repeated. This domain can be found in translocated actin-recruiting phosphoprotein
  (Tarp) from Chlamydia trachomatis serovar L2. Tarp appears to initiate or participate in signalling
  events that regulate the actin recruitment, which ultimately leads to internalisation [[cite:PUB00075564]].
