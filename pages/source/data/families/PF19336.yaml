description: This family represents a domain of unknown function located between the Transcription factor
  IIIC subunit delta N-term ([pfam:PF12657]) and the Putative zinc-finger of transcription factor IIIC
  complex ([pfam:PF12660]) within the transcription Factor IIIC 90 kDa subunit (TFIIIC-delta/TFIIIC90,
  also known as general transcription factor 3C polypeptide 4). TFIIIC is a multisubunit complex that
  directly recognises promoter elements and recruits TFIIIB and RNA polymerase III, being absolutely required
  for RNA polymerase III transcription. TFIIIC90 has an intrinsic histone acetyltransferase activity with
  a substrate specificity for histone H3 [[cite:PUB00056254]]. This domain is likely to be involved in
  the interaction with other components of the TFIIIC complex.
