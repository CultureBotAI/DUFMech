description: This entry represents the N-terminal, pre-PUA domain of yeast 60S ribosome subunit biogenesis
  protein NIP7 and homologues, some uncharacterised proteins from the UPF0113 family and similar sequences
  from eukaryotes and some archaeal species. NIP7 is required for proper 27S pre-rRNA processing and 60S
  ribosome subunit assembly. This domain is found associated with [pfam:PF03657].
