description: RIBIOP_C is a family of eukaryotic proteins from the C-terminus of pre-rRNA-processing protein
  or ribosome biogenesis proteins BMS1 and TSR1. These proteins act, in the nucleolus, as a molecular
  switch during maturation of the 40S ribosomal subunit [[cite:PUB00072548],[cite:PUB00072547]]. This
  domain, domain IV of translation elongation factor selb, adopts the same fold as translation proteins
  such as domain II of GTP-elongation factor Tu proteins [[cite:PUB00038060]].
