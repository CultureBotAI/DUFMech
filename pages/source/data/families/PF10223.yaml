description: This entyr includes proteins FAM151A and FAM151B, the mammalian homologues of C. elegans
  menorin which is involved in generation of neurons and regulation of dendrite extension [[cite:PUB00100987],[cite:PUB00100988]].
  FAM151B has been shown to be essential for retinal function [[cite:PUB00100987]]. Sequence analysis
  and the fact that these proteins have a TIM-barrel fold similar to that in phospholipase D and glycerophosphodiester
  phosphodiesterase (GDPD) families, indicate that they belong to PLC-like phosphodiesterase superfamily,
  although their substrates and function remain unknown. According to structure predictions, this domain
  is found at the N-terminal of menorin while in FAM151A is found twice and in FAM151B which is much shorter,
  it is the only domain present.
