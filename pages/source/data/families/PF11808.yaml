description: This family is only found in bacteria. Family members include PhoR. A member of the two-component
  regulatory system PhoR/PhoB involved in the phosphate regulon genes expression. PhoR is the bifunctional
  histidine autokinase/phospho-PhoB phosphatase that donates a phosphoryl group to PhoB when environmental
  Pi is limiting and removes the phosphoryl group from phosphorylated PhoB (PhoB-P) when environmental
  Pi is abundant [[cite:PUB00076908]].
