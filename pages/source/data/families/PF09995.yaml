description: This is the catalytic domain found in the endoplasmic reticulum (ER) -bound oxygenases mpaB'
  (MPAB2) and mpaB (MPAB) from Penicillium roqueforti and Penicillium brevicompactum and in the rubber
  oxygenase (Lcp) from Streptomyces sp., which contains highly conserved arginine and histidine residues.
  Structural analysis from Lcp revealed that Arg164, Thr168 and His198 are crucial active site residues
  [[cite:PUB00087009]]. The mpaB and mpaB' are part of the gene cluster that mediates the biosynthesis
  of mycophenolic acid (MPA) [[cite:PUB00096709]]. Lcp (Latex clearing proteins) is a rubber oxygenase
  that catalyses the extracellular cleavage of poly (cis-1,4-isoprene) [[cite:PUB00087009],[cite:PUB00096710]].
  This domain is also present in uncharacterised proteins from Mycobacterium sp. and hypothetical proteins,
  mainly from bacteria and fungi.
