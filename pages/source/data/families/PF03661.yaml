description: This is an integral membrane protein family. Family members include TMEM33/Pom33 proteins.
  Budding yeast Pom33 is a transmembrane nucleoporin that contributes to proper distribution and/or efficient
  assembly of nuclear pores [[cite:PUB00075311]]. Proteins in this entry also include Tts1 from fission
  yeasts [[cite:PUB00075313]], Kr-h2 (krueppel homologue 2) from flies [[cite:PUB00075314]] and TMEM33
  from vertebrates [[cite:PUB00085045]]. Tts1 is required for the correct positioning of the cellular
  division plane by delimiting the actomyosin ring assembly at the cell equator [[cite:PUB00075313]].
  Kr-h2 is a member of the dosage-dependent hierarchy effective upon white gene expression [[cite:PUB00075314]].
  TMEM33 regulates the tubular structure of endoplasmic reticulum by suppressing the membrane-shaping
  activity of reticulons [[cite:PUB00085045]].
