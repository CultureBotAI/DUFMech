description: This family of proteins is functionally uncharacterised. This family of proteins is mainly
  found in bacteria and archaea. Proteins in this family are around 100 amino acids in length. There are
  two conserved sequence motifs, CGxxxCxC containing three conserved Cys residues and HGP. AlphaFold3
  predicts a confident homodimer for A0A133VII6 (ipTM=0.82 pTM=0.83). These proteins have a positively
  charged surface patch and some members appear likely to bind DNA according to AlphaFold 3 predictions.
  This family is related to [pfam:PF07913].
