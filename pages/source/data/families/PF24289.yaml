description: This entry represents a domain consisting of a novel repeat fold which containing five repeats,
  each of them comprising three antiparallel beta-strands and a short alpha-helix, according to structure
  predictions (e.g SwissProt:S8CFV9). This domain is found in Casein kinase 1-like protein HD16 from rice,
  a protein involved in the regulation of flowering time through gibberellin (GA) signaling and independently
  of photoperiod [[cite:PUB00155615]].
