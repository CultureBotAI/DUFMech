description: This domain is found in uncharacterised proteins from proteobacteria. It is predicted to
  fold into a partly open beta-barrel elaborated with alpha-helices. It is frequently found with [pfam:PF05567],
  a domain typical for Type IV pilus biogenesis factor PilY1 homologues. It contains two highly conserved
  cysteine residues which are predicted to form disulfide bond.
