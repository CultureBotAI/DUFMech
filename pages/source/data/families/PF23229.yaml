description: This domain is found in two tandem copies in the Alpha-glucan water dikinase (GWD1 and GWD2)
  from Arabidopsis thaliana and related proteins. It is predicted to adopt a globular structure consisting
  of three helical bundle. GWD1 is involved in the incorporation of phosphate into starch-like alpha-glucan,
  mostly at the C-6 position of glucose units [[cite:PUB00153995]]. This enzyme acts as regulator of starch
  mobilization by controlling the phosphate content of starch. The function of the domain represented
  in this entry is unknown.
