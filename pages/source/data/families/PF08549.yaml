description: This entry represents the N-terminal domain of SWI/SNF and RSC complexes subunit Ssr4 from
  S. pombe, a essential member of the chromatin structure remodelling complex (RSC) and the SWI/SNF complex
  [[cite:PUB00066307],[cite:PUB00101211]]. The structure of this domain revealed that it has a novel fold
  comprising an antiparallel beta-sheet of seven strands with alpha-helices on one side and random coil
  on the other [[cite:PUB00101211]]. It contains the highly conserved motif WxxxxxPxxGxxxxxxxxxxxxxxxDG.
  RSC is involved in transcription regulation and nucleosome positioning which controls, particularly,
  membrane and organelle development genes. The ATP-dependent chromatin remodelling complex SWI/SNF is
  required for the positive and negative regulation of gene expression of a large number of genes through
  the regulation of nucleosome remodelling [[cite:PUB00066307]].
