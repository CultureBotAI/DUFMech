description: This domain is found in uncharacterised bacterial proteins. It is usually associated with
  von Willebrand factor type A domain (e.g. [pfam:PF00092]), which is inserted into the domain core. Members
  of this entry are likely to contain an intramolecular isopeptide bond. The domain represented by this
  entry is predicted to fold into a beta-sandwich but does not include the two N-terminal strands that
  precede the von Willebrand factor type A domain.
