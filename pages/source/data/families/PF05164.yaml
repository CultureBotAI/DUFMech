description: ZapA is a cell division protein which interacts with FtsZ. FtsZ is part of a mid-cell cytokinetic
  structure termed the Z-ring that recruits a hierarchy of fission related proteins early in the bacterial
  cell cycle. The interaction of FtsZ with ZapA drives its polymerisation and promotes FtsZ filament bundling
  thereby contributing to the spatio-temporal tuning of the Z-ring [[cite:PUB00021077]][[cite:PUB00021078]].
