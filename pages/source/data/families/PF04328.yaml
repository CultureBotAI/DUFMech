description: This entry includes a group of putative selenoproteins from Proteobacteria, Actinobacteria
  and Firmicutes. The invariant cysteine at the C terminus is encoded by a TGA Sec codon in some Epsilonproteobacteria,
  suggesting a redox activity for the protein[[cite:PUB00081206]]. Some members of this family have been
  suggested to be required for pyruvate transport in diverse bacteria, along with a CstA-like transporter
  found adjacent in the genome (see Supplementary note 5 in [[cite:PUB00093610]].)
