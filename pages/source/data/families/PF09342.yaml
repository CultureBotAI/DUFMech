description: This domain is found in Nudel from Drosophila melanogaster and related proteins. Nudel is
  involved in defining embryonic dorsoventral polarity. Three proteiases ndl, gd and snk process easter
  to create active easter. Active easter defines cell identities along the dorsal-ventral continuum by
  activating the spz ligand for the Tl receptor in the ventral region of the embryo. Nudel, pipe and windbeutel
  together trigger the protease cascade within the extraembryonic perivitelline compartment which induces
  dorsoventral polarity of the Drosophila embryo [[cite:PUB00054161]].
