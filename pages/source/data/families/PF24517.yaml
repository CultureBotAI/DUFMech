description: This entry represents a CBM domain, a member of CBM96 family, found in functionally diverse
  multi-domain proteins including tRNA nuclease WapA, alginate lyase from Defluviitalea phaphyphila and
  chondroitinase from Dysgonomonas sp. The CBM96 domain from the latter proteins, has been structurally
  characterised. It fold into a beta-sandwich with significant structural similarity to nucleoplasmin
  (PDB:8WAB, PDB:7VBO) [[cite:PUB00159883]].
