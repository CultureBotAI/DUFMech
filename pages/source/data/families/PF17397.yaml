description: This is a family of unknown function found in Chordata. This domain is located downstream
  the N-terminal of Fip1 [pfam:PF05182]. Family members such as [swissprot:P70537] and [swissprot:P70675]
  contain this domain. The Tsx gene resides at the X-inactivation centre and once thought to encode a
  protein expressed in testis. However, this was disputed upon further analysis. ORF and immunostaining
  analysis concluded that Tsx may be non-coding. Tsx long transcript is abundantly expressed in meiotic
  germ cells, embryonic stem cells, and brain. In vertebrates, Fip1 is the evolutionary precursor of eutherian
  Tsx, hence its location upstream from the Tsx gene [[cite:PUB00085337]].
