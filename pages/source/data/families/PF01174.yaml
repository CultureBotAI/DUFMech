description: This family and its amidotransferase domain was first described in [[cite:PUB00020352]].
  It is predicted that members of this family are involved in the pyridoxine biosynthetic pathway, based
  on the proximity and co-regulation of the corresponding genes and physical interaction between the members
  of [pfam:PF01174] and [pfam:PF01680] [[cite:PUB00007176]].
