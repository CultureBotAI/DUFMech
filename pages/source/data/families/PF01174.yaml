causal_graphs:
- graph_id: pdxt-untagged-partner-dependent-glutaminase
  title: PdxS increases the glutaminase readout of untagged PdxT
  scope: Purified untagged Bacillus subtilis 168 YaaE/PdxT with YaaD/PdxS in Raschle 2005 supplement S2A
    and main Results. The bovine reporter enzyme is a separate component.
  context: 300 ul, 4 uM YaaE, 4 uM YaaD when present, 10 mM glutamine, 50 mM Tris-Cl pH 8.0, 0.5 mM APAD
    and 7 U bovine glutamate dehydrogenase; 37 C. Measure the increase at 363 nm after glutamine addition.
  family_mapping: P37528/PDXT_BACSU, 196 aa, sequence version 1, matches InterPro exactly with PF01174
    at 6-188. The study cloned strain-168 genomic yaaE, verified constructs by sequencing and purified
    proteins by N-terminal sequencing. Primer ends match MLTIGVL and EYKQKALV. Untagged activity preparations
    differ from His6-YaaE used for pull-out assays.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:224308
  limitations: APAD reduction is a coupled glutamate readout, not direct observation of ammonia channeling.
    Individual-protein controls remain near background; this is an assay-specific bound, not universal
    absence of intrinsic activity. The 2004 SMY His6 preparations and their pH/temperature are not transferred.
  nodes:
