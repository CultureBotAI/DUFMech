  - node_id: yaae-coupled-glutaminase-readout
    label: Glutamate-dependent APAD reduction in the coupled YaaE assay
    node_type: ACTIVITY
    grounding:
    - UniProtKB:P37528
  edges:
  - edge_id: partner-increases-yaae-glutaminase-readout
    subject: add-yaad-to-yaae-glutamine
    predicate: increases
    object: yaae-coupled-glutaminase-readout
    mechanism: The joint YaaD/YaaE preparation shows greater glutamine-dependent reporter turnover than
      YaaE alone. The causal intervention is partner addition; atomic allostery and ammonia transport
      are not independently observed here.
    directness: DIRECT
    support: OBSERVED
