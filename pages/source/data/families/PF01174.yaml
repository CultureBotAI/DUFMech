- graph_id: pdxst-acivicin-plp-signal-inhibition
  title: Acivicin exposure reduces the glutamine-supported PLP synthesis signal
  scope: Figure 3C's separate 40-uM YaaD/YaaE product assay with glutamine as nitrogen donor, not the
    lower-concentration glutaminase assay or an external-ammonium comparison.
  context: 40 uM each untagged protein, 0.04-5 mM acivicin in 50 mM Tris-Cl pH 8.0 at 37 C; Methods describe
    60 min exposure. Measure A414 synthesis with 0.5 mM ribose 5-phosphate, 0.5 mM DHAP and 10 mM glutamine,
    relative to untreated activity.
  family_mapping: Strain-168 YaaE is P37528-associated PdxT, PF01174 6-188. YaaD supplies the separate
    synthase activity. Both proteins remain in the treated assay mixture.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:224308
  limitations: The graph does not assign the entire loss specifically to one covalent bond, exclude all
    effects on YaaD/reporting chemistry, or demonstrate inhibition in cells. The A414 signal is a relative
    activity readout; product identity is independently supported in the untreated preparative experiment.
  nodes:
  - node_id: acivicin-pretreat-plp-mixture
    label: Expose the YaaD/YaaE synthesis mixture to increasing acivicin
    node_type: PERTURBATION
  - node_id: residual-glutamine-plp-signal
    label: Residual glutamine-supported A414 synthesis activity
    node_type: ACTIVITY
  edges:
  - edge_id: acivicin-decreases-glutamine-plp-signal
    subject: acivicin-pretreat-plp-mixture
    predicate: decreases
    object: residual-glutamine-plp-signal
    mechanism: Increasing acivicin exposure reduces the normalized product-associated signal in the joint
      glutamine-supported reaction. It is a separate measured endpoint, not a transitive edge inferred
      only from glutaminase inhibition.
    directness: DIRECT
