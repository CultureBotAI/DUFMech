- graph_id: pdxst-glutamine-dependent-plp-product
  title: Joint PdxS and PdxT reactions produce PLP
  scope: Untagged strain-168 YaaD/YaaE with glutamine and phosphorylated carbohydrate substrates. Product
    identity is supported by orthogonal analyses, not only the Tris-dependent absorbance signal.
  context: 40 uM each protein, 50 mM Tris-Cl pH 8.0, 37 C, 10 mM glutamine, 0.5 mM ribose 5-phosphate
    and 0.5 mM dihydroxyacetone phosphate. A414 monitors the product-associated Tris Schiff base; deproteinized
    product is additionally examined by HPLC, MS, chemical spectral shifts and supplemental 600-MHz NMR.
  family_mapping: YaaE/PdxT is P37528-associated strain-168 protein, PF01174 6-188; YaaD is the separate
    synthase. Both whole proteins and all listed substrates form a joint input, not a claim that PdxT
    alone synthesizes PLP.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:224308
  limitations: No directly tracked ammonia channel or atomic catalytic sequence is inferred. Figure 1A/B
    captions say 1 mM glutamine whereas Methods/Results say 10 mM; exact fitted kinetics are not assigned
    to this graph. Supplemental NMR identifies an unknown 3.75-ppm contaminant. Raw spectra and historical
    clones were not independently reanalyzed.
  nodes:
  - node_id: joint-pdxst-glutamine-carbohydrate-reaction
    label: Joint YaaD, YaaE, glutamine, ribose 5-phosphate and DHAP reaction
    node_type: ACTIVITY
    grounding:
    - UniProtKB:P37528
  - node_id: identified-plp-product
    label: Reaction product identified as pyridoxal 5-phosphate
    node_type: STATE
  edges:
  - edge_id: pdxst-joint-reaction-produces-plp
    subject: joint-pdxst-glutamine-carbohydrate-reaction
    predicate: produces
    object: identified-plp-product
    mechanism: The reconstituted reaction produces material matching authentic PLP by chromatography,
      spectral behavior, mass and NMR. This establishes net product formation under joint-input conditions
      without treating each biochemical intermediate as observed.
    directness: DIRECT
    support: OBSERVED
    evidence_kind: EXPERIMENTAL
    evidence:
    - reference: PMID:16030023
      source_url: https://archive-ouverte.unige.ch/unige:89531
      snippet: pyridoxal
      explanation: Product Methods and Results on pages 32293-32296, Figure 2 and visually inspected supplemental
        S3 distinguish PLP from pyridoxine/pyridoxal standards.
      cache_path: evidence/PF01174/raschle-2005-pdxt.txt
      cache_sha256: d7f446303a58a75715c784a08baf140e0e1544ad165f1c4f7fd2d27873c4b197
- graph_id: pdxt-ribulose-ammonium-dependent-synthase-readout
  title: PdxT supports the ribulose-phosphate reaction with external ammonium
  scope: Figure 1C's specific ribulose 5-phosphate comparison with external ammonium sulfate, not a universal
    requirement for PdxT in ammonia-supported synthesis.
  context: 20 uM untagged YaaD with or without 20 uM YaaE, 1 mM ribulose 5-phosphate, 2 mM DL-glyceraldehyde
    3-phosphate and 10 mM ammonium sulfate; 50 mM Tris-Cl pH 8.0, 37 C; A414 time course. The ribose 5-phosphate
    condition is a separate specificity control.
  family_mapping: Strain-168 YaaE/PdxT maps to P37528 and PF01174 6-188. The coupled product readout still
    requires YaaD and the listed substrates; no isolated-domain claim is made.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:224308
  limitations: Ribose 5-phosphate supports synthesis without YaaE in the same external-ammonium experiment.
    A414 is a product-associated readout, not direct identification of an isomerase step. A role in pentulose
    isomerization is a proposal, not an observed edge.
  nodes:
