- graph_id: pdxt-acivicin-glutaminase-inhibition
  title: Acivicin exposure reduces the coupled glutaminase readout
  scope: Figure 3A's 5-mM acivicin preincubation of untagged YaaD/YaaE, assayed by glutamate-dependent
    APAD reduction. This is a biochemical treatment, not a cellular antimicrobial effect.
  context: 4 uM each YaaD/YaaE in the pH-8.0 coupled-assay buffer, 5 mM acivicin at 37 C for the displayed
    0-10 min pretreatments; add glutamine to 10 mM and monitor A363. The selected figure protocol is explicit
    despite the Methods concentration-list discrepancy.
  family_mapping: YaaE/PdxT corresponds to P37528 with PF01174 6-188. The C79-containing peptide 74-87
    matches the reference and is separately assigned as an acivicin target by MS/MS; this does not make
    every proposed atomic step observed.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:224308
  limitations: Methods list 1/2/10 mM while Figure 3 uses 5 mM and 2/5/10 mM. Caption s^-1 conflicts with
    minute-based Results/time axes; no precise inactivation rate is adopted. Raw mass/adduct chemistry
    and reporter-specific interference controls remain incompletely assessed; covalent-modification evidence
    supports, but does not replace, assay scope.
  nodes:
  - node_id: acivicin-pretreat-glutaminase-mixture
    label: Increase 5-mM acivicin pretreatment time relative to zero-time control
    node_type: PERTURBATION
  - node_id: acivicin-assay-glutaminase-readout
    label: Residual coupled glutaminase readout of YaaD/YaaE
    node_type: ACTIVITY
    grounding:
    - UniProtKB:P37528
  edges:
  - edge_id: acivicin-exposure-decreases-glutaminase-readout
    subject: acivicin-pretreat-glutaminase-mixture
    predicate: decreases
    object: acivicin-assay-glutaminase-readout
    mechanism: Longer preincubation lowers subsequent APAD-reduction activity relative to zero-time exposure.
