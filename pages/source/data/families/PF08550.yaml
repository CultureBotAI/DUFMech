description: This entry represents fungal proteins containing GATA domains, including nitrogen regulatory
  protein areA, a transcription activator that binds the consensus DNA element 5'-CGATAG-3' and mediates
  nitrogen metabolite repression [[cite:PUB00089490]]. This entry also contains the Negative regulator
  of RAS-cAMP pathway MKS1 from yeast that is thought to be a negative regulator of RAS-cAMP pathway.
