description: SepF accumulates at the cell division site in an FtsZ-dependent manner and is required for
  proper septum formation [[cite:PUB00043574]]. Mutants are viable but the formation of the septum is
  much slower and occurs with a very abnormal morphology. This family also includes archaeal related proteins
  of unknown function.
