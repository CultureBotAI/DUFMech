description: This family represents a transcriptional cell cycle regulator (TrcR) found in Proteobacteria,
  mainly Alphaproteobacteria. It has been shown to associate with promoters and coding sequences in vivo
  in a rifampicin-dependent manner and to interact physically and genetically with RNA polymerase, resulting
  in the integration of cell cycle and antibiotic stress control with the general transcriptional machinery
  [[cite:PUB00098048]].
