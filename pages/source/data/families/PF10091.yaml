description: The structure of UniProt:Q5LIB7 has an alpha/alpha toroid fold and is similar structurally
  to a number of glucoamylases. Most of these structural homologues are glucoamylases, involved in breaking
  down complex sugars (e.g. starch). The biologically relevant state is likely to be monomeric. The putative
  active site is located at the centre of the toroid with a well defined large cavity.
