description: This domain is found in PilZ domain-containing proteins from Deltaproteobacteria, such as
  swiss:Q748G9 from Geobacter sulfurreducens. This domain is located N-terminal to a canonical PilZ domain,
  with a PilZ-related structure comprising the beta-barrel fold, lacking the C-terminal alpha-helix and
  both c-d-GMP-binding motifs [[cite:PUB00098203]]. This domain also has a N-terminal loop that forms
  a short alpha-helix (3 residues) [[cite:PUB00098203]].
