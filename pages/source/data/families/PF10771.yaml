description: This family is conserved in bacteria and archaea. The function is not known. The structure
  of two proteins in this family were solved using NMR and shown to adopt a winged helix-turn-helix fold
  [[cite:PUB00075673]]. Structural analysis shows that these proteins form an unusual dimeric conformation.
  This dimer was shown to be similar to that found in the FadR and TubR wHTH domains. It was suggested
  [[cite:PUB00075673]] that these proteins are not very likely to bind to DNA.
