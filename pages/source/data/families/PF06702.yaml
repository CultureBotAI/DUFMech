description: Fam20C represents the C-terminus of eukaryotic secreted Golgi casein kinase proteins. Fam20C
  is the Golgi casein kinase that phosphorylates secretory pathway proteins within Ser-x-Glu/pSer motifs.
  Mutations in Fam20C cause Raine syndrome, an autosomal recessive osteosclerotic bone dysplasia [[cite:PUB00075539]].
