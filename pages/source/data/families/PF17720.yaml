description: This entry includes RNA ligase 1 from animals (RLIG1), which functions as an RNA ligase in
  vitro [[cite:PUB00151146]]. This protein catalyses ATP-dependent RNA ligation via a three-step mechanism,
  involving tandem auto- and RNA AMPylation. It exhibits selectivity for single-stranded RNA substrates.
  RLIG1 may play a role in maintaining RNA integrity under stress conditions, such as in response to reactive
  oxygen species (ROS) [[cite:PUB00151146]].
