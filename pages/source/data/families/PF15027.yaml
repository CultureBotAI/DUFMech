description: This domain is found at the N-terminal end of human Alpha-1,6 -mannosylglycoprotein 6-beta-N-acetylglucosaminyltransferase
  A (MGT5A) [[cite:PUB00155403]] and similar sequences mainly found in vertebrates. MGT5A is a glycosyltransferase
  family 18 enzyme that also has the catalytic region [pfam:PF15024]. This domain, which shows an all
  helical structure, plays a critical role in the recognition of glycoprotein substrates [[cite:PUB00155403],[cite:PUB00155404],[cite:PUB00155405]].
  It is also found in Coiled -coil domain-containing protein 126, a smaller sequence that only contains
  this domain.
