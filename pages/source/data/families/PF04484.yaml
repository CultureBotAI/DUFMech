description: AUG8 belongs to the plant QWRF motif-containing protein family, which also includes microtubule-associated
  protein ENDOSPERM DEFECTIVE 1 [[cite:PUB00076700],[cite:PUB00076701]] and SNOWY COTYLEDON 3 [[cite:PUB00076702]].
  AUG8 binds the microtubule plus-end and participates in the reorientation of microtubules in hypocotyls
  (the stem of a germinating seedling) [[cite:PUB00076698],[cite:PUB00076699]].
