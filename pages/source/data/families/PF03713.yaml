description: Domain found in small family of bacterial secreted proteins with no known function. Also
  found in Paramecium bursaria chlorella virus 1. This domain is short and found in one or two copies.
  The domain has a conserved HH motif that may be functionally important. This domain belongs to the ferritin
  superfamily. It contains two sequence similar repeats each of which is composed of two alpha helices.
