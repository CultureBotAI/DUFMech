description: This region is found in the replication initiator protein RctB from Vibrio cholerae ([swissprot:Q9KNG2])
  and similar sequences predominantly found in Vibrionales. RctB mediates oriCII-based replication and
  other regulatory processes. This protein is organised into four domains and adopts a dimeric configuration.
  This entry represents the two central domains, one consisting of a seven-stranded beta- sheet that forms
  the interface of the dimer by forming a swapped configuration with the same domain of the other monomer.
  It seems to be involved in DNA binding [[cite:PUB00091164]].
