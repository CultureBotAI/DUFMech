description: This domain is characterised by two well-conserved short regions separated by a variable
  region in both sequence and length. Proteins containing this domain have been characterised as methyltransferases.
  FkbM, was shown to be required for a specific methylation in the biosynthesis of the immunosuppressant
  FK506 in Streptomyces strain MA6548 [[cite:PUB00009583]]. This domain is also found in other methyltransferases
  such as SdnD from the fungus Sordaria araneosa, involved in the biosynthesis of glycoside antibiotics
  with tetracyclic diterpene aglycone structure [[cite:PUB00089798]].
