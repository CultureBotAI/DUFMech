description: This is a family of glycosyl-hydrolases of the CAZy GH130 family. Several have been characterised
  as mannosylglucose phosphorylase [[cite:PUB00068792],[cite:PUB00068791],[cite:PUB00109137]]. This enzyme
  is part of the mannan catalytic pathway and feeds into the glycolysis cycle [[cite:PUB00068792]]. Specifically
  it catalyses the reversible phosphorolysis of beta-1,4-D-mannosyl-N-acetyl-D-glucosamine [[cite:PUB00109137]].
  This family was noted to belong to the Beta fructosidase superfamily in [[cite:PUB00015849]].
