description: This family is found towards the C-terminus of the DEAD-box helicases ([pfam:PF00270]). In
  these helicases it is apparently always found in association with [pfam:PF04408]. There do seem to be
  a couple of instances where it occurs by itself - e.g. [swissprot:Q84VZ2]. The structure PDB:3i4u adopts
  an OB-fold. helicases ([pfam:PF00270]). In these helicases it is apparently always found in association
  with [pfam:PF04408]. This C-terminal domain of the yeast helicase contains an oligonucleotide/oligosaccharide-binding
  (OB)-fold which seems to be placed at the entrance of the putative nucleic acid cavity. It also constitutes
  the binding site for the G-patch-containing domain of Pfa1p. When found on DEAH/RHA helicases, this
  domain is central to the regulation of the helicase activity through its binding of both RNA and G-patch
  domain proteins [[cite:PUB00092307]].
