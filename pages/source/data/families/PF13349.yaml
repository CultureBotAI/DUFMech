description: This an all-beta structure with a twenty-residue repeat with a highly conserved repeating
  GD, gly-asp, motif that has been described as Toastrack DUF4097, whose function is unknown. It has been
  suggested to form part of a bacterial adhesin. Toastrack has been transferred from bacteria to certain
  eukaryotes, such as FAM185A from human and its orthologues in animals and other eukaryotes.
