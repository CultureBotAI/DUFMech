description: This entry represents a domain found in a group of fungal cell wall proteins, including Tos1
  and YJL171C from budding yeasts. They contain 5 highly conserved cysteines, two of which form a characteristic
  CGC sequence motif. Their function is not clear. It has been shown that these proteins are related to
  known glycosyl hydrolases [[cite:PUB00097737]].
