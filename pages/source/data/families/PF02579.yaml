description: This family contains several NIF (B, Y and X) proteins which are iron-molybdenum cofactors
  (FeMo-co) in the dinitrogenase enzyme which catalyses the reduction of dinitrogen to ammonium. Dinitrogenase
  is a hetero-tetrameric (alpha(2)beta(2)) enzyme which contains the iron-molybdenum cofactor (FeMo-co)
  at its active site [[cite:PUB00019929]].
