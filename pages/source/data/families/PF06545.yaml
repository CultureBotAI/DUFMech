description: This entry, previously known as DUF1116, represents Oxamate carbamoyltransferase subunit
  AllG and related bacterial proteins. AllG is a component of a carbamoyltransferase involved in the anaerobic
  nitrogen utilisation via the assimilation of allantoin [[cite:PUB00155434]]. It is catalyses the conversion
  of oxalurate (N-carbamoyl-2-oxoglycine) to oxamate and carbamoyl phosphate.
