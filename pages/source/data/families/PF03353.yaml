description: LIN-8 is a nuclear protein, present at the sites of transcriptional repressor complexes,
  which interacts with LIN-35 Rb. Lin35 Rb is a product of the class B synMuv gene lin-35 which silences
  genes required for vulval specification through chromatin modification and remodelling [[cite:PUB00083139]].
  The biological role of the interaction has not yet been determined however predictions have been made.
  The interaction shows that class A synMuv genes control vulval induction through the transcriptional
  regulation of gene expression. LIN-8 normally functions as part of a protein complex however when the
  complex is absent, other family members can partially replace LIN-8 activity [[cite:PUB00083139]].
