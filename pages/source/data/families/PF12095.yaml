description: This entry includes protein from blue-green algae and plants, including CRR7 protein from
  Arabidopsis. CRR7 is part of the chloroplastic NAD(P)H dehydrogenase complex (NDH Complex) involved
  in respiration, photosystem I (PSI) cyclic electron transport and CO2 uptake [[cite:PUB00075318]]. A
  member of this family, Ssl3829, was shown to play an important role in the assembly of the NDH-1 hydrophilic
  arm by accumulating the NAI300 complex and Slr1097 protein in the cytoplasm [[cite:PUB00163390]]. The
  structure of another member of this family, Asl3597 from Nostoc sp. PCC7120, was determined [[cite:PUB00163389]].
  This protein folds into an alpha/beta structure consisting of a small antiparallel beta-sheet and alpha-helices
  packed on one side of it.
