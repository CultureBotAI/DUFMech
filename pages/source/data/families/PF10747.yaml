description: This entry represents the Sporulation inhibitor of replication (sirA) family of proteins
  from Bacillus sp. Induction of sporulation in rapidly growing cells inhibits replication; this is thought
  to be through the action of SirA protein and independent of phosphorylated Spo0A; however SirA protein
  synthesis is induced by Spo0A [[cite:PUB00054159]].
