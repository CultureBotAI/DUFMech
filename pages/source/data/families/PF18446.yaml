description: This is a domain of unknown function. Studies of the TA0095 gene product indicate that this
  96-residue hypothetical protein from Thermoplasma acidophilum is a member of the COG4004 orthologous
  group of unknown function found in Archaea bacteria. The structure displays an alpha/beta two-layer
  sandwich architecture formed by three alpha-helices and five beta-strands. Furthermore, structural homologs
  indicate that the TA0095 structure belongs to the TBP-like fold [[cite:PUB00047999]].
