description: Family members include Cryptococcus neoformans HVA1 (hypervirulence-associated protein 1)
  whose absence is associated with a hypervirulent phenotype in mice. Metabolomics analysis suggests that
  when HVA1 is absent there is a block in the citric acid cycle, while structural analysis of the Hva1
  protein suggests a potential interaction with NADPH. The structural architecture of Hva1 bears similarity
  with Tudor domains [[cite:PUB00091033]].
