description: This domain, previously known as DUF1735, is found in a number of proteins mainly found in
  firmicutes, including BT_3987 from Bacteroides thetaiotaomicron, which displays hydrolytic activity
  against Hy-type N-glycans, probably initiating the degradation of this type of glycan in the human gut
  [[cite:PUB00152803]]. This domain adopts a beta-sandwich fold.
