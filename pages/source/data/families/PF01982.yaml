description: This domain is a CTP-dependent riboflavin kinase (RFK), found in archaea, that catalyses
  the phosphorylation of riboflavin to form flavin mononucleotide in riboflavin biosynthesis [ec:2.7.1.26].
  Its structure resembles a RIFT barrel, structurally similar to but topologically distinct from bacterial
  and eukaryotic examples. The N-terminal is a winged helix-turn-helix DNA-binding domain, and the C-terminal
  half is most similar in sequence to a group of cradle-loop barrels. [swissprot:O28174] has this domain
  attached to [pfam:PF00325].
