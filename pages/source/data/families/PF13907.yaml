description: This domain is found at the C-terminus of chromodomain-helicase-DNA-binding proteins, including
  Chromodomain-helicase-DNA-binding protein 1 from humans (CHD1), an ATP-dependent chromatin-remodeling
  factor which acts as substrate recognition component of the transcription regulatory histone acetylation
  (HAT) complex SAGA. This helical domain consists of five alpha-helices organised in a variant helical
  bundle topology. Its surface is positively charged and can bind dsDNA and nucleosomes, but its specific
  function remains unknown [[cite:PUB00100856],[cite:PUB00100857],[cite:PUB00091268]].
