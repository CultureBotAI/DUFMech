description: This domain is found in the C-terminal region of free serine kinase (SerK) in the hyperthermophilic
  archaeon Thermococcus kodakarensis. SerK converts ADP and l-serine (Ser) into AMP and O-phospho-l-serine
  (Sep), which is a precursor of l-cysteine. The domain is not conserved in the ParB/Srx family. The differences
  between SerK and the other members of the ParB/Srx family is concentrated in the C-terminal region,
  which may include residues involved in the Sep binding [[cite:PUB00091306]]. Members of this group are
  mainly found in archaea.
