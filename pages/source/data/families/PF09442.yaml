description: Acid-adaptive protein possibly of physiological significance when H.pylori colonises the
  human stomach, which adopts a unique four alpha-helical triangular conformations. The biologically active
  form is thought to be a tetramer. The protein is expressed along with six other proteins, some of which
  are related to iron storage and haem biosynthesis [[cite:PUB00039697]].
