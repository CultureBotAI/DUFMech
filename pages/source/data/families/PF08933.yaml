description: 'This protein family includes Monodechloroaminopyrrolnitrin synthase PrnB from Pseudomonas
  fluorescens and similar bacterial proteins. PrnB is involved in the biosynthesis of the antifungal compound
  pyrrolnitrin. It is organised into two domains: a small N-terminal capping domain that consists of 7
  alpha-helices and the core helical domain, which is related to myoglobin. PrnB shows structural homology
  to the heme b-dependent two-domain indoleamine 2,3-dioxygenase enzyme (IDO, [pfam:PF01231]) and to the
  tryptophan 2,3-dioxygenase (TDO, [pfam:PF03301]) family [[cite:PUB00049615],[cite:PUB00054440]].'
