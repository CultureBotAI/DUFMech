description: This is a delta4,5-anhydrogalacturonic acid-specific carbohydrate-binding module family 35,
  which is found in several prokaryotic proteins. Its crystal structure shows a jelly roll/beta-sandwich
  fold with 2 antiparallel sheets made of 4 and 5 antiparallel beta-strands [[cite:PUB00054441]]. It is
  also found at the end of a family of putative glycosyl hydrolases.
