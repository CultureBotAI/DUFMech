description: This family includes Gig2 from Candida albicans, YbiU from Escherichia coli and uncharacterised
  proteins predominantly found in fungi and bacteria. Gig2 is a putative oxidoreductase thought to play
  a role in the undefined GlcNAc metabolic network. It folds into a single large domain with a cupin like
  double stranded beta-helix core surrounded by 20 alpha-helices. This protein shows similarity with 2-
  oxoglutarate dependent Fe containing oxygenases [[cite:PUB00100975]].
