description: This family consists of uncharacterized proteins around 170 residues in length and is mainly
  found in various Bacillus species (B. cereus, B. thuringiensis and B. anthracis). The solved structure
  of B. anthracis homologs has a variant of the Greek-key beta barrel fold, making the DUF4870 family
  a member of a large group of bacterial immunoglobulin like domains, but the functional consequences
  of this classification remain unknown.
