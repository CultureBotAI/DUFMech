description: A predicted alpha+beta domain that is usually fused N-terminal to the JAB metallopeptidase.
  This protein in turn is found in conserved gene neighborhoods that include genes encoding the bacterial
  homologs of the ubiquitin modification system such as the E1, E2 and Ub proteins [[cite:PUB00034476]].
  The domain is also known as the JAB-N domain. An AlphaFold3 prediction with A0A375JCV4 suggests that
  this domain likely mediate dimerisation (iPTM=0.87).
