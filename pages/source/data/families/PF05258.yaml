description: This family contains several actinomycete proteins. Family members such as DciA (dna[CI]
  antecedent) found in Pseudomonas aeruginosa, has been shown to share a common function with DnaC (in
  Escherichia coli) and DnaI (in Bacillus subtilis), acting as a replicative helicase. Furthermore, functional
  analysis revealed that DciA is essential for replication initiation and protein depletion resulted in
  a blockage of the initiation of replication after the formation of the open complex [[cite:PUB00085163]].
