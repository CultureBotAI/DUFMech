description: This entry represents a highly conserved 100 residue coiled-coil region which is found in
  short coiled-coil protein (SCOC) in human and UNC-69 in Caenorhabditis elegans. In human, SCOC is required
  for autophagosome formation during amino acid starvation. It forms a starvation-sensitive trimeric complex
  with UVRAG (UV radiation resistance associated gene) and FEZ1 and may regulate ULK1 and Beclin 1 complex
  activities [[cite:PUB00086016]]. In C. elegans, this small, evolutionarily conserved coiled-coil domain-containing
  protein, UNC-69, acts as a binding partner of UNC-76. Together they participate in a common genetic
  pathway necessary for axon extension and cooperate to regulate the size and position of synaptic vesicles
  in axons. Moreover, both proteins colocalize as puncta in neuronal processes and mutations in UNC-69
  preferentially disrupt membrane traffic within axons [[cite:PUB00109243]].
