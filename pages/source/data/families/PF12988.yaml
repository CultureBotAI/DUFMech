description: TraQ is a conjugative transposon lipoprotein. It is a component of the type IV secretion
  system. TraQ belongs to the immunoglobulin superfamily and shares structural similarity to other proteins
  involved in pili production for bacterial cell attachment [[cite:PUB00057520]]. It appears to be upregulated
  in the presence of host or other bacterial species vs when in culture [[cite:PUB00056011],[cite:PUB00056012]].
