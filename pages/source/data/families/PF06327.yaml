description: 'Adenylate cyclase (AC) enzyme uses ATP as its substrate to produce Cyclic AMP (cAMP), a
  ubiquitous signalling molecule that mediates many cellular processes by activating cAMP- dependent kinases
  and also inducing protein-protein interactions. Mammalian adenylate cyclase has nine closely related
  membrane-bound isoforms (AC1-9) showing significant sequence homology and sharing the same overall structure:
  two hydrophobic transmembrane domains, and two cytoplasmic domains that are responsible for the catalytic
  activity. These isoforms differ in both their tissue specificity and their regulation [[cite:PUB00034664],[cite:PUB00034665]].
  This entry represents a region of unknown function found in many of these isoforms. It is part of the
  N-terminal cytoplasmic domain but its presence is not necessary for catalytic activity [[cite:PUB00034666]].'
