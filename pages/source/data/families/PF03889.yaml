description: During translation of messenger RNAs by ribosomes, translation sometimes pauses or stalls.
  Ribosomes stalled on mRNAs need to be rescued for reuse in order to maintain proper translation capacity.
  Rescue systems such as ArfA-RF2 and ArfB (formerly known as YaeJ) are present in many bacterial species.
  Family members such as ArfA cooperates with the canonical peptide release factor RF2 to hydrolyse the
  peptidyl-tRNA in the non-stop complex. Structural and biochemical analysis show that ArfA anchors its
  positively charged C-terminal in the mRNA entry channel of the ribosome. Whereas its N terminus is sandwiched
  between the decoding centre and the switch loop of RF2, leading to marked conformational changes in
  both the decoding centre and RF2 thereby triggering RF2 peptidyl-hydrolysing activity [[cite:PUB00086401]]
  [[cite:PUB00086404]].
