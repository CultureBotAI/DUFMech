description: This is the membrane-anchor domain of translocase of chloroplast 159, TOC159/132. This domain
  is present in plants at the C-terminus of the GTPase, AIG1, [pfam:PF04548], and anchors the GTPas region
  to the outer membrane of the chloroplast. The domain may carry a very C-terminal sequence motif that
  resembles a transit peptide [[cite:PUB00075666]].
