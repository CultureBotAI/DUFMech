description: Deubiquitinating enzymes (DUBs) remove ubiquitin (Ub) from Ub-conjugated substrates to regulate
  the functional outcome of ubiquitination. This entry includes MINDY-3/4. They belong to the MINDY (motif
  interacting with Ub-containing novel DUB) family (peptidase family C121), whose members are deubiquitinating
  enzymes releasing Lys48-linked ubiquitin [[cite:PUB00081935]]. This is a conserved domain found in deubiquitinating
  enzymes, MINDY-3 and MINDY-4.
