description: Trafficking protein particle complex subunit 13 (TRAPPC13) is involved in regulating autophagy
  and survival in response to small molecule compound-induced Golgi stress [[cite:PUB00090991]]. This
  entry represents the N-terminal domain, which may adopt a beta-sandwich fold with an insertion at the
  very N-terminal consisting of a short beta-strand and alpha helix connected by a long loop.
