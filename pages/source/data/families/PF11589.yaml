description: This domain adopts an immunoglobulin-like beta-sandwich fold and structurally is most similar
  to fibronectin. This domain is found at the C-terminus of the Listeria monocytogenes InlP protein. This
  domain shares some similarity with the secretion signal domain of type X secretion systems [pfam:PF18962].
  This domain is also found at the C-terminus of likely cell surface proteins suggesting this domain has
  a similar function.
