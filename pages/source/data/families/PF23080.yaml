description: This domain is found in a group of uncharacterised plant proteins. These proteins are probably
  distantly related to the plant-specific actin-binding protein SCAB1 and are predicted to contain a fusion
  domain composed of Ig and PH-like domains in a similar arrangement as in SCAB1 (([pfam:PF16709]) and
  ([pfam:PF17684])) [[cite:PUB00076164]]. The domain represented by this entry corresponds to an atypical
  PH-like domain.
