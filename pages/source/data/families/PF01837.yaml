- graph_id: g20-duf39-individual-mutant-growth
  title: Dde_3007 disruption reduces minimal-medium plate growth in G20
  scope: Individual D. alaskensis G20 transposon mutant JK00771, wild type and plasmid controls in Figure
    4C; separate from the 2014 and 2018 pooled-fitness assays.
  context: JK00771 Dde_3007::Tn5 and its empty-vector pMO9075 derivative are compared with G20 and JK00771
    carrying pJK2. The plate image says MOLS4, whereas the caption says LS4D; the exact minimal lactate/sulfate
    formulation remains unresolved. General culture conditions are anaerobic 30 C, but the plate assay
    duration is not established. Figure 4D separately shows homocysteine rescue without establishing its
    dose here.
  family_mapping: Dde_3007 is reference UniProtKB:Q30WZ5, sequence version 1, 421 aa, PF01837 at 53-411,
    and NCBI ABB39801.1 on CP000112.1 positions 2993369-2994634. The paper's sequence-verified pJK2 uses
    revised start 2993462, corresponding to reference residue 32. Assuming the same stop predicts a 390-aa
    product and interval 22-380; this calculation is not an independently retrieved full clone sequence.
    The taxon 207559 current name is Oleidesulfovibrio alaskensis G20.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:207559
  limitations: The endpoint is visible plate growth, not a quantitative colony count, direct reaction
    assay or proof of an isolated-domain function. pJK2 complementation supports gene dependence; exact
    insertion position and clone junctions remain unverified because supplements were inaccessible. The
    source's O-phosphohomoserine pathway is proposed, and later work questions homoserine participation.
    No such catalytic step or universal persulfide mechanism is adopted.
