description: MafB constitutes a family of secreted toxins in pathogenic Neisseria species, probably involved
  in interbacterial competition [[cite:PUB00073618]]. Genes immediately downstream of mafB encode a specific
  immunity protein (MafI). MafB proteins exhibit a signal peptide sequence, a N-terminal conserved domain
  and a C-terminal variable region. Toxic domains identified at the C terminus include [pfam:PF15542],
  [pfam:PF14437], [pfam:PF15524], and [pfam:PF14436].
