description: A large family of uncharacterized proteins mostly from human gut bacteroides, but also some
  environmental and water bacteria (Planctomycetes) as well as metagenomic samples Most proteins from
  this family are secreted or located on the outer surface and may participate in cell-cell interactions
  or cell-nutrient interactions This function is supported by a solved structure of a Bacteroides ovatus
  homolog, which adapts a galactose binding (jelly-roll) beta barrel structure
