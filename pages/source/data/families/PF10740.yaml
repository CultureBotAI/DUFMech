description: This domain is conserved in the Bacillales. The function is not known, but given this domain's
  relationship to the SIS domain it may carry out a sugar isomerase reaction. Several members are annotated
  as being YWJG, a protein expressed downstream of pyrG, a gene encoding for cytidine triphosphate synthetase.
