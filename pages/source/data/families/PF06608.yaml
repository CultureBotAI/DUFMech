description: This family represents the homologues of Cilia- and flagella-associated protein 68 (CFAP68).
  This protein is a microtubule inner protein (MIP) part of the doublet microtubules (DMTs). CFAP68 belongs
  to the axoneme core-MIPs and binds to the protofilament A09 of the sperm DMTs [[cite:PUB00151496]].
