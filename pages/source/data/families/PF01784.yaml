description: This family includes the DUF34/metal-binding protein/NIF3 proteins, which are widely distributed
  across superkingdoms. They were previously annotated as GTP cyclohydrolase 1 type 2 [[cite:PUB00070175]]
  and, recently, through a comprehensive literature review and integrative bioinformatics analyses it
  was revealed that annotations for these members were misleading as they were based on a single set of
  in vitro results examining the NIF3 homolog of Helicobacter pylori [[cite:PUB00070175]]. Actually, they
  have varied phenotypes with the unifying functional role as metal-binding proteins [[cite:PUB00100327]].
  This entry contains several NIF3 (NGG1p interacting factor 3) protein homologues. NIF3 interacts with
  the yeast transcriptional coactivator NGG1p which is part of the ADA complex, the exact function of
  this interaction is unknown [[cite:PUB00002954],[cite:PUB00019927]].
