description: This family consists of membrane insertion efficiency factor proteins. They contain three
  conserved cysteine residues. Family members such as YidD may be involved in insertion of integral membrane
  proteins into the membrane by assisting YidC (membrane protein insertase). Some members of the yidD
  family have been previously thought to posses alpha-hemolysin activity, however no sufficient evidence
  was found to corroborate this idea. Secondary structure prediction indicated the presence of three alpha-helices
  in YidD. None of the three alpha-helices appeared sufficiently hydrophobic to serve as a transmembrane,
  suggesting a cytoplasmic localization for YidD. However, a closer examination of the alpha-helical wheel
  projection of the predicted first alpha-helix in YidD suggested an amphipathic structure in its N-terminal
  region which might be involved in membrane targeting [[cite:PUB00064882]].
