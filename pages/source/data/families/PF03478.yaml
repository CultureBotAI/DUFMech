description: This entry represents the beta-propeller domain found in F-box proteins KIB1-4, from Arabidopsis
  thaliana, and similar plant proteins. This domain adopts a beta-propeller structure with 6 blades and
  is often found in association with F-box domain ([pfam:PF00646]). KIB1-4 are ubiquitin ligases that
  act as essential positive regulators in brassinosteroid signalling, mediating the ubiquitination, substrate
  interaction and degradation of GSK3 kinase BIN2 [[cite:PUB00094297]].
