description: TTR-52 was called family 2 in [[cite:PUB00001984]], and has weak similarity to transthyretin
  (formerly called pre-albumin) which transports thyroid hormones. The specific function of this protein
  is as a bridging molecule in apoptosis cross-linking dying cells to phagocytes. TTR-52 bridges by cross-linking
  surface-exposed phosphatidylserine (PtdSer) on apoptotic cells to the CED-1 receptor, a transmembrane
  receptor, on phagocytes. TTR-52 has an open beta-barrel-like structure [[cite:PUB00109168]].
