description: This domain contains a P-loop (Walker A) motif, suggesting that it has ATPase activity, and
  a Walker B motif. It si found in RNA cytidine acetyltransferase NAT10 from eukaryotes and tRNA(Met)
  cytidine acetyltransferase TcmA from prokaryotes. NAT10 catalyses the formation of N4-acetylcytidine
  (ac4C) modification on mRNAs, 18S rRNA and tRNAs [[cite:PUB00050413],[cite:PUB00076725],[cite:PUB00158943],[cite:PUB00158942]].
  In tRNA(Met) cytidine acetyltransferase (TmcA) it may function as an RNA helicase motor (driven by ATP
  hydrolysis) which delivers the wobble base to the active centre of the GCN5-related N-acetyltransferase
  (GNAT) domain [[cite:PUB00050413]].
