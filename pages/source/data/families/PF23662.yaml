description: This domain is found in plant proteins that are probably related to NOMO family of proteins.
  The latter are components of the multi-pass translocon (MPT) complex which mediates insertion of multi-pass
  membrane proteins into the lipid bilayer of membranes [[cite:PUB00155613]]. The domain represented by
  this entry is predicted to adopt a globular beta-sandwich structure with a prealbumin-like topology.
