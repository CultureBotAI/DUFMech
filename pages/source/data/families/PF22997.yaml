description: This domain is found in a group of fungal proteins, including Chitin synthase 4 from Gibberella
  zeae (CHS4), which plays a role in the polymerisation of chitin [[cite:PUB00155063],[cite:PUB00155061]].
  This domain is predicted to adopt a globular structure with similarity to Cytochrome b5-like heme/steroid
  binding domain ([pfam:PF00173]). Despite this global similarity this domain lacks haem coordinating
  residues and is probably not involved in haem binding.
