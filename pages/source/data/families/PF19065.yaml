description: This entry represents the central region of the minor capsid protein P8 found in PBCV-1 and
  related viruses. The central region of P8 folds into a wedge-shaped structure that consists of three
  short alpha-helices wrapped around a long alpha-helix [[cite:PUB00154516],[cite:PUB00154526]]. P8 and
  other minor capsid proteins contribute to the stability of the pentasymmetrons of the viral capsid [[cite:PUB00154516],[cite:PUB00154526]].
