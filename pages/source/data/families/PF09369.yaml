description: This is the C-terminal MrfA Zn+2-binding domain (MZB, also referred to as DUF1998) which
  contains a conserved four-cysteine signature motif. These four Cys reside in a short coil between two
  alpha-helices and form a metal ion-binding site [[cite:PUB00098193]]. This domain is frequently found
  at the C-terminal of ndNTPases, however, it is also found encoded in a standalone gene, downstream of
  putative helicase domain-encoding genes associated with bacterial anti-phage defense system DISARM.
  MrfA (Mitomycin repair factor A, also known as YprA in Bacillus subtilis) is a DNA helicase that supports
  repair of mitomycin C-induced DNA damage. MrfA homologues are widely distributed in bacteria and are
  also present in archaea, fungi and plants. The MrfA-homologue in yeast, Hrq1, also reduces mitomycin
  C sensitivity. Hrq1 has high similarity to human RecQ4 and was therefore assigned to the RecQ-like helicase
  family. MrfA homologues appear to be missing in Enterobacteria, however, certain pathogenic Escherichia
  coli and Salmonella strains harbour Z5898-like helicases with this domain [[cite:PUB00098193]].
