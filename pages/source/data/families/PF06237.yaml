description: This family includes animal riboflavin transporters belonging to the Solute carrier family
  52 (SLC52). They are plasma membrane proteins that transport vitamin B2 (riboflavin, RF) into cells
  [[cite:PUB00078059]]. In case of infection by retroviruses, they act as cell receptors to retroviral
  envelopes similar to the porcine endogenous retrovirus (PERV-A) [[cite:PUB00078058]]. These proteins
  belong to the MFS superfamily [[cite:PUB00103553]].
