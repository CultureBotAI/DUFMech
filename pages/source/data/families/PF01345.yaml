- graph_id: asilvestris-clipper-k715a-proteolysis
  title: K715A lowers intact CLIPPER-domain survival during protease treatment
  scope: Purified WT and K715A A. silvestris B9T28_05395 708-828 fragments in Costa 2025 Figure 6d; not
    native-cell aggregation or all proteases.
  context: Mix 10 ul of 1 mg/ml domain preparation with 10 ul of 1 mg/ml Proteinase K in PBS, then incubate
    1 h at 20, 30, 40 or 50 C before SDS-PAGE. Calculated final concentrations are 0.5 mg/ml each. PBS
    is 137 mM NaCl, 3 mM KCl, 10 mM Na2HPO4, 1.8 mM KH2PO4, pH 7.4. Compare matched-temperature mutant
    and WT lanes; separate domain-only and protease-only lanes identify the bands.
  family_mapping: Reference A0A1Y3CHT7 contains the tested PF01345 repeat at 712-812. The 708-828 synthetic
    sequences translate exactly to WT or its single K715A substitution. The full-length protein's other
    repeats and the archaeal MTCT_1020 system are distinct targets.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:1977882
  limitations: The displayed gel is qualitative; no degradation-rate constant, independent replicate confidence
    or complete digestion is assigned. Tag status of the biochemical aliquots remains ambiguous. A substitution
    effect is compatible with crosslink stabilization but does not isolate it from local packing or other
    covalent features. No adhesion-to-proteolysis causal chain or universal family protection is inferred.
