description: This entry, previously known as DUF11, represents the CLIPPER domain, (Cross-Linked IsoPeptide
  Protein in the Extracellular Region) which is usually found in multiple copies in a number of archaebacterial
  proteins. CLIPPER domain adopts an Ig-like fold and contains a conserved N-terminal lysine and a C-terminal
  asparagine with central aspartate/glutamate residues that form an intramolecular isopeptide bond [[cite:PUB00163642]].
  The positions of the residues predicted to form isopeptide bonds are not universally conserved suggesting
  that some domains appear to lack the intramolecular isopeptide bonds. CLIPPER domains are found in proteins
  from Gram-positive and Gram-negative bacteria. Some have also been identified in multiple cell-surface
  proteins from archaea. In Methanothermobacter sp. CaT2, this domain plays a key role as a membrane-bound
  adhesion protein in the aggregation of CaT2 [[cite:PUB00097782]].
