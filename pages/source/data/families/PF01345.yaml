causal_graphs:
- graph_id: asilvestris-clipper-k715a-thermal-unfolding
  title: K715A lowers the CLIPPER fragment's thermal transition temperature
  scope: Purified synthetic B9T28_05395 residues 708-828 from Acinetobacter silvestris ANC4999 in Costa
    2025; a single repeat, not the full adhesin or all CLIPPER domains.
  context: Compare WT with K715A by circular dichroism during heating from 5 to 95 C in 5-C increments.
    Samples contain 0.36 mg/ml WT or 0.38 mg/ml mutant in 10 mM sodium phosphate, 100 mM sodium fluoride,
    pH 7.4; 300 ul in a 1-mm cuvette. Spectra span 180-280 nm and average four repeat scans. pOPINF/BL21(DE3)
    constructs were purified by nickel affinity and SEC; tag removal is explicit for crystallography,
    not unambiguously for these aliquots.
  family_mapping: UniProtKB:A0A1Y3CHT7, B9T28_05395, is 2129 aa, sequence version 1. Its sequence matches
    InterPro; the tested PF01345 match is 712-812 within the 708-828 construct. Table S6 WT DNA translates
    exactly to that 121-aa segment; mutant DNA differs only at K715A. Deposited 9IFR polymer is GP plus
    the same WT segment. Other repeats do not inherit the assay.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:1977882
  limitations: Both starting spectra resemble folded beta-sheet proteins, but the comparison does not
    isolate a single atomic cause. The source reports a K715-N806 isopeptide bond; local mutation effects
    and the C818/C821 disulfide are not separately excluded. Main text/Figure 5 say Asp748, whereas both
    reference and synthetic sequences encode N748/D749. Methods also say K517A in places despite Table
    S6 confirming K715A. No catalytic microstep, fitted thermodynamic melting constant, force resistance
    or native adhesion is asserted.
