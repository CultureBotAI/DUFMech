description: This domain is found in uncharacterised proteins from Halobacteria. It is predicted to fold
  into an alpha/beta structure composed of a small four stranded antiparallel beta-sheet and alpha-helices
  packed on one side of it. It contains two conserved sequence motifs IPLH and RxRFW which may have functional
  importance. This domain is frequently found in combination with domains members of AAA superfamily.
