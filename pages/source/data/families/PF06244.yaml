description: Oxs1 (oxidative stress transcription corepressor Oxs1) and Pap1 form a complex to regulate
  transcription when cells are exposed to diamide or Cd that causes disulfide stress. In fission yeast
  such as S. pombe, heterologous Oxs1-like proteins can enhance diamide stress tolerance. Furthermore,
  human and arabidopsis Oxs1 can interchangeably bind Pap1 or Pap1 homologues from human (cJun) and arabidopsis
  (bZIP10), suggesting that Oxs1 may be a component of an evolutionarily-conserved stress response pathway
  [[cite:PUB00091062]]. Family members found in human such as Ccdc124 (Coiled-Coil Domain Containing Protein
  124), were identified as a novel component of the centrosome during interphase and G2/M transition and
  is involved in cytokinesis [[cite:PUB00091062],[cite:PUB00073830]].
