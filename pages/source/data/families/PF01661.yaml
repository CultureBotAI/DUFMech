- graph_id: af1521-coupled-appr1p-processing
  title: Af1521 addition yields an ADP-ribose-migrating TLC product
  scope: Purified Archaeoglobus fulgidus Af1521 in the coupled CPDase/Appr1-phosphate assay, Karras 2005
    Figure 1; not an isolated Pfam fragment or physiological substrate assay.
  context: His6-Af1521 expression, purification and thrombin cleavage refer to Allen 2003; complete terminal
    scar remains unresolved. Incubate 2 mM Appr>P with 6 ug CPDase in 9 ul, then add 1 ul containing 6
    ug Af1521 for 12 h at 30 C. CPDase remains present. TLC uses tetrabutylammonium, 1.5 M LiCl and 20%
    ethanol with UV254 detection.
  family_mapping: Af1521 reference O28751 is 192 aa, sequence version 2, exactly matching canonical PDB
    2BFQ entity1. Current PF01661 is 30-155 inclusive, not the entire protein. UniProt's VC-16 taxon224325
    is reference grounding; the structural source is species-level A. fulgidus taxon2234. Neither experimental
    strain sequence nor terminal scar was independently verified.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:2234
  limitations: Lane3 co-migration with ADPr in matched enzyme/buffer lane4 supports product assignment,
    not an independent MS/NMR structure determination. Phosphate release and yeast YBR022W activity are
    reported as data not shown. The long endpoint does not establish turnover kinetics, native biological
    role, isolated-domain sufficiency or a resolved catalytic cycle.
