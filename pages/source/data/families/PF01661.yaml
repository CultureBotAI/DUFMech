description: 'The Macro or A1pp domain is a module of about 180 amino acids which can bind ADP-ribose
  (an NAD metabolite) or related ligands. Binding to ADP-ribose could be either covalent or non-covalent
  [[cite:PUB00052327]]: in certain cases it is believed to bind non-covalently [[cite:PUB00052325]]; while
  in other cases (such as Aprataxin) it appears to bind both non-covalently through a zinc finger motif,
  and covalently through a separate region of the protein [[cite:PUB00052328]]. This domain is found in
  a number of otherwise unrelated proteins. It is found at the C-terminus of the macro-H2A histone protein
  4 and also in the non-structural proteins of several types of ssRNA viruses such as NSP3 from alpha-viruses
  and coronaviruses. This domain is also found on its own in a family of proteins from bacteria, archaebacteria
  and eukaryotes. The 3D structure of the SARS-CoV Macro domain has a mixed alpha/beta fold consisting
  of a central seven-stranded twisted mixed beta sheet sandwiched between two alpha helices on one face,
  and three on the other. The final alpha-helix, located on the edge of the central beta-sheet, forms
  the C terminus of the protein [[cite:PUB00043976]]. The crystal structure of AF1521 (a Macro domain-only
  protein from Archaeoglobus fulgidus) has also been reported and compared with other Macro domain containing
  proteins. Several Macro domain only proteins are shorter than AF1521, and appear to lack either the
  first strand of the beta-sheet or the C-terminal helix 5. Well conserved residues form a hydrophobic
  cleft and cluster around the AF1521-ADP-ribose binding site [[cite:PUB00021744]].'
