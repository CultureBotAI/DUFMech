- graph_id: af1521-adpr-binding-and-substitutions
  title: Purified Af1521 binds ADP-ribose and three substitutions reduce affinity
  scope: Intact Af1521 WT, D20A, N34A and Y176L preparations, Karras 2005 Figures2-3 and TablesI-II; biochemical
    binding, not catalytic-rate measurements.
  context: ITC at25 C in50 mM potassium phosphate pH6.5,10-50 uM protein,150-750 uM ligand in syringe.
    WT ADPr Kd126+/-21 nM in Results,0.13+/-0.02 uM in TableI. His6 cleavage is described, but complete
    vector-derived terminal residues remain unresolved. Mutant effects compare the same ADPr ligand, not
    separate nucleotide chemistries.
  family_mapping: Native reference O28751 is192 aa, with current PF01661 30-155. N34 is within that interval;
    D20 and Y176 are outside it. Their whole-protein substitution effects cannot be labeled mutations
    within the current Pfam domain or evidence that the isolated interval suffices. PDB2BFQ canonical
    sequence matches the reference, not an independent sequence determination of every mutant preparation.
  scope_status: MECHANISTIC
  taxon: NCBITaxon:2234
  limitations: All three variants retain measurable ADPr binding. No displayed folding, active-fraction
    or stability controls resolve why each Kd changes; replicate count and error definition are not specified.
    Stoichiometry is0.91+/-0.01 in text but0.93+/-0.01 in TableI. ADP,AMP,ATP bind more weakly; NAD,adenosine,GDP
    are weak/unfittable with estimated Kd>100 uM, not proven zero binding. Structural contacts do not
    establish an observed catalytic trajectory.
