description: Bacterial protein of unknown function. One family member ([swissprot:Q97LI1]) is predicted
  to contain a von Willebrand factor (vWF) type A domain (Smart:VWA). Another family member YeaH is predicted
  to be part of a conserved signalling pathway with the kinase YeaG and the SpoVR protein YcgB. The pathway
  may be involved in nitrogen metabolism (see Supplementary note 5 in [[cite:PUB00093610]].)
