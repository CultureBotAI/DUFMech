description: This is a family of uncharacterised bacterial proteins. They are related to HlyIII family
  [pfam:PF03006] and are predicted to adopt the same structure consisting of seven transmembrane helices.
  Their predicted structure, suggests that, similarly to HlyIII, they may contain a Zn-binding site, albeit
  slightly rearranged as only two of the Zn-coordinating residues are in conserved positions.
