description: This family consists of several uncharacterized proteins around 90 residues in length and
  is mainly found in various Bacteroides species. The function of this family is unknown. Structure prediction
  strongly suggests that four copies of this protein form a homotetramer complex where each monomer forms
  a single blade of a beta propeller structure. Proteins in this family contain an N-terminal lipoprotein
  attachment motif.
