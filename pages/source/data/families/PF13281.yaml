description: This entry corresponds to the TNF receptor-associated factors (TRAFs)-binding domain found
  at the N-terminus of some MAP3Ks, like Apoptosis signal-regulating kinases (ASK). This domain is flanked
  by a thioredoxin-binding domain and a PH-like domain. It includes seven tetratricopeptide repeats (TPRs)
  and, together with the PH-like domain, constitutes the central regulatory domain of ASK1 [[cite:PUB00094650]].
