description: This domain is found in many multi-domain enzymes which synthesise peptide antibiotics. This
  domain catalyses a condensation reaction to form peptide bonds in non- ribosomal peptide biosynthesis.
  It is usually found to the carboxy side of a phosphopantetheine binding domain ([pfam:PF00550]). It
  has been shown that mutations in the HHXXXDG motif abolish activity suggesting this is part of the active
  site [[cite:PUB00007135]].
