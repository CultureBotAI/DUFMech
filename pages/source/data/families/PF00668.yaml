  prompt: Resolve TycB1 construct and assay ambiguities before assigning an elementary condensation mechanism.
  kind: CURATION_TODO
  status: OPEN
  rationale: Coupled reaction output and domain-localized mutations support a scoped biochemical graph,
    but not a universal histidine proton-transfer step. Exact fusion sequences, GrsA accession, phenylalanine
    units and inconsistent D151 labels remain unresolved.
  evidence:
  - reference: doi:10.1046/j.0014-2956.2001.02691.x
