causal_graphs:
- graph_id: tycb1-grsa-dkp-production
  title: Joint TycB1 and GrsA preparations produce a cyclic dipeptide
  scope: Reconstituted recombinant holo-TycB1 Pro-CAT first module and GrsA Phe-ATE, with separately tested
    TycB1 R62A, H147R and H147V substitutions. This is neither full tyrocidine biosynthesis nor an isolated
    condensation-domain sufficiency assay.
  context: C-terminal His6-tagged TycB1 variants were produced with gsp phosphopantetheinyl-transferase
    expression and nickel-affinity purification. The DKP assay separately preincubates each enzyme at
    1 uM with 2 mM ATP and its amino-acid substrate for 3 min at 37 C, mixes equal volumes, and incubates
    45 min at 37 C before extraction and HPLC-MS. Assay buffer contains 50 mM HEPES pH 8.0, 100 mM NaCl,
    10 mM MgCl2 and 1 mM EDTA. The HTML gives 0.5 M phenylalanine and 0.5 mM proline before mixing; the
    phenylalanine unit remains unresolved rather than being silently corrected. Figure 4 uses three consecutive
    experiments from the same protein batch and thiolation normalization.
  family_mapping: TycB is UniProtKB:O30408, NCBIProtein:AAC45929.1, nucleotide AF004835, 3587 residues,
    sequence version 1. Current reference taxon is Brevibacillus parabrevis 54914; the sequence-linked
    primary operon study names historical Bacillus brevis ATCC 8185. Exact UniProt/InterPro sequence agreement
    places the first PF00668 interval at 9-454, containing R62 and H147. The other three PF00668 matches,
    including the terminal epimerization region, are not assigned this reaction. Complete construct boundaries
    and cloning junctions were not independently reconstructed. The paper's GrsA partner is named but
    not assigned an unverified accession from the two current reviewed GrsA references.
  scope_status: MECHANISTIC
  limitations: DKP is an observed product of the joint coupled system; it is an indirect readout of peptide
    condensation followed by release/cyclization. No elementary proton transfer, isolated-domain reaction
    or family-wide substrate specificity is established. Retained adenylation and thiolation do not prove
    unchanged local C-domain folding. Absolute detection limits and independent-purification replication
    are not reported here. Source D151N/D151A, Y166F/Y151F and Figure 1 tycB/tycA inconsistencies remain
    open; no ambiguous D151 edge is adopted. Figure captions and text were inspected, not the unavailable
    plotted images or raw chromatograms.
