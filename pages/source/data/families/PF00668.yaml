    explanation: Publisher text and captions support the reaction and three unambiguous mutant effects.
      D151N/D151A and Y166F/Y151F inconsistencies and the Figure 1 tycA label are retained. Neither insoluble
      mutants nor inhibitor sensitivity identifies a specific catalytic residue mechanism.
  - reference: PMID:17637339
