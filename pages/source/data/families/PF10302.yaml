description: This is the N-terminal ubiquitin-like domain of DSC E3 ubiquitin ligase complex subunit 3
  (Dsc3). Dsc3 is a component of the DSC E3 ubiquitin ligase complex (a Golgi-specific protein ubiquitination
  system) that functions in protein homeostasis under non-stress conditions, playing a role in protein
  quality control through endosome and Golgi-associated degradation pathway (EGAD) [[cite:PUB00098312],[cite:PUB00098082],[cite:PUB00098314]].
  Yeast DSC E3 ubiquitin ligase complex is the homologue of Hrd1 E3 ligase complex from mammals, in which
  Dsc1, Dsc2 and Dsc3 corresponds to Hrd1, Der1 and Usa1, respectively. Dsc3 is a Herp-like protein that
  acts as a bridge between Dsc1 and Dsc2 for their interaction [[cite:PUB00075404]].
