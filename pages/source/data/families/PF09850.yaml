description: DotU is a family of Gram-negative bacterial proteins that form part of the membrane-joining
  complex of the type VI secretion system. DotU binds tightly to IcmF and together they are tethered to
  the inner membrane at one end and the peptidoglycan layer at the other; they interact with Lip1 which
  then tethers the peptidoglycan layer to the outer membrane [[cite:PUB00075434]].
