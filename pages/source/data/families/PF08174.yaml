description: Anillin is a protein involved in septin organisation during cell division. It is an actin
  binding protein that is localised to the cleavage furrow, and it maintains the localisation of active
  myosin, which ensures the spatial control of concerted contraction during cytokinesis [[cite:PUB00075569]].
