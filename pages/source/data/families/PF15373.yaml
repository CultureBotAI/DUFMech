description: This family (previously DUF4601) represents the homologues of Stabilizer of axonemal microtubules
  5 (SAXO5, also known as C19orf45, TEX45). SAXO5 is a filamentous SAXO protein that binds along protofilament
  A04 with 96-nm periodicity [[cite:PUB00151496]]. A typical feature of SAXO proteins is the presence
  of Mn motif which forms a 5- to 6-residue helix flanked by a Tyr/Phe residue on one end and by a Ser/Thr
  on the other that binds the shoulder of the alpha-tubulin S9/S10 loop [[cite:PUB00151502]]. SAXO5 contains
  11 Mn motifs and therefore has 96-nm periodicity, matching the external periodicity of the axoneme [[cite:PUB00151496]].
