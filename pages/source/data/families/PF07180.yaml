description: This is a family of transcriptional regulators. CaiF is involved in carnitine metabolism
  [[cite:PUB00077941]]. GrlA is encoded within the LEE type III secretion system in the enteropathogenic
  E. coli O157:H [[cite:PUB00076312]]. GrlR interacts with GrlA at its Helix-Turn-Helix (HTH) motif, preventing
  GrlA from binding to its target promoter DNA.
