description: This is an N-terminal domain found in pyrimidine/purine nucleotide 5'-monophosphate nucleosidases
  (PpnN) in bacteria. PpnN catalyzes the hydrolysis of the N-glycosidic bond of diverse pyrimidine and
  purine nucleotide 5'-monophosphates, to form ribose 5-phosphate and the corresponding free base. It
  can use AMP, GMP, IMP, CMP, dTMP and UMP as substrates [[cite:PUB00084997]]. It is found in association
  with [pfam:PF03641] and [pfam:PF11892].
