description: This entry represents a small protein domain with a 7(1) septoil knot topology, one of the
  most complex protein knots known. The structured core consists of a beta-barrel with six beta-strands
  and two short alpha-helices. The domain contains a conserved SFPD tetrapeptide motif in the loops between
  beta-strands, resulting in a pseudo fivefold symmetry with conserved phenylalanine side chains pointing
  outward. The domain is exceptionally stable against chemical denaturation and shows high mechanical
  resistance. The domain was first predicted by AlphaFold2 and experimentally confirmed by X-ray crystallography
  and solution NMR.
