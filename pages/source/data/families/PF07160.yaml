description: Spindle and kinetochore-associated protein 1 (SKA1) is a component of the SKA1 complex (consists
  of Ska1, Ska2, and Ska3/Rama1), a microtubule-binding subcomplex of the outer kinetochore that is essential
  for proper chromosome segregation [[cite:PUB00061771]]. It is required for timely anaphase onset during
  mitosis, when chromosomes undergo bipolar attachment on spindle microtubules leading to silencing of
  the spindle checkpoint [[cite:PUB00061805]].
