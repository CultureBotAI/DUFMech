description: Poly(ADP-ribose) glycohydrolase (PARG) hydrolyses the ribose-ribose bonds present in poly(ADP-ribose)
  (PAR) chains. This entry represents the PARG homologue present in bacteria and fungi. Its structure
  shows a typical macrodomain folding consisting of a seven-stranded beta-sheet sandwiched between nine
  alpha-helices [[cite:PUB00065612],[cite:PUB00100174]].
