description: This entry represents the C-terminal domain from a family of uncharacterised proteins found
  predominantly in Proteobacteria that contain two domains. The proteins are distributed among various
  orders including Burkholderiales, Rhodobacterales, and Hyphomicrobiales. The proteins in this family
  are typically around 240 to 250 amino acids in length. This domain contains a conserved RHG motif that
  may be functionally important. This alpha helical domain belongs to the Hpt superfamily according to
  CATH.
