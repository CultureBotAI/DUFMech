description: The DisA protein is a bacterial checkpoint protein that dimerises into an octameric complex.
  The protein consists of three distinct domains. This domain is the first and is a globular, nucleotide-binding
  region; the next 146-289 residues constitute the DisA-linker family, [pfam:PF10635], that consists of
  an elongated bundle of three alpha helices (alpha-6, alpha-10, and alpha-11), one side of which carries
  an additional three helices (alpha7-9), which thus forms a spine like-linker between domains 1 and 3.
  The C-terminal residues, of domain 3, are represented by family HHH, [pfam:PF00633], the specific DNA-binding
  domain. The octameric complex thus has structurally linked nucleotide-binding and DNA-binding HhH domains
  and the nucleotide-binding domains are bound to a cyclic di-adenosine phosphate such that DisA is a
  specific di-adenylate cyclase. This N-terminal domain has been identified as a diadenylate cyclase (DAC)
  responsible for producing c-di-AMP from two molecules of ATP [[cite:PUB00109173]]. The di-adenylate
  cyclase activity is strongly suppressed by binding to branched DNA, but not to duplex or single-stranded
  DNA, suggesting a role for DisA as a monitor of the presence of stalled replication forks or recombination
  intermediates via DNA structure-modulated c-di-AMP synthesis [[cite:PUB00044227]].
