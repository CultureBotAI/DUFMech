description: This family includes human tumor necrosis factor alpha-induced protein 8-like (TNFAIP8) and
  similar proteins mainly found in animals. TNFAIP8 functions as a negative mediator of apoptosis and
  may play a role in tumour progression. Proteins in this family adopt an all-alpha configuration.
