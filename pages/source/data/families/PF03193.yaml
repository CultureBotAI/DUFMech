description: RsgA (also known as EngC and YjeQ) represents a protein family whose members are broadly
  conserved in bacteria and are indispensable for growth. The GTPase domain of RsgA is very similar to
  several P-loop GTPases, but differs in having a circular permutation of the GTPase structure described
  by a G4-G1-G3 pattern [[cite:PUB00013951]].
