description: The outer membrane protein LpxR from Salmonella typhimurium is a lipid A deacylase that catalyses
  the removal of the 3'-acyloxyacyl moiety from lipid A. This protein folds into a 12-stranded antiparallel
  beta-barrel with the N- and C- terminal ends pointing towards the periplasm and three extracellular
  loops consisting of alpha-helical regions at the opposite side of the beta-barrel [[cite:PUB00051973]].
