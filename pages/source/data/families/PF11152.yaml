description: 'Cofactor maturation pathways such as the CCB system (system IV) for cytochrome c-heme attachment
  are conserved in all organisms performing oxygenic photosynthesis [[cite:PUB00075312]]. The CCB system
  consists of four proteins: CCB1-4. CCB2 and CCB4 are paralogues derived from a unique cyanobacterial
  ancestor [[cite:PUB00075312]]. Orthologues are conserved in higher plants [[cite:PUB00075315]].'
