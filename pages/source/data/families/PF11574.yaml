description: This is the C-terminal domain of Resuscitation-promoting factor Rpf1 from Corynebacterium
  glutamicum [[cite:PUB00097296]], which is adjacent the RPF domain ([pfam:PF06737]). The function of
  this domain is not yet known. Rpf1 has peptidoglycan hydrolytic activity and stimulates resuscitation
  of dormant cells [[cite:PUB00097296]].
