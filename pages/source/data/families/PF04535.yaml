description: This domain is found mainly in plant proteins known as Casparian strip membrane proteins
  (CASPs) and CASP-like proteins (CASPLs). CASPs are four-membrane-span proteins that mediate the deposition
  of Casparian strips in the endodermis by recruiting the lignin polymerization machinery. Interestingly,
  the CASP first extracellular loop was found conserved in euphyllophytes but absent in plants lacking
  Casparian strips [[cite:PUB00088572],[cite:PUB00072979]].
