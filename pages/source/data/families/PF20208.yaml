description: ARPP-1 shows a distinguishing group of absolutely conserved residues, including a cysteine
  and a glutamine, suggestive of enzymatic activity. Structural predictions reveal a core beta-sheet comprised
  of a duplicated four-stranded beta-meander with a beta-barrel domain bearing the absolutely conserved
  residues inserted into the first repeat. The unifying biochemical theme across its conserved contextual
  genome linkages is the presence of molecules with sugar moieties (ADPr, nucleotides, and polysaccharides).
  In genome contexts linking ARPP-1 with ARG and other counter viral ribosylation domains, ARPP is predicted
  to act on ribose moieties coming from ADPr. The presence of the conserved cysteine suggests that it
  could function analogous to the recently characterized SRAP domain by forming covalent cross-links with
  sugars [[cite:PUB00153825],[cite:PUB00153826]].
