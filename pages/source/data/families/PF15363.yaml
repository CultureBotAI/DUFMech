description: This domain is found at the C terminus of BTB/POZ domain-containing protein 8 (BTBD8, also
  known as AP2-interacting clathrin-endocytosis protein). BTBD8 is involved in clathrin-mediated endocytosis
  at the synapse and plays a role in neuronal development and in synaptic vesicle recycling in mature
  neurons, a process required for normal synaptic transmission [[cite:PUB00090548]]. There is a conserved
  ELET sequence motif. There are two completely conserved residues (S and E) that may be functionally
  important.
