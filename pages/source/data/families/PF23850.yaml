description: This entry represents an uncharacterized protein of approximately 70-100 amino acids found
  in mycobacteriophages. The function of this protein is currently unknown. It is found in phages belonging
  to the Gracegardnervirinae subfamily, including Cheoctovirus and Terapinvirus genera. This protein forms
  a confident dimer according to an AlphaFold model of [swissprot:S5Z4M5]. The dimer forms a central four
  stranded beta sheet with two alpha helices packed orthogonally to the direction of the beta strands
  on each face of the sheet.
