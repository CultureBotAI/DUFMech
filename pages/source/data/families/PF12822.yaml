description: Energy-coupling factor (ECF) transporters consist of a substrate-specific component (known
  as the S component), and an energy-coupling module [[cite:PUB00056162]]. The substrate-binding component
  is a small integral membrane protein which captures specific substrates and forms an active transporter
  in the presence of the energy-coupling AT module.
