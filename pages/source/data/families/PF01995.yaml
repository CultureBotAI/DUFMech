description: This entry comprises two domains found in the nitrogen regulatory protein NrpR that bind
  DNA and repress transcription of nitrogen assimilation genes. The two NrpR regulatory domains (NRD1
  and NRD2) that sense and bind 2-oxoglutarate (2OG) are both structurally and functionally homologous
  and share a high degree of sequence conservation. Mutational analysis of NrpR from Methanococcus maripaludis
  (MmNrpR) indicated that the two most critical residues for 2OG binding are Cys389 and His435 (Cys395
  and His441, respectively in thermophilic archaeon Methanocaldococcus jannaschii (MjNrpR)). Both the
  Cys395 and His441 are conserved among NrpR proteins from diverse species [[cite:PUB00086621]].
