description: This is the C-terminal domain found in NF-kappa-B-activating protein (Nkap) and a hypothetical
  open reading frame on chromosome 6, c6orf194. Functional studies in Nkap indicate that this domain is
  the HDAC3 binding domain and is required for transcriptional repression [[cite:PUB00075800]]. Nkap functions
  as a transcriptional repressor on Notch target genes, and is required for T cell development and acquisition
  of functional competency [[cite:PUB00075800],[cite:PUB00075801],[cite:PUB00075802]].
