description: This family contains the N terminal region of several LUC7 protein homologues and only contains
  eukaryotic proteins. LUC7 has been shown to be a U1 snRNA associated protein [[cite:PUB00016924]] with
  a role in splice site recognition [[cite:PUB00016923]]. The family also contains human and mouse LUC7
  like (LUC7L) proteins [[cite:PUB00016922]] and human cisplatin resistance-associated overexpressed protein
  (CROP) [[cite:PUB00016921]].
