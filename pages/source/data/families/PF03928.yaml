description: This entry includes haem degrading protein HbpS from Streptomyces reticuli (swiss:Q9RIM2)
  and and GlcG from Escherichia coli [[cite:PUB00007282]]. HbpS is up-regulated in response to haemin-
  and peroxide-based oxidative stress. It interacts with the SenS/SenR two-component signal transduction
  system. Iron binds to surface-exposed lysine residues of an octomeric assembly of the protein [[cite:PUB00052019]].
  The structure of GlcG is composed of an alpha-beta(2)-alpha(3)-beta(2)-alpha fold, similar to the Roadblock/LC7
  domain.
