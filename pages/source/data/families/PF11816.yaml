description: This entry represents the ubiquitin-like domain of WDR48 and its homologues. WDR48 (also
  known as UAF1) is a regulator of deubiquitinating complexes [[cite:PUB00092494],[cite:PUB00092495],[cite:PUB00092496]].
  Bun107 is required for the Ubp9 recruitment to septa and cell tips but also for its enzymatic activity
  at these specific locations [[cite:PUB00057398]].
