description: Family members include Autographa californica nuclear polyhedrosis virus (AcMNPV), AC78 or
  Orf78. AC78 is a late gene in the viral life cycle and encodes an envelope structural protein that plays
  an essential role in embedding the occlusion-derived virus (ODV) in the occlusion body [[cite:PUB00082587]].
  Although AC78 is not essential for budding virus formation or nucleocapsid assembly and ODV formation,
  number are significantly reduced if the gene is knocked-out [[cite:PUB00082588]].
