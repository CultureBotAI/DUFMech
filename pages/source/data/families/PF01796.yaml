description: 'This domain is found at the C-terminal end of the probable enoyl -CoA hydratase alpha subunit
  from Thermomonospora curvata (ChsH2) and similar archaeal and bacterial proteins. ChsH2 is likely to
  be involved in bile acid degradation. The C-terminal region of this protein is organised into two domains:
  an N-terminal zinc finger domain ([pfam:PF12172]) and an OB-fold domain (this entry) that consists of
  a five-stranded beta-barrel [[cite:PUB00155451]]. This domain is also found in 3-oxo-4,17- pregnadiene-20-carboxyl-CoA
  hydratase alpha subunit from Mycobacterium tuberculosis that is involved in cholesterol side chain degradation
  [[cite:PUB00154876]]. It is also found in Methanothermococcus thermolithotrophicus HMGCS, an enzyme
  complex comprising the thiolase and 3-hydroxy-3-methylglutaryl (HMG)-CoA synthase, that catalyses the
  second reaction in the mevalonate pathway-the exergonic condensation of acetoacetyl-CoA and acetyl-CoA
  to HMG-CoA [[cite:PUB00154878]].'
