description: YbeY is a single strand-specific metallo-endoribonuclease involved in late-stage 70S ribosome
  quality control and in maturation of the 3' terminus of the 16S rRNA. It acts together with the RNase
  R to eliminate defective 70S ribosomes, but not properly maturated 70S ribosomes or individual subunits,
  by a process mediated specifically by the 30S ribosomal subunit. It is involved in the processing of
  16S, 23S and 5S rRNAs, with a particularly strong effect on maturation at both the 5'-and 3'-ends of
  16S rRNA as well as maturation of the 5'-end of 23S and 5S rRNAs [[cite:PUB00064743],[cite:PUB00064742],[cite:PUB00096939]].
  The crystal structure of the protein from Aquifex aeolicus showed an overall fold consisting of one
  central alpha-helix surrounded by a four-stranded beta-sheet and four other alpha-helices [[cite:PUB00027806]].
