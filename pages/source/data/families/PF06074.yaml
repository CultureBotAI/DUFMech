description: This entry represents phage portal proteins found in bacteriophage Mu (gp29 protein [swissprot:Q9T1W5]).
  This protein Forms the portal vertex of the capsid. This portal plays critical roles in head assembly,
  genome packaging, neck/tail attachment, and genome ejection. The portal protein multimerizes as a single
  ring-shaped homododecamer arranged around a central channel.
