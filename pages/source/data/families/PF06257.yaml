description: VEG is a family that is highly conserved among Gram-positive bacteria. It stimulates biofilm
  formation through inducing transcription of the tapA-sipW-tasA operon. The products of this operon are
  resposible for production of the amyloid fibre (TasA) component of the biofilm. Veg or a Veg-induced
  protein acts as an antirepressor of SinR - part of the major overall biofilm transcriptional control
  system - to regulate and stimulate biofilm formation. Veg is transcribed at high levels during both
  exponential growth and sporulation [[cite:PUB00070838],[cite:PUB00070839]].
