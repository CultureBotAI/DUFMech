description: NamZ is an exo-beta-N-acetylmuramidase which catalyzes an exo-lytic cleavage of beta-1,4-acetylmuramic
  acid from from the non-reducing ends of peptidoglycan chains [[cite:PUB00100156]] and it is a founding
  member of a new family of glycosidases (GH171). NamZ consists of a N-terminal catalytic domain with
  a Rossmann-like fold (represented in this entry) and a C-terminal auxiliary alpha/beta domain [[cite:PUB00100156]].
