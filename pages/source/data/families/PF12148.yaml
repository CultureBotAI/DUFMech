description: TTD, tandem tudor domain within UHRF1 preferentially binds H3 histone tails trimethylated
  at Lys-9. It specifically recognises H3 tail peptides with the heterochromatin-associated modification
  state of trimethylated lysine 9 and unmodified lysine 4 (H3K4me0/K9me3). This domain is found in eukaryotes
  and is found in association with [pfam:PF00097], [pfam:PF02182], [pfam:PF00628], [pfam:PF00240].
