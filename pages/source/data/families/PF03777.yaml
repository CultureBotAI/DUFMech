description: Small domain found in a family of secreted streptomyces proteins. It occurs singly or as
  a pair. Many of the domains have two cysteines that may form a disulphide bridge. This domain is found
  in chaplins ChpA-C (coelicolor hydrophobic aerial) proteins. ChpA-C contain a canonical C-terminal sortase
  signal, which is recognized by sortase enzymes that covalently couple their substrates to the peptidoglycan
  present in the cell wall. Indeed, direct evidence for sortase-mediated coupling of ChpC has been demonstrated,
  and it is expected that ChpA and ChpB are also anchored to the cell wall [[cite:PUB00091046]].
