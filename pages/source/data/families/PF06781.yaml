description: 'CrgA is a trans-membrane (TM) protein, first described in Streptomyces as being required
  for sporulation through the coordination of several aspects of reproductive growth. In Mtb (Mycobacterium
  tuberculosis ) CrgA is a central component of the divisome, and consists of 93 residues with two predicted
  TM helices (TM1: residues 29-51; and TM2: residues 66-88). CrgA facilitates the recruitment of the proteins
  essential for peptidoglycan synthesis to the divisome and also stabilizes the divisome. Reduced production
  of CrgA results in elongated cells and reduced growth rate, and loss of CrgA impairs peptidoglycan synthesis.
  CrgA has homologs in other actinomycetes [[cite:PUB00081940]].'
