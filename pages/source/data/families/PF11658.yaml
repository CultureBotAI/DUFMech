description: CBP_BcsG is a component of bacterial cellulose synthase complex that plays a role in biofilm
  formation in bacteria [[cite:PUB00075887]]. It is a Zn(2+)-dependent phosphoethanolamine transferase
  that catalyses transfer of phosphoethanolamine residues from membrane phosphatidylethanolamine to the
  glucosyl residues in the nascent cellulose chain [[cite:PUB00100650],[cite:PUB00100651],[cite:PUB00100652],[cite:PUB00100653]].
  This entry represents the C-terminal domain which functions as a phosphoethanolamine transferase [[cite:PUB00100653]].
