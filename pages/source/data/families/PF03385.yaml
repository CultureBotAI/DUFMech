description: This domain family is found in Metazoa and in Virdiplantae. Two of the family members are
  characterized in Arabidopsis thaliana. [swissprot:O22943] and [swissprot:Q9SCN0] and named STELLO1 (STL1)
  and STELLO2 (STL2) respectively. They are Golgi-localized proteins that can interact with CesAs (cellulose
  synthase A) and control cellulose quantity. In the absence of STELLO function, the spatial distribution
  within the Golgi, secretion and activity of the CSCs are impaired indicating a central role of the STELLO
  proteins in CSC assembly. Point mutations in the predicted catalytic domains of the STELLO proteins
  indicate that they are glycosyltransferases facing the Golgi lumen. STL homologues are present throughout
  the plant kingdom, but STL proteins are distinct from distantly related proteins in nematodes, fungi
  and molluscs [[cite:PUB00081895]].
