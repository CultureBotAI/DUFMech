description: This domain is found at the N-terminal end of protein members of the glycoside hydrolase
  family 123, including N-acetylgalactosaminidase from Clostridium perfringens. This enzyme removes specific
  terminal N-D-acetylgalactosamine from glycosphingolipids. This domain folds into a twisted beta-sandwich
  that consists of two 5-stranded beta-sheets, two small beta-strands and four small alpha-helices [[cite:PUB00100654]].
