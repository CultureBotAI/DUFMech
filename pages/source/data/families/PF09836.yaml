description: This entry describes the N-terminal domain in HvfC ([swissprot:Q4QL34]), NGO_1945 ([swissprot:Q5F5I0],
  [pdbe:3dee]), BufC1 and various other proteins partnered with MNIO family peptide modification enzymes.
  HvfC, as described in Haemophilus influenzae, is a partner protein to the multinuclear nonheme iron-dependent
  oxidase (MNIO) enzyme HvfB [swissprot:Q4QL34], and participates in post-translational modification that
  converts the precursor protein HvfA (Haemophilus virulence factor A) into a copper-binding metallophore
  and a contributor to the cell's ability to invade host cells and survive as an intracellular pathogen
  [[cite:PUB00161768],[cite:PUB00161749],[cite:PUB00161769]]. The related protein NGO_1945 occurs in a
  similar genomic context and was previously suggested to be a DNA-binding protein [[cite:PUB00057687]].
  It comprises residues 31 to 117 as a helical bundle with 4 main helices [[cite:PUB00057687]]. The C-terminal
  is represented by [[pfam:PF22106]].
