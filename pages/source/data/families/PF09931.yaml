description: This entry represents the N-terminal attachment domain (residues 1-142) of the baseplate
  hub protein found in phages and gene transfer agents [[cite:PUB00153971]]. This domain is part of a
  multi-domain protein that also contains an ion-binding domain (143-167, 250-263), an oligosaccharide-binding
  domain (168-249), and a C-terminal clip domain (264-296). The attachment domain enables binding to the
  distal tail proteins and helps anchor the hub protein within the baseplate structure. This family is
  found almost exclusively in phages and prophage regions of bacterial genomes, including the Rhodobacter
  capsulatus gene transfer agent.
