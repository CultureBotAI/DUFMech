description: This domain (previously known as DUF4388) is found in the Protein PatA from Nostoc sp. and
  related proteins including Uncharacterized protein aq_1845 from Aquifex aeolicus. PatA controls heterocyst
  pattern formation. It is required for the differentiation of intercalary heterocysts but not for terminal
  heterocysts [[cite:PUB00014608],[cite:PUB00075466]].
