description: This domain, and the associated ANK family repeat [pfam:PF00023] domain, are found in ANKRD13
  of which at least 4 subtypes are known to exist, termed A-D. ANKRD13C act as a chaperone for biogenesis
  and folding of the DP receptor for prostaglandin D2 [[cite:PUB00057233]]. ANKRD13A/B/D are ubiquitin-binding
  proteins that specifically recognise and bind Lys-63-linked ubiquitin. They positively regulate the
  internalisation of ligand-activated EGFR by binding to the Ub moiety of ubiquitinated EGFR at the cell
  membrane [[cite:PUB00155297]].
