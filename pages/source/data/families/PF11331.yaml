description: This zinc beta ribbon domain is found in Protein ENHANCED DISEASE RESISTANCE 4 (EDR4) and
  related plant proteins. EDR4 mainly localizes to the plasma membrane and endosomal compartments. It
  plays a negative role in resistance to powdery mildew and this requires salicylic acid signaling [[cite:PUB00090747]].
  In Arabidopsis, EDR4 associates with CLATHRIN HEAVY CHAIN2 (CHC2) and modulates plant immunity by regulating
  the relocation of EDR1 [[cite:PUB00090747]].
