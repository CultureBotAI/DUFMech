description: This entry represents a group of plant proteins, including protein SOSEKI1-5 from Arabidopsis
  thaliana and Physcomitrium patens. SOK1-5 integrate apical-basal and radial organismal axes to localise
  to polar cell edges and contain a DIX oligomerization domain that resembles that in the animal Dishevelled
  polarity regulator [[cite:PUB00073664],[cite:PUB00096645],[cite:PUB00096647],[cite:PUB00096646]].
