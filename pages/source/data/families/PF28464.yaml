description: This domain is found in uncharacterised proteins from bacteria and eukaryotes. It is predicted
  to fold into an alpha/beta structure composed of four-stranded antiparallel beta-sheet with strand order
  2341 and alpha helices packed on one face of the sheet. This domain contains two pair of highly conserved
  cysteine residues that are predicted to form disulfide bonds. It is frequently found N-terminal to TIM-barrel
  domain.
