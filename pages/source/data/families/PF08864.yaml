description: This entry represents the N-terminal domain of Peptidoglycan synthesis regulatory protein
  ReoY ([swissprot:Q8Y5Y2]) which is involved in the PASTA kinase-mediated signalling pathway regulating
  peptidoglycan synthesis to maintain cell wall integrity [[cite:PUB00104135]]. It modulates peptidoglycan
  (PG) synthesis pathway committed-step enzyme MurA [[cite:PUB00104135]]. ReoY positively modulates ClpCP-dependent
  proteolysis of MurA, thereby regulating PG synthesis and inhibiting intrinsic cephalosporin resistance
  [[cite:PUB00104135]].
