description: Members of this family have two highly conserved cysteine residues within the DxxCxxC motif
  at the N-terminal. This motif is conserved in the thiol-disulfide oxidoreductase family [[cite:PUB00096851]].
  This family includes At5g50100 (also known as DCC1) from Arabidopsis thaliana, a thioredoxin that modulates
  ROS homeostasis resulting in de novo shoot initiation and may be involved in the improvement of the
  capacity of plant regeneration [[cite:PUB00096851]]. Uncharacterised proteins from bacteria are also
  included in this family.
