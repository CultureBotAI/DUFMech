description: This entry represents a member of a biosynthetic gene cluster (BGC). This BGC (BGC0000976)
  is described by MIBiG as an example of the following biosynthetic classes, NRP (non-ribosomal peptide)
  and polyketide. It includes a member from the curacin A biosynthetic gene cluster from Moorea producens
  3L [[cite:PUB00099410],[cite:PUB00099420]]. This family appears to be predominantly found in Cyanobacteria.
