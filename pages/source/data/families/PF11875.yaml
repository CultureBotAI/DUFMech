description: This is the C-terminal domain found in DnaJ-like proteins, including DnaJ homolog subfamily
  C member 11 (DNAJC11) from mammals and Chaperone protein dnaJ 13 from Arabidopsis. DNAJC11 is a mitochondrial
  outer membrane protein involved in mitochondrial biogenesis and in the response to microenvironment
  changes and requirements. The J-domain is mediated its mitochondrial localization, while this domain
  is critical for protein-protein interactions [[cite:PUB00098186]]. This domain adopts a SUEL/RBL-like
  fold and contains the conserved motif FxDPCxxxxxK [[cite:PUB00152793]] in common with the carbohydrate-binding
  loop of the SUEL/RBL lectin domain ([pfam:PF02140]) [[cite:PUB00152793]].
