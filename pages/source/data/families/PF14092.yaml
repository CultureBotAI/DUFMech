description: This entry, previously known as DUF4270, represents BamH subunit of the beta-barrel-assembly
  machinery so-called BAM. BamH along with BamG are involved in forming the extracellular canopy and are
  both required for BAM function. They are conserved across the Bacteroidota, suggesting that they form
  an essential extension to the canonical BAM core in this phylum. BamH interacts with BamM to form a
  long canopy structure on the extracellular side of the outer membrane that extends from the rear of
  BamA across the BamA barrel [[cite:PUB00163537]]. BamH consists of two homologous beta-sandwich domains
  with a Nucleoplasmin-like jelly roll topology. One of the domains is inserted into the other resulting
  in a circular permutation. The N-terminal strand of one of the domains occupies the position of the
  C-terminal strand of the other.
