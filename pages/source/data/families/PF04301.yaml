description: This protein family includes Pimeloyl-ACP methyl esterase BioG from Haemophilus influenzae
  ([swissprot:P44251]) and similar bacterial proteins. This enzyme is involved in the biosynthesis of
  pymeloyl-ACP and, hence, in biotin biosynthesis. It is organised into a a core domain formed by a seven-stranded
  beta-sheet and a lid domain consisting of four alpha-helices [[cite:PUB00100663]].
