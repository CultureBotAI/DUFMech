description: This entry represents the C-terminal domain from a family of uncharacterised proteins in
  Methanobacteriota. The proteins are predominantly found in archaea, specifically within the Methanobacteriota
  phylum. This includes orders such as Methanobacteriales, Methanosarcinales, and Methanomicrobiales.
  The proteins in this family are approximately 500 amino acids in length. This domain shows structural
  similarity to cyclophilin type peptidyl-prolyl cis-trans isomerases. Domains 2 and 3 in these proteins
  also adopt the same fold.
