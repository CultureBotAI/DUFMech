description: This entry describes a domain of unknown function, which could adopt a similar fold to the
  SWEET-like (TM helices) domain. It was found in Transmembrane E3 ubiquitin-proteins and members of the
  DSC E3 ubiquitin ligase complex. It is predominant in fungi and plants, including the FLY1/2 proteins
  from Arabidopsis thaliana, the DSC complex protein from Schizosaccharomyces pombe, and TUL1 from Saccharomyces
  cerevisiae. This domain hasn't been functionally characterised yet but it is formed by seven alpha-helices
  [[cite:PUB00150892]].
