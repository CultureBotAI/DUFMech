description: This family includes members such as plant proteins AtDMPs 1-10 (Arabidopsis thaliana DUF679
  domain membrane proteins 1 -10) [[cite:PUB00136742]]. The AtDMP proteins are predicted to have four
  transmembrane spans, with cytosolic amino- and carboxy-termini. DMP1 is a membrane protein that may
  be involved in membrane fission during breakdown of the ER and the tonoplast during leaf senescence
  and in membrane fusion during vacuole biogenesis in roots [[cite:PUB00086645]]. Several DMP proteins
  are expressed in senescing organs (DMP1, -3, -4) or tissues that will stall later in development (DMP1,
  -2, -4, -7). These expression patterns strongly suggest involvement of several DMPs in various programmed
  cell death processes, e.g. senescence, dehiscence and abscission [[cite:PUB00136742]]. AtDMP8 and AtDMP9
  however, have been shown to facilitate gamete fusion during double fertilisation in flowering plants
  [[cite:PUB00093467]].
