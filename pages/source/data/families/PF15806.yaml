description: This entry includes Trafficking protein particle complex subunit 14 (TRAPP14), a specific
  subunit of the TRAPP (transport protein particle) II complex, a conserved vesicle tethering complex
  that functions in late Golgi trafficking as a membrane tether [[cite:PUB00092767],[cite:PUB00096661]].
  This entry represents the N-terminal region consisting of two domains which adopt a Ig-like fold, where
  distant amino acids in the sequence contribute to different beta-sheets in the structure.
