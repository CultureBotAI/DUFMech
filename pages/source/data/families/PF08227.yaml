description: The DASH complex is a ~10 subunit microtubule-binding complex that is transferred to the
  kinetochore prior to mitosis [[cite:PUB00017174]]. In Saccharomyces cerevisiae DASH forms both rings
  and spiral structures on microtubules in vitro [[cite:PUB00033281],[cite:PUB00033282]]. This family
  also includes several higher eukaryotic proteins. However, other DASH subunits do not appear to be conserved
  in higher eukaryotes.
