description: This entry represents the C-terminal beta solenoid domain of FapA and its homologues. Members
  of this family include FapA (flagellar assembly protein A) [swissprot:Q7MBR0] found in Vibrio vulnificus.
  The synthesis of flagella allows bacteria to respond to chemotaxis by facilitating motility. Studies
  examining the role of FapA show that the loss or delocalization of FapA results in a complete failure
  of the flagellar biosynthesis and motility in response to glucose mediated chemotaxis. The polar localization
  of FapA is required for flagellar synthesis, and dephosphorylated EIIAGlc (Glucose-permease IIA component)
  inhibited the polar localization of FapA through direct interaction [[cite:PUB00085059]]. This entry
  shows similarity to [pfam:PF03775] suggesting a similar functional role.
