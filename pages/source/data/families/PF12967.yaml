description: Family based on orphan protein (TM0875) from Thermotoga maritima that has been structurally
  determined as PDB:1022. The TM0875 gene of Thermotoga maritima encodes a hypothetical protein NP_228683
  [[cite:PUB00029305]] of unknown function. Analysis of TM0875 genomic context reveals the presence of
  MMT1 (a predicted Co/Zn/Cd cation transporter) and an inactive homolog of metal-dependent proteases.
  1O22 shows weak structural similarity with the phosphoribosylformylglycinamidine synthase 1t4a (Dali
  Z-scr=4.6), the yggU protein (PDB structure:1n91; with DALI Z-scr=3), and with the thioesterase superfamily
  member (PDB structure 2cy9 - found using FATCAT), even though they have very low sequence identity.
