description: This domain is found in uncharacterised bacterial proteins. It is predicted to fold into
  an alpha/beta structure composed of a central five-stranded mixed beta-sheet and alpha-helices packed
  on both sides. This domain has a significant structural similarity to domains members of PD-(D/E)XK
  nuclease superfamily that extends to the active site architecture suggesting that this domain may possess
  endonuclease activity. This domain is frequently found in combination with [pfam:PF28123] (DUF8370).
