- graph_id: tm1631-modeled-dna-cleavage-2016
  title: Proposed Tm1631 DNA cleavage in a preorganized computational system
  scope: Ogrizek2016 Figures 1-3 and modeled coordinate subsets, extending the Konc2013 Tm1631-DNA pose;
    no experimental nuclease assay.
  context: Joint modeled Tm1631, DNA, two Mg ions and an assumed nucleophile; a 42-atom QM region treated
    with B3LYP/6-31G* within CHARMM36. Sixteen interpolated replicas connect constructed reactant/product
    endpoints.
  family_mapping: Thermotoga maritima MSB8 Tm1631 Q9X1W6, sequence version 1, equals AAD36698.1 and WP_004082107.1;
    261 aa, PF01904 at 3-259. PDB 1VPQ entity residues 13-273 match this sequence after a 12-residue tag.
    Supplement Figure S2 maps modeled Lys73 to native K72; reference residue 73 is T.
  scope_status: HYPOTHETICAL
  taxon: NCBITaxon:243274
  limitations: PDB 1VPQ contains sulfate and water, not observed bound DNA or Mg. The starting pose and
    chemistry are constructed; 2013 restraints, initial neutral lysine, hydroxide generation and ion identity/count
    remain assumptions. Relative potential-energy profiles are not measured rates or fully sampled activation
    free energies. Figures 4/5 change ion or wider-environment conditions, not an isolated protein-only
    deletion. Five coordinate subsets were parsed, not rerun as QM calculations. No demonstrated DNA binding,
    residue-mutant effect, biological repair or family-wide nuclease activity.
  nodes:
  - node_id: modeled-reactant-system
    label: Preorganized Tm1631-DNA system with two Mg ions and assumed nucleophile
    node_type: STATE
  - node_id: proposed-pentacovalent-state
    label: Proposed pentacovalent DNA phosphate state in the joint modeled system
    node_type: STATE
  - node_id: proposed-nicked-dna
    label: Proposed nicked DNA after modeled P-O3' cleavage
    node_type: STATE
  edges:
  - edge_id: proposed-nucleophilic-attack
    subject: modeled-reactant-system
    predicate: converts_to
    object: proposed-pentacovalent-state
    mechanism: The proposed path places a nucleophile near the DNA phosphate and produces a pentacovalent
      state; replica 5 is a modeled potential-energy minimum, not an experimentally trapped intermediate.
      An early lysine-deprotonation event was not established and is not added as a separate edge.
    directness: UNRESOLVED
    support: HYPOTHESIZED
    evidence_kind: COMPUTATIONAL
    evidence:
    - reference: PMID:27398092
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4939058/
      snippet: pentacovalent intermediate
      explanation: Visually inspected original Figures 1-3, main Methods and parsed supplemental captions/coordinate
        subsets support the authors' computational proposal only. Figure S2 explicitly resolves model
        Lys73 as native K72; no K73 mutant or measured proton-transfer event.
      cache_path: evidence/PF01904/ogrizek-2016.txt
      cache_sha256: 14035fbe893099339ba98311c2b78203dfc6e94b87e81cac2f573700206708d0
  - edge_id: proposed-phosphodiester-cleavage
    subject: proposed-pentacovalent-state
    predicate: converts_to
    object: proposed-nicked-dna
    mechanism: Under the same joint modeled conditions, the proposed phosphate intermediate proceeds to
      P-O3' bond cleavage. Constructed product endpoints and relative potential energies do not establish
      real turnover, product release, cleavage specificity or an independent experimental observation.
    directness: UNRESOLVED
    support: HYPOTHESIZED
    evidence_kind: COMPUTATIONAL
    evidence:
    - reference: PMID:27398092
      source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4939058/
      snippet: pentacovalent intermediate
      explanation: Original Figures 1-3 and Methods describe the proposed path to the constructed cleaved-DNA
        endpoint. Figures 4/5 retain distinct ion and environment comparisons; their profiles are not
