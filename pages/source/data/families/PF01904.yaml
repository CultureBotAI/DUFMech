discussions:
- discussion_id: duf72-model-to-experiment-gap
  prompt: Test the proposed Tm1631 chemistry without treating simulation as experimental characterization.
  kind: CURATION_TODO
  status: OPEN
  rationale: Two computational steps preserve the proposed reaction but do not establish nuclease activity.
    The 2016 work extends the 2013 model rather than independently replicating an experiment.
  evidence:
  - reference: PMID:24244144
    supports: PARTIAL
    evidence_source: primary_computational_methods
    explanation: Binding-site similarity, restrained molecular dynamics and an entropy-qualified MM/GBSA
      comparison generate a candidate pose; beta-clamp association is motif based, not measured.
  - reference: PMID:27398092
    supports: PARTIAL
    evidence_source: primary_computational_methods_and_supplement
    explanation: Main figures and supplemental caption resolve the proposed path and model Lys73/native
      K72 mapping. Initial protonation and ion chemistry remain assumptions, not experimentally tested
      steps.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: Seek independently verified DNA binding, product identity, metal dependence, substrate specificity
    and residue perturbations with folding/abundance controls. Keep modeled/native numbering explicit.
    Supplementary DOC text/tables were parsed but images were dropped by conversion, so their plots were
    not visually checked. No simulation was rerun.
- discussion_id: duf72-yece-assay-and-member-coverage
  prompt: Independently validate YecE joint-genotype phenotypes and extend member-specific coverage.
  kind: CURATION_TODO
  status: OPEN
  rationale: Twenty-one observed indirect growth effects preserve a multiplicative single-mutant baseline,
    not a molecular interaction network or general DUF72 DNA-repair mechanism.
  evidence:
  - reference: PMID:24586182
    supports: SUPPORT
    evidence_source: primary_tables_and_screen_protocols
    explanation: All exact YecE recipient rows were retained with scores and donor identities; linkage
      filtering and repeated colony measurements do not remove every marker, polar or secondary-mutation
      alternative.
  - reference: https://www.ebi.ac.uk/interpro/api/entry/pfam/protein/uniprot/P37348/
    supports: SUPPORT
    evidence_source: current_member_mapping
    explanation: Reference YecE maps PF01904 at 3-258; reference equality does not independently sequence
      each historical assay clone.
  posed_by: Codex
  posed_date: '2026-10-11'
  notes: Examine raw fitness data, independent alleles, complementation and exact Hfr/Keio-derived clone
    identity. Positive interactions are not WT rescue. YunF expression, cofitness, prophage insertion
    at the yecE locus and similarly named unrelated enzymes remain excluded leads. Most of the 14646 frozen
    members and other structures remain unassessed. Keep IN_PROGRESS; this is partial same-agent curation.
causal_graphs:
- graph_id: yece-joint-deletion-relative-growth-2014
  title: YecE joint deletions alter colony growth relative to multiplicative expectations
  scope: Babu2014 Table S2; all 21 exact b1868__yecE recipient rows, each a separate joint genotype.
  context: Hfr Cavalli donor deletion::Cm transferred into a Keio F- recipient deletion::Kan; rich LB
    with dual selection, 36 h outgrowth at 32 C. Protocol S2 reports two screens, four biological recipient
    colonies and eight measurements per pair.
  family_mapping: E. coli K-12 YecE P37348, sequence version 4, equals NP_416382.1, AAC74938.1 and BAA15679.2;
    272 aa with PF01904 at 3-258. b1868/JW1857 reference identity is not independent sequencing of the
    historical assay clone.
  scope_status: PHENOTYPIC
  taxon: NCBITaxon:83333
  limitations: Normalized double-mutant colony growth is compared with multiplicative expected fitness
    from the single mutants, not WT or the addition of one deletion. Positive scores are not WT rescue
    or faster absolute growth. All 21 donors are non-essential and labeled This Study in Table S1; Table
    S16 verifies their Hfr Cavalli deletion::Cm context. Raw colony images, row-specific dispersion, exact
    clone sequences and allele-specific rescue were not inspected. Marker, polar and secondary-mutation
    effects remain alternatives; no gene-to-gene molecular pathway is inferred.
