description: This small family of proteins is functionally uncharacterized. It is found mainly in Firmicutes.
  Proteins in this family are around 130 amino acids in length. Based on NMR structure 2MCT, it forms
  an alpha/beta structure with a 6 stranded antiparallel b-sheet planked by a single alpha helix. The
  only protein with similar structures is a putative lipoprotein (PDB code 4R7R).
