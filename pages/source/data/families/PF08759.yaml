description: This domain is found at the C terminus of proteins such as the probable glycosyltransferase
  Gly ([swissprot:Q9AEU2]) that also contain the glycosyl transferase domain at the N terminus. It is
  also found N-terminal in numerous putative glycosyltransferases such as GalT1. GalT1 has been shown
  to catalyse the third step of Fap1 glycosylation [[cite:PUB00081880]]. This domain is structurally distinct
  from all known GT folds of glycosyltransferases and contains a metal binding site. This new glycosyltransferase
  fold has been named GT-D [[cite:PUB00081880]].
