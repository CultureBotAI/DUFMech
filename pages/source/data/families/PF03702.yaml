description: Anhydro-N-acetylmuramic acid kinase catalyses the specific phosphorylation of 1,6-anhydro-N-acetylmuramic
  acid (anhMurNAc) with the simultaneous cleavage of the 1,6-anhydro ring, generating MurNAc-6-P. It is
  also required for the utilization of anhMurNAc, either imported from the medium, or derived from its
  own cell wall murein, and in so doing plays a role in cell wall recycling [[cite:PUB00046146],[cite:PUB00043013]].
