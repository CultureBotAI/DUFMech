description: 'This domain corresponds to the C-terminal region of SF3a60 subunit (Prp9 in yeast counterpart)
  from the highly conserved heterotrimeric complex SF3a found in eukaryotes. It is essential for pre-mRNA
  splicing that functions in spliceosome assembly within the mature U2 snRNP (small ribonucleoprotein
  particle). This domain has two conserved sequence motifs: PIP and CEICG. It contains a zinc-finger domain
  of the C2H2-type which might be important for RNA binding and protein-protein interactions with components
  of the SF3b complex [[cite:PUB00059480]].'
