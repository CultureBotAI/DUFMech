description: Members of this family act as antitoxins in type II toxin-antitoxin systems [[cite:PUB00015218]].
  When bound to their toxin partners, they can bind DNA via the N-terminus and repress the expression
  of operons containing genes encoding the toxin and the antitoxin [[cite:PUB00054755]]. This domain complexes
  with Txe toxins containing [pfam:PF06769], Fic/DOC toxins containing [pfam:PF02661] and YafO toxins
  containing [pfam:PF13957].
