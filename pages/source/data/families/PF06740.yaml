description: The Drosophila protein Futsch has homology to MAP1B and controls synaptic growth at the Drosophila
  neuromuscular junction through the regulation of the synaptic microtubule cytoskeleton. Ftusch protein
  colocalises with microtubules and identifies cytoskeletal loops that traverse the lateral margin of
  select synaptic boutons. Futsch mutations disrupt synaptic microtubule organisation. The N- and C-terminal
  domains of Futsch are homologous to the vertebrate MAP1B microtubule-associated protein. The central
  domain of Futsch is highly repetitive and it is represented in this entry [[cite:PUB00059957]].
