description: The entry represents a repeats-containing region found at the C-terminal of FAZ1 from Trypanosoma
  brucei brucei and related proteins from typanosomatids. FAZ1 is a component of FAZ filament that is
  required for correct FAZ assembly and attachment [[cite:PUB00155625]]. These repeats consist of 36x14aa
  repeats in T.brucei and T.cruzi while in the Leishmania major LmjF34.0690 orthologue there are 70x14aa
  repeats [[cite:PUB00155625]].
