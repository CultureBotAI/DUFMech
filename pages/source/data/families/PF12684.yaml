description: This family of proteins is functionally uncharacterised. This family of proteins is found
  in bacteria and viruses. Proteins in this family are typically between 265 and 420 amino acids in length.
  It appears that these proteins are distantly related to the PDDEXK superfamily and so these domains
  are likely to be nucleases. This family has a C-terminal cysteine cluster similar to that found in [pfam:PF01930].
