description: QSregVF_b is a family of short Pseudomonas proteins that are potential virulence factors.
  The structure of UniProtKB:Q9HY15 a secreted protein has been solved and deposited as PDB:3npd, from
  [pfam:PF13652]. It is predicted that these two adjacent proteins form a single transcriptional unit
  based on the prediction that together they interact with their adjacent protein PotD, which is the putrescine-binding
  periplasmic protein in the polyamine uptake system comprising PotABCD. These two adjacent proteins are
  predicted to be quroum-sensing-regulated virulence factors [[cite:PUB00075641]].
