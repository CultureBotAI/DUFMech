description: This domain is found at the C terminus of some GTPase-activating proteins (also known as
  GAP) found in animals, including Disabled homolog 2-interacting protein (DAB2P). This region is found
  associated with [pfam:PF00616] and [pfam:PF00168], and includes a coiled-coil domain that forms a parallel
  trimer in solution with one helical strand from each monomer [[cite:PUB00100693]].
