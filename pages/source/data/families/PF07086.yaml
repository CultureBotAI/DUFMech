description: Jagunal is an endoplasmic-reticulum (ER)-membrane protein found in eukaryotes. It is involved
  in reorganising the ER in cells that must increase exocytic membrane traffic during development, that
  is, in the oocyte during vitellogenesis. It facilitates vesicular traffic in the subcortex [[cite:PUB00068041]].
