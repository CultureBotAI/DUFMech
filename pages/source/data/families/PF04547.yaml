description: The family carries eight putative transmembrane domains, and, although it has no similarity
  to other known channel proteins, it is clearly a calcium-activated ionic channel. It is expressed in
  various secretory epithelia, the retina and sensory neurons, and mediates receptor-activated chloride
  currents in diverse physiological processes [[cite:PUB00069342]].
