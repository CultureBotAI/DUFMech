description: DHOR is a family of di-haem oxidoreductases. It carries the two characteristic Cys-X-Y-Cys-His
  haem-binding motifs. The C-terminal high-potential site functions as an electron transfer centre, and
  the N-terminal low-potential site corresponds to the peroxidatic centre. Its probable function is as
  a peroxidase [[cite:PUB00075353]].
