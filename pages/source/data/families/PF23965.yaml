description: This entry represents an uncharacterized protein of approximately 54 amino acids found in
  T5-like bacteriophages that infect Escherichia coli and Salmonella. Homologs have been identified in
  several T5-like phages including bacteriophage T5, Salmonella phage vB_SenS_SB13, and Escherichia phage
  vB_EcoS-26175V. Structure prediction suggests that this protein forms a strand swapped homodimeric arrangement.
  The dimeric structure forms two four stranded sheets that are connected by two alpha helices. The C-terminal
  of each protein is donated to the sheet made by the other monomer.
