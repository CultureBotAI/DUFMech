description: This is the coiled-coil region of PML, also known as TRIM19. PML acts in association with
  PML-nuclear bodies (PML-NBs) in a wide range of important cellular processes, such as tumour, suppression,
  transcriptional regulation, apoptosis, senescence, DNA damage response, and viral defense mechanisms.
  PML is defined by the TRIM/RBCC motif which consists of an N-terminal RING zinc finger, two BBox type
  zinc fingers followed by a coiled-coil region [[cite:PUB00102048]]. This coiled-coil region is thought
  to mediate interactions with cytomegalovirus IE1 protein and/or other partners [[cite:PUB00102048]].
  This entry also includes RNF207, which has a similar organisation.
