description: This entry represents the first domain of aconitase X (AcnX), which corresponds to domain
  2 in the canonical four-domain architecture of the aconitase superfamily. This domain contains a central
  parallel beta-sheet linked by alpha-helices, similar to nucleotide-binding domains of dehydrogenases
  [[cite:PUB00161781]]. The AcnX subfamily includes bacterial Type I enzymes that function as cis-3-hydroxy-L-proline
  dehydratases and archaeal Type II enzymes that act as mevalonate 5-phosphate dehydratases. Unlike other
  aconitase family members that contain [4Fe-4S] clusters, AcnX enzymes utilise [2Fe-2S] or [3Fe-4S] clusters
  for catalysis [[cite:PUB00088769],[cite:PUB00161781]]. This domain forms part of the active site architecture
  but does not directly coordinate the iron-sulphur cluster.
