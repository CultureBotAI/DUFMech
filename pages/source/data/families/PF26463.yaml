description: This entry represents a pair of domains found in family of uncharacterised proteins from
  halophilic archaea. Based on structural similarity of other domains in these proteins this family may
  represents a family of primase proteins. This entry represents a pair of protein domains with one nested
  within the loop of another. The proteins in this family are predominantly found in the class Halobacteria,
  which includes families such as Natrialbaceae, Halobacteriaceae, and Haloarculaceae. The proteins are
  typically around 500 amino acids in length. Many of these proteins are encoded on plasmids, suggesting
  a potential role in plasmid-associated functions.
