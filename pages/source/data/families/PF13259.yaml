description: 'This domain found in a group of sequences from fungi and plants, including Gag1 from Saccharomyces
  cerevisiae, which interacts with Cka2, the fourth subunit of the eukaryotic kinase CK2. Gag1 is organised
  into three domains: lock, Gag and Clap (this entry). This domain has three regions: rear, hinge and
  front [[cite:PUB00153176]]. It contains two conserved sequence motifs: IPL and FLVD.'
