description: This family represents phage and prophage portal proteins that form the portal of the phage
  particle [[cite:PUB00155786],[cite:PUB00153918],[cite:PUB00154413]]. These proteins form a dodecamer
  assembly that defines a channel for DNA entry and exit. The dodecamer structure resembles a flying saucer
  with a central channel, which is filled with a rope-like DNA chain [[cite:PUB00154413]]. Each subunit
  of the dodecamer is involved in interaction with capsomers. The dodecameric portal is connected with
  the neck, which comprises a dodecameric adaptor, a hexameric connector, and a hexameric terminator gp12,
  forming a continuous DNA injection channel at the center [[cite:PUB00154413]].
