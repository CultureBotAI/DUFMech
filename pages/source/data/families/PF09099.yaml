description: Members of this family, which are predominantly found in the prokaryotic protein quinohemoprotein
  amine dehydrogenase, adopt an immunoglobulin-like beta-sandwich fold, with seven strands arranged into
  two beta sheets; the fold is possibly related to the immunoglobulin and/or fibronectin type III superfamilies.
  The precise function of this domain has not, as yet, been defined [[cite:PUB00022422],[cite:PUB00013277]].
