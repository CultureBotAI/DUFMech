description: This domain is found in the neurobeachins (NBEAs) and BEACH domain containing proteins (BDCPs).
  NBEAS are localised near Golgi apparatus and is involved in vesicular trafficking, intracellular transport,
  membrane dynamics, endosomal recycling, and receptor signalling. BDCPs are associated with lysosome
  size, apoptosis, autophagy, granule size, or synapse formation. Mutations in this domain have been related
  to autosomal recessively inherited lipopolysaccharide-responsive beige-like anchor (LRBA) protein deficiency,
  responsible for common variable immunodeficiency (CVID) and autoimmune lymphoproliferative syndrome
  (ALPS) [[cite:PUB00098183]]. NBEAs deficiency may induce spine loss with defects in synaptic efficacy
  and plasticity, being associated with autism spectrum disorder (ASD) and ASD-related syndromes [[cite:PUB00098182]].
