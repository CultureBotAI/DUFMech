description: This domain is found in large proline-rich protein BAG6 protein. It has a conserved SDL sequence
  motif. Human BAG6 is an ATP-independent molecular chaperone preventing the aggregation of misfolded
  and hydrophobic patches-containing proteins [[cite:PUB00086005]]. It functions as part of a cytosolic
  protein quality control complex, the BAG6/BAT3 complex, which maintains these client proteins in a soluble
  state and participates to their proper delivery to the endoplasmic reticulum or alternatively can promote
  their sorting to the proteasome where they undergo degradation [[cite:PUB00086005],[cite:PUB00086006],[cite:PUB00086007],[cite:PUB00086008]].
