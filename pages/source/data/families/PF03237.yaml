description: This entry represents the N-terminal domain of terminase large subunits found in a variety
  of the Caudovirales and prophage regions of bacterial genomes. It includes the terminase large subunit
  of Bacteriophage T4 (terminase gene 17, Gp17) [[cite:PUB00082635],[cite:PUB00095683]]. Homologues are
  also found in Gene Transfer Agents (GTA) [[cite:PUB00055430]], including ORFg2 (RCAP_rcc01683) of the
  GTA of Rhodobacter capsulatus (Rhodopseudomonas capsulata) [see Fig.1, in 4].
