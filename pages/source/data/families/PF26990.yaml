description: This entry represents a domain of unknown function at the N-terminal in putative histidine
  kinases mostly found in bacteria. This domain belongs to proteins with a conserved four or five- helix
  up-and-down bundle structure. This structure is typical of focal adhesion targeting (FAT) domains and
  is responsible for dimerisation. It could also be present in transcriptional regulators where the bundle
  structure is important for their dynamic conformational equilibrium to control target specificity. The
  conserved helical bundle architecture enables these proteins to function in protein- protein interactions
  and regulatory processes [[cite:PUB00075415],[cite:PUB00004911],[cite:PUB00161916]].
