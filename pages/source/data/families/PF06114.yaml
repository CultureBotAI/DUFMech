description: This entry includes the catalytic domain of the protein ImmA, which is a metallopeptidase
  containing an HEXXH zinc-binding motif from peptidase family M78. ImmA is encoded on a conjugative transposon.
  Conjugating bacteria are able to transfer conjugative transposons that can, for example, confer resistance
  to antibiotics. The transposon is integrated into the chromosome, but during conjugation excises itself
  and then moves to the recipient bacterium and re-integrate into its chromosome. Typically a conjugative
  tranposon encodes only the proteins required for this activity and the proteins that regulate it. During
  exponential growth, the ICEBs1 transposon of Bacillus subtilis is inactivated by the immunity repressor
  protein ImmR, which is encoded by the transposon and represses the genes for excision and transfer.
  Cleavage of ImmR relaxes repression and allows transfer of the transposon. ImmA has been shown to be
  essential for the cleavage of ImmR [[cite:PUB00066798]]. This domain is also found in in metalloprotease
  IrrE, a central regulator of DNA damage repair in Deinococcaceae [[cite:PUB00051490]], HTH-type transcriptional
  regulators RamB [[cite:PUB00074928]] and PrpC [[cite:PUB00074929]].
