    supports: PARTIAL
    evidence_source: primary_taue_transcription
    explanation: H16_B1872 transcription and pathway context motivate sulfite export; they are not TauE
      flux measurements.
  - reference: PMID:18506422
    supports: PARTIAL
    evidence_source: primary_safe_candidate_transcription
    explanation: SafE1/2 are transcriptionally supported candidates, distinct from measured SafD chemistry.
  - reference: PMID:32917752
    supports: PARTIAL
    evidence_source: primary_tauE_deletion_negative
    explanation: JMP134 delta-tauE has no detectable sulfide-oxidation/sulfate-output defect in the tested
      resting-cell context.
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: 'Do not transfer TsaT reconstituted channel activity to TsaS, or Oenococcus plasmid prevalence
    to TauE-specific fitness or transport. The JMP134 negative does not prove absent function across species.
    Follow-ups include MSR-1 MamO truncations, RS-1 genetics, later MamO/MamE studies, H16 alternative
    sulfonates, IsfE, BigR-linked systems, keratin pathways and eukaryotic/archaeal members. Source and
    access ledger: evidence/PF01925/coverage.txt. This is same-agent partial scientific curation, not
    exhaustive family coverage, independent endorsement or publication.'
