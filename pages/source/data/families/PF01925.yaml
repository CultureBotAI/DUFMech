- graph_id: pmpc-laca-pigment-2011
  title: PmpC expression alters pigment in LacA
  scope: Gristwood2011 Figure6C LacA parent (paper WT); whole-gene expression constructs.
  context: LB,30C,12h,0.1mM IPTG; pQE-80LoriT-derived pTA157(C),pTA132(ABC),pTA159(AC),pTA156(BC). Pigment
    readout A534/OD600; three independent experiments,mean+/-SD.
  family_mapping: Serratia sp.ATCC39006 PmpC E7BBJ3 sequence v1,271aa,PF01925 5-260; original FR750283/CBY83979.1,
    archived UniSave v1 and current sequence are identical. Primary MMO69 encodes the matching MFISL start.
    Current Ser39006_020725 is a reference mapping, not independent plasmid sequencing. LacA is an EMS-derived
    Lac-minus parent.
  taxon: NCBITaxon:104623
  scope_status: PHENOTYPIC
  limitations: Unknown transported substrate and molecular mechanism. Coexpression may alter abundance
    or physiology; it is not demonstrated direct inhibition. PmpA/B/AB alone do not significantly change
    pigment in the reported comparison. Tagged PmpC detection failed, so PmpB fractionation is not evidence
    of PmpC localization. Printed antibiotic units remain unresolved.
