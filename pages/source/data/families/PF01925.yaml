  graph_id: cgcysz-uptake-hypothesis-2005
  title: Proposed CysZ-dependent sulfate uptake
  scope: Ruckert2005 interpretation of native C.glutamicum growth genetics and predicted membrane topology.
  context: Low external sulfate in native cells; deletion, in-trans rescue and high-sulfate bypass motivate
    the proposal. Coupling ions and energetics are unmeasured.
  limitations: The paper explicitly lacks biochemical transport proof. High-affinity is an interpretation
    of growth, not a measured Km or binding affinity. Sulfite growth effects do not independently identify
    its route of transport.
