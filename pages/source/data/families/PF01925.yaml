description: This is a family of integral membrane proteins where the alignment appears to contain two
  duplicated modules of three transmembrane helices. The proteins are involved in the transport of anions
  across the cytoplasmic membrane [[cite:PUB00060436]] during taurine metabolism as an exporter of sulfoacetate
  [[cite:PUB00060437]]. This family used to be known as DUF81.
