discussions:
- discussion_id: pf01925-transport-evidence-boundaries
  prompt: Resolve biochemical transport mechanisms without transferring annotation or whole-protein phenotypes
    to the Pfam domain.
  kind: CURATION_TODO
  status: OPEN
  rationale: Gene-level growth, processing and pigment effects do not establish substrate identity, transport
    direction, coupling or isolated-domain sufficiency.
  evidence:
  - reference: PMID:16159395
    supports: PARTIAL
    evidence_source: primary_growth_and_complementation
    explanation: CysZ sulfate uptake is a hypothesis based on conditional growth and rescue; direct flux
      and affinity were not measured.
  - reference: PMID:26981620
    supports: PARTIAL
    evidence_source: primary_processing_and_limo_controls
    explanation: MamO affects processing in cells; tested protease-region mutations lie outside PF01925
      and depend on the LimO background.
  - reference: PMID:21183667
    supports: PARTIAL
    evidence_source: primary_pmp_expression_phenotypes
    explanation: PmpC affects normalized pigment; exported substrate z and the coexpression mechanism
      remain unknown.
  posed_by: Codex
  posed_date: '2026-10-12'
  notes: Current reference intervals are MamO357-633,CysZ7-246,PmpC5-260. Deposited CysZ/PmpC sequences
    match current accessions; exact historical plasmids/deletions remain qualified. Retain CysZ pEC-XK99E/pZ8-1
    discrepancy, inaccessible primer supplement, unmatched WT/mutant sulfate doses and nested replication.
    Retain PmpC abundance/localization gaps and printed antibiotic units. MamO metal binding belongs to
    the separate N-terminal construct, not PF01925. The 2011 protease interpretation is not adopted over
    the 2016 pseudoprotease evidence.
- discussion_id: pf01925-negative-results-and-coverage
  prompt: Extend remaining experimental contexts and keep proposed transport assignments separate from
    demonstrated flux.
  kind: CURATION_TODO
  status: OPEN
  rationale: The three curated member systems do not characterize all74133 frozen proteins or all published
    contexts.
  evidence:
