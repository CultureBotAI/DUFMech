description: This family contains proteins found in SARS and SARS-like coronaviruses. It includes uncharacterised
  protein 14 from SARS coronavirus 2 (SARS-CoV-2), human SARS coronavirus (SARS-CoV) and bat coronavirus
  Rp3/2004 (SARS-like coronavirus Rp3) [[cite:PUB00094078]]. In SARS-CoV, orf14 is completely contained
  within the ORF encoding the nucleocapsid protein (N) [[cite:PUB00094078]]. In SARS-CoV-2 uncharacterised
  protein 14 is predicted to contain one transmembrane helix.
