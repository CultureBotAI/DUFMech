description: This domain is found in the N-terminal region of MVB12 proteins, which are subunits of the
  ESCRT-I complex involved in multivesicular body formation. The MABP domain adopts a type-I beta-prism
  fold with internal three-fold symmetry, consisting of three homologous segments each forming a three-stranded
  beta-sheet. It is found in diverse proteins including vertebrate DENND4A/B/C, Drosophila Crag, and bacterial
  MACPF-like proteins. The domain is believed to function as a membrane-associated adaptor that links
  other domains to vesicular membranes during intracellular trafficking. Most eukaryotic versions contain
  conserved cysteine residues in the first and third subdomains [[cite:PUB00045017],[cite:PUB00054220]].
