description: Steroid receptor-associated and regulated protein is also known as ER-related factor, ERRF,
  or C1orf64. It is thought to regulate the transcriptional function of androgen and oestrogen receptors
  [[cite:PUB00087321]]. Proteins in this family are typically between 145 and 169 amino acids in length,
  and have a conserved IDC sequence motif.
