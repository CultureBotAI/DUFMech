description: This family consists of uncharacterised proteins around 220 residues in length and is mainly
  found in various human gut Firmicutes and a few eubacteria species. It is also amply represented in
  human gut metagenomic datasets. Distant homology analysis and marginal HMM overlaps suggest this family
  is a distant homologue of Ureidoglycolate hydrolase [pfam:PF04115], but this prediction is not verified
  by experiment, therefore the function of this family is still unknown.
