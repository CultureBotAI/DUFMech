description: This entry represents the Protein SPO16 homolog (SPO16, also known as Synaptonemal complex
  reinforcing element SCRE), including the mammalian orthologue of budding yeast Spo16. It plays a key
  role in reinforcing the integrity of the central element of the synaptonemal complex (SC), resulting
  in the SC stabilization which ensures the progression of meiotic prophase I in male and female germ
  cells [1. It promotes homologous recombination and crossing-over in meiotic prophase I via its association
  with SHOC1 [[cite:PUB00096701]]. It is also required for the localization of TEX11 and MSH4 to recombination
  intermediates [[cite:PUB00096701]].
