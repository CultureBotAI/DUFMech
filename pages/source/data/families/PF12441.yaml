description: CopG antitoxin is a member of a type II toxin-antitoxin system family found in bacteria and
  archaea. Most antitoxins encoded by the relBE and parDE loci belong to the MetJ/Arc/CopG family of dimeric
  proteins which bind DNA through N-terminal ribbon-helix-helix (RHH) motifs [[cite:PUB00075548]]. The
  toxin for CopG proteins falls into the family BrnT_toxin, [pfam:PF04365].
