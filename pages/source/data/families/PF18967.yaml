description: Pycsar (pyrimidine cyclase system for antiphage resistance) provides immunity against bacteriophage
  and consists of a pyrimidine cyclase (PycC), which synthesizes cyclic nucleotides in response to infection,
  and an effector protein. Cyclic nucleotides serve as specific second messenger signals, which activate
  the adjacent effector, leading to bacterial cell death and abortive phage infection [[cite:PUB00100705]].
  This entry represents a domain found in the effector protein from Pycsar system. Structure prediction
  suggests it may form a homohexameric complex. This domain is found either standalone or in combination
  with HD domain [pfam:PF01966].
