description: This Rossmann-related domain is found at the N-terminal end of the C-terminal domain region
  of the cellulose-binding protein Sde182 from Saccharophagus degradans ([swissprot:Q21PD3]), which seems
  to have capacity to bind plant carbohydrates. This domain shows an alpha/beta configuration with a central
  beta-sheet of eight beta-strands and 12 alpha-helices. It is structurally similar to pyrimidine-specific
  ribonucleoside hydrolases (NH) [[cite:PUB00100688]]. This domain is also found in other uncharacterised
  bacterial and fungal proteins.
