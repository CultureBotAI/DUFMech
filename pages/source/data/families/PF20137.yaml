description: This family of proteins is functionally uncharacterised. This family This entry represents
  a novel family of serine proteases (BubE) that function in bacterial ubiquitination-like (Bub) pathways.
  BubE proteins contain a conserved serine-histidine catalytic dyad that can cleave both peptide and isopeptide
  bonds. The proteins also contain a conserved C4 zinc finger motif formed by four cysteine residues.
  BubE appears to negatively regulate Bub activity by cleaving ubiquitin-like protein-target conjugates.
  The proteins often contain hydrophobic N- or C-terminal extensions that may mediate association with
  membranes. BubE proteins are found in both Type I and Type II Bub operons, which encode components of
  bacterial protein conjugation systems that function through unusual oxyester intermediates.
