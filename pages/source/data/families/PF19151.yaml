description: This family represents sublancin, a small bacteriocin active against Gram-positive bacteria.
  This family appears to be restricted to Bacilli. Sublancin was thought to be a lantibiotic but was later
  shown to be an S-linked glycopeptide [[cite:PUB00060499],[cite:PUB00094614]]. Glycosylation is essential
  for its antimicrobial activity. Sublancin is biosynthesised as a precursor peptide bearing an N-terminal
  leader peptide, and a C-terminal core peptide that is converted into the mature peptide [[cite:PUB00060499]].
  Sublancin comprises two alpha helices and a well-defined inter-helical loop [[cite:PUB00094615]]. Sublancin
  inhibits B.cereus spore outgrowth, after the germination stage, approximately 1000-fold better than
  it inhibits exponential growth of the same cells and inhibits B.subtilis strain ATCC6633 and B. megaterium
  strain 14581 [[cite:PUB00094614]].
