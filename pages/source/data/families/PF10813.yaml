description: This entry contains viral proteins that are involved in virion envelopment and egress. It
  includes Epstein-Barr virus (EBV) BBLF1 protein (also known as cytoplasmic envelopment protein 3), which
  is present in the tegument layer of EBV and is involved in virion maturation. BBLF1 also participates
  in viral entry at the fusion step probably by regulating the core fusion machinery. BBLF1 has been shown
  to localise to the trans-Golgi network along with gp350/220, a site where final envelopment of EBV particles
  takes place. BBLF1 shares 13 to 15% amino acid sequence identity with the herpes simplex virus 1 UL11
  and cytomegalovirus UL99 tegument proteins, and like these it is a myristoylated and palmitoylated protein
  [[cite:PUB00082568]].
