description: This domain is found in mitochondrial proteins, including FAM210A and B, which contains a
  transmembrane peptide [[cite:PUB00097753],[cite:PUB00097752],[cite:PUB00097751]]. Its function is not
  clear. FAM210A, a protein essential in maintaining skeletal muscle structure and strength [[cite:PUB00097754]],
  interacts with mitochondrial translation elongation factor EF-Tu and promotes mitochondrial protein
  expression. In FAM210A, this domain is responsible for binding EF-Tu [[cite:PUB00097751]]. FAM210B plays
  a role in erythroid differentiation and is involved in cell proliferation and tumour cell growth suppression
  [[cite:PUB00097753],[cite:PUB00097755]].
