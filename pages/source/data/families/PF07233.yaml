description: This family consists of uncharacterised bacterial proteins mainly found in Proteobacteria,
  including YcfL from Escherichia coli and Putative lipoprotein from Campylobacter jejuni. This protein
  adopts a single domain configuration with two beta-sheets formed respectively by three and four beta-strands
  (beta-sandwich) and contains a Greek key motif, representing a singular variant of the Ig-like fold.
  Many proteins of this group have a lipid attachment site at the N-terminal of this domain, which together
  with the structure solved, suggests a role in bacterial lipoproteins [[cite:PUB00100676]].
