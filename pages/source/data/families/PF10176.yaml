description: Proteins in this entry includes NEDD4 family-interacting protein 1/2 (Ndfip1 and Ndfip2)
  and the yeast Bsd2 metal homeostasis proteins. Ndfip1 and Ndfip2 are endosomal membrane proteins that
  bind to and activate members of the Nedd4 family of E3 ubiquitin ligases [[cite:PUB00075325],[cite:PUB00075323]].
  Ndfip1 plays a role in regulating metal transport in human neurons [[cite:PUB00075324]].
