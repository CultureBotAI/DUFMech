description: This domain is found in wax ester synthases/diacylglycerol O-acyltransferases (WS/DAGs),
  largely found in bacteria, plants and animals. They catalyse the condensation of a fatty alcohol and
  a fatty acyl-Coenzyme A (acyl-CoA) and they can also catalyse the transesterification of acyl-CoAs with
  diacylglycerols. These are bifunctional enzymes (WS/DAGs) that share low overall sequence similarity
  but all WS/DGATs share a conserved HHXXXDG motif, which is also found in other acyltransferases [[cite:PUB00099698],[cite:PUB00100087]].
  This entry represents the N-terminal catalytic domain of WS/DAGs which contains the conserved HHXXXDG
  motif. It consists of a mixed beta-sheet flanked by four alpha-helices and a small antiparallel beta-sheet
  [[cite:PUB00100087]].
