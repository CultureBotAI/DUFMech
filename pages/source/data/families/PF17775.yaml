description: This entry represents the NTF2-like domain found in the functionally uncharacterised YchJ
  family protein from Psychrobacter arcticus and related proteins. This domain is usually found flanked
  by either ([pfam:PF21612]) and ([pfam:PF02810]) at the N and C terminus or flanked on both sides by
  ([pfam:PF02810]]). The structure of YchJ shows that this domain adopts structure typical for Nuclear
  transport factor 2 (NTF2) that consists of a curved three-stranded beta-sheet and array of alpha-helices
  packed on one side of it. The function of this domain is unknown.
