description: RNA polymerase in bacteria is a multisubunit protein complex that is essential for gene expression.
  This entry represents the epsilon subunit encoded by the rpoY gene. The structure of epsilon shows simple
  beta sheet with an alpha helix running diagonally along the back of the structure forming a beta-beta-alpha-beta
  fold [[cite:PUB00095126]].
