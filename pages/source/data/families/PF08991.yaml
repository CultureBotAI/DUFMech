description: Members of this family adopt a coiled coil structure, with two antiparallel alpha-helices
  that are tightly strapped together by two disulfide bridges at each end. The protein sequence shows
  a cysteine motif, required for the stabilisation of the coiled-coil-like structure. Additional inter-helix
  hydrophobic contacts impart stability to this scaffold [[cite:PUB00024565]]. The precise function of
  this eukaryotic domain is, as yet, unknown [[cite:PUB00013217]]. Cx9C motif-containing protein 4 (CMC4,
  also known as Mature T-cell proliferation 1 neighbor protein) is found in mitochondria. CMC4 is the
  first gene unequivocally identified in the group of uncommon leukemias with a mature phenotype [[cite:PUB00075489]].
