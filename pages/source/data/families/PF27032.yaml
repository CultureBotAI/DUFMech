description: This entry represents a domain of unknown function at the N-terminal in uncharacterised fungal
  proteins. This domain contains a RNases-like fold. The core architecture typically features a central
  five-stranded beta-sheet flanked by several alpha-helices. Most RNases H also possess an active site
  with a conserved DEDD motif (aspartate and glutamate residues), essential for coordinating catalytically
  required metal ions, usually Mg [[cite:PUB00016297]].
