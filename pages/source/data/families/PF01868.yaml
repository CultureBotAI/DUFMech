description: This family consists of several archaeal and eukaryotic proteins. The archaeal proteins are
  found to be expressed within ribosomal operons and several of the sequences are described as ribonuclease
  P protein subunit p29 proteins [[cite:PUB00042726],[cite:PUB00028005]]. The structure of the RNase P
  subunit, Rpp29, from Methanobacterium thermoautotrophicum has been determined. Mth Rpp29 is a member
  of the oligonucleotide/oligosaccharide binding fold family. It contains a structured beta-barrel core
  and unstructured N- and C-terminal extensions bearing several highly conserved amino acid residues that
  could be involved in RNA contacts in the protein-RNA complex [[cite:PUB00028005]]. Rpp29 catalyses the
  endonucleolytic cleavage of RNA, removing 5'-extranucleotides from tRNA precursor. It interacts with
  the Rpp25 and Pop5 subunits.
