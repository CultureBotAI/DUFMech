description: SAM35 is a family of fungal proteins found in the peripheral mitochondrial outer membrane.
  It is essential for cell viability. It forms a subunit of the SAM (sorting and assembly machinery) complex
  and is crucial for the assembly of the precursors of Tom40 and porin, the outer membrane beta-barrel
  proteins involved in mitochondrial biogenesis [[cite:PUB00074955],[cite:PUB00016442]]. SAM35 is required
  in order for the Sam50 subunit of the SAM complex to bind outer membrane substrate proteins [[cite:PUB00110449]].
