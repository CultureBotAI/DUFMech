description: This is a family of short ~14 kDa proteins from Psuedomonas. The structure of UniProtKB:Q9HY15
  a secreted protein has been solved and deposited as PDB:3npd. It comprises one structural domain with
  five beta-strands and five alpha-helices. Various comparative structural prediction methods plus its
  genomic location point to the protein forming a functional dimer with its adjacent genomic partner,
  UniProtKB:Q9HY14, in [pfam:PF12843]. Together these might be regulated by the other product from the
  PotABCD operon, namely the putrescine-binding periplasmic protein UniProtKB:Q9HY16. which has been implicated
  in quorum-sensing. QSregVF is certainly up-regulated in quorum-sensing, and is predicted to be a virulence
  factor [[cite:PUB00075641]].
