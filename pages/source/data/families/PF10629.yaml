description: This family represents a domain found in human Ciliary microtubule inner protein 2B (CMI2B)
  and similar proteins from eukaryotes. CMI2B is a microtubule inner proteins (MIP) that form part of
  the dynein-decorated doublet microtubules (DMTs) in cilia axoneme, which is required for motile cilia
  beating [[cite:PUB00103594]]. This domain is a tubulin-binding domain. Some proteins contain multiple
  copies of this domain.
