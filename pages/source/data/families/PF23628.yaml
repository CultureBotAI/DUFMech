description: This entry represents a domain found in E3 ubiquitin-protein ligase LIN, a putative E3 ubiquitin
  ligase involved in the rhizobial infection process [[cite:PUB00156036]]. It plays an important role
  in the early steps of bacterial symbiont thread formation in roots, and in growth, differentiation and
  maintenance of nodules [[cite:PUB00156036],[cite:PUB00156035]]. This domain may adopt an ARM-repeat
  fold.
