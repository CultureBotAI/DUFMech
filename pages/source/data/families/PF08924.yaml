description: This domain is found in uncharacterised bacterial proteins, including the putative peptidoglycan
  hydrolase Rv2525c from Mycobacterium tuberculosis [[cite:PUB00100887],[cite:PUB00100886]]. It has been
  proposed to function as a peptidoglycan hydrolase with glycosidase activity regarding structural studies
  showed that this domain has a typical TIM-barrel-like fold, characteristic of glycoside hydrolases [[cite:PUB00100887]].
  However, it displays esterase activity toward p-nitrophenyl esters of various acyl chain length in vitro
  [[cite:PUB00100886]].
