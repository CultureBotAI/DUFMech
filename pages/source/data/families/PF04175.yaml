description: Members of this family appear to be found only in gamma proteobacteria. The function of this
  protein family is undetermined. Solution of the structures of the two members of this family investigated
  bear some resemblance to that of the single domain enzyme pterin-4a-carbinolamine dehydratase, PDC.
  Although the residues of PCDs involved in binding of metabolite are not conserved in the two structures
  under study, they do correspond to a surface-region structurally aligned with residues that are highly
  conserved, eg Glu 89, suggesting that this region is also involved in binding of a ligand, thereby possibly
  constituting a catalytic site of a yet uncharacterised enzyme specific for gamma proteobacteria.
