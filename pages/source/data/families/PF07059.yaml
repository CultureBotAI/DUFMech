description: This family represents the C-terminus (approximately 250 residues) of protein ENHANCED DISEASE
  RESISTANCE 2 (EDR2) from plants. EDR2 is a negative regulator of the salicylic acid (SA)-mediated resistance
  to pathogens, including the biotrophic powdery mildew pathogens Golovinomyces cichoracearum and Blumeria
  graminis, and the downy mildew pathogen Hyaloperonospora parasitica, probably by limiting the initiation
  of cell death and the establishment of the hypersensitive response (HR) [[cite:PUB00078901],[cite:PUB00095635]].
