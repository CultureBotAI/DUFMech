description: This domain normally occurs as tandem repeats; however it is found as a single copy in the
  S. cerevisiae DNA-binding nuclear protein YCR593 ([swissprot:P25357]). This protein is involved in sporulation
  part of the SET3C complex, which is required to repress early/middle sporulation genes during meiosis
  ([[cite:PUB00019472]]). The bacterial proteins are likely to be involved in a cell wall function as
  they are found in conjunction with the [pfam:PF07501] domain, which is involved in various cell surface
  processes. This domain is also present in the resuscitation-promoting factors RpfB from Mycobacterium
  tuberculosis and Rpf2 from Corynebacterium glutamicum. These are factors that stimulate resuscitation
  of dormant cells [[cite:PUB00075582]]. This domain has a beta grasp fold. Structural description of
  this domain revealed a structural conservation between these domains and ubiquitin, hence it is termed
  UBL-G5 [[cite:PUB00137668]].
