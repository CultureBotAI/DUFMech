description: Kei1 is a subunit of Saccharomyces cerevisiae inositol phosphorylceramide (IPC) synthase
  [[cite:PUB00092487]]. It is localised to the Golgi and is cleaved by the late Golgi processing endopeptidase
  Kex2 [[cite:PUB00092487]]. Kei1 is essential for both the activity and the Golgi localization of IPC
  synthase [[cite:PUB00092487]].
