description: This family represents the homologues of Cilia and flagella associated protein 90 (CFAP90,
  also known as C5orf49). CFAP90 is a microtubule inner protein (MIP) part of the doublet microtubules
  (DMTs) in cilia and sperm axoneme [[cite:PUB00103594],[cite:PUB00151496]]. It belongs to the core-MIPs
  and binds to protofilament B09 in the sperm DMTs. Members of this family contain a conserved KLHRDDR
  sequence motif.
