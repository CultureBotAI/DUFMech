description: ParD-like antitoxin is a family of archaeal and bacterial proteins of a type II bacterial
  toxin-antitoxin system. Many of the cognate toxins for these molecules fall into family ParE-like_toxin,
  [pfam:PF15781]. Gene-pairs are expressed from the same operon, the toxin of the pair being expressed
  first, eg, for UniProtKB:Q3AQ93 and UniProtKB:Q3AQ94.
