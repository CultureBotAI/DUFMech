description: This entry represents a HDS (homology downstream of Sec7) domain found towards the C-terminal
  of guanine nucleotide exchange factors involved Golgi transport, such as budding yeast protein Sec7,
  protein Mon2 and BIG1-like proteins [[cite:PUB00101185],[cite:PUB00101184]]. Sec7 is involved in the
  secretory pathway as a protein binding scaffold for the COPII-COPI protein switch for maturation of
  the VTC intermediate compartments for Golgi compartment biogenesis [[cite:PUB00076747]]. Sec7 has four
  HDS1-4 domains, which act to integrate the signals from several small GTPases, including Arf1 itself,
  to switch Sec7 from a strongly autoinhibited to a strongly auto activated form [[cite:PUB00101184]].
