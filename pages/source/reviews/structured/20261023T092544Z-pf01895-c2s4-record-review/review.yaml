  area: completeness
  topic: Remaining family coverage
  outcome: concern
  summary: Three reference proteins in two species do not cover24850 frozen family
    proteins. The2014 supplement was unavailable through Europe PMC; Mg/SEC curves
    remain uninspected. Exact2015 fusion orientation/dose and Figure2 LB-versus-MOPS
    discrepancy remain unresolved. Actual insert sequences, raw measurements, physiological
    metal/Pi occupancy, catalytic partitioning and other persistence/virulence/structural
    homolog contexts need additional work. E. coli and mycobacterial Pst requirements
    are not tested under matched conditions. No exhaustive or independent expert review.
