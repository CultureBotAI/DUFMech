    including a distinct prephosphorylated-substrate preparation. Neither Pi nor PhoU1
    alone gives the corresponding7A reduction, and Figure8 does not show reduced SenX3
    autophosphorylation. Net balances do not resolve phosphotransfer versus phosphatase
    rates or establish isolated PhoU catalysis/Pi binding.
