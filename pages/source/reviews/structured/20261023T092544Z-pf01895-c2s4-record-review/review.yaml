assessments:
- assessment_id: member-identity
  area: identity
  topic: Protein, domain and experimental scope
  outcome: supported
  summary: Frozen PF01895 is former DUF65/PhoU and distinct from PF01865/PitR. E.
    coli P0A9K7 sequenceversion1 equals NP_418180.1,AAC76747.1,BAE77564.1 over241
    aa, with PF01895 at26-112 and129-212. M. smegmatis PhoU1 A0R4B7/MSMEG_5776 equals
    ABK71681.1/WP_003897196.1 over222 aa, domains18-103/122-204; PhoU2 A0QSU6/MSMEG_1605
    equals ABK73564.1/WP_011727768.1 over219 aa, domains17-103/123-204. These are
    exact references, not independently resequenced experimental inserts. Quad spans
    both repeats; A147/R148/F194 are in the second. Partner SenX3SD1 residues51-384
    are not a PhoU deletion. No isolated-repeat sufficiency or uniform family mechanism
    is established.
  target_ids:
  - PF01895
  evidence_ids:
  - identity
  - primary
  - ec-uptake
  - ec-metal-and-integrants
  - ec-genetic-separation
- assessment_id: causal-scope
  area: graph
  topic: Directed effects and limits
  outcome: supported
  summary: All24 edges have matching evidence hashes/snippets, exact contexts and
    directed measured endpoints. Three MECHANISTIC graphs encode engineered-probe
    or purified net-phosphorylation responses; nine PHENOTYPIC graphs encode indirect
    cellular outcomes. QuadW comparisons include lower protein load; its fitted apparent
    affinity is not a native physiological occupancy. Plasmid Quad retains repression
    while chromosomal integrants lose it. Qualitative membrane lanes are not mass-balance
    fractions. Joint PstSCAB/PhoU expression is one conjunction. Overnight OD is yield,
    BACTH is a reporter rather than Kd, and Figure5B omits R148E. PhoU1/PhoU2 and
    species contexts are not merged. Pi-binding and atomic-interface models remain
    gaps, not observed edges.
  target_ids:
  - PF01895
  evidence_ids:
  - primary
  - native
  - ec-uptake
  - ec-metal-and-integrants
  - ec-genetic-separation
