assessments:
- assessment_id: member-identity
  area: identity
  topic: Protein, domain and experimental scope
  outcome: supported
  summary: Frozen PF01909 is DUF76/NTP_transf_2/IPR002934, 24660 proteins. K-12 GlnD
    P27249 sequence version 2, b0167/JW0162, is 890 aa with PF01909 at 85-144. G93/G94/D107/H514/D515
    agree with reference numbering. The assayed 1-371 region exceeds the current 85-144
    match and historical 74-169 NT drawing. HD mutations map PF01966 at 468-601, not
    PF01909. Current P05057 returns PF07827 but no PF01909 mapping; ANT(4') chemistry
    is excluded pending boundary resolution. Neither reference mapping nor external
    annotation independently sequences the historical assay clones. Imported metadata
    is unchanged.
  target_ids:
  - PF01909
  evidence_ids:
  - identity
  - primary
  - discovery-and-excluded-mappings
- assessment_id: causal-scope
  area: graph
  topic: Directed effects and limits
  outcome: supported
  summary: Each edge compares a scoped enzyme/substitution/condition with its actual
    comparator. Larger-fragment activity is not isolated-domain sufficiency. Figure
    5 G94L is not pooled with inactive G94D. HD-AA/QN retain transfer activity while
    losing removal, but that does not establish equal folding or an atomic catalytic
    role. UR protocols differ in multiple components; no isolated metal-switch claim
    is drawn. Mg/Mn Figure 8B net modification can fall through competing removal
    and is not encoded as direct NT inhibition. No family-wide antibiotic chemistry,
    ACT ligand-binding relay, transition-state mechanism or physiological futile cycle
    is inferred as observed.
  target_ids:
  - PF01909
  evidence_ids:
  - primary
  - native
  - discovery-and-excluded-mappings
- assessment_id: remaining-coverage
  area: completeness
  topic: Remaining family coverage
  outcome: concern
  summary: One experimental GlnD branch is covered, not all 24660 frozen members.
    Other substitutions and R. rubrum phenotypes require their own mapped comparisons.
    Raw gels, independent clone sequencing, folding controls, replicate-level uncertainties
    and direct ligand/metal measurements remain open. CCA, OAS, DNA synthesis, CdnE,
    MntA, AadA/ANT9 and Hailong branches were discovered but not given experimental
    edges. Related-fold ANT(4') evidence requires a verified PF01909 assignment before
    reuse.
  target_ids:
  - PF01909
  evidence_ids:
  - primary
