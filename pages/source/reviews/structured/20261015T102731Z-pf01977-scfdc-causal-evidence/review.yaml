    and all affected targets; append actual history and regenerate natively.
limitations:
- Partial same-agent scientific review, not independent approval, experimental replication,
  complete PF01977 review or corpus completion.
- No physical plasmid sequencing, raw replicate extraction, complete construct verification
  or unique cofactor-species determination. Original Figures 2/3/4/6 were visually
  inspected; Figure 8 mass detail is read from text/caption, not a claimed new image
  inspection.
- Public OAI manuscript and linked PMC figures were used after earlier HTML/API access
  failures. Access failures are not evidence that an article or mechanism is absent.
- A frame-zero tPAD1 reverse-primer translation was rejected before adoption; the
  correctly stop-aligned frame is retained. Initial native preview overlapped briefly
  with history-command completion; both finished before guarded apply, and projected
  history is independently checked.
- Native preview is unpinned and covers one family at two widths. Canonical source
  pins/Pages and full publication QC remain separate, unperformed release work.
