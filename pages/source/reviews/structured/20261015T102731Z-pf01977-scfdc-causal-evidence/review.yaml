    Lin2015 primary manuscript, Methods, original Figures 2/3/4/6, Table 1 and exact
    reference/domain/primer checks. Earlier 23 graphs receive preservation and quotation
    checks, not a repeated full scientific review.
  selection: Continue the unfinished ScFdc branch of PF01977 member and partner coverage
    from merged PR221; the original corpus scope remains all 8296 families.
  coverage: partial
  population_size: 1
  reviewed_target_ids:
  - PF01977
  exclusions:
  - target: Later ScFdc mechanisms and complete PF01977 member coverage
    reason: Ferguson2016/2017 main-paper contexts, later maturation/specificity, native
      yeast physiology, EcUbiD, AroY, HmfF and HudA remain unfinished. Inspected 2017
      SI is a lead, not adopted atomic-mechanism evidence.
  - target: Full synthetic constructs, raw datasets and exact cofactor chemistry
    reason: Partial primers and a separate deposited body do not establish assay plasmid
      identity. Raw replicate values, exact truncation, matched host/tag controls,
      active occupancy and unique activating species remain unresolved.
  - target: Canonical Pages and release publication
    reason: Local unpinned preview is checked; canonical Pages/source pins are unchanged.
      Publication requires an authorized retained checkpoint and fresh full release
      QC.
