summary: 'Nine ScFdc graphs add 19 experimentally reported edges: one direct styrene
  endpoint and 18 effects with unresolved molecular routes. The 23 prior AnFdc/VdcCD
  graphs are preserved. PF01977 now has 32 graphs and 79 edges, with three OPEN discussions
  and IN_PROGRESS status. Tag/coexpression and host-background confounds, residual
  activity, tPAD1 primer/truncation mismatch, apparent kinetics and text-only effects
  remain explicit. This partial review advances, but does not complete, PF01977 or
  the 8296-family objective.'
