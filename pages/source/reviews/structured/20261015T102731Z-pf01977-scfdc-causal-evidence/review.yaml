  - Map each new tested construct and partner to the correct protein/domain without
    inferring complete inserts from terminal primers or assigning an unreported strain.
  - Retain measured outcomes, relevant controls, residual activities, competing explanations
    and molecular support labels separately for every directed relation.
  - Resolve tag/host/truncation and numerical discrepancies using primary construct/raw-assay
    evidence; do not apply assumed active-site normalization.
