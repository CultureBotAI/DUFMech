assessments:
- assessment_id: member-identity
  area: identity
  topic: Protein, domain and experimental scope
  outcome: supported
  summary: AF486578.1 translation AAM10931.1 exactly matches 155-aa Q8INK9-2, not
    the 208-aa canonical protein or the paper's 166-aa predicted alignment. Canonical
    PF01641 61-186 transfers to isoform19-133 through annotated deletions, not a new
    HMM analysis. Mouse Q9JLC3 maps at12-105 and contains Sec95; archived C95 with
    SE_CYS annotation is not a natural Cys allele. The assay used U95C with unresolved
    vector termini. Yeast YCL033C maps to S288c reference P25566, PF01641 47-166;
    the BY4741 isolate was not resequenced here.
  target_ids:
  - PF01641
  evidence_ids:
  - identity
  - primary
- assessment_id: causal-scope
  area: graph
  topic: Directed effects and limits
  outcome: supported
  summary: All six edges are OBSERVED, two DIRECT purified-product and four INDIRECT
    phenotype effects. Joint enzyme/substrate/reductant conditions are not split into
    independent causes. Zero, 2 and 0.5 mM peroxide contexts remain separate, with
    MsrA-only comparators for additional SelR loss. Residual double-mutant growth
    at0.5 mM, later single-mutant convergence at2 mM and absent genetic rescue prevent
    complete-inactivity, permanent lower-yield and unique repair-mechanism claims.
    The native mouse selenoprotein, physiological electron donor, intact oxidized
    protein substrate, zinc requirement and transient catalytic intermediates were
    not established by these assays.
  target_ids:
  - PF01641
  evidence_ids:
  - primary
  - native
- assessment_id: remaining-coverage
  area: completeness
  topic: Remaining family coverage
  outcome: concern
  summary: The later Kumar 2002 JBC abstract, Methods and initial Results were accessible,
    but remaining Results and figures were not inspected after failed full-text retrieval.
    C124 sulfenic-acid trapping, C69 disulfide formation, zinc-site substitutions
    and heterologous complementation remain unadopted leads. Exact PNAS biochemical
    doses/duration, mouse vector termini, yeast supplement composition and the original
    BY4741 MAT-alpha notation remain unresolved. Neither similarity nor domain mapping
    establishes universal family chemistry.
  target_ids:
  - PF01641
  evidence_ids:
  - primary
