  summary: Fly SelR and mouse Cys-for-Sec SelR produce dabsyl methionine with R-sulfoxide
    but not the S substrate. Fly traces include substrate-only controls; mouse panel
    A does not show a matched no-enzyme trace. Additional SelR loss in an MsrA-deleted
    background reduces OD600 accumulation at zero, 2 and 0.5 mM peroxide. SelR-only
    loss delays early/mid growth at 2 mM but approaches WT later; no clear single-loss
    effect is seen at the other two doses.
