    interpro_id: InterPro:IPR002579\ndescription: Methionine sulfoxide reduction is\
    \ an important process, by which cells regulate biological\n  processes and cope\
    \ with oxidative stress. MsrA, a protein involved in the reduction of methionine\
    \ sulfoxides\n  in proteins, has been known for four decades and has been extensively\
    \ characterised with respect to\n  structure and function. However, recent studies\
    \ revealed that MsrA is only specific for methionine-S-sulfoxides.\n  Because\
    \ oxidised methionines occur in a mixture of R and S isomers in vivo, it was unclear\
    \ how stereo-specific\n  MsrA could be responsible for the reduction of all protein\
    \ methionine sulfoxides. It appears that a\n  second methionine sulfoxide reductase,\
    \ SelR, evolved that is specific for methionine-R-sulfoxides, the\n  activity\
    \ that is different but complementary to that of MsrA. Thus, these proteins, working\
    \ together,\n  could reduce both stereoisomers of methionine sulfoxide. This domain\
    \ is found both in SelR proteins\n  and fused with the peptide methionine sulfoxide\
    \ reductase enzymatic domain [pfam:PF01625]. The domain\n  has two conserved cysteines\
    \ and histidines. The domain binds both selenium and zinc [[cite:PUB00020323]].\n\
    \  The final cysteine is found to be replaced by the rare amino acid selenocysteine\
    \ in some members of\n  the family [[cite:PUB00006463]]. This family has methionine-R-sulfoxide\
    \ reductase activity [[cite:PUB00020323]].\ncuration_history: history/records/PF01641\n\
