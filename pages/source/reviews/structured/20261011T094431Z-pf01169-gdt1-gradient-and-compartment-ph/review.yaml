  summary: Matched-baseline pH-pulse and separate counterion challenges reveal GDT1-associated
    pH effects in DML1. pH 8.0 versus 6.8 increases calcium- and manganese-uptake-associated
    Fura-2 responses, with empty-vector and nigericin controls. Native BY4742 deletion
    lowers early cytosolic recovery pH and raises late Golgi pH after glucose re-addition;
    steady-state and late cytosolic negatives constrain interpretation. The proposed
    native reverse-transport model is not adopted as directly observed.
