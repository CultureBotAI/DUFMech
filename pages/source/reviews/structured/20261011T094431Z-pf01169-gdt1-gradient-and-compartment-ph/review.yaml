assessments:
- assessment_id: member-identity
  area: identity
  topic: Protein, domain and experimental scope
  outcome: supported
  summary: P38301/GDT1_YEAST is a 280-aa S288c reference, sequence version 1, matching
    InterPro exactly with PF01169 intervals 42-127 and 193-277. DML1 is the heterologous
    host, not the source organism. BY4742 whole-gene deletion and bacterial expression
    are separate systems. Full 2023 clone/junction/tag sequences remain unverified,
    and the 2016 explicitly tagged delta23 construct is not silently inherited. Both
    repeats belong to the whole protein; neither is proven independently sufficient.
  target_ids:
  - PF01169
  evidence_ids:
  - identity
  - primary
  - supplemental-calibration-and-statistics
  - historical-construct-boundary
  - yeast-sensor-method-boundary
- assessment_id: causal-scope
  area: graph
  topic: Directed effects and limits
  outcome: supported
  summary: The two DIRECT edges concern a controlled gradient intervention on transport
    readouts, not purified Gdt1-exclusive flux. Four expression-to-pH edges remain
    UNRESOLVED because leakage, endogenous transport and topology alternatives persist.
    Manganese quenching is represented as increased uptake-response magnitude rather
    than increased raw fluorescence. Calcium and manganese challenges are separate
    and exclude the shared immediate salt jump. Yeast +120-s cytosolic and +720-s
    Golgi effects remain INDIRECT; the borderline +120-s Golgi comparison is not promoted
    to an edge. No single-molecule reversal, stoichiometry, universal pH rule or glycosylation
    chain is asserted.
  target_ids:
  - PF01169
  evidence_ids:
  - primary
  - native
  - supplemental-calibration-and-statistics
  - historical-construct-boundary
  - yeast-sensor-method-boundary
- assessment_id: remaining-coverage
  area: completeness
  topic: Remaining family coverage
  outcome: concern
  summary: Exact 2023 construct termini, calibration digitonin/nigericin discrepancy,
    Fura-2 and external-pH recording temperatures, orientation, protein-specific flux
    and coupling controls remain incomplete. Native glucose-pulse rescue and simultaneous
    ion-gradient measurements are not established. Earlier calcium/manganese, mutant,
    human, bacterial and plant contexts require separate exact mapping and primary
    review. This is not complete family characterization.
  target_ids:
  - PF01169
  evidence_ids:
  - primary
