    biochemical products to viability. D471A raises phosphate release and does not
    lower the short-duplex unwinding result, while lowering triplex displacement and
    destruction. R381A delays early long-DNA processing but approaches WT at40min.
    K363A unwinding loss is partial. E233S WT/D176E rescue edges distinguish deletion
    PCR from empty-vector marker escape; failed initial transformation of other variants
    is not misrepresented as a clean deletion-rescue comparison. D176E overhang exonuclease
    increase is not generalized to blunt DNA, and E356D retains endonuclease-class
    activity.
