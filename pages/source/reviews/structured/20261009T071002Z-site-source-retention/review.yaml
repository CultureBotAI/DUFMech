limitations:
- Same-agent adversarial review, not an independent approving identity.
- The selected diff is an infrastructure audit. The corpus remains 8,295 SEEDED/UNSCORED
  records; functional evidence and unresolved source licenses were not reassessed.
- Retention is observed at check time. Maintainers can still delete or move tags afterward;
  no repository tag-protection setting was changed.
- The new retained report, canonical history, checkpoint tag, pin ledger and generated
  site still require publication and fresh exact-head CI before merge. This report
  does not assert those later steps have already passed.
notes:
- Issue 186 was opened during this audit and fixed before completion; no unresolved
  finding remains in the selected code diff. There is no earlier structured observation
  to supersede.
- The new gate itself reproduced existing issue 179 after merged PR 184. The final
  publication will repair the current ledger by retaining a new checkpoint, not by
  rewriting immutable snapshots.
- Absence searches for a pre-existing publication checker used rg --no-ignore --hidden
  within source, tests, workflows, docs, conf and README, excluding only unrelated
  generated ID-label content and Python bytecode. Git ref checks used canonical fetches,
  not filesystem search assumptions.
