assessments:
- assessment_id: member-identity
  area: identity
  topic: Protein, domain and experimental scope
  outcome: supported
  summary: Frozen PF01894 historical UPF0047/YjbQ-like identity is verified without
    inventing a DUF number. K12 P0AF48 sequenceversion1 equals NP_418480.1,AAC77026.1,BAE78058.1
    and WP_000270375.1 over138 residues; PF01894 maps6-138. These are reference sequences,
    not independently verified MC1061/ASKA/pTrcHisB inserts. Supplementary TableV
    forward primers differ in the YjbQ start region. Whole-protein phenotypes do not
    establish isolated-domain sufficiency. JU283 is a selected BW25113/JWK2317 colony,
    with stock heterogeneity at30 C.
  target_ids:
  - PF01894
  evidence_ids:
  - identity
  - primary
