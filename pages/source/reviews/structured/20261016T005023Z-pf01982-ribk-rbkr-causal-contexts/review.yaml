limitations:
- The full8296-record goal remains active; 131 graph-bearing families are structural
  presence, not scientific completion.
- Eight DIRECT edges concern purified kinase/product formation or protein-DNA association;
  one INDIRECT edge concerns bacterial extract FMN; sixteen UNRESOLVED edges retain
  assay effects without inventing molecular intermediates.
- Reference PF01982 boundaries are Q60365 7-125, H2C8H2 93-214, Q9HJA6 99-218 and
  archived A0A0K1E2F9 88-208. Whole RbkR fusions do not establish kinase-domain DNA
  recognition.
- Current A0A0K1E2F9 is deleted for reference-proteome selection. Archived entry33/sequence1
  and AKT35049.1 retain the same210aa sequence and Pfam assignment; this is not a
  current HMM recomputation.
- 2008 residual ATP/GTP activity and copurified Mg remain explicit; no-added-metal
  is not metal-free catalysis, and missing2007 full text is not evidence of an experimental
  negative.
- 2017 binding-unit and probe-length discrepancies remain unresolved. No affinity
  correction, IC50 refit or exact temperature optimum was fabricated.
- Native activation/deactivation, transport roles, Glu195 base chemistry and FMN-induced
  conformational switching are not observed edges. They remain hypotheses or future
  work.
- Initial native generation rejected an unquoted comma in a flow mapping; the maintained
  overlay was corrected. No generated output or validator was manually altered to
  bypass the failure.
- EuropePMC2008 XML failed; PMC HTML succeeded. PMC supplement returned HTML, but
