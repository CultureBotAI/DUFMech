limitations:
- Same-agent adversarial scientific review is not independent approval or experimental
  replication.
- The original eight graphs were preservation-checked; previous bacterial/construct
  findings are carried forward, not newly resolved.
- Four minor completeness findings remain open. These are qualified research gaps,
  not hidden unsupported direct mechanisms.
- All live PMC requests in this turn returned browser challenges. Previously obtained
  ordinary HTML and figures were re-inspected; no access challenge was bypassed.
- CFM2 supplements and Till2001full Results remain uninspected; cached apparent PDFs
  are HTML challenges.
- Reference mappings and two CAF cDNA translations do not authenticate physical experimental
  alleles or measure residual proteins.
- No exact effect sizes are invented from qualitative bands; summary-only CAF targets
  are not independently quantified raw gels.
- Canonical publication and full QC occur after saving this review and appending actual
  REVIEW history; issue275 remains a release gate at this point.
- The8296-record scientific objective remains active and incomplete;134graph-bearing
  families do not mean134fullyreviewed families.
