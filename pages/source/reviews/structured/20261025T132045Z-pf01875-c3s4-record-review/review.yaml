  outcome: concern
  summary: Resolve exact purified constructs, clonal alleles, rescue and siRNA specificity;
    inspect additional ErbB2/RhoA/cytoskeleton, renal/FGF23, C.elegans and microbial
    member experiments. The frozen6407 proteins remain in scope. Selected human assays
