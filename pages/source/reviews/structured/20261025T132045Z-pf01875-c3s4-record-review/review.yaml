- assessment_id: member-identity
  area: identity
  topic: Protein, domain and experimental scope
  outcome: supported
  summary: Human Q9Y316 sequence version1 exactly equals NP_057039.1/NM_015955.5,
    297 aa, PF01875 8-291. H49/H81/H131/D189/H192/C244 are inside this match. Deposited7KQ8
    entity1 is canonical4-297, not full297 aa. Native numbering is preserved. The2014
    3C-cleaved,2022 His-affinity and2024 intein-cleaved preparations remain separate;
    exact assay-batch termini, siRNA details and clonal alleles are not independently
    verified.
