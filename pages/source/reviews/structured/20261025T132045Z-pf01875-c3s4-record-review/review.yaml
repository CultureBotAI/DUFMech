- assessment_id: causal-scope
  area: graph
  topic: Directed effects and limits
  outcome: supported
  summary: Six direct observed effects preserve BCA competition, ascorbate protection,
    Amplex response, historical H192A luminol reduction and two iron-binding substitutions.
    Ten indirect observed effects preserve wound closure, MTT, three probe signals,
    two iron fractions, basal MDA, RSL3 metabolic response and chelator-conditioned
    clustering. No universal ROS polarity, direct intracellular metal flux, isolated-domain
    sufficiency or atomistic catalytic chain is asserted. BCA concentration and Amplex
    wavelength discrepancies, residual H192A signal, basal knockdown effects, crude
    fractions and drug-dose scope remain visible.
  target_ids:
  - PF01875
  evidence_ids:
  - primary
  - native
  - copper-protection
  - cellular-copper
  - historical-redox
  - gaps-and-access
