summary: 'PF21647 (CORD_C; InterPro:IPR049172) matches the verified frozen source
  and retains seed_status=EX_DUF, characterization_status=UNSCORED and curation_status=SEEDED.
  The pinned InterPro/Pfam snapshot identifies PF21647 (CORD_C; InterPro:IPR049172)
  as EX_DUF, with local characterization UNSCORED and curation SEEDED. The complete
  imported description is: This domain is found at the C-terminal in Protein CORTICAL
  MICROTUBULE DISORDERING (CORD) proteins found in plants. This domain may consist
  of 5-6 alpha-helices. CORD proteins are microtubule-associated proteins that are
  required, redundantly with CORD2, for the formation of the pitted secondary cell
  wall of metaxylem vessels [[cite:PUB00163241]]. CORD1 from Arabidopsis thaliana
  controls the disorganisation of the parallel cortical microtubule network by modulating
  microtubule attachment to the plasma membrane in metaxylem vessel cells; this mechanism
  probably relies on disruption of interactions between ARAC10/ROP11 and cortical
  microtubules [[cite:PUB00163241]5]. Frozen metadata report 3244 proteins, 3782 matches,
  378 proteomes, 1045 taxa, 0 structure entries, 2632 AlphaFold models and 83 domain
  architectures. These are source counters; no protein, sequence, structure, model
  or underlying publication was inspected. This is a local metadata and representation
  review, not external biological verification. One minor citation-representation
  follow-up concerns the malformed terminal [[cite:PUB00163241]5] token. It does not
  establish erroneous biology, resolve the citation or promote the isolated domain
  to an experimentally characterized function.'
