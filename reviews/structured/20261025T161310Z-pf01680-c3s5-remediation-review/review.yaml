  area: completeness
  topic: Remaining family coverage
  outcome: concern
  summary: Exact historical tagged clone sequences and WT Pdx2 tag matching, missing
    assay-specific doses/temperatures, source pH and unit conflicts, and raw mass/spectral
    controls remain unresolved. The Hanes NMR main text and supplement were inspected,
    but its original construct provenance and later JACS specificity, 2011 second-site
    and 2015 Geobacillus studies are not fully integrated. Physiological phenotypes,
    other species and isolated-domain sufficiency remain outside this curation. No
    source description or EX_DUF label substitutes for family-wide evidence.
  target_ids:
  - PF01680
