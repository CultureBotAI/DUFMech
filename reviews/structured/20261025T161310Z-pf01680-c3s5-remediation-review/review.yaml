assessments:
- assessment_id: member-identity
  area: identity
  topic: Protein, domain and experimental scope
  outcome: supported
  summary: Current P37527 is a 294-aa strain-168 reference, sequence version 3, matching
    the InterPro sequence exactly with PF01680 7-212. SwissProt archive entry 56 is
    current sequence minus only the initial methionine; entry 57 is exact current
    sequence. The experimental modified peptide maps exactly to current residues 61-83/K81.
    D24/K81/K149 lie inside the domain, but whole proteins include 213-294 outside
    it. The 2005 genomic clone and N-terminal checks support untagged PdxS identity.
    The 2006 2NV1 deposit is MAS plus reference plus LEHHHHHH; that does not sequence
    every 2007 assay vial. The 2007 Pdx1-His6 and separate Pdx2-His6 H170N are distinguished
    from untagged 2005 preparations, and the WT partner tag state in the inset remains
    unresolved.
  target_ids:
  - PF01680
  evidence_ids:
  - identity
  - primary
  - untagged-product-and-partner
  - nmr-interpretation-boundary
- assessment_id: causal-scope
  area: graph
  topic: Directed effects and limits
  outcome: supported
  summary: Eleven OBSERVED DIRECT edges are valid for the scoped biochemical comparisons,
    not proof of a complete atomic mechanism. The 2005 coupled glutaminase and product
    assays are shared with PF01174 and not counted as independent experiments. External
    ammonium/R5P supports a signal without PdxT while Ru5P has a separate partner
    effect. R5P/K81 early-adduct observations survive later challenge to the imine
    interpretation. Optical conversion retains the 0.4 mM main versus 0.4 uM inset
    discrepancy, pH ambiguity and partial conversion. Phosphate and chromophore readouts
    are not joined by a causal arrow. The NMR follow-up rejects an unqualified nitrogen-free
    assignment and explicitly identifies acid/urea Z2 as an off-pathway product; neither
    that species nor the full proposed lysine-migration pathway is encoded as an observed
    native step.
  target_ids:
  - PF01680
  evidence_ids:
  - primary
  - native
  - untagged-product-and-partner
  - nmr-interpretation-boundary
