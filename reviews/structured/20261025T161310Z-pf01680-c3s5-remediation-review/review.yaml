  summary: R5P incubation produces a K81-linked early adduct; K81R lowers its formation
    while K149R retains it. Joint Pdx1/Pdx2/R5P/glutamine reconstitution produces
    a 315-nm signal that is lower with the H170N partner preparation. G3P addition
    lowers A315 and raises A414; a separate joint assay releases phosphate. Structural
    formulas and every intervening chemical step are not directly established by these
    measurements.
