summary: 'Eight graphs retain eleven observed direct effects from Raschle 2005 and
  2007, preserving whole-protein, partner and assay boundaries. The K81-linked early
  adduct is supported by isotope-resolved peptide data, not by adopting the older
  imine structure. Later Hanes 2008 NMR challenges the earlier chemical interpretation
  and distinguishes acid-induced Z2 from a native intermediate. All imported family
  identity remains unchanged and curation remains IN_PROGRESS. Cycle 3 Stage 3 (PR
  #357) grounded node k81-linked-early-adduct (''Early K81-linked R5P-derived covalent
  adduct'') to Bacillus subtilis Pdx1/PdxS (UniProtKB:P37527). Stage 4 frozen-inventory
  audit identified an open grounding finding (pf01680-joint-pdx1-pdx2-nodes-missing-partner-grounding)
  across four graphs (pdxs-partner-glutaminase-readout node add-pdxs-to-pdxt-glutamine,
  pdxs-ribulose-partner-effect node add-pdxt-ribulose-ammonium, pdxs-chromophore-and-partner-h170n
  node joint-chromophore-reconstitution, and pdxs-joint-phosphate-release node joint-r5p-phosphate-reaction)
  where only one subunit of the joint Pdx1/Pdx2 (PdxS/PdxT) pair had been grounded.
  Stage 5 grouped remediation resolved joint-pdx1-pdx2-nodes-missing-partner-grounding
  (Issue #362) via native overlay curation, canonical EDIT history, and projection
  regeneration.'
