summary: 'PF20016 (ThsA_Macro; InterPro:IPR045535) matches the verified frozen source
  and retains seed_status=EX_DUF, characterization_status=UNSCORED and curation_status=SEEDED.
  The complete imported description for PF20016 (ThsA_Macro; InterPro:IPR045535) states:
  Thoeris is a bacterial antiphage defense system, which consists of two genes, thsA
  and thsB, via NAD+ degradation [[cite:PUB00097806],[cite:PUB00101117],[cite:PUB00101118],[cite:PUB00160037]].
  ThsA has robust NAD+ cleavage activity and a two-domain architecture containing
  an N-terminal NAD-binding domain (denoted as sirtuin-like or Macro) and C-terminal
  SLOG-like domain. In some instances, such as in B. amyloliquefaciens ThsA has an
  N-terminal transmembrane domain [[cite:PUB00097806]]. ThsB (also referred to as
  TIR1 and TIR2) is structurally similar to TIR domain proteins but without enzymatic
  activity. This domain is found at the C-terminal of ThsA proteins which adopts a
  Rossmann-like fold that binds NAD+/NAD+derivatives. It has been characterised as
  the SLOG-like domain which binds NAD+ derivatives such as ADPR molecules produced
  by ThsB, which drives an oligomeric state change in ThsA and activates the NADase
  activity (represented in [pfam:PF18185]) [[cite:PUB00097806],[cite:PUB00101118]].
  This entry represents the NAD+-binding Macro domain from B. amyloliquefaciens [[cite:PUB00097806],[cite:PUB00101117]].
  The frozen inventory lists 534 proteins, 534 matches, 453 proteomes, 1034 taxa,
  5 structure entries, 310 AlphaFold models and 9 domain architectures. These are
  frozen inventory counts, not reviewed assays, examined structures, model-quality
  measurements or proof of external evidence absence. Imported claims and citation
  tokens were assessed for local representation and scope; scientific claims were
  not independently verified. One minor provisional provenance follow-up records unresolved
  ThsA domain referents and ThsB activity wording in the imported description; no
  corrected mechanism is asserted.'
