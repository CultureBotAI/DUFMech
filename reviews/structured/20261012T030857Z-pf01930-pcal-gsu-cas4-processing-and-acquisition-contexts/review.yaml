assessments:
- assessment_id: member-identity
  area: identity
  topic: Protein, domain and experimental scope
  outcome: supported
  summary: Frozen Cas_Cas4/DUF83/IPR022765 identity remains intact. Current Pcal A3MTK6v1
    match57-210 of213aa and Gsu fusion Q74H36v1 match15-197 of559aa support member
    attribution, not isolated-domain function. Gsu has a separate Cas1 domain. Historical
    DUF83 wording is not enough to import SSO0001 nowPF12705 or SSO1391 comparator
    assays. First100 UniProt matches include DNA2; the census and functional coverage
    remain partial.
  target_ids:
  - PF01930
  evidence_ids:
  - identity
  - primary
  - gsu-assays
  - source-coverage
- assessment_id: causal-scope
  area: graph
  topic: Directed effects and limits
  outcome: supported
  summary: Separate purified Pcal substrate/product assays do not establish native
    CRISPR function or a distinct helicase step. Mutation effects retain folding alternatives
    and high-load residual activity. Cys-variant DNA cleavage does not prove identical
    rates or universal Fe-S dispensability. Gsu PAM-favored assembly, asymmetric ExoI
    processing and integration use composite fusion/Cas2/substrate contexts; ExoI
    trimming and Cas1 integration are not attributed to the Pfam catalytic center.
    Half-integration mimics and length effects are observed substrate-context effects,
    not direct evidence of an allosteric switch or live Cas4 dissociation. E18Y alters
    selectivity but is not a null nuclease. E.coli cellular PCR/sequencing effects
    remain indirect and are not native Gsu antiviral fitness. ED4g caption/Results
    contradiction precludes an unqualified cellular PAM-switch edge.
  target_ids:
  - PF01930
  evidence_ids:
  - primary
  - native
  - gsu-assays
  - source-coverage
- assessment_id: remaining-coverage
  area: completeness
  topic: Remaining family coverage
  outcome: concern
  summary: Pcal metal assignment and inaccessible supplement, precise retained tags
    and pET28a/b naming, ED4g contradiction, native Gsu trimming nuclease and native
    Pcal role remain open. B.halodurans Cas4 and Thermoproteus paralog mapping, prior
    Gsu cellular study, Pyrococcus,Synechocystis,MbCas4/1,Haloferax,DNA2 and later2026
    sources require further primary review. No family-wide negative or all-member
    characterization is claimed.
  target_ids:
  - PF01930
  evidence_ids:
  - primary
