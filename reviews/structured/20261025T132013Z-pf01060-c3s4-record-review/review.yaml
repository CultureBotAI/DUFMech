  area: representation
  topic: Cycle 3 causal-graph and protein-node grounding verification
  outcome: supported
  summary: 'Cycle 3 Stage 3 (PR #357) grounded the TTR-52 phosphatidylserine lipid-strip
    binding readout node ptdser-strip-binding-signal (''TTR-52 binding signal at the
    PtdSer spot'') to C. elegans TTR-52 (UniProtKB:G5ED35). Stage 4 frozen-inventory
    review verified all causal graphs, grounded nodes, and experimental edges against
