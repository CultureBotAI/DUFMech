summary: PF24183 (DUF7412; InterPro:IPR055835) matches the verified frozen source
  and retains seed_status=UNKNOWN_CANDIDATE, characterization_status=UNSCORED and
  curation_status=SEEDED. DUF7412 is an uncharacterised bacteriophage protein family
  that includes Phage T2. The source says the proteins include a beta-barrel domain,
  without specifying the evidential method, and reports that many members are annotated
  as IP4 internal head protein while the source of evidence for that annotation was
  not found. That provenance caveat belongs to the imported description, not to a
  new literature search by this review. Preserve many rather than all; neither the
  head annotation nor the structural description establishes a demonstrated family-wide
  role. Two AlphaFold entries and zero structures do not resolve those evidence gaps.
