limitations:
- Same-agent review; all8296 records remain the full objective. Graph presence in131
  families is not scientific completion.
- The new graph totals are16/33 for PF01982:29 observed and4 hypothesized relations.
  All four atomic/binding-cycle relations are UNRESOLVED/CONTEXTUAL/HYPOTHESIZED,
  not observed chemistry.
- Figure9G contains a small FMN-labeled signal despite the negative caption. GTP/UTP
  spectra, quantitative detection limits and raw replicate error are not supplied
  in the inspected section.
- Enzyme-minus controls are described in Methods, but Figure9B/C show standards, not
  demonstrated matched reaction blanks. Mg presence is not experimental proof of Mg
  necessity.
- Historical deposited E107 is current Q60365 E103. Archived Q60365 also contains
  the MVKL prefix; it is not established as a vector tag. Coordinate transfer is not
  a new HMM search or authentication of the physical assay insert.
- The dissertation recounts the2007 work and is not independent replication. Different
  source dates do not imply different experiments.
- Failed flavin-only crystallization and static product complexes do not prove binding
  order, conformational causality, proton transfer or dimerization dependence.
- All three predecessor issue keys/targets remain open. Native regulation, the2017
  unit/probe discrepancies and broader member/source coverage remain unresolved.
- An initial overlay check rejected an unquoted comma in a flow-mapping explanation.
  The authoring input was corrected before generation; no validator or generated record
  was bypassed.
- Direct PDF quotation checking found that the ledger count was21 rather than22 words.
  All five anchors matched; the clerical count and evidence hashes were corrected
  and regenerated before saving this review.
- Actual REVIEW history and final post-review generation/validation follow this saved
  observation. No REVIEWED promotion or publication is claimed.
