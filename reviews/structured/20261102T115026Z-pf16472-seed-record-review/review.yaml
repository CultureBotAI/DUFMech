  “This is a beta-propeller domain found in Prolow-density lipoprotein receptor-related
  protein 1 (LRP1) from human, an endocytic receptor involved in endocytosis and in
  phagocytosis of apoptotic cells [[cite:PUB00151931],[cite:PUB00151932]]. LRP1 is
  involved in cellular lipid homeostasis and in the plasma clearance of chylomicron
  remnants and activated LRPAP1 (alpha 2-macroglobulin), as well as the local metabolism
  of complexes between plasminogen activators and their endogenous inhibitors. It
  acts as an LRPAP1 alpha-2-macroglobulin receptor [[cite:PUB00151934],[cite:PUB00151933]].”
