assessments:
- assessment_id: member-identity
  area: identity
  topic: Protein, domain and experimental scope
  outcome: supported
  summary: Q2YS43 exactly matches CAJ43447.1 and independent reconstruction of the
    original AL110477.1 splice coordinates, yielding 327 aa. PF01827 is 144-271 and
    F-box 20-59. Tail-only and partial-domain deletions are distinguished, as is transferred
    segment 254-327. FTR-1 G5EC06 exactly matches CAB54326.1, 314 aa, PF01827 146-283.
    The Methods 318-aa FTR-1 and historical fusion/junction discrepancies remain unresolved.
    No substitution of the shorter FOG-2 isoform or mammalian FOG-2 name collision.
  target_ids:
  - PF01827
  evidence_ids:
  - identity
  - primary
  - germline-genetic-contexts
  - founding-rnai-and-identity
  - target-specificity-and-coverage
- assessment_id: causal-scope
  area: graph
  topic: Directed effects and limits
  outcome: supported
  summary: All eight effects are OBSERVED, EXPERIMENTAL and INDIRECT, with PHENOTYPIC
    scope. Yeast ordinal scores do not become binding affinities, and residual +/-
    or +++ outputs remain explicit. RNAi uses gonad arms, not independent animals,
    as its denominator. The q71 sensitized cross retains phenotype-selected genotyping
    and the definition of Fog including self-fertility. HA-tag suppression is partial
    and is not FOG-2 complementation. Negative TRA-2/OMA-1 readouts and undetected
    FOG-2 RNA cross-linking constrain the model rather than disappearing from the
    record; they are not proof of absolute absence of an effect or interaction.
  target_ids:
