- finding_id: protein-cofactor-entity-conflation
  issue_key: pf02579-protein-cofactor-entity-conflation
  category: representation
  severity: minor
  status: open
  certainty: confirmed
  title: Imported description conflates NIF proteins, FeMo cofactor and dinitrogenase
    context
  description: The first sentence names NIF B, Y and X proteins and describes them
    as iron-molybdenum cofactors in dinitrogenase; the following sentence discusses
    the cofactor at the active site of an alpha2beta2 enzyme. As written, the source
    does not distinguish the protein-family members from the cofactor entity and the
    enzyme whose nitrogen-reduction activity is described. This finding identifies
    the textual entity/role ambiguity. It does not establish incorrect Pfam accession
    grounding or a replacement biochemical function for any NIF protein, and it does
    not justify assigning dinitrogenase catalysis or stoichiometry to PF02579 members.
  target_ids:
  - PF02579
