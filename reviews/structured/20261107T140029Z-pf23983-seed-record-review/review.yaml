summary: PF23983 (P11_C; InterPro:IPR055730) matches the verified frozen source and
  retains seed_status=EX_DUF, characterization_status=UNSCORED and curation_status=SEEDED.
  P11_C, formerly DUF7306, is an EX_DUF conserved C-terminal region of minor capsid
  protein P11 and related phage proteins. The imported description assigns P11 to
  a network below the outer shell, internal to major capsid proteins and outside the
  lipid membrane, and describes capsid-size determination and joining neighbouring
  symmetrons through C-terminal capsomer contacts. These statements retain their P11/regional
  scope; the source citation tokens PUB00154526 and PUB00154516 were not resolved
  to primary papers or treated as independently verified experiments. Largely unstructured
  refers to the described C-terminal regions, not every part of P11. Two structure
  entries and eleven models are counters, not structures inspected here, and EX_DUF
  naming history is distinct from scientific review.
