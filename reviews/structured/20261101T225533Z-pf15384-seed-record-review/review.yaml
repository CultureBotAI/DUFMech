summary: 'PF15384 (PAXX; InterPro:IPR027873) matches the verified frozen source and
  retains seed_status=EX_DUF, characterization_status=UNSCORED and curation_status=SEEDED.
  PAXX (IPR027873), also called C9orf142, retains source-reported XRCC4-superfamily
  membership, direct Ku interaction, DNA-damage-site recruitment and cooperation with
  XRCC4/XLF in double-strand-break repair and survival after damaging agents. These
