summary: 'Eight graphs retain fourteen observed effects, nine direct purified-assay
  effects and five indirect cellular or lysate readouts. Exact reference identity,
  the narrow current Pfam match, substrate and metal context, half-site product limits,
  K224A discordance and later IHF evidence prevent universal biochemical claims. Remaining
  members and contexts need follow-up; retain IN_PROGRESS. Cycle 3 Stage 3 (PR #357)
  grounded node add-cas2 (''Add Cas2 to the Cas1 donor-target reaction in manganese'')
  in cas2-enhancement-in-manganese only to Escherichia coli K-12 Cas1 (UniProtKB:Q46896,
  CAS1_ECOLI) and had omitted partner E. coli K-12 Cas2 (UniProtKB:P45956, CAS2_ECOLI).
  Stage 4 frozen-inventory audit identified an open grounding finding (pf01867-cas2-partner-and-complex-nodes-missing-grounding)
  covering six Cas2 and Cas1-Cas2 complex nodes across four causal graphs (joint-reaction
  and cas2-deletion in cas1-cas2-purified-integration, add-cas2 in cas2-enhancement-in-manganese,
  coexpress-cas1-cas2 in cas1-cas2-cellular-acquisition, and r252e and cas2-recovery
  in cas1-r252e-lysate-coisolation) that had omitted partner Cas2 (UniProtKB:P45956).
  Stage 5 grouped remediation resolved cas2-partner-and-complex-nodes-missing-grounding
  (Issue #363) via native overlay curation, canonical EDIT history, and projection
  regeneration.'
