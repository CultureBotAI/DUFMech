- assessment_id: causal-scope
  area: graph
  topic: Directed effects and limits
  outcome: supported
  summary: Ten DIRECT and six INDIRECT OBSERVED edges describe net biochemical or
    strain-context effects; one UNRESOLVED HYPOTHESIZED edge represents productive
    carrier-to-acceptor transfer. ND products are detection-qualified. The MS edge
    is a detected preparation product, not quantified donor dependence without a blank.
    Reused WT kinetics are not independent replication; two fit summaries are not
    two experiments. C9 overlap extends past the Pfam boundary. DBP1 relocates pdaD;
    chemical rescue is partial and KPS is an independent alternative-enzyme replacement,
    not matched same-gene complementation. Sulfur and pyruvate media, OD and normalized
    CFU, early and later stress cycles remain separate. Figure 6 alt-text ordering
    is contradicted by its plotted curves and Results and is excluded.
