    \  revealed four C(P)XCG motifs, suggesting the presence of two zinc-binding pockets\
    \ (ZBPs). While some\n  members of this entry bind two zinc ions [[cite:PUB00161688]],\
    \ in HVO_2753, only C(P)XCG motifs 2 and\n  4 (comprising Cys-32 to Cys-35 and\
    \ Cys-50 to Cys-53) form a ZBP and bind one zinc atom, while C(P)XCG\n  motifs\
    \ 1 and 3 (comprising Cys-12 to Cys-15 and Cys-39 to Cys-42) form a four-Cys cluster\
    \ that do not\n  bind zinc. The four C(P)XCG motifs are critical for protein stability,\
    \ folding and functionality [[cite:PUB00096940]].\n  Despite structural topology\
    \ resembling eukaryotic eS21, sequence identities in the structurally superimposed\n\
    \  regions are limited, and the archaeal protein contains two zinc knuckles not\
    \ observed in the eukaryotic\n  version [[cite:PUB00114374]]. The widespread conservation\
    \ of this protein in archaeal genomes supports\n  its role as a core ribosomal\
    \ component [[cite:PUB00114374],[cite:PUB00161770]].\n"
