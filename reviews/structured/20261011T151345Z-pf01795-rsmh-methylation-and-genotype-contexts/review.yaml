    dimethyl product, with donor and substrate-state negatives. Cellular rsmH deletion
    loses N4 but retains 2'-O modification. Reporter directions depend on genotype
    and construct; UGA decreases in Figure 4B and Results despite an opposite Discussion
    sentence. At 37 C in LB, single and double deletions lengthen doubling time.
