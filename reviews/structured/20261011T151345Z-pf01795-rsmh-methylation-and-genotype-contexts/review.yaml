assessments:
- assessment_id: member-identity
  area: identity
  topic: Protein, domain and experimental scope
  outcome: supported
  summary: Old P18595 is demerged; K-12 RsmH P60390/b0082/JW0080 has 313 aa and PF01795
    at 5-310. Versioned NP_414624.1 and parental BW25113 WIA74303.1 sequences match
    exactly. ASKA pCA24N N-terminal His-tagged clone and historical cells were not
    independently resequenced. Full-protein assays and gene deletions do not isolate
    the domain. RsmI is a distinct partner enzyme, not an RsmH alias.
