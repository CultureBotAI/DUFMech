    \ proteins\n  to be injected into target cells in a single cell-contact-dependent\
    \ step. TssF one of the core components\n  of T6SSs machinery, has been shown\
    \ to be recruited by TssK into the membrane-associated T6SS complex,\n  contributing\
    \ to the dynamic mechanism of the system [[cite:PUB00136430]]. Furthermore, it\
    \ has been reported\n  to interact with TssG proteins stabilizing each other while\
    \ making contact with TssE, TssK and VgrG\n  as well as with tube and sheath components.\
    \ Bioinformatic analysis suggest that TssF and TssG share\n  similarities with\
