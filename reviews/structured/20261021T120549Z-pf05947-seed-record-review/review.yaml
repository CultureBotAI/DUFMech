    \ experimental\n  studies show that functional TssF and TssK proteins assemble\
    \ into static foci near the cell envelope.\n  Moreover, biochemical and cytological\
    \ approaches provide support to the role of TssE, TssF, TssG, TssK\n  and VgrG\
