assessments:
- assessment_id: member-identity
  area: identity
  topic: Protein, domain and experimental scope
  outcome: supported
  summary: Mouse Q8K0Z7 is294aa with PF01709 134-293; human Q9BSH4 is297aa with PF01709
    136-296. Current InterPro sequences and versioned NP_081622.1/NP_057444.2 match
    their UniProt references exactly. The mouse study explicitly names aa27-294 NP_081622.1,
    and residue checks confirm two N-terminal mutant groups outside PF01709, the K162/Y163/K167
    group and I164 inside. Neither complete historical clones nor exact human exon1
    lesions are independently verified. Historical DUF28 nomenclature is not the current
    whole-protein domain boundary.
  target_ids:
  - PF01709
  evidence_ids:
  - identity
  - primary
  - human-translation-and-profiling
  - newer-mechanism-followups
- assessment_id: causal-scope
  area: graph
  topic: Directed effects and limits
  outcome: supported
  summary: Four DIRECT observed edges are limited to recombinant preparation-to-complex
    formation and group-level binding decreases, not individual atomic contacts or
    isolated-domain sufficiency. Ten INDIRECT observed effects preserve separate mouse
    liver/heart pulses, human KO/rescue COX1/COX3 products and human two-Pro/three-Pro
    five-aa-window occupancies. The latter are normalized footprint bins, not absolute
    rates, with incomplete three-Pro rescue and unaffected PP motifs retained. No
    causal chain silently joins species, RNA-binding assays, initiation claims, collision
    hypotheses or newer structural models. The mammalian frozen transcription wording
    is explicitly qualified in the maintained discussion without changing the source
    snapshot.
  target_ids:
  - PF01709
  evidence_ids:
  - primary
  - native
  - human-translation-and-profiling
  - newer-mechanism-followups
