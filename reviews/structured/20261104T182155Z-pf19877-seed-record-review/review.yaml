summary: 'PF19877 (PerM; InterPro:IPR045931) matches the verified frozen source and
  retains seed_status=EX_DUF, characterization_status=UNSCORED and curation_status=SEEDED.
  The complete imported description for PF19877 (PerM; InterPro:IPR045931) states:
  PerM is an integral membrane protein containing 8-10 transmembrane helices that
  is highly conserved amongst mycobacteria and actinobacteria but absent from other
  bacterial lineages. The protein functions as an essential component of the mycobacterial
  divisome complex, directly interacting with FtsB through conserved hydrophobic residues.
  PerM localises to division septa where it modulates cell wall synthesis, with activity
  critically dependent on magnesium availability. Disruption results in magnesium-dependent
  growth defects, cell elongation, hypersensitivity to beta-lactam antibiotics, and
  severe attenuation during chronic infections. The protein appears to integrate environmental
  stress signals, enabling mycobacteria to regulate cell division in response to host-induced
  stress during persistent infection. The frozen inventory lists 3622 proteins, 3640
  matches, 3589 proteomes, 4293 taxa, 0 structure entries, 2046 AlphaFold models and
  6 domain architectures. These counters do not establish experiments, model quality,
  protein function or external evidence absence. This is frozen source text, not independent
  verification of its scientific claims or citation and relationship tokens. A minor
  provisional provenance follow-up asks which sources, tested proteins and conditions
  support the named PerM-FtsB interaction and magnesium-dependent division and infection-phenotype
  claims; no biological mechanism or source error is established.'
