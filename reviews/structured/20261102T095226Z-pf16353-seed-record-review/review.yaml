    pointers; no paper, structure or exact domain coordinates were inspected. Four
    excess matches over 9741 proteins and 163 architectures do not locate repeats
    or justify splitting. The 107 structures and 5882 models remain uninspected counters.
    EX_DUF and the previous-unknown-name reason do not independently establish historical
    naming or experimental characterization.
