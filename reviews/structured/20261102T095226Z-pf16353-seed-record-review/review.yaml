    domain number does not mean four copies or catalytic stoichiometry. Neither whole-protein
    enzyme naming nor the fold description establishes isolated-domain catalysis,
    a tested substrate range or universal function. PUB00004183 and the literal Rutkiewicz-Krotewicz
