- assessment_id: causal-scope
  area: graph
  topic: Directed effects and limits
  outcome: supported
  summary: Joint requirements do not become independent sufficient causes. Fluorescence
    and nucleotide outputs remain distinct from elementary chemistry, and the modeled
    adenylate never becomes an observed intermediate. Yeast/human rescue, deletion
    labeling,-1 reporter output,distal-construct drug response and EFT2-dependent
    doubling time retain their different backgrounds/readouts. Independent double-mutant
    clones are not independent single substitutions. C-terminal truncation/internal
    deletion do not demonstrate isolated N-domain sufficiency. Source conflicts and
    assay-specific negative findings remain visible. Co-IP,docking and cofitness are
    not causal mechanism edges.
  target_ids:
