- assessment_id: claim-scope
  area: scope
  topic: Family, domain and tested-protein boundaries
  outcome: supported
  summary: Metadata-only source and captured-context review. Preserve EX_DUF RACo_C_ter
    and the entry-specific C-terminal ATP-binding domain of the RACo exemplar Q3ACS2.
    The imported structure divides RACo into N-terminal residues 3 to 94 with the
    PF00111 [2Fe-2S]-binding region, linker 95 to 125, middle 126 to 206, and C-terminal
    207 to 630. Those exemplar boundaries are not universal; the iron-sulfur site
    belongs to a different region, not this C-terminal domain. Retain the reported
    ASKHA beta-beta-beta-alpha-beta-alpha-beta-alpha topology and ATP-binding site
    without transferring all superfamily phosphoryl-transfer or ATP-hydrolysis activities
    to the isolated domain. General conserved Asp/Asn/Glu/Gln interactions with ATP
    phosphates and Mg2+ do not identify numbered catalytic residues, kinetic parameters
    or energy coupling for every member. Q3ACS2, two structures and 2089 models were
    not inspected; 25 excess matches and 28 architectures remain metadata.
  target_ids:
  - PF14574
  evidence_ids:
  - record
  - snapshot
