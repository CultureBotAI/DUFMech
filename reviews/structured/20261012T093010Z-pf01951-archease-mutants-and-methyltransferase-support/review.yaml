  outcome: supported
  summary: E8A's ATP effect is not assigned to GTP; F204A RtcB rescue is GTP-specific.
    D95A RtcB recovers RNA-ppG but not ligation. Other negative rescue conditions
    remain explicit. S5 is purity rather than folding evidence. PAB1946 changes tRNA
    fragment methylation, suppresses poly(C) methyl incorporation, raises apparent
    RNA Kd and reduces aggregation at70 C or4 C in separate assays. None is connected
    into an unmeasured mediation chain or assigned PAB1947 catalytic chemistry. Binding
    rows retain source labels despite conflicting fragment lengths, and the0.5-versus1
    nM RNA discrepancy is not silently repaired. PAB1946 figures are not claimed visually
    inspected. Prior17 edges, stable IDs and ledgers are preserved.
