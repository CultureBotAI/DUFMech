summary: 'PF19929 (CdiI_5; InterPro:IPR045657) matches the verified frozen source
  and retains seed_status=EX_DUF, characterization_status=UNSCORED and curation_status=SEEDED.
  The complete imported description for PF19929 (CdiI_5; InterPro:IPR045657) states:
  This family includes immunity protein CdiI from Erwinia chrysanthemi and related
  sequences, predominantly from gammaproteobacteria. It is an immunity protein component
  of a toxin-immunity protein module, which functions as a cellular contact-dependent
  growth inhibition (CDI) system. CDI modules allow bacteria to communicate with and
  inhibit the growth of closely related neighbouring bacteria in a contact-dependent
  fashion. It protects cells against the DNase activity of CdiA, its cognate toxin
  protein, but not against non-cognate CdiA from E.coli strain 536/UPEC. Immunity
  protein CdiI is species-specific [[cite:PUB00057480]]. The frozen inventory lists
  579 proteins, 580 matches, 344 proteomes, 850 taxa, 0 structure entries, 368 AlphaFold
  models and 9 domain architectures. These are frozen inventory counts, not reviewed
  assays, model-quality measurements or proof of external evidence absence. Source
  text and citation tokens were inspected for representation and scope; their scientific
  claims were not independently verified. A minor provisional provenance follow-up
  asks which tested CdiI protein and cognate/non-cognate toxin comparison support
  the imported species-specific immunity statement; no source falsity or family-wide
  activity is established.'
