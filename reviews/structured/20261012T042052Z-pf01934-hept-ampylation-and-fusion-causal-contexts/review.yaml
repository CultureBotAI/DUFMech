- assessment_id: member-identity
  area: identity
  topic: Protein, domain and experimental scope
  outcome: supported
  summary: Frozen HepT-like/IPR008201/EX_DUF identity remains unchanged; DUF86 is
    verified in primary text. Q8ECH6v1 matches12-130 of133aa and I3ZRF2v1 matches12-107
    of110aa. TableS3 identifies fusion WP_164925653.1 (276aa); structured sequence
    comparison proves positions26-276 equal Q8EGZ7v1 positions2-252 exactly, with
    WP L25 versus UniProt M1 and a24-residue prefix. Q8EGZ7 PF01934 144-234 projects
    to WP168-258; this is not a fresh HMM result. Fusion C163/C270 flank that core,
    while D41/D43 belong to the other NTase domain. Q5ZRG2 maps PF08780 and is excluded.
    W3-18-1 mapping and source-numbering issues remain open.
