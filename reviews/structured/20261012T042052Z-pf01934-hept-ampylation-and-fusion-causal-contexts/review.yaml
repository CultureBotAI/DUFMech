- assessment_id: causal-scope
  area: graph
  topic: Directed effects and limits
  outcome: supported
  summary: RNA cleavage, joint AMP-transfer chemistry, modified-preparation activity,
    host-specific CFU and variant/gel-state effects are explicitly separated. Binding
    alone is not declared sufficient inhibition. The fusion is not SO_3166; neither
    NTase chemistry nor flank cysteine effects are attributed to the isolated PF01934
    core. Reducing preparation differs from an acute DTT titration. Gel states and
    peroxide colony phenotypes do not prove a complete intracellular disulfide-mediated
    causal chain. No hypothetical ATP sensor, native proteolytic activation or antiviral
    role is promoted to an observed edge.
