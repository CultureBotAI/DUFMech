- finding_id: pf01174-pdxst-partner-and-acivicin-nodes-missing-grounding
  status: open
  summary: 'Four Bacillus subtilis 168 (NCBITaxon:224308) causal graphs in curation/families/PF01174.yaml
    (pdxst-glutamine-dependent-plp-product node joint-pdxst-glutamine-carbohydrate-reaction, pdxt-ribulose-ammonium-dependent-synthase-readout
    node add-yaae-ribulose-ammonium, pdxt-acivicin-glutaminase-inhibition nodes acivicin-pretreat-glutaminase-mixture
    and acivicin-assay-glutaminase-readout, and pdxst-acivicin-plp-signal-inhibition nodes acivicin-pretreat-plp-mixture
    and residual-glutamine-plp-signal) omit verified partner YaaD/PdxS (UniProtKB:P37527) and/or YaaE/PdxT
    (UniProtKB:P37528) grounding (evidence: curation/families/PF01174.yaml lines 47-176; reviews/structured/20261025T132021Z-pf01174-c3s4-record-review/review.yaml).'
  disposition: Carried forward to Stage 5 (resolve_review_findings) for grouped remediation.
- finding_id: pf01680-joint-pdx1-pdx2-nodes-missing-partner-grounding
  status: open
  summary: 'Four Bacillus subtilis 168 (NCBITaxon:224308) causal graphs in curation/families/PF01680.yaml
    (pdxs-partner-glutaminase-readout node add-pdxs-to-pdxt-glutamine, pdxs-ribulose-partner-effect node
